[package]
name = "dynamo-sidecar-testkit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "CPU-only test infrastructure for Dynamo sidecars"
publish = false

[features]
process-tests = []
native-tests = []

[[test]]
name = "cross_process"
required-features = ["process-tests"]

[[test]]
name = "native_engine"
required-features = ["native-tests"]

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
dynamo-backend-common = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
dynamo-backend-common = { workspace = true, features = ["testing"] }
dynamo-mocker = { workspace = true }
dynamo-vllm-mocker = { path = "../../mocker/servers/vllm" }
dynamo-sglang-mocker = { path = "../../mocker/servers/sglang" }
dynamo-vllm-sidecar = { path = "../vllm" }
dynamo-sglang-sidecar = { path = "../sglang" }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }
tonic-v14 = { workspace = true }
tonic-health-v14 = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
dynamo-runtime = { workspace = true }
dynamo-llm = { path = "../../llm", default-features = false }
tempfile = { workspace = true }
tokio-util = { workspace = true }
libc = { workspace = true }
prost-types-v14 = { workspace = true }
