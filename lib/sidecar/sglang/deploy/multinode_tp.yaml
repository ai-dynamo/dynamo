# EXPERIMENTAL: multinode SGLang tensor parallelism (TP) with explicit leader and worker templates.
# For a DGD created before operator 1.6.0, see docs/fern/pages/kubernetes/installation/multinode-orchestration.md#use-the-variables-in-a-dgd-created-before-160.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-sidecar-multinode-tp
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: <your-registry>/dynamo-frontend:1.6.0
          env:
          - name: DYN_ROUTER_MODE
            value: kv
  - name: SGLangWorker
    type: worker
    replicas: 2
    multinode:
      nodeCount: 2
    roles:
    - name: leader
      podTemplate:
        spec:
          initContainers:
          - name: runtime
            image: <your-registry>/dynamo-sidecar:1.6.0
            command:
            - dynamo-sglang-sidecar
            args:
            - --grpc-endpoint
            - 127.0.0.1:30001
            restartPolicy: Always
            envFrom:
            - secretRef:
                name: hf-token-secret
                optional: true
          containers:
          - name: main
            image: lmsysorg/sglang:v0.5.23
            startupProbe:
              exec:
                command:
                - python3
                - -c
                - import grpc; r=grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3); raise SystemExit(0 if r == b'\x08\x01' else 1)
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 180
            readinessProbe:
              exec:
                command:
                - python3
                - -c
                - import grpc; r=grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3); raise SystemExit(0 if r == b'\x08\x01' else 1)
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 3
            livenessProbe:
              exec:
                command:
                - python3
                - -c
                - import grpc; r=grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3); raise SystemExit(0 if r == b'\x08\x01' else 1)
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
            envFrom:
            - secretRef:
                name: hf-token-secret
                optional: true
            resources:
              limits:
                nvidia.com/gpu: '1'
              requests:
                ephemeral-storage: 2Gi
            command:
            - python3
            - -m
            - sglang.launch_server
            args:
            - --model-path
            - Qwen/Qwen3-0.6B
            - --host
            - 0.0.0.0
            - --port
            - '30000'
            - --grpc-port
            - '30001'
            - --incremental-streaming-output
            - --page-size
            - '16'
            - --kv-events-config
            - '{"publisher":"zmq","endpoint":"tcp://*:5557","topic":""}'
            - --tp-size
            - '2'
            - --nnodes
            - '2'
            - --node-rank
            - $(DYNAMO_RANK)
            - --dist-init-addr
            - $(DYNAMO_LEADER_ADDRESS):29500
    - name: worker
      podTemplate:
        spec:
          containers:
          - name: main
            image: lmsysorg/sglang:v0.5.23
            envFrom:
            - secretRef:
                name: hf-token-secret
                optional: true
            resources:
              limits:
                nvidia.com/gpu: '1'
              requests:
                ephemeral-storage: 2Gi
            command:
            - python3
            - -m
            - sglang.launch_server
            args:
            - --model-path
            - Qwen/Qwen3-0.6B
            - --host
            - 0.0.0.0
            - --port
            - '30000'
            - --grpc-port
            - '30001'
            - --incremental-streaming-output
            - --page-size
            - '16'
            - --kv-events-config
            - '{"publisher":"zmq","endpoint":"tcp://*:5557","topic":""}'
            - --tp-size
            - '2'
            - --nnodes
            - '2'
            - --node-rank
            - $(DYNAMO_RANK)
            - --dist-init-addr
            - $(DYNAMO_LEADER_ADDRESS):29500
  backendFramework: sglang
