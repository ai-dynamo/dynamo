#
# EXPERIMENTAL: engine-primary disaggregated SGLang with the Dynamo native sidecar
#
# Prefill and decode run as separate worker pods, each with two containers:
#   - main: stock SGLang image in --disaggregation-mode prefill|decode with the
#     NIXL backend; holds one GPU. KV moves prefill -> decode over NIXL/RDMA.
#   - runtime: Dynamo worker (dynamo-sglang-sidecar), no GPU; runs as a
#     restartable init container and auto-discovers its role from the engine.
#
# Unlike aggregated, the engine binds 0.0.0.0 so its bootstrap server (8998) is
# reachable across pods; the decode worker dials the prefill worker's advertised
# bootstrap (SGLANG_DISAGGREGATION_BOOTSTRAP_HOST = pod IP). SGLang's single
# --host binds ALL listeners, so the unauthenticated native gRPC (30001) is also
# exposed on the pod network — rely on NetworkPolicy, not loopback isolation.
#
# PREREQUISITES / CAVEATS:
#   - RDMA/NIXL: engines need rdma/ib devices, IPC_LOCK, and shared memory; tune
#     for your fabric (UCX_NET_DEVICES etc.). The SGLang image must include
#     NIXL/UCX support.
#   - Model / served-model-name / TP must match between prefill and decode.
#   - Set the runtime image to a sidecar image built from lib/sidecar/Dockerfile.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-sidecar-disagg
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.3.0

  - name: SGLangPrefillWorker
    type: worker
    replicas: 1
    podTemplate:
      spec:
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 10Gi
        initContainers:
        - name: runtime
          image: <your-registry>/dynamo-sidecar:1.6.0
          command:
          - dynamo-sglang-sidecar
          args:
          - --grpc-endpoint
          - 127.0.0.1:30001
          restartPolicy: Always
          env:
          # Advertise this pod's IP as the bootstrap host decode workers dial.
          - name: SGLANG_DISAGGREGATION_BOOTSTRAP_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          envFrom:
          - secretRef:
              name: hf-token-secret
        containers:
        - name: main
          image: lmsysorg/sglang:v0.5.21
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          # Real gRPC HealthCheck (see agg.yaml). startupProbe gates the engine;
          # readinessProbe drops it if the engine becomes unhealthy.
          startupProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3)
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3)
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
            requests:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
              ephemeral-storage: 2Gi
          volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          command:
          - python3
          - -m
          - sglang.launch_server
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --host
          - 0.0.0.0
          - --port
          - "30000"
          - --grpc-port
          - "30001"
          - --incremental-streaming-output
          - --disaggregation-mode
          - prefill
          - --disaggregation-bootstrap-port
          - "8998"
          - --disaggregation-transfer-backend
          - nixl

  - name: SGLangDecodeWorker
    type: worker
    replicas: 1
    podTemplate:
      spec:
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 10Gi
        initContainers:
        - name: runtime
          image: <your-registry>/dynamo-sidecar:1.6.0
          command:
          - dynamo-sglang-sidecar
          args:
          - --grpc-endpoint
          - 127.0.0.1:30001
          restartPolicy: Always
          envFrom:
          - secretRef:
              name: hf-token-secret
        containers:
        - name: main
          image: lmsysorg/sglang:v0.5.21
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          # Real gRPC HealthCheck (see agg.yaml). startupProbe gates the engine;
          # readinessProbe drops it if the engine becomes unhealthy.
          startupProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3)
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3)
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
            requests:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
              ephemeral-storage: 2Gi
          volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          command:
          - python3
          - -m
          - sglang.launch_server
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --host
          - 0.0.0.0
          - --port
          - "30000"
          - --grpc-port
          - "30001"
          - --incremental-streaming-output
          - --disaggregation-mode
          - decode
          - --disaggregation-bootstrap-port
          - "8998"
          - --disaggregation-transfer-backend
          - nixl
  backendFramework: sglang
