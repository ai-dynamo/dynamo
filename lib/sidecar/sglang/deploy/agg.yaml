#
# EXPERIMENTAL: engine-primary SGLang with the Dynamo native sidecar
#
# Worker pod = two containers:
#   - main: stock SGLang image, holds the GPU, and serves native gRPC on
#     127.0.0.1:30001.
#   - runtime: Dynamo worker (dynamo-sglang-sidecar), no GPU; runs as a
#     restartable init container and talks to the engine over loopback.
#
# The engine's gRPC has no auth/TLS; safe only because it stays on loopback.
#
# SGLang can also load the sidecar in-process (`--sidecar dynamo.sglang.sidecar`);
# this example uses the standalone image for consistency with the
# TensorRT-LLM and vLLM sidecars.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-sidecar-agg
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        # Dynamo frontend; operator adds the command.
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.3.0
  - name: SGLangWorker
    type: worker
    replicas: 1
    podTemplate:
      spec:
        # The reserved `runtime` init container activates Dynamo sidecar mode.
        # It starts before `main`, stops after it, and receives Dynamo runtime
        # defaults, discovery configuration, and probes from the operator.
        initContainers:
        - name: runtime
          image: <your-registry>/dynamo-sidecar:1.6.0
          command:
          - dynamo-sglang-sidecar
          args:
          - --grpc-endpoint
          - 127.0.0.1:30001
          restartPolicy: Always
          envFrom:
          - secretRef:
              name: hf-token-secret
        containers:
        # Engine must be named `main`; it owns the GPU and model lifecycle.
        - name: main
          image: lmsysorg/sglang:v0.5.21
          # Native gRPC `--grpc-port` needs SGLang v0.5.16+.
          startupProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3)
            periodSeconds: 5
            timeoutSeconds: 10     # must exceed the RPC timeout + interpreter spawn
            failureThreshold: 60   # ~5 min for model load; raise for big models
          readinessProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3)
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3)
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              # Increase for larger models.
              ephemeral-storage: 2Gi
          command:
          - python3
          - -m
          - sglang.launch_server
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --host
          - 127.0.0.1
          - --port
          - "30000"
          - --grpc-port
          - "30001"
          - --incremental-streaming-output
  backendFramework: sglang
