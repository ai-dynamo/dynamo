#
# EXPERIMENTAL. Disaggregated SGLang sidecars behind Dynamo's KV-aware router.
#
# This deploys two prefill and two decode worker pods. Each pod colocates the
# Rust sidecar with a stock SGLang engine. All engines publish KV-cache events
# over ZMQ, matching the local SGLang disaggregated KV-router launcher. KV cache
# moves from prefill to decode over NIXL/RDMA.
#
# SGLang binds 0.0.0.0 so its bootstrap server is reachable across pods. The
# native gRPC service is therefore also exposed on the pod network; restrict it
# with NetworkPolicy. ZMQ publishers bind all pod interfaces, and each sidecar
# connects over its pod IP so GetServerInfo's wildcard becomes routable.
#
# PREREQUISITES / CAVEATS:
#   - RDMA/NIXL: engines need rdma/ib devices, IPC_LOCK, and shared memory; tune
#     UCX for your fabric.
#   - Model, served model name, page size, and TP must match across both roles.
#   - No published sidecar image yet; build lib/sidecar/Dockerfile and set
#     <your-registry> below.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-sidecar-disagg-kv-router
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.3.0
          env:
          - name: DYN_ROUTER_MODE
            value: kv

  - name: SGLangPrefillWorker
    type: worker
    replicas: 2
    podTemplate:
      spec:
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 10Gi
        initContainers:
        - name: sglang-engine
          image: lmsysorg/sglang:v0.5.18
          restartPolicy: Always
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          startupProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3)
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3)
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
            requests:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
              ephemeral-storage: 2Gi
          volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          command:
          - python3
          - -m
          - sglang.launch_server
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --host
          - 0.0.0.0
          - --port
          - "30000"
          - --grpc-port
          - "30001"
          - --incremental-streaming-output
          - --disaggregation-mode
          - prefill
          - --disaggregation-bootstrap-port
          - "8998"
          - --disaggregation-transfer-backend
          - nixl
          - --page-size
          - "64"
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
        containers:
        - name: main
          image: <your-registry>/dynamo-sidecar:1.3.0
          command:
          - dynamo-sglang-sidecar
          args:
          - --grpc-endpoint
          - $(POD_IP):30001
          env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: SGLANG_DISAGGREGATION_BOOTSTRAP_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          envFrom:
          - secretRef:
              name: hf-token-secret

  - name: SGLangDecodeWorker
    type: worker
    replicas: 2
    podTemplate:
      spec:
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 10Gi
        initContainers:
        - name: sglang-engine
          image: lmsysorg/sglang:v0.5.18
          restartPolicy: Always
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          startupProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3)
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3)
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
            requests:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
              ephemeral-storage: 2Gi
          volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          command:
          - python3
          - -m
          - sglang.launch_server
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --host
          - 0.0.0.0
          - --port
          - "30000"
          - --grpc-port
          - "30001"
          - --incremental-streaming-output
          - --disaggregation-mode
          - decode
          - --disaggregation-bootstrap-port
          - "8998"
          - --disaggregation-transfer-backend
          - nixl
          - --page-size
          - "64"
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
        containers:
        - name: main
          image: <your-registry>/dynamo-sidecar:1.3.0
          command:
          - dynamo-sglang-sidecar
          args:
          - --grpc-endpoint
          - $(POD_IP):30001
          env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          envFrom:
          - secretRef:
              name: hf-token-secret
