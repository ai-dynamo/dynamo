# EXPERIMENTAL: engine-primary disaggregated SGLang with KV-aware routing

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-sidecar-disagg-kv-router
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: <your-registry>/dynamo-frontend:1.6.0
          env:
          - name: DYN_ROUTER_MODE
            value: kv

  - name: SGLangPrefillWorker
    type: prefill
    replicas: 2
    sharedMemorySize: 10Gi
    podTemplate:
      spec:
        initContainers:
        - name: runtime
          image: <your-registry>/dynamo-sidecar:1.6.0
          command:
          - dynamo-sglang-sidecar
          args:
          - --grpc-endpoint
          - 127.0.0.1:30001
          restartPolicy: Always
          envFrom:
          - secretRef:
              name: hf-token-secret
              optional: true
        containers:
        - name: main
          image: lmsysorg/sglang:v0.5.22
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          # All probes pass only for HealthCheckResponse.healthy=true;
          # its raw protobuf encoding is 0x08 0x01.
          startupProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; r=grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3); raise SystemExit(0 if r == b'\x08\x01' else 1)
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; r=grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3); raise SystemExit(0 if r == b'\x08\x01' else 1)
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; r=grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3); raise SystemExit(0 if r == b'\x08\x01' else 1)
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          envFrom:
          - secretRef:
              name: hf-token-secret
              optional: true
          resources:
            limits:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
            requests:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
              ephemeral-storage: 2Gi
          command:
          - python3
          - -m
          - sglang.launch_server
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --host
          - 0.0.0.0
          - --port
          - "30000"
          - --grpc-port
          - "30001"
          - --incremental-streaming-output
          - --disaggregation-mode
          - prefill
          - --disaggregation-bootstrap-port
          - "8998"
          - --disaggregation-transfer-backend
          - nixl
          - --page-size
          - "64"
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'

  - name: SGLangDecodeWorker
    type: decode
    replicas: 2
    sharedMemorySize: 10Gi
    podTemplate:
      spec:
        initContainers:
        - name: runtime
          image: <your-registry>/dynamo-sidecar:1.6.0
          command:
          - dynamo-sglang-sidecar
          args:
          - --grpc-endpoint
          - 127.0.0.1:30001
          restartPolicy: Always
          envFrom:
          - secretRef:
              name: hf-token-secret
              optional: true
        containers:
        - name: main
          image: lmsysorg/sglang:v0.5.22
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          startupProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; r=grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3); raise SystemExit(0 if r == b'\x08\x01' else 1)
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; r=grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3); raise SystemExit(0 if r == b'\x08\x01' else 1)
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; r=grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3); raise SystemExit(0 if r == b'\x08\x01' else 1)
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          envFrom:
          - secretRef:
              name: hf-token-secret
              optional: true
          resources:
            limits:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
            requests:
              nvidia.com/gpu: "1"
              rdma/ib: "1"
              ephemeral-storage: 2Gi
          command:
          - python3
          - -m
          - sglang.launch_server
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --host
          - 0.0.0.0
          - --port
          - "30000"
          - --grpc-port
          - "30001"
          - --incremental-streaming-output
          - --disaggregation-mode
          - decode
          - --disaggregation-bootstrap-port
          - "8998"
          - --disaggregation-transfer-backend
          - nixl
          - --page-size
          - "64"
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
  backendFramework: sglang
