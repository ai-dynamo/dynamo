#
# EXPERIMENTAL: engine-primary aggregated SGLang behind Dynamo's KV-aware router
#
# This deploys two worker pods. Each pod colocates:
#   - main: the stock SGLang image. It holds one GPU and publishes KV-cache
#     events over ZMQ for exact KV-aware routing.
#   - runtime: the restartable Dynamo init sidecar, which discovers the engine's
#     KV-event source over gRPC and registers it with Dynamo.
#
# SGLang binds its unauthenticated gRPC and ZMQ listeners on the pod network.
# The sidecar connects over the downward-API pod IP so it can replace the ZMQ
# wildcard with that routable address. Restrict both ports with NetworkPolicy.
#
# Set the runtime image below to a sidecar image built from
# lib/sidecar/Dockerfile.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-sidecar-agg-kv-router
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.3.0
          env:
          - name: DYN_ROUTER_MODE
            value: kv
  - name: SGLangWorker
    type: worker
    replicas: 2
    podTemplate:
      spec:
        # Every replica can use the same ports because each engine runs in a
        # separate pod network namespace.
        initContainers:
        - name: runtime
          image: <your-registry>/dynamo-sidecar:1.6.0
          command:
          - dynamo-sglang-sidecar
          args:
          - --grpc-endpoint
          - $(POD_IP):30001
          restartPolicy: Always
          env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          envFrom:
          - secretRef:
              name: hf-token-secret
        containers:
        - name: main
          image: lmsysorg/sglang:v0.5.21
          startupProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3)
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3)
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
              - python3
              - -c
              # HealthCheckResponse has one bool field: healthy=true encodes as
              # 0x08 0x01. Fail when the RPC succeeds but reports unhealthy.
              - import grpc; r=grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3); raise SystemExit(0 if r == b'\x08\x01' else 1)
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              ephemeral-storage: 2Gi
          command:
          - python3
          - -m
          - sglang.launch_server
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --host
          - 0.0.0.0
          - --port
          - "30000"
          - --grpc-port
          - "30001"
          - --incremental-streaming-output
          - --page-size
          - "16"
          - --kv-events-config
          - '{"publisher":"zmq","endpoint":"tcp://*:5557","topic":""}'
  backendFramework: sglang
