[package]
name = "dynamo-openengine-sidecar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Engine-neutral Dynamo backend for out-of-process OpenEngine servers."
build = "build.rs"

[package.metadata.openengine]
commit = "57cd5033554cd22ab9645ae6c17f34d7fa9f5bb0"

[[bin]]
name = "dynamo-openengine-sidecar"
path = "src/main.rs"

[dependencies]
dynamo-backend-common = { workspace = true }
dynamo-kv-router = { workspace = true }
dynamo-llm = { workspace = true, features = ["mm-routing"] }
dynamo-protocols = { workspace = true }
dynamo-runtime = { workspace = true }

anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
futures = { workspace = true }
parking_lot = { workspace = true }
prost = "0.14.4"
prost-types = "0.14.4"
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
dynamo-backend-common = { workspace = true, features = ["testing"] }
tokio-stream = { workspace = true, features = ["net"] }
