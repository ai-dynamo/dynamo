[package]
name = "dynamo-speech-nim-sidecar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Dynamo ASR and TTS sidecar for the Speech NIM gRPC API"

[package.metadata.cargo-machete]
# Referenced by protobuf code generated into OUT_DIR.
ignored = ["prost"]

[dependencies]
dynamo-backend-common = { workspace = true }
dynamo-llm = { workspace = true }
dynamo-runtime = { workspace = true }
dynamo-sidecar-common = { workspace = true }

anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
dynamo-backend-common = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true, features = ["net"] }
