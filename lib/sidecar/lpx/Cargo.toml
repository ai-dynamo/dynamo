[package]
name = "dynamo-lpx-sidecar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Dynamo LPX sidecar for an out-of-process engine exposed through its OpenEngine gRPC service."

[package.metadata.cargo-machete]
# Referenced by protobuf code generated into OUT_DIR.
ignored = ["prost"]

[[bin]]
name = "dynamo-lpx-sidecar"
path = "src/main.rs"

[dependencies]
dynamo-backend-common = { workspace = true }
# `logging::inject_trace_headers_into_map` for the W3C trace metadata and the
# system server settings a standby rank answers its probes on.
dynamo-runtime = { workspace = true }
dynamo-sidecar-common = { workspace = true }
# Generated `openengine.v1` types; see `src/lib.rs`. The Mocker server
# (`lib/mocker/servers/trtllm`) reuses them the same way.
dynamo-trtllm-sidecar = { path = "../trtllm" }

anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
# Not a workspace dependency; the version lib/llm uses.
base64 = { version = "0.22" }
clap = { version = "4", features = ["derive", "env"] }
futures = { workspace = true }
prost = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Not a workspace dependency; the version lib/runtime uses. The topology
# socket probes whether a process still serves it without blocking.
socket2 = { version = "0.5.8" }
tokio = { workspace = true }
# `net`: the topology consumer serves its local API on a Unix socket.
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
dynamo-backend-common = { workspace = true, features = ["testing"] }
prost-types = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
