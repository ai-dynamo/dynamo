[package]
name = "dynamo-lpx-sidecar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Dynamo sidecar for an LPX engine's OpenEngine gRPC server (hybrid: aggregated or disaggregated decode; LPU-only: aggregated)."

[[bin]]
name = "dynamo-lpx-sidecar"
path = "src/main.rs"

[dependencies]
dynamo-backend-common = { workspace = true }
# `logging::inject_trace_headers_into_map` for the W3C trace metadata, the
# system server settings a standby rank answers its probes on, and
# `system_health::RuntimeReadinessGate` for readiness that follows the engine.
dynamo-runtime = { workspace = true }
dynamo-sidecar-common = { workspace = true }
# Generated `openengine.v1` types; see `src/lib.rs`. The Mocker server
# (`lib/mocker/servers/trtllm`) reuses them the same way.
dynamo-trtllm-sidecar = { path = "../trtllm" }

anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
futures = { workspace = true }
prost-types = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
dynamo-backend-common = { workspace = true, features = ["testing"] }
dynamo-mocker = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tracing-subscriber = { workspace = true }
