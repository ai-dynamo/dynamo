#
# EXPERIMENTAL: engine-primary vLLM with the Dynamo native sidecar (DEP #14657).
# Requires an operator with v1beta1 dynamoSidecar support. Build the Dynamo image
# from lib/sidecar/Dockerfile and replace <your-registry> before applying.
#
# main owns the GPU and engine. The operator injects Dynamo configuration into
# initContainers[name=dynamo]. Native gRPC probes check aggregate engine health
# (both vllm.Control and vllm.Inference) on port 50051 with an empty service name.
# The engine listens on 0.0.0.0 for kubelet probes to the pod IP; the sidecar uses
# loopback. Keep the unauthenticated engine endpoint on a trusted pod network.
#
# Requires the early HTTP/probe behavior from https://github.com/ai-dynamo/dynamo/pull/15051.
# The operator injects startup/liveness on /live and readiness on /health.
# Sidecar probes are independent of engine loading; engine gRPC probes gate pod
# readiness. Raise only the engine startup budget for larger models.
# Engine restart recovery remains deferred to DEP #14897.
#
# NIXL/RDMA resources, capabilities, and UCX settings must match your cluster.
# VLLM_NIXL_SIDE_CHANNEL_HOST advertises the pod IP for engine-to-engine KV transfer.
# The default router exercises prefill/decode handoff; KV routing is separate.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-sidecar-disagg
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.3.0
  - name: prefill
    type: prefill
    dynamoSidecar: dynamo
    replicas: 1
    podTemplate:
      spec:
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 10Gi
        initContainers:
        - name: dynamo
          image: <your-registry>/dynamo-sidecar:1.6.0
          command:
          - dynamo-vllm-sidecar
          args:
          - --grpc-endpoint
          - 127.0.0.1:50051
          - --disaggregation-mode
          - prefill
          envFrom:
          - secretRef:
              name: hf-token-secret
          restartPolicy: Always
        containers:
        - name: main
          image: vllm/vllm-openai:v0.28.0
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          startupProbe:
            grpc:
              port: 50051
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: UCX_TLS
            value: rc_x,rc,cuda_copy,cuda_ipc
          - name: UCX_NET_DEVICES
            value: mlx5_0:1
          - name: UCX_IB_ADDR_TYPE
            value: eth
          - name: UCX_RNDV_SCHEME
            value: get_zcopy
          - name: UCX_RNDV_THRESH
            value: '0'
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: '1'
              rdma/ib: '1'
            requests:
              nvidia.com/gpu: '1'
              rdma/ib: '1'
              ephemeral-storage: 2Gi
          volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          command:
          - /bin/sh
          - -c
          args:
          - |
            VLLM_RS="$(python3 -c 'import os,vllm; print(os.path.join(os.path.dirname(vllm.__file__), "vllm-rs"))')"
            ulimit -l unlimited && exec "$VLLM_RS" serve Qwen/Qwen3-0.6B \
              --host 0.0.0.0 --grpc-port 50051 \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
  - name: decode
    type: decode
    dynamoSidecar: dynamo
    replicas: 1
    podTemplate:
      spec:
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 10Gi
        initContainers:
        - name: dynamo
          image: <your-registry>/dynamo-sidecar:1.6.0
          command:
          - dynamo-vllm-sidecar
          args:
          - --grpc-endpoint
          - 127.0.0.1:50051
          - --disaggregation-mode
          - decode
          envFrom:
          - secretRef:
              name: hf-token-secret
          restartPolicy: Always
        containers:
        - name: main
          image: vllm/vllm-openai:v0.28.0
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          startupProbe:
            grpc:
              port: 50051
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: UCX_TLS
            value: rc_x,rc,cuda_copy,cuda_ipc
          - name: UCX_NET_DEVICES
            value: mlx5_0:1
          - name: UCX_IB_ADDR_TYPE
            value: eth
          - name: UCX_RNDV_SCHEME
            value: get_zcopy
          - name: UCX_RNDV_THRESH
            value: '0'
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: '1'
              rdma/ib: '1'
            requests:
              nvidia.com/gpu: '1'
              rdma/ib: '1'
              ephemeral-storage: 2Gi
          volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          command:
          - /bin/sh
          - -c
          args:
          - |
            VLLM_RS="$(python3 -c 'import os,vllm; print(os.path.join(os.path.dirname(vllm.__file__), "vllm-rs"))')"
            ulimit -l unlimited && exec "$VLLM_RS" serve Qwen/Qwen3-0.6B \
              --host 0.0.0.0 --grpc-port 50051 \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
  backendFramework: vllm
