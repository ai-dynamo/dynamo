#
# EXPERIMENTAL: engine-primary vLLM with the Dynamo native sidecar (DEP #14657).
# Requires an operator with v1beta1 dynamoSidecar support. Build the Dynamo image
# from lib/sidecar/Dockerfile and replace <your-registry> before applying.
#
# main owns the GPU and engine. The operator injects Dynamo configuration into
# initContainers[name=dynamo]. The unauthenticated engine gRPC stays on loopback;
# exec probes check SERVING for both vllm.Control and vllm.Inference.
# The setup init downloads a pinned, checksum-verified grpc_health_probe binary.
#
# TEMPORARY until DEP #14897: the current sidecar waits for engine metadata before
# starting its HTTP listener. A process-only startup probe lets main start, and
# delayed liveness allows model loading. Readiness still checks /health. Raise
# both the engine startup budget and sidecar liveness delay for larger models.
# These overrides validate injection and serving, not independent lifecycle recovery.
#
# NIXL/RDMA resources, capabilities, and UCX settings must match your cluster.
# VLLM_NIXL_SIDE_CHANNEL_HOST advertises the pod IP for engine-to-engine KV transfer.
# The default router exercises prefill/decode handoff; KV routing is separate.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-sidecar-disagg
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.3.0
  - name: prefill
    type: prefill
    dynamoSidecar: dynamo
    replicas: 1
    podTemplate:
      spec:
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 10Gi
        - name: health-probes
          emptyDir: {}
        initContainers:
        - name: install-health-probe
          image: busybox:1.37.0
          command:
          - /bin/sh
          - -c
          - |
            set -eu
            case "$(uname -m)" in
              x86_64) arch=amd64; checksum=1844b07e78a40cb713f55f1a5d2eb717c777ffd2c79a3c8fc696e8b62046e239 ;;
              aarch64) arch=arm64; checksum=98b10a42ad9d3442fef01d235284ca753088391c7dd593aca10bd04ec50333d9 ;;
              *) echo "Unsupported architecture" >&2; exit 1 ;;
            esac
            wget -q -O /health-probes/grpc_health_probe "https://github.com/grpc-ecosystem/grpc-health-probe/releases/download/v0.4.38/grpc_health_probe-linux-${arch}"
            echo "${checksum}  /health-probes/grpc_health_probe" | sha256sum -c -
            chmod 0555 /health-probes/grpc_health_probe
          volumeMounts:
          - name: health-probes
            mountPath: /health-probes
        - name: dynamo
          image: <your-registry>/dynamo-sidecar:1.3.0
          command:
          - dynamo-vllm-sidecar
          args:
          - --grpc-endpoint
          - 127.0.0.1:50051
          - --disaggregation-mode
          - prefill
          envFrom:
          - secretRef:
              name: hf-token-secret
          restartPolicy: Always
          startupProbe:
            exec:
              command:
              - /bin/sh
              - -c
              - kill -0 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: system
            initialDelaySeconds: 300
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
        containers:
        - name: main
          image: vllm/vllm-openai:v0.28.0
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          startupProbe:
            exec:
              command:
              - /bin/sh
              - -c
              - /health-probes/grpc_health_probe -addr=127.0.0.1:50051 -service=vllm.Control -connect-timeout=1s
                -rpc-timeout=1s && exec /health-probes/grpc_health_probe -addr=127.0.0.1:50051 -service=vllm.Inference
                -connect-timeout=1s -rpc-timeout=1s
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
              - /bin/sh
              - -c
              - /health-probes/grpc_health_probe -addr=127.0.0.1:50051 -service=vllm.Control -connect-timeout=1s
                -rpc-timeout=1s && exec /health-probes/grpc_health_probe -addr=127.0.0.1:50051 -service=vllm.Inference
                -connect-timeout=1s -rpc-timeout=1s
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: UCX_TLS
            value: rc_x,rc,cuda_copy,cuda_ipc
          - name: UCX_NET_DEVICES
            value: mlx5_0:1
          - name: UCX_IB_ADDR_TYPE
            value: eth
          - name: UCX_RNDV_SCHEME
            value: get_zcopy
          - name: UCX_RNDV_THRESH
            value: '0'
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: '1'
              rdma/ib: '1'
            requests:
              nvidia.com/gpu: '1'
              rdma/ib: '1'
              ephemeral-storage: 2Gi
          volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: health-probes
            mountPath: /health-probes
            readOnly: true
          command:
          - /bin/sh
          - -c
          args:
          - |
            VLLM_RS="$(python3 -c 'import os,vllm; print(os.path.join(os.path.dirname(vllm.__file__), "vllm-rs"))')"
            ulimit -l unlimited && exec "$VLLM_RS" serve Qwen/Qwen3-0.6B \
              --host 127.0.0.1 --grpc-port 50051 \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
  - name: decode
    type: decode
    dynamoSidecar: dynamo
    replicas: 1
    podTemplate:
      spec:
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 10Gi
        - name: health-probes
          emptyDir: {}
        initContainers:
        - name: install-health-probe
          image: busybox:1.37.0
          command:
          - /bin/sh
          - -c
          - |
            set -eu
            case "$(uname -m)" in
              x86_64) arch=amd64; checksum=1844b07e78a40cb713f55f1a5d2eb717c777ffd2c79a3c8fc696e8b62046e239 ;;
              aarch64) arch=arm64; checksum=98b10a42ad9d3442fef01d235284ca753088391c7dd593aca10bd04ec50333d9 ;;
              *) echo "Unsupported architecture" >&2; exit 1 ;;
            esac
            wget -q -O /health-probes/grpc_health_probe "https://github.com/grpc-ecosystem/grpc-health-probe/releases/download/v0.4.38/grpc_health_probe-linux-${arch}"
            echo "${checksum}  /health-probes/grpc_health_probe" | sha256sum -c -
            chmod 0555 /health-probes/grpc_health_probe
          volumeMounts:
          - name: health-probes
            mountPath: /health-probes
        - name: dynamo
          image: <your-registry>/dynamo-sidecar:1.3.0
          command:
          - dynamo-vllm-sidecar
          args:
          - --grpc-endpoint
          - 127.0.0.1:50051
          - --disaggregation-mode
          - decode
          envFrom:
          - secretRef:
              name: hf-token-secret
          restartPolicy: Always
          startupProbe:
            exec:
              command:
              - /bin/sh
              - -c
              - kill -0 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: system
            initialDelaySeconds: 300
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
        containers:
        - name: main
          image: vllm/vllm-openai:v0.28.0
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          startupProbe:
            exec:
              command:
              - /bin/sh
              - -c
              - /health-probes/grpc_health_probe -addr=127.0.0.1:50051 -service=vllm.Control -connect-timeout=1s
                -rpc-timeout=1s && exec /health-probes/grpc_health_probe -addr=127.0.0.1:50051 -service=vllm.Inference
                -connect-timeout=1s -rpc-timeout=1s
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
              - /bin/sh
              - -c
              - /health-probes/grpc_health_probe -addr=127.0.0.1:50051 -service=vllm.Control -connect-timeout=1s
                -rpc-timeout=1s && exec /health-probes/grpc_health_probe -addr=127.0.0.1:50051 -service=vllm.Inference
                -connect-timeout=1s -rpc-timeout=1s
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: UCX_TLS
            value: rc_x,rc,cuda_copy,cuda_ipc
          - name: UCX_NET_DEVICES
            value: mlx5_0:1
          - name: UCX_IB_ADDR_TYPE
            value: eth
          - name: UCX_RNDV_SCHEME
            value: get_zcopy
          - name: UCX_RNDV_THRESH
            value: '0'
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: '1'
              rdma/ib: '1'
            requests:
              nvidia.com/gpu: '1'
              rdma/ib: '1'
              ephemeral-storage: 2Gi
          volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: health-probes
            mountPath: /health-probes
            readOnly: true
          command:
          - /bin/sh
          - -c
          args:
          - |
            VLLM_RS="$(python3 -c 'import os,vllm; print(os.path.join(os.path.dirname(vllm.__file__), "vllm-rs"))')"
            ulimit -l unlimited && exec "$VLLM_RS" serve Qwen/Qwen3-0.6B \
              --host 127.0.0.1 --grpc-port 50051 \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
  backendFramework: vllm
