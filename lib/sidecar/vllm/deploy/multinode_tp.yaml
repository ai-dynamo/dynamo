#
# EXPERIMENTAL: engine-primary multinode vLLM (TP across two nodes) behind
# Dynamo's KV-aware router. Each engine group spans two Pods with the
# multiprocessing executor. Only the leader runs the Dynamo sidecar; the
# worker runs a headless engine that holds the remaining TP ranks.
#
# Multinode sidecar components require complete leader and worker role
# templates. The operator injects DYNAMO_RANK and DYNAMO_LEADER_ADDRESS and
# does not rewrite the authored engine launch.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-sidecar-multinode-tp
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: <your-registry>/dynamo-frontend:1.6.0
          env:
          - name: DYN_ROUTER_MODE
            value: kv
  - name: VllmWorker
    type: worker
    replicas: 2
    multinode:
      nodeCount: 2
    roles:
    - name: leader
      podTemplate:
        spec:
          initContainers:
          - name: runtime
            image: <your-registry>/dynamo-sidecar:1.6.0
            command:
            - dynamo-vllm-sidecar
            args:
            - --grpc-endpoint
            - 127.0.0.1:30001
            restartPolicy: Always
          containers:
          - name: main
            # Requires vLLM v0.32.0 or later for `vllm serve --grpc-port`.
            image: vllm/vllm-openai:v0.32.0
            env:
            - name: VLLM_USE_RUST_FRONTEND
              value: '1'
            startupProbe:
              grpc:
                port: 30001
                service: ""
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 180
            readinessProbe:
              grpc:
                port: 30001
                service: ""
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 3
            livenessProbe:
              grpc:
                port: 30001
                service: ""
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
            resources:
              limits:
                nvidia.com/gpu: '1'
              requests:
                ephemeral-storage: 2Gi
            command:
            - vllm
            - serve
            - Qwen/Qwen3-0.6B
            args:
            - --host
            - 0.0.0.0
            - --grpc-port
            - '30001'
            - --tensor-parallel-size
            - '2'
            - --nnodes
            - '2'
            - --node-rank
            - $(DYNAMO_RANK)
            - --master-addr
            - $(DYNAMO_LEADER_ADDRESS)
            - --master-port
            - '29500'
            - --kv-events-config
            - '{"publisher":"zmq","endpoint":"tcp://*:20080","replay_endpoint":"tcp://*:20180","topic":"kv-events","enable_kv_cache_events":true}'
    - name: worker
      podTemplate:
        spec:
          containers:
          - name: main
            image: vllm/vllm-openai:v0.32.0
            resources:
              limits:
                nvidia.com/gpu: '1'
              requests:
                ephemeral-storage: 2Gi
            command:
            - vllm
            - serve
            - Qwen/Qwen3-0.6B
            args:
            - --headless
            - --tensor-parallel-size
            - '2'
            - --nnodes
            - '2'
            - --node-rank
            - $(DYNAMO_RANK)
            - --master-addr
            - $(DYNAMO_LEADER_ADDRESS)
            - --master-port
            - '29500'
  backendFramework: vllm
