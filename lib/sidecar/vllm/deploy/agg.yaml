# EXPERIMENTAL: engine-primary vLLM with the Dynamo native sidecar

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-sidecar-agg
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.3.0
  - name: worker
    type: worker
    dynamoSidecar: dynamo
    replicas: 1
    podTemplate:
      spec:
        initContainers:
        - name: dynamo
          image: <your-registry>/dynamo-sidecar:1.6.0
          command:
          - dynamo-vllm-sidecar
          args:
          - --grpc-endpoint
          - 127.0.0.1:50051
          restartPolicy: Always
        containers:
        - name: main
          image: vllm/vllm-openai:v0.28.0
          startupProbe:
            grpc:
              port: 50051
              # vLLM 0.28.0: overall health mirrors Control and Inference.
              # Reverify this behavior when upgrading vLLM.
              service: ""
            periodSeconds: 5
            timeoutSeconds: 5
            # Allow 30 minutes for model startup; increase for larger models.
            failureThreshold: 360
          readinessProbe:
            grpc:
              port: 50051
              service: ""
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50051
              service: ""
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              nvidia.com/gpu: '1'
            requests:
              ephemeral-storage: 2Gi
          command:
          - /bin/sh
          - -c
          - exec "$(python3 -c 'import os,vllm; print(os.path.join(os.path.dirname(vllm.__file__), "vllm-rs"))')"
            serve Qwen/Qwen3-0.6B --host 0.0.0.0 --grpc-port 50051
  backendFramework: vllm
