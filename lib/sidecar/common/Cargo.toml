[package]
name = "dynamo-sidecar-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Shared gRPC transport and CLI infrastructure for Dynamo sidecars"

[package.metadata.cargo-machete]
# Referenced only as `::prost_types_v14` inside the `json_codec!` macro body,
# which cargo-machete's source scan does not expand.
ignored = ["prost-types-v14"]

[dependencies]
dynamo-backend-common = { workspace = true }

clap = { version = "4", features = ["derive", "env"] }
futures = { workspace = true }
prost-types = { workspace = true }
prost-types-v14 = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-v14 = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }

[features]
# The v14 protobuf/tonic surface, for sidecars generated against prost 0.14.
tonic-v14 = ["dep:tonic-v14", "dep:prost-types-v14"]
