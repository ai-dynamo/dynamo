#
# EXPERIMENTAL: engine-primary multinode TensorRT-LLM (TP across two nodes)
# behind Dynamo's KV-aware router. Each engine group spans two Pods. The leader
# launches every MPI rank through mpirun over SSH and serves OpenEngine gRPC;
# the worker runs sshd and hosts the remaining TP ranks. Only the leader runs
# the Dynamo sidecar.
#
# Multinode sidecar components require complete leader and worker role
# templates. The operator injects DYNAMO_RANK and DYNAMO_LEADER_ADDRESS and
# does not rewrite the authored engine launch, SSH setup, probes, or mounts.
# The operator replicates its MPI SSH keypair Secret (mpi-run-ssh-secret by
# default) into the namespace of every multinode DGD; both roles mount it.
# The OpenEngine listener binds all Pod interfaces so the kubelet gRPC probes can
# reach it. It is unauthenticated: any client that reaches the Pod IP can run
# inference and abort requests. Restrict it with a NetworkPolicy, or bind
# 127.0.0.1 and use exec probes as agg_kv_router.yaml does.
# For a DGD created before operator 1.6.0, see docs/fern/pages/kubernetes/installation/multinode-orchestration.md#use-the-variables-in-a-dgd-created-before-160.

apiVersion: v1
kind: ConfigMap
metadata:
  name: trtllm-engine-config-multinode-tp
data:
  config.yaml: |
    tensor_parallel_size: 2
    enable_attention_dp: false
    # Required for tool_choice constraints.
    guided_decoding_backend: xgrammar
    # Batch five decode steps per gRPC chunk to reduce serialization overhead.
    stream_interval: 5
    kv_cache_config:
      use_kv_cache_manager_v2: true
      enable_block_reuse: true
      kv_cache_event_hash_algo: v1_block_key
      kv_events_config:
        enable_kv_cache_events: true
        # Rank 0 publishes on the leader; the leader sidecar subscribes locally.
        endpoint: tcp://127.0.0.1:5557
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: trtllm-sidecar-multinode-tp
spec:
  backendFramework: trtllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    runtimeVersionOverride: "1.6.0"
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend-nightly:20261023-75d0686@sha256:e237cc1347d8db6af2f84ace9150a59b950b47472ddc9429924d5e4bc5790395
          env:
          - name: DYN_ROUTER_MODE
            value: kv
  - name: TRTLLMWorker
    type: worker
    replicas: 2
    runtimeVersionOverride: "1.6.0"
    multinode:
      nodeCount: 2
    roles:
    - name: leader
      podTemplate:
        spec:
          initContainers:
          - name: runtime
            image: nvcr.io/nvidia/ai-dynamo/dynamo-sidecar-nightly:20261023-75d0686@sha256:fc13f0a227d78499fbaed257e2373bcb54df32ca8e1fcea1e0ad6289087cbcb8
            restartPolicy: Always
            command:
            - dynamo-trtllm-sidecar
            args:
            - --grpc-endpoint
            - 127.0.0.1:30001
            - --model-path
            - Qwen/Qwen3-0.6B
            - --context-length
            - "4096"
            envFrom:
            - secretRef:
                name: hf-token-secret
                optional: true
          containers:
          - name: main
            # Requires a TensorRT-LLM build with OpenEngine node-local discovery, native
            # KV events, and the grpc.health.v1 service (nightlies from 2026-10-27).
            # The launch below relies on this image's Open MPI 5: it allows root, and
            # its ssh launcher keeps the full -H hostname that Pod DNS needs.
            image: nvcr.io/nvidia/tensorrt-llm/release:1.4.0rc2.dev202610270008@sha256:c1e774f48f8c9b5e06bb036c1798b80c9ab5201ebeb1013044ba4f865bb779a7
            # grpc.health.v1: `liveness` turns NOT_SERVING only on a fatal engine
            # failure; `inference` follows the executor health poll.
            startupProbe:
              grpc:
                port: 30001
                service: liveness
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 360   # Up to 30 min for scheduling, MPI launch, model load, and warmup.
            livenessProbe:
              grpc:
                port: 30001
                service: liveness
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
            readinessProbe:
              grpc:
                port: 30001
                service: inference
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            envFrom:
            - secretRef:
                name: hf-token-secret
                optional: true
            resources:
              limits:
                nvidia.com/gpu: "1"
              requests:
                # Increase for larger models.
                ephemeral-storage: 2Gi
            command:
            - /bin/bash
            - -c
            args:
            # The first -H entry receives rank 0, so trtllm-serve binds OpenEngine on
            # the leader. mpirun binds each rank to one core by default; the engine
            # needs every core. The worker exports the container environment to its
            # sshd sessions, so only HF_TOKEN travels with mpirun -x.
            - |
              set -euo pipefail
              # The operator mounts the key group-readable; ssh insists on 0600.
              install -Dm600 /ssh-pk/private.key "$HOME/.ssh/id_rsa"
              # Grove swaps the role suffix in the leader hostname; LeaderWorkerSet appends
              # the worker index to the leader Pod name. Sized for nodeCount 2: list every
              # extra worker in -H and raise -n for larger groups.
              case "$DYNAMO_LEADER_ADDRESS" in
                *-ldr-0.*) WORKER="${DYNAMO_LEADER_ADDRESS/-ldr-0./-wkr-0.}" ;;
                *) WORKER="${DYNAMO_LEADER_ADDRESS/./-1.}" ;;
              esac
              until ssh -o StrictHostKeyChecking=no "$WORKER" true; do echo "waiting for sshd on $WORKER"; sleep 3; done
              exec mpirun --bind-to none -n 2 -H "$DYNAMO_LEADER_ADDRESS:1,$WORKER:1" \
                --mca pml ob1 ${HF_TOKEN:+-x HF_TOKEN} \
                bash -c 'trtllm-llmapi-launch trtllm-serve Qwen/Qwen3-0.6B \
                  --grpc --grpc-protocol openengine --openengine-enable-load-metrics \
                  --host 0.0.0.0 --port 30001 --max_seq_len 4096 \
                  --extra_llm_api_options /config/config.yaml'
            volumeMounts: &engineMounts
            - name: engine-config
              mountPath: /config
            - name: ssh-keys
              mountPath: /ssh-pk
              readOnly: true
          volumes: &engineVolumes
          - name: engine-config
            configMap:
              name: trtllm-engine-config-multinode-tp
          - name: ssh-keys
            secret:
              secretName: mpi-run-ssh-secret
    - name: worker
      podTemplate:
        spec:
          containers:
          - name: main
            image: nvcr.io/nvidia/tensorrt-llm/release:1.4.0rc2.dev202610270008@sha256:c1e774f48f8c9b5e06bb036c1798b80c9ab5201ebeb1013044ba4f865bb779a7
            # No probes: the worker's process is sshd, and the engine ranks it hosts are
            # launched and supervised by the leader's mpirun, which the leader waits to
            # start until sshd answers. Killing sshd ends this container and the ranks
            # with it; the leader's mpirun then aborts and both containers restart.
            resources:
              limits:
                nvidia.com/gpu: "1"
              requests:
                ephemeral-storage: 2Gi
            command:
            - /bin/bash
            - -c
            args:
            # The release image ships no sshd. The package creates host keys but not
            # its privilege-separation directory. sshd gives MPI ranks a login
            # environment, not the container's, so export the container environment
            # (CUDA include and library paths, PATH, Python) to every session; without
            # it Triton JIT on this node cannot find cuda.h.
            - |
              set -euo pipefail
              command -v sshd >/dev/null || { apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server; }
              install -Dm600 /ssh-pk/private.key.pub "$HOME/.ssh/authorized_keys"
              mkdir -p /run/sshd
              env | grep -vE '^(HF_TOKEN|HUGGING_FACE_HUB_TOKEN|HF_HUB_TOKEN)=' > "$HOME/.ssh/environment"
              exec /usr/sbin/sshd -D -e -o PermitUserEnvironment=yes
            volumeMounts: *engineMounts
          volumes: *engineVolumes
