#
# EXPERIMENTAL: multinode TensorRT-LLM tensor parallelism (TP) with explicit leader and worker templates.
# Each engine group spans two Pods. The leader launches every MPI rank with
# mpirun over SSH and runs the only Dynamo sidecar. The worker runs sshd.
# See docs/fern/pages/developer-guide/knowledge-base/modular-components/backends/tensorrt-llm/sidecar.md#deploy-on-kubernetes.
# For a DGD created before operator 1.6.0, see docs/fern/pages/kubernetes/installation/multinode-orchestration.md#use-the-variables-in-a-dgd-created-before-160.

apiVersion: v1
kind: ConfigMap
metadata:
  name: trtllm-engine-config-multinode-tp
data:
  config.yaml: |
    tensor_parallel_size: 2
    enable_attention_dp: false
    # Required for tool_choice constraints.
    guided_decoding_backend: xgrammar
    # Batch five decode steps per gRPC chunk to reduce serialization overhead.
    stream_interval: 5
    kv_cache_config:
      use_kv_cache_manager_v2: true
      enable_block_reuse: true
      kv_cache_event_hash_algo: v1_block_key
      kv_events_config:
        enable_kv_cache_events: true
        # Rank 0 publishes on the leader; the leader sidecar subscribes locally.
        endpoint: tcp://127.0.0.1:5557
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: trtllm-sidecar-multinode-tp
spec:
  backendFramework: trtllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    runtimeVersionOverride: "1.6.0"
    podTemplate:
      spec:
        containers:
        - name: main
          # Same nightly as the sidecar below. Only this pairing was tested.
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend-nightly:20261023-75d0686@sha256:e237cc1347d8db6af2f84ace9150a59b950b47472ddc9429924d5e4bc5790395
          env:
          - name: DYN_ROUTER_MODE
            value: kv
  - name: TRTLLMWorker
    type: worker
    replicas: 2
    runtimeVersionOverride: "1.6.0"
    multinode:
      nodeCount: 2
    roles:
    - name: leader
      podTemplate:
        spec:
          initContainers:
          - name: runtime
            # Requires OpenEngine routing discovery (ai-dynamo/dynamo#15087), which is not in the 1.6.x releases.
            image: nvcr.io/nvidia/ai-dynamo/dynamo-sidecar-nightly:20261023-75d0686@sha256:fc13f0a227d78499fbaed257e2373bcb54df32ca8e1fcea1e0ad6289087cbcb8
            restartPolicy: Always
            command:
            - dynamo-trtllm-sidecar
            args:
            - --grpc-endpoint
            - 127.0.0.1:30001
            - --model-path
            - Qwen/Qwen3-0.6B
            - --context-length
            - "4096"
            envFrom:
            - secretRef:
                name: hf-token-secret
                optional: true
          containers:
          - name: main
            # Requires OpenEngine node-local discovery and KV events (NVIDIA/TensorRT-LLM#19440)
            # and the grpc.health.v1 service used by the probes below (NVIDIA/TensorRT-LLM#20437,
            # nightlies from 2026-10-27).
            image: nvcr.io/nvidia/tensorrt-llm/release:1.4.0rc2.dev202610270008@sha256:c1e774f48f8c9b5e06bb036c1798b80c9ab5201ebeb1013044ba4f865bb779a7
            # The liveness service fails only on a fatal engine error. The inference service tracks the executor.
            startupProbe:
              grpc:
                port: 30001
                service: liveness
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 360   # Up to 30 min for scheduling, MPI launch, model load, and warmup.
            livenessProbe:
              grpc:
                port: 30001
                service: liveness
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
            readinessProbe:
              grpc:
                port: 30001
                service: inference
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            envFrom:
            - secretRef:
                name: hf-token-secret
                optional: true
            resources:
              limits:
                nvidia.com/gpu: "1"
              requests:
                # Increase for larger models.
                ephemeral-storage: 2Gi
            command:
            - /bin/bash
            - -c
            args:
            # The first -H host gets rank 0, so OpenEngine serves from the leader.
            # --bind-to none: mpirun's default pins each rank to one core.
            - |
              set -euo pipefail
              # The operator mounts the key group-readable; ssh insists on 0600.
              install -Dm600 /ssh-pk/private.key "$HOME/.ssh/id_rsa"
              # Worker hostname: Grove swaps the role suffix, LeaderWorkerSet appends the
              # worker index. For nodeCount above 2, add each extra worker to -H and raise -n.
              case "$DYNAMO_LEADER_ADDRESS" in
                *-ldr-0.*) WORKER="${DYNAMO_LEADER_ADDRESS/-ldr-0./-wkr-0.}" ;;
                *) WORKER="${DYNAMO_LEADER_ADDRESS/./-1.}" ;;
              esac
              until ssh -o StrictHostKeyChecking=no "$WORKER" true; do echo "waiting for sshd on $WORKER"; sleep 3; done
              exec mpirun --bind-to none -n 2 -H "$DYNAMO_LEADER_ADDRESS:1,$WORKER:1" \
                --mca pml ob1 ${HF_TOKEN:+-x HF_TOKEN} \
                bash -c 'trtllm-llmapi-launch trtllm-serve Qwen/Qwen3-0.6B \
                  --grpc --grpc-protocol openengine --openengine-enable-load-metrics \
                  --host 0.0.0.0 --port 30001 --max_seq_len 4096 \
                  --extra_llm_api_options /config/config.yaml'
            volumeMounts: &engineMounts
            - name: engine-config
              mountPath: /config
            - name: ssh-keys
              mountPath: /ssh-pk
              readOnly: true
          volumes: &engineVolumes
          - name: engine-config
            configMap:
              name: trtllm-engine-config-multinode-tp
          - name: ssh-keys
            secret:
              secretName: mpi-run-ssh-secret  # Replicated by the operator into every multinode DGD namespace.
    - name: worker
      podTemplate:
        spec:
          containers:
          - name: main
            image: nvcr.io/nvidia/tensorrt-llm/release:1.4.0rc2.dev202610270008@sha256:c1e774f48f8c9b5e06bb036c1798b80c9ab5201ebeb1013044ba4f865bb779a7
            # No probes: sshd is the only process here. The leader waits for it, then
            # launches and supervises this node's ranks through mpirun.
            resources:
              limits:
                nvidia.com/gpu: "1"
              requests:
                ephemeral-storage: 2Gi
            command:
            - /bin/bash
            - -c
            args:
            # The image ships no sshd, and apt does not create /run/sshd. Ranks run in
            # sshd sessions, so export the container environment to them: Triton JIT
            # needs the CUDA paths. Tokens stay out. The leader passes HF_TOKEN with mpirun -x.
            - |
              set -euo pipefail
              command -v sshd >/dev/null || { apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server; }
              install -Dm600 /ssh-pk/private.key.pub "$HOME/.ssh/authorized_keys"
              mkdir -p /run/sshd
              env | grep -vE '^(HF_TOKEN|HUGGING_FACE_HUB_TOKEN|HF_HUB_TOKEN)=' > "$HOME/.ssh/environment"
              exec /usr/sbin/sshd -D -e -o PermitUserEnvironment=yes
            volumeMounts: *engineMounts
          volumes: *engineVolumes
