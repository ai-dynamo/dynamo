#
# Aggregated TensorRT-LLM deployment using the Rust sidecar.
#
# The worker pod has two containers:
#   - main: the Dynamo worker (dynamo-trtllm-sidecar). No GPU. Handles
#     registration and talks to the engine over gRPC on 127.0.0.1. The operator
#     adds discovery env and health probes here, so it must be named "main".
#   - trtllm-engine: the stock TensorRT-LLM image. Holds the GPU and runs the
#     gRPC server. Runs as a native sidecar; see the initContainers block below.
#
# The engine's gRPC has no auth and no TLS. It is only safe because it stays on
# pod loopback (127.0.0.1).

apiVersion: v1
kind: ConfigMap
metadata:
  name: trtllm-engine-config
data:
  config.yaml: |
    # Emit one gRPC chunk per N decode steps instead of one per token. N>1 cuts
    # the sidecar's per-token gRPC serialization — its main overhead vs the
    # in-process backend — for a large throughput win under load. Trade-off:
    # tokens reach the client in bursts of N. See the README "Tuning" note.
    stream_interval: 5
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: trtllm-sidecar-agg
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        # Dynamo frontend. No TensorRT-LLM needed. The operator adds the command.
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.3.0
  - name: TRTLLMWorker
    type: worker
    replicas: 1
    podTemplate:
      spec:
        # trtllm-engine as a native sidecar (initContainer, restartPolicy: Always):
        # it starts before `main` and stops after it. Stock TensorRT-LLM image,
        # holds the GPU. --grpc needs rc21; rc22 crashes on startup (protobuf
        # version mismatch).
        initContainers:
        - name: trtllm-engine
          image: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc21
          restartPolicy: Always
          # Both probes make a real gRPC HealthCheck RPC (stubless unary_unary, no
          # proto deps). exec — not tcpSocket/grpc: — because those dial the pod IP
          # and can't reach the loopback-bound engine, and a bare TCP accept would
          # pass before the model is loaded. startupProbe gates `main` until the
          # engine actually serves; readinessProbe pulls the worker from rotation
          # if the engine dies at runtime (pod -> NotReady -> frontend drops it).
          startupProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:50051').unary_unary('/trtllm.TrtllmService/HealthCheck')(b'', timeout=3)
            periodSeconds: 5
            timeoutSeconds: 10     # must exceed the RPC timeout + interpreter spawn
            failureThreshold: 60   # ~5 min for model load; raise for big models
          readinessProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; grpc.insecure_channel('127.0.0.1:50051').unary_unary('/trtllm.TrtllmService/HealthCheck')(b'', timeout=3)
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              # Increase this value for larger models.
              ephemeral-storage: 2Gi
          command:
          - python3
          - -m
          - tensorrt_llm.commands.serve
          args:
          - Qwen/Qwen3-0.6B
          - --grpc
          - --host
          - 127.0.0.1
          - --port
          - "50051"
          # Engine tuning (stream_interval, etc.) from the ConfigMap above.
          - --extra_llm_api_options
          - /config/config.yaml
          volumeMounts:
          - name: engine-config
            mountPath: /config
        containers:
        # The sidecar worker. No published image yet, so build your own from
        # lib/sidecar/trtllm/Dockerfile and set <your-registry> below (see README).
        # Add imagePullSecrets if private.
        # Must be named "main": the operator injects discovery env + probes by name.
        - name: main
          image: <your-registry>/dynamo-trtllm-sidecar:1.3.0
          command:
          - dynamo-trtllm-sidecar
          args:
          - --trtllm-endpoint
          - 127.0.0.1:50051
          - --model-path
          - Qwen/Qwen3-0.6B
          # The engine reports 0 for context length, so set it here. Without it,
          # requests that omit max_tokens are rejected.
          - --context-length
          - "40960"
          envFrom:
          - secretRef:
              name: hf-token-secret
        volumes:
        - name: engine-config
          configMap:
            name: trtllm-engine-config
