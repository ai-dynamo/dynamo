#
# Aggregated TensorRT-LLM deployment using the Rust sidecar.
#
# Worker pod = two containers:
#   - main: stock TensorRT-LLM engine with OpenEngine gRPC, holds the GPU.
#   - runtime: Dynamo native sidecar, talks to the engine over loopback gRPC.
#
# The engine's gRPC has no auth/TLS; safe only because it stays on loopback.

apiVersion: v1
kind: ConfigMap
metadata:
  name: trtllm-engine-config
data:
  config.yaml: |
    # Dynamo sends a required or named tool_choice as a JSON schema, which
    # TensorRT-LLM enforces only with a guided-decoding backend.
    guided_decoding_backend: xgrammar
    # One gRPC chunk per N decode steps, not per token: N>1 cuts per-token gRPC
    # serialization for a throughput win, at the cost of bursty delivery.
    stream_interval: 5
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: trtllm-sidecar-agg
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    runtimeVersionOverride: "1.6.0"
    podTemplate:
      spec:
        containers:
        # Dynamo frontend; operator adds the command.
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend-nightly:20261013-2210b07
  - name: TRTLLMWorker
    type: worker
    replicas: 1
    runtimeVersionOverride: "1.6.0"
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/tensorrt-llm/release:1.4.0rc1.dev202610140007
          # Readiness via the OpenEngine Control.Health RPC, which reports the
          # engine's own state (grpc + model, plus kv_connector when configured)
          # rather than just a connectable socket.
          # The pinned engine ships OpenEngine bindings under tensorrt_llm,
          # but importing them loads TensorRT-LLM for every exec probe.
          # It does not yet serve grpc.health.v1.Health; use Control.Health.
          # HealthResponse.state is protobuf field 1 (varint); READY is 2.
          # Int32Value decodes that field and skips any other fields.
          startupProbe:
            exec:
              command: &engineReadyCommand
              - python3
              - -c
              - |
                import grpc
                from google.protobuf.wrappers_pb2 import Int32Value

                channel = grpc.insecure_channel("127.0.0.1:30001")
                response = channel.unary_unary("/openengine.v1.Control/Health")(
                    b"", timeout=3
                )
                raise SystemExit(Int32Value.FromString(response).value != 2)
            periodSeconds: 5
            timeoutSeconds: 10     # must exceed the RPC timeout + interpreter spawn
            failureThreshold: 360   # Up to 30 min for model load and warmup.
          readinessProbe:
            exec:
              command: *engineReadyCommand
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          env:
          # TensorRT-LLM would otherwise start its TP=1 worker by spawning an
          # MPI process, and that spawn fails inside a pod: PRTE reaches
          # `VM READY` and then terminates its daemons with no diagnostic.
          # Measured on release:1.3.0rc27. This worker runs one GPU, which is
          # exactly the case the switch covers
          # (`enable_worker_single_process_for_tp1`), so the worker runs
          # in-process and never spawns.
          # Not free: the engine logs "Using single process worker for TP1,
          # this may hurt streaming generation performance"
          # (`executor/executor.py`), because the worker now shares the server's
          # process instead of gathering over IPC. `stream_interval` in the
          # ConfigMap above is the lever that buys that back.
          # Revisit both together if the engine needs TP > 1,
          # which this switch does not cover.
          - name: TLLM_WORKER_USE_SINGLE_PROCESS
            value: "1"
          # The release image runs as uid 0 and PRTE refuses to run as root
          # unless told twice. Harmless with the switch above, and it keeps the
          # engine from dying at startup if the spawn path is ever re-entered.
          - name: PRTE_ALLOW_RUN_AS_ROOT
            value: "1"
          - name: PRTE_ALLOW_RUN_AS_ROOT_CONFIRM
            value: "1"
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              # Increase for larger models.
              ephemeral-storage: 2Gi
          command:
          - python3
          - -m
          - tensorrt_llm.commands.serve
          args:
          - Qwen/Qwen3-0.6B
          - --grpc
          - --grpc-protocol
          - openengine
          - --host
          - 127.0.0.1
          - --port
          - "30001"
          # Workaround, not a requirement: `GetModelInfo` reads the unresolved
          # `llm.args.max_seq_len`, which stays `None` on the PyTorch path even
          # though the executor has already resolved the real window from the
          # model config. Measured on release:1.3.0rc27.dev202609170000 with
          # TinyLlama-1.1B: the executor runs at `max_seq_len=2048` while
          # `GetModelInfo` answers UNSET. Stating it here is what stops the
          # sidecar polling for its whole startup deadline and then registering
          # a worker that rejects every request omitting max_tokens. Drop this
          # and the sidecar's --context-length once the servicer reports the
          # resolved window.
          - --max_seq_len
          - "4096"
          # Engine tuning from the ConfigMap above.
          - --extra_llm_api_options
          - /config/config.yaml
          volumeMounts:
          - name: engine-config
            mountPath: /config
        initContainers:
        # Dynamo runtime starts first and receives discovery env and probes.
        # Replace this nightly image with a matching release when available.
        - name: runtime
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime-nightly:20261013-2210b07
          restartPolicy: Always
          command:
          - python3
          - -m
          - dynamo.trtllm.sidecar
          args:
          - --grpc-endpoint
          - 127.0.0.1:30001
          - --model-path
          - Qwen/Qwen3-0.6B
          # Matches the engine's --max_seq_len above.
          - --context-length
          - "4096"
          envFrom:
          - secretRef:
              name: hf-token-secret
        volumes:
        - name: engine-config
          configMap:
            name: trtllm-engine-config
  backendFramework: trtllm
