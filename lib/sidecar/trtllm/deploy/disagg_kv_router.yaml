#
# EXPERIMENTAL. Disaggregated TensorRT-LLM deployment using the Rust sidecar.
#
# Two prefill and two decode replicas run as separate worker pods. Each pod has
# a KV-enabled TensorRT-LLM engine named main and a Dynamo sidecar named runtime.
# The runtime's --disaggregation-mode selects its prefill or decode role.
#
# The frontend routes to a prefill worker, gets back a `KvSessionRef` handoff,
# then routes to a decode worker carrying it. The KV cache itself moves
# engine-to-engine over the cache transceiver, never through the sidecars, so
# both engines need `cache_transceiver_config` (the ConfigMaps below).
#
# Each engine publishes KVCM2 events over ZMQ. The runtime from PR #15087
# discovers its event source and reports load to the KV router.
#
# The engine's gRPC has no auth/TLS; safe only because it stays on loopback.
# The cache transceiver binds a separate port on the pod IP, which is what the
# peer engine dials.
#
# PREREQUISITES / CAVEATS:
#   - The prefill -> decode flow was validated with both engines on one node,
#     using NIXL over TCP/CUDA-IPC without rdma/ib. This manifest does not
#     enforce placement. Set placement rules for same-node serving, or validate
#     the interconnect before running across nodes. On an RDMA fabric, add
#     `rdma/ib: "1"` to each engine's resource limits and requests. Configure
#     memory-lock limits and other capabilities as that deployment requires.
#   - Build frontend and runtime images from PR #15087 and use an operator
#     that supports the engine-primary native-sidecar layout.

apiVersion: v1
kind: ConfigMap
metadata:
  name: trtllm-prefill-engine-config-kv
data:
  config.yaml: |
    # Without a transceiver the engines cannot complete the handoff. NIXL picks
    # its own underlying transport (UCX where there is no RDMA fabric).
    cache_transceiver_config:
      backend: NIXL
    guided_decoding_backend: xgrammar
    kv_cache_config:
      use_kv_cache_manager_v2: true
      enable_block_reuse: true
      kv_cache_event_hash_algo: v1_block_key
      kv_events_config:
        enable_kv_cache_events: true
        endpoint: tcp://127.0.0.1:5557
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trtllm-decode-engine-config-kv
data:
  config.yaml: |
    cache_transceiver_config:
      backend: NIXL
    # Enforces a required or named tool_choice, which Dynamo sends as a JSON schema.
    guided_decoding_backend: xgrammar
    # One gRPC chunk per N decode steps, not per token: N>1 cuts per-token gRPC
    # serialization for a throughput win, at the cost of bursty delivery. Only
    # the decode engine streams, so only it is tuned here.
    stream_interval: 5
    kv_cache_config:
      use_kv_cache_manager_v2: true
      enable_block_reuse: true
      kv_cache_event_hash_algo: v1_block_key
      kv_events_config:
        enable_kv_cache_events: true
        endpoint: tcp://127.0.0.1:5558
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: trtllm-sidecar-disagg-kv-router
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    runtimeVersionOverride: "1.6.0"
    podTemplate:
      spec:
        containers:
        # Dynamo frontend; operator adds the command.
        - name: main
          # 1.4.0 or newer: the 1.3.0 router fails a disaggregated request
          # whose one-token prefill stops on EOS or a stop match.
          image: <your-registry>/dynamo-frontend:<pr15087-build>
          env:
          - name: DYN_ROUTER_MODE
            value: kv

  - name: TRTLLMPrefillWorker
    type: prefill
    replicas: 2
    runtimeVersionOverride: "1.6.0"
    podTemplate:
      spec:
        volumes:
        - name: engine-config
          configMap:
            name: trtllm-prefill-engine-config-kv
        # UCX shared-memory transports need more than the default 64 MiB.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 10Gi
        containers:
        - name: main
          image: nvcr.io/nvidia/tensorrt-llm/release:1.4.0a0.dev202610180820@sha256:b8c862fea7c4306043dd2dbda06175af0fc8af4f336435597c07ec92f6fff3bd
          # Readiness via the OpenEngine Control.Health RPC, which reports the
          # engine's own state rather than just a connectable socket.
          # The pinned engine ships OpenEngine bindings under tensorrt_llm,
          # but importing them loads TensorRT-LLM for every exec probe.
          # It does not yet serve grpc.health.v1.Health; use Control.Health.
          # HealthResponse.state is protobuf field 1 (varint); READY is 2.
          # Int32Value decodes that field and skips any other fields.
          startupProbe:
            exec:
              command: &engineReadyCommand
              - python3
              - -c
              - |
                import grpc
                from google.protobuf.wrappers_pb2 import Int32Value

                channel = grpc.insecure_channel("127.0.0.1:50051")
                response = channel.unary_unary("/openengine.v1.Control/Health")(
                    b"", timeout=3
                )
                raise SystemExit(Int32Value.FromString(response).value != 2)
            periodSeconds: 5
            timeoutSeconds: 10     # must exceed the RPC timeout + interpreter spawn
            failureThreshold: 360   # Up to 30 min for model load and warmup.
          readinessProbe:
            exec:
              command: *engineReadyCommand
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          env:
          # TensorRT-LLM would otherwise start its TP=1 worker by spawning an
          # MPI process, and that spawn fails inside a pod: PRTE reaches
          # `VM READY` and then terminates its daemons with no diagnostic.
          # Measured on release:1.3.0rc27. Both engines run one GPU each, which
          # is exactly the case this switch covers
          # (`enable_worker_single_process_for_tp1`), so the worker runs
          # in-process and never spawns.
          # Not free: the engine logs "Using single process worker for TP1,
          # this may hurt streaming generation performance"
          # (`executor/executor.py`). It costs least here -- a context-only
          # request emits one token -- and most on the decode leg below, where
          # `stream_interval` is the lever that buys it back. Revisit both
          # together if an engine needs TP > 1, which this switch does not cover.
          - name: TLLM_WORKER_USE_SINGLE_PROCESS
            value: "1"
          # The release image runs as uid 0 and PRTE refuses to run as root
          # unless told twice. Harmless with the switch above, and it keeps the
          # engine from dying at startup if the spawn path is ever re-entered.
          - name: PRTE_ALLOW_RUN_AS_ROOT
            value: "1"
          - name: PRTE_ALLOW_RUN_AS_ROOT_CONFIRM
            value: "1"
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            # The tested flow needs no RDMA fabric: NIXL falls back to
            # TCP/CUDA-IPC. Add `rdma/ib: "1"` to both limits and requests only
            # where a device plugin advertises it -- without one, both worker
            # pods stay Pending.
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
              # Increase for larger models.
              ephemeral-storage: 2Gi
          volumeMounts:
          - name: engine-config
            mountPath: /config
          - name: dshm
            mountPath: /dev/shm
          command:
          - python3
          - -m
          - tensorrt_llm.commands.serve
          args:
          - Qwen/Qwen3-0.6B
          - --grpc
          - --grpc-protocol
          - openengine
          - --openengine-enable-load-metrics
          - --host
          - 127.0.0.1
          - --port
          - "50051"
          # Workaround, not a requirement: `GetModelInfo` reads the unresolved
          # `llm.args.max_seq_len`, which stays `None` on the PyTorch path even
          # though the executor has already resolved the real window from the
          # model config. Stating it here is what stops the sidecar polling for
          # its whole startup deadline and then registering a worker that
          # rejects every request omitting max_tokens. Drop this and the
          # sidecar's --context-length once the servicer reports the resolved
          # window.
          - --max_seq_len
          - "4096"
          - --extra_llm_api_options
          - /config/config.yaml
        initContainers:
        # Dynamo runtime starts first and receives discovery env and probes.
        - name: runtime
          image: <your-registry>/dynamo-sidecar:<pr15087-build>
          restartPolicy: Always
          command:
          - dynamo-trtllm-sidecar
          args:
          - --disaggregation-mode
          - prefill
          - --grpc-endpoint
          - 127.0.0.1:50051
          - --model-path
          - Qwen/Qwen3-0.6B
          # Matches the engine's --max_seq_len above.
          - --context-length
          - "4096"
          envFrom:
          - secretRef:
              name: hf-token-secret

  - name: TRTLLMDecodeWorker
    type: decode
    replicas: 2
    runtimeVersionOverride: "1.6.0"
    podTemplate:
      spec:
        volumes:
        - name: engine-config
          configMap:
            name: trtllm-decode-engine-config-kv
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 10Gi
        containers:
        - name: main
          image: nvcr.io/nvidia/tensorrt-llm/release:1.4.0a0.dev202610180820@sha256:b8c862fea7c4306043dd2dbda06175af0fc8af4f336435597c07ec92f6fff3bd
          startupProbe:
            exec:
              command: *engineReadyCommand
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 360
          readinessProbe:
            exec:
              command: *engineReadyCommand
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          env:
          # See the prefill engine above: run the TP=1 worker in-process rather
          # than spawning it over MPI, which does not work inside a pod. This is
          # the leg that streams, so it is the leg that pays the engine's
          # "may hurt streaming generation performance" warning -- the
          # `stream_interval: 5` in this engine's ConfigMap is what offsets it.
          - name: TLLM_WORKER_USE_SINGLE_PROCESS
            value: "1"
          - name: PRTE_ALLOW_RUN_AS_ROOT
            value: "1"
          - name: PRTE_ALLOW_RUN_AS_ROOT_CONFIRM
            value: "1"
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            # The tested flow needs no RDMA fabric: NIXL falls back to
            # TCP/CUDA-IPC. Add `rdma/ib: "1"` to both limits and requests only
            # where a device plugin advertises it -- without one, both worker
            # pods stay Pending.
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
              ephemeral-storage: 2Gi
          volumeMounts:
          - name: engine-config
            mountPath: /config
          - name: dshm
            mountPath: /dev/shm
          command:
          - python3
          - -m
          - tensorrt_llm.commands.serve
          args:
          - Qwen/Qwen3-0.6B
          - --grpc
          - --grpc-protocol
          - openengine
          - --openengine-enable-load-metrics
          - --host
          - 127.0.0.1
          - --port
          - "50051"
          - --max_seq_len
          - "4096"
          - --extra_llm_api_options
          - /config/config.yaml
        initContainers:
        - name: runtime
          image: <your-registry>/dynamo-sidecar:<pr15087-build>
          restartPolicy: Always
          command:
          - dynamo-trtllm-sidecar
          args:
          - --disaggregation-mode
          - decode
          - --grpc-endpoint
          - 127.0.0.1:50051
          - --model-path
          - Qwen/Qwen3-0.6B
          - --context-length
          - "4096"
          envFrom:
          - secretRef:
              name: hf-token-secret
  backendFramework: trtllm
