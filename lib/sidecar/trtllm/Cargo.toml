[package]
name = "dynamo-trtllm-sidecar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Dynamo TensorRT-LLM sidecar backend — drives an out-of-process TensorRT-LLM engine over its OpenEngine gRPC service through the backend-common LLMEngine trait."

[package.metadata.cargo-machete]
# Referenced by protobuf code generated into OUT_DIR.
ignored = ["prost", "prost-types"]

[[bin]]
name = "dynamo-trtllm-sidecar"
path = "src/main.rs"

[features]
# On for the sidecar image's SBOMs (its shared build links vLLM's mm-routing here
# and into LPX). The Python bindings turn them off so the default wheel stays lean.
default = ["mm-routing", "jemalloc"]
mm-routing = ["dynamo-llm/mm-routing"]
# jemalloc as the binary's global allocator.
jemalloc = ["dynamo-sidecar-common/jemalloc"]

[dependencies]
dynamo-backend-common = { workspace = true }
dynamo-sidecar-common = { workspace = true }
dynamo-kv-events = { workspace = true }
dynamo-llm = { workspace = true, default-features = false }
dynamo-runtime = { workspace = true }

anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
futures = { workspace = true }
hmac = "0.12"
sha2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
dynamo-backend-common = { workspace = true, features = ["testing"] }
dynamo-kv-hashing = { workspace = true }
dynamo-router-protocol = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
