[package]
name = "dynamo-trtllm-sidecar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Dynamo TensorRT-LLM sidecar backend — drives an out-of-process TensorRT-LLM engine over its OpenEngine gRPC service through the backend-common LLMEngine trait."

[package.metadata.cargo-machete]
# Referenced by protobuf code generated into OUT_DIR.
ignored = ["prost", "prost-types"]

[[bin]]
name = "dynamo-trtllm-sidecar"
path = "src/main.rs"

[features]
default = ["jemalloc"]
# jemalloc as the binary's global allocator. The Python bindings turn it off.
jemalloc = ["dynamo-sidecar-common/jemalloc"]

[dependencies]
dynamo-backend-common = { workspace = true }
dynamo-sidecar-common = { workspace = true }
dynamo-kv-router = { workspace = true }
# The sidecar image builds all sidecars in one `cargo build`, which links the
# vLLM sidecar's `mm-routing` here (and into LPX) too. Enable it so the SBOMs
# list what the binaries link; nothing in this sidecar calls it.
dynamo-llm = { path = "../../llm", default-features = false, features = ["mm-routing"] }
dynamo-runtime = { workspace = true }

anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
futures = { workspace = true }
hmac = "0.12"
sha2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
dynamo-backend-common = { workspace = true, features = ["testing"] }
tokio-stream = { workspace = true, features = ["net"] }
