[package]
name = "dynamo-direct-register"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Engine-agnostic direct-backend discoverability shim: registers a stock engine's gRPC endpoint + model card in Dynamo discovery and health-gates its liveness, without the backend-common LLMEngine/Worker lifecycle."

[dependencies]
dynamo-llm = { path = "../../llm", default-features = false }
dynamo-runtime = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
