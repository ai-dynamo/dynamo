[package]
name = "dynamo-mocker"
description = "Mock LLM scheduler and KV manager for testing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
profile = []
# Benchmark builds for replay parity tooling. Canonical (seeded) replay needs no
# feature: a caller opts in per replay with ReplayDeterminism::CanonicalV1.
replay-bench = ["aisimulate-core/replay-bench", "dynamo-kv-router/bench", "dynamo-kv-indexer/bench", "dynamo-scheduler/bench", "dynamo-slot-tracker/bench"]
test-support = []
zmq-events = ["dep:tmq"]

[dependencies]
dynamo-custom-policy-builtin = { workspace = true }
# repo
aisimulate-core = { workspace = true }
dynamo-admission = { workspace = true }
dynamo-kv-events = { workspace = true }
dynamo-kv-hashing = { workspace = true }
dynamo-kv-indexer = { workspace = true }
dynamo-kv-router = { workspace = true }
dynamo-router-protocol = { workspace = true }
dynamo-scheduler = { workspace = true }
dynamo-session-affinity = { workspace = true }
dynamo-slot-tracker = { workspace = true }
dynamo-tokens = { workspace = true }
dynamo-worker-selection = { workspace = true }

# workspace
anyhow = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
tmq = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }

# crate-specific
ndarray = "0.16"
ndarray-npy = "0.9"
ndarray-interp = "0.5"
rustc-hash = "2"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-timerfd = "0.2"

[dev-dependencies]
dynamo-kv-router = { workspace = true, features = ["metrics"] }
rstest = "0.18.2"
tempfile = { workspace = true }
tmq = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
