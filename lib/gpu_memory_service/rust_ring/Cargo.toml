[workspace]
# standalone crate — keep out of any parent workspace

[package]
name = "gms_rust_ring"
version = "0.1.0"
edition = "2021"
authors = ["NVIDIA"]
license = "Apache-2.0"
description = "Native hot-path SPSC ring push/pop for GMS RestoreRing"

[lib]
name = "gms_rust_ring"
crate-type = ["cdylib"]

[dependencies]
# The ring uses PyBuffer, which PyO3 cannot expose through Python's limited
# API before 3.11. The wheel already contains a CPython-specific C++
# extension, so an abi3 Rust artifact would not make the wheel portable.
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
