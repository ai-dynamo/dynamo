[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-memory-service"
version = "0.9.0"
description = "GPU Memory Service for Dynamo - CUDA VMM-based GPU memory allocation and sharing"
readme = "README.md"
authors = [
    { name = "NVIDIA Inc.", email = "sw-dl-dynamo@nvidia.com" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "msgspec>=0.18.0",
    "uvloop>=0.21.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
]
keywords = ["llm", "genai", "inference", "nvidia", "gpu", "memory", "dynamo"]

# vLLM loads general plugins from EngineCore.__init__, the process that owns
# the scheduler and its BlockPool at any TP. Importing the GMS worker module is
# not enough: at TP>1 that happens only in the worker children. Self-disables
# unless GMS_KV_INDEX_PATH is set.
#
# Declared here, not in setup.py: this file has a [project] table, which
# replaces setup()'s entry_points wholesale rather than merging with it.
[project.entry-points."vllm.general_plugins"]
gms_kv_index = "gpu_memory_service.integrations.vllm.kv_index:enable_kv_index"

[project.scripts]
gpu-memory-service = "gpu_memory_service.cli.runner:main"
gms-storage-client = "gpu_memory_service.cli.storage_runner:main"

[project.optional-dependencies]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio",
]
