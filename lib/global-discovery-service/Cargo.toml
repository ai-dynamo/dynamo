[package]
name = "dynamo-global-discovery-service"
description = "Pool discovery for the Global Router, served over HTTP"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "global-discovery-service"
path = "src/main.rs"

[features]
# `--registration-storage dynamodb`. Off by default, so that workspace builds
# skip the AWS SDK; the image turns it on.
dynamodb = ["dep:aws-config", "dep:aws-sdk-dynamodb", "dep:serde_json"]

[dependencies]
dynamo-global-common = { workspace = true }
dynamo-http-server = { workspace = true }
dynamo-runtime = { workspace = true }

anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
# The same AWS SDK set-up as lib/kvbm-engine's `s3` feature.
aws-config = { version = "1.8.11", optional = true }
aws-sdk-dynamodb = { version = "1.105.0", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
axum = { workspace = true }
clap = { version = "4.5.49", features = ["derive"] }
futures = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
dynamo-global-discovery-client = { path = "../global-discovery-client" }

reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
