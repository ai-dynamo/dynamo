[package]
name = "dynamo-aiperf-sim"
description = "Static Dynamo KV-router provider for AIPerf simulation bundles"
version = "1.5.0"
edition = "2024"
authors = ["NVIDIA Inc. <sw-dl-dynamo@nvidia.com>"]
license = "Apache-2.0"
homepage = "https://github.com/ai-dynamo/dynamo"
repository = "https://github.com/ai-dynamo/dynamo.git"
publish = false

# This source-integration crate is deliberately not a member of Dynamo's
# production workspace. It pins the unpublished AIPerf provider API to one
# immutable source revision without making ordinary Dynamo resolution depend
# on the integration graph.
[workspace]
resolver = "3"

[dependencies]
# AIPerf's source-level Rust provider contract is not published as independent
# crates. Pin every AIPerf package to the same immutable repository revision so
# a clean checkout resolves one coordinated composition surface.
aiperf-runtime = { path = "../../../../dynamic-simulation-abi/crates/runtime" }
aiperf-simulate = { path = "../../../../dynamic-simulation-abi/crates/simulate", features = ["dynamic-steppable-abi"] }
aiperf-protocol = { path = "../../../../dynamic-simulation-abi/crates/protocol" }
aisimulate-core = { path = "../../../aisimulate-dynamic-abi/crates/core" }
anyhow = "1"
dynamo-kv-router = { path = "../kv-router", features = ["bench"] }
dynamo-mocker = { path = "../mocker", features = ["replay-bench"] }

[dev-dependencies]
aiperf-runtime = { path = "../../../../dynamic-simulation-abi/crates/runtime", features = ["test-support"] }
aiperf-steppable-abi = { path = "../steppable-abi", version = "0.13.0" }
dynamo-steppable-provider = { path = "../steppable-provider" }
serde_json = "1"
uuid = "1"
