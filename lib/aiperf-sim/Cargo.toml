[package]
name = "dynamo-aiperf-sim"
description = "Static Dynamo KV-router provider for AIPerf simulation bundles"
version = "1.5.0"
edition = "2024"
authors = ["NVIDIA Inc. <sw-dl-dynamo@nvidia.com>"]
license = "Apache-2.0"
homepage = "https://github.com/ai-dynamo/dynamo"
repository = "https://github.com/ai-dynamo/dynamo.git"
publish = false

# This source-integration fixture is deliberately not a member of Dynamo's
# production workspace. AIPerf's provider API is not published independently,
# so local development supplies its sibling checkout explicitly without making
# ordinary Dynamo resolution depend on that checkout.
[workspace]
resolver = "3"

[dependencies]
# Development-only sibling-worktree composition: AIPerf's source-level Rust
# provider contract is not published independently. A distributable bundle
# must replace these paths with one coordinated, reproducible source release.
aiperf-runtime = { path = "../../../../dynamic-simulation-abi/crates/runtime" }
aiperf-simulate = { path = "../../../../dynamic-simulation-abi/crates/simulate" }
aiperf-protocol = { path = "../../../../dynamic-simulation-abi/crates/protocol" }
aisimulate-core = { git = "https://github.com/ai-dynamo/aisimulate.git", rev = "4fd8aaabb68008e15ada1bb1750183968d56b0eb" }
anyhow = "1"
dynamo-kv-router = { path = "../kv-router", features = ["bench"] }
dynamo-mocker = { path = "../mocker", features = ["replay-bench"] }

[dev-dependencies]
aiperf-runtime = { path = "../../../../dynamic-simulation-abi/crates/runtime", features = ["test-support"] }
serde_json = "1"
