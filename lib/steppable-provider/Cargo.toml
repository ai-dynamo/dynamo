[package]
name = "dynamo-steppable-provider"
description = "Benchmark-only monolithic Dynamo KV-router SteppableReplay provider"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aiperf-steppable-abi = { path = "../steppable-abi", version = "0.13.0" }
aisimulate-core = { workspace = true }
anyhow = { workspace = true }
dynamo-mocker = { workspace = true, features = ["replay-bench"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
