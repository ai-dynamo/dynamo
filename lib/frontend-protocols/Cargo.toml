[package]
name = "dynamo-frontend-protocols"
description = "Request and response protocols of the Dynamo frontend and the messages it exchanges with workers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
# Adds the video variant to the decoded-media metadata. dynamo-llm forwards its own
# media-ffmpeg feature here so the frontend and the wire type agree on the variant.
media-ffmpeg = []
# Exports the `test_fixtures` modules that dynamo-llm's tests reuse.
testing = []

[dependencies]
# repo
dynamo-admission = { workspace = true }
dynamo-kv-hashing = { workspace = true }
dynamo-kv-hints = { workspace = true }
dynamo-lora = { workspace = true }
dynamo-model-card = { workspace = true }
dynamo-router-protocol = { workspace = true }
dynamo-runtime = { workspace = true }
dynamo-scheduler = { workspace = true }

# published
dynamo-parsers = { workspace = true }
dynamo-parsers-v2 = { workspace = true }
dynamo-protocols = { workspace = true, features = ["protocol-schema"] }
dynamo-renderer = { workspace = true }
dynamo-tokenizers = { workspace = true }

# workspace
anyhow = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
bytes = { workspace = true }
chrono = { workspace = true }
derive_builder = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }
xxhash-rust = { workspace = true }

base64 = { version = "0.22" }
half = { version = "2", features = ["serde", "num-traits"] }
# "preserve_order" keeps JSON object keys in client order through template rendering;
# see the note on the same dependency in dynamo-llm.
minijinja = { version = "2.21.0", features = ["loader", "loop_controls", "preserve_order"] }
percent-encoding = "2.3.2"
rmp-serde = "1.3"
sha2 = "0.10"
utoipa = { version = "5.3", features = ["axum_extras", "rc_schema", "preserve_order"] }

[dev-dependencies]
dynamo-runtime = { workspace = true, features = ["testing"] }
rstest = "0.18.2"
tempfile = { workspace = true }
tokenizers = { version = "0.23.2", default-features = false, features = [
  "onig",
  "esaxx_fast",
  "rustls-tls",
] }
tokio = { workspace = true, features = ["test-util"] }
