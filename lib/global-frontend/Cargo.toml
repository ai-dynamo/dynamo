[package]
name = "dynamo-global-frontend"
description = "Global Frontend: serves the OpenAI API and forwards each request to a pool frontend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "global-frontend"
path = "src/main.rs"

[dependencies]
dynamo-global-common = { workspace = true }
dynamo-global-router = { path = "../global-router" }
# For the PoolRelay protocol and the session header. The block manager is
# for workers; a frontend that only forwards requests never uses it.
dynamo-llm = { path = "../llm", default-features = false }
dynamo-runtime = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
clap = { version = "4.5.49", features = ["derive"] }
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
