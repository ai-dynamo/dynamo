[package]
name = "dynamo-global-frontend"
description = "Global Frontend: serves the OpenAI API and forwards each request to a pool frontend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "global-frontend"
path = "src/main.rs"

[dependencies]
dynamo-global-common = { workspace = true }
dynamo-global-router = { workspace = true }
dynamo-global-router-store-dynamodb = { workspace = true }
# For the PoolRelay protocol and the session header.
dynamo-llm = { workspace = true }
dynamo-runtime = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-sdk-dynamodb = { workspace = true }
axum = { workspace = true }
clap = { version = "4.5.49", features = ["derive", "env"] }
futures = { workspace = true }
prometheus = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
