# Optional overlay: authenticate the mocker demo's etcd control plane.
#
# The base docker-compose.yml runs etcd with ALLOW_NONE_AUTHENTICATION=yes.
# Layer this file on top to require a root password and hand the same
# credentials to the frontend + mocker-backend services:
#
#   export ETCD_ROOT_PASSWORD=$(openssl rand -hex 16)
#   docker compose -f docker-compose.yml -f docker-compose.etcd-auth.yml up --build
#
# The dynamo-runtime etcd client consumes ETCD_AUTH_USERNAME/ETCD_AUTH_PASSWORD
# (lib/runtime/src/transports/etcd.rs). For mutual-TLS instead of a password,
# set ETCD_AUTH_CA / ETCD_AUTH_CLIENT_CERT / ETCD_AUTH_CLIENT_KEY and mount the
# certs into each service.

services:
  etcd-server:
    environment:
      # Setting ETCD_ROOT_PASSWORD makes the Bitnami entrypoint create the
      # `root` user and enable auth on first boot. `:?` fails fast if auth is
      # requested but no password was supplied.
      - ALLOW_NONE_AUTHENTICATION=no
      - ETCD_ROOT_PASSWORD=${ETCD_ROOT_PASSWORD:?set ETCD_ROOT_PASSWORD to enable etcd auth}
    healthcheck:
      # `endpoint health` returns permission-denied (treated as healthy) even
      # without credentials, but pass root creds so the probe is unambiguous.
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "--user", "root:${ETCD_ROOT_PASSWORD}", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s

  frontend:
    environment:
      - ETCD_AUTH_USERNAME=root
      - ETCD_AUTH_PASSWORD=${ETCD_ROOT_PASSWORD:?set ETCD_ROOT_PASSWORD to enable etcd auth}

  mocker-backend:
    environment:
      - ETCD_AUTH_USERNAME=root
      - ETCD_AUTH_PASSWORD=${ETCD_ROOT_PASSWORD:?set ETCD_ROOT_PASSWORD to enable etcd auth}
