syntax = "proto3";

package dynamo.kvrelay.v1;

// Every top-level request and response carries contract_marker so messages
// from the retired branch-local v1 schema fail closed.
service KvEventRelay
{
  rpc GetRelayInfo(RelayInfoRequest) returns (RelayInfo);
  rpc WatchKvPoolCatalog(WatchKvPoolCatalogRequest) returns (stream KvPoolCatalogUpdate);
  rpc SubscribeKvPool(SubscribeKvPoolRequest) returns (stream FilterUpdate);
  rpc SubscribeServingReadiness(SubscribeServingReadinessRequest) returns (stream ServingReadinessUpdate);
  rpc SubscribeKvPoolLoad(SubscribeKvPoolLoadRequest) returns (stream KvPoolLoadUpdate);
}

enum IdentitySource {
  IDENTITY_SOURCE_UNSPECIFIED = 0;
  IDENTITY_SOURCE_DEFAULT_DERIVED = 1;
  IDENTITY_SOURCE_EXPLICIT = 2;
}

enum FilterUpdateKind {
  FILTER_UPDATE_KIND_UNSPECIFIED = 0;
  FILTER_UPDATE_KIND_SNAPSHOT_CHUNK = 1;
  FILTER_UPDATE_KIND_DELTA = 2;
  FILTER_UPDATE_KIND_HEARTBEAT = 3;
}

enum ServingReadinessState {
  SERVING_READINESS_STATE_UNKNOWN = 0;
  SERVING_READINESS_STATE_UNAVAILABLE = 1;
  SERVING_READINESS_STATE_READY = 2;
}

message RelayIdentity
{
  fixed64 drt_instance_id = 1;
  fixed64 relay_incarnation = 2;
}

message DigestIdentity
{
  bytes digest = 1;
  IdentitySource source = 2;
}

message IndexerDomainId
{
  DigestIdentity cache_semantics = 1;
  DigestIdentity routing_scope = 2;
}

message KvPoolId
{
  uint32 identity_version = 1;
  IndexerDomainId indexer_domain = 2;
  fixed64 dc_id = 3;
}

message CkfFormat
{
  uint32 format_version = 1;
  fixed64 seed = 2;
  uint64 bucket_count = 3;
  uint32 fingerprint_bits = 4;
  uint32 slots_per_bucket = 5;
}

message ProducerIdentity
{
  KvPoolId pool_id = 1;
  fixed64 producer_incarnation = 2;
  uint64 layout_generation = 3;
  CkfFormat ckf_format = 4;
}

message DynamoEndpointId
{
  string namespace = 1;
  string component = 2;
  string endpoint = 3;
}

message BaseModelTarget
{
  string base_model = 1;
}

message LoraModelTarget
{
  string base_model = 1;
  string adapter = 2;
}

message ModelTarget
{
  oneof target
  {
    BaseModelTarget base = 1;
    LoraModelTarget lora = 2;
  }
}

message ModelRegistration
{
  string canonical_model_id = 1;
  ModelTarget target = 2;
  repeated string aliases = 3;
}

message KvPoolDescriptor
{
  ProducerIdentity producer = 1;
  DynamoEndpointId serving_endpoint = 2;
  repeated ModelRegistration registrations = 3;
}

message KvPoolCatalogSnapshot
{
  repeated KvPoolDescriptor pools = 1;
}

message RelayInfoRequest
{
  fixed32 contract_marker = 127;
}

message RelayInfo
{
  uint32 protocol_version = 1;
  RelayIdentity relay = 2;
  fixed32 contract_marker = 127;
}

message WatchKvPoolCatalogRequest
{
  string subscriber_id = 1;
  fixed32 contract_marker = 127;
}

message KvPoolCatalogUpdate
{
  uint32 protocol_version = 1;
  RelayIdentity relay = 2;
  uint64 revision = 3;
  KvPoolCatalogSnapshot snapshot = 4;
  fixed32 contract_marker = 127;
}

message SubscribeKvPoolRequest
{
  string subscriber_id = 1;
  KvPoolId pool_id = 2;
  fixed32 contract_marker = 127;
}

message FilterUpdate
{
  uint32 protocol_version = 1;
  RelayIdentity relay = 2;
  ProducerIdentity producer = 3;
  uint64 base_sequence = 4;
  uint64 sequence = 5;
  uint64 send_ts_us = 6;
  FilterUpdateKind kind = 7;
  bytes payload = 8;
  fixed32 contract_marker = 127;
}

message SubscribeServingReadinessRequest
{
  string subscriber_id = 1;
  fixed32 contract_marker = 127;
}

message ServingReadinessEntry
{
  ProducerIdentity producer = 1;
  string canonical_model_id = 2;
  ModelTarget target = 3;
  ServingReadinessState state = 4;
  repeated string present_roles = 5;
  repeated string missing_roles = 6;
}

message ServingReadinessUpdate
{
  uint32 protocol_version = 1;
  RelayIdentity relay = 2;
  uint64 revision = 3;
  repeated ServingReadinessEntry entries = 4;
  fixed32 contract_marker = 127;
}

message SubscribeKvPoolLoadRequest
{
  string subscriber_id = 1;
  fixed32 contract_marker = 127;
}

message KvPoolLoadEntry
{
  ProducerIdentity producer = 1;
  uint64 kv_used_blocks = 2;
  uint64 total_kv_blocks = 3;
  uint32 kv_observed_ranks = 4;
  uint32 kv_expected_ranks = 5;
  uint64 active_decode_blocks = 6;
  uint32 decode_observed_ranks = 7;
  uint32 decode_expected_ranks = 8;
  uint64 active_prefill_tokens = 9;
  uint64 prefill_token_capacity = 10;
  uint32 prefill_observed_ranks = 11;
  uint32 prefill_expected_ranks = 12;
}

message KvPoolLoadUpdate
{
  uint32 protocol_version = 1;
  RelayIdentity relay = 2;
  uint64 window_sequence = 3;
  uint64 observed_ms = 4;
  uint64 window_ms = 5;
  repeated KvPoolLoadEntry pools = 6;
  fixed32 contract_marker = 127;
}
