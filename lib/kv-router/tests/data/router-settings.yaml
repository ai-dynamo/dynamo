router:
  host_cache_hit_weight: 0.6
  disk_cache_hit_weight: 0.1
  use_kv_events: true
  router_replica_sync: true
  router_track_active_blocks: true
  router_track_output_blocks: true
  router_assume_kv_reuse: false
  router_track_prefill_tokens: true
  router_tracking_hash: public-xxh3-v1
  router_tracking_key_file: null
  router_tracking_key_id: null
  router_prefill_load_model: none
  router_ttl_secs: 42.0
  router_approximate_cache_policy: ttl
  router_event_threads: 2
  use_remote_indexer: false
  serve_indexer: false
  enable_session_prefix_index: true
  shared_cache_type: none
  router_predicted_ttl_secs: null
  enable_decode_to_prefill_reuse: false
  enable_decode_to_prefill_gpu_reuse: false
  transfer_source_lookup_budget_ms: 8
  minimum_transfer_prefix_blocks: 2
  minimum_estimated_ttft_saving_ms: 0.5
  transfer_source_estimated_block_us: 12.0
  transfer_source_gpu_estimated_block_us: null
  transfer_source_prefill_token_us: 3.0
