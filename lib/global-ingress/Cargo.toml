[package]
name = "dynamo-global-ingress"
description = "Global Frontend: serves the OpenAI API and forwards each request to a pool frontend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "global-ingress"
path = "src/main.rs"

[dependencies]
dynamo-global-discovery-client = { path = "../global-discovery-client" }
dynamo-global-router = { path = "../global-router" }
dynamo-global-router-shared = { path = "../global-router-shared" }
# The block manager serves workers. A frontend that only forwards requests
# never uses it.
dynamo-llm = { path = "../llm", default-features = false }
dynamo-protocols = { workspace = true }
dynamo-runtime = { workspace = true }

anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4.5.49", features = ["derive"] }
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
dynamo-global-discovery-service = { path = "../global-discovery-service" }

axum = { workspace = true }
