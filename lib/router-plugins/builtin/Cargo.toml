[package]
name = "dynamo-custom-policy-builtin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Router plugins shipped with Dynamo"

[features]
default = ["thunderagent"]
thunderagent = ["dep:async-trait", "dep:parking_lot", "dep:thiserror", "dep:tokio", "dep:tracing"]

[dependencies]
dynamo-kv-router = { workspace = true, features = ["standalone-selection"] }
serde.workspace = true
async-trait = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-util = { workspace = true }
