[package]
name = "dynamo-placement-plugin"
description = "Dynamo KV-router placement provider for the AISimulate dynamic ABI"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aisimulate-core = { workspace = true }
aisimulate-placement-abi = { path = "../placement-abi", version = "0.12.0" }
dynamo-mocker = { workspace = true, features = ["replay-bench"] }
dynamo-kv-router = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
