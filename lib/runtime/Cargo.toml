[package]
name = "dynamo-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Dynamo Runtime Library"

[package.metadata.cargo-machete]
# nvtx is depended on for the static C library its build script compiles with
# `cc`, not for its Rust API: src/nvtx.rs declares the `ffi_*` symbols itself so
# the signatures match nvtx-sys/export.c (the upstream `ffi_range_end` binding
# does not) and so marker names cannot panic on an interior NUL. No Rust path
# names the crate, which is exactly the case machete cannot see.
ignored = ["mio", "nvtx"]

[features]
default = []
integration = []
testing-etcd = [] # Tests that require an active ETCD server
# White-box helpers for cross-crate lifecycle tests. Never enabled by a normal build.
testing = []
tokio-console = ["dep:console-subscriber", "tokio/tracing"]
compute-validation = [] # Enable validation and timing for compute macros
tcp-low-latency = [] # Enable Linux-specific TCP optimizations (TCP_QUICKACK, SO_BUSY_POLL)
# NVTX v3 timeline annotations for Nsight Systems (compile-time off; also gated at runtime by DYN_NVTX).
# Overhead: feature off = zero. Feature on, env off = an inlined relaxed atomic load plus a
# predictable branch. Feature on, env on = two heap allocations (the crate renders the name with
# to_string() then copies it into a CString) plus the injection-library call. See lib/runtime/src/nvtx.rs.
nvtx = ["dep:nvtx"]

[dependencies]
# repo
dynamo-truthy = { workspace = true }

# Use workspace dependencies where available
anyhow = { workspace = true }
async-nats = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
tmq = { workspace = true }
lru = { version = "0.16" }
axum = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
derive_builder = { workspace = true }
derive-getters = { workspace = true }
either = { workspace = true }
etcd-client = { workspace = true }
fastrand = "2"
futures = { workspace = true }
fs4 = { workspace = true }
humantime = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
prometheus = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
mio = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
validator = { workspace = true }
xxhash-rust = { workspace = true }

# NVTX v3: header-only, statically linked by the crate's build script. Unlike the
# NVTX v2 C API (nvToolsExt), this needs no shared library at runtime — the stubs
# bind to the profiler's injection library via NVTX_INJECTION64_PATH on first use.
nvtx = { version = "1.3", optional = true }

arc-swap = { version = "1" }
crossbeam-queue = { version = "0.3" }
async-once-cell = { version = "0.5.4" }
bincode = { version = "1" }
console-subscriber = { version = "0.4", optional = true }
educe = { version = "0.6.0" }
figment = { version = "0.10.19", features = ["env", "json", "toml", "test"] }
# FSEvents omits deletes for FileStore's revision-zero hard-link publication path.
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }
local-ip-address = { version = "0.6.3" }
# `release_max_level_debug` compiles out `log::trace!` in release builds (a
# compile-time `STATIC_MAX_LEVEL` check — no runtime cost, cannot be overridden).
# Dependencies that log through the `log` crate — notably HF `tokenizers`, whose
# `NormalizedString::transform_range` emits a `log::trace!` *per character*
# during normalization — otherwise route tens of thousands of filtered-out
# events per request through the `log`->tracing bridge + EnvFilter, which
# profiling showed costing ~half the frontend CPU on the stock-tokenizer path.
# We cap at `debug` (not `info`) so `log::debug!` from deps and Dynamo's own
# `log::debug!` (e.g. the NATS transport) are still available in release; only
# the per-char `trace!` spam is removed. Dynamo's own logging is `tracing` (a
# separate crate), so `DYN_LOG=trace` still surfaces all Dynamo logs in release.
log = { version = "0.4", features = ["release_max_level_debug"] }
nuid = { version = "0.5" }
once_cell = { version = "1" }
percent-encoding = { version = "2.3.2" } # also used by tonic, reqwest, axum, etc
rayon = { version = "1.10" }
regex = { version = "1" }
socket2 = { version = "0.5.8" }
tokio-rayon = { version = "2.1" }

# Kubernetes discovery backend
kube = { version = "2.0.1", default-features = false, features = ["runtime", "derive", "client", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.26.0", features = ["v1_32"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
rcgen = { workspace = true }
rstest = { version = "0.23.0" }
temp-env = { version = "0.3.6" , features=["async_closure"] }
stdio-override = {version= "0.2.0"}
jsonschema = {version = "0.17"}
tempfile = { workspace = true }

[[bench]]
name = "compute_pool_overhead"
harness = false

[[bench]]
name = "tcp_codec_perf"
harness = false
