[package]
name = "dynamo-admission"
description = "Admit, hold, or reject now: the Dynamo router's admission stage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[features]
default = []
# Test-only hooks consumed by dependent crates' tests; never enable in release.
testing = []

[dependencies]
dynamo-router-protocol = { workspace = true }
dynamo-session-affinity = { workspace = true }
dynamo-slot-tracker = { workspace = true }
dynamo-tokens = { workspace = true }
dynamo-worker-selection = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
ordered-float = { workspace = true }
parking_lot = { workspace = true }
rustc-hash = "2.1.1"
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
