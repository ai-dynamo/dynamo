# Before applying:
# - Replace REPLACE_WITH_TACHOMETER_IMAGE with an accessible image containing
#   /tachometer-scraper.
# - Replace REPLACE_WITH_EXISTING_PVC with a PersistentVolumeClaim that retains
#   benchmark output.
# - Replace REPLACE_WITH_RUN_ID and every REPLACE_WITH_*_HOST value.
# - Copy the worker endpoint block for every worker Pod you want to scrape.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tachometer-benchmark-config
data:
  tachometer.toml: |
    storage = "file:///data/REPLACE_WITH_RUN_ID"
    rows_per_parquet = 1000000
    save_interval_secs = 5

    [[endpoints]]
    name = "frontend-0"
    url = "http://REPLACE_WITH_FRONTEND_HOST:8000/metrics"
    frequency = 0.2
    filter = "frontend"
    [endpoints.node_metadata]
    component = "frontend"
    run_id = "REPLACE_WITH_RUN_ID"

    [[endpoints]]
    name = "worker-0"
    url = "http://REPLACE_WITH_WORKER_0_HOST:9090/metrics"
    frequency = 0.2
    filter = "backend"
    [endpoints.node_metadata]
    component = "worker"
    run_id = "REPLACE_WITH_RUN_ID"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tachometer-benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tachometer-benchmark
  template:
    metadata:
      labels:
        app: tachometer-benchmark
    spec:
      terminationGracePeriodSeconds: 300
      containers:
        - name: tachometer
          image: REPLACE_WITH_TACHOMETER_IMAGE
          command: ["/tachometer-scraper"]
          args:
            - --config
            - /etc/tachometer/tachometer.toml
            - --local-dir
            - /tmp/tachometer
          volumeMounts:
            - name: config
              mountPath: /etc/tachometer
              readOnly: true
            - name: output
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: tachometer-benchmark-config
        - name: output
          persistentVolumeClaim:
            claimName: REPLACE_WITH_EXISTING_PVC
