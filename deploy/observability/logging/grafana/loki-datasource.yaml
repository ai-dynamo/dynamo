apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  labels:
    grafana_datasource: "1"  # This label is important for the Grafana sidecar
data:
  loki-datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        # The documented stack installs Grafana and Loki in the same namespace.
        url: http://loki-gateway
        jsonData:
          maxLines: 1000
