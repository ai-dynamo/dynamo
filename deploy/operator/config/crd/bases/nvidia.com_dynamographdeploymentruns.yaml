---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
    helm.sh/resource-policy: keep
  name: dynamographdeploymentruns.nvidia.com
spec:
  group: nvidia.com
  names:
    kind: DynamoGraphDeploymentRun
    listKind: DynamoGraphDeploymentRunList
    plural: dynamographdeploymentruns
    shortNames:
      - dgdrrun
    singular: dynamographdeploymentrun
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.conditions[?(@.type=="Completed")].status
          name: Completed
          type: string
        - jsonPath: .status.progress.candidates.published
          name: Candidates
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1beta2
      schema:
        openAPIV3Schema:
          description: DynamoGraphDeploymentRun is one immutable accepted DGDR request and its execution status.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                DynamoGraphDeploymentRunSpec is an immutable snapshot of an accepted DGDR spec.
                Request admission resolves its structural defaults before the Request controller copies it;
                Request admission defaulting does not apply to Runs.

                The Run reconciler lowers this immutable typed snapshot plus inputOverrides exactly once and
                records the resulting public recommendation input in status.aisimulate.input.
              properties:
                aisimulate:
                  description: AISimulate supplies public recommendation input to the operator's AISimulate execution bundle.
                  properties:
                    inputOverrides:
                      description: |-
                        InputOverrides is an RFC 7386 JSON Merge Patch over the input lowered from
                        the typed fields. It uses the upstream AISimulate JSON contract, including
                        snake_case names. Values here take precedence, and null deletes a lowered
                        field. The dgdr_run member must remain an object, and its operator-owned
                        transport, identity, and runtime fields name, max_candidates, snapshot_dir,
                        runtime_image, runtime_version_override, derive_runtime_images,
                        num_gpus_per_node, and namespace are operator-owned. Request admission
                        rejects them, and the Run controller enforces its values while lowering the
                        immutable snapshot. The operator runs the AISimulate version from its
                        configured planner image; Requests and Runs cannot select a different image
                        or version.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  type: object
                backends:
                  description: Backends lists one or more inference backends searched by AISimulate and used by generated candidates.
                  items:
                    description: Backend identifies an inference backend searched by AISimulate and used by generated candidates.
                    enum:
                      - vllm
                      - sglang
                      - trtllm
                    type: string
                  minItems: 1
                  type: array
                  x-kubernetes-list-type: set
                hardware:
                  description: |-
                    Hardware bounds the accelerator configurations evaluated by the search.
                    When omitted, admission discovers SKU, budget and node width. An exactly empty object opts
                    out of operator hardware discovery and typed defaults. Admission completes every nonempty
                    object with any missing hardware values; explicit values remain authoritative.
                  properties:
                    gpu:
                      description: |-
                        GPU describes accelerator identity and the maximum allocation per candidate.
                        In a nonempty hardware object, admission resolves an omitted SKU or budget from the cluster.
                      properties:
                        budget:
                          description: |-
                            Budget is the maximum total number of GPUs one candidate may use.
                            When omitted for a known SKU, admission derives the available GPU budget from the cluster.
                            An SKU unknown to the bundled AISimulate catalog requires an explicit `budget` and an
                            explicit `numGpusPerNode` in the parent hardware object.
                          format: int32
                          minimum: 1
                          type: integer
                        sku:
                          description: |-
                            SKU identifies the accelerator using the AISimulate hardware catalog name.
                            Known values in the bundled AISimulate release are `a100_pcie`, `a100_sxm`,
                            `a30`, `b200_sxm`, `b300_sxm`, `b60`, `gb200`, `gb300`, `h100_pcie`,
                            `h100_sxm`, `h200_sxm`, `l4`, `l40s`, and `rtx_pro_6000_server`.
                            The field remains open so an external AISimulate systems catalog can add identifiers.
                            Admission passes an unknown identifier through unchanged and warns when `budget` and the
                            parent `numGpusPerNode` are also explicit. Without both, it rejects the identifier because
                            cluster discovery cannot associate capacity or topology with it. When omitted from a
                            nonempty hardware object, admission discovers the accelerator.
                          minLength: 1
                          type: string
                      type: object
                    numGpusPerNode:
                      description: |-
                        NumGPUsPerNode is the number of GPUs available to one candidate on each node. It lowers
                        to AISimulate's num_gpus_per_node input.
                        An explicit value is authoritative. In a nonempty hardware object, admission discovers
                        an omitted value from the selected cluster node shape. The Run controller never discovers
                        this value. An exactly empty hardware object opts out of all operator hardware discovery
                        and typed hardware defaults, leaving AISimulate input and defaults authoritative.
                      format: int32
                      minimum: 1
                      type: integer
                  type: object
                model:
                  description: Model identifies the model whose deployment configurations are evaluated.
                  properties:
                    name:
                      description: Name identifies the model in the syntax accepted by the selected backend.
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                objective:
                  description: |-
                    Objective defines scalar optimization. When omitted,
                    admission supplies the object. Its mode defaults to Optimize, its scalar metric defaults
                    to ThroughputPerGPU, and its absent SLA defaults to TTFT 2000 ms and ITL 30 ms.
                  properties:
                    metric:
                      description: |-
                        Metric is the scalar target when mode is Optimize.
                        When omitted in Optimize mode, admission defaults it to ThroughputPerGPU.
                      enum:
                        - Throughput
                        - ThroughputPerGPU
                        - ThroughputPerUser
                        - TTFT
                        - E2ELatency
                        - Goodput
                        - GoodputPerGPU
                      type: string
                    metrics:
                      description: Metrics is reserved for the future Pareto implementation.
                      items:
                        description: ObjectiveMetric is a metric optimized by AISimulate.
                        enum:
                          - Throughput
                          - ThroughputPerGPU
                          - ThroughputPerUser
                          - TTFT
                          - E2ELatency
                          - Goodput
                          - GoodputPerGPU
                        type: string
                      maxItems: 2
                      minItems: 2
                      type: array
                      x-kubernetes-list-type: set
                    mode:
                      description: Mode selects scalar optimization. Only Optimize is currently supported.
                      enum:
                        - Optimize
                      type: string
                    sla:
                      description: |-
                        SLA defines per-request latency bounds used to calculate goodput. Admission defaults an
                        omitted SLA to TTFT 2000 ms and ITL 30 ms. An explicit empty object opts out of those
                        defaults. spec.aisimulate.inputOverrides.evaluation.sla overrides the bounds it names.
                      properties:
                        e2eMs:
                          description: E2EMs is an alternative end-to-end bound in milliseconds.
                          exclusiveMinimum: true
                          minimum: 0
                          type: number
                        itlMs:
                          description: ITLMs is the Inter-Token Latency bound in milliseconds.
                          exclusiveMinimum: true
                          minimum: 0
                          type: number
                        ttftMs:
                          description: TTFTMs is the Time To First Token bound in milliseconds.
                          exclusiveMinimum: true
                          minimum: 0
                          type: number
                      type: object
                      x-kubernetes-validations:
                        - message: e2eMs cannot be combined with ttftMs or itlMs
                          rule: '!has(self.e2eMs) || (!has(self.ttftMs) && !has(self.itlMs))'
                  type: object
                  x-kubernetes-validations:
                    - message: metrics is reserved for the future Pareto implementation
                      rule: '!has(self.metrics)'
                    - message: Goodput and GoodputPerGPU require at least one SLA bound
                      rule: '!(has(self.metric) && self.metric in [''Goodput'', ''GoodputPerGPU'']) || (has(self.sla) && (has(self.sla.ttftMs) || has(self.sla.itlMs) || has(self.sla.e2eMs)))'
                overrides:
                  description: Overrides customizes the generated DGD without changing AISimulate execution.
                  properties:
                    dgd:
                      description: |-
                        DGD is one partial nvidia.com/v1beta1 DynamoGraphDeployment applied by the publisher
                        using the DGD structural merge rules. Other API versions are not supported.
                        Application is atomic: a merge failure retains the unchanged generated deployment
                        with Valid=False. A successful merge is checked by strict server-side dry-run;
                        the dry-run response and its defaults are discarded. The Candidate retains the
                        unpruned payload from before the check. Invalid Candidates count toward maxCandidates.
                        Overrides may change any deployment configuration. Evaluation metrics are not
                        recomputed and continue to describe the original AISimulate configuration.
                        DGD labels and annotations become Candidate labels and annotations. Other metadata
                        and publisher-owned keys cannot be overridden; such attempts fail atomically.
                      type: object
                      x-kubernetes-embedded-resource: true
                      x-kubernetes-preserve-unknown-fields: true
                  type: object
                recommendation:
                  description: Recommendation controls bounded projection into DGDC resources.
                  properties:
                    maxCandidates:
                      description: |-
                        MaxCandidates is the maximum number of DGDCs owned by one run. Scalar
                        candidates are ordered best first.
                        This field does not limit internal trials.
                      format: int32
                      maximum: 100
                      minimum: 1
                      type: integer
                  type: object
                workload:
                  description: |-
                    Workload defines the synthetic traffic model used for every candidate evaluation.
                    When omitted, admission supplies 1024 input tokens, 128 output tokens and concurrency 10;
                    an explicit empty workload receives the same shape. workload.static: {} opts out of all
                    traffic defaults. Any other static object is completed with its missing defaults.
                    spec.aisimulate.inputOverrides is applied as an RFC 7386 JSON Merge Patch and wins over
                    every lowered traffic field it names.
                    The default evaluates a fixed concurrency, so it does not create a KV-capacity-fraction
                    search. Lowering independently defaults optimizer.max_trials to 320.
                  properties:
                    static:
                      description: |-
                        Static defines AISimulate synthetic traffic. When omitted, admission supplies the
                        complete static default. An explicit empty object opts out; any nonempty object is
                        completed with omitted inputTokens, outputTokens and load defaults.
                      properties:
                        inputTokens:
                          description: InputTokens is the synthetic request input length in tokens.
                          format: int32
                          minimum: 1
                          type: integer
                        load:
                          description: |-
                            Load selects the synthetic load model. When omitted from a nonempty static
                            workload, admission defaults it to concurrency 10.
                          properties:
                            concurrency:
                              description: Concurrency is a fixed closed-loop in-flight request cap.
                              format: int32
                              minimum: 1
                              type: integer
                            kvCapacityFraction:
                              description: KVCapacityFraction derives concurrency from each candidate's estimated KV capacity.
                              properties:
                                range:
                                  description: Range searches fractions between min and max.
                                  properties:
                                    max:
                                      description: Max is the upper end of the searched fraction range.
                                      exclusiveMinimum: true
                                      maximum: 1
                                      minimum: 0
                                      type: number
                                    min:
                                      description: Min is the lower end of the searched fraction range.
                                      exclusiveMinimum: true
                                      maximum: 1
                                      minimum: 0
                                      type: number
                                  required:
                                    - max
                                    - min
                                  type: object
                                  x-kubernetes-validations:
                                    - message: min must be less than max
                                      rule: self.min < self.max
                                value:
                                  description: |-
                                    Value uses a fixed fraction of the candidate's KV capacity. A value of 1
                                    uses its full estimated capacity.
                                  exclusiveMinimum: true
                                  maximum: 1
                                  minimum: 0
                                  type: number
                              type: object
                              x-kubernetes-validations:
                                - message: exactly one of value or range must be specified
                                  rule: '(has(self.value) ? 1 : 0) + (has(self.range) ? 1 : 0) == 1'
                            requestsPerSecond:
                              description: RequestsPerSecond is a fixed open-loop arrival rate.
                              exclusiveMinimum: true
                              minimum: 0
                              type: number
                          type: object
                          x-kubernetes-validations:
                            - message: exactly one of requestsPerSecond, concurrency, or kvCapacityFraction must be specified
                              rule: '(has(self.requestsPerSecond) ? 1 : 0) + (has(self.concurrency) ? 1 : 0) + (has(self.kvCapacityFraction) ? 1 : 0) == 1'
                        outputTokens:
                          description: OutputTokens is the synthetic request output length in tokens.
                          format: int32
                          minimum: 1
                          type: integer
                      type: object
                  type: object
              type: object
              x-kubernetes-validations:
                - message: spec must be a fully resolved Request admission snapshot
                  rule: has(self.model) && has(self.backends) && size(self.backends) > 0 && has(self.hardware) && ((!has(self.hardware.gpu) && !has(self.hardware.numGpusPerNode)) || (has(self.hardware.gpu) && has(self.hardware.gpu.sku) && has(self.hardware.gpu.budget) && has(self.hardware.numGpusPerNode))) && has(self.workload) && has(self.workload.static) && ((!has(self.workload.static.inputTokens) && !has(self.workload.static.outputTokens) && !has(self.workload.static.load)) || (has(self.workload.static.inputTokens) && has(self.workload.static.outputTokens) && has(self.workload.static.load))) && has(self.objective) && has(self.objective.mode) && has(self.objective.metric) && has(self.objective.sla) && has(self.recommendation) && has(self.recommendation.maxCandidates) && self.recommendation.maxCandidates > 0
            status:
              description: DynamoGraphDeploymentRunStatus represents one search execution's observed state.
              properties:
                aisimulate:
                  description: AISimulate reports the effective input executed by AISimulate.
                  properties:
                    input:
                      description: |-
                        Input is the fully lowered AISimulate input after typed fields, derived defaults and
                        spec.aisimulate.inputOverrides have been merged. Field names and nesting use the
                        upstream AISimulate JSON contract.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  type: object
                candidateRefs:
                  description: |-
                    CandidateRefs identifies the current bounded DGDC projection. List order
                    represents rank, best first, for scalar searches.
                  items:
                    description: |-
                      LocalObjectReference contains enough information to let you locate the
                      referenced object inside the same namespace.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  type: array
                completionTime:
                  description: CompletionTime is present only after a terminal outcome.
                  format: date-time
                  type: string
                conditions:
                  description: Conditions contains standard Kubernetes conditions merged by type.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                jobRef:
                  description: JobRef identifies the controller-owned Job for this run.
                  properties:
                    name:
                      description: Name is the resource name.
                      type: string
                    uid:
                      description: UID is the resource UID.
                      type: string
                  required:
                    - name
                  type: object
                lastProgressTime:
                  description: |-
                    LastProgressTime is the latest coarse-grained progress update or heartbeat.
                    Writers should update it periodically, not for every evaluation.
                  format: date-time
                  type: string
                phase:
                  description: Phase is a concise presentation state. Conditions remain authoritative.
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                  type: string
                progress:
                  description: Progress contains branch-aware optimizer and evaluation outcome counters.
                  properties:
                    branches:
                      description: Branches reports independently optimized AISimulate branches.
                      items:
                        description: BranchProgress reports progress for one independently optimized AISimulate branch.
                        properties:
                          name:
                            description: Name is the executor-defined stable branch identifier.
                            type: string
                          rounds:
                            description: Rounds reports optimizer progress for this branch.
                            properties:
                              completed:
                                description: Completed is the number of finished rounds.
                                format: int32
                                type: integer
                              total:
                                description: Total is the number of planned rounds.
                                format: int32
                                type: integer
                            required:
                              - completed
                              - total
                            type: object
                        required:
                          - name
                          - rounds
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                        - name
                      x-kubernetes-list-type: map
                    candidates:
                      description: Candidates reports bounded Kubernetes publication.
                      properties:
                        paretoFront:
                          description: ParetoFront is the number of feasible points on the current Pareto front.
                          format: int64
                          type: integer
                        published:
                          description: Published is the number of Candidate resources currently referenced by this run.
                          format: int32
                          type: integer
                      type: object
                    evaluations:
                      description: Evaluations reports unique candidate outcomes.
                      properties:
                        cacheHits:
                          description: CacheHits is the number of evaluations satisfied from a prior result.
                          format: int64
                          type: integer
                        failed:
                          description: Failed is the number of evaluations that ended in an execution error.
                          format: int64
                          type: integer
                        feasible:
                          description: Feasible is the number of completed evaluations that satisfy all constraints.
                          format: int64
                          type: integer
                        infeasible:
                          description: Infeasible is the number of completed evaluations that violate at least one constraint.
                          format: int64
                          type: integer
                        running:
                          description: Running is the number of evaluations currently executing.
                          format: int64
                          type: integer
                        scheduled:
                          description: Scheduled is the number of unique evaluations accepted for execution.
                          format: int64
                          type: integer
                        unsupported:
                          description: Unsupported is the number of configurations rejected as unsupported before evaluation.
                          format: int64
                          type: integer
                      type: object
                  type: object
                startTime:
                  description: StartTime is when execution started.
                  format: date-time
                  type: string
              type: object
          required:
            - spec
          type: object
          x-kubernetes-validations:
            - message: spec is immutable
              rule: '!has(oldSelf.spec) || self.spec == oldSelf.spec'
      served: true
      storage: true
      subresources:
        status: {}
