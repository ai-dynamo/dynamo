version: "2"

run:
  timeout: 10m
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - modernize
    - nakedret
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    staticcheck:
      # SA* matches the v1 staticcheck linter and S1* the v1 gosimple linter.
      # ST* (v1 stylecheck) and QF* (quickfix) were never enabled here.
      checks:
        - SA*
        - S1*
    govet:
      # The inline analyzer is new in Go 1.27 and offends on deliberate
      # reflect usage; the v1 govet had no such pass.
      disable:
        - inline
    goconst:
      # goconst v1.11 (bundled with golangci-lint v2) detects strings in
      # composite literals; v1.7 (golangci-lint v1) never checked them.
      # Excluding that type keeps v1 behavior. Call is the upstream default
      # and must be restated once exclude-types is set.
      exclude-types:
        - Call
        - CompositeLit
    modernize:
      # omitzero would rewrite `omitempty` to `omitzero` on JSON tags, which
      # changes wire semantics (omitzero omits on the zero value, omitempty on
      # the empty value) and is not a safe mechanical modernization for CRD
      # API types. Keep the other modernize analyzers.
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - path: "api/*"
        linters:
          - lll
      - path: "internal/*"
        linters:
          - dupl
          - lll
      - path: "pkg/dynamo/*"
        linters:
          - lll
          - nakedret
      # Intentional internal usage of deprecated namespace-restricted mode fields/packages.
      # The feature is soft-deprecated (still functional) so internal references are expected.
      - linters:
          - staticcheck
        text: "SA1019:.*deprecated.*namespace"
      # Intentional compatibility usage of deprecated checkpoint fields.
      # Compatibility flows and conversion code still need to read/write these
      # fields until a future API version can remove them.
      - linters:
          - staticcheck
        text: "SA1019:.*(CheckpointMode|omit mode|DynamoCheckpointIdentity|required by v1alpha1|omit for DGD-managed checkpoints|legacy spec.identity|checkpoint launch uses)"
      # Intentional compatibility usage of the deprecated eppConfig field/type.
      # Conversion, reconciliation, and validation code must still read and write
      # eppConfig to preserve the legacy Go EPP Pod contract for existing DGDs
      # until they migrate explicitly; see epp.IsLegacyGoEPP.
      # Single-quoted: in a double-quoted YAML scalar \b is the backspace
      # escape, not a regex word boundary. The boundary keeps this to the
      # EPPConfig symbol itself rather than also silencing a future
      # LegacyEPPConfig / EPPConfigRef.
      - linters:
          - staticcheck
        text: 'SA1019:.*\bEPPConfig is deprecated'
      # Legacy minima remain part of conversion, compatibility defaulting, and migration validation.
      - linters:
          - staticcheck
        text: 'SA1019:.*\bMinAvailable is deprecated: use providerOverride'
      # Immediate requeue is intentional here; migrating to RequeueAfter
      # would delay the retry.
      - linters:
          - staticcheck
        text: 'SA1019:.*Result..Requeue is deprecated'
      # The migrator round-trips raw FieldsV1 bytes by design.
      - linters:
          - staticcheck
        text: 'SA1019:.*FieldsV1..Raw is deprecated'
      # Repeated literal strings and slice growth in tests are deliberate.
      - path: _test\.go$
        linters:
          - goconst
          - prealloc
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
