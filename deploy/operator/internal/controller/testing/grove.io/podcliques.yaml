apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podcliques.grove.io
spec:
  group: grove.io
  names:
    kind: PodClique
    listKind: PodCliqueList
    plural: podcliques
    singular: podclique
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
      scale:
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
        labelSelectorPath: .status.hpaPodSelector
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            properties:
              replicas:
                type: integer
                format: int32
                minimum: 0
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            properties:
              replicas:
                type: integer
                format: int32
              hpaPodSelector:
                type: string
