# WITNESS scenario for the flag-normalization fix: identical to
# vllm-multinode-tp-args in every respect except the spelling of one flag. The
# tensor-parallel size is written with vLLM's documented short alias, "-tp 16",
# instead of "--tensor-parallel-size 16".
#
# Before the fix, "-tp" was invisible to the operator's flag reader, so the
# tensor-parallel size fell back to vLLM's default of 1; 1 is not greater than
# the 8 GPUs of one container, so no multinode coordination was injected at all
# and the rendered LeaderWorkerSet carried the user's args unchanged. After the
# fix "-tp" normalizes to --tensor-parallel-size, the size reads as 16, and the
# same multinode launch the tp-args control renders is injected here.
#
# The injected block in output.yaml is therefore byte-identical to the control's.
apiVersion: nvidia.com/v1beta1
kind: DynamoComponentDeployment
metadata:
  name: tp-short-alias-manifest
spec:
  backendFramework: vllm
  name: decode
  type: decode
  replicas: 1
  multinode:
    nodeCount: 2
  podTemplate:
    metadata:
      annotations:
        # Pin the executor backend so the contract does not depend on the
        # operator-origin-version compatibility gate, which a bare DCD (no parent
        # DynamoGraphDeployment stamping the annotation) leaves disabled.
        nvidia.com/vllm-distributed-executor-backend: mp
    spec:
      containers:
        - name: main
          image: registry.example/dynamo-worker:test
          command:
            - python3
            - -m
            - dynamo.vllm
          args:
            - --model
            - test/model
            - -tp
            - "16"
          resources:
            limits:
              nvidia.com/gpu: "8"
            requests:
              nvidia.com/gpu: "8"
