# CONTROL scenario: it passes on both the old and the new code, and is here to
# pin the injection this PR must leave untouched.
#
# A multinode vLLM component whose tensor-parallel size (16) exceeds the GPUs of
# one container (8), so the operator must inject multinode coordination flags.
# The flag is spelled in the canonical "--tensor-parallel-size 16" form in args:,
# which every version of the parser already read, so nothing here depends on the
# flag-normalization change. It is the reference injection that the
# vllm-multinode-tp-short-alias scenario must reproduce byte for byte.
apiVersion: nvidia.com/v1beta1
kind: DynamoComponentDeployment
metadata:
  name: tp-args-manifest
spec:
  backendFramework: vllm
  name: decode
  type: decode
  replicas: 1
  multinode:
    nodeCount: 2
  podTemplate:
    metadata:
      annotations:
        # Pin the executor backend so the contract does not depend on the
        # operator-origin-version compatibility gate, which a bare DCD (no parent
        # DynamoGraphDeployment stamping the annotation) leaves disabled.
        nvidia.com/vllm-distributed-executor-backend: mp
    spec:
      containers:
        - name: main
          image: registry.example/dynamo-worker:test
          command:
            - python3
            - -m
            - dynamo.vllm
          args:
            - --model
            - test/model
            - --tensor-parallel-size
            - "16"
          resources:
            limits:
              nvidia.com/gpu: "8"
            requests:
              nvidia.com/gpu: "8"
