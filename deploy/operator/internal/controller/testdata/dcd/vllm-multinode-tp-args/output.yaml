apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  $strict: false
  name: tp-args-manifest-0
spec:
  leaderWorkerTemplate:
    leaderTemplate:
      metadata:
        labels:
          nvidia.com/dynamo-component: decode
          nvidia.com/dynamo-component-type: decode
          nvidia.com/dynamo-discovery-backend: kubernetes
          nvidia.com/dynamo-discovery-enabled: "true"
          nvidia.com/dynamo-namespace: $pattern:clusterenv-.*-tp-args-manifest
          nvidia.com/dynamo-sub-component-type: decode
          nvidia.com/metrics-enabled: "true"
          role: leader
        annotations:
          nvidia.com/vllm-distributed-executor-backend: mp
      spec:
        containers:
          - args:
              - --model
              - test/model
              - --tensor-parallel-size
              - "16"
              - --distributed-executor-backend
              - mp
              - --nnodes
              - "2"
              - --master-addr
              - $(LWS_LEADER_ADDRESS)
              - --master-port
              - "29500"
              - --node-rank
              - "0"
            command:
              - python3
              - -m
              - dynamo.vllm
            env:
              - name: DYN_COMPONENT
                value: decode
              - name: DYN_DISCOVERY_BACKEND
                value: kubernetes
              - name: DYN_FORWARDPASS_METRIC_PORT
                value: "20380"
              - name: DYN_HEALTH_CHECK_ENABLED
                value: "false"
              - name: DYN_NAMESPACE
                value: $pattern:clusterenv-.*-tp-args-manifest
              - name: DYN_PARENT_DGD_K8S_NAME
                value: tp-args-manifest
              - name: DYN_PARENT_DGD_K8S_NAMESPACE
                value: $pattern:clusterenv-.*
              - name: DYN_SYSTEM_ENABLED
                value: "true"
              - name: DYN_SYSTEM_PORT
                value: "9090"
              - name: DYN_SYSTEM_USE_ENDPOINT_HEALTH_STATUS
                value: '["generate"]'
              - name: NIXL_TELEMETRY_ENABLE
                value: "n"
              - name: NIXL_TELEMETRY_EXPORTER
                value: prometheus
              - name: NIXL_TELEMETRY_PROMETHEUS_PORT
                value: "19090"
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_UID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.uid
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
            image: registry.example/dynamo-worker:test
            livenessProbe:
              failureThreshold: 1
              httpGet:
                path: /live
                port: system
              periodSeconds: 5
              timeoutSeconds: 4
            name: main
            ports:
              - containerPort: 9090
                name: system
                protocol: TCP
              - containerPort: 19090
                name: nixl
                protocol: TCP
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /health
                port: system
              periodSeconds: 10
              timeoutSeconds: 4
            resources:
              limits:
                nvidia.com/gpu: "8"
              requests:
                nvidia.com/gpu: "8"
            startupProbe:
              failureThreshold: 720
              httpGet:
                path: /live
                port: system
              periodSeconds: 10
              timeoutSeconds: 5
            volumeMounts:
              - mountPath: /dev/shm
                name: shared-memory
        restartPolicy: Always
        securityContext:
          fsGroup: 1000
        serviceAccountName: tp-args-manifest-k8s-service-discovery
        terminationGracePeriodSeconds: 60
        volumes:
          - emptyDir:
              medium: Memory
              sizeLimit: 8Gi
            name: shared-memory
    restartPolicy: RecreateGroupOnPodRestart
    size: 2
    workerTemplate:
      metadata:
        labels:
          nvidia.com/dynamo-component: decode
          nvidia.com/dynamo-component-type: decode
          nvidia.com/dynamo-discovery-backend: kubernetes
          nvidia.com/dynamo-discovery-enabled: "true"
          nvidia.com/dynamo-namespace: $pattern:clusterenv-.*-tp-args-manifest
          nvidia.com/dynamo-sub-component-type: decode
          nvidia.com/metrics-enabled: "true"
          role: worker
        annotations:
          nvidia.com/vllm-distributed-executor-backend: mp
      spec:
        containers:
          - args:
              - --model
              - test/model
              - --tensor-parallel-size
              - "16"
              - --distributed-executor-backend
              - mp
              - --nnodes
              - "2"
              - --master-addr
              - $(LWS_LEADER_ADDRESS)
              - --master-port
              - "29500"
              - --node-rank
              - $(LWS_WORKER_INDEX)
              - --headless
            command:
              - python3
              - -m
              - dynamo.vllm
            env:
              - name: DYN_COMPONENT
                value: decode
              - name: DYN_DISCOVERY_BACKEND
                value: kubernetes
              - name: DYN_FORWARDPASS_METRIC_PORT
                value: "20380"
              - name: DYN_HEALTH_CHECK_ENABLED
                value: "false"
              - name: DYN_NAMESPACE
                value: $pattern:clusterenv-.*-tp-args-manifest
              - name: DYN_PARENT_DGD_K8S_NAME
                value: tp-args-manifest
              - name: DYN_PARENT_DGD_K8S_NAMESPACE
                value: $pattern:clusterenv-.*
              - name: DYN_SYSTEM_ENABLED
                value: "true"
              - name: DYN_SYSTEM_PORT
                value: "9090"
              - name: DYN_SYSTEM_USE_ENDPOINT_HEALTH_STATUS
                value: '["generate"]'
              - name: NIXL_TELEMETRY_ENABLE
                value: "n"
              - name: NIXL_TELEMETRY_EXPORTER
                value: prometheus
              - name: NIXL_TELEMETRY_PROMETHEUS_PORT
                value: "19090"
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_UID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.uid
              - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
            image: registry.example/dynamo-worker:test
            name: main
            ports:
              - containerPort: 9090
                name: system
                protocol: TCP
              - containerPort: 19090
                name: nixl
                protocol: TCP
            resources:
              limits:
                nvidia.com/gpu: "8"
              requests:
                nvidia.com/gpu: "8"
            volumeMounts:
              - mountPath: /dev/shm
                name: shared-memory
        restartPolicy: Always
        securityContext:
          fsGroup: 1000
        serviceAccountName: tp-args-manifest-k8s-service-discovery
        terminationGracePeriodSeconds: 60
        volumes:
          - emptyDir:
              medium: Memory
              sizeLimit: 8Gi
            name: shared-memory
          - configMap:
              name: tp-args-manifest-wait-leader-script
            name: wait-leader-script
        initContainers:
          - command:
              - sh
              - -c
              - export LEADER_HOST="${LWS_LEADER_ADDRESS}" LEADER_PORT="29500" && exec python3 /scripts/wait-for-leader.py
            image: registry.example/dynamo-worker:test
            name: wait-for-leader-mp
            resources: {}
            volumeMounts:
              - mountPath: /scripts
                name: wait-leader-script
                readOnly: true
  networkConfig:
    subdomainPolicy: Shared
  replicas: 1
  rolloutStrategy:
    rollingUpdateConfiguration:
      maxSurge: 0
      maxUnavailable: 1
      partition: 0
    type: RollingUpdate
  startupPolicy: LeaderCreated
status: $notexists
