# The generator substitutes only the catalog's image before the old operator runs.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: hash-upgrade-replay
  namespace: default
spec:
  backendFramework: sglang
  components:
    - name: SglangPrefill
      type: prefill
      replicas: 2
      podTemplate:
        spec:
          containers:
            - name: main
              image: registry.example.com/dynamo/sglang-runtime:replaced-by-catalog
              command: [python3, -m, dynamo.sglang]
              args: [--model-path, Qwen/Qwen3-0.6B, --disaggregation-mode, prefill]
    - name: SglangDecode
      type: decode
      replicas: 2
      podTemplate:
        spec:
          containers:
            - name: main
              image: registry.example.com/dynamo/sglang-runtime:replaced-by-catalog
              command: [python3, -m, dynamo.sglang]
              args: [--model-path, Qwen/Qwen3-0.6B, --disaggregation-mode, decode]
