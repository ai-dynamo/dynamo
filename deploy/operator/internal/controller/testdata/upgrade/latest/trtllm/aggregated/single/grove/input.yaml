apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: workers
  namespace: upgrade-latest-trtllm-aggregated-single-grove
  annotations:
    nvidia.com/enable-grove: 'true'
    nvidia.com/dynamo-operator-origin-version: 0.0.0
spec:
  backendFramework: trtllm
  components:
  - name: frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.6.0
          command:
          - python3
          - -m
          - dynamo.frontend
  - name: worker
    type: worker
    replicas: 2
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/trtllm-runtime:1.6.0
          command:
          - python3
          - -m
          - dynamo.trtllm
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          resources:
            limits:
              nvidia.com/gpu: '1'
