            \ && cp /ssh-pk/private.key.pub $HOME/.ssh/id_rsa.pub && cp /ssh-pk/private.key.pub\
            \ $HOME/.ssh/authorized_keys && chmod 600 $HOME/.ssh/id_rsa $HOME/.ssh/authorized_keys\
            \ && chmod 644 $HOME/.ssh/id_rsa.pub && printf 'Host *\\nIdentityFile\
            \ '$HOME'/.ssh/id_rsa\\nStrictHostKeyChecking no\\nPort 2222\\n' > $HOME/.ssh/config\
            \ && TIMEOUT=300; START_TIME=$(date +%s); for worker in $(echo \"$LWS_LEADER_ADDRESS\"\
            \ | sed 's/\\./-1\\./'); do echo \"Waiting for DNS: $worker\"; until getent\
            \ hosts $worker >/dev/null 2>&1; do CURRENT_TIME=$(date +%s); if [ $((CURRENT_TIME\
            \ - START_TIME)) -gt $TIMEOUT ]; then echo \"ERROR: Timeout waiting for\
            \ DNS: $worker\"; exit 1; fi; echo \"DNS not ready for $worker, retrying...\"\
            ; sleep 2; done; echo \"\u2713 DNS resolved: $worker\"; done; echo \"\
            All workers DNS ready\" && mpirun $([ \"$(id -u)\" = \"0\" ] && echo --allow-run-as-root)\
            \ --oversubscribe -n 2 -H $(LWS_LEADER_ADDRESS),$(echo \"$LWS_LEADER_ADDRESS\"\
            \ | sed 's/\\./-1\\./') --mca pml ob1 --mca plm_rsh_args \"-p 2222 -o\
