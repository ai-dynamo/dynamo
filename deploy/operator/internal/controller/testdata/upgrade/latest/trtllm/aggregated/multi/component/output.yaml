            name: system
            protocol: TCP
          - containerPort: 19090
            name: nixl
            protocol: TCP
          readinessProbe:
            failureThreshold: 10
            initialDelaySeconds: 20
            periodSeconds: 20
            tcpSocket:
              port: 2222
            timeoutSeconds: 5
          resources:
            limits:
              nvidia.com/gpu: '1'
          volumeMounts:
          - mountPath: /ssh-pk
            name: upgrade-mpi-ssh
            readOnly: true
          - mountPath: /dev/shm
            name: shared-memory
        restartPolicy: Always
        securityContext:
          fsGroup: 1000
        serviceAccountName: workers-k8s-service-discovery
        terminationGracePeriodSeconds: 60
        volumes:
        - name: upgrade-mpi-ssh
          secret:
            defaultMode: 420
            secretName: upgrade-mpi-ssh
        - emptyDir:
            medium: Memory
            sizeLimit: 8Gi
          name: shared-memory
  networkConfig:
    subdomainPolicy: Shared
  replicas: 2
  rolloutStrategy:
    rollingUpdateConfiguration:
