apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  annotations:
    nvidia.com/last-applied-generation: '1'
    nvidia.com/last-applied-hash: $var:pcs-spec-hash
  creationTimestamp: $ignore
  generation: $ignore
  labels:
    nvidia.com/dynamo-graph-deployment-name: workers
  name: workers
  namespace: upgrade-latest-vllm-aggregated-single-grove
  ownerReferences:
  - apiVersion: nvidia.com/v1beta1
    blockOwnerDeletion: true
    controller: true
    kind: DynamoGraphDeployment
    name: workers
    uid: $ignore
  resourceVersion: $ignore
  uid: $ignore
spec:
  replicas: 1
  template:
    cliqueStartupType: CliqueStartupTypeAnyOrder
    cliques:
    - annotations:
        nvidia.com/dynamo-discovery-backend: kubernetes
        nvidia.com/dynamo-operator-origin-version: $var:operator-version
      labels:
        nvidia.com/dynamo-component: frontend
        nvidia.com/dynamo-component-type: frontend
        nvidia.com/dynamo-discovery-backend: kubernetes
        nvidia.com/dynamo-discovery-enabled: 'true'
        nvidia.com/dynamo-graph-deployment-name: workers
        nvidia.com/dynamo-namespace: upgrade-latest-vllm-aggregated-single-grove-workers
        nvidia.com/metrics-enabled: 'true'
        nvidia.com/selector: workers-frontend
      name: frontend
      spec:
        minAvailable: 1
        podSpec:
          containers:
          - command:
            - python3
            - -m
            - dynamo.frontend
            env:
            - name: DYNAMO_PORT
              value: '8000'
            - name: DYN_COMPONENT
              value: frontend
            - name: DYN_DISCOVERY_BACKEND
              value: kubernetes
            - name: DYN_HTTP_PORT
              value: '8000'
            - name: DYN_NAMESPACE
              value: upgrade-latest-vllm-aggregated-single-grove-workers
            - name: DYN_NAMESPACE_PREFIX
              value: upgrade-latest-vllm-aggregated-single-grove-workers
            - name: DYN_NAMESPACE_PREFIX_STRICT
              value: 'true'
            - name: DYN_PARENT_DGD_K8S_NAME
              value: workers
            - name: DYN_PARENT_DGD_K8S_NAMESPACE
              value: upgrade-latest-vllm-aggregated-single-grove
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.6.0
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /live
                port: http
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 1
            name: main
            ports:
            - containerPort: 8000
              name: http
              protocol: TCP
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 3
            resources: {}
            startupProbe:
              failureThreshold: 30
              httpGet:
                path: /live
                port: http
              periodSeconds: 10
              timeoutSeconds: 1
            volumeMounts:
            - mountPath: /dev/shm
              name: shared-memory
          restartPolicy: Always
          securityContext:
            fsGroup: 1000
          serviceAccountName: workers-k8s-service-discovery
          terminationGracePeriodSeconds: 60
          volumes:
          - emptyDir:
              medium: Memory
              sizeLimit: 8Gi
            name: shared-memory
        replicas: 1
        roleName: frontend
    - annotations:
        nvidia.com/dynamo-discovery-backend: kubernetes
        nvidia.com/dynamo-operator-origin-version: $var:operator-version
      labels:
        nvidia.com/dynamo-component: worker
        nvidia.com/dynamo-component-type: worker
        nvidia.com/dynamo-discovery-backend: kubernetes
        nvidia.com/dynamo-discovery-enabled: 'true'
        nvidia.com/dynamo-graph-deployment-name: workers
        nvidia.com/dynamo-namespace: upgrade-latest-vllm-aggregated-single-grove-workers
        nvidia.com/dynamo-worker-hash: $var:worker-hash
        nvidia.com/metrics-enabled: 'true'
        nvidia.com/selector: workers-worker
      name: worker
      spec:
        minAvailable: 1
        podSpec:
          containers:
          - args:
            - --model-path
            - Qwen/Qwen3-0.6B
            command:
            - python3
            - -m
            - dynamo.vllm
            env:
            - name: DYN_COMPONENT
              value: worker
            - name: DYN_DISCOVERY_BACKEND
              value: kubernetes
            - name: DYN_FORWARDPASS_METRIC_PORT
              value: '20380'
            - name: DYN_HEALTH_CHECK_ENABLED
              value: 'true'
            - name: DYN_NAMESPACE
              value: upgrade-latest-vllm-aggregated-single-grove-workers
            - name: DYN_NAMESPACE_WORKER_SUFFIX
              value: $var:worker-hash
            - name: DYN_PARENT_DGD_K8S_NAME
              value: workers
            - name: DYN_PARENT_DGD_K8S_NAMESPACE
              value: upgrade-latest-vllm-aggregated-single-grove
            - name: DYN_SYSTEM_ENABLED
              value: 'true'
            - name: DYN_SYSTEM_PORT
              value: '9090'
            - name: DYN_SYSTEM_USE_ENDPOINT_HEALTH_STATUS
              value: '["generate"]'
            - name: NIXL_TELEMETRY_ENABLE
              value: n
            - name: NIXL_TELEMETRY_EXPORTER
              value: prometheus
            - name: NIXL_TELEMETRY_PROMETHEUS_PORT
              value: '19090'
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /live
                port: system
              periodSeconds: 5
              timeoutSeconds: 4
            name: main
            ports:
            - containerPort: 9090
              name: system
              protocol: TCP
            - containerPort: 19090
              name: nixl
              protocol: TCP
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /health
                port: system
              periodSeconds: 10
              timeoutSeconds: 4
            resources:
              limits:
                nvidia.com/gpu: '1'
            startupProbe:
              failureThreshold: 720
              httpGet:
                path: /live
                port: system
              periodSeconds: 10
              timeoutSeconds: 5
            volumeMounts:
            - mountPath: /dev/shm
              name: shared-memory
          restartPolicy: Always
          securityContext:
            fsGroup: 1000
          serviceAccountName: workers-k8s-service-discovery
          terminationGracePeriodSeconds: 60
          volumes:
          - emptyDir:
              medium: Memory
              sizeLimit: 8Gi
            name: shared-memory
        replicas: 2
        roleName: worker
    headlessServiceConfig:
      publishNotReadyAddresses: true
    terminationDelay: 15m0s
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  annotations:
    nvidia.com/current-worker-hash-v2: $var:worker-hash
    nvidia.com/dynamo-operator-origin-version: $var:operator-version
    nvidia.com/enable-grove: 'true'
    nvidia.com/workload-provider: grove
  creationTimestamp: $ignore
  finalizers:
  - nvidia.com/finalizer
  generation: $ignore
  name: workers
  namespace: upgrade-latest-vllm-aggregated-single-grove
  resourceVersion: $ignore
  uid: $ignore
spec:
  backendFramework: vllm
  components:
  - name: frontend
    podTemplate:
      spec:
        containers:
        - command:
          - python3
          - -m
          - dynamo.frontend
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.6.0
          name: main
    replicas: 1
    type: frontend
  - name: worker
    podTemplate:
      spec:
        containers:
        - args:
          - --model-path
          - Qwen/Qwen3-0.6B
          command:
          - python3
          - -m
          - dynamo.vllm
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0
          name: main
          resources:
            limits:
              nvidia.com/gpu: '1'
    replicas: 2
    type: worker
status:
  components:
    frontend:
      componentKind: PodClique
      componentNames:
      - workers-0-frontend
      gpusPerEngine: 0
      gpusPerReplica: 0
      replicas: 0
      runtimeNamespace: upgrade-latest-vllm-aggregated-single-grove-workers
      updatedReplicas: 0
    worker:
      componentKind: PodClique
      componentNames:
      - workers-0-worker
      gpusPerEngine: 1
      gpusPerReplica: 1
      replicas: 0
      servedModelName: Qwen/Qwen3-0.6B
      updatedReplicas: 0
  conditions:
  - lastTransitionTime: $ignore
    message: 'Resources not ready: workers: frontend: resource not found; worker:
      resource not found'
    observedGeneration: 1
    reason: some_resources_are_not_ready
    status: 'False'
    type: Ready
  observedGeneration: 1
  state: pending
---
