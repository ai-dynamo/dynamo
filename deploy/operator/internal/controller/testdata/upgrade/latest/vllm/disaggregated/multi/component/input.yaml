apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: workers
  namespace: upgrade-latest-vllm-disaggregated-multi-component
  annotations:
    nvidia.com/enable-grove: 'false'
    nvidia.com/dynamo-operator-origin-version: 0.0.0
spec:
  backendFramework: vllm
  components:
  - name: frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.6.0
          command:
          - python3
          - -m
          - dynamo.frontend
  - name: prefill
    type: prefill
    replicas: 2
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --disaggregation-mode
          - prefill
          resources:
            limits:
              nvidia.com/gpu: '1'
    multinode:
      nodeCount: 2
  - name: decode
    type: decode
    replicas: 2
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --disaggregation-mode
          - decode
          resources:
            limits:
              nvidia.com/gpu: '1'
    multinode:
      nodeCount: 2
