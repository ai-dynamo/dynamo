apiVersion: v1
data:
  wait-for-leader.py: "import socket, time, json, ssl, urllib.request, os\n\nSA =\
    \ \"/var/run/secrets/kubernetes.io/serviceaccount\"\nhost = os.environ[\"LEADER_HOST\"\
    ]\nport = int(os.environ[\"LEADER_PORT\"])\n\ndef _k8s_ctx():\n    return ssl.create_default_context(cafile=f\"\
    {SA}/ca.crt\")\n\ndef _k8s_headers():\n    token = open(f\"{SA}/token\").read()\n\
    \    return {\"Authorization\": f\"Bearer {token}\"}\n\ndef _k8s_api():\n    ns\
    \ = open(f\"{SA}/namespace\").read()\n    return f\"https://kubernetes.default.svc/api/v1/namespaces/{ns}/pods\"\
    \n\ndef resolve_leader_ip():\n    # gethostbyname is IPv4-only; fall back to IPv6\
    \ for IPv6-only clusters.\n    try:\n        return socket.gethostbyname(host)\n\
    \    except socket.gaierror:\n        return socket.getaddrinfo(host, None, socket.AF_INET6,\
    \ socket.SOCK_STREAM)[0][4][0]\n\ndef leader_pod_is_healthy():\n    try:\n   \
    \     ip = resolve_leader_ip()\n    except socket.gaierror:\n        return False,\
    \ \"DNS resolution failed\", None, None\n    try:\n        req = urllib.request.Request(\n\
    \            f\"{_k8s_api()}?fieldSelector=status.podIP={ip}\",\n            headers=_k8s_headers(),\n\
    \        )\n        resp = json.loads(urllib.request.urlopen(req, context=_k8s_ctx(),\
    \ timeout=5).read())\n        pods = resp.get(\"items\", [])\n        if not pods:\n\
    \            return False, f\"no pod found with IP {ip}\", None, ip\n        pod\
    \ = pods[0]\n        name = pod[\"metadata\"].get(\"name\", \"unknown\")\n   \
    \     uid = pod[\"metadata\"].get(\"uid\", \"unknown\")\n        phase = pod.get(\"\
    status\", {}).get(\"phase\")\n        deletion_ts = pod[\"metadata\"].get(\"deletionTimestamp\"\
    )\n        info = f\"ip={ip} pod={name} uid={uid} phase={phase} deletionTimestamp={deletion_ts}\"\
    \n        if deletion_ts:\n            return False, f\"pod {name} is terminating\"\
    , info, ip\n        if phase != \"Running\":\n            return False, f\"pod\
    \ {name} phase is {phase}\", info, ip\n        return True, \"\", info, ip\n \
    \   except Exception as e:\n        # Fall back to TCP-only when the API is unavailable\
    \ (e.g. 403 no RBAC)\n        return True, f\"K8s API unavailable ({e}), falling\
    \ back to TCP\", f\"ip={ip}\", ip\n\nprint(f\"Waiting for leader master port at\
    \ {host}:{port}...\", flush=True)\ntime.sleep(5)\nstart = time.monotonic()\nlast_status\
    \ = start\nlast_err = \"\"\nwhile True:\n    healthy, reason, pod_info, leader_ip\
    \ = leader_pod_is_healthy()\n    if healthy:\n        try:\n            s = socket.create_connection((leader_ip,\
    \ port), timeout=2)\n            s.close()\n            elapsed = time.monotonic()\
    \ - start\n            print(f\"Leader master port ready (waited {elapsed:.1f}s)\
    \ [{pod_info}]\", flush=True)\n            break\n        except Exception as\
    \ e:\n            last_err = f\"tcp: {type(e).__name__}: {e} [{pod_info}]\"\n\
    \    else:\n        last_err = f\"{reason} [{pod_info}]\" if pod_info else reason\n\
    \    now = time.monotonic()\n    if now - last_status >= 30:\n        print(f\"\
    Still waiting for {host}:{port}... ({now - start:.0f}s elapsed, last: {last_err})\"\
    , flush=True)\n        last_status = now\n    time.sleep(5)\n"
