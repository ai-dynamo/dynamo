# The test writes trace.jsonl, gzip-compressed, to retune/w-1.jsonl.gz on the request-traces claim
# before it applies this Request.
apiVersion: nvidia.com/v1beta2
kind: DynamoGraphDeploymentRequest
metadata:
  name: aisimulate-vllm-trace
spec:
  model:
    name: Qwen/Qwen3-32B
  backends:
    - vllm
  workload:
    trace:
      format: dynamo
      source:
        pvc:
          claimName: request-traces
          path: retune/w-1.jsonl.gz
      replay:
        arrivalSpeedupRatio: 2.0
  objective:
    mode: Optimize
    metric: ThroughputPerGPU
    sla: {}
  aisimulate:
    inputOverrides:
      engine:
        mode: aggregated
        context_length: 32768
        workers:
          # TODO(#17581): Remove this explicit value after AISimulate preserves an unset runtime block size.
          aggregated:
            kv_cache:
              block_size: 64
          prefill: null
          decode: null
      optimizer:
        algorithm: random
        max_trials: 3
        parallelism: 1
        candidate_timeout_seconds: 120
      dgdr_run:
        snapshot_interval_seconds: 0
  recommendation:
    maxCandidates: 1
