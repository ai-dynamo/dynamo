apiVersion: nvidia.com/v1beta2
kind: DynamoGraphDeploymentCandidate
metadata:
  $strict: false
  name: $glob:aisimulate-vllm-1-*-evaluated-point-*
  labels:
    $strict: false
    nvidia.com/dgdr-candidate-id: $pattern:^evaluated-point-[0-9a-f]{12}$
    nvidia.com/dgdr-run-uid: $ignore
spec:
  $strict: false
status:
  parameters:
    $strict: false
    backend: vllm
  conditions:
    - $strict: false
      type: Valid
      status: "True"
      reason: ValidationSucceeded
  metrics:
    $strict: false
    score: $ignore
    usedGpus: $ignore
