name: conductor
replicas: 1
podTemplate:
  spec:
    resourceClaims:
    - {name: gpu, resourceClaimTemplateName: gpu}
    containers:
    - name: main
      image: cyborg-runtime
      resources:
        claims:
        - {name: gpu}
      volumeMounts:
      - {name: config, mountPath: /configs}
      - {name: model-storage, mountPath: /models}
    volumes:
    - {name: model-storage, emptyDir: {}}
