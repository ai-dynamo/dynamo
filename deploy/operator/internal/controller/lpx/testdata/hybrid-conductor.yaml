name: conductor
replicas: 1
podTemplate:
  spec:
    initContainers:
    - name: runtime
      image: dynamo-sidecar
      restartPolicy: Always
    containers:
    - name: main
      image: cyborg-runtime
      resources:
        limits:
          nvidia.com/gpu: 1
      volumeMounts:
      - {name: model-storage, mountPath: /models}
    volumes:
    - {name: model-storage, emptyDir: {}}
