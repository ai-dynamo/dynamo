apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: node-local-v3-hx-specdecode
  namespace: test
  uid: 44444444-4444-4444-8444-444444444444
  generation: 1
spec:
  components:
    - name: draft
      type: lpx
      replicas: 2
      lpx:
        buildId: node-local-v3-hx-sd-draft
      roles:
      - name: agent
        podTemplate:
          spec:
            containers:
            - &agent-main
              name: main
              image: example.invalid/quasar:test
              args: []
              resources:
                limits:
                  lpu.nvidia.com/devices: '1'
              readinessProbe:
                failureThreshold: 3
                initialDelaySeconds: 10
                periodSeconds: 5
                successThreshold: 1
                tcpSocket:
                  port: 2222
                timeoutSeconds: 1
              env:
              - name: BMC_SSH_ENABLED
                value: 'false'
              - name: LPU_FPGA_AUTOMATIC_JTAG_RECOVERY
                value: 'false'
              - name: LPU_FPGA_RECONFIGURE_METHOD
                value: cvp
              - name: REDFISH_BMC_ENABLED
                value: 'false'
              - name: LPU_MODEL_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['scheduling.lpu.nvidia.com/model']
              securityContext:
                privileged: true
              volumeMounts:
              - name: model-storage
                mountPath: /nfs
              - name: host-dev
                mountPath: /dev
              - name: host-sys
                mountPath: /sys
              - name: ssh-secret
                mountPath: /ssh-pk
                readOnly: true
            initContainers:
            - &prepare-lp30
              command:
              - /bin/lp30-agent-v2-init
              env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              image: example.invalid/lpu-runtime:test
              name: prepare-lp30
              securityContext:
                privileged: true
              volumeMounts:
              - mountPath: /sys
                name: host-sys
              - mountPath: /dev
                name: host-dev
            volumes:
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-storage
            - name: host-dev
              hostPath:
                path: /dev
                type: Directory
            - name: host-sys
              hostPath:
                path: /sys
                type: Directory
            - name: ssh-secret
              secret:
                secretName: ssh-secret
                defaultMode: 420
            dnsPolicy: ClusterFirstWithHostNet
            hostIPC: true
            hostNetwork: true
            securityContext: &agent-security
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
            tolerations: &agent-tolerations
            - key: lpu.nvidia.com/node
              operator: Exists
    - name: lpu
      type: lpx
      replicas: 1
      lpx:
        buildId: node-local-v3-hx-sd-target
      roles:
      - name: agent
        podTemplate:
          spec:
            containers:
            - <<: *agent-main
              volumeMounts:
              - name: model-storage
                mountPath: /nfs
              - name: host-dev
                mountPath: /dev
              - name: host-sys
                mountPath: /sys
              - name: ssh-secret
                mountPath: /ssh-pk
                readOnly: true
              - name: openengine
                mountPath: /run/openengine
            initContainers:
            - *prepare-lp30
            - name: runtime
              image: example.invalid/dynamo-sidecar:test
              restartPolicy: Always
              args:
              - lpx
              - --grpc-endpoint
              - unix:///run/openengine/openengine.sock
              - --model-path
              - $(LPX_TARGET_MODEL_PATH)/tokenizer
              env:
              - name: DYN_SYSTEM_PORT
                value: '18090'
              readinessProbe:
                httpGet:
                  path: /health
                  port: 18090
              volumeMounts:
              - name: model-storage
                mountPath: /nfs
                readOnly: true
              - name: openengine
                mountPath: /run/openengine
            volumes:
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-storage
            - name: host-dev
              hostPath:
                path: /dev
                type: Directory
            - name: host-sys
              hostPath:
                path: /sys
                type: Directory
            - name: ssh-secret
              secret:
                secretName: ssh-secret
                defaultMode: 420
            - name: openengine
              emptyDir: {}
            dnsPolicy: ClusterFirstWithHostNet
            hostIPC: true
            hostNetwork: true
            securityContext: *agent-security
            tolerations: *agent-tolerations
