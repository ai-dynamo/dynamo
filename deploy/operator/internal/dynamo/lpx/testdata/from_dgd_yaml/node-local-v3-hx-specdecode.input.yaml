apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: node-local-v3-hx-specdecode
  namespace: test
  uid: 44444444-4444-4444-8444-444444444444
  generation: 1
  annotations:
    scheduling.lpu.nvidia.com/scheduler-backend: lpx-scheduler
spec:
  components:
    - name: draft
      type: lpx
      replicas: 2
      lpx:
        buildId: node-local-v3-hx-sd-draft
      roles:
      - name: agent
        podTemplate: &agent-template
          spec:
            containers:
            - name: main
              image: example.invalid/lpu-runtime:test
              args: []
              resources:
                limits:
                  lpu.nvidia.com/devices: '1'
              command:
              - /bin/quasar-entrypoint
              readinessProbe:
                failureThreshold: 3
                initialDelaySeconds: 10
                periodSeconds: 5
                successThreshold: 1
                tcpSocket:
                  port: 2222
                timeoutSeconds: 1
              env:
              - name: BMC_SSH_ENABLED
                value: 'false'
              - name: GROQ_HAL_V2_BACKGROUND_METRICS
                value: 'false'
              - name: GROQ_PG613_PORT_CONFIG
                value: EB3
              - name: GROQ_PG613_REQUIRE_ALTAIR_PCIE_GEN2
                value: 'false'
              - name: GROQ_PG613_SKIP_HOST_LINK_PROFILE
                value: '0'
              - name: GROQ_V2_FPGA_BUS_ADDRESS_ID_0
                value: 0000:9a:00.0
              - name: GROQ_V2_FPGA_BUS_ADDRESS_ID_1
                value: 0000:7e:00.0
              - name: GROQ_V2_HEALTH_CHECK_ON_OPEN
                value: '0'
              - name: GROQ_V2_RESET_ON_OPEN
                value: '0'
              - name: LPU_FPGA_AUTOMATIC_JTAG_RECOVERY
                value: 'false'
              - name: LPU_FPGA_RECONFIGURE_METHOD
                value: cvp
              - name: REDFISH_BMC_ENABLED
                value: 'false'
              - name: LPU_MODEL_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['scheduling.lpu.nvidia.com/model']
              securityContext:
                privileged: true
              volumeMounts:
              - name: model-storage
                mountPath: /nfs
              - name: config
                mountPath: /configs
              - name: host-dev
                mountPath: /dev
              - name: host-sys
                mountPath: /sys
              - name: ssh-secret
                mountPath: /ssh-pk
                readOnly: true
            initContainers:
            - command:
              - /bin/lp30-agent-v2-init
              env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              image: example.invalid/lpu-runtime:test
              name: prepare-lp30
              securityContext:
                privileged: true
              volumeMounts:
              - mountPath: /sys
                name: host-sys
              - mountPath: /dev
                name: host-dev
            volumes:
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-storage
            - name: host-dev
              hostPath:
                path: /dev
                type: Directory
            - name: host-sys
              hostPath:
                path: /sys
                type: Directory
            - name: ssh-secret
              secret:
                secretName: ssh-secret
                defaultMode: 420
            dnsPolicy: ClusterFirstWithHostNet
            hostIPC: true
            hostNetwork: true
            securityContext:
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
            tolerations:
            - key: lpu.nvidia.com/node
              operator: Exists
    - name: lpu
      type: lpx
      replicas: 1
      lpx:
        buildId: node-local-v3-hx-sd-target
      roles:
      - name: conductor
        podTemplate:
          spec:
            containers:
            - name: main
              image: example.invalid/lpu-runtime:test
              args:
              - --instance-model-name
              - test/v3-specdecode
              - --mpirun-path
              - /bin/mpirun
              - --mpi-ssh-cmd
              - ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/dynamo-lpu-ssh/private.key
              - --agent-wd
              - /tmp
              - --conductor-bind-host
              - 0.0.0.0
              - --conductor-hostname
              - $(POD_IP)
              - --control-server-addr
              - $(POD_IP):51045
              - --model-config-filepath
              - /configs/model_config.toml
              - --json-logs
              - --disable-tracing
              - --mpi-use-tcp
              - --agent-disable-auto-restart
              - --agent-server-max-retries
              - '60'
              - --agent-server-retry-sleep-dur
              - 2s
              - --graceful-shutdown-timeout
              - 0s
              - --response-timeout
              - 120s
              - --frontend-type
              - dynamo
              - --endpoint-id
              - dyn://$(DYN_NAMESPACE).backend.generate
              - --store-backend
              - kubernetes
              - --allocation
              - $(LPX_ALLOCATION)
              - --agent-env-vars
              - BMC_SSH_ENABLED=false
              - --agent-env-vars
              - GROQ_FPGA_VSAP_DRAM_WAIT_CYCLES=0
              - --agent-env-vars
              - GROQ_FPGA_VSAP_SETUP_MPINGO_KERNELS=false
              - --agent-env-vars
              - GROQ_HAL_V2_BACKGROUND_METRICS=false
              - --agent-env-vars
              - GROQ_PG613_PORT_CONFIG=EB3
              - --agent-env-vars
              - GROQ_PG613_REQUIRE_ALTAIR_PCIE_GEN2=false
              - --agent-env-vars
              - GROQ_PG613_SKIP_HOST_LINK_PROFILE=1
              - --agent-env-vars
              - GROQ_V2_FPGA_BUS_ADDRESS_ID_0=0000:9a:00.0
              - --agent-env-vars
              - GROQ_V2_FPGA_BUS_ADDRESS_ID_1=0000:7e:00.0
              - --agent-env-vars
              - GROQ_V2_HEALTH_CHECK_ON_OPEN=0
              - --agent-env-vars
              - GROQ_V2_RESET_ON_OPEN=0
              - --agent-env-vars
              - LPU_FPGA_AUTOMATIC_JTAG_RECOVERY=false
              - --agent-env-vars
              - LPU_FPGA_RECONFIGURE_METHOD=cvp
              - --agent-env-vars
              - LPU_PARTITION_RUNNER_DATAPLANE=pcie
              - --agent-env-vars
              - LPU_PARTITION_RUNNER_PCIE_SOURCE_PORT=33000
              - --agent-env-vars
              - LPU_RUNNER_OUTSTANDING_TASK_DRAIN_TIMEOUT_SECONDS=10
              - --agent-env-vars
              - LPU_VSAP_DIB_BARRIER_BEFORE_PUSH_ENABLED=true
              - --agent-env-vars
              - LPU_VSAP_MAX_TENSORS_PER_CHUNK=4
              - --agent-env-vars
              - REDFISH_BMC_ENABLED=false
              command:
              - /bin/nova
              env:
              - name: NOVA_MODEL_BASE_PATHS
                value: /nfs
              - name: NOVA_NODE_NAME_TEMPLATE
                value: ${GROVE_PCSG_NAME}-${GROVE_PCSG_INDEX}-{rack}-{node}.${GROVE_HEADLESS_SERVICE}
              - name: OMPI_ALLOW_RUN_AS_ROOT
                value: '1'
              - name: OMPI_ALLOW_RUN_AS_ROOT_CONFIRM
                value: '1'
              - name: OMPI_MCA_plm_rsh_args
                value: -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentityFile=/tmp/dynamo-lpu-ssh/private.key
              readinessProbe:
                httpGet:
                  path: /readyz
                  port: 51045
                  scheme: HTTP
                failureThreshold: 3
                initialDelaySeconds: 10
                periodSeconds: 5
                successThreshold: 1
                timeoutSeconds: 1
              volumeMounts:
              - name: model-storage
                mountPath: /nfs
              - name: config
                mountPath: /configs
              - name: single-v2-ssh-key
                mountPath: /tmp/dynamo-lpu-ssh
            initContainers:
            - args:
              - -m
              - '0600'
              - /ssh-pk/private.key
              - /tmp/dynamo-lpu-ssh/private.key
              command:
              - /bin/install
              image: example.invalid/lpu-runtime:test
              name: prepare-ssh-key
              volumeMounts:
              - mountPath: /tmp/dynamo-lpu-ssh
                name: single-v2-ssh-key
              - mountPath: /ssh-pk
                name: ssh-secret
                readOnly: true
            volumes:
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-storage
            - name: ssh-secret
              secret:
                secretName: ssh-secret
                defaultMode: 384
            - name: single-v2-ssh-key
              emptyDir: {}
            securityContext:
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
      - name: agent
        podTemplate: *agent-template
