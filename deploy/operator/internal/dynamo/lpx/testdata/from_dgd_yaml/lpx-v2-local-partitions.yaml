                    - lpu-node-21
                    - lpu-node-22
                    - lpu-node-23
                    - lpu-node-24
          containers:
          - args:
            - -c
            - |-
              readarray -t partition_node_counts < /configs/nodes_per_partition
              readarray -t partition_node_offsets < /configs/partition_node_offsets
              part=""
              for i in "${!partition_node_counts[@]}"; do
                if (( GROVE_PCLQ_POD_INDEX >= partition_node_offsets[i] &&
                      GROVE_PCLQ_POD_INDEX < partition_node_offsets[i] + partition_node_counts[i] )); then
                  part="${i}"
                  break
                fi
              done
              : "${part:?no partition row for Grove pod index ${GROVE_PCLQ_POD_INDEX}}"
              exec agent-hybrid-v2 \
                --assemble-dir "${GAS_DIR}" \
                --part "${part}" \
                --port "${RDMA_PORT}" \
                --nic "${NIC_NAME}" \
                --metadata-file "$(mktemp)" \
                --readiness-port "${READINESS_PORT}"
            env:
            - name: LPX_MODEL_PATH
              value: /nfs/llama3_2-1b-lpu-gpu-v2/build_0m851219t7py3mp8x1j5rg9j8c
            - name: DYN_COMPONENT
              value: lpx
            - name: DYN_DISCOVERY_BACKEND
              value: kubernetes
            - name: DYN_NAMESPACE
              value: inference-engine-lpx-v2-local-partitions
            - name: DYN_PARENT_DGD_K8S_NAME
              value: lpx-v2-local-partitions
            - name: DYN_PARENT_DGD_K8S_NAMESPACE
              value: inference-engine
            - name: ETCD_ENDPOINTS
              value: etcd-address
            - name: GAS_DIR
              value: $(LPX_MODEL_PATH)
            - name: GLUE_RDMA_PATH_MTU
              value: "1024"
            - name: LPU_MODEL_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['scheduling.lpu.nvidia.com/model']
            - name: NATS_SERVER
              value: nats-address
            - name: NIC_NAME
              value: mlx5_0
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
