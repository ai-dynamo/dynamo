                  fieldPath: metadata.uid
            - name: RDMA_PORT
              value: "19877"
            - name: READINESS_PORT
              value: "19878"
            - name: UCX_TLS
              value: tcp
            image: example.invalid/lpu-runtime:test
            name: agent
            readinessProbe:
              failureThreshold: 6
              httpGet:
                path: /readyz
                port: 19878
                scheme: HTTP
              periodSeconds: 5
              successThreshold: 1
              timeoutSeconds: 1
            resources:
              limits:
                hugepages-2Mi: 4Gi
                lpu.nvidia.com/lpu: "8"
              requests:
                cpu: "62"
                hugepages-2Mi: 4Gi
                lpu.nvidia.com/lpu: "8"
            securityContext:
              privileged: true
            startupProbe:
              failureThreshold: 60
              httpGet:
                path: /readyz
                port: 19878
                scheme: HTTP
              periodSeconds: 5
              successThreshold: 1
              timeoutSeconds: 1
            volumeMounts:
            - mountPath: /nfs
              name: model-storage
            - mountPath: /configs
              name: config
            - mountPath: /dev/hugepages
              name: hugepages
            - mountPath: /sys
              name: host-sys
            - mountPath: /dev
              name: host-dev
            - mountPath: /ssh-pk
              name: ssh-secret
              readOnly: true
            - mountPath: /dev/shm
              name: shared-memory
