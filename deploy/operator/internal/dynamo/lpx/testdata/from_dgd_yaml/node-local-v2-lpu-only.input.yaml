apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: node-local-v2-lpu-only
  namespace: test
  uid: 11111111-1111-4111-8111-111111111111
  generation: 1
spec:
  components:
    - name: lpu
      type: lpx
      replicas: 1
      lpx:
        buildId: node-local-v2-connected
      roles:
      - name: conductor
        podTemplate:
          spec:
            containers:
            - name: main
              image: example.invalid/quasar:test
              env:
              - name: MODEL_PATH
                value: $(LPX_MODEL_PATH)
              readinessProbe:
                httpGet:
                  path: /readyz
                  port: 51045
                  scheme: HTTP
                failureThreshold: 3
                initialDelaySeconds: 10
                periodSeconds: 5
                successThreshold: 1
                timeoutSeconds: 1
              volumeMounts:
              - name: model-storage
                mountPath: /nfs
              - name: single-v2-ssh-key
                mountPath: /tmp/dynamo-lpu-ssh
            initContainers:
            - args:
              - -m
              - '0600'
              - /ssh-pk/private.key
              - /tmp/dynamo-lpu-ssh/private.key
              command:
              - /bin/install
              image: example.invalid/lpu-runtime:test
              name: prepare-ssh-key
              volumeMounts:
              - mountPath: /tmp/dynamo-lpu-ssh
                name: single-v2-ssh-key
              - mountPath: /ssh-pk
                name: ssh-secret
                readOnly: true
            volumes:
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-storage
            - name: ssh-secret
              secret:
                secretName: ssh-secret
                defaultMode: 384
            - name: single-v2-ssh-key
              emptyDir: {}
            securityContext:
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
      - name: agent
        podTemplate:
          spec:
            containers:
            - name: main
              image: example.invalid/quasar:test
              resources:
                limits:
                  lpu.nvidia.com/devices: '1'
                  hugepages-2Mi: 4Gi
                requests:
                  cpu: '62'
                  hugepages-2Mi: 4Gi
              readinessProbe:
                failureThreshold: 3
                initialDelaySeconds: 10
                periodSeconds: 5
                successThreshold: 1
                tcpSocket:
                  port: 2222
                timeoutSeconds: 1
              env:
              - name: MODEL_PATH
                value: $(LPX_MODEL_PATH)
              - name: LPU_RUN_SYSTEM_INIT
                value: 'true'
              volumeMounts:
              - mountPath: /nfs
                name: model-storage
              - name: host-dev
                mountPath: /dev
              - name: host-sys
                mountPath: /sys
              - name: ssh-secret
                mountPath: /ssh-pk
                readOnly: true
              - name: hugepages
                mountPath: /dev/hugepages
              securityContext:
                privileged: true
            volumes:
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-storage
            - name: host-dev
              hostPath:
                path: /dev
                type: Directory
            - name: host-sys
              hostPath:
                path: /sys
                type: Directory
            - name: hugepages
              emptyDir:
                medium: HugePages
            - name: ssh-secret
              secret:
                secretName: ssh-secret
                defaultMode: 420
            dnsPolicy: ClusterFirstWithHostNet
            hostIPC: true
            hostNetwork: true
            securityContext:
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
            tolerations:
            - key: lpu.nvidia.com/node
              operator: Exists
