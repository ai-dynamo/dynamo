    nvidia.com/dynamo-graph-deployment-name: node-local-v3-hx-hybrid-topology
  name: node-local-v3-hx-hybrid-topology-ca8d
  namespace: test
spec:
  replicas: 1
  template:
    cliqueStartupType: CliqueStartupTypeExplicit
    cliques:
    - annotations:
        lpx.nvidia.com/deployment-name: node-local-v3-hx-hybrid-topology
        nvidia.com/dynamo-discovery-backend: kubernetes
        scheduling.lpu.nvidia.com/compiler-snapshot-digest: sha256:1bc6c691472d98d97a9fe9dffe2c3c091833720481e225ab0fa7c2cd323d8df6
        scheduling.lpu.nvidia.com/dynamo-workload-digest: sha256:54583da5d6b188b47fdd57bd72c54e310ab2e5493b03373ee8735c6c61be328e
        scheduling.lpu.nvidia.com/model: default
        scheduling.lpu.nvidia.com/role: agent
        scheduling.lpu.nvidia.com/workload-mode: v3HxStrictHybrid
      labels:
        lpx.nvidia.com/topology-publisher: "true"
        nvidia.com/dynamo-component: lpu
        nvidia.com/dynamo-component-type: lpx
        nvidia.com/dynamo-graph-deployment-name: node-local-v3-hx-hybrid-topology
        nvidia.com/dynamo-namespace: test-node-local-v3-hx-hybrid-topology
        nvidia.com/metrics-enabled: "true"
        nvidia.com/selector: node-local-v3-hx-hybrid-topology-lpu
      name: agt
      spec:
        minAvailable: 1
        podSpec:
          containers:
          - args:
            - start
            command:
            - /bin/hydra-entrypoint
            env:
            - name: LPX_LOCAL_PARTITION_IDS
            - name: LPX_MODEL_PATH
              value: /nfs/node-local-v3-hx-connected-lpx
            - name: LPX_DEPLOYMENT
              value: 88888888-8888-4888-8888-888888888888
            - name: LPX_TOPOLOGY_SOCKET
              value: /run/lpx-topology/agent.sock
            - name: GAS_DIR
              value: $(LPX_MODEL_PATH)
            - name: GLUE_RDMA_PATH_MTU
              value: "1024"
            - name: LPU_MODEL_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['scheduling.lpu.nvidia.com/model']
            - name: NIC_NAME
              value: mlx5_0
            - name: RDMA_PORT
              value: "19877"
            - name: READINESS_PORT
              value: "19878"
            - name: UCX_TLS
              value: tcp
            image: example.invalid/lpu-runtime:test
            name: main
            readinessProbe:
              exec:
                command:
                - /bin/hydra-entrypoint
                - ready
              failureThreshold: 6
              periodSeconds: 5
              successThreshold: 1
              timeoutSeconds: 1
            resources:
              limits:
                hugepages-2Mi: 4Gi
                lpu.nvidia.com/devices: "1"
                nvidia.com/lpu: "16"
              requests:
                cpu: "62"
                hugepages-2Mi: 4Gi
                nvidia.com/lpu: "16"
            securityContext:
              privileged: true
            startupProbe:
              exec:
                command:
                - /bin/hydra-entrypoint
                - ready
              failureThreshold: 240
              periodSeconds: 5
              successThreshold: 1
              timeoutSeconds: 1
            volumeMounts:
            - mountPath: /nfs
              name: model-storage
            - mountPath: /dev/hugepages
              name: hugepages
            - mountPath: /sys
              name: host-sys
            - mountPath: /dev
              name: host-dev
            - mountPath: /ssh-pk
              name: ssh-secret
              readOnly: true
            - mountPath: /dev/shm
              name: shared-memory
            - mountPath: /run/lpx-topology
              name: lpx-topology
          dnsPolicy: ClusterFirstWithHostNet
          hostIPC: true
          hostNetwork: true
          initContainers:
          - args:
            - lpx
            env:
            - name: LPX_DEPLOYMENT
              value: 88888888-8888-4888-8888-888888888888
            - name: DYN_LPX_TOPOLOGY_ROLE
              value: publisher
            - name: DYN_LPX_TOPOLOGY_AGENT_SOCKET
              value: /run/lpx-topology/agent.sock
            - name: DYN_SIDECAR_NODE_RANK
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['grove.io/podclique-pod-index']
            - name: LPX_MODEL_PATH
              value: /nfs/node-local-v3-hx-connected-lpx
            - name: DYN_COMPONENT
              value: lpx
            - name: DYN_DISCOVERY_BACKEND
              value: kubernetes
            - name: DYN_NAMESPACE
              value: test-node-local-v3-hx-hybrid-topology
            - name: DYN_PARENT_DGD_K8S_NAME
              value: node-local-v3-hx-hybrid-topology
            - name: DYN_PARENT_DGD_K8S_NAMESPACE
              value: test
            - name: DYN_SYSTEM_ENABLED
              value: "true"
            - name: DYN_SYSTEM_PORT
              value: "18090"
            - name: ETCD_ENDPOINTS
              value: etcd-address
            - name: NATS_SERVER
              value: nats-address
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            image: example.invalid/dynamo-sidecar:test
            name: runtime
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /health
                port: 18090
              periodSeconds: 5
              timeoutSeconds: 4
            resources: {}
            restartPolicy: Always
            volumeMounts:
            - mountPath: /run/lpx-topology
              name: lpx-topology
          restartPolicy: Always
          schedulerName: lpx-scheduler
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          serviceAccountName: node-local-v3-hx-hybrid-topology-k8s-service-discovery
          terminationGracePeriodSeconds: 60
          tolerations:
          - key: lpu.nvidia.com/node
            operator: Exists
          volumes:
          - name: model-storage
            persistentVolumeClaim:
              claimName: model-storage
          - emptyDir:
              medium: HugePages
            name: hugepages
          - hostPath:
              path: /sys
              type: Directory
            name: host-sys
          - hostPath:
              path: /dev
              type: Directory
            name: host-dev
          - name: ssh-secret
            secret:
              defaultMode: 420
              secretName: ssh-secret
          - emptyDir:
              medium: Memory
              sizeLimit: 8Gi
            name: shared-memory
          - emptyDir: {}
            name: lpx-topology
        replicas: 1
        roleName: agt
    - annotations:
        lpx.nvidia.com/deployment-name: node-local-v3-hx-hybrid-topology
        nvidia.com/dynamo-discovery-backend: kubernetes
        scheduling.lpu.nvidia.com/dynamo-workload-digest: sha256:54583da5d6b188b47fdd57bd72c54e310ab2e5493b03373ee8735c6c61be328e
        scheduling.lpu.nvidia.com/role: cyborg-worker
      labels:
        lpx.nvidia.com/serving: "true"
        nvidia.com/dynamo-component: lpu
        nvidia.com/dynamo-component-type: lpx
        nvidia.com/dynamo-discovery-backend: kubernetes
        nvidia.com/dynamo-discovery-enabled: "true"
        nvidia.com/dynamo-graph-deployment-name: node-local-v3-hx-hybrid-topology
        nvidia.com/dynamo-namespace: test-node-local-v3-hx-hybrid-topology
        nvidia.com/metrics-enabled: "true"
        nvidia.com/selector: node-local-v3-hx-hybrid-topology-lpu
      name: cond
      spec:
        minAvailable: 1
        podSpec:
          containers:
          - args:
            - serve
            - --dynamo-readiness-port
            - "9091"
            command:
            - /opt/gpu-runtime
            env:
            - name: LPX_ALLOCATION
              value: agt
            - name: LPX_LOCAL_PARTITION_IDS
            - name: LPX_MODEL_PATH
              value: /nfs/node-local-v3-hx-connected-lpx
            - name: LPX_DEPLOYMENT
              value: 88888888-8888-4888-8888-888888888888
            - name: CYBORG_LPU_TOPOLOGY_SOCKET
              value: /run/lpx-topology/topology.sock
            - name: GBUILD_MANIFEST_PATH
              value: /nfs/node-local-v3-hx-connected-lpx/manifest.v2.capnp.bin
            - name: CYBORG_FPGA_GPI_REPLICA_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['grove.io/podclique-pod-index']
            image: example.invalid/gpu-runtime:test
            name: main
            ports:
            - containerPort: 9091
              name: readiness
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /health
                port: readiness
              periodSeconds: 10
              timeoutSeconds: 4
            resources:
              claims:
              - name: gpu
            volumeMounts:
            - mountPath: /nfs
              name: model-storage
            - mountPath: /dev/shm
              name: shared-memory
            - mountPath: /run/lpx-topology
              name: lpx-topology
          initContainers:
          - args:
            - lpx
            - --model-path
            - $(LPX_MODEL_PATH)/tokenizer
            env:
            - name: LPX_DEPLOYMENT
              value: 88888888-8888-4888-8888-888888888888
            - name: DYN_LPX_TOPOLOGY_ROLE
              value: consumer
            - name: DYN_LPX_TOPOLOGY_SOCKET
              value: /run/lpx-topology/topology.sock
            - name: LPX_MODEL_PATH
              value: /nfs/node-local-v3-hx-connected-lpx
            - name: DYN_COMPONENT
              value: decode
            - name: DYN_DISCOVERY_BACKEND
              value: kubernetes
            - name: DYN_NAMESPACE
              value: test-node-local-v3-hx-hybrid-topology
            - name: DYN_PARENT_DGD_K8S_NAME
              value: node-local-v3-hx-hybrid-topology
            - name: DYN_PARENT_DGD_K8S_NAMESPACE
              value: test
            - name: DYN_SYSTEM_ENABLED
              value: "true"
            - name: DYN_SYSTEM_PORT
              value: "9090"
            - name: ETCD_ENDPOINTS
              value: etcd-address
            - name: NATS_SERVER
              value: nats-address
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            image: example.invalid/dynamo-sidecar:test
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /live
                port: system
              periodSeconds: 5
              timeoutSeconds: 4
            name: runtime
            ports:
            - containerPort: 9090
              name: system
              protocol: TCP
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /health
                port: system
              periodSeconds: 5
              timeoutSeconds: 4
            resources: {}
            restartPolicy: Always
            startupProbe:
              failureThreshold: 30
              httpGet:
                path: /live
                port: system
              periodSeconds: 2
              timeoutSeconds: 1
            volumeMounts:
            - mountPath: /nfs
              name: model-storage
              readOnly: true
            - mountPath: /run/lpx-topology
              name: lpx-topology
          resourceClaims:
          - name: gpu
            resourceClaimTemplateName: decode-gpu
          restartPolicy: Always
          schedulerName: lpx-scheduler
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          serviceAccountName: node-local-v3-hx-hybrid-topology-k8s-service-discovery
          terminationGracePeriodSeconds: 60
          volumes:
          - name: model-storage
            persistentVolumeClaim:
              claimName: model-storage
          - emptyDir:
              medium: Memory
              sizeLimit: 8Gi
            name: shared-memory
          - emptyDir: {}
            name: lpx-topology
        replicas: 1
        roleName: cond
        startsAfter:
        - agt
    headlessServiceConfig:
      publishNotReadyAddresses: true
    podCliqueScalingGroups:
    - annotations:
        lpx.nvidia.com/deployment-name: node-local-v3-hx-hybrid-topology
        scheduling.lpu.nvidia.com/dynamo-workload-digest: sha256:54583da5d6b188b47fdd57bd72c54e310ab2e5493b03373ee8735c6c61be328e
      cliqueNames:
      - agt
      - cond
      minAvailable: 1
      name: lpx
      replicas: 1
    terminationDelay: 15m0s
