metadata:
  annotations:
    lpx.nvidia.com/deployment-name: units-qwen
  labels:
    lpx.nvidia.com/deployment-uid: lpx-render-uid
    nvidia.com/dynamo-graph-deployment-name: units-qwen
  name: units-qwen-b1bb
  namespace: test
spec:
  replicas: 1
  template:
    cliqueStartupType: CliqueStartupTypeExplicit
    cliques:
    - annotations:
        lpx.nvidia.com/deployment-name: units-qwen
        scheduling.lpu.nvidia.com/compiler-snapshot-digest: sha256:c660acb4745fc3c2528f00238f39e59a8ac0604292de9408118ad4601bc65c3f
        scheduling.lpu.nvidia.com/dynamo-workload-digest: sha256:33780178ec56d1592907b7334d91eac5f6815f1ff09b9917ebdda8635f332870
        scheduling.lpu.nvidia.com/model: default
        scheduling.lpu.nvidia.com/role: agent
        scheduling.lpu.nvidia.com/workload-mode: v3HxLpuOnly
      labels:
        lpx.nvidia.com/serving: "true"
        nvidia.com/dynamo-component: lpu
        nvidia.com/dynamo-component-type: lpx
        nvidia.com/dynamo-graph-deployment-name: units-qwen
        nvidia.com/dynamo-namespace: test-units-qwen
        nvidia.com/metrics-enabled: "true"
        nvidia.com/selector: units-qwen-lpu
      name: agt
      spec:
        minAvailable: 2
        podSpec:
          containers:
          - env:
            - name: LPX_LOCAL_PARTITION_IDS
            - name: LPX_MODEL_PATH
              value: /nfs/units-qwen
            - name: MODEL_PATH
              value: $(LPX_MODEL_PATH)
            image: example.invalid/quasar:test
            name: main
            resources:
              limits:
                lpu.nvidia.com/devices: "1"
                nvidia.com/lpu: "16"
              requests:
                nvidia.com/lpu: "16"
            volumeMounts:
            - mountPath: /nfs
              name: model-storage
            - mountPath: /run/openengine
              name: openengine
            - mountPath: /dev/shm
              name: shared-memory
          initContainers:
          - args:
            - lpx
            - --grpc-endpoint
            - unix:///run/openengine/openengine.sock
            - --model-path
            - $(LPX_MODEL_PATH)/tokenizer
            - --node-rank
            - $(GROVE_PCLQ_POD_INDEX)
            env:
            - name: LPX_MODEL_PATH
              value: /nfs/units-qwen
            - name: DYN_COMPONENT
              value: lpx
            - name: DYN_DISCOVERY_BACKEND
              value: kubernetes
            - name: DYN_NAMESPACE
              value: test-units-qwen
            - name: DYN_PARENT_DGD_K8S_NAME
              value: units-qwen
            - name: DYN_PARENT_DGD_K8S_NAMESPACE
              value: test
            - name: DYN_SYSTEM_ENABLED
              value: "true"
            - name: DYN_SYSTEM_PORT
              value: "9090"
            - name: ETCD_ENDPOINTS
              value: etcd-address
            - name: NATS_SERVER
              value: nats-address
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            image: example.invalid/dynamo-sidecar:test
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /live
                port: system
              periodSeconds: 5
              timeoutSeconds: 4
            name: runtime
            ports:
            - containerPort: 9090
              name: system
              protocol: TCP
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /health
                port: system
              periodSeconds: 5
              timeoutSeconds: 4
            resources: {}
            restartPolicy: Always
            startupProbe:
              failureThreshold: 30
              httpGet:
                path: /live
                port: system
              periodSeconds: 2
              timeoutSeconds: 1
            volumeMounts:
            - mountPath: /nfs
              name: model-storage
              readOnly: true
            - mountPath: /run/openengine
              name: openengine
          restartPolicy: Always
          schedulerName: lpx-scheduler
          terminationGracePeriodSeconds: 60
          volumes:
          - name: model-storage
            persistentVolumeClaim:
              claimName: model-storage
          - emptyDir: {}
            name: openengine
          - emptyDir:
              medium: Memory
              sizeLimit: 8Gi
            name: shared-memory
        replicas: 2
        roleName: agt
    headlessServiceConfig:
      publishNotReadyAddresses: true
    podCliqueScalingGroups:
    - annotations:
        lpx.nvidia.com/deployment-name: units-qwen
        scheduling.lpu.nvidia.com/dynamo-workload-digest: sha256:33780178ec56d1592907b7334d91eac5f6815f1ff09b9917ebdda8635f332870
      cliqueNames:
      - agt
      minAvailable: 1
      name: lpx
      replicas: 1
    terminationDelay: 15m0s
