metadata:
  annotations:
    lpx.nvidia.com/deployment-name: node-local-v2-lpu-only
  labels:
    lpx.nvidia.com/deployment-uid: lpx-render-uid
    nvidia.com/dynamo-graph-deployment-name: node-local-v2-lpu-only
  name: node-local-v2-lpu-only-33b1
  namespace: test
spec:
  replicas: 1
  template:
    cliqueStartupType: CliqueStartupTypeExplicit
    cliques:
    - annotations:
        lpx.nvidia.com/deployment-name: node-local-v2-lpu-only
        scheduling.lpu.nvidia.com/compiler-snapshot-digest: sha256:732b9f6d82c0710eb5af219d64eb6035411d9d796e52914095d2048b419eb0d5
        scheduling.lpu.nvidia.com/dynamo-workload-digest: sha256:7cb034a93a830cf4bc54191fae9132e7975827e376e8dc9cb489006640f5256f
        scheduling.lpu.nvidia.com/model: default
        scheduling.lpu.nvidia.com/role: agent
        scheduling.lpu.nvidia.com/workload-mode: v2LpuOnly
      labels:
        lpx.nvidia.com/serving: "true"
        nvidia.com/dynamo-component: lpu
        nvidia.com/dynamo-component-type: lpx
        nvidia.com/dynamo-graph-deployment-name: node-local-v2-lpu-only
        nvidia.com/dynamo-namespace: test-node-local-v2-lpu-only
        nvidia.com/metrics-enabled: "true"
        nvidia.com/selector: node-local-v2-lpu-only-lpu
      name: agt
      spec:
        minAvailable: 4
        podSpec:
          containers:
          - env:
            - name: LPX_LOCAL_PARTITION_IDS
            - name: LPX_MODEL_PATH
              value: /nfs/node-local-v2-connected
            - name: LPU_RUN_SYSTEM_INIT
              value: "true"
            - name: MODEL_PATH
              value: $(LPX_MODEL_PATH)
            image: example.invalid/quasar:test
            name: main
            readinessProbe:
              failureThreshold: 3
              initialDelaySeconds: 10
              periodSeconds: 5
              successThreshold: 1
              tcpSocket:
                port: 2222
              timeoutSeconds: 1
            resources:
              limits:
                hugepages-2Mi: 4Gi
                lpu.nvidia.com/devices: "1"
                lpu.nvidia.com/lpu: "8"
              requests:
                cpu: "62"
                hugepages-2Mi: 4Gi
                lpu.nvidia.com/lpu: "8"
            securityContext:
              privileged: true
            volumeMounts:
            - mountPath: /nfs
              name: model-storage
            - mountPath: /dev
              name: host-dev
            - mountPath: /sys
              name: host-sys
            - mountPath: /ssh-pk
              name: ssh-secret
              readOnly: true
            - mountPath: /dev/hugepages
              name: hugepages
            - mountPath: /run/openengine
              name: openengine
            - mountPath: /dev/shm
              name: shared-memory
          dnsPolicy: ClusterFirstWithHostNet
          hostIPC: true
          hostNetwork: true
          initContainers:
          - args:
            - lpx
            - --grpc-endpoint
            - unix:///run/openengine/openengine.sock
            - --model-path
            - $(LPX_MODEL_PATH)/tokenizer
            - --node-rank
            - $(GROVE_PCLQ_POD_INDEX)
            env:
            - name: LPX_MODEL_PATH
              value: /nfs/node-local-v2-connected
            - name: DYN_COMPONENT
              value: lpx
            - name: DYN_DISCOVERY_BACKEND
              value: kubernetes
            - name: DYN_NAMESPACE
              value: test-node-local-v2-lpu-only
            - name: DYN_PARENT_DGD_K8S_NAME
              value: node-local-v2-lpu-only
            - name: DYN_PARENT_DGD_K8S_NAMESPACE
              value: test
            - name: DYN_SYSTEM_ENABLED
              value: "true"
            - name: DYN_SYSTEM_PORT
              value: "18090"
            - name: ETCD_ENDPOINTS
              value: etcd-address
            - name: NATS_SERVER
              value: nats-address
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            image: example.invalid/dynamo-sidecar:test
            name: runtime
            readinessProbe:
              httpGet:
                path: /health
                port: 18090
            resources: {}
            restartPolicy: Always
            volumeMounts:
            - mountPath: /nfs
              name: model-storage
              readOnly: true
            - mountPath: /run/openengine
              name: openengine
          restartPolicy: Always
          schedulerName: lpx-scheduler
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          terminationGracePeriodSeconds: 60
          tolerations:
          - key: lpu.nvidia.com/node
            operator: Exists
          volumes:
          - name: model-storage
            persistentVolumeClaim:
              claimName: model-storage
          - hostPath:
              path: /dev
              type: Directory
            name: host-dev
          - hostPath:
              path: /sys
              type: Directory
            name: host-sys
          - name: ssh-secret
            secret:
              defaultMode: 420
              secretName: ssh-secret
          - emptyDir:
              medium: HugePages
            name: hugepages
          - emptyDir: {}
            name: openengine
          - emptyDir:
              medium: Memory
              sizeLimit: 8Gi
            name: shared-memory
        replicas: 4
        roleName: agt
    headlessServiceConfig:
      publishNotReadyAddresses: true
    podCliqueScalingGroups:
    - annotations:
        lpx.nvidia.com/deployment-name: node-local-v2-lpu-only
        scheduling.lpu.nvidia.com/dynamo-workload-digest: sha256:7cb034a93a830cf4bc54191fae9132e7975827e376e8dc9cb489006640f5256f
      cliqueNames:
      - agt
      minAvailable: 1
      name: lpx
      replicas: 1
    terminationDelay: 15m0s
status:
  availableReplicas: 0
  updatedReplicas: 0
