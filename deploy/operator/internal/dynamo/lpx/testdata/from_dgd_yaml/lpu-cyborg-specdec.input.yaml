apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: lpu-cyborg-specdec
  namespace: test
  uid: 22222222-2222-4222-8222-222222222222
  generation: 1
spec:
  components:
  - name: draft
    type: lpx
    replicas: 1
    lpx:
      buildId: node-local-v2-connected
    roles:
    - name: conductor
      podTemplate:
        spec:
          volumes:
          - name: model-storage
            persistentVolumeClaim:
              claimName: model-storage
          containers:
          - name: main
            volumeMounts:
            - name: model-storage
              mountPath: /models
            image: example.invalid/lpu-conductor:test
            command: [/opt/dynamo-lpu]
            args: [serve]
    - name: agent
      podTemplate:
        spec:
          volumes:
          - name: model-storage
            persistentVolumeClaim:
              claimName: model-storage
          containers:
          - name: main
            volumeMounts:
            - name: model-storage
              mountPath: /models
            image: example.invalid/lpu-agent:test
            command: [/opt/dynamo-lpu]
            args: [serve]
  - name: target
    type: lpx
    replicas: 1
    lpx:
      buildId: node-local-v2-connected-lpx
    roles:
    - name: conductor
      replicas: 1
      podTemplate:
        spec:
          resourceClaims:
          - name: gpu
            resourceClaimTemplateName: decode-gpu
          volumes:
          - name: model-storage
            persistentVolumeClaim:
              claimName: model-storage
          - name: openengine
            emptyDir: {}
          initContainers:
          - name: runtime
            image: example.invalid/dynamo-sidecar:test
            restartPolicy: Always
            args: [lpx, --grpc-endpoint, unix:///run/openengine/openengine.sock, --model-path, $(LPX_MODEL_PATH)/tokenizer]
            volumeMounts:
            - name: model-storage
              mountPath: /models
              readOnly: true
            - name: openengine
              mountPath: /run/openengine
          containers:
          - name: main
            volumeMounts:
            - name: model-storage
              mountPath: /models
            - name: openengine
              mountPath: /run/openengine
            image: example.invalid/cyborg-specdecode:test
            command: [python, -m, dynamo.cyborg]
            resources:
              claims:
              - name: gpu
    - name: agent
      podTemplate:
        spec:
          volumes:
          - name: model-storage
            persistentVolumeClaim:
              claimName: model-storage
          containers:
          - name: main
            volumeMounts:
            - name: model-storage
              mountPath: /models
            image: example.invalid/lpu-agent:test
            command: [/opt/dynamo-lpu]
            args: [serve]
