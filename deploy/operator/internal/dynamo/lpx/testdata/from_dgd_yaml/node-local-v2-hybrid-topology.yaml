              value: "true"
            - name: DYN_SYSTEM_PORT
              value: "18090"
            - name: ETCD_ENDPOINTS
              value: etcd-address
            - name: NATS_SERVER
              value: nats-address
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            image: example.invalid/dynamo-sidecar:test
            name: runtime
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /health
                port: 18090
              periodSeconds: 5
              timeoutSeconds: 4
            resources: {}
            restartPolicy: Always
            volumeMounts:
            - mountPath: /run/lpx-topology
              name: lpx-topology
          restartPolicy: Always
          schedulerName: lpx-scheduler
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          serviceAccountName: node-local-v2-hybrid-topology-k8s-service-discovery
          terminationGracePeriodSeconds: 60
          tolerations:
          - key: lpu.nvidia.com/node
            operator: Exists
          volumes:
          - name: model-storage
            persistentVolumeClaim:
