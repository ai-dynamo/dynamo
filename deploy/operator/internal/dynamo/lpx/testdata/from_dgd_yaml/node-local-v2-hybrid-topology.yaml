              value: consumer
            - name: DYN_LPX_TOPOLOGY_SOCKET
              value: /run/lpx-topology/topology.sock
            - name: LPX_MODEL_PATH
              value: /nfs/node-local-v2-connected-lpx
            - name: DYN_COMPONENT
              value: decode
            - name: DYN_DISCOVERY_BACKEND
              value: kubernetes
            - name: DYN_NAMESPACE
              value: test-node-local-v2-hybrid-topology
            - name: DYN_PARENT_DGD_K8S_NAME
              value: node-local-v2-hybrid-topology
            - name: DYN_PARENT_DGD_K8S_NAMESPACE
              value: test
            - name: DYN_SYSTEM_ENABLED
              value: "true"
            - name: DYN_SYSTEM_PORT
              value: "9090"
            - name: ETCD_ENDPOINTS
              value: etcd-address
            - name: NATS_SERVER
              value: nats-address
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            image: example.invalid/dynamo-sidecar:test
            livenessProbe:
