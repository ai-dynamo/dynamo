            volumeMounts:
            - mountPath: /dev/infiniband
              name: infiniband
            - mountPath: /nfs
              name: model-storage
            - mountPath: /dev/shm
              name: shared-memory
            - mountPath: /run/lpx-topology
              name: lpx-topology
