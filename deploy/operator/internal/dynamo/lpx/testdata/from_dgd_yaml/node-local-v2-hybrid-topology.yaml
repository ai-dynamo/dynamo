            name: hugepages
          - hostPath:
              path: /sys
              type: Directory
            name: host-sys
          - hostPath:
              path: /dev
              type: Directory
            name: host-dev
          - name: ssh-secret
            secret:
              defaultMode: 420
              secretName: ssh-secret
          - emptyDir:
              medium: Memory
              sizeLimit: 8Gi
            name: shared-memory
          - emptyDir: {}
            name: lpx-topology
        replicas: 4
        roleName: agt
    - annotations:
        lpx.nvidia.com/deployment-name: node-local-v2-hybrid-topology
        nvidia.com/dynamo-discovery-backend: kubernetes
        scheduling.lpu.nvidia.com/dynamo-workload-digest: sha256:2c4af29ceff09a818bd40a75337da3523c304cc3a9c0a3b04ce5b44c99ad8922
