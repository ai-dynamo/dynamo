                port: system
              periodSeconds: 5
              timeoutSeconds: 4
            name: runtime
            ports:
            - containerPort: 9090
              name: system
              protocol: TCP
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /health
                port: system
              periodSeconds: 5
              timeoutSeconds: 4
