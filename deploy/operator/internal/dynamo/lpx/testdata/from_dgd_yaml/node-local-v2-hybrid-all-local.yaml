    nvidia.com/dynamo-graph-deployment-name: node-local-v2-hybrid-all-local
  name: node-local-v2-hybrid-all-local-4f40
  namespace: test
spec:
  replicas: 1
  template:
    cliqueStartupType: CliqueStartupTypeExplicit
    cliques:
    - annotations:
        lpx.nvidia.com/deployment-name: node-local-v2-hybrid-all-local
        scheduling.lpu.nvidia.com/dynamo-workload-digest: sha256:1a38fc2f1466131b32a53c4e191d1a522fa5f7c4601adcf1eeb8fbbada6865db
        scheduling.lpu.nvidia.com/role: cyborg-worker
      labels:
        lpx.nvidia.com/serving: "true"
        nvidia.com/dynamo-component: lpu
        nvidia.com/dynamo-component-type: lpx
        nvidia.com/dynamo-graph-deployment-name: node-local-v2-hybrid-all-local
        nvidia.com/dynamo-namespace: test-node-local-v2-hybrid-all-local
        nvidia.com/metrics-enabled: "true"
        nvidia.com/selector: node-local-v2-hybrid-all-local-lpu
      name: cond
      spec:
        minAvailable: 1
        podSpec:
          containers:
          - env:
            - name: LPX_ALLOCATION
            - name: LPX_LOCAL_PARTITION_IDS
              value: "0"
            - name: GBUILD_MANIFEST_PATH
              value: /nfs/node-local-v2-connected-lpx/deployment.v1.capnp.bin
            - name: LPX_MODEL_PATH
              value: /nfs/node-local-v2-connected-lpx
            - name: CYBORG_FPGA_GPI_REPLICA_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['grove.io/podclique-pod-index']
            - name: MODEL_PATH
              value: $(LPX_MODEL_PATH)
            - name: RDMA_PORT
              value: "19877"
            image: example.invalid/cyborg:test
            livenessProbe:
              failureThreshold: 1
              httpGet:
                path: /live
                port: 9091
              periodSeconds: 5
              timeoutSeconds: 4
            name: main
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /health
                port: 9091
              periodSeconds: 10
              timeoutSeconds: 4
            resources:
              claims:
              - name: gpu
            startupProbe:
              failureThreshold: 720
              httpGet:
                path: /live
                port: 9091
              periodSeconds: 10
              timeoutSeconds: 5
            volumeMounts:
            - mountPath: /dev/infiniband
              name: infiniband
            - mountPath: /nfs
              name: model-storage
            - mountPath: /run/openengine
              name: openengine
            - mountPath: /dev/shm
              name: shared-memory
          initContainers:
          - args:
            - lpx
            - --grpc-endpoint
            - unix:///run/openengine/openengine.sock
            - --model-path
            - $(LPX_MODEL_PATH)/tokenizer
            env:
            - name: LPX_MODEL_PATH
              value: /nfs/node-local-v2-connected-lpx
            - name: DYN_COMPONENT
              value: decode
            - name: DYN_DISCOVERY_BACKEND
              value: kubernetes
            - name: DYN_NAMESPACE
              value: test-node-local-v2-hybrid-all-local
            - name: DYN_PARENT_DGD_K8S_NAME
              value: node-local-v2-hybrid-all-local
            - name: DYN_PARENT_DGD_K8S_NAMESPACE
              value: test
            - name: DYN_SYSTEM_ENABLED
              value: "true"
            - name: DYN_SYSTEM_PORT
              value: "9090"
            - name: ETCD_ENDPOINTS
              value: etcd-address
            - name: NATS_SERVER
              value: nats-address
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            image: example.invalid/dynamo-sidecar:test
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /live
                port: system
              periodSeconds: 5
              timeoutSeconds: 4
            name: runtime
            ports:
            - containerPort: 9090
              name: system
              protocol: TCP
            readinessProbe:
              failureThreshold: 3
              httpGet:
                path: /health
                port: system
              periodSeconds: 5
              timeoutSeconds: 4
            resources: {}
            restartPolicy: Always
            startupProbe:
              failureThreshold: 30
              httpGet:
                path: /live
                port: system
              periodSeconds: 2
              timeoutSeconds: 1
            volumeMounts:
            - mountPath: /nfs
              name: model-storage
              readOnly: true
            - mountPath: /run/openengine
              name: openengine
          resourceClaims:
          - name: gpu
            resourceClaimTemplateName: decode-gpu
          restartPolicy: Always
          schedulerName: lpx-scheduler
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          terminationGracePeriodSeconds: 60
          volumes:
          - hostPath:
              path: /dev/infiniband
              type: Directory
            name: infiniband
          - name: model-storage
            persistentVolumeClaim:
              claimName: model-storage
          - emptyDir: {}
            name: openengine
          - emptyDir:
              medium: Memory
              sizeLimit: 8Gi
            name: shared-memory
        replicas: 1
        roleName: cond
    headlessServiceConfig:
      publishNotReadyAddresses: true
    podCliqueScalingGroups:
    - annotations:
        lpx.nvidia.com/deployment-name: node-local-v2-hybrid-all-local
        scheduling.lpu.nvidia.com/dynamo-workload-digest: sha256:1a38fc2f1466131b32a53c4e191d1a522fa5f7c4601adcf1eeb8fbbada6865db
      cliqueNames:
      - cond
      minAvailable: 1
      name: lpx
      replicas: 1
    terminationDelay: 15m0s
