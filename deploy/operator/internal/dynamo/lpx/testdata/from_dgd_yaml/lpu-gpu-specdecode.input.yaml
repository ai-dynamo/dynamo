apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: lpu-gpu-specdecode
  namespace: test
  uid: 22222222-2222-4222-8222-222222222222
  generation: 1
spec:
  components:
  - name: draft
    type: lpx
    replicas: 1
    lpx:
      buildId: node-local-v2-connected
    roles:
    - name: agent
      podTemplate:
        spec:
          volumes:
          - name: model-storage
            persistentVolumeClaim:
              claimName: model-storage
          - name: openengine
            emptyDir: {}
          containers:
          - name: main
            volumeMounts:
            - name: model-storage
              mountPath: /models
            - name: openengine
              mountPath: /run/openengine
            image: example.invalid/lpu-agent:test
            command: [/opt/dynamo-lpu]
            args: [serve]
          initContainers:
          - name: runtime
            image: example.invalid/dynamo-sidecar:test
            restartPolicy: Always
            args:
            - lpx
            - --grpc-endpoint
            - unix:///run/openengine/openengine.sock
            - --model-path
            - $(LPX_MODEL_PATH)/tokenizer
            - --node-rank
            - $(GROVE_PCLQ_POD_INDEX)
            volumeMounts:
            - name: model-storage
              mountPath: /models
              readOnly: true
            - name: openengine
              mountPath: /run/openengine
  - name: target
    type: worker
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: example.invalid/vllm-target:test
          command: [python, -m, dynamo.vllm]
          args: [--experimental-external-draft-endpoint, $(DYN_NAMESPACE)-$(DYN_NAMESPACE_WORKER_SUFFIX)/lpx/generate]
          resources:
            limits:
              nvidia.com/gpu: '1'
