data:
  datacenter.toml: |
    model_base_paths = ['/nfs']

    [datacenters]
    [datacenters.racks]
    [datacenters.racks.agt0]
    available_nodes = [0]
    node_name_template = '${GROVE_PCSG_NAME}-${GROVE_PCSG_INDEX}-agt0-{node}.${GROVE_HEADLESS_SERVICE}'
    preferred_start = 0

    [datacenters.racks.agt1]
    available_nodes = [0]
    node_name_template = '${GROVE_PCSG_NAME}-${GROVE_PCSG_INDEX}-agt1-{node}.${GROVE_HEADLESS_SERVICE}'
    preferred_start = 0

    [datacenters.racks.agt2]
    available_nodes = [0]
    node_name_template = '${GROVE_PCSG_NAME}-${GROVE_PCSG_INDEX}-agt2-{node}.${GROVE_HEADLESS_SERVICE}'
    preferred_start = 0
  model_config.toml: |
    draft_to_target_port = 23456
    head_to_head_port = 23458
    num_drafts = 2
    target_to_draft_port = 23457
    type = 'SpecDecode'

    [draft]
    [draft.iop]
    batch_size = 1
    cpu_embeddings = false
    dkvc = false
    input_size = 1
    model_path = '/nfs/node-local-v3-hx-sd-draft'
    num_kv_caches = 1
    output_size = 1
    prop_sync = false
    sequence_length = 8192
    stop_tokens = [1]
    tokenizer_path = '/nfs/node-local-v3-hx-sd-draft/tokenizer'

    [draft.scheduler]

    [draft.setup]
    resolved_partitions_dir = '/configs'
    setup_ops_format = 'agent_v2'

    [target]
    [target.iop]
    batch_size = 1
    cpu_embeddings = false
    dkvc = false
    input_size = 1
    model_path = '/nfs/node-local-v3-hx-sd-target'
    num_kv_caches = 1
    output_size = 1
    prop_sync = false
    sequence_length = 8192
    stop_tokens = [1]
    tokenizer_path = '/nfs/node-local-v3-hx-sd-target/tokenizer'

    [target.scheduler]

    [target.setup]
    resolved_partitions_dir = '/configs'
    setup_ops_format = 'agent_v2'
  nodes_per_partition: |-
    1
    1
    1
  partition_ids: |-
    1
    1
    1
  partition_indices: |-
    0
    0
    0
  partition_models: |-
    draft0
    draft1
    target
  partition_node_offsets: |-
    0
    0
    0
  partition_paths: |-
    part-1
    part-1
    part-1
  topologies: |-
    opaque-v3-topology
    opaque-v3-topology
    opaque-v3-topology
