data:
  datacenter.toml: |
    model_base_paths = ['/nfs']

    [datacenters]
    [datacenters.racks]
    [datacenters.racks.lpu-wkr-m-0]
    available_nodes = [0, 1, 2, 3]
    node_name_template = '${GROVE_PCSG_NAME}-${GROVE_PCSG_INDEX}-lpu-wkr-m-0-{node}.${GROVE_HEADLESS_SERVICE}'
    preferred_start = 0
  model_config.toml: |
    type = 'Single'

    [iop]
    batch_size = 1
    cpu_embeddings = false
    dkvc = false
    input_size = 1
    model_path = '/testdata/node-local-v2-connected'
    num_kv_caches = 1
    output_size = 1
    prop_sync = true
    sequence_length = 8192
    stop_tokens = [1]
    tokenizer_path = '/testdata/node-local-v2-connected/tokenizer'

    [scheduler]

    [setup]
    resolved_partitions_dir = '/configs'
    setup_ops_format = 'agent_v2'
  nodes_per_partition: |-
    2
    2
  partition_ids: |-
    0
    1
  partition_node_offsets: |-
    0
    2
  partition_paths: |-
    part-0
    part-1
  topologies: |-
    URSA_V2__Q8__16C__G_96_25__KP_FEC__GHZ_1_0__NO_FPGA
    URSA_V2__Q8__16C__G_96_25__KP_FEC__GHZ_1_0__NO_FPGA
