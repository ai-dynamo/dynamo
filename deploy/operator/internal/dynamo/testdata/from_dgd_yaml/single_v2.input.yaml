apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  annotations:
    scheduling.lpu.nvidia.com/scheduler-backend: lpx-scheduler
  generation: 1
  name: dgd-single-v2
  namespace: inference-engine
  uid: 11111111-1111-4111-8111-111111111111
spec:
  components:
    - name: lpu
      type: lpx
      replicas: 1
      lpx:
        buildId: llama3_2-1b-lpu-v2/build_0m851219t7py3mp8x1j5rg9j8c
        settings:
          batch_size: 1
          input_size: 1
          num_kv_caches: 1
          sequence_length: 8192
          stop_tokens:
          - 128001
          - 128008
          - 128009
          tokenizer_path: llama3.1
          vocab_size: 128256
      roles:
      - name: conductor
        podTemplate:
          spec:
            containers:
            - image: nvcr.io/nvidia/ai-dynamo/lpu-runtime:v2
              name: main
              args:
              - --agent-env-vars
              - EXTRA_RUNTIME_KNOB
              env:
              - name: MPI_BTL_TCP_IF_INCLUDE
                value: 7.241.144.0/24
              - name: OMPI_MCA_btl_tcp_if_include
                value: 7.241.144.0/24
              volumeMounts:
              - {name: model-storage, mountPath: /nfs}
              - {name: config, mountPath: /configs}
              - {name: single-v2-ssh-key, mountPath: /tmp/dynamo-lpu-ssh}
            volumes:
            - {name: model-storage, persistentVolumeClaim: {claimName: model-storage}}
            - {name: ssh-secret, secret: {secretName: ssh-secret, defaultMode: 384}}
            - {name: single-v2-ssh-key, emptyDir: {}}
      - name: agent
        podTemplate:
          spec:
            containers:
            - image: nvcr.io/nvidia/ai-dynamo/lpu-runtime:v2
              name: main
              args:
              - --agent-env-vars
              - EXTRA_RUNTIME_KNOB
              env:
              - name: MPI_BTL_TCP_IF_INCLUDE
                value: 7.241.144.0/24
              - name: OMPI_MCA_btl_tcp_if_include
                value: 7.241.144.0/24
              volumeMounts:
              - mountPath: /nfs
                name: model-storage
              - name: config
                mountPath: /configs
              - {name: host-dev, mountPath: /dev}
              - {name: host-sys, mountPath: /sys}
              - {name: ssh-secret, mountPath: /ssh-pk, readOnly: true}
              - {name: hugepages, mountPath: /dev/hugepages}
            volumes:
            - {name: model-storage, persistentVolumeClaim: {claimName: model-storage}}
            - {name: host-dev, hostPath: {path: /dev, type: Directory}}
            - {name: host-sys, hostPath: {path: /sys, type: Directory}}
            - {name: hugepages, emptyDir: {medium: HugePages}}
            - {name: ssh-secret, secret: {secretName: ssh-secret, defaultMode: 420}}
