apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: node-local-v2-specdecode
  namespace: test
  uid: 33333333-3333-4333-8333-333333333333
  generation: 1
  annotations:
    scheduling.lpu.nvidia.com/scheduler-backend: lpx-scheduler
spec:
  components:
    - name: draft
      type: lpx
      replicas: 2
      lpx:
        buildId: node-local-v2-connected
      roles:
      - name: agent
        podTemplate:
          spec:
            containers:
            - name: main
              image: example.invalid/lpu-runtime:test
              resources:
                limits:
                  lpu.nvidia.com/devices: '1'
              volumeMounts:
              - mountPath: /nfs
                name: model-storage
            volumes:
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-storage
    - name: lpu
      type: lpx
      replicas: 1
      lpx:
        buildId: node-local-v2-connected
      roles:
      - name: conductor
      - name: agent
        podTemplate:
          spec:
            containers:
            - name: main
              image: example.invalid/lpu-runtime:test
              resources:
                limits:
                  lpu.nvidia.com/devices: '1'
              volumeMounts:
              - mountPath: /nfs
                name: model-storage
            volumes:
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-storage
