apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: node-local-v2-lpu-only
  namespace: test
  uid: 11111111-1111-4111-8111-111111111111
  generation: 1
  annotations:
    scheduling.lpu.nvidia.com/scheduler-backend: lpx-scheduler
spec:
  components:
    - name: lpu
      type: lpx
      replicas: 1
      lpx:
        buildId: node-local-v2-connected
      roles:
      - name: agent
        podTemplate:
          spec:
            containers:
            - name: main
              image: example.invalid/lpu-runtime:test
              command:
              - /opt/dynamo-lpu
              args:
              - serve
              resources:
                limits:
                  lpu.nvidia.com/devices: '1'
              volumeMounts:
              - mountPath: /nfs
                name: model-storage
            volumes:
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-storage
