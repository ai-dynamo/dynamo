apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: node-local-v2-hybrid
  namespace: test
  uid: 22222222-2222-4222-8222-222222222222
  generation: 1
  annotations:
    scheduling.lpu.nvidia.com/scheduler-backend: lpx-scheduler
spec:
  components:
    - name: lpu
      type: lpx
      replicas: 1
      lpx:
        buildId: node-local-v2-connected-lpx
      roles:
      - name: conductor
        replicas: 1
        podTemplate:
          spec:
            resourceClaims:
            - name: gpu
              resourceClaimTemplateName: decode-gpu
            containers:
            - name: main
              image: example.invalid/gpu-runtime:test
              command:
              - /opt/gpu-runtime
              args:
              - serve
              volumeMounts:
              - name: config
                mountPath: /configs
              - name: infiniband
                mountPath: /dev/infiniband
              - {name: model-storage, mountPath: /nfs}
              resources:
                claims:
                - name: gpu
            volumes:
            - name: infiniband
              hostPath:
                path: /dev/infiniband
                type: Directory
            - {name: model-storage, persistentVolumeClaim: {claimName: model-storage}}
      - name: agent
        podTemplate:
          spec:
            containers:
            - name: main
              image: example.invalid/lpu-runtime:test
              command:
              - /opt/dynamo-lpu
              args:
              - serve
              resources:
                limits:
                  lpu.nvidia.com/devices: '1'
              volumeMounts:
              - mountPath: /nfs
                name: model-storage
              - name: config
                mountPath: /configs
              - {name: hugepages, mountPath: /dev/hugepages}
              - {name: host-sys, mountPath: /sys}
              - {name: host-dev, mountPath: /dev}
              - {name: ssh-secret, mountPath: /ssh-pk, readOnly: true}
            volumes:
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-storage
            - {name: host-dev, hostPath: {path: /dev, type: Directory}}
            - {name: host-sys, hostPath: {path: /sys, type: Directory}}
            - {name: hugepages, emptyDir: {medium: HugePages}}
            - {name: ssh-secret, secret: {secretName: ssh-secret, defaultMode: 420}}
