apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: node-local-v3-hx-lpu-only
  namespace: test
  uid: 33333333-3333-4333-8333-333333333333
  generation: 1
  annotations:
    scheduling.lpu.nvidia.com/scheduler-backend: lpx-scheduler
spec:
  components:
    - name: lpu
      type: lpx
      replicas: 1
      lpx:
        buildId: node-local-v3-hx-connected
      roles:
      - name: conductor
        podTemplate:
          spec:
            containers:
            - name: main
              image: example.invalid/lpu-runtime:test
              args:
              - --instance-model-name
              - test/llama32-1b-lp30
              volumeMounts:
              - {name: model-storage, mountPath: /nfs}
              - {name: config, mountPath: /configs}
              - {name: single-v2-ssh-key, mountPath: /tmp/dynamo-lpu-ssh}
            volumes:
            - {name: model-storage, persistentVolumeClaim: {claimName: model-storage}}
            - {name: ssh-secret, secret: {secretName: ssh-secret, defaultMode: 384}}
            - {name: single-v2-ssh-key, emptyDir: {}}
      - name: agent
        podTemplate:
          spec:
            containers:
            - name: main
              image: example.invalid/lpu-runtime:test
              args:
              - --instance-model-name
              - test/llama32-1b-lp30
              resources:
                limits:
                  lpu.nvidia.com/devices: '1'
              volumeMounts:
              - mountPath: /nfs
                name: model-storage
              - name: config
                mountPath: /configs
              - {name: host-dev, mountPath: /dev}
              - {name: host-sys, mountPath: /sys}
              - {name: ssh-secret, mountPath: /ssh-pk, readOnly: true}
            volumes:
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-storage
            - {name: host-dev, hostPath: {path: /dev, type: Directory}}
            - {name: host-sys, hostPath: {path: /sys, type: Directory}}
            - {name: ssh-secret, secret: {secretName: ssh-secret, defaultMode: 420}}
