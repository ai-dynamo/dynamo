apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: node-local-v3-hx-hybrid
  namespace: test
  uid: 44444444-4444-4444-8444-444444444444
  generation: 1
  annotations:
    scheduling.lpu.nvidia.com/scheduler-backend: lpx-scheduler
spec:
  components:
    - name: lpu
      type: lpx
      replicas: 1
      lpx:
        buildId: node-local-v3-hx-connected-lpx
      roles:
      - name: conductor
        replicas: 1
        podTemplate:
          spec:
            resourceClaims:
            - name: gpu
              resourceClaimTemplateName: decode-gpu
            containers:
            - name: main
              image: example.invalid/gpu-runtime:test
              command:
              - /opt/gpu-runtime
              args:
              - serve
              startupProbe:
                failureThreshold: 720
                httpGet:
                  path: /live
                  port: system
                periodSeconds: 10
                timeoutSeconds: 5
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /health
                  port: system
                periodSeconds: 10
                timeoutSeconds: 4
              livenessProbe:
                failureThreshold: 1
                httpGet:
                  path: /live
                  port: system
                periodSeconds: 5
                timeoutSeconds: 4
              volumeMounts:
              - {name: model-storage, mountPath: /nfs}
              resources:
                claims:
                - name: gpu
            volumes:
            - {name: model-storage, persistentVolumeClaim: {claimName: model-storage}}
      - name: agent
        podTemplate:
          spec:
            containers:
            - name: main
              image: example.invalid/lpu-runtime:test
              args:
              - start
              resources:
                limits:
                  lpu.nvidia.com/devices: '1'
              command:
              - /bin/hydra-entrypoint
              startupProbe:
                exec:
                  command:
                  - /bin/hydra-entrypoint
                  - ready
                failureThreshold: 240
                periodSeconds: 5
                successThreshold: 1
                timeoutSeconds: 1
              readinessProbe:
                exec:
                  command:
                  - /bin/hydra-entrypoint
                  - ready
                failureThreshold: 6
                periodSeconds: 5
                successThreshold: 1
                timeoutSeconds: 1
              env:
              - name: GLUE_RDMA_PATH_MTU
                value: '1024'
              - name: NIC_NAME
                value: mlx5_0
              - name: UCX_TLS
                value: tcp
              - name: RDMA_PORT
                value: '19877'
              - name: READINESS_PORT
                value: '19878'
              volumeMounts:
              - mountPath: /nfs
                name: model-storage
              - name: config
                mountPath: /configs
              - {name: hugepages, mountPath: /dev/hugepages}
              - {name: host-sys, mountPath: /sys}
              - {name: host-dev, mountPath: /dev}
              - {name: ssh-secret, mountPath: /ssh-pk, readOnly: true}
            volumes:
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-storage
            - {name: host-dev, hostPath: {path: /dev, type: Directory}}
            - {name: host-sys, hostPath: {path: /sys, type: Directory}}
            - {name: hugepages, emptyDir: {medium: HugePages}}
            - {name: ssh-secret, secret: {secretName: ssh-secret, defaultMode: 420}}
