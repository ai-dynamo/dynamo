apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: node-local-v3-hx-hybrid
  namespace: test
  uid: 44444444-4444-4444-8444-444444444444
  generation: 1
  annotations:
    scheduling.lpu.nvidia.com/scheduler-backend: lpx-scheduler
spec:
  components:
    - name: lpu
      type: lpx
      replicas: 1
      lpx:
        buildId: node-local-v3-hx-connected-lpx
      roles:
      - name: leader
        replicas: 1
        podTemplate:
          spec:
            resourceClaims:
            - name: gpu
              resourceClaimTemplateName: decode-gpu
            containers:
            - name: main
              image: example.invalid/gpu-runtime:test
              command:
              - /opt/gpu-runtime
              args:
              - serve
              resources:
                claims:
                - name: gpu
      - name: worker
        podTemplate:
          spec:
            containers:
            - name: main
              image: example.invalid/lpu-runtime:test
              args:
              - --instance-model-name
              - test/v3-hybrid
              resources:
                limits:
                  lpu.nvidia.com/devices: '1'
              volumeMounts:
              - mountPath: /nfs
                name: model-storage
            volumes:
            - name: model-storage
              persistentVolumeClaim:
                claimName: model-storage
