# Match an existing DGD's name and Kubernetes namespace. Its name must start
# with a lowercase letter, use only lowercase letters, digits, and hyphens,
# and be at most 52 characters. Use Kubernetes pod-mode discovery, at least
# one worker, and no globalDynamoNamespace workers or frontends.
# Build the image from the same revision as the operator; it must run
# dynamo.pool_relay with --sources-file support.
# Match the DGD's transport settings. To report serving load, set
# DYN_SERVING_LOAD_PUBLISH=1 on its frontend Pods.
# Ready reports listener availability, not model or KV readiness. The Service
# is cluster-local.
apiVersion: nvidia.com/v1alpha1
kind: DynamoPoolRelay
metadata:
  name: green
  namespace: inference
spec:
  # Keep this logical cluster ID stable across Relay restarts.
  clusterId: example-cluster
  replicas: 2
  podTemplate:
    spec:
      containers:
        - name: main
          image: REPLACE_WITH_RELAY_IMAGE
          env:
            - name: DYN_REQUEST_PLANE
              value: tcp
            - name: DYN_EVENT_PLANE
              value: zmq
