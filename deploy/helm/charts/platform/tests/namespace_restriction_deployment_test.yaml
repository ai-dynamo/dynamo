suite: namespace restriction deployment
templates:
  - charts/dynamo-operator/templates/deployment.yaml
  - charts/dynamo-operator/templates/operator-config.yaml
tests:
  - it: runs crd-apply for the default cluster-wide installation
    template: charts/dynamo-operator/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: crd-apply
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.initContainers[0].args
          content: --dgdr-v1beta2-enabled=false
        documentSelector:
          path: kind
          value: Deployment

  - it: enables experimental DGDR v1beta2 CRD installation
    template: charts/dynamo-operator/templates/deployment.yaml
    set:
      dynamo-operator.dgdrV1Beta2.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].args
          content: --dgdr-v1beta2-enabled=true
        documentSelector:
          path: kind
          value: Deployment

  - it: rejects CRD upgrades in namespace-restricted mode
    template: charts/dynamo-operator/templates/deployment.yaml
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: true
    asserts:
      - failedTemplate:
          errorPattern: "namespaceRestriction.enabled=true is incompatible with upgradeCRD=true"

  - it: omits crd-apply but retains admission serving in namespace-restricted mode
    template: charts/dynamo-operator/templates/deployment.yaml
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: false
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: webhook-server
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: cert
        documentSelector:
          path: kind
          value: Deployment

  - it: configures the target namespace and ownership Lease
    template: charts/dynamo-operator/templates/operator-config.yaml
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.namespaceRestriction.targetNamespace: tenant-a
      dynamo-operator.namespaceRestriction.lease.duration: 45s
      dynamo-operator.namespaceRestriction.lease.renewInterval: 15s
      dynamo-operator.upgradeCRD: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'restricted: "tenant-a"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'leaseDuration: "45s"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'leaseRenewInterval: "15s"'

  - it: rejects custom webhook namespace selectors
    template: charts/dynamo-operator/templates/deployment.yaml
    set:
      dynamo-operator.webhook.namespaceSelector.matchLabels.tenant: selected
    asserts:
      - failedTemplate:
          errorPattern: "webhook.namespaceSelector must be empty"

  - it: passes the DGDR v1beta2 switch to the manager
    template: charts/dynamo-operator/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dgdr-v1beta2-enabled=false
        documentSelector:
          path: kind
          value: Deployment

  - it: enables the DGDR v1beta2 controller in the manager
    template: charts/dynamo-operator/templates/deployment.yaml
    set:
      dynamo-operator.dgdrV1Beta2.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dgdr-v1beta2-enabled=true
        documentSelector:
          path: kind
          value: Deployment

  - it: sets default resources on the crd-apply init container
    template: charts/dynamo-operator/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 256Mi
        documentSelector:
          path: kind
          value: Deployment

  - it: overrides crd-apply init container resources independently of the manager
    template: charts/dynamo-operator/templates/deployment.yaml
    set:
      dynamo-operator.controllerManager.crdApply.resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].resources.limits.memory
          value: 512Mi
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi
        documentSelector:
          path: kind
          value: Deployment

  - it: renders no crd-apply resources when set to null
    template: charts/dynamo-operator/templates/deployment.yaml
    set:
      dynamo-operator.controllerManager.crdApply.resources: null
    asserts:
      - isNullOrEmpty:
          path: spec.template.spec.initContainers[0].resources
        documentSelector:
          path: kind
          value: Deployment
