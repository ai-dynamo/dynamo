suite: external Grove compatibility preflight
templates:
  - charts/dynamo-operator/templates/deployment.yaml
  - charts/dynamo-operator/templates/operator-config.yaml
tests:
  - it: rejects an external Grove whose PodCliqueSet CRD predates v0.1.0-alpha.14
    template: charts/dynamo-operator/templates/deployment.yaml
    set:
      global.grove.enabled: true
      global.grove.install: false
    kubernetesProvider:
      scheme:
        "apiextensions.k8s.io/v1/CustomResourceDefinition":
          gvr:
            group: apiextensions.k8s.io
            version: v1
            resource: customresourcedefinitions
          namespaced: false
        "rbac.authorization.k8s.io/v1/ClusterRole":
          gvr:
            group: rbac.authorization.k8s.io
            version: v1
            resource: clusterroles
          namespaced: false
        "rbac.authorization.k8s.io/v1/ClusterRoleBinding":
          gvr:
            group: rbac.authorization.k8s.io
            version: v1
            resource: clusterrolebindings
          namespaced: false
      objects:
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: unrelated-role
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: unrelated-binding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: unrelated-role
        - apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: podcliquesets.grove.io
          spec:
            group: grove.io
            versions:
              - name: v1alpha1
                served: true
                storage: true
                schema:
                  openAPIV3Schema:
                    properties:
                      spec:
                        properties:
                          template:
                            properties:
                              cliques:
                                items:
                                  properties:
                                    name:
                                      type: string
    asserts:
      - failedTemplate:
          errorPattern: "Externally managed Grove is incompatible.*v0.1.0-alpha.14.*Upgrade the external Grove controller and matching CRDs"

  - it: accepts an external Grove whose PodCliqueSet CRD has the v0.1.0-alpha.14 schema
    template: charts/dynamo-operator/templates/deployment.yaml
    set:
      global.grove.enabled: true
      global.grove.install: false
    kubernetesProvider:
      scheme:
        "apiextensions.k8s.io/v1/CustomResourceDefinition":
          gvr:
            group: apiextensions.k8s.io
            version: v1
            resource: customresourcedefinitions
          namespaced: false
        "rbac.authorization.k8s.io/v1/ClusterRole":
          gvr:
            group: rbac.authorization.k8s.io
            version: v1
            resource: clusterroles
          namespaced: false
        "rbac.authorization.k8s.io/v1/ClusterRoleBinding":
          gvr:
            group: rbac.authorization.k8s.io
            version: v1
            resource: clusterrolebindings
          namespaced: false
      objects:
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: unrelated-role
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: unrelated-binding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: unrelated-role
        - apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: podcliquesets.grove.io
          spec:
            group: grove.io
            versions:
              - name: v1alpha1
                served: true
                storage: true
                schema:
                  openAPIV3Schema:
                    properties:
                      spec:
                        properties:
                          template:
                            properties:
                              cliques:
                                items:
                                  properties:
                                    name:
                                      type: string
                                    rollingUpdate:
                                      type: object
    asserts:
      - notFailedTemplate: {}
      - isKind:
          of: Deployment

  - it: skips the check when the Grove CRD cannot be looked up
    template: charts/dynamo-operator/templates/deployment.yaml
    set:
      global.grove.enabled: true
      global.grove.install: false
    asserts:
      - notFailedTemplate: {}
      - isKind:
          of: Deployment

  - it: skips the check when the chart installs Grove
    template: charts/dynamo-operator/templates/deployment.yaml
    set:
      global.grove.enabled: true
      global.grove.install: true
    kubernetesProvider:
      scheme:
        "apiextensions.k8s.io/v1/CustomResourceDefinition":
          gvr:
            group: apiextensions.k8s.io
            version: v1
            resource: customresourcedefinitions
          namespaced: false
        "rbac.authorization.k8s.io/v1/ClusterRole":
          gvr:
            group: rbac.authorization.k8s.io
            version: v1
            resource: clusterroles
          namespaced: false
        "rbac.authorization.k8s.io/v1/ClusterRoleBinding":
          gvr:
            group: rbac.authorization.k8s.io
            version: v1
            resource: clusterrolebindings
          namespaced: false
      objects:
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: unrelated-role
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: unrelated-binding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: unrelated-role
        - apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: podcliquesets.grove.io
          spec:
            group: grove.io
            versions:
              - name: v1alpha1
                served: true
                storage: true
    asserts:
      - notFailedTemplate: {}

  - it: skips the check when Grove integration is disabled
    template: charts/dynamo-operator/templates/deployment.yaml
    kubernetesProvider:
      scheme:
        "apiextensions.k8s.io/v1/CustomResourceDefinition":
          gvr:
            group: apiextensions.k8s.io
            version: v1
            resource: customresourcedefinitions
          namespaced: false
        "rbac.authorization.k8s.io/v1/ClusterRole":
          gvr:
            group: rbac.authorization.k8s.io
            version: v1
            resource: clusterroles
          namespaced: false
        "rbac.authorization.k8s.io/v1/ClusterRoleBinding":
          gvr:
            group: rbac.authorization.k8s.io
            version: v1
            resource: clusterrolebindings
          namespaced: false
      objects:
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: unrelated-role
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: unrelated-binding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: unrelated-role
        - apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: podcliquesets.grove.io
          spec:
            group: grove.io
            versions:
              - name: v1alpha1
                served: true
                storage: true
    asserts:
      - notFailedTemplate: {}
