suite: webhook service readiness
templates:
  - charts/dynamo-operator/templates/webhook-service.yaml
tests:
  - it: keeps not-ready webhook endpoints unpublished by default
    template: charts/dynamo-operator/templates/webhook-service.yaml
    asserts:
      - equal:
          path: spec.publishNotReadyAddresses
          value: false

  - it: can publish not-ready webhook endpoints for vCluster CI
    template: charts/dynamo-operator/templates/webhook-service.yaml
    set:
      dynamo-operator.webhook.service.publishNotReadyAddresses: true
    asserts:
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
