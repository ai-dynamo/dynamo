suite: removed values validation
templates:
  - templates/validate-values.yaml
tests:
  # --- Platform-level subchart toggles ---

  - it: should reject nats.enabled
    set:
      nats.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "'nats.enabled' has been removed"

  - it: should reject etcd.enabled
    set:
      etcd.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "'etcd.enabled' has been removed"

  - it: should reject grove.enabled
    set:
      grove.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "'grove.enabled' has been removed"

  - it: should reject kai-scheduler.enabled
    set:
      kai-scheduler.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "'kai-scheduler.enabled' has been removed"

  # --- Scheduler integration conflicts ---

  - it: should reject kai-scheduler enabled with volcano scheduler enabled
    set:
      global.kai-scheduler.enabled: true
      global.volcano-scheduler.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "KAI-Scheduler and Volcano scheduler integrations are mutually exclusive"

  - it: should reject kai-scheduler install with volcano scheduler enabled
    set:
      global.kai-scheduler.install: true
      global.volcano-scheduler.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "KAI-Scheduler and Volcano scheduler integrations are mutually exclusive"

  - it: should allow volcano scheduler enabled without kai-scheduler integration
    set:
      global.volcano-scheduler.enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: should reject bundled KAI with bundled Grove without the stale PodGroup override
    set:
      global.kai-scheduler.install: true
      global.grove.install: true
    asserts:
      - failedTemplate:
          errorPattern: "bundled KAI Scheduler must disable stale PodGroup eviction"

  - it: should reject the unitless stale PodGroup override
    set:
      global.kai-scheduler.install: true
      global.grove.install: true
      kai-scheduler.scheduler.args.default-staleness-grace-period: "-1"
    asserts:
      - failedTemplate:
          errorPattern: "bundled KAI Scheduler must disable stale PodGroup eviction"

  - it: should allow bundled KAI with bundled Grove and the stale PodGroup override
    set:
      global.kai-scheduler.install: true
      global.grove.install: true
      kai-scheduler.scheduler.args.default-staleness-grace-period: "-1s"
    asserts:
      - notFailedTemplate: {}

  - it: should allow bundled KAI with externally managed Grove without the override
    set:
      global.kai-scheduler.install: true
      global.grove.enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: should allow bundled KAI without Grove and preserve KAI cleanup
    set:
      global.kai-scheduler.install: true
    asserts:
      - notFailedTemplate: {}

  - it: should reject a custom KAI scheduler name with the bundled scheduler
    set:
      global.kai-scheduler.install: true
      global.kai-scheduler.schedulerName: runai-scheduler
    asserts:
      - failedTemplate:
          errorPattern: "schedulerName \"runai-scheduler\" requires an externally managed KAI-compatible scheduler"

  - it: should treat an empty KAI scheduler name as the default with the bundled scheduler
    set:
      global.kai-scheduler.install: true
      global.kai-scheduler.schedulerName: ""
    asserts:
      - notFailedTemplate: {}

  - it: should reject a boolean false KAI scheduler name with the bundled scheduler
    set:
      global.kai-scheduler.install: true
      global.kai-scheduler.schedulerName: false
    asserts:
      - failedTemplate:
          errorPattern: "schedulerName \"false\" requires an externally managed KAI-compatible scheduler"

  - it: should reject a numeric zero KAI scheduler name with the bundled scheduler
    set:
      global.kai-scheduler.install: true
      global.kai-scheduler.schedulerName: 0
    asserts:
      - failedTemplate:
          errorPattern: "schedulerName \"0\" requires an externally managed KAI-compatible scheduler"

  - it: should allow a custom KAI scheduler name with an externally managed scheduler
    set:
      global.kai-scheduler.install: false
      global.kai-scheduler.enabled: true
      global.kai-scheduler.schedulerName: runai-scheduler
    asserts:
      - notFailedTemplate: {}

  # --- Default values should render cleanly ---

  - it: should render successfully with default values
    asserts:
      - notFailedTemplate: {}
