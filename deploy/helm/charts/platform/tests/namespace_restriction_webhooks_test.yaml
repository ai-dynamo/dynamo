suite: namespace restriction webhooks
templates:
  - charts/dynamo-operator/templates/webhook-configuration.yaml
  - charts/dynamo-operator/templates/webhook-service.yaml
  - charts/dynamo-operator/templates/webhook-certificates.yaml
tests:
  - it: renders global admission for the cluster-wide installation
    template: charts/dynamo-operator/templates/webhook-configuration.yaml
    asserts:
      - hasDocuments:
          count: 2
      - lengthEqual:
          path: webhooks
          count: 4
        documentIndex: 0
      - notExists:
          path: webhooks[0].namespaceSelector
        documentIndex: 0
      - notExists:
          path: webhooks[1].namespaceSelector
        documentIndex: 0
      - notExists:
          path: webhooks[2].namespaceSelector
        documentIndex: 0
      - notExists:
          path: webhooks[3].namespaceSelector
        documentIndex: 0
      - notExists:
          path: webhooks[0].namespaceSelector
        documentIndex: 1
      - notExists:
          path: webhooks[1].namespaceSelector
        documentIndex: 1
      - notExists:
          path: webhooks[2].namespaceSelector
        documentIndex: 1
      - notExists:
          path: webhooks[3].namespaceSelector
        documentIndex: 1
  - it: scopes namespace-restricted admission to the target namespace
    template: charts/dynamo-operator/templates/webhook-configuration.yaml
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      # Exercise a YAML boolean-like namespace to ensure the rendered selector stays a string.
      dynamo-operator.namespaceRestriction.targetNamespace: "true"
      dynamo-operator.upgradeCRD: false
    asserts:
      - hasDocuments:
          count: 2
      - lengthEqual:
          path: webhooks
          count: 4
        documentIndex: 0
      - equal:
          path: webhooks[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: "true"
        documentIndex: 0
      - equal:
          path: webhooks[1].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: "true"
        documentIndex: 0
      - equal:
          path: webhooks[2].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: "true"
        documentIndex: 0
      - equal:
          path: webhooks[3].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: "true"
        documentIndex: 0
      - equal:
          path: webhooks[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: "true"
        documentIndex: 1
      - equal:
          path: webhooks[1].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: "true"
        documentIndex: 1
      - equal:
          path: webhooks[2].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: "true"
        documentIndex: 1
      - equal:
          path: webhooks[3].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: "true"
        documentIndex: 1

  - it: registers Run admission only when the v1beta2 API is enabled
    template: charts/dynamo-operator/templates/webhook-configuration.yaml
    set:
      dynamo-operator.dgdrV1Beta2.enabled: true
    asserts:
      - lengthEqual:
          path: webhooks
          count: 5
        documentIndex: 0
      - equal:
          path: webhooks[4].name
          value: vdynamographdeploymentrun.kb.io
        documentIndex: 0
      - equal:
          path: webhooks[4].clientConfig.service.path
          value: /validate-nvidia-com-v1beta2-dynamographdeploymentrun
        documentIndex: 0
      - equal:
          path: webhooks[4].rules[0].apiVersions
          value: [v1beta2]
        documentIndex: 0
      - equal:
          path: webhooks[4].rules[0].resources
          value: [dynamographdeploymentruns]
        documentIndex: 0
      - equal:
          path: webhooks[4].rules[0].operations
          value: [CREATE, UPDATE]
        documentIndex: 0
      - notExists:
          path: webhooks[4].namespaceSelector
        documentIndex: 0
      - lengthEqual:
          path: webhooks
          count: 4
        documentIndex: 1

  - it: scopes Run admission to the configured namespace
    template: charts/dynamo-operator/templates/webhook-configuration.yaml
    set:
      dynamo-operator.dgdrV1Beta2.enabled: true
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.namespaceRestriction.targetNamespace: "true"
      dynamo-operator.upgradeCRD: false
    asserts:
      - equal:
          path: webhooks[4].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: "true"
        documentIndex: 0

  - it: renders a webhook service for a namespace-restricted installation
    template: charts/dynamo-operator/templates/webhook-service.yaml
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: false
    asserts:
      - hasDocuments:
          count: 1

  - it: renders webhook certificates for a namespace-restricted installation
    template: charts/dynamo-operator/templates/webhook-certificates.yaml
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: false
      dynamo-operator.webhook.certManager.enabled: true
    asserts:
      - hasDocuments:
          count: 4

  - it: matches DGDR requests through every served API version
    template: charts/dynamo-operator/templates/webhook-configuration.yaml
    asserts:
      - equal:
          path: webhooks[3].name
          value: vdynamographdeploymentrequest.kb.io
        documentIndex: 0
      - equal:
          path: webhooks[3].matchPolicy
          value: Equivalent
        documentIndex: 0
      - equal:
          path: webhooks[2].name
          value: mdynamographdeploymentrequestv1beta1.kb.io
        documentIndex: 1
      - equal:
          path: webhooks[2].matchPolicy
          value: Equivalent
        documentIndex: 1
