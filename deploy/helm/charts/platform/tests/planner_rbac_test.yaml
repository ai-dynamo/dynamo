suite: planner RBAC — Pod lifecycle observation
templates:
  - charts/dynamo-operator/templates/planner.yaml

tests:
  # ── cluster-wide mode (default) ──────────────────────────────────────────────

  - it: includes pods/list in ClusterRole when powerAwareness is disabled (default)
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
            verbs:
              - list
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentscalingadapters/scale
            verbs:
              - get
              - patch
        documentIndex: 0

  - it: includes pods/list in ClusterRole when powerAwareness is enabled
    set:
      dynamo-operator.planner.powerAwareness.enabled: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
            verbs:
              - list
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentscalingadapters/scale
            verbs:
              - get
              - patch
        documentIndex: 0

  # ── namespace-restricted mode ─────────────────────────────────────────────────

  - it: includes pods/list in Role when powerAwareness is disabled in namespace-restricted mode
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: false
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
            verbs:
              - list
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentscalingadapters/scale
            verbs:
              - get
              - patch
        documentIndex: 1

  - it: includes pods/list in Role when powerAwareness is enabled in namespace-restricted mode
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: false
      dynamo-operator.planner.powerAwareness.enabled: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
            verbs:
              - list
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentscalingadapters/scale
            verbs:
              - get
              - patch
        documentIndex: 1
