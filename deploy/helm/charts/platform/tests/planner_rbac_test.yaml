suite: planner RBAC — Pod lifecycle observation and live retune
templates:
  - charts/dynamo-operator/templates/planner.yaml

tests:
  # ── cluster-wide mode (default) ──────────────────────────────────────────────

  - it: includes pods/list in ClusterRole when powerAwareness is disabled (default)
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
            verbs:
              - list
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentscalingadapters/scale
            verbs:
              - get
              - patch
        documentIndex: 0

  - it: includes pods/list in ClusterRole when powerAwareness is enabled
    set:
      dynamo-operator.planner.powerAwareness.enabled: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
            verbs:
              - list
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentscalingadapters/scale
            verbs:
              - get
              - patch
        documentIndex: 0

  # ── namespace-restricted mode ─────────────────────────────────────────────────

  - it: includes pods/list in Role when powerAwareness is disabled in namespace-restricted mode
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: false
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
            verbs:
              - list
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentscalingadapters/scale
            verbs:
              - get
              - patch
        documentIndex: 1

  - it: includes pods/list in Role when powerAwareness is enabled in namespace-restricted mode
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: false
      dynamo-operator.planner.powerAwareness.enabled: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
            verbs:
              - list
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentscalingadapters/scale
            verbs:
              - get
              - patch
        documentIndex: 1

  # ── EXPERIMENTAL live retune (dgdrV1Beta2.plannerLiveRetune) ────────────────
  # The base role has 6 rules; live retune adds exactly 4. Counting the rules
  # also catches an extra verb or a split rule.

  - it: omits live retune rules from the ClusterRole by default
    asserts:
      - lengthEqual:
          path: rules
          count: 6
        documentIndex: 0

  - it: grants DGDR v1beta2 and Lease access in the ClusterRole with plannerLiveRetune
    set:
      dynamo-operator.dgdrV1Beta2.plannerLiveRetune: true
    asserts:
      - lengthEqual:
          path: rules
          count: 10
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentrequests
            verbs:
              - create
              - get
              - list
              - delete
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentruns
            verbs:
              - get
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentcandidates
            verbs:
              - list
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - create
              - update
              - delete
        documentIndex: 0

  - it: omits live retune rules from the Role by default in namespace-restricted mode
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: false
    asserts:
      - lengthEqual:
          path: rules
          count: 6
        documentIndex: 1

  - it: grants DGDR v1beta2 and Lease access in the Role with plannerLiveRetune in namespace-restricted mode
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: false
      dynamo-operator.dgdrV1Beta2.plannerLiveRetune: true
    asserts:
      - lengthEqual:
          path: rules
          count: 10
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentrequests
            verbs:
              - create
              - get
              - list
              - delete
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentruns
            verbs:
              - get
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - nvidia.com
            resources:
              - dynamographdeploymentcandidates
            verbs:
              - list
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - create
              - update
              - delete
        documentIndex: 1
