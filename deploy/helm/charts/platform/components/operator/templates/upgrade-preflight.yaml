{{ $config := .Values.upgradePreflight -}}
{{- $podSecurityContext := $config.podSecurityContext -}}
{{- if eq $podSecurityContext nil -}}
{{- $podSecurityContext = dict "runAsNonRoot" true "runAsUser" 65532 "seccompProfile" (dict "type" "RuntimeDefault") -}}
{{- end -}}
{{- $name := printf "%s-check-dynamo-version" (include "dynamo-operator.fullname" . | trunc 42 | trimSuffix "-") -}}
{{- $deployment := printf "%s-controller-manager" (include "dynamo-operator.fullname" .) -}}
{{- $annotations := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-weight" "-20" "helm.sh/hook-delete-policy" "before-hook-creation" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations: {{- toYaml $annotations | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations: {{- toYaml $annotations | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [{{ $deployment }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations: {{- toYaml $annotations | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-output-log-policy: hook-failed
spec:
  activeDeadlineSeconds: {{ $config.activeDeadlineSeconds }}
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- with $config.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: preflight
          image: {{ $config.image | quote }}
          command: [python3, -c]
          args:
            - |
              {{- .Files.Get "files/preflight/kubernetes.py" | nindent 14 }}
              {{- .Files.Get "files/upgrade-preflight/check.py" | nindent 14 }}
            - {{ .Release.Namespace | quote }}
            - {{ $deployment | quote }}
            - {{ .Chart.AppVersion | quote }}
            - {{ .Values.unsupportedUpgradeOverride | quote }}
            - {{ .Values.unsupportedDowngradeOverride | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
