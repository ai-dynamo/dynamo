{{- if .Values.namespaceRestriction.enabled }}
# Namespace-restricted mode: Role + ServiceAccount + RoleBinding
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: planner-serviceaccount
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dynamo-operator.labels" . | nindent 4 }}
{{- if .Values.dynamo.dockerRegistry.useKubernetesSecret }}
imagePullSecrets:
- name: {{ include "dynamo-operator.componentsDockerRegistrySecretName" . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: planner-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dynamo-operator.labels" . | nindent 4 }}
rules:
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeployments"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeploymentscalingadapters"]
  verbs: ["get", "patch"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeploymentscalingadapters/scale"]
  # Read the authoritative target to detect superseded asynchronous requests.
  verbs: ["get", "patch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamoworkermetadatas"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Read Pod lifecycle state to distinguish pending startup from drain before
# reversing a scale-up. Also used for power-annotation settlement when enabled.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
{{- if .Values.dgdrV1Beta2.enabled }}
# EXPERIMENTAL live retune (planner retune.executor: dgdr): sweep through DGDR
# v1beta2 Requests, read their Runs and Candidates, and hold the leadership
# and state Leases (read, create, replace and delete; never patch). Lease names
# are per DGD, so the Lease rule covers every Lease in the namespace.
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeploymentrequests"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeploymentruns", "dynamographdeploymentcandidates"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update", "delete"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: planner-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dynamo-operator.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: planner-serviceaccount
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: planner-role
  apiGroup: rbac.authorization.k8s.io
{{- else }}
# Cluster-wide mode: ClusterRole for planner.
# Even though this is a ClusterRole, the operator binds it via a namespace-scoped
# RoleBinding (internal/rbac/manager.go EnsureServiceAccountWithRBAC), so all
# permissions — including pods/list — are effective only in the DGD's namespace.
# RBAC escalation prevention lets the operator bind only permissions it holds,
# so every rule here must also be in the operator's role (with dgdrV1Beta2, the
# DGDR v1beta2 Run and Candidate rules of the operator's v1beta2 integration).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dynamo-operator.fullname" . }}-planner
  labels:
    {{- include "dynamo-operator.labels" . | nindent 4 }}
rules:
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeployments"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeploymentscalingadapters"]
  verbs: ["get", "patch"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeploymentscalingadapters/scale"]
  # Read the authoritative target to detect superseded asynchronous requests.
  verbs: ["get", "patch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamoworkermetadatas"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Read Pod lifecycle state to distinguish pending startup from drain before
# reversing a scale-up. Also used for power-annotation settlement when enabled.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
{{- if .Values.dgdrV1Beta2.enabled }}
# EXPERIMENTAL live retune (planner retune.executor: dgdr): sweep through DGDR
# v1beta2 Requests, read their Runs and Candidates, and hold the leadership
# and state Leases (read, create, replace and delete; never patch). Lease names
# are per DGD, so the Lease rule covers every Lease in the namespace.
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeploymentrequests"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeploymentruns", "dynamographdeploymentcandidates"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update", "delete"]
{{- end }}
{{- end }}
