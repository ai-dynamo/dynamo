{{- if .Values.namespaceRestriction.enabled }}
# Namespace-restricted mode: Role + ServiceAccount + RoleBinding
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: planner-serviceaccount
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dynamo-operator.labels" . | nindent 4 }}
{{- if .Values.dynamo.dockerRegistry.useKubernetesSecret }}
imagePullSecrets:
- name: {{ include "dynamo-operator.componentsDockerRegistrySecretName" . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: planner-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dynamo-operator.labels" . | nindent 4 }}
rules:
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeployments"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeploymentscalingadapters/scale"]
  verbs: ["patch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamoworkermetadatas"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- if .Values.planner.powerAwareness.enabled }}
# DGPB is the operator-owned transactional policy/inventory snapshot. Planner
# reads one object by name and never writes its spec, status, or subresources.
- apiGroups: ["nvidia.com"]
  resources: ["dynamographpowerbudgets"]
  verbs: ["get"]
# Pods (list only): startup settlement reads non-terminal pod annotations to
# verify the DGD-owned power cap has propagated before caching it. No write
# surface: caps are authored on the DGD podTemplate and enforced by the Power
# Agent; the Planner never patches Pods.
# Requires planner.powerAwareness.enabled=true in Helm values.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: planner-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dynamo-operator.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: planner-serviceaccount
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: planner-role
  apiGroup: rbac.authorization.k8s.io
{{- else }}
# Cluster-wide mode: ClusterRole for planner.
# Even though this is a ClusterRole, the operator binds it via a namespace-scoped
# RoleBinding (internal/rbac/manager.go EnsureServiceAccountWithRBAC), so all
# permissions — including pods/list — are effective only in the DGD's namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dynamo-operator.fullname" . }}-planner
  labels:
    {{- include "dynamo-operator.labels" . | nindent 4 }}
rules:
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeployments"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamographdeploymentscalingadapters/scale"]
  verbs: ["patch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["nvidia.com"]
  resources: ["dynamoworkermetadatas"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- if .Values.planner.powerAwareness.enabled }}
# DGPB is the operator-owned transactional policy/inventory snapshot. Planner
# reads one object by name and never writes its spec, status, or subresources.
- apiGroups: ["nvidia.com"]
  resources: ["dynamographpowerbudgets"]
  verbs: ["get"]
# Pods (list only): startup settlement reads non-terminal pod annotations to
# verify the DGD-owned power cap has propagated before caching it. No write
# surface: caps are authored on the DGD podTemplate and enforced by the Power
# Agent; the Planner never patches Pods.
# Requires planner.powerAwareness.enabled=true in Helm values.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
{{- end }}
{{- end }}
