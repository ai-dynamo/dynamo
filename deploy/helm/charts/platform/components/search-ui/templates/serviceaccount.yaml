apiVersion: v1
kind: ServiceAccount
metadata:
  name: dynamo-search-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dynamo-search-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if and (eq .Values.history.backend "azblob") .Values.history.azblob.workloadIdentityClientId }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.history.azblob.workloadIdentityClientId | quote }}
  {{- end }}
automountServiceAccountToken: true
