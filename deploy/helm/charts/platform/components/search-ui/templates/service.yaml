apiVersion: v1
kind: Service
metadata:
  name: dynamo-search-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dynamo-search-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dynamo-search-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
