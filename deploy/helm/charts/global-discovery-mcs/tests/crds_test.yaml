# CRDs rendered from files/crds, the copy of
# deploy/global-discovery-mcs/config/crd/bases that make sync-crds keeps.

suite: CRDs
templates:
  - templates/crds/customresourcedefinitions.yaml
release:
  name: mcs
  namespace: mcs-system
set:
  controller.registryUrls:
    - https://mcs.example.internal

tests:
  - it: renders the three CRDs with the keep policy by default
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: CustomResourceDefinition
      - isAPIVersion:
          of: apiextensions.k8s.io/v1
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: serviceexports.multicluster.x-k8s.io
          any: true
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: serviceimports.multicluster.x-k8s.io
          any: true
      - containsDocument:
          kind: CustomResourceDefinition
          apiVersion: apiextensions.k8s.io/v1
          name: clusterproperties.about.k8s.io
          any: true
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: serves v1alpha1 and v1beta1 of the mcs-api CRDs and stores v1beta1
    documentSelector:
      path: spec.group
      value: multicluster.x-k8s.io
      matchMany: true
    asserts:
      - equal:
          path: spec.versions[0].name
          value: v1alpha1
      - equal:
          path: spec.versions[0].served
          value: true
      - equal:
          path: spec.versions[0].storage
          value: false
      - equal:
          path: spec.versions[1].name
          value: v1beta1
      - equal:
          path: spec.versions[1].served
          value: true
      - equal:
          path: spec.versions[1].storage
          value: true
      - equal:
          path: metadata.labels["multicluster.x-k8s.io/release-version"]
          value: v0.5.2

  - it: keeps the api-approved annotation of the protected about.k8s.io group
    documentSelector:
      path: metadata.name
      value: clusterproperties.about.k8s.io
    asserts:
      - equal:
          path: metadata.annotations["api-approved.kubernetes.io"]
          value: https://github.com/kubernetes/enhancements/pull/3084
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: renders no CRDs with crds.install=false
    set:
      crds.install: false
    asserts:
      - hasDocuments:
          count: 0

  - it: drops the keep policy with crds.keep=false
    set:
      crds.keep: false
    asserts:
      - hasDocuments:
          count: 3
      - notExists:
          path: metadata.annotations["helm.sh/resource-policy"]
