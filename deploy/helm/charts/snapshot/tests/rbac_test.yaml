suite: snapshot-agent RBAC topology
templates:
  - templates/role.yaml
  - templates/rolebinding.yaml
  - templates/daemonset.yaml
tests:
  - it: renders namespaced RBAC by default
    template: templates/role.yaml
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Role
        documentIndex: 0

  - it: binds namespaced RBAC by default
    template: templates/rolebinding.yaml
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: RoleBinding
        documentIndex: 1

  - it: scopes the default agent to its release namespace
    template: templates/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESTRICTED_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  - it: renders cluster RBAC when namespace restriction is disabled
    template: templates/role.yaml
    set:
      rbac.namespaceRestricted: false
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ClusterRole
        documentIndex: 1

  - it: binds cluster RBAC when namespace restriction is disabled
    template: templates/rolebinding.yaml
    set:
      rbac.namespaceRestricted: false
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1

  - it: omits restricted namespace in cluster mode
    template: templates/daemonset.yaml
    set:
      rbac.namespaceRestricted: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESTRICTED_NAMESPACE
