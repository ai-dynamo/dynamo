# Readiness probe wiring (DEP #14767). A PowerAgent pod's readiness must mean
# the agent is ENFORCING power caps: without the probe a pod is Ready from the
# moment its container starts and stays Ready while every reconcile cycle fails.
#
# The probe values are hard-coded in the template on purpose — the port is fixed
# in the agent with no CLI flag, so a chart value that could disagree with it is
# a footgun, and a configurable failureThreshold would let an operator dial the
# debounce until readiness means nothing. These assertions are what keep them
# from drifting into values.yaml.

suite: readiness probe wiring
release:
  name: power-agent
  namespace: dynamo-system

tests:
  - it: DaemonSet exposes the readyz container port
    templates:
      - templates/daemonset.yaml
    set:
      image.tag: v1.3.0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: readyz
            containerPort: 8081
            protocol: TCP

  - it: DaemonSet renders the readiness probe against /readyz
    templates:
      - templates/daemonset.yaml
    set:
      image.tag: v1.3.0
    asserts:
      # The probe targets the PORT NAME, not the literal 8081, so the port
      # declaration above is the single place the number appears.
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3

  - it: DaemonSet declares no liveness probe
    templates:
      - templates/daemonset.yaml
    set:
      image.tag: v1.3.0
    asserts:
      # Deliberate: a non-enforcing agent must keep reconciling, since it can
      # recover, while a restart drops in-memory GPU ownership.
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe

  - it: metrics port is unchanged alongside the new readyz port
    templates:
      - templates/daemonset.yaml
    set:
      image.tag: v1.3.0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9100
            protocol: TCP
