#
# ClusterProperty of KEP-2149 (ClusterId for ClusterSet identification),
# group about.k8s.io, as published by sigs.k8s.io/about-api. The
# mcs-controller reads the properties clusterset.k8s.io and
# cluster.clusterset.k8s.io and, with --write-cluster-properties, writes
# them. about.k8s.io is a protected group: the API server requires the
# api-approved.kubernetes.io annotation pointing at the approved KEP.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterproperties.about.k8s.io
  annotations:
    api-approved.kubernetes.io: "https://github.com/kubernetes/enhancements/pull/3084"
spec:
  group: about.k8s.io
  names:
    kind: ClusterProperty
    listKind: ClusterPropertyList
    plural: clusterproperties
    singular: clusterproperty
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: value
          type: string
          jsonPath: .spec.value
        - name: age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >-
            ClusterProperty stores identification related, cluster scoped
            information for multi-cluster tools.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              description: >-
                APIVersion defines the versioned schema of this representation
                of an object.
              type: string
            kind:
              description: >-
                Kind is a string value representing the REST resource this
                object represents.
              type: string
            metadata:
              type: object
            spec:
              description: ClusterPropertySpec defines the desired state of ClusterProperty.
              type: object
              required:
                - value
              properties:
                value:
                  description: ClusterProperty value.
                  type: string
                  minLength: 1
                  maxLength: 128000
            status:
              description: ClusterPropertyStatus defines the observed state of ClusterProperty.
              type: object
      subresources:
        status: {}
