# The Multi-Cluster Services registry API contract. google/api is vendored
# from buf.build/googleapis so that generation needs no BSR dependency.
version: v2
modules:
  - path: api/proto
lint:
  use:
    - STANDARD
  ignore:
    - api/proto/google
breaking:
  use:
    - FILE
  ignore:
    - api/proto/google
