# Phase 3 workload in cluster a, applied in namespace demo: the pods of the
# DynamoGraphDeployment demo (two busybox httpd replicas), its PoolRelay
# Service demo-pool-relay (the service suffix is -pool-relay) and its frontend
# Service demo-frontend. The ServiceExports are in pool-exports.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: httpd
          image: __BUSYBOX_IMAGE__
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /www && echo "$HOSTNAME" > /www/index.html && exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: demo-pool-relay
spec:
  clusterIP: None
  selector:
    app: demo
  ports:
    - name: grpc
      port: 50051
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-frontend
spec:
  clusterIP: None
  selector:
    app: demo
  ports:
    - name: http
      port: 8000
      targetPort: http
