apiVersion: v1
kind: Service
metadata:
  name: prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z-prorl
  namespace: warnold-dynamo
  labels: &labels
    integration-run: prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z
    integration-role: m5-prorl
spec:
  selector: *labels
  ports:
    - {name: rollout, port: 8080, targetPort: 8080}
    - {name: gateway, port: 8100, targetPort: 8100}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z-prorl
  namespace: warnold-dynamo
  labels:
    integration-run: prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z
    integration-role: m5-prorl
data:
  topology.yaml: |
    rollout:
      host: 0.0.0.0
      port: 8080
      public_url: http://127.0.0.1:8080
      save_dir: /shared/test-artifacts/prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z/prorl/results
      callback_grace_seconds: 30.0
    gateway:
      heartbeat_interval_seconds: 5
      rollout_server_url: http://127.0.0.1:8080
      completion_persistence:
        enabled: true
        max_field_bytes: 67108864
        queue_size: 128
      nodes:
        - id: m5-prorl-gateway
          host: 0.0.0.0
          port: 8100
          public_url: http://127.0.0.1:8100
          model_served: Qwen/Qwen3-30B-A3B
          inference:
            engine: dynamo
            base_url: http://prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z-dynamo:8000
          max_init_workers: 1
          max_run_workers: 1
          max_postrun_workers: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z-prorl
  namespace: warnold-dynamo
  labels:
    integration-run: prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z
    integration-role: m5-prorl
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 60
  nodeSelector:
    kubernetes.io/arch: amd64
  initContainers:
    - name: copy-docker-cli
      image: docker.io/library/docker@sha256:f649ef046008ca7f926a2571c32b0ac22e5c59eb61b959617f9acc2a4c638cf5
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c"]
      args: ["cp /usr/local/bin/docker /opt/docker-cli/docker && chmod 0755 /opt/docker-cli/docker"]
      resources:
        requests: {cpu: "100m", memory: 128Mi}
        limits: {cpu: "500m", memory: 512Mi}
      volumeMounts:
        - {name: docker-cli, mountPath: /opt/docker-cli}
    - name: install-integration
      image: &miles-image docker.io/radixark/miles@sha256:39b5227d8b8cc9997d0777d72b555ea1f1f0dc4c1027649f8c44c6ce88f51859
      imagePullPolicy: IfNotPresent
      command: ["bash", "-lc"]
      args:
        - |
          set -euxo pipefail
          archive_dir=/shared/test-artifacts/prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z/build/archives
          echo "1d90d516d27b2ede701e892a28a37e7cfb492cee9a18039e1220cb1b71fefcd5  $archive_dir/miles-bc1341fd5.tar.gz" | sha256sum -c -
          echo "9b4cd02b40aa1f7fc61ba8065a29fa79eb32a16ad3ef4a6b6695e1f75b0d73dc  $archive_dir/prorl-0ee1d48f65.tar.gz" | sha256sum -c -
          mkdir -p /opt/integration-src/miles /opt/integration-src/prorl
          tar -xzf "$archive_dir"/miles-bc1341fd5.tar.gz -C /opt/integration-src/miles
          tar -xzf "$archive_dir"/prorl-0ee1d48f65.tar.gz -C /opt/integration-src/prorl
          PYTHONPATH=/opt/integration-src/miles:/opt/integration-src/prorl/src:/root/Megatron-LM             python3 -c "import miles, polar, slime_bridge; print(miles.__file__); print(polar.__file__); print(slime_bridge.__file__)"
          mkdir -p /shared/test-artifacts/prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z/prorl/results
      resources:
        requests: {cpu: "1", memory: 2Gi}
        limits: {cpu: "2", memory: 4Gi}
      volumeMounts:
        - {name: shared, mountPath: /shared}
        - {name: integration-src, mountPath: /opt/integration-src}
  containers:
    - name: rollout
      image: *miles-image
      imagePullPolicy: IfNotPresent
      command: ["python3", "-m", "polar.cli"]
      args: ["serve_rollout", "-c", "/etc/polar/topology.yaml"]
      env: &python-env
        - name: PYTHONPATH
          value: /opt/integration-src/miles:/opt/integration-src/prorl/src:/root/Megatron-LM
        - name: PYTHONUNBUFFERED
          value: "1"
      ports:
        - {name: rollout, containerPort: 8080}
      startupProbe:
        httpGet: {path: /health, port: 8080}
        periodSeconds: 3
        failureThreshold: 60
      resources:
        requests: {cpu: "1", memory: 2Gi}
        limits: {cpu: "2", memory: 4Gi}
      volumeMounts:
        - {name: shared, mountPath: /shared}
        - {name: integration-src, mountPath: /opt/integration-src}
        - {name: topology, mountPath: /etc/polar}
    - name: gateway
      image: *miles-image
      imagePullPolicy: IfNotPresent
      command: ["bash", "-lc"]
      args:
        - |
          set -euxo pipefail
          export PATH=/opt/docker-cli:$PATH
          until docker info >/dev/null 2>&1; do sleep 2; done
          docker pull docker.io/library/node@sha256:4d676821dff059fd00d277ee4261ef34ea712317fed0737c03941481b5760c96
          docker run --rm --network host             docker.io/library/node@sha256:4d676821dff059fd00d277ee4261ef34ea712317fed0737c03941481b5760c96             node --version
          exec python3 -m polar.cli serve_gateway             -c /etc/polar/topology.yaml --node-id m5-prorl-gateway
      env:
        - name: PYTHONPATH
          value: /opt/integration-src/miles:/opt/integration-src/prorl/src:/root/Megatron-LM
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DOCKER_HOST
          value: tcp://127.0.0.1:2375
      ports:
        - {name: gateway, containerPort: 8100}
      startupProbe:
        httpGet: {path: /health, port: 8100}
        periodSeconds: 3
        failureThreshold: 240
      resources:
        requests: {cpu: "2", memory: 4Gi}
        limits: {cpu: "4", memory: 8Gi}
      volumeMounts:
        - {name: shared, mountPath: /shared}
        - {name: integration-src, mountPath: /opt/integration-src}
        - {name: topology, mountPath: /etc/polar}
        - {name: docker-cli, mountPath: /opt/docker-cli}
        - {name: session-tmp, mountPath: /tmp}
    - name: dind
      image: docker.io/library/docker@sha256:f649ef046008ca7f926a2571c32b0ac22e5c59eb61b959617f9acc2a4c638cf5
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
        runAsUser: 0
      command: ["dockerd"]
      args:
        - --host=tcp://0.0.0.0:2375
        - --host=unix:///var/run/docker.sock
        - --storage-driver=overlay2
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
      startupProbe:
        exec:
          command: ["docker", "--host=tcp://127.0.0.1:2375", "info"]
        periodSeconds: 3
        failureThreshold: 120
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 16Gi
        limits:
          cpu: "4"
          memory: 8Gi
          ephemeral-storage: 64Gi
      volumeMounts:
        - {name: docker-data, mountPath: /var/lib/docker}
        - {name: session-tmp, mountPath: /tmp}
        - {name: shared, mountPath: /shared}
  volumes:
    - name: shared
      persistentVolumeClaim: {claimName: shared-model-cache}
    - {name: integration-src, emptyDir: {}}
    - {name: topology, configMap: {name: prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z-prorl}}
    - {name: docker-cli, emptyDir: {}}
    - {name: docker-data, emptyDir: {}}
    - {name: session-tmp, emptyDir: {}}
