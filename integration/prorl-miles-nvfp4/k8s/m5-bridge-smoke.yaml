apiVersion: v1
kind: Pod
metadata:
  name: prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z-bridge-smoke
  namespace: warnold-dynamo
  labels:
    integration-run: prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z
    integration-role: m5-bridge-smoke
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 3000
  terminationGracePeriodSeconds: 30
  nodeSelector:
    kubernetes.io/arch: amd64
  initContainers:
    - name: install-integration
      image: &image docker.io/radixark/miles@sha256:39b5227d8b8cc9997d0777d72b555ea1f1f0dc4c1027649f8c44c6ce88f51859
      imagePullPolicy: IfNotPresent
      command: ["bash", "-lc"]
      args:
        - |
          set -euxo pipefail
          root=/shared/test-artifacts/prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z
          echo "1d90d516d27b2ede701e892a28a37e7cfb492cee9a18039e1220cb1b71fefcd5  $root/build/archives/miles-bc1341fd5.tar.gz" | sha256sum -c -
          echo "9b4cd02b40aa1f7fc61ba8065a29fa79eb32a16ad3ef4a6b6695e1f75b0d73dc  $root/build/archives/prorl-0ee1d48f65.tar.gz" | sha256sum -c -
          mkdir -p /opt/integration-src/miles /opt/integration-src/prorl
          tar -xzf "$root/build/archives/miles-bc1341fd5.tar.gz" -C /opt/integration-src/miles
          tar -xzf "$root/build/archives/prorl-0ee1d48f65.tar.gz" -C /opt/integration-src/prorl
          PYTHONPATH=/opt/integration-src/miles:/opt/integration-src/prorl/src:/root/Megatron-LM             python3 -c "from miles.utils.types import Sample; from slime_bridge.rollout import generate_rollout_polar_async; print(Sample, generate_rollout_polar_async)"
          mkdir -p "$root/evidence/bridge"
      resources:
        requests: {cpu: "1", memory: 2Gi}
        limits: {cpu: "2", memory: 4Gi}
      volumeMounts:
        - {name: shared, mountPath: /shared}
        - {name: integration-src, mountPath: /opt/integration-src}
  containers:
    - name: bridge
      image: *image
      imagePullPolicy: IfNotPresent
      command: ["bash", "-lc"]
      args:
        - |
          set -euxo pipefail
          root=/shared/test-artifacts/prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z
          python3 -c 'import pathlib,sys; src=pathlib.Path(sys.argv[1]).read_text(); pathlib.Path(sys.argv[2]).write_text(src.replace("__POD_IP__",sys.argv[3]))'             "$root/integration/polar-miles-m5.yaml.in" /opt/config/polar-miles.yaml "$POD_IP"
          until curl -fsS http://prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z-prorl:8080/health; do sleep 3; done
          until curl -fsS http://prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z-prorl:8100/health; do sleep 3; done
          until curl -fsS http://prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z-dynamo:8000/health; do sleep 5; done
          curl -fsS -X POST             http://prorl-miles-nvfp4-m5-0ee1d48-20260826t033310z-dynamo:9090/engine/control/update_weight_version             -H 'content-type: application/json' -d '{"new_version":"0"}'
          timeout --signal=TERM --kill-after=60s 2400s             python3 "$root/integration/validate_m5_bridge.py"               --polar-config /opt/config/polar-miles.yaml               --instruction 'Use the Agent tool exactly once in the foreground with description `Calculate product`, prompt `Calculate 13 * 17 and return exactly CHILD_221.`, and subagent_type `general-purpose`. Wait for its result. Then reply exactly ROOT_OK CHILD_221. Do not call any other tool.'               --evidence-dir "$root/evidence/bridge"               --trace-dir "$root/dynamo/request-trace"               --rollout-id 9000               --expected-weight-version 0             2>&1 | tee "$root/evidence/bridge/bridge.log"
      env:
        - name: PYTHONPATH
          value: /opt/integration-src/miles:/opt/integration-src/prorl/src:/root/Megatron-LM
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: HF_HOME
          value: /shared
        - name: HF_HUB_CACHE
          value: /shared/hub
        - name: POD_IP
          valueFrom:
            fieldRef: {fieldPath: status.podIP}
      resources:
        requests: {cpu: "2", memory: 8Gi}
        limits: {cpu: "4", memory: 16Gi}
      volumeMounts:
        - {name: shared, mountPath: /shared}
        - {name: integration-src, mountPath: /opt/integration-src}
        - {name: config, mountPath: /opt/config}
  volumes:
    - name: shared
      persistentVolumeClaim: {claimName: shared-model-cache}
    - {name: integration-src, emptyDir: {}}
    - {name: config, emptyDir: {}}
