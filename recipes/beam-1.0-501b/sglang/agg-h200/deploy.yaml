# Configure cluster placement before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: beam-sglang-h200-agg-config
data:
  worker.yaml: |-
    model-path: reflection/Beam-1.0-501B-A23B-FP8
    served-model-name: Beam-1.0-501B-A23B
    tensor-parallel-size: 8
    dtype: bfloat16
    quantization: compressed-tensors
    context-length: 1048576
    json-model-override-args:
      max_position_embeddings: 1048576
    attention-backend: fa3
    prefill-attention-backend: fa3
    decode-attention-backend: fa3
    moe-runner-backend: triton
    moe-a2a-backend: none
    ep-size: 1
    kv-cache-dtype: fp8_e4m3
    page-size: 64
    max-running-requests: 256
    chunked-prefill-size: 2048
    max-prefill-tokens: 2048
    mem-fraction-static: 0.85
    enable-unified-memory: true
    speculative-algorithm: DFLASH
    speculative-draft-model-path: reflection/Beam-1.0-501B-A23B-DFlash2
    speculative-draft-load-format: safetensors
    speculative-draft-model-quantization: unquant
    speculative-num-draft-tokens: 8
    speculative-draft-attention-backend: fa3
    speculative-draft-kv-cache-dtype: fp8_e4m3
    speculative-draft-window-size: 4096
    cuda-graph-backend-decode: full
    cuda-graph-max-bs-decode: 128
    cuda-graph-max-bs-prefill: 2048
    stream-interval: 1
    scheduler-recv-interval: 1
    random-seed: 42
    enable-metrics: true
    enable-cache-report: true
    weight-loader-disable-mmap: true
    weight-loader-drop-cache-after-load: true
    model-loader-extra-config:
      enable_multithread_load: false
    watchdog-timeout: 1200
    kv-events-config:
      publisher: zmq
      topic: kv-events
      endpoint: tcp://*:5557
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: beam-sglang-h200-agg
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-beam-1.0-501b-dev.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.frontend
                - --http-port
                - '8000'
                - --kv-cache-block-size
                - '64'
              env:
                - name: DYN_ROUTER_MODE
                  value: kv
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: TRANSFORMERS_OFFLINE
                  value: '1'
                - name: NVIDIA_VISIBLE_DEVICES
                  value: void
                - name: LD_LIBRARY_PATH
                  value: /usr/local/cuda/lib64/stubs:/usr/local/cuda/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
              resources:
                requests:
                  cpu: '4'
                  memory: 8Gi
                limits:
                  cpu: '8'
                  memory: 16Gi
    - name: Worker
      type: worker
      replicas: 1
      sharedMemorySize: 384Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-beam-1.0-501b-dev.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.sglang
                - --config
                - /etc/sglang/worker.yaml
                - --dyn-tool-call-parser
                - beam
                - --dyn-reasoning-parser
                - beam
                # Passed on the CLI rather than in worker.yaml: dynamo.sglang registers a legacy
                # store_const alias on the same dest, which makes the --config parser reject it.
                - --cuda-graph-backend-prefill
                - breakable
              env:
                - name: SGLANG_BEAM_ROUTER_BACKEND
                  value: cublas
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: TRANSFORMERS_OFFLINE
                  value: '1'
                - name: NCCL_NVLS_ENABLE
                  value: '0'
                - name: SGLANG_HEALTH_CHECK_TIMEOUT
                  value: '600'
                - name: USE_TRITON_W8A8_FP8_KERNEL
                  value: '0'
                - name: SGLANG_ENABLE_FP8_GEMM_CONFIG_TUNE
                  value: '0'
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
                    - SYS_RESOURCE
              resources:
                requests:
                  cpu: '64'
                  memory: 900Gi
                  nvidia.com/gpu: '8'
                limits:
                  cpu: '64'
                  memory: 900Gi
                  nvidia.com/gpu: '8'
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                - name: sglang-config
                  mountPath: /etc/sglang
                  readOnly: true
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
            - name: sglang-config
              configMap:
                name: beam-sglang-h200-agg-config
