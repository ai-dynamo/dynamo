# Configure cluster placement before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: beam-sglang-gb300-disagg-config
data:
  prefill.yaml: |-
    model-path: reflection/Beam-1.0-501B-A23B-NVFP4
    served-model-name: Beam-1.0-501B-A23B
    reasoning-parser: beam
    dtype: bfloat16
    quantization: modelopt_fp4
    kv-cache-dtype: fp8_e4m3
    tp-size: 4
    dp-size: 1
    ep-size: 1
    moe-runner-backend: flashinfer_trtllm
    moe-a2a-backend: none
    attention-backend: trtllm_mha
    page-size: 64
    speculative-algorithm: DFLASH
    speculative-draft-model-path: reflection/Beam-1.0-501B-A23B-DFlash2
    speculative-draft-load-format: safetensors
    speculative-draft-model-quantization: unquant
    speculative-num-draft-tokens: 8
    speculative-draft-attention-backend: trtllm_mha
    speculative-draft-kv-cache-dtype: fp8_e4m3
    speculative-draft-window-size: 4096
    context-length: 1048576
    stream-interval: 1
    watchdog-timeout: 1200
    grammar-backend: xgrammar
    json-model-override-args:
      max_position_embeddings: 1048576
    mem-fraction-static: 0.95
    max-total-tokens: 8000000
    swa-full-tokens-ratio: 0.625
    max-running-requests: 512
    chunked-prefill-size: 16384
    max-prefill-tokens: 16384
    cuda-graph-max-bs-prefill: 4096
    host: 0.0.0.0
    disaggregation-mode: prefill
    disaggregation-transfer-backend: nixl
    disaggregation-bootstrap-port: 8998
    enable-metrics: true
    kv-events-config:
      publisher: zmq
      topic: kv-events
      endpoint: tcp://*:5557
  decode.yaml: |-
    model-path: reflection/Beam-1.0-501B-A23B-NVFP4
    served-model-name: Beam-1.0-501B-A23B
    reasoning-parser: beam
    dtype: bfloat16
    quantization: modelopt_fp4
    kv-cache-dtype: fp8_e4m3
    tp-size: 4
    dp-size: 1
    ep-size: 1
    moe-runner-backend: flashinfer_trtllm
    moe-a2a-backend: none
    attention-backend: trtllm_mha
    page-size: 64
    speculative-algorithm: DFLASH
    speculative-draft-model-path: reflection/Beam-1.0-501B-A23B-DFlash2
    speculative-draft-load-format: safetensors
    speculative-draft-model-quantization: unquant
    speculative-num-draft-tokens: 8
    speculative-draft-attention-backend: trtllm_mha
    speculative-draft-kv-cache-dtype: fp8_e4m3
    speculative-draft-window-size: 4096
    context-length: 1048576
    stream-interval: 1
    watchdog-timeout: 1200
    grammar-backend: xgrammar
    json-model-override-args:
      max_position_embeddings: 1048576
    mem-fraction-static: 0.8
    max-total-tokens: 6000000
    swa-full-tokens-ratio: 0.05
    max-running-requests: 128
    cuda-graph-max-bs-decode: 128
    chunked-prefill-size: 1024
    max-prefill-tokens: 512
    prefill-decode-interval: 1
    disable-radix-cache: true
    host: 0.0.0.0
    disaggregation-mode: decode
    disaggregation-transfer-backend: nixl
    disaggregation-bootstrap-port: 8998
    enable-metrics: true
    kv-events-config:
      publisher: zmq
      topic: kv-events
      endpoint: tcp://*:5557
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: beam-sglang-gb300-disagg
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-beam-1.0-501b-dev.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.frontend
                - --http-port
                - '8000'
                - --kv-cache-block-size
                - '64'
                - --enforce-disagg
              env:
                - name: DYN_ROUTER_MODE
                  value: kv
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: TRANSFORMERS_OFFLINE
                  value: '1'
                - name: NVIDIA_VISIBLE_DEVICES
                  value: void
                - name: LD_LIBRARY_PATH
                  value: /usr/local/cuda/lib64/stubs:/usr/local/cuda/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
              resources:
                requests:
                  cpu: '4'
                  memory: 8Gi
                limits:
                  cpu: '8'
                  memory: 16Gi
    - name: PrefillWorker
      type: prefill
      replicas: 1
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-beam-1.0-501b-dev.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.sglang
                - --config
                - /etc/sglang/prefill.yaml
                - --dyn-reasoning-parser
                - beam
                - --dyn-tool-call-parser
                - beam
                # Passed on the CLI rather than in prefill.yaml: dynamo.sglang registers a legacy
                # store_const alias on the same dest, which makes the --config parser reject it.
                - --cuda-graph-backend-prefill
                - breakable
              env:
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: TRANSFORMERS_OFFLINE
                  value: '1'
                - name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN
                  value: '1'
                - name: SGLANG_ENABLE_UNIFIED_RADIX_TREE
                  value: '1'
                - name: SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS
                  value: 'false'
                - name: SGLANG_MOE_COPY_WEIGHT_VIEWS_BEFORE_H2D
                  value: '1'
                - name: SGLANG_NUMA_BIND_V2
                  value: 'false'
                - name: SGLANG_FLASHINFER_AUTOTUNE_CACHE
                  value: '1'
                - name: SGLANG_FLASHINFER_AUTOTUNE_EXTEND
                  value: '0'
                - name: SGLANG_BEAM_ROUTER_BACKEND
                  value: cublas
                - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
                  value: UCX
                - name: SGLANG_DISAGGREGATION_NIXL_BACKEND_PARAMS
                  value: '{"num_threads":"8"}'
                - name: SGLANG_DISAGGREGATION_ENGINE_INIT_TIMEOUT
                  value: '600'
                - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
                  value: '120'
                - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
                  value: '120'
                - name: UCX_TLS
                  value: cuda_ipc,cuda_copy,rc
                - name: DYN_TCP_REQUEST_TIMEOUT
                  value: '1800'
                - name: NVIDIA_IMEX_CHANNELS
                  value: '0'
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
                    - SYS_RESOURCE
              resources:
                requests:
                  cpu: '32'
                  memory: 700Gi
                  nvidia.com/gpu: '4'
                limits:
                  cpu: '32'
                  memory: 700Gi
                  nvidia.com/gpu: '4'
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                - name: sglang-config
                  mountPath: /etc/sglang
                  readOnly: true
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
            - name: sglang-config
              configMap:
                name: beam-sglang-gb300-disagg-config
    - name: DecodeWorker
      type: decode
      replicas: 1
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-beam-1.0-501b-dev.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.sglang
                - --config
                - /etc/sglang/decode.yaml
                - --disable-prefill-cuda-graph
                - --dyn-reasoning-parser
                - beam
                - --dyn-tool-call-parser
                - beam
              env:
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: TRANSFORMERS_OFFLINE
                  value: '1'
                - name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN
                  value: '1'
                - name: SGLANG_ENABLE_UNIFIED_RADIX_TREE
                  value: '1'
                - name: SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS
                  value: 'false'
                - name: SGLANG_MOE_COPY_WEIGHT_VIEWS_BEFORE_H2D
                  value: '1'
                - name: SGLANG_NUMA_BIND_V2
                  value: 'false'
                - name: SGLANG_FLASHINFER_AUTOTUNE_CACHE
                  value: '1'
                - name: SGLANG_FLASHINFER_AUTOTUNE_EXTEND
                  value: '0'
                - name: SGLANG_BEAM_ROUTER_BACKEND
                  value: cublas
                - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
                  value: UCX
                - name: SGLANG_DISAGGREGATION_NIXL_BACKEND_PARAMS
                  value: '{"num_threads":"8"}'
                - name: SGLANG_DISAGGREGATION_ENGINE_INIT_TIMEOUT
                  value: '600'
                - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
                  value: '120'
                - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
                  value: '120'
                - name: UCX_TLS
                  value: cuda_ipc,cuda_copy,rc
                - name: DYN_TCP_REQUEST_TIMEOUT
                  value: '1800'
                - name: NVIDIA_IMEX_CHANNELS
                  value: '0'
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
                    - SYS_RESOURCE
              resources:
                requests:
                  cpu: '32'
                  memory: 550Gi
                  nvidia.com/gpu: '4'
                limits:
                  cpu: '32'
                  memory: 550Gi
                  nvidia.com/gpu: '4'
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                - name: sglang-config
                  mountPath: /etc/sglang
                  readOnly: true
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
            - name: sglang-config
              configMap:
                name: beam-sglang-gb300-disagg-config
