# Configure cluster placement before applying.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: beam-vllm-h200-agg
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-beam-1.0-501b-dev.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.frontend
                - --http-port
                - '8000'
                - --kv-cache-block-size
                - '64'
                - --no-router-kv-events
              env:
                - name: DYN_ROUTER_MODE
                  value: kv
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: TRANSFORMERS_OFFLINE
                  value: '1'
                - name: NVIDIA_VISIBLE_DEVICES
                  value: void
                - name: LD_LIBRARY_PATH
                  value: /usr/local/cuda/lib64/stubs:/usr/local/cuda/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
              resources:
                requests:
                  cpu: '4'
                  memory: 8Gi
                limits:
                  cpu: '8'
                  memory: 16Gi
    - name: Worker
      type: worker
      replicas: 1
      sharedMemorySize: 384Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-beam-1.0-501b-dev.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.vllm
                - --model
                - $(MODEL_NAME)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --tensor-parallel-size
                - '8'
                - --dtype
                - bfloat16
                - --quantization
                - compressed-tensors
                - --max-model-len
                - '1048576'
                - --attention-config
                - '{"backend":"FLASH_ATTN","flash_attn_version":3}'
                - --linear-backend
                - cutlass
                - --moe-backend
                - triton
                - --kv-cache-dtype
                - fp8_e4m3
                - --block-size
                - '64'
                - --max-num-seqs
                - '256'
                - --enable-chunked-prefill
                - --max-num-batched-tokens
                - '2048'
                - --gpu-memory-utilization
                - '0.95'
                - --enable-prefix-caching
                - --kv-offloading-backend
                - native
                - --kv-offloading-size
                - '298'
                - --speculative-config
                - '{"method":"dflash","model":"$(DRAFT_MODEL_NAME)","num_speculative_tokens":7,"draft_tensor_parallel_size":8,"kv_cache_dtype":"fp8_e4m3","attention_backend":"FLASH_ATTN","max_model_len":1048576}'
                - --seed
                - '42'
                - --safetensors-load-strategy
                - lazy
                - --dyn-tool-call-parser
                - beam
                - --dyn-reasoning-parser
                - beam
              env:
                - name: MODEL_NAME
                  value: reflection/Beam-1.0-501B-A23B-FP8
                - name: DRAFT_MODEL_NAME
                  value: reflection/Beam-1.0-501B-A23B-DFlash2
                - name: SERVED_MODEL_NAME
                  value: Beam-1.0-501B-A23B
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: '3600'
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: TRANSFORMERS_OFFLINE
                  value: '1'
                - name: NCCL_NVLS_ENABLE
                  value: '0'
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
                    - SYS_RESOURCE
              resources:
                requests:
                  cpu: '64'
                  memory: 900Gi
                  nvidia.com/gpu: '8'
                limits:
                  cpu: '64'
                  memory: 900Gi
                  nvidia.com/gpu: '8'
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
