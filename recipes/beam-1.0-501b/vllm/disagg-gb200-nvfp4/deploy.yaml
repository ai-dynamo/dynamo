# Configure GPU placement, RDMA device access, and UCX networking before applying.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: beam-vllm-gb200-disagg
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-beam-1.0-501b-dev.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.frontend
                - --http-port
                - '8000'
                - --kv-cache-block-size
                - '64'
                - --no-router-kv-events
                - --enforce-disagg
              env:
                - name: DYN_ROUTER_MODE
                  value: kv
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: TRANSFORMERS_OFFLINE
                  value: '1'
                - name: NVIDIA_VISIBLE_DEVICES
                  value: void
                - name: LD_LIBRARY_PATH
                  value: /usr/local/cuda/lib64/stubs:/usr/local/cuda/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
              resources:
                requests:
                  cpu: '4'
                  memory: 8Gi
                limits:
                  cpu: '8'
                  memory: 16Gi
    - name: PrefillWorker
      type: prefill
      replicas: 1
      sharedMemorySize: 192Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-beam-1.0-501b-dev.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.vllm
                - --disaggregation-mode
                - prefill
                # Compose explicitly: --kv-offloading-size would replace the NIXL connector.
                - --kv-transfer-config
                - '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_producer"},{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":160000000000}}]}}'
                - --model
                - $(MODEL_NAME)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --tensor-parallel-size
                - '4'
                - --dtype
                - bfloat16
                - --max-model-len
                - '1048576'
                - --attention-config
                - '{"backend":"FLASHINFER"}'
                - --moe-backend
                - flashinfer_trtllm
                - --kv-cache-dtype
                - fp8_e4m3
                - --block-size
                - '64'
                - --max-num-seqs
                - '128'
                - --enable-chunked-prefill
                - --max-num-batched-tokens
                - '2048'
                - --gpu-memory-utilization
                - '0.9'
                - --enable-prefix-caching
                - --speculative-config
                - '{"method":"dflash","model":"$(DRAFT_MODEL_NAME)","num_speculative_tokens":7,"draft_tensor_parallel_size":4,"kv_cache_dtype":"fp8_e4m3","attention_backend":"FLASH_ATTN","max_model_len":1048576}'
                - --seed
                - '42'
                - --safetensors-load-strategy
                - lazy
                - --per-request-spec-decode-metrics
                - summary
                - --dyn-tool-call-parser
                - beam
                - --dyn-reasoning-parser
                - beam
              env:
                - name: MODEL_NAME
                  value: reflection/Beam-1.0-501B-A23B-NVFP4
                - name: DRAFT_MODEL_NAME
                  value: reflection/Beam-1.0-501B-A23B-DFlash2
                - name: SERVED_MODEL_NAME
                  value: Beam-1.0-501B-A23B
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: '3600'
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: TRANSFORMERS_OFFLINE
                  value: '1'
                - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: VLLM_NIXL_SIDE_CHANNEL_PORT
                  value: '5600'
                - name: NCCL_NVLS_ENABLE
                  value: '0'
                - name: NVIDIA_IMEX_CHANNELS
                  value: '0'
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
                    - SYS_RESOURCE
              resources:
                requests:
                  cpu: '32'
                  memory: 450Gi
                  nvidia.com/gpu: '4'
                limits:
                  cpu: '32'
                  memory: 450Gi
                  nvidia.com/gpu: '4'
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
    - name: DecodeWorker
      type: decode
      replicas: 1
      sharedMemorySize: 192Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-beam-1.0-501b-dev.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.vllm
                - --disaggregation-mode
                - decode
                # Compose explicitly: --kv-offloading-size would replace the NIXL connector.
                - --kv-transfer-config
                - '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_consumer"},{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":160000000000}}]}}'
                - --model
                - $(MODEL_NAME)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --tensor-parallel-size
                - '4'
                - --dtype
                - bfloat16
                - --max-model-len
                - '1048576'
                - --attention-config
                - '{"backend":"FLASHINFER"}'
                - --moe-backend
                - flashinfer_trtllm
                - --kv-cache-dtype
                - fp8_e4m3
                - --block-size
                - '64'
                - --max-num-seqs
                - '128'
                - --enable-chunked-prefill
                - --max-num-batched-tokens
                - '2048'
                - --gpu-memory-utilization
                - '0.9'
                - --enable-prefix-caching
                - --speculative-config
                - '{"method":"dflash","model":"$(DRAFT_MODEL_NAME)","num_speculative_tokens":7,"draft_tensor_parallel_size":4,"kv_cache_dtype":"fp8_e4m3","attention_backend":"FLASH_ATTN","max_model_len":1048576}'
                - --seed
                - '42'
                - --safetensors-load-strategy
                - lazy
                - --per-request-spec-decode-metrics
                - summary
                - --dyn-tool-call-parser
                - beam
                - --dyn-reasoning-parser
                - beam
              env:
                - name: MODEL_NAME
                  value: reflection/Beam-1.0-501B-A23B-NVFP4
                - name: DRAFT_MODEL_NAME
                  value: reflection/Beam-1.0-501B-A23B-DFlash2
                - name: SERVED_MODEL_NAME
                  value: Beam-1.0-501B-A23B
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: '3600'
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: TRANSFORMERS_OFFLINE
                  value: '1'
                - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: VLLM_NIXL_SIDE_CHANNEL_PORT
                  value: '5600'
                - name: NCCL_NVLS_ENABLE
                  value: '0'
                - name: NVIDIA_IMEX_CHANNELS
                  value: '0'
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
                    - SYS_RESOURCE
              resources:
                requests:
                  cpu: '32'
                  memory: 450Gi
                  nvidia.com/gpu: '4'
                limits:
                  cpu: '32'
                  memory: 450Gi
                  nvidia.com/gpu: '4'
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
