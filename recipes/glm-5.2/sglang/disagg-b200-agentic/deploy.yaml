apiVersion: v1
kind: ConfigMap
metadata:
  name: glm52-disagg-b200-agentic-sglang-config
  labels:
    app.kubernetes.io/name: glm52-disagg-b200-agentic
    app.kubernetes.io/part-of: dynamo
data:
  prefill.yaml: |-
    model-path: RadixArk/GLM-5.3-NVFP4
    served-model-name: zai-org/GLM-5.3
    host: 0.0.0.0
    trust-remote-code: true
    tensor-parallel-size: 4
    data-parallel-size: 4
    enable-dp-attention: true
    ep-size: 4
    quantization: modelopt_fp4
    kv-cache-dtype: fp8_e4m3
    context-length: 500000
    mem-fraction-static: 0.86
    attention-backend: dsa
    moe-runner-backend: flashinfer_trtllm_routed
    chunked-prefill-size: 16384
    max-prefill-tokens: 32768
    max-running-requests: 32
    watchdog-timeout: 3600
    cuda-graph-backend-decode: disabled
    disaggregation-mode: prefill
    disaggregation-transfer-backend: mooncake
    disaggregation-bootstrap-port: 12345
    speculative-algorithm: EAGLE
    speculative-num-steps: 3
    speculative-eagle-topk: 1
    speculative-num-draft-tokens: 4
    enable-dp-lm-head: true
    hicache-size: 200
    enable-hierarchical-cache: true
    kv-events-config:
      publisher: zmq
      topic: kv-events
      endpoint: tcp://*:5557
    model-loader-extra-config:
      enable_multithread_load: true
      num_threads: 32
    disable-overlap-schedule: true
    enable-metrics: true

  decode.yaml: |-
    model-path: RadixArk/GLM-5.3-NVFP4
    served-model-name: zai-org/GLM-5.3
    trust-remote-code: true
    tensor-parallel-size: 8
    data-parallel-size: 8
    enable-dp-attention: true
    moe-a2a-backend: none
    fp4-gemm-backend: flashinfer_cutlass
    enable-symm-mem: true
    quantization: modelopt_fp4
    kv-cache-dtype: fp8_e4m3
    context-length: 500000
    disaggregation-mode: decode
    disaggregation-transfer-backend: mooncake
    disaggregation-bootstrap-port: 12345
    speculative-algorithm: EAGLE
    speculative-num-steps: 3
    speculative-eagle-topk: 1
    speculative-num-draft-tokens: 4
    speculative-attention-mode: decode
    max-running-requests: 256
    watchdog-timeout: 3600
    cuda-graph-max-bs: 256
    mem-fraction-static: 0.84
    enable-metrics: true
    speculative-moe-runner-backend: flashinfer_cutlass
    speculative-moe-a2a-backend: none
    num-continuous-decode-steps: 3
    enable-flashinfer-allreduce-fusion: true
    enable-dp-lm-head: true
    model-loader-extra-config:
      enable_multithread_load: true
      num_threads: 32
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: glm52-disagg-b200-agentic
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      podTemplate:
        spec:
          containers:
            - name: main
              command:
                - python3
              args:
                - -m
                - dynamo.frontend
                - --trust-remote-code
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: DYN_ROUTER_MODE
                  value: kv
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.5.1@sha256:37badffd83eb334aee9d06fb442e36fc3c963314336c92622c78ac5c037d514d
              imagePullPolicy: IfNotPresent
              resources: {}
      replicas: 1

    - name: prefill
      type: prefill
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.product
                        operator: In
                        values:
                          - NVIDIA-B200
          containers:
            - name: main
              command:
                - /bin/bash
                - -lc
              args:
                - |
                  set -euo pipefail
                  ulimit -l unlimited || true
                  ulimit -n 1048576 || true
                  exec python3 -m dynamo.sglang \
                    --config /etc/sglang/prefill.yaml \
                    --dsa-prefill-backend trtllm \
                    --dsa-decode-backend trtllm \
                    --cuda-graph-backend-prefill disabled \
                    --dyn-tool-call-parser glm47 \
                    --dyn-reasoning-parser glm45 \
                    --reasoning-parser glm45
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HF_HOME
                  value: /model-cache
                - name: DYN_SGL_ALLOW_TOP_LOGPROBS
                  value: "1"
                # Forward-pass metrics are disabled: the SGLang 0.5.18 metrics reporter in
                # sglang-runtime:1.5.0 crashes the scheduler on the first EAGLE decode batch.
                - name: DYN_FORWARDPASS_METRIC_PORT
                  value: ""
                - name: MC_FORCE_HCA
                  value: "1"
              envFrom:
                - secretRef:
                    name: hf-token-secret
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.5.1@sha256:37badffd83eb334aee9d06fb442e36fc3c963314336c92622c78ac5c037d514d
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  nvidia.com/gpu: "4"
                  rdma/shared_ib: "1"
                  memory: 1Ti
                limits:
                  nvidia.com/gpu: "4"
                  rdma/shared_ib: "1"
                  memory: 1Ti
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
                    - SYS_RESOURCE
              startupProbe:
                failureThreshold: 120
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 20
              # Replaces the operator default liveness (5 s / 4 s / 3 failures) and readiness
              # (10 s / 4 s / 3 failures) probes: serve-time kernel compiles and long EAGLE
              # batches can stall /live beyond the default budget and restart a healthy worker.
              livenessProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 60
                failureThreshold: 10
              readinessProbe:
                httpGet:
                  path: /health
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 60
                failureThreshold: 10
              volumeMounts:
                - mountPath: /model-cache
                  name: model-cache
                - mountPath: /etc/sglang
                  name: sglang-config
                  readOnly: true
              workingDir: /workspace/
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: sglang-config
              configMap:
                name: glm52-disagg-b200-agentic-sglang-config
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
      replicas: 3

    - name: decode
      type: decode
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.product
                        operator: In
                        values:
                          - NVIDIA-B200
          containers:
            - name: main
              command:
                - /bin/bash
                - -lc
              args:
                - |
                  set -euo pipefail
                  ulimit -l unlimited || true
                  ulimit -n 1048576 || true
                  exec python3 -m dynamo.sglang \
                    --config /etc/sglang/decode.yaml \
                    --dyn-tool-call-parser glm47 \
                    --dyn-reasoning-parser glm45 \
                    --reasoning-parser glm45
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HF_HOME
                  value: /model-cache
                - name: DYN_SGL_ALLOW_TOP_LOGPROBS
                  value: "1"
                # Forward-pass metrics are disabled: the SGLang 0.5.18 metrics reporter in
                # sglang-runtime:1.5.0 crashes the scheduler on the first EAGLE decode batch.
                - name: DYN_FORWARDPASS_METRIC_PORT
                  value: ""
                # Synthetic MTP acceptance length for performance benchmarking only.
                # Uncomment for throughput runs; keep commented for accuracy evaluation.
                # - name: SGLANG_SIMULATE_ACC_LEN
                #   value: "2.69"
                # - name: SGLANG_SIMULATE_ACC_METHOD
                #   value: match-expected
                # - name: SGLANG_SIMULATE_ACC_TOKEN_MODE
                #   value: real-draft-token
                - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
                  value: "3600"
                - name: MC_FORCE_HCA
                  value: "1"
              envFrom:
                - secretRef:
                    name: hf-token-secret
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.5.1@sha256:37badffd83eb334aee9d06fb442e36fc3c963314336c92622c78ac5c037d514d
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  nvidia.com/gpu: "8"
                  rdma/shared_ib: "1"
                  memory: 200Gi
                limits:
                  nvidia.com/gpu: "8"
                  rdma/shared_ib: "1"
                  memory: 200Gi
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
                    - SYS_RESOURCE
              startupProbe:
                failureThreshold: 120
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 20
              # Replaces the operator default liveness (5 s / 4 s / 3 failures) and readiness
              # (10 s / 4 s / 3 failures) probes: serve-time kernel compiles and long EAGLE
              # batches can stall /live beyond the default budget and restart a healthy worker.
              livenessProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 60
                failureThreshold: 10
              readinessProbe:
                httpGet:
                  path: /health
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 60
                failureThreshold: 10
              volumeMounts:
                - mountPath: /model-cache
                  name: model-cache
                - mountPath: /etc/sglang
                  name: sglang-config
                  readOnly: true
              workingDir: /workspace/
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: sglang-config
              configMap:
                name: glm52-disagg-b200-agentic-sglang-config
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
      replicas: 1
