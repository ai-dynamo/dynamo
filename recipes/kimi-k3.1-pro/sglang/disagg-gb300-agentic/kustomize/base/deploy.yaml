# Kimi-K3.1-Pro Dynamo + SGLang disaggregated recipe (GB300): 1 prefill TP8 + 1 decode TP8, NIXL KV transfer over NVLink. EXPERIMENTAL, FUNCTIONAL-ONLY. Not tuned, no performance claim.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: kimi-k3-1-pro-sglang-gb300-disagg-agentic
spec:
  backendFramework: sglang
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - args:
          - --http-host
          - 0.0.0.0
          - --http-port
          - '8000'
          - --dyn-chat-processor
          - dynamo
          - --router-session-affinity-ttl-secs
          - '900'
          - --trust-remote-code
          command:
          - python3
          - -m
          - dynamo.frontend
          env:
          - name: DYN_ROUTER_MODE
            value: round-robin
          - name: DYN_SGL_FRONTEND_DECODING
            value: 'true'
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS
            value: '3600'
          - name: DYN_TOKENIZER_CACHE_BYTES
            value: '8589934592'
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.7.0-kimi-k3.1-pro-dev.1@sha256:e7392b04e4b1e1142dbf0e4d31285a16728f430b6f9a331ac339682bb014d84d
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            requests:
              cpu: '16'
              memory: 128Gi
    replicas: 1
    type: frontend
  - multinode:
      nodeCount: 2
    name: PrefillWorker
    podTemplate:
      spec:
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: kimi-k3-1-pro-sglang-gb300-disagg-agentic-compute-domain-channel
        containers:
        - args:
          - --config
          - /etc/sglang/prefill.yaml
          - --dyn-reasoning-parser
          - kimi_k3
          - --dyn-structural-tag
          - '{"reasoning_boundary":"backend"}'
          - --dyn-tool-call-parser
          - kimi_k3
          command:
          - python3
          - -m
          - dynamo.sglang
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: DYN_SGL_FRONTEND_DECODING
            value: 'true'
          - name: SGLANG_CUSTOM_ALL_REDUCE_V2_MAX_SIZE_KB
            value: '32768'
          - name: SGLANG_UNBALANCED_MODEL_LOADING_TIMEOUT_S
            value: '3600'
          - name: MC_FORCE_MNNVL
            value: '1'
          - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
            value: UCX
          - name: SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE
            value: '100000'
          - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
            value: '100000'
          - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
            value: '100000'
          - name: UCX_TLS
            value: cuda_copy,cuda_ipc,tcp
          - name: UCX_CUDA_IPC_ENABLE_MNNVL
            value: y
          - name: UCX_MEMTYPE_CACHE
            value: n
          - name: PYTORCH_ALLOC_CONF
            value: expandable_segments:False
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: DYN_SELF_HOST_METADATA
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: ETCD_LEASE_TTL
            value: '120'
          - name: NCCL_CUMEM_ENABLE
            value: '1'
          - name: NCCL_MNNVL_ENABLE
            value: '1'
          - name: NCCL_NVLS_ENABLE
            value: '1'
          - name: NCCL_P2P_LEVEL
            value: NVL
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.7.0-kimi-k3.1-pro-dev.1@sha256:e7392b04e4b1e1142dbf0e4d31285a16728f430b6f9a331ac339682bb014d84d
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            claims:
            - name: compute-domain-channel
            limits:
              nvidia.com/gpu: '4'
            requests:
              # Above the default; matches the validated benchmark configuration.
              cpu: '72'
              ephemeral-storage: 64Gi
              # Above the default; matches the validated benchmark configuration.
              memory: 512Gi
              nvidia.com/gpu: '4'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
          - mountPath: /shared-model-cache
            name: shared-model-cache
          - name: sglang-config
            mountPath: /etc/sglang
            readOnly: true
        terminationGracePeriodSeconds: 60
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        - name: sglang-config
          configMap:
            name: kimi-k3-1-pro-sglang-gb300-disagg-agentic-sglang-config
    replicas: 1
    sharedMemorySize: 64Gi
    type: prefill
  - multinode:
      nodeCount: 2
    name: DecodeWorker
    podTemplate:
      spec:
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: kimi-k3-1-pro-sglang-gb300-disagg-agentic-compute-domain-channel
        containers:
        - args:
          - --config
          - /etc/sglang/decode.yaml
          - --dyn-reasoning-parser
          - kimi_k3
          - --dyn-structural-tag
          - '{"reasoning_boundary":"backend"}'
          - --dyn-tool-call-parser
          - kimi_k3
          command:
          - python3
          - -m
          - dynamo.sglang
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: DYN_SGL_FRONTEND_DECODING
            value: 'true'
          - name: SGLANG_CUSTOM_ALL_REDUCE_V2_MAX_SIZE_KB
            value: '32768'
          - name: SGLANG_UNBALANCED_MODEL_LOADING_TIMEOUT_S
            value: '3600'
          - name: MC_FORCE_MNNVL
            value: '1'
          - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
            value: UCX
          - name: SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE
            value: '100000'
          - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
            value: '100000'
          - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
            value: '100000'
          - name: UCX_TLS
            value: cuda_copy,cuda_ipc,tcp
          - name: UCX_CUDA_IPC_ENABLE_MNNVL
            value: y
          - name: UCX_MEMTYPE_CACHE
            value: n
          - name: PYTORCH_ALLOC_CONF
            value: expandable_segments:False
          - name: SGLANG_DECODE_BOOTSTRAP_TIMEOUT
            value: '1000'
          - name: SGLANG_HACK_SEQ_BOOTSTRAP_ROOM
            value: '1'
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: DYN_SELF_HOST_METADATA
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: ETCD_LEASE_TTL
            value: '120'
          - name: NCCL_CUMEM_ENABLE
            value: '1'
          - name: NCCL_MNNVL_ENABLE
            value: '1'
          - name: NCCL_NVLS_ENABLE
            value: '1'
          - name: NCCL_P2P_LEVEL
            value: NVL
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.7.0-kimi-k3.1-pro-dev.1@sha256:e7392b04e4b1e1142dbf0e4d31285a16728f430b6f9a331ac339682bb014d84d
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            claims:
            - name: compute-domain-channel
            limits:
              nvidia.com/gpu: '4'
            requests:
              # Above the default; matches the validated benchmark configuration.
              cpu: '72'
              ephemeral-storage: 64Gi
              # Above the default; matches the validated benchmark configuration.
              memory: 512Gi
              nvidia.com/gpu: '4'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
          - mountPath: /shared-model-cache
            name: shared-model-cache
          - name: sglang-config
            mountPath: /etc/sglang
            readOnly: true
        terminationGracePeriodSeconds: 60
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        - name: sglang-config
          configMap:
            name: kimi-k3-1-pro-sglang-gb300-disagg-agentic-sglang-config
    replicas: 1
    sharedMemorySize: 64Gi
    type: decode
---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: kimi-k3-1-pro-sglang-gb300-disagg-agentic-compute-domain
spec:
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: kimi-k3-1-pro-sglang-gb300-disagg-agentic-compute-domain-channel
  numNodes: 0
