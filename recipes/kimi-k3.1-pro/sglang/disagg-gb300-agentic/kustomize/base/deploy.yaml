# Kimi-K3.1-Pro Dynamo + SGLang disaggregated recipe (GB300): 1 prefill TP8 + 1 decode TP8, NIXL KV transfer over NVLink. EXPERIMENTAL, FUNCTIONAL-ONLY. Not tuned, no performance claim.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: kimi-k3-1-pro-sglang-disagg-gb300
  labels:
    app.kubernetes.io/name: kimi-k3-1-pro-sglang-disagg-gb300
    app.kubernetes.io/part-of: dynamo
spec:
  backendFramework: sglang
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - args:
          - --http-host
          - 0.0.0.0
          - --http-port
          - '8000'
          - --dyn-chat-processor
          - sglang
          - --router-mode
          - round-robin
          - --router-session-affinity-ttl-secs
          - '900'
          - --trust-remote-code
          command:
          - python3
          - -m
          - dynamo.frontend
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS
            value: '3600'
          - name: DYN_TOKENIZER_CACHE_BYTES
            value: '8589934592'
          - name: MODEL_PATH
            value: /shared-model-cache/moonshotai/Kimi-K3.1-Pro
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.7.0-kimi-k3.1-pro-dev.1
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            requests:
              cpu: '16'
              memory: 128Gi
          volumeMounts:
          - mountPath: /shared-model-cache
            name: shared-model-cache
            readOnly: true
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
            readOnly: true
    replicas: 1
    runtimeVersionOverride: 1.7.0
    type: frontend
  - multinode:
      nodeCount: 2
    name: PrefillWorker
    podTemplate:
      spec:
        containers:
        - args:
          - |
            set -euo pipefail
            ulimit -l unlimited
            ulimit -n 1048576

            # Model-card staging required by this image's registration shim (kimi_k31 -> kimi_k3 tokenizer mapping)
            STAGE=/tmp/kimi-k3-1-model-card; mkdir -p "$STAGE"
            for f in "$MODEL_PATH"/* "$MODEL_PATH"/.[!.]*; do n=$(basename "$f"); [ -f "$f" ] || continue
              case "$n" in config.json|*.safetensors|*.safetensors.index.json) continue;; esac
              ln -sfn "$f" "$STAGE/$n"; done
            STAGE="$STAGE" python3 -c 'import json,os; c=json.load(open(os.environ["MODEL_PATH"]+"/config.json")); c["model_type"]="kimi_k3"; json.dump(c, open(os.environ["STAGE"]+"/config.json","w"))'
            ls "$STAGE" | wc -l

            exec python3 -m dynamo.sglang \
              --model-path "${MODEL_PATH}" \
              --served-model-name moonshotai/Kimi-K3.1-Pro \
              --tensor-parallel-size 8 \
              --disaggregation-mode prefill \
              --disaggregation-transfer-backend nixl \
              --disaggregation-bootstrap-port 30001 \
              --host 0.0.0.0 \
              --trust-remote-code \
              --dyn-reasoning-parser kimi_k3 \
              --dyn-structural-tag '{"reasoning_boundary":"backend"}' \
              --dyn-tool-call-parser kimi_k3 \
              --kv-cache-dtype fp8_e4m3 \
              --mem-fraction-static 0.88 \
              --chunked-prefill-size 16384 \
              --max-prefill-tokens 16384 \
              --page-size 64 \
              --max-running-requests 32 \
              --mamba-radix-cache-strategy extra_buffer \
              --mamba-track-interval 256 \
              --enable-cache-report \
              --enable-metrics \
              --watchdog-timeout 3600 \
              --weight-loader-disable-mmap \
              --model-loader-extra-config '{"enable_multithread_load":true,"num_threads":4}'
          command:
          - /bin/bash
          - -lc
          env:
          - name: HOME
            value: /tmp/k31-home
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: SGLANG_CUSTOM_ALL_REDUCE_V2_MAX_SIZE_KB
            value: '32768'
          - name: SGLANG_UNBALANCED_MODEL_LOADING_TIMEOUT_S
            value: '3600'
          - name: MC_FORCE_MNNVL
            value: '1'
          - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
            value: UCX
          - name: SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE
            value: '100000'
          - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
            value: '100000'
          - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
            value: '100000'
          - name: UCX_TLS
            value: cuda_copy,cuda_ipc,tcp
          - name: UCX_CUDA_IPC_ENABLE_MNNVL
            value: 'y'
          - name: UCX_MEMTYPE_CACHE
            value: 'n'
          - name: PYTORCH_ALLOC_CONF
            value: expandable_segments:False
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: DYN_SELF_HOST_METADATA
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: ETCD_LEASE_TTL
            value: '120'
          - name: NCCL_CUMEM_ENABLE
            value: '1'
          - name: NCCL_MNNVL_ENABLE
            value: '1'
          - name: NCCL_NVLS_ENABLE
            value: '1'
          - name: NCCL_P2P_LEVEL
            value: NVL
          - name: MODEL_PATH
            value: /shared-model-cache/moonshotai/Kimi-K3.1-Pro
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.7.0-kimi-k3.1-pro-dev.1
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            limits:
              nvidia.com/gpu: '4'
            requests:
              cpu: '72'
              ephemeral-storage: 64Gi
              memory: 512Gi
              nvidia.com/gpu: '4'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
          - mountPath: /shared-model-cache
            name: shared-model-cache
            readOnly: true
        terminationGracePeriodSeconds: 60
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
            readOnly: true
    replicas: 1
    runtimeVersionOverride: 1.7.0
    sharedMemorySize: 64Gi
    type: prefill
  - multinode:
      nodeCount: 2
    name: DecodeWorker
    podTemplate:
      spec:
        containers:
        - args:
          - |
            set -euo pipefail
            ulimit -l unlimited
            ulimit -n 1048576

            # Model-card staging required by this image's registration shim (kimi_k31 -> kimi_k3 tokenizer mapping)
            STAGE=/tmp/kimi-k3-1-model-card; mkdir -p "$STAGE"
            for f in "$MODEL_PATH"/* "$MODEL_PATH"/.[!.]*; do n=$(basename "$f"); [ -f "$f" ] || continue
              case "$n" in config.json|*.safetensors|*.safetensors.index.json) continue;; esac
              ln -sfn "$f" "$STAGE/$n"; done
            STAGE="$STAGE" python3 -c 'import json,os; c=json.load(open(os.environ["MODEL_PATH"]+"/config.json")); c["model_type"]="kimi_k3"; json.dump(c, open(os.environ["STAGE"]+"/config.json","w"))'
            ls "$STAGE" | wc -l

            exec python3 -m dynamo.sglang \
              --model-path "${MODEL_PATH}" \
              --served-model-name moonshotai/Kimi-K3.1-Pro \
              --tensor-parallel-size 8 \
              --disaggregation-mode decode \
              --disaggregation-transfer-backend nixl \
              --disaggregation-bootstrap-port 30001 \
              --host 0.0.0.0 \
              --trust-remote-code \
              --dyn-reasoning-parser kimi_k3 \
              --dyn-structural-tag '{"reasoning_boundary":"backend"}' \
              --dyn-tool-call-parser kimi_k3 \
              --kv-cache-dtype fp8_e4m3 \
              --mem-fraction-static 0.88 \
              --chunked-prefill-size 16384 \
              --page-size 64 \
              --max-running-requests 32 \
              --mamba-radix-cache-strategy extra_buffer \
              --mamba-track-interval 256 \
              --enable-cache-report \
              --enable-metrics \
              --watchdog-timeout 3600 \
              --weight-loader-disable-mmap \
              --model-loader-extra-config '{"enable_multithread_load":true,"num_threads":4}'
          command:
          - /bin/bash
          - -lc
          env:
          - name: HOME
            value: /tmp/k31-home
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: SGLANG_CUSTOM_ALL_REDUCE_V2_MAX_SIZE_KB
            value: '32768'
          - name: SGLANG_UNBALANCED_MODEL_LOADING_TIMEOUT_S
            value: '3600'
          - name: MC_FORCE_MNNVL
            value: '1'
          - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
            value: UCX
          - name: SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE
            value: '100000'
          - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
            value: '100000'
          - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
            value: '100000'
          - name: UCX_TLS
            value: cuda_copy,cuda_ipc,tcp
          - name: UCX_CUDA_IPC_ENABLE_MNNVL
            value: 'y'
          - name: UCX_MEMTYPE_CACHE
            value: 'n'
          - name: PYTORCH_ALLOC_CONF
            value: expandable_segments:False
          - name: SGLANG_DECODE_BOOTSTRAP_TIMEOUT
            value: '1000'
          - name: SGLANG_HACK_SEQ_BOOTSTRAP_ROOM
            value: '1'
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: DYN_SELF_HOST_METADATA
            value: '1'
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: ETCD_LEASE_TTL
            value: '120'
          - name: NCCL_CUMEM_ENABLE
            value: '1'
          - name: NCCL_MNNVL_ENABLE
            value: '1'
          - name: NCCL_NVLS_ENABLE
            value: '1'
          - name: NCCL_P2P_LEVEL
            value: NVL
          - name: MODEL_PATH
            value: /shared-model-cache/moonshotai/Kimi-K3.1-Pro
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.7.0-kimi-k3.1-pro-dev.1
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            limits:
              nvidia.com/gpu: '4'
            requests:
              cpu: '72'
              ephemeral-storage: 64Gi
              memory: 512Gi
              nvidia.com/gpu: '4'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
          - mountPath: /shared-model-cache
            name: shared-model-cache
            readOnly: true
        terminationGracePeriodSeconds: 60
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
            readOnly: true
    replicas: 1
    runtimeVersionOverride: 1.7.0
    sharedMemorySize: 64Gi
    type: decode
