# Enables image/video input on the prefill and decode workers (text-only is the default, measured recipe).
- op: test
  path: /spec/components/1/name
  value: prefill
- op: test
  path: /spec/components/1/type
  value: prefill
- op: replace
  path: /spec/components/1/podTemplate/spec/containers/0/args/0
  value: |
      set -euo pipefail
      ulimit -l unlimited
      ulimit -n 1048576

      exec python3 -m dynamo.vllm \
        --reasoning-parser kimi_k3 \
        --model "${MODEL_PATH}" \
        --served-model-name moonshotai/Kimi-K3.1-Pro \
        --tensor-parallel-size 8 \
        --distributed-executor-backend mp \
        --attention-backend FLASHMLA_SPARSE \
        --trust-remote-code \
        --enable-multimodal \
        --enable-logging-iteration-details \
        --gpu-memory-utilization 0.92 \
        --load-format fastsafetensors \
        --no-enable-flashinfer-autotune \
        --skip-mm-profiling \
        --disaggregation-mode prefill \
        --dyn-reasoning-parser kimi_k3 \
        --dyn-tool-call-parser kimi_k3 \
        --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}' \
        --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
- op: test
  path: /spec/components/2/name
  value: decode
- op: test
  path: /spec/components/2/type
  value: decode
- op: replace
  path: /spec/components/2/podTemplate/spec/containers/0/args/0
  value: |
      set -euo pipefail
      ulimit -l unlimited
      ulimit -n 1048576

      exec python3 -m dynamo.vllm \
        --reasoning-parser kimi_k3 \
        --model "${MODEL_PATH}" \
        --served-model-name moonshotai/Kimi-K3.1-Pro \
        --tensor-parallel-size 8 \
        --distributed-executor-backend mp \
        --attention-backend FLASHMLA_SPARSE \
        --trust-remote-code \
        --enable-multimodal \
        --enable-logging-iteration-details \
        --additional-config '{"decode_backend":"latency_specialized"}' \
        --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","max_cudagraph_capture_size":1024,"cudagraph_capture_sizes":[1,2,4,8,12,16,20,24,32,48,64,96,128,192,256,512,1024]}' \
        --gpu-memory-utilization 0.92 \
        --load-format fastsafetensors \
        --no-enable-flashinfer-autotune \
        --skip-mm-profiling \
        --disaggregation-mode decode \
        --dyn-reasoning-parser kimi_k3 \
        --dyn-tool-call-parser kimi_k3 \
        --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}' \
        --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
