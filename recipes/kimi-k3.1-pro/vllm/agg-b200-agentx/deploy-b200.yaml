  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - args:
          - --dyn-chat-processor
          - dynamo
          - --router-kv-events
          - --router-min-initial-workers
          - "1"
          - --tokenizer
          - fastokens
          - --no-tokenizer-fallback
          - --model-name
          - moonshotai/Kimi-K3.1-Pro
          - --trust-remote-code
          - --http-port
          - "8000"
          - --router-session-affinity-mode
          - hard
          command:
          - python3
          - -m
          - dynamo.frontend
          env:
          - name: FASTOKENS_BPE_THREADS
            value: "16"
          - name: DYN_ROUTER_SESSION_AFFINITY_TTL_SECS
            value: "7200"
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: TRANSFORMERS_OFFLINE
            value: "1"
          - name: DYN_ROUTER_MODE
            value: kv
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.7.0-kimi-k3.1-pro-dev.1@sha256:d288a996e86281e181b57bbf6de07206f7a7003a26f661684d41185cf1bb3db7
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            requests:
              cpu: "16"
              memory: 128Gi
    replicas: 1
    type: frontend
  - multinode:
      nodeCount: 2
    name: Worker
    podTemplate:
      metadata:
        annotations:
          nvidia.com/vllm-distributed-executor-backend: mp
      spec:
        containers:
        - args:
          - --reasoning-parser
