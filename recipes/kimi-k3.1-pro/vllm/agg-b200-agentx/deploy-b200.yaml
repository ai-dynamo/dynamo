          - --dyn-tool-call-parser
          - kimi_k3
          - --dyn-reasoning-parser
          - kimi_k3
          - --dyn-enable-structural-tag
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20081","enable_kv_cache_events":true}'
          - --load-format
          - $(LOAD_FORMAT)
          - --attention-backend
          - FLASHMLA_SPARSE
          - --mamba-ssm-cache-dtype
          - bfloat16
          - --decode-context-parallel-size
          - "8"
          - --block-size
          - "1024"
          - --cp-kv-cache-interleave-size
          - "1"
          - --enable-cumem-allocator
          - --dcp-comm-backend
          - a2a
          - --enable-expert-parallel
          - --moe-backend
          - auto
          - --quantization-config
          - '{"moe":{"activation":"mxfp8"}}'
          - --speculative-config
          - $(SPECULATIVE_CONFIG)
          - --no-numa-bind
          - --prefix-match-unit
          - "64"
          command:
          - python3
          - -m
          - dynamo.vllm
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: COMPILATION_CONFIG
