          - name: HF_HUB_OFFLINE
            value: "1"
          - name: TRANSFORMERS_OFFLINE
            value: "1"
          - name: DYN_SELF_HOST_METADATA
            value: "1"
          - name: VLLM_USE_NCCL_SYMM_MEM
            value: "0"
          - name: VLLM_ALLREDUCE_USE_SYMM_MEM
            value: "0"
          - name: VLLM_ALLREDUCE_USE_FLASHINFER
            value: "0"
          - name: NCCL_MNNVL_ENABLE
            value: "0"
          - name: NCCL_NVLS_ENABLE
            value: "0"
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: ETCD_LEASE_TTL
            value: "120"
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: "7200"
          - name: VLLM_RPC_TIMEOUT
            value: "600000"
          - name: VLLM_DEEP_GEMM_WARMUP
            value: skip
          - name: PYTORCH_ALLOC_CONF
            value: expandable_segments:True
          - name: VLLM_USE_V2_MODEL_RUNNER
            value: "1"
          - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
            value: "1800"
          - name: TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC
            value: "1800"
          - name: NCCL_TIMEOUT
            value: "1800"
          - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
            value: "900"
          - name: MODEL_NAME
            value: moonshotai/Kimi-K3.1-Pro
          - name: LOAD_FORMAT
            value: fastsafetensors
          - name: DRAFT_MODEL_NAME
            value: Inferact/Kimi-K3-DSpark
          # Benchmark-only alternative; keep natural acceptance for serving.
          # - name: SPECULATIVE_CONFIG
          #   value: '{"method":"dspark","model":"$(DRAFT_MODEL_NAME)","num_speculative_tokens":7,"draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":3.84,"draft_load_config":{"load_format":"safetensors"}}'
          - name: SPECULATIVE_CONFIG
            value: '{"method":"dspark","model":"$(DRAFT_MODEL_NAME)","num_speculative_tokens":7,"draft_sample_method":"probabilistic","rejection_sample_method":"standard","draft_load_config":{"load_format":"safetensors"}}'
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.7.0-kimi-k3.1-pro-dev.1@sha256:d288a996e86281e181b57bbf6de07206f7a7003a26f661684d41185cf1bb3db7
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            limits:
              nvidia.com/gpu: "8"
            requests:
              cpu: "16"
              ephemeral-storage: 64Gi
              # Above the default; matches the validated benchmark configuration.
              memory: 700Gi
              nvidia.com/gpu: "8"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
          - mountPath: /shared-model-cache
            name: shared-model-cache
        terminationGracePeriodSeconds: 60
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
    replicas: 1
    sharedMemorySize: 64Gi
    type: worker
