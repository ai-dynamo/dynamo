          - --model
          - $(MODEL_NAME)
          - --served-model-name
          - moonshotai/Kimi-K3.1-Pro
          - --trust-remote-code
          - --tensor-parallel-size
          - "8"
          - --pipeline-parallel-size
          - "2"
          - --nnodes
          - "2"
          - --distributed-executor-backend
          - mp
          - --distributed-timeout-seconds
          - "7200"
          - --cpu-distributed-timeout-seconds
          - "7200"
          - --disable-custom-all-reduce
          - --compilation-config
          - $(COMPILATION_CONFIG)
          - --stream-interval
