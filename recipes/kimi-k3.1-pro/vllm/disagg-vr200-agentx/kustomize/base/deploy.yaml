---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: kimi-k3-1-pro-vllm-vr200-disagg-agentic-compute-domain
spec:
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: kimi-k3-1-pro-vllm-vr200-disagg-agentic-compute-domain-channel
  numNodes: 0
