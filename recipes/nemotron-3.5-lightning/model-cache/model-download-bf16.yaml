#
# Downloads the BF16 base model and optional draft models into the default
# Hugging Face cache layout used by the BF16 recipe manifests (HF_HOME=/model-cache).
apiVersion: batch/v1
kind: Job
metadata:
  name: model-download-bf16
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: model-download-bf16
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: your-image-pull-secret
      containers:
        - name: model-download-bf16
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0-nemotron-3.5-lightning-dev.1
          command: ["python3", "-c"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: hf-token-secret
          env:
            - name: BASE_MODEL
              value: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
            - name: DFLASH_MODEL
              value: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16-DFlash
            - name: DSPARK_MODEL
              value: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16-DSpark
            - name: HF_HOME
              value: /model-cache
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          args:
            - |
              import os
              from pathlib import Path
              from huggingface_hub import snapshot_download

              for env_name in ("BASE_MODEL", "DFLASH_MODEL", "DSPARK_MODEL"):
                  repo_id = os.environ[env_name]
                  print(f"Downloading {repo_id}", flush=True)
                  snapshot_download(repo_id=repo_id)

              for path in Path("/model-cache/hub").glob("*/snapshots"):
                  print(path)
          volumeMounts:
            - name: shared-model-cache
              mountPath: /model-cache
      volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
