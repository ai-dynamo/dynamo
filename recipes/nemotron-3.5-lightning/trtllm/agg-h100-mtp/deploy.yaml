# Experimental aggregated TRT-LLM MTP deployment for Nemotron 3.5 Lightning NVFP4 on 1x H100.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trtllm-agg-h100-mtp-config
data:
  agg.yaml: |
    backend: pytorch
    tensor_parallel_size: 1
    max_batch_size: 512
    max_num_tokens: 32768
    enable_chunked_prefill: true
    trust_remote_code: true
    stream_interval: 10
    kv_cache_config:
      dtype: fp8
    moe_config:
      backend: CUTLASS
    # specdec_synthetic_acceptance_length: 3.687
    speculative_config:
      decoding_type: MTP
      max_draft_len: 7
      mtp_eagle_one_model: true
      speculative_model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: trtllm-agg-h100-mtp
  labels:
    app.kubernetes.io/name: trtllm-agg-h100-mtp
    app.kubernetes.io/part-of: dynamo
spec:
  backendFramework: trtllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          imagePullSecrets:
            - name: your-image-pull-secret
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.5.0-nemotron-3.5-lightning-dev.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.frontend
                - --router-mode
                - round-robin
                - --http-port
                - "8000"
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: DYN_HTTP_BODY_LIMIT_MB
                  value: "200"
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
              resources: {}
              startupProbe:
                httpGet:
                  path: /health
                  port: 8000
                periodSeconds: 10
                timeoutSeconds: 60
                failureThreshold: 60
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /model-cache
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache

    - name: agg
      type: worker
      replicas: 1
      sharedMemorySize: 40Gi
      podTemplate:
        spec:
          imagePullSecrets:
            - name: your-image-pull-secret
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.product
                        operator: In
                        values:
                          - NVIDIA-H100-80GB-HBM3
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.5.0-nemotron-3.5-lightning-dev.1
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/
              command:
                - python3
              args:
                - -m
                - dynamo.trtllm
                - --model
                - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
                - --served-model-name
                - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
                - --tensor-parallel-size
                - "1"
                - --max-num-tokens
                - "32768"
                - --max-batch-size
                - "512"
                - --extra-engine-args
                - /config/agg.yaml
                - --disaggregation-mode
                - agg
                - --dyn-tool-call-parser
                - nemotron_nano
                - --dyn-reasoning-parser
                - nemotron_nano
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: TRITON_CACHE_DIR
                  value: /tmp/.triton-cache
                - name: NCCL_IB_DISABLE
                  value: "1"
                - name: PYTHONHASHSEED
                  value: "0"
                # Benchmark-only synthetic acceptance length for max_draft_len=7.
                # - name: TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS
                #   value: "3.687"
                - name: TLLM_LOG_LEVEL
                  value: INFO
                - name: TLLM_BATCHED_GEMM_LOG_REJECTION
                  value: "1"
                - name: TRTLLM_ENABLE_PDL
                  value: "1"
                - name: TRTLLM_SERVER_DISABLE_GC
                  value: "1"
                - name: TRTLLM_WORKER_DISABLE_GC
                  value: "1"
              resources:
                requests:
                  memory: 128Gi
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
              securityContext:
                runAsUser: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_RESOURCE
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 30
                timeoutSeconds: 20
                failureThreshold: 120
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /model-cache
                - name: dshm
                  mountPath: /dev/shm
                - name: trtllm-config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 40Gi
            - name: trtllm-config
              configMap:
                name: trtllm-agg-h100-mtp-config
