# End-to-end smoke test using one synthetic video generated with FFmpeg.
apiVersion: v1
kind: Service
metadata:
  name: cosmos3-nano-reasoner-smoke-video
  labels:
    app.kubernetes.io/name: cosmos3-nano-reasoner
    app.kubernetes.io/component: smoke-test
spec:
  selector:
    app.kubernetes.io/name: cosmos3-nano-reasoner
    app.kubernetes.io/component: smoke-test
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cosmos3-nano-reasoner-smoke
  labels:
    app.kubernetes.io/name: cosmos3-nano-reasoner
    app.kubernetes.io/component: smoke-test
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cosmos3-nano-reasoner
        app.kubernetes.io/component: smoke-test
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: python:3.12-slim@sha256:ec948fa5f90f4f8907e89f4800cfd2d2e91e391a4bce4a6afa77ba265bc3a2fe
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ffmpeg
              apt-get clean

              mkdir -p "/video/$(dirname "$VIDEO_PATH")"
              ffmpeg -hide_banner -loglevel error -y -f lavfi \
                -i "life=s=640x640:r=2:seed=0:ratio=0.3:mold=10:life_color=#4caf50:death_color=#202020:mold_color=#e0a030" \
                -t 30 -c:v libx264 -b:v 1200k -maxrate 1200k -bufsize 2400k \
                -pix_fmt yuv420p -movflags +faststart "/video/$VIDEO_PATH"
              echo "Generated smoke-test video /video/$VIDEO_PATH"

              python3 -m http.server 8080 --bind 0.0.0.0 --directory /video &
              video_server_pid=$!
              cleanup() { kill "$video_server_pid" 2>/dev/null || true; }
              trap cleanup EXIT

              python3 - <<'PY'
              import json
              import os
              import time
              import urllib.request
              from pathlib import Path

              endpoint = f"http://{os.environ['ENDPOINT']}"
              video_url = (
                  f"http://{os.environ['VIDEO_SERVICE']}:8080/"
                  f"{os.environ['VIDEO_PATH']}"
              )

              for _ in range(120):
                  try:
                      head = urllib.request.Request(video_url, method="HEAD")
                      with urllib.request.urlopen(head, timeout=5):
                          break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit("In-cluster video Service did not become ready")

              for _ in range(180):
                  try:
                      with urllib.request.urlopen(f"{endpoint}/v1/models", timeout=5):
                          break
                  except Exception:
                      time.sleep(5)
              else:
                  raise SystemExit("Frontend did not become ready")

              payload = {
                  "model": os.environ["TARGET_MODEL"],
                  "messages": [{
                      "role": "user",
                      "content": [
                          {
                              "type": "text",
                              "text": "Describe the main actions and events in this video.",
                          },
                          {
                              "type": "video_url",
                              "video_url": {"url": video_url},
                          },
                      ],
                  }],
                  "stream": False,
                  "max_tokens": 32,
                  "temperature": 0,
              }
              headers = {"Content-Type": "application/json"}
              if os.environ["SESSION_AFFINITY"] == "1":
                  headers["X-Dynamo-Session-ID"] = (
                      f"{os.environ['DATASET_SUBDIR']}:"
                      f"{Path(os.environ['VIDEO_PATH']).name}"
                  )
              request = urllib.request.Request(
                  f"{endpoint}/v1/chat/completions",
                  data=json.dumps(payload).encode(),
                  headers=headers,
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=600) as response:
                  result = json.load(response)

              choices = result.get("choices", [])
              content = choices[0].get("message", {}).get("content") if choices else None
              if not content:
                  raise SystemExit(f"Completion was empty: {json.dumps(result)}")
              print(
                  f"Smoke test passed ({os.environ['BENCHMARK_VARIANT']}). "
                  f"Completion: {content}"
              )
              PY
          envFrom:
            - configMapRef:
                name: cosmos3-nano-reasoner-perf-profile
          env:
            - name: TARGET_MODEL
              value: nvidia/cosmos3-nano-reasoner
            - name: VIDEO_SERVICE
              value: cosmos3-nano-reasoner-smoke-video
            - name: DATASET_SUBDIR
              value: synthetic-2fps-30s
            - name: VIDEO_PATH
              value: synthetic-2fps-30s/vid-0000.mp4
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
