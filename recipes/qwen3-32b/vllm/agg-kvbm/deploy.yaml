apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: agg-kvbm-qwen3-32b
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          command:
          - python3
          - -m
          - dynamo.frontend
          workingDir: /workspace
          env:
          - name: HF_HOME
            value: /home/dynamo/.cache/huggingface
  - name: worker
    type: worker
    replicas: 1
    compilationCache:
      pvcName: compilation-cache
      mountPath: /home/dynamo/.cache/vllm
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model
          - Qwen/Qwen3-32B
          - --kv-transfer-config
          - '{"kv_connector":"DynamoConnector","kv_role":"kv_both","kv_connector_module_path":"kvbm.vllm_integration.connector"}'
          workingDir: /workspace
          env:
          - name: DYN_HEALTH_CHECK_ENABLED
            value: "false"
          - name: HF_HOME
            value: /home/dynamo/.cache/huggingface
          # NOTE: change this to tune the CPU cache size for your system
          - name: DYN_KVBM_CPU_CACHE_GB
            value: "100"
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            requests:
              memory: "150Gi"
              nvidia.com/gpu: "1"
            limits:
              memory: "200Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: model-cache
            mountPath: /home/dynamo/.cache/huggingface
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
