apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: agg-8xtp2
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          command:
          - python3
          - -m
          - dynamo.frontend
          workingDir: /workspace
          env:
          - name: HF_HOME
            value: /home/dynamo/.cache/huggingface
          resources:
            requests:
              cpu: "8"
            limits:
              cpu: "8"
  - name: worker
    type: decode
    replicas: 8
    compilationCache:
      pvcName: compilation-cache
      mountPath: /home/dynamo/.cache/vllm
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model
          - Qwen/Qwen3-32B
          - --tensor-parallel-size
          - '2'
          - --no-enable-log-requests
          - --gpu-memory-utilization
          - '0.90'
          - --async-scheduling
          - --block-size
          - '64'
          - --hf-overrides
          - '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768},"max_position_embeddings":131072}'
          - --max-model-len
          - '131072'
          workingDir: /workspace
          env:
          - name: DYN_HEALTH_CHECK_ENABLED
            value: "false"
          - name: HF_HOME
            value: /home/dynamo/.cache/huggingface
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            requests:
              nvidia.com/gpu: '2'
            limits:
              nvidia.com/gpu: '2'
              rdma/ib: "2"
          volumeMounts:
          - name: model-cache
            mountPath: /home/dynamo/.cache/huggingface
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
