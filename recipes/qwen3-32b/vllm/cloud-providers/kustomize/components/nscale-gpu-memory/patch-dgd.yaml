apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: q32b-1p1d-cloud-provider
spec:
  components:
  - name: DecodeWorker
    podTemplate:
      spec:
        containers:
        - name: main
          env: &nscaleEnvironment
          - name: GPU_MEMORY_UTILIZATION
            value: "0.70"
  - name: PrefillWorker
    podTemplate:
      spec:
        containers:
        - name: main
          env: *nscaleEnvironment
