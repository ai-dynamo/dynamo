apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: q32b-1p1d-cloud-provider
spec:
  components:
  - name: DecodeWorker
    podTemplate:
      spec:
        containers:
        - name: main
          image: &vllmEfaImage nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.1.1-efa-amd64
  - name: PrefillWorker
    podTemplate:
      spec:
        containers:
        - name: main
          image: *vllmEfaImage
