apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: q32b-a4-rdma-4
spec:
  spec:
    devices:
      requests:
        - name: rdma
          exactly:
            deviceClassName: mrdma.google.com
            allocationMode: ExactCount
            # Each worker uses four of the A4 node's eight GPU-aligned RDMA NICs.
            count: 4
