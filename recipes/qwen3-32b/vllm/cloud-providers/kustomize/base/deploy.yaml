# Qwen3-32B BF16 disagg, 1 prefill + 1 decode, with provider-specific RDMA in overlays.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: q32b-1p1d-cloud-provider
spec:
  components:
  - name: DecodeWorker
    type: decode
    replicas: 1
    podTemplate:
      metadata:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "19090"
          prometheus.io/path: /metrics
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.1.1
          command:
          - /bin/sh
          - -lc
          args:
          - |
            exec python3 -m dynamo.vllm \
              --model "${MODEL_NAME}" \
              --served-model-name "${SERVED_MODEL_NAME}" \
              --disaggregation-mode decode \
              --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
              --tensor-parallel-size "${TENSOR_PARALLEL_SIZE}" \
              --no-enable-log-requests \
              --gpu-memory-utilization "${GPU_MEMORY_UTILIZATION}" \
              --no-enable-prefix-caching \
              --async-scheduling \
              --block-size "${BLOCK_SIZE}" \
              --hf-overrides "${HF_OVERRIDES}" \
              --max-model-len "${MAX_MODEL_LEN}"
          workingDir: /workspace
          env:
          - name: MODEL_NAME
            value: Qwen/Qwen3-32B
          - name: SERVED_MODEL_NAME
            value: Qwen/Qwen3-32B
          - name: KV_TRANSFER_CONFIG
            value: '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"backends":["UCX"]}}'
          - name: TENSOR_PARALLEL_SIZE
            value: "4"
          - name: GPU_MEMORY_UTILIZATION
            value: "0.90"
          - name: BLOCK_SIZE
            value: "64"
          - name: HF_OVERRIDES
            value: '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768},"max_position_embeddings":131072}'
          - name: MAX_MODEL_LEN
            value: "131072"
          - name: DYN_HEALTH_CHECK_ENABLED
            value: "false"
          - name: HF_HOME
            value: /model-cache
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            requests:
              nvidia.com/gpu: "4"
              ephemeral-storage: 2Gi
            limits:
              nvidia.com/gpu: "4"
          volumeMounts:
          - name: model-cache
            mountPath: /model-cache
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.1.1
          workingDir: /workspace
          securityContext:
            runAsUser: 0
          env:
          - name: HF_HOME
            value: /model-cache
          resources:
            requests:
              cpu: "4"
            limits:
              cpu: "8"
          volumeMounts:
          - name: model-cache
            mountPath: /model-cache
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
  # Provider Components target backend-neutral worker service keys.
  - name: PrefillWorker
    type: prefill
    replicas: 1
    podTemplate:
      metadata:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "19090"
          prometheus.io/path: /metrics
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.1.1
          command:
          - /bin/sh
          - -lc
          args:
          - |
            exec python3 -m dynamo.vllm \
              --model "${MODEL_NAME}" \
              --served-model-name "${SERVED_MODEL_NAME}" \
              --disaggregation-mode prefill \
              --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
              --tensor-parallel-size "${TENSOR_PARALLEL_SIZE}" \
              --no-enable-log-requests \
              --gpu-memory-utilization "${GPU_MEMORY_UTILIZATION}" \
              --async-scheduling \
              --block-size "${BLOCK_SIZE}" \
              --hf-overrides "${HF_OVERRIDES}" \
              --max-model-len "${MAX_MODEL_LEN}"
          workingDir: /workspace
          env:
          - name: MODEL_NAME
            value: Qwen/Qwen3-32B
          - name: SERVED_MODEL_NAME
            value: Qwen/Qwen3-32B
          - name: KV_TRANSFER_CONFIG
            value: '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_connector_extra_config":{"backends":["UCX"]}}'
          - name: TENSOR_PARALLEL_SIZE
            value: "4"
          - name: GPU_MEMORY_UTILIZATION
            value: "0.90"
          - name: BLOCK_SIZE
            value: "64"
          - name: HF_OVERRIDES
            value: '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768},"max_position_embeddings":131072}'
          - name: MAX_MODEL_LEN
            value: "131072"
          - name: DYN_HEALTH_CHECK_ENABLED
            value: "false"
          - name: HF_HOME
            value: /model-cache
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            requests:
              nvidia.com/gpu: "4"
              ephemeral-storage: 2Gi
            limits:
              nvidia.com/gpu: "4"
          volumeMounts:
          - name: model-cache
            mountPath: /model-cache
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache

