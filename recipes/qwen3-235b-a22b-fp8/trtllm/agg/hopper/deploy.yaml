apiVersion: v1
kind: ConfigMap
metadata:
  name: agg-config
data:
  agg.yaml: |
    backend: pytorch
    trust_remote_code: true
    tensor_parallel_size: 4
    moe_expert_parallel_size: 4
    moe_tensor_parallel_size: 1
    enable_attention_dp: false
    enable_chunked_prefill: true
    kv_cache_config:
      enable_block_reuse: true
      free_gpu_memory_fraction: 0.8
      dtype: auto
    cache_transceiver_config:
      backend: DEFAULT
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 128
    disable_overlap_scheduler: false
    print_iter_log: false
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-235b-a22b-agg
spec:
  backendFramework: trtllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
          command:
          - /bin/sh
          - -c
          args:
          - python3 -m dynamo.frontend --router-mode kv --http-port 8000
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                - key: nvidia.com/dynamo-graph-deployment-name
                  operator: In
                  values:
                  - qwen3-235b-a22b-agg-frontend
              topologyKey: kubernetes.io/hostname
  - name: TrtllmWorker
    type: worker
    replicas: 4
    sharedMemorySize: 256Gi
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
          command:
          - /bin/sh
          - -c
          args:
          - |
            python3 -m dynamo.trtllm \
            --model-path "${MODEL_PATH}" \
            --served-model-name "Qwen/Qwen3-235B-A22B-FP8" \
            --max-batch-size 128 \
            --max-num-tokens 8192 \
            --max-seq-len 8192 \
            --extra-engine-args "${ENGINE_ARGS}"
          workingDir: /workspace/components/backends/trtllm
          env:
          - name: MODEL_PATH
            value: Qwen/Qwen3-235B-A22B-FP8
          - name: HF_HOME
            value: /mnt/model-cache
          - name: ENGINE_ARGS
            value: /engine_configs/agg.yaml
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            requests:
              nvidia.com/gpu: "4"
            limits:
              nvidia.com/gpu: "4"
          volumeMounts:
          - name: agg-config
            mountPath: /engine_configs
          - name: model-cache
            mountPath: /mnt/model-cache
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: nvidia.com/gpu.present
                  operator: In
                  values:
                  - "true"
        volumes:
        - name: agg-config
          configMap:
            name: agg-config
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
