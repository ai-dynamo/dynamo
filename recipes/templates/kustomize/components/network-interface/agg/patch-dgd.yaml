- op: test
  path: /spec/components/1/name
  value: Worker
- op: test
  path: /spec/components/1/type
  value: worker
- op: test
  path: /spec/components/1/podTemplate/spec/containers/0/name
  value: main
- op: add
  path: /spec/components/1/podTemplate/spec/containers/0/env/-
  value:
    name: NCCL_SOCKET_IFNAME
    value: "your-worker-socket-interface"
- op: add
  path: /spec/components/1/podTemplate/spec/containers/0/env/-
  value:
    name: GLOO_SOCKET_IFNAME
    value: "your-worker-socket-interface"
- op: add
  path: "/spec/components/1/podTemplate/spec/containers/0/resources/requests/your-rdma.example.com~1device"
  value: "your-worker-rdma-resource-count"
- op: add
  path: "/spec/components/1/podTemplate/spec/containers/0/resources/limits/your-rdma.example.com~1device"
  value: "your-worker-rdma-resource-count"
