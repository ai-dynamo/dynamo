- op: test
  path: /spec/components/0/name
  value: Frontend
- op: test
  path: /spec/components/0/type
  value: frontend
- op: test
  path: /spec/components/0/podTemplate/spec/containers/0/name
  value: main
- op: add
  path: /spec/components/0/podTemplate/spec/nodeSelector
  value:
    "your-node-pool-label": "your-frontend-node-pool"
- op: add
  path: /spec/components/0/podTemplate/spec/tolerations
  value:
    - key: "your-frontend-taint-key"
      operator: Equal
      value: "your-frontend-taint-value"
      effect: NoSchedule
- op: add
  path: /spec/components/0/podTemplate/spec/affinity
  value:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: "your-node-pool-label"
                operator: In
                values:
                  - "your-frontend-node-pool"
- op: add
  path: /spec/components/0/podTemplate/spec/schedulerName
  value: "your-scheduler-name"
- op: add
  path: /spec/components/0/podTemplate/spec/runtimeClassName
  value: "your-runtime-class-name"
- op: add
  path: /spec/components/0/podTemplate/spec/priorityClassName
  value: "your-priority-class-name"
- op: test
  path: /spec/components/1/name
  value: Worker
- op: test
  path: /spec/components/1/type
  value: worker
- op: test
  path: /spec/components/1/podTemplate/spec/containers/0/name
  value: main
- op: add
  path: /spec/components/1/podTemplate/spec/nodeSelector
  value:
    "your-node-pool-label": "your-worker-node-pool"
- op: add
  path: /spec/components/1/podTemplate/spec/tolerations
  value:
    - key: "your-worker-taint-key"
      operator: Equal
      value: "your-worker-taint-value"
      effect: NoSchedule
- op: add
  path: /spec/components/1/podTemplate/spec/affinity
  value:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: "your-node-pool-label"
                operator: In
                values:
                  - "your-worker-node-pool"
- op: add
  path: /spec/components/1/podTemplate/spec/schedulerName
  value: "your-scheduler-name"
- op: add
  path: /spec/components/1/podTemplate/spec/runtimeClassName
  value: "your-runtime-class-name"
- op: add
  path: /spec/components/1/podTemplate/spec/priorityClassName
  value: "your-priority-class-name"
