apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  # The root patch target selects the DGD by group, version, and kind. Kustomize
  # ignores this name; it exists only because a strategic merge patch needs one.
  name: canonical-recipe
spec:
  components:
    - name: Frontend
    - name: PrefillWorker
      podTemplate:
        spec:
          containers:
            - name: main
              env:
                - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
                  value: &sglang-nixl-backend 'your-sglang-nixl-backend'
    - name: DecodeWorker
      podTemplate:
        spec:
          containers:
            - name: main
              env:
                - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
                  value: *sglang-nixl-backend
