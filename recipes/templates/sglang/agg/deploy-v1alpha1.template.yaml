#
# Hugging Face access: online. Workers read credentials from the
# hf-token-secret Secret.
# Edit guide: change the DGD name, model variables, image, replicas, GPU count, and runtime flags.
# External references: model-cache and hf-token-secret are logical references that must stay consistent.
# Optional resources: none; this is a DGD-only example.
# Put scheduling, storage identity, Secret identity, and provider-network settings in Kustomize.
# Compatibility note: requires Dynamo 1.0+ with SGLang 0.5.9 or newer.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: nemotron-super-fp8-sglang-aggregate
spec:
  backendFramework: sglang
  envs:
    - name: HF_HOME
      value: /opt/models
  pvcs:
    - name: model-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
          command: [python3]
          args: [-m, dynamo.frontend, --router-mode, kv, --no-kv-events, --http-port, "8000"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

    Worker:
      componentType: worker
      replicas: 1
      envFromSecret: hf-token-secret
      resources:
        requests:
          gpu: "4"
        limits:
          gpu: "4"
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      sharedMemory:
        size: 16Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
          workingDir: /workspace
          command: [/bin/bash, -lc]
          args:
            - |
              python3 -m dynamo.sglang \
                --model-path "${MODEL_NAME}" \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --tp 4 \
                --trust-remote-code \
                --dyn-tool-call-parser nemotron_nano \
                --dyn-reasoning-parser nemotron_nano
          env:
            - name: MODEL_NAME
              value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
            - name: SERVED_MODEL_NAME
              value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
            - name: HF_HOME
              value: /opt/models
          startupProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 60
