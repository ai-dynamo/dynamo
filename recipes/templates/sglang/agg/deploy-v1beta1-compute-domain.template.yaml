#
# Every component uses offline Hugging Face settings; the Worker consumes the
# pre-populated shared-model-cache.
# Contract:
# - Keep the resource.nvidia.com/v1beta1 ComputeDomain and ConfigMap before the
#   native nvidia.com/v1beta1 DGD. Each component podTemplate contains a
#   runtime container named main.
# - Keep backendFramework sglang aligned with the runtime image and
#   python3 -m dynamo.sglang command.
# - Keep components ordered as Frontend (frontend), then Worker (worker).
# - Keep the ComputeDomain channel, pod resourceClaims, and container
#   resources.claims names synchronized.
# - Keep the ConfigMap name, engine-config volume and mount, --config path,
#   MODEL_NAME, SERVED_MODEL_NAME, and their command arguments synchronized.
# - The Worker uses shared-model-cache as the canonical default PVC, volume,
#   and mount name. The namespace-local PVC must exist with pre-populated data
#   unless a cluster Kustomization replaces the reference; keep all Worker
#   cache references and the /shared-model-cache path synchronized.
# Derived from: recipes/qwen3.8-2.4t-a95b-fp8/sglang/agg-gb300-chat/deploy.yaml.
# Validation status: static catalog validation only; verify DRA allocation,
# admission, readiness, and runtime behavior on the target cluster.
# The source recipe did not size /dev/shm.
# Worker sharedMemorySize is 200Gi for this example. Validate the value for the
# selected model, parallelism, and hardware before deployment.
# Optional ComputeDomain: when removed, also remove the Worker's resourceClaims entry,
# resources.claims entry, and matching resourceClaimTemplateName reference.
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: qwen38-sglang-compute-domain
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: qwen38-sglang-compute-domain-channel
---
# Optional SGLang ConfigMap: when removed, also remove the Worker's engine-config volume,
# matching volume mount, and --config argument; this example has no configMapKeyRef.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen38-sglang-engine-config
data:
  agg.yaml: |-
    trust-remote-code: true
    quantization: fp8
    kv-cache-dtype: fp8_e4m3
    tensor-parallel-size: 16
    expert-parallel-size: 1
    context-length: 262144
    mem-fraction-static: 0.90
    max-running-requests: 256
    speculative-algorithm: NEXTN
    speculative-num-steps: 3
    speculative-eagle-topk: 1
    speculative-num-draft-tokens: 4
    speculative-moe-runner-backend: flashinfer_trtllm
    chunked-prefill-size: 8192
    max-prefill-tokens: 8192
    page-size: 64
    attention-backend: trtllm_mha
    linear-attn-prefill-backend: flashinfer
    linear-attn-decode-backend: flashinfer
    moe-runner-backend: flashinfer_trtllm
    moe-a2a-backend: none
    mamba-ssm-dtype: bfloat16
    flashinfer-allreduce-fusion-backend: mnnvl
    weight-loader-prefetch-checkpoints: true
    weight-loader-prefetch-num-threads: 4
    cuda-graph-backend-decode: full
    disable-decode-cuda-graph: false
    decode-log-interval: 1
    enable-cache-report: true
    enable-metrics: true
    watchdog-timeout: 900
    kv-events-config:
      publisher: zmq
      topic: kv-events
      endpoint: tcp://*:5571
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen38-sglang-aggregate
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.0-qwen-3.8-2.4t-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3]
              args: [-m, dynamo.frontend, --router-mode, kv, --router-kv-events, --http-port, "8000"]
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"

    - name: Worker
      type: worker
      replicas: 1
      multinode:
        nodeCount: 4
      sharedMemorySize: 200Gi
      podTemplate:
        spec:
          resourceClaims:
            - name: compute-domain-channel
              resourceClaimTemplateName: qwen38-sglang-compute-domain-channel
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.0-qwen-3.8-2.4t-dev.1
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              resources:
                requests:
                  nvidia.com/gpu: "4"
                limits:
                  nvidia.com/gpu: "4"
                claims:
                  - name: compute-domain-channel
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                  readOnly: true
                - name: engine-config
                  mountPath: /etc/sglang
                  readOnly: true
              env:
                - name: MODEL_NAME
                  value: Qwen/Qwen3.8-2.4T-A95B-FP8
                - name: SERVED_MODEL_NAME
                  value: Qwen/Qwen3.8-2.4T-A95B-FP8
                - name: DYN_FORWARDPASS_METRIC_PORT
                  value: ""  # Empty disables the forward-pass metric server.
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: NCCL_DEBUG
                  value: WARN
                - name: NCCL_MNNVL_ENABLE
                  value: "1"
                - name: NCCL_CUMEM_ENABLE
                  value: "1"
                - name: SGLANG_FLASHINFER_AUTOTUNE_CACHE
                  value: "1"
                - name: SGLANG_UNBALANCED_MODEL_LOADING_TIMEOUT_S
                  value: "3600"
              command: [python3]
              args:
                - -m
                - dynamo.sglang
                - --config
                - /etc/sglang/agg.yaml
                - --model-path
                - $(MODEL_NAME)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --dyn-reasoning-parser
                - qwen3
                - --dyn-tool-call-parser
                - qwen3_coder
                - --cuda-graph-backend-prefill
                - breakable
                - --cuda-graph-max-bs-prefill
                - "8192"
                - --mamba-radix-cache-strategy
                - extra_buffer
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
            - name: engine-config
              configMap:
                name: qwen38-sglang-engine-config
    # Optional components (type: planner, type: epp) go below this line, after the canonical components above.
