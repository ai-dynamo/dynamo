#
# Hugging Face access: offline. Runtime pods use the pre-populated model cache.
# To enable online access, add hf-token-secret through envFrom.secretRef and
# remove HF_HUB_OFFLINE and TRANSFORMERS_OFFLINE.
# Contract:
# - Use the native nvidia.com/v1beta1 spec.components shape; each component
#   podTemplate contains a runtime container named main.
# - Keep backendFramework sglang aligned with the runtime image and
#   python3 -m dynamo.sglang command.
# - Keep components ordered as Frontend (frontend), then Worker (worker).
# - Keep MODEL_NAME and SERVED_MODEL_NAME synchronized with their command arguments.
# - model-cache is a canonical default Kubernetes object name and patch anchor.
#   The named namespace-local PVC must exist with pre-populated data unless a
#   cluster Kustomization replaces the reference; change all coupled references
#   together. Offline mode requires both offline variables and no hf-token-secret reference.
# Derived from: recipes/inkling/sglang/agg-b200/deploy.yaml.
# Validation status: static catalog validation only; verify admission,
# readiness, and runtime behavior on the target cluster.
# The 60-minute worker startup budget is a template default; validate it for
# the selected model, image, and hardware.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: inkling-sglang-aggregate
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.0-inkling-dev.1
              command: [python3]
              args:
                - -m
                - dynamo.frontend
                - --model-path
                - /model-cache/thinkingmachines/Inkling-NVFP4
                - --model-name
                - thinkingmachines/Inkling-NVFP4
                - --dyn-chat-processor
                - sglang
                - --reasoning-parser
                - inkling
                - --tool-call-parser
                - inkling
                - --trust-remote-code
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                  readOnly: true
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache

    - name: Worker
      type: worker
      replicas: 1
      sharedMemorySize: 512Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.0-inkling-dev.1
              workingDir: /workspace/examples/backends/sglang
              command: [/bin/bash, -lc]
              args:
                - |
                  python3 -m dynamo.sglang \
                    --model-path "${MODEL_NAME}" \
                    --served-model-name "${SERVED_MODEL_NAME}" \
                    --trust-remote-code \
                    --tp 8 \
                    --quantization modelopt_fp4 \
                    --attention-backend fa4 \
                    --page-size 128 \
                    --fp4-gemm-backend flashinfer_trtllm \
                    --moe-runner-backend flashinfer_trtllm_routed \
                    --enable-torch-symm-mem \
                    --mamba-radix-cache-strategy extra_buffer \
                    --mem-fraction-static 0.75 \
                    --swa-full-tokens-ratio 0.1 \
                    --mamba-full-memory-ratio 0.1 \
                    --enable-multimodal \
                    --reasoning-parser inkling \
                    --tool-call-parser inkling \
                    --speculative-algorithm EAGLE \
                    --speculative-num-steps 8 \
                    --speculative-eagle-topk 1 \
                    --speculative-num-draft-tokens 9 \
                    --enable-multi-layer-eagle \
                    --speculative-use-rejection-sampling
              env:
                - name: MODEL_NAME
                  value: /model-cache/thinkingmachines/Inkling-NVFP4
                - name: SERVED_MODEL_NAME
                  value: thinkingmachines/Inkling-NVFP4
                - name: DYN_FORWARDPASS_METRIC_PORT
                  value: ""  # Empty disables the forward-pass metric server.
                - name: SGLANG_ENABLE_UNIFIED_RADIX_TREE
                  value: "1"
                - name: HF_HOME
                  value: /tmp/hf-cache
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                - name: FLASHINFER_DISABLE_VERSION_CHECK
                  value: "1"
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 20
                failureThreshold: 60
              resources:
                requests:
                  cpu: "64"
                  memory: 512Gi
                  ephemeral-storage: 200Gi
                limits:
                  nvidia.com/gpu: "8"
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: flashinfer-cache
                  mountPath: /root/.cache/flashinfer
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: tmp
              emptyDir:
                sizeLimit: 200Gi
            - name: flashinfer-cache
              emptyDir:
                sizeLimit: 32Gi
    # Optional components (type: planner, type: epp) go below this line, after the canonical components above.
