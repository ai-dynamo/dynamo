#
# Every component uses offline Hugging Face settings; the workers consume the
# pre-populated shared-model-cache.
# Contract:
# - Keep the ConfigMap before the native nvidia.com/v1beta1 DGD; each component
#   podTemplate contains a runtime container named main.
# - Keep backendFramework sglang aligned with the runtime image and
#   python3 -m dynamo.sglang command.
# - Keep components ordered as Frontend (frontend), PrefillWorker (prefill),
#   then DecodeWorker (decode).
# - Keep each ConfigMap section, its worker's --config path, MODEL_NAME,
#   SERVED_MODEL_NAME, and the matching command arguments synchronized.
# - SGLANG_DISAGGREGATION_NIXL_BACKEND remains the first worker environment
#   entry; change it on both workers so the transfer pair remains compatible.
# - shared-model-cache is the canonical default PVC, volume, and mount name.
#   The namespace-local PVC must exist with pre-populated data unless a cluster
#   Kustomization replaces the reference; keep all cache references and the
#   /shared-model-cache path synchronized.
# Derived from: recipes/glm-5.2/sglang/disagg-b200-agentic/deploy.yaml.
# Validation status: static catalog validation only; verify admission,
# readiness, and runtime behavior on the target cluster.
# To change the transfer backend, set SGLANG_DISAGGREGATION_NIXL_BACKEND on
# both workers.
# Optional ConfigMap: when removed, also remove both workers' sglang-config volumes,
# matching volume mounts, and --config arguments; this example has no configMapKeyRef.
apiVersion: v1
kind: ConfigMap
metadata:
  name: glm52-sglang-disaggregated-config
data:
  prefill.yaml: |-
    model-path: nvidia/GLM-5.2-NVFP4
    served-model-name: zai-org/GLM-5.2
    host: 0.0.0.0
    trust-remote-code: true
    tensor-parallel-size: 4
    data-parallel-size: 4
    enable-dp-attention: true
    ep-size: 4
    quantization: modelopt_fp4
    kv-cache-dtype: fp8_e4m3
    context-length: 500000
    mem-fraction-static: 0.93
    attention-backend: dsa
    dsa-prefill-backend: trtllm
    dsa-decode-backend: trtllm
    moe-runner-backend: flashinfer_trtllm_routed
    chunked-prefill-size: 16384
    max-prefill-tokens: 32768
    max-running-requests: 32
    watchdog-timeout: 3600
    cuda-graph-backend-prefill: disabled
    cuda-graph-backend-decode: disabled
    disaggregation-mode: prefill
    disaggregation-transfer-backend: nixl
    disaggregation-bootstrap-port: 12345
    speculative-algorithm: EAGLE
    speculative-num-steps: 3
    speculative-eagle-topk: 1
    speculative-num-draft-tokens: 4
    enable-dp-lm-head: true
    hicache-size: 200
    enable-hierarchical-cache: true
    kv-events-config:
      publisher: zmq
      topic: kv-events
      endpoint: tcp://*:5557
    model-loader-extra-config:
      enable_multithread_load: true
      num_threads: 32
    disable-overlap-schedule: true
    enable-metrics: true

  decode.yaml: |-
    model-path: nvidia/GLM-5.2-NVFP4
    served-model-name: zai-org/GLM-5.2
    trust-remote-code: true
    tensor-parallel-size: 8
    data-parallel-size: 8
    enable-dp-attention: true
    moe-a2a-backend: none
    fp4-gemm-backend: flashinfer_cutlass
    enable-symm-mem: true
    quantization: modelopt_fp4
    kv-cache-dtype: fp8_e4m3
    context-length: 500000
    disaggregation-mode: decode
    disaggregation-transfer-backend: nixl
    disaggregation-bootstrap-port: 12345
    speculative-algorithm: EAGLE
    speculative-num-steps: 3
    speculative-eagle-topk: 1
    speculative-num-draft-tokens: 4
    speculative-attention-mode: decode
    max-running-requests: 256
    watchdog-timeout: 3600
    cuda-graph-max-bs: 256
    mem-fraction-static: 0.87
    enable-metrics: true
    speculative-moe-runner-backend: flashinfer_cutlass
    speculative-moe-a2a-backend: none
    num-continuous-decode-steps: 3
    enable-flashinfer-allreduce-fusion: true
    enable-dp-lm-head: true
    model-loader-extra-config:
      enable_multithread_load: true
      num_threads: 32
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: glm52-sglang-disaggregated
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0-glm-5.2-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3]
              args: [-m, dynamo.frontend, --trust-remote-code]
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: DYN_ROUTER_MODE
                  value: kv
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
    - name: PrefillWorker
      type: prefill
      replicas: 3
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0-glm-5.2-dev.1
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/
              command: [python3]
              args:
                - -m
                - dynamo.sglang
                - --model-path
                - $(MODEL_NAME)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --config
                - /etc/sglang/prefill.yaml
                - --dyn-tool-call-parser
                - glm47
                - --dyn-reasoning-parser
                - glm45
                - --reasoning-parser
                - glm45
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              env:
                - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
                  value: UCX
                - name: MODEL_NAME
                  value: nvidia/GLM-5.2-NVFP4
                - name: SERVED_MODEL_NAME
                  value: zai-org/GLM-5.2
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                - name: DYN_SGL_ALLOW_TOP_LOGPROBS
                  value: "1"
                - name: UCX_TLS
                  value: cuda_ipc,cuda_copy,rc
              resources:
                requests:
                  nvidia.com/gpu: "4"
                  memory: 1Ti
                limits:
                  nvidia.com/gpu: "4"
                  memory: 1Ti
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                  readOnly: true
                - name: sglang-config
                  mountPath: /etc/sglang
                  readOnly: true
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
            - name: sglang-config
              configMap:
                name: glm52-sglang-disaggregated-config
    - name: DecodeWorker
      type: decode
      replicas: 1
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0-glm-5.2-dev.1
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/
              command: [python3]
              args:
                - -m
                - dynamo.sglang
                - --model-path
                - $(MODEL_NAME)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --config
                - /etc/sglang/decode.yaml
                - --dyn-tool-call-parser
                - glm47
                - --dyn-reasoning-parser
                - glm45
                - --reasoning-parser
                - glm45
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              env:
                - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
                  value: UCX
                - name: MODEL_NAME
                  value: nvidia/GLM-5.2-NVFP4
                - name: SERVED_MODEL_NAME
                  value: zai-org/GLM-5.2
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                - name: DYN_SGL_ALLOW_TOP_LOGPROBS
                  value: "1"
                - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
                  value: "3600"
                - name: UCX_TLS
                  value: cuda_ipc,cuda_copy,rc
              resources:
                requests:
                  nvidia.com/gpu: "8"
                  memory: 200Gi
                limits:
                  nvidia.com/gpu: "8"
                  memory: 200Gi
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                  readOnly: true
                - name: sglang-config
                  mountPath: /etc/sglang
                  readOnly: true
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
            - name: sglang-config
              configMap:
                name: glm52-sglang-disaggregated-config
    # Optional components (type: planner, type: epp) go below this line, after the canonical components above.
