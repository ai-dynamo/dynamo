#
# Contract:
# - Use the native nvidia.com/v1alpha1 spec.services shape; each service
#   defines its runtime through extraPodSpec.mainContainer.
# - Keep backendFramework sglang aligned with the runtime image and
#   python3 -m dynamo.sglang command.
# - Keep the Frontend (frontend), PrefillWorker (worker/prefill), and
#   DecodeWorker (worker/decode) service keys and roles.
# - Keep MODEL_NAME and SERVED_MODEL_NAME synchronized with their command
#   arguments; keep the prefill/decode modes, bootstrap port, and transfer
#   backend compatible across both workers.
# - shared-model-cache is the canonical default PVC, volume, and mount name.
#   The namespace-local PVC must exist with pre-populated data unless a cluster
#   Kustomization replaces the reference; keep all cache references and the
#   /shared-model-cache path synchronized.
# Derived from: recipes/nemotron-3-super-fp8/sglang/disagg/deploy.yaml.
# Validation status: static catalog validation only; verify admission,
# readiness, and runtime behavior on the target cluster.
# Compatibility note: requires Dynamo 1.0+ with SGLang 0.5.9 or newer.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: nemotron-super-fp8-sglang-disaggregated
spec:
  backendFramework: sglang
  envs:
    - name: HF_HOME
      value: /shared-model-cache
  pvcs:
    - name: shared-model-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      volumeMounts:
        - name: shared-model-cache
          mountPoint: /shared-model-cache
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
          imagePullPolicy: IfNotPresent
          command: [python3]
          args: [-m, dynamo.frontend, --router-mode, kv, --no-router-kv-events, --http-port, "8000"]
    PrefillWorker:
      componentType: worker
      subComponentType: prefill
      replicas: 1
      resources:
        requests:
          gpu: "2"
        limits:
          gpu: "2"
      volumeMounts:
        - name: shared-model-cache
          mountPoint: /shared-model-cache
      sharedMemory:
        size: 16Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command: [python3]
          args:
            - -m
            - dynamo.sglang
            - --model-path
            - $(MODEL_NAME)
            - --served-model-name
            - $(SERVED_MODEL_NAME)
            - --tp
            - "2"
            - --trust-remote-code
            - --disaggregation-mode
            - prefill
            - --disaggregation-bootstrap-port
            - "12345"
            - --disaggregation-transfer-backend
            - nixl
            - --host
            - 0.0.0.0
            - --dyn-tool-call-parser
            - nemotron_nano
            - --dyn-reasoning-parser
            - nemotron_nano
          env:
            - name: MODEL_NAME
              value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
            - name: SERVED_MODEL_NAME
              value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
            - name: HF_HOME
              value: /shared-model-cache
    DecodeWorker:
      componentType: worker
      subComponentType: decode
      replicas: 1
      resources:
        requests:
          gpu: "2"
        limits:
          gpu: "2"
      volumeMounts:
        - name: shared-model-cache
          mountPoint: /shared-model-cache
      sharedMemory:
        size: 16Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command: [python3]
          args:
            - -m
            - dynamo.sglang
            - --model-path
            - $(MODEL_NAME)
            - --served-model-name
            - $(SERVED_MODEL_NAME)
            - --tp
            - "2"
            - --trust-remote-code
            - --disaggregation-mode
            - decode
            - --disaggregation-bootstrap-port
            - "12345"
            - --disaggregation-transfer-backend
            - nixl
            - --host
            - 0.0.0.0
            - --dyn-tool-call-parser
            - nemotron_nano
            - --dyn-reasoning-parser
            - nemotron_nano
          env:
            - name: MODEL_NAME
              value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
            - name: SERVED_MODEL_NAME
              value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
            - name: HF_HOME
              value: /shared-model-cache
