#
# Hugging Face access: online. Workers read credentials from the
# hf-token-secret Secret.
# This template keeps online Hugging Face access as the portable default even
# though the source recipe used a pre-populated local cache in offline mode.
# Contract:
# - Use the native nvidia.com/v1beta1 spec.components shape; each component
#   podTemplate contains a runtime container named main.
# - Keep backendFramework vllm aligned with the runtime image and
#   python3 -m dynamo.vllm command.
# - Keep components ordered as Frontend (frontend), then Worker (worker).
# - Keep MODEL_NAME and SERVED_MODEL_NAME synchronized with their command arguments.
# - model-cache and hf-token-secret are canonical default Kubernetes object
#   names and patch anchors. Each named namespace-local object must exist unless
#   a cluster Kustomization replaces the reference; change all coupled references together.
# Derived from: recipes/deepseek-v4/deepseek-v4-flash/vllm/agg-b200-agentic/deploy.yaml.
# Validation status: static catalog validation only; verify admission,
# readiness, and runtime behavior on the target cluster.
# Worker sharedMemorySize 64Gi and the 60-minute startup budget are template
# defaults; validate both for the selected model, image, and hardware.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: deepseek-v4-flash-vllm-aggregate
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
              workingDir: /workspace
              command: [python3]
              args: [-m, dynamo.frontend, --trust-remote-code]
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
              env:
                - name: DYN_ROUTER_MODE
                  value: kv
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                  readOnly: true
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
    - name: Worker
      type: worker
      replicas: 1
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
              workingDir: /workspace
              command: [/bin/bash, -lc]
              args:
                - |
                  python3 -m dynamo.vllm \
                    --model "${MODEL_NAME}" \
                    --served-model-name "${SERVED_MODEL_NAME}" \
                    --trust-remote-code \
                    --tensor-parallel-size 4 \
                    --kv-cache-dtype fp8 \
                    --block-size 256 \
                    --max-num-seqs 64 \
                    --max-num-batched-tokens 16384 \
                    --no-scheduler-reserve-full-isl \
                    --gpu-memory-utilization 0.92 \
                    --max-model-len 1048576 \
                    --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
                    --attention-config '{"use_fp4_indexer_cache":true}' \
                    --moe-backend flashinfer_trtllm \
                    --tokenizer-mode deepseek_v4 \
                    --dyn-tool-call-parser deepseek_v4 \
                    --dyn-reasoning-parser deepseek_v4
              env:
                - name: MODEL_NAME
                  value: nvidia/DeepSeek-V4-Flash-NVFP4
                - name: SERVED_MODEL_NAME
                  value: nvidia/DeepSeek-V4-Flash-NVFP4
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_CACHE
                  value: /model-cache/hub
              envFrom:
                - secretRef:
                    name: hf-token-secret
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 20
                failureThreshold: 60
              resources:
                requests:
                  nvidia.com/gpu: "4"
                limits:
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                  readOnly: true
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
    # Optional components (type: planner, type: epp) go below this line, after the canonical components above.
