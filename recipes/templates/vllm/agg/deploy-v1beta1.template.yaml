#
# Offline model access: HF_HUB_OFFLINE and TRANSFORMERS_OFFLINE are set to
# "1", so the runtime uses the pre-populated shared-model-cache.
# Contract:
# - Use the native nvidia.com/v1beta1 spec.components shape; each component
#   podTemplate contains a runtime container named main.
# - Keep backendFramework vllm aligned with the runtime image and
#   python3 -m dynamo.vllm command.
# - Keep components ordered as Frontend (frontend), then Worker (worker).
# - Keep MODEL_NAME and SERVED_MODEL_NAME synchronized with their command arguments.
# - shared-model-cache is the canonical default Kubernetes object name and patch
#   anchor. The namespace-local PVC must exist unless a cluster Kustomization
#   replaces the reference; change all coupled references together.
# Derived from: recipes/deepseek-v4/deepseek-v4-flash/vllm/agg-b200-agentic/deploy.yaml.
# Validation status: static catalog validation only; verify admission,
# readiness, and runtime behavior on the target cluster.
# Worker sharedMemorySize 64Gi is a template default; validate it for the
# selected model, image, and hardware.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: deepseek-v4-flash-vllm-aggregate
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
              imagePullPolicy: IfNotPresent
              workingDir: /workspace
              command: [python3]
              args: [-m, dynamo.frontend, --trust-remote-code, --no-router-kv-events]
              env:
                - name: DYN_ROUTER_MODE
                  value: kv
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
    - name: Worker
      type: worker
      replicas: 1
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
              imagePullPolicy: IfNotPresent
              workingDir: /workspace
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              command: [python3]
              args:
                - -m
                - dynamo.vllm
                - --model
                - $(MODEL_NAME)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --trust-remote-code
                - --tensor-parallel-size
                - "4"
                - --kv-cache-dtype
                - fp8
                - --block-size
                - "256"
                - --max-num-seqs
                - "64"
                - --max-num-batched-tokens
                - "16384"
                - --no-scheduler-reserve-full-isl
                - --gpu-memory-utilization
                - "0.92"
                - --max-model-len
                - "1048576"
                - --compilation-config
                - '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
                - --attention-config
                - '{"use_fp4_indexer_cache":true}'
                - --moe-backend
                - flashinfer_trtllm
                - --tokenizer-mode
                - deepseek_v4
                - --dyn-tool-call-parser
                - deepseek_v4
                - --dyn-reasoning-parser
                - deepseek_v4
              env:
                - name: MODEL_NAME
                  value: nvidia/DeepSeek-V4-Flash-NVFP4
                - name: SERVED_MODEL_NAME
                  value: nvidia/DeepSeek-V4-Flash-NVFP4
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: HF_HUB_CACHE
                  value: /shared-model-cache/hub
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              resources:
                requests:
                  nvidia.com/gpu: "4"
                limits:
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                  readOnly: true
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
    # Optional components (type: planner, type: epp) go below this line, after the canonical components above.
