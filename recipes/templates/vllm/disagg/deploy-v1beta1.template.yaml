#
# Hugging Face access: online. Workers read credentials from the
# hf-token-secret Secret.
# Edit guide: change the DGD name, model variables, image, replicas, GPU count, and runtime flags.
# External references: model-cache and hf-token-secret are logical references that must stay consistent.
# Optional resources: none; this is a DGD-only example.
# Put scheduling, storage identity, Secret identity, and provider-network settings in Kustomize.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: gpt-oss-120b-vllm-disaggregated
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
              command: [python3]
              args: [-m, dynamo.frontend, --router-mode, kv, --router-kv-events, --kv-cache-block-size, "64", --trust-remote-code]
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
              resources:
                requests:
                  cpu: "8"
                  memory: 16Gi

    - name: PrefillWorker
      type: prefill
      replicas: 2
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
              workingDir: /workspace
              command: [/bin/bash, -lc]
              args:
                - |
                  python3 -m dynamo.vllm \
                    --model "${MODEL_NAME}" \
                    --served-model-name "${SERVED_MODEL_NAME}" \
                    --trust-remote-code \
                    --quantization=mxfp4 \
                    --kv-cache-dtype=fp8 \
                    --max-model-len=131072 \
                    --gpu-memory-utilization=0.9 \
                    --block-size=64 \
                    --tensor-parallel-size=1 \
                    --max-num-batched-tokens=32768 \
                    --enable-chunked-prefill \
                    --enable-prefix-caching \
                    --async-scheduling \
                    --no-disable-hybrid-kv-cache-manager \
                    --enable-flashinfer-autotune \
                    --speculative-config='{"method":"eagle3","model":"nvidia/gpt-oss-120b-Eagle3-v3","num_speculative_tokens":3}' \
                    --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
                    --disaggregation-mode=prefill \
                    --dyn-reasoning-parser gpt_oss \
                    --dyn-tool-call-parser harmony
              env:
                - name: KV_TRANSFER_CONFIG
                  value: '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_buffer_device":"cuda"}'
                - name: MODEL_NAME
                  value: openai/gpt-oss-120b
                - name: SERVED_MODEL_NAME
                  value: openai/gpt-oss-120b
                - name: HF_HOME
                  value: /model-cache
                - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
                  value: "1"
                - name: TRITON_CACHE_DIR
                  value: /tmp/.triton-cache
                - name: VLLM_CACHE_ROOT
                  value: /tmp/vllm-cache
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
              envFrom:
                - secretRef:
                    name: hf-token-secret
              startupProbe:
                failureThreshold: 60
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 20
              resources:
                requests:
                  nvidia.com/gpu: "1"
                  memory: 200Gi
                limits:
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                  readOnly: true
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache

    - name: DecodeWorker
      type: decode
      replicas: 6
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
              workingDir: /workspace
              command: [/bin/bash, -lc]
              args:
                - |
                  python3 -m dynamo.vllm \
                    --model "${MODEL_NAME}" \
                    --served-model-name "${SERVED_MODEL_NAME}" \
                    --trust-remote-code \
                    --quantization=mxfp4 \
                    --kv-cache-dtype=fp8 \
                    --max-model-len=131072 \
                    --gpu-memory-utilization=0.9 \
                    --block-size=64 \
                    --tensor-parallel-size=1 \
                    --max-num-batched-tokens=32768 \
                    --enable-chunked-prefill \
                    --enable-prefix-caching \
                    --async-scheduling \
                    --no-disable-hybrid-kv-cache-manager \
                    --enable-flashinfer-autotune \
                    --speculative-config='{"method":"eagle3","model":"nvidia/gpt-oss-120b-Eagle3-v3","num_speculative_tokens":3}' \
                    --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
                    --disaggregation-mode=decode \
                    --dyn-reasoning-parser gpt_oss \
                    --dyn-tool-call-parser harmony
              env:
                - name: KV_TRANSFER_CONFIG
                  value: '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_buffer_device":"cuda"}'
                - name: MODEL_NAME
                  value: openai/gpt-oss-120b
                - name: SERVED_MODEL_NAME
                  value: openai/gpt-oss-120b
                - name: HF_HOME
                  value: /model-cache
                - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
                  value: "1"
                - name: TRITON_CACHE_DIR
                  value: /tmp/.triton-cache
                - name: VLLM_CACHE_ROOT
                  value: /tmp/vllm-cache
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
              envFrom:
                - secretRef:
                    name: hf-token-secret
              startupProbe:
                failureThreshold: 60
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 20
              resources:
                requests:
                  nvidia.com/gpu: "1"
                  memory: 200Gi
                limits:
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                  readOnly: true
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
