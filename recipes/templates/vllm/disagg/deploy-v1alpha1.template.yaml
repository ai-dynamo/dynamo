#
# Hugging Face access: online. Workers read credentials from the
# hf-token-secret Secret.
# Edit guide: change the DGD name, model variables, image, replicas, GPU count, and runtime flags.
# External references: model-cache and hf-token-secret are logical references that must stay consistent.
# Optional resources: none; this is a DGD-only example.
# Put scheduling, storage identity, Secret identity, and provider-network settings in Kustomize.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: llama3-70b-vllm-disaggregated
spec:
  backendFramework: vllm
  pvcs:
    - name: model-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      envs:
        - name: HF_HOME
          value: /opt/models
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command: [python3]
          args: [-m, dynamo.frontend]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

    PrefillWorker:
      componentType: worker
      subComponentType: prefill
      replicas: 1
      envFromSecret: hf-token-secret
      sharedMemory:
        size: 80Gi
      resources:
        requests:
          gpu: "8"
        limits:
          gpu: "8"
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command: [/bin/bash, -lc]
          args:
            - |
              python3 -m dynamo.vllm \
                --model "${MODEL_NAME}" \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --tensor-parallel-size 8 \
                --data-parallel-size 1 \
                --disaggregation-mode prefill \
                --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
                --gpu-memory-utilization 0.90 \
                --no-enable-prefix-caching \
                --block-size 128
          env:
            - name: KV_TRANSFER_CONFIG
              value: '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
            - name: MODEL_NAME
              value: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - name: SERVED_MODEL_NAME
              value: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - name: HF_HOME
              value: /opt/models
          startupProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 60

    DecodeWorker:
      componentType: worker
      subComponentType: decode
      replicas: 1
      envFromSecret: hf-token-secret
      sharedMemory:
        size: 80Gi
      resources:
        requests:
          gpu: "8"
        limits:
          gpu: "8"
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command: [/bin/bash, -lc]
          args:
            - |
              python3 -m dynamo.vllm \
                --model "${MODEL_NAME}" \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --tensor-parallel-size 8 \
                --data-parallel-size 1 \
                --disaggregation-mode decode \
                --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
                --gpu-memory-utilization 0.90 \
                --no-enable-prefix-caching \
                --block-size 128
          env:
            - name: KV_TRANSFER_CONFIG
              value: '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
            - name: MODEL_NAME
              value: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - name: SERVED_MODEL_NAME
              value: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - name: HF_HOME
              value: /opt/models
          startupProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 60
