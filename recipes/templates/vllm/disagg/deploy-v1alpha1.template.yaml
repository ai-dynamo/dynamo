# Contract:
# - Use the native nvidia.com/v1alpha1 spec.services shape; each service
#   defines its runtime through extraPodSpec.mainContainer.
# - Keep backendFramework vllm aligned with the runtime image and
#   python3 -m dynamo.vllm command.
# - Keep the Frontend (frontend), PrefillWorker (worker/prefill), and
#   DecodeWorker (worker/decode) service keys and roles.
# - Keep MODEL_NAME and SERVED_MODEL_NAME synchronized with their command
#   arguments, and keep the prefill/decode transfer settings compatible.
# - KV_TRANSFER_CONFIG remains the first worker environment entry; change its
#   value on both workers without removing the hook.
# - shared-model-cache is the canonical default Kubernetes object name and patch
#   anchor. The namespace-local PVC must exist unless a cluster Kustomization
#   replaces the reference; change all coupled references together.
# Derived from: https://github.com/ai-dynamo/dynamo/blob/67203f32d2508c96c9387d263e0f02f4f3830f3f/recipes/llama-3-70b/vllm/disagg-multi-node/deploy.yaml.
# Validation status: static catalog validation only; verify admission,
# readiness, and runtime behavior on the target cluster.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: llama3-70b-vllm-disaggregated
spec:
  backendFramework: vllm
  pvcs:
    - name: shared-model-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      envs:
        - name: HF_HOME
          value: /shared-model-cache
      volumeMounts:
        - name: shared-model-cache
          mountPoint: /shared-model-cache
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/examples/backends/vllm
          command: [python3]
          args: [-m, dynamo.frontend]
    PrefillWorker:
      componentType: worker
      subComponentType: prefill
      replicas: 1
      sharedMemory:
        size: 80Gi
      resources:
        requests:
          gpu: "8"
        limits:
          gpu: "8"
      volumeMounts:
        - name: shared-model-cache
          mountPoint: /shared-model-cache
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/examples/backends/vllm
          command: [python3]
          args:
            - -m
            - dynamo.vllm
            - --model
            - $(MODEL_NAME)
            - --served-model-name
            - $(SERVED_MODEL_NAME)
            - --tensor-parallel-size
            - "8"
            - --data-parallel-size
            - "1"
            - --disaggregation-mode
            - prefill
            - --kv-transfer-config
            - $(KV_TRANSFER_CONFIG)
            - --gpu-memory-utilization
            - "0.90"
            - --no-enable-prefix-caching
            - --block-size
            - "128"
          env:
            - name: KV_TRANSFER_CONFIG
              value: '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
            - name: MODEL_NAME
              value: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - name: SERVED_MODEL_NAME
              value: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - name: HF_HOME
              value: /shared-model-cache
    DecodeWorker:
      componentType: worker
      subComponentType: decode
      replicas: 1
      sharedMemory:
        size: 80Gi
      resources:
        requests:
          gpu: "8"
        limits:
          gpu: "8"
      volumeMounts:
        - name: shared-model-cache
          mountPoint: /shared-model-cache
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/examples/backends/vllm
          command: [python3]
          args:
            - -m
            - dynamo.vllm
            - --model
            - $(MODEL_NAME)
            - --served-model-name
            - $(SERVED_MODEL_NAME)
            - --tensor-parallel-size
            - "8"
            - --data-parallel-size
            - "1"
            - --disaggregation-mode
            - decode
            - --kv-transfer-config
            - $(KV_TRANSFER_CONFIG)
            - --gpu-memory-utilization
            - "0.90"
            - --no-enable-prefix-caching
            - --block-size
            - "128"
          env:
            - name: KV_TRANSFER_CONFIG
              value: '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
            - name: MODEL_NAME
              value: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - name: SERVED_MODEL_NAME
              value: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - name: HF_HOME
              value: /shared-model-cache
