#
# Hugging Face access: online. Workers read credentials from the
# hf-token-secret Secret.
# Contract:
# - Use the native nvidia.com/v1alpha1 spec.services shape; each service
#   defines its runtime through extraPodSpec.mainContainer.
# - Keep backendFramework vllm aligned with the runtime image and
#   python3 -m dynamo.vllm command.
# - Keep the Frontend (frontend), PrefillWorker (worker/prefill), and
#   DecodeWorker (worker/decode) service keys and roles.
# - Keep MODEL_NAME and SERVED_MODEL_NAME synchronized with their command
#   arguments, and keep the prefill/decode transfer settings compatible.
# - KV_TRANSFER_CONFIG remains the first worker environment entry; change its
#   value on both workers without removing the hook.
# - model-cache and hf-token-secret are canonical default Kubernetes object
#   names and patch anchors. Each named namespace-local object must exist unless
#   a cluster Kustomization replaces the reference; change all coupled references together.
# Derived from: recipes/llama-3-70b/vllm/disagg-multi-node/deploy.yaml.
# Validation status: static catalog validation only; verify admission,
# readiness, and runtime behavior on the target cluster.
# The 60-minute worker startup budget is a template default; validate it for
# the selected model, image, and hardware.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: llama3-70b-vllm-disaggregated
spec:
  backendFramework: vllm
  pvcs:
    - name: model-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      envs:
        - name: HF_HOME
          value: /opt/models
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command: [python3]
          args: [-m, dynamo.frontend]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

    PrefillWorker:
      componentType: worker
      subComponentType: prefill
      replicas: 1
      envFromSecret: hf-token-secret
      sharedMemory:
        size: 80Gi
      resources:
        requests:
          gpu: "8"
        limits:
          gpu: "8"
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command: [/bin/bash, -lc]
          args:
            - |
              python3 -m dynamo.vllm \
                --model "${MODEL_NAME}" \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --tensor-parallel-size 8 \
                --data-parallel-size 1 \
                --disaggregation-mode prefill \
                --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
                --gpu-memory-utilization 0.90 \
                --no-enable-prefix-caching \
                --block-size 128
          env:
            - name: KV_TRANSFER_CONFIG
              value: '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
            - name: MODEL_NAME
              value: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - name: SERVED_MODEL_NAME
              value: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - name: HF_HOME
              value: /opt/models
          startupProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 60

    DecodeWorker:
      componentType: worker
      subComponentType: decode
      replicas: 1
      envFromSecret: hf-token-secret
      sharedMemory:
        size: 80Gi
      resources:
        requests:
          gpu: "8"
        limits:
          gpu: "8"
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command: [/bin/bash, -lc]
          args:
            - |
              python3 -m dynamo.vllm \
                --model "${MODEL_NAME}" \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --tensor-parallel-size 8 \
                --data-parallel-size 1 \
                --disaggregation-mode decode \
                --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
                --gpu-memory-utilization 0.90 \
                --no-enable-prefix-caching \
                --block-size 128
          env:
            - name: KV_TRANSFER_CONFIG
              value: '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
            - name: MODEL_NAME
              value: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - name: SERVED_MODEL_NAME
              value: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - name: HF_HOME
              value: /opt/models
          startupProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 60
