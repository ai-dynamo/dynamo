#
# Synthesized template: this translates the audited v1alpha1 TensorRT-LLM disaggregated example
# to the established v1beta1 component shape. It has not been live-cluster qualified.
#
# Edit guide: change the DGD and ConfigMap names, model variables, image, replicas, GPU count, and runtime configuration.
# External references: model-cache and hf-token-secret are logical references that must stay consistent.
# Optional resources: remove either ConfigMap only with its worker's engine-config volume,
# /opt/dynamo/configs mount, configMap.name reference, ENGINE_ARGS value, and --extra-engine-args flag.
# Put scheduling, storage identity, Secret identity, and provider-network settings in Kustomize.
# Optional prefill ConfigMap: when removed, also remove PrefillWorker's prefill-engine-config
# volume, matching /opt/dynamo/configs mount, configMap.name reference, ENGINE_ARGS value,
# and --extra-engine-args flag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nemotron-super-trtllm-prefill-config
data:
  config.yaml: |
    backend: pytorch
    tensor_parallel_size: 2
    moe_expert_parallel_size: 1
    enable_attention_dp: false
    enable_chunked_prefill: true
    max_batch_size: 16
    max_num_tokens: 8192
    trust_remote_code: true
    kv_cache_config:
      free_gpu_memory_fraction: 0.85
      # Nemotron-H uses a Mamba hybrid cache. Block reuse is unsupported.
      enable_block_reuse: false
    moe_config:
      backend: TRTLLM
    cache_transceiver_config:
      # UCX is required because NIXL/MOONCAKE do not support Mamba SSM transfer.
      backend: UCX
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 16
    disable_overlap_scheduler: true
---
# Optional decode ConfigMap: when removed, also remove DecodeWorker's decode-engine-config
# volume, matching /opt/dynamo/configs mount, configMap.name reference, ENGINE_ARGS value,
# and --extra-engine-args flag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nemotron-super-trtllm-decode-config
data:
  config.yaml: |
    backend: pytorch
    tensor_parallel_size: 2
    moe_expert_parallel_size: 1
    enable_attention_dp: false
    enable_chunked_prefill: true
    max_batch_size: 16
    max_num_tokens: 8192
    trust_remote_code: true
    kv_cache_config:
      free_gpu_memory_fraction: 0.85
      # Nemotron-H uses a Mamba hybrid cache. Block reuse is unsupported.
      enable_block_reuse: false
    moe_config:
      backend: TRTLLM
    cache_transceiver_config:
      # UCX is required because NIXL/MOONCAKE do not support Mamba SSM transfer.
      backend: UCX
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 16
    disable_overlap_scheduler: false
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: nemotron-super-trtllm-disaggregated
spec:
  backendFramework: trtllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
              command: [python3]
              args: [-m, dynamo.frontend, --router-mode, round-robin, --http-port, "8000"]

    - name: PrefillWorker
      type: prefill
      replicas: 1
      sharedMemorySize: 16Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
              command: [/bin/bash, -lc]
              args:
                - |
                  python3 -m dynamo.trtllm \
                    --model-path "${MODEL_NAME}" \
                    --served-model-name "${SERVED_MODEL_NAME}" \
                    --extra-engine-args "${ENGINE_ARGS}" \
                    --disaggregation-mode prefill \
                    --dyn-tool-call-parser nemotron_nano \
                    --dyn-reasoning-parser nemotron_nano
              env:
                - name: MODEL_NAME
                  value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
                - name: SERVED_MODEL_NAME
                  value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
                - name: ENGINE_ARGS
                  value: /opt/dynamo/configs/config.yaml
                - name: HF_HOME
                  value: /opt/models
              envFrom:
                - secretRef:
                    name: hf-token-secret
              resources:
                requests:
                  nvidia.com/gpu: "2"
                limits:
                  nvidia.com/gpu: "2"
              startupProbe:
                httpGet:
                  path: /health
                  port: 9090
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 600
              volumeMounts:
                - name: model-cache
                  mountPath: /opt/models
                - name: prefill-engine-config
                  mountPath: /opt/dynamo/configs
                  readOnly: true
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: prefill-engine-config
              configMap:
                name: nemotron-super-trtllm-prefill-config

    - name: DecodeWorker
      type: decode
      replicas: 1
      sharedMemorySize: 16Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
              command: [/bin/bash, -lc]
              args:
                - |
                  python3 -m dynamo.trtllm \
                    --model-path "${MODEL_NAME}" \
                    --served-model-name "${SERVED_MODEL_NAME}" \
                    --extra-engine-args "${ENGINE_ARGS}" \
                    --disaggregation-mode decode \
                    --dyn-tool-call-parser nemotron_nano \
                    --dyn-reasoning-parser nemotron_nano
              env:
                - name: MODEL_NAME
                  value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
                - name: SERVED_MODEL_NAME
                  value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
                - name: ENGINE_ARGS
                  value: /opt/dynamo/configs/config.yaml
                - name: HF_HOME
                  value: /opt/models
              envFrom:
                - secretRef:
                    name: hf-token-secret
              resources:
                requests:
                  nvidia.com/gpu: "2"
                limits:
                  nvidia.com/gpu: "2"
              startupProbe:
                httpGet:
                  path: /health
                  port: 9090
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 600
              volumeMounts:
                - name: model-cache
                  mountPath: /opt/models
                - name: decode-engine-config
                  mountPath: /opt/dynamo/configs
                  readOnly: true
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: decode-engine-config
              configMap:
                name: nemotron-super-trtllm-decode-config
