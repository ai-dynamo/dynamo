#
# This recipe runs offline against the pre-populated shared-model-cache PVC.
# Contract:
# - Keep the prefill and decode ConfigMaps before the native nvidia.com/v1beta1
#   DGD. Each component podTemplate contains a runtime container named main.
# - Keep backendFramework trtllm aligned with the runtime image and
#   python3 -m dynamo.trtllm command.
# - Keep components ordered as Frontend (frontend), PrefillWorker (prefill),
#   then DecodeWorker (decode).
# - Keep MODEL_NAME and SERVED_MODEL_NAME synchronized with their command
#   arguments; each worker's ENGINE_ARGS, ConfigMap, volume, mount, and
#   --extra-engine-args path form a coordinated prefill/decode pair.
# - Keep cache_transceiver_config compatible across both engine ConfigMaps;
#   transfer selection has no worker environment hook in this template.
# - shared-model-cache is the canonical PVC, volume, and mount name. Mount it at
#   /shared-model-cache. The namespace-local PVC must exist; change all coupled
#   cache references together.
# Derived from: recipes/nemotron-3-super-fp8/trtllm/disagg/deploy.yaml.
# Validation status: this template follows the v1alpha1 runtime and ConfigMap
# settings in v1beta1 component shape and has static catalog validation only;
# it requires qualification on the target cluster.
# TensorRT-LLM transfer selection has no environment-variable override;
# configure cache_transceiver_config in the engine ConfigMaps.
# Optional prefill ConfigMap: when removed, also remove PrefillWorker's prefill-engine-config
# volume, matching /opt/dynamo/configs mount, configMap.name reference, ENGINE_ARGS value,
# and --extra-engine-args flag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nemotron-super-trtllm-prefill-config
data:
  config.yaml: |
    backend: pytorch
    tensor_parallel_size: 2
    moe_expert_parallel_size: 1
    enable_attention_dp: false
    enable_chunked_prefill: true
    max_batch_size: 16
    max_num_tokens: 8192
    trust_remote_code: true
    kv_cache_config:
      free_gpu_memory_fraction: 0.85
      # Nemotron-H uses a Mamba hybrid cache. Block reuse is unsupported.
      enable_block_reuse: false
    moe_config:
      backend: TRTLLM
    cache_transceiver_config:
      # UCX is required because NIXL/MOONCAKE do not support Mamba SSM transfer.
      backend: UCX
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 16
    disable_overlap_scheduler: true
---
# Optional decode ConfigMap: when removed, also remove DecodeWorker's decode-engine-config
# volume, matching /opt/dynamo/configs mount, configMap.name reference, ENGINE_ARGS value,
# and --extra-engine-args flag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nemotron-super-trtllm-decode-config
data:
  config.yaml: |
    backend: pytorch
    tensor_parallel_size: 2
    moe_expert_parallel_size: 1
    enable_attention_dp: false
    enable_chunked_prefill: true
    max_batch_size: 16
    max_num_tokens: 8192
    trust_remote_code: true
    kv_cache_config:
      free_gpu_memory_fraction: 0.85
      # Nemotron-H uses a Mamba hybrid cache. Block reuse is unsupported.
      enable_block_reuse: false
    moe_config:
      backend: TRTLLM
    cache_transceiver_config:
      # UCX is required because NIXL/MOONCAKE do not support Mamba SSM transfer.
      backend: UCX
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 16
    disable_overlap_scheduler: false
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: nemotron-super-trtllm-disaggregated
spec:
  backendFramework: trtllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
              imagePullPolicy: IfNotPresent
              command: [python3]
              args: [-m, dynamo.frontend, --router-mode, round-robin, --http-port, "8000"]
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
    - name: PrefillWorker
      type: prefill
      replicas: 1
      sharedMemorySize: 16Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.trtllm
                - --model
                - $(MODEL_NAME)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --extra-engine-args
                - $(ENGINE_ARGS)
                - --disaggregation-mode
                - prefill
                - --dyn-tool-call-parser
                - nemotron_nano
                - --dyn-reasoning-parser
                - nemotron_nano
              env:
                - name: MODEL_NAME
                  value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
                - name: SERVED_MODEL_NAME
                  value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
                - name: ENGINE_ARGS
                  value: /opt/dynamo/configs/config.yaml
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              resources:
                requests:
                  nvidia.com/gpu: "2"
                limits:
                  nvidia.com/gpu: "2"
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                  readOnly: true
                - name: prefill-engine-config
                  mountPath: /opt/dynamo/configs
                  readOnly: true
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
            - name: prefill-engine-config
              configMap:
                name: nemotron-super-trtllm-prefill-config

    - name: DecodeWorker
      type: decode
      replicas: 1
      sharedMemorySize: 16Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.trtllm
                - --model
                - $(MODEL_NAME)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --extra-engine-args
                - $(ENGINE_ARGS)
                - --disaggregation-mode
                - decode
                - --dyn-tool-call-parser
                - nemotron_nano
                - --dyn-reasoning-parser
                - nemotron_nano
              env:
                - name: MODEL_NAME
                  value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
                - name: SERVED_MODEL_NAME
                  value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
                - name: ENGINE_ARGS
                  value: /opt/dynamo/configs/config.yaml
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              resources:
                requests:
                  nvidia.com/gpu: "2"
                limits:
                  nvidia.com/gpu: "2"
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                  readOnly: true
                - name: decode-engine-config
                  mountPath: /opt/dynamo/configs
                  readOnly: true
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
            - name: decode-engine-config
              configMap:
                name: nemotron-super-trtllm-decode-config
    # Optional components (type: planner, type: epp) go below this line, after the canonical components above.
