#
# Hugging Face access: online. Workers read credentials from the
# hf-token-secret Secret.
# Edit guide: change the DGD and ConfigMap names, model variables, image, replicas, GPU count, and runtime configuration.
# External references: model-cache and hf-token-secret are logical references that must stay consistent.
# Optional resources: remove the ConfigMap only with the Worker's engine-config volume,
# /opt/dynamo/configs mount, configMap.name reference, ENGINE_ARGS value, and --extra-engine-args flag.
# Put scheduling, storage identity, Secret identity, and provider-network settings in Kustomize.
# Optional TensorRT-LLM ConfigMap: when removed, also remove the Worker's engine-config
# volume, matching /opt/dynamo/configs mount, configMap.name reference, ENGINE_ARGS value,
# and --extra-engine-args flag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpt-oss-trtllm-aggregate-config
data:
  config.yaml: |
    enable_attention_dp: true
    cuda_graph_config:
      max_batch_size: 800
      enable_padding: true
    kv_cache_config:
      enable_block_reuse: false
    stream_interval: 20
    moe_config:
      backend: CUTLASS
---
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: gpt-oss-trtllm-aggregate
spec:
  backendFramework: trtllm
  pvcs:
    - name: model-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
          command: [python3]
          args: [-m, dynamo.frontend, --router-mode, round-robin, --http-port, "8000"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

    Worker:
      componentType: worker
      replicas: 1
      envFromSecret: hf-token-secret
      resources:
        requests:
          gpu: "4"
        limits:
          gpu: "4"
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      sharedMemory:
        size: 80Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/trtllm
          command: [/bin/bash, -lc]
          args:
            - |
              python3 -m dynamo.trtllm \
                --model "${MODEL_NAME}" \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --extra-engine-args "${ENGINE_ARGS}" \
                --tensor-parallel-size 4 \
                --expert-parallel-size 4 \
                --max-batch-size 800 \
                --free-gpu-memory-fraction 0.9
          env:
            - name: MODEL_NAME
              value: openai/gpt-oss-120b
            - name: SERVED_MODEL_NAME
              value: openai/gpt-oss-120b
            - name: ENGINE_ARGS
              value: /opt/dynamo/configs/config.yaml
            - name: HF_HOME
              value: /opt/models
            - name: TRTLLM_ENABLE_PDL
              value: "1"
            - name: TRT_LLM_DISABLE_LOAD_WEIGHTS_IN_PARALLEL
              value: "True"
          startupProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 60
          volumeMounts:
            - name: engine-config
              mountPath: /opt/dynamo/configs
              readOnly: true
        volumes:
          - name: engine-config
            configMap:
              name: gpt-oss-trtllm-aggregate-config
