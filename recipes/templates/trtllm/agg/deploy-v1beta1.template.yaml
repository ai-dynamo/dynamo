#
# Hugging Face access: online. Workers read credentials from the
# hf-token-secret Secret.
# Edit guide: change the DGD and ConfigMap names, model variables, image, replicas, GPU count, and runtime configuration.
# External references: model-cache and hf-token-secret are logical references that must stay consistent.
# Optional resources: remove the ConfigMap only with the Worker's trtllm-config volume,
# /config mount, configMap.name reference, and --extra-engine-args /config/agg.yaml flag.
# Put scheduling, storage identity, Secret identity, and provider-network settings in Kustomize.
# Optional TensorRT-LLM ConfigMap: when removed, also remove the Worker's trtllm-config
# volume, matching /config volume mount, configMap.name reference, and --extra-engine-args flag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nemotron-lightning-trtllm-aggregate-config
data:
  agg.yaml: |
    backend: pytorch
    tensor_parallel_size: 1
    max_batch_size: 512
    max_num_tokens: 32768
    enable_chunked_prefill: true
    trust_remote_code: true
    stream_interval: 10
    kv_cache_config:
      dtype: fp8
      enable_block_reuse: true
      use_kv_cache_manager_v2: true
      mamba_state_config:
        periodic_snapshot_interval: 0
        additional_snapshot_offsets_from_start: [57600]
    moe_config:
      backend: CUTLASS
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: nemotron-lightning-trtllm-aggregate
spec:
  backendFramework: trtllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.5.0-nemotron-3.5-lightning-dev.1
              command: [python3]
              args: [-m, dynamo.frontend, --router-mode, round-robin, --http-port, "8000"]
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: DYN_HTTP_BODY_LIMIT_MB
                  value: "200"
                - name: HF_HOME
                  value: /model-cache
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                  readOnly: true
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache

    - name: Worker
      type: worker
      replicas: 1
      sharedMemorySize: 40Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.5.0-nemotron-3.5-lightning-dev.1
              workingDir: /workspace/
              command: [/bin/bash, -lc]
              args:
                - |
                  python3 -m dynamo.trtllm \
                    --model "${MODEL_NAME}" \
                    --served-model-name "${SERVED_MODEL_NAME}" \
                    --tensor-parallel-size 1 \
                    --max-num-tokens 32768 \
                    --max-batch-size 512 \
                    --extra-engine-args /config/agg.yaml \
                    --disaggregation-mode agg \
                    --dyn-tool-call-parser nemotron_nano \
                    --dyn-reasoning-parser nemotron_nano
              env:
                - name: MODEL_NAME
                  value: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
                - name: SERVED_MODEL_NAME
                  value: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HF_HOME
                  value: /model-cache
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: TRITON_CACHE_DIR
                  value: /tmp/.triton-cache
                - name: NCCL_IB_DISABLE
                  value: "1"
                - name: PYTHONHASHSEED
                  value: "0"
                - name: TLLM_LOG_LEVEL
                  value: INFO
                - name: TLLM_BATCHED_GEMM_LOG_REJECTION
                  value: "1"
                - name: TRTLLM_ENABLE_PDL
                  value: "1"
                - name: TRTLLM_SERVER_DISABLE_GC
                  value: "1"
                - name: TRTLLM_WORKER_DISABLE_GC
                  value: "1"
              envFrom:
                - secretRef:
                    name: hf-token-secret
              resources:
                requests:
                  memory: 128Gi
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 20
                failureThreshold: 60
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                  readOnly: true
                - name: trtllm-config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: trtllm-config
              configMap:
                name: nemotron-lightning-trtllm-aggregate-config
