apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-0-6b-agg
spec:
  backendFramework: vllm
  components:
  - name: Epp
    type: epp
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.5.0
          env:
          - name: DYN_KV_CACHE_BLOCK_SIZE
            value: "16"
          - name: DYN_MODEL_NAME
            value: "Qwen/Qwen3-0.6B"
          - name: DYN_DECODE_FALLBACK
            value: "true"
  - name: worker
    type: worker
    replicas: 2
    sharedMemorySize: 2Gi
    frontendSidecar: sidecar-frontend
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
          command:
          - /bin/sh
          - -c
          args:
          - "python3 -m dynamo.vllm --model $MODEL_PATH --served-model-name $SERVED_MODEL_NAME --tensor-parallel-size 1 --data-parallel-size 1 --gpu-memory-utilization 0.90 --enable-prefix-caching --kv-events-config '{\"enable_kv_cache_events\":true}' --block-size 16"
          workingDir: /workspace/examples/backends/vllm
          env:
          - name: SERVED_MODEL_NAME
            value: "Qwen/Qwen3-0.6B"
          - name: MODEL_PATH
            value: "Qwen/Qwen3-0.6B"
          - name: HF_HOME
            value: /opt/models
          - name: DYN_STORE_KV
            value: "mem"
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: model-cache
            mountPath: /opt/models
        - name: sidecar-frontend
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
          args:
          - -m
          - dynamo.frontend
          - --router-mode
          - direct
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
