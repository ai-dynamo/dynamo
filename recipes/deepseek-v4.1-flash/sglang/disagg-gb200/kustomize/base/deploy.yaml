# DeepSeek-V4.1-Flash on SGLang, disaggregated. One prefill and one decode
# worker, TP4 each, 8x GB200. Up to 1M tokens of context.
#
# DSpark speculative decoding is absent here. SGLang refuses it under prefill
# and decode disaggregation for this model. The aggregated recipe ships it.
#
# Each worker needs TP4 and a GB200 node holds 4 GPUs. So prefill and decode
# always sit on different nodes, and KV must cross nodes. Mooncake picks the
# transport: TCP here, RDMA where the cluster attaches RDMA devices.
#
# KV does NOT ride the NVLink fabric. The fabric is faster, but it needs both
# workers in one NVLink clique, because a fabric memory handle cannot be
# imported across cliques. A split gives no error: the deployment reports
# Ready and chat completions return HTTP 200 with content null. This recipe
# takes the transport that works on any clique layout. To opt into the
# fabric, read the documentation page.
#
# Do not set the attention, MoE, or GEMM backend flags. SGLang resolves them for
# this model. A hand-set backend flag selects a slower fallback.
apiVersion: v1
kind: ConfigMap
metadata:
  name: deepseek-v41-flash-sglang-gb200-disagg-sglang-config
data:
  prefill.yaml: |-
    model-path: deepseek-ai/DeepSeek-V4.1-Flash
    served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
    trust-remote-code: true
    tp-size: 4
    ep-size: 4
    page-size: 256
    mem-fraction-static: 0.8
    max-running-requests: 256
    max-prefill-tokens: 16384
    # The native parser gates guided decoding. Dynamo builds the response from
    # --dyn-reasoning-parser. Both are needed.
    reasoning-parser: auto
    enable-metrics: true
    watchdog-timeout: 3600
    host: 0.0.0.0
    port: 30000
    disaggregation-mode: prefill
    disaggregation-transfer-backend: mooncake
    disaggregation-bootstrap-port: 30001
    load-balance-method: round_robin

  decode.yaml: |-
    model-path: deepseek-ai/DeepSeek-V4.1-Flash
    served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
    trust-remote-code: true
    tp-size: 4
    ep-size: 4
    page-size: 256
    mem-fraction-static: 0.8
    max-running-requests: 256
    reasoning-parser: auto
    enable-metrics: true
    watchdog-timeout: 3600
    host: 0.0.0.0
    port: 30000
    disaggregation-mode: decode
    disaggregation-transfer-backend: mooncake
    disaggregation-bootstrap-port: 30001
---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: deepseek-v41-flash-sglang-gb200-disagg-compute-domain
spec:
  # numNodes 0 lets the driver size the domain from the pods that claim it.
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: deepseek-v41-flash-sglang-gb200-disagg-compute-domain-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: deepseek-v41-flash-sglang-gb200-disagg
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-deepseek-v4.1-flash-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3, -m, dynamo.frontend]
              args:
                - --http-port
                - "8000"
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                # One decode worker makes this a no-op today. Keep it, so the
                # router is already KV-aware when decode replicas grow.
                - name: DYN_ROUTER_MODE
                  value: kv
              ports:
                - name: http
                  containerPort: 8000
                  protocol: TCP
              resources:
                requests:
                  cpu: "16"
                  memory: 128Gi
    - name: PrefillWorker
      type: prefill
      replicas: 1
      sharedMemorySize: 200Gi
      podTemplate:
        spec:
          resourceClaims:
            - name: compute-domain-channel
              resourceClaimTemplateName: deepseek-v41-flash-sglang-gb200-disagg-compute-domain-channel
          terminationGracePeriodSeconds: 60
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-deepseek-v4.1-flash-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3, -m, dynamo.sglang]
              args:
                - --config
                - /etc/sglang/prefill.yaml
                - --dyn-reasoning-parser
                - deepseek_v41
                - --dyn-tool-call-parser
                - deepseek_v41
                - --dyn-enable-structural-tag
              env: &workerEnv
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                - name: HF_HOME
                  value: /shared-model-cache
                # Without these two, every start pays minutes of DeepGEMM JIT.
                - name: SGLANG_JIT_DEEPGEMM_PRECOMPILE
                  value: "0"
                - name: SGLANG_JIT_DEEPGEMM_FAST_WARMUP
                  value: "1"
                # Thinking is off by default. Then reasoning_content is empty.
                - name: SGLANG_DEFAULT_THINKING
                  value: "true"
                # Force Mooncake onto TCP for KV. Removing MC_FORCE_MNNVL is
                # not enough. When the cluster attaches no RDMA device Mooncake
                # logs
                #   Topology discovery complete. Found 0 HCAs.
                #   Using NVLink transport (forced or no HCA detected)
                # and takes the fabric anyway. The fabric needs both workers in
                # one NVLink clique, so a split placement still answers HTTP 200
                # with content null. Measured on GB200 across cliques: TCP
                # 0.707 GB/s. NVLink inside one clique: 1.7 to 2.2 GB/s. The
                # gke-rdma target removes this and uses RDMA.
                - name: MC_FORCE_TCP
                  value: "1"
                # NCCL collectives only. These do not move KV.
                - name: NCCL_MNNVL_ENABLE
                  value: "1"
                - name: NCCL_NVLS_ENABLE
                  value: "1"
                - name: NCCL_CUMEM_ENABLE
                  value: "1"
                # Loading 510 GB of weights can outrun the default timeouts.
                - name: NCCL_STORE_TIMEOUT
                  value: "7200"
                - name: TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC
                  value: "1800"
                # Keep --enable-metrics on, but turn the forward-pass publisher
                # off. It crashes this model on a null seq_lens_cpu.
                - name: DYN_FORWARDPASS_METRIC_PORT
                  value: ""
              ports: &workerPorts
                - name: system
                  containerPort: 9090
                  protocol: TCP
                - name: bootstrap
                  containerPort: 30001
                  protocol: TCP
              resources: &workerResources
                claims:
                  - name: compute-domain-channel
                requests:
                  cpu: "16"
                  memory: 512Gi
                  ephemeral-storage: 64Gi
                  nvidia.com/gpu: "4"
                limits:
                  nvidia.com/gpu: "4"
              securityContext: &workerSecurityContext
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              volumeMounts: &workerVolumeMounts
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                - name: sglang-config
                  mountPath: /etc/sglang
                  readOnly: true
          volumes: &workerVolumes
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
            - name: sglang-config
              configMap:
                name: deepseek-v41-flash-sglang-gb200-disagg-sglang-config
    - name: DecodeWorker
      type: decode
      replicas: 1
      sharedMemorySize: 200Gi
      podTemplate:
        spec:
          resourceClaims:
            - name: compute-domain-channel
              resourceClaimTemplateName: deepseek-v41-flash-sglang-gb200-disagg-compute-domain-channel
          terminationGracePeriodSeconds: 60
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-deepseek-v4.1-flash-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3, -m, dynamo.sglang]
              args:
                - --config
                - /etc/sglang/decode.yaml
                - --dyn-reasoning-parser
                - deepseek_v41
                - --dyn-tool-call-parser
                - deepseek_v41
                - --dyn-enable-structural-tag
                - --prefill-round-robin-balance
              env: *workerEnv
              ports: *workerPorts
              resources: *workerResources
              securityContext: *workerSecurityContext
              volumeMounts: *workerVolumeMounts
          volumes: *workerVolumes
