#
# GKE multi-network RDMA. GKE GB200 node pools advertise four RDMA networks
# instead of the `rdma/ib` resource that other providers use. Each worker
# claims all four.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: nvidia.com
      version: v1beta1
      kind: DynamoGraphDeployment
    path: patch-dgd.yaml
