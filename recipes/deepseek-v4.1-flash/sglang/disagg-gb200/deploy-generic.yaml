kind: ConfigMap
metadata:
  name: deepseek-v41-flash-sglang-gb200-disagg-sglang-config
data:
  decode.yaml: |-
    model-path: deepseek-ai/DeepSeek-V4.1-Flash
    served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
    trust-remote-code: true
    tp-size: 4
    ep-size: 4
    page-size: 256
    mem-fraction-static: 0.8
    max-running-requests: 256
    reasoning-parser: auto
    enable-metrics: true
    watchdog-timeout: 3600
    host: 0.0.0.0
    port: 30000
    disaggregation-mode: decode
    disaggregation-transfer-backend: mooncake
    disaggregation-bootstrap-port: 30001
  prefill.yaml: |-
    model-path: deepseek-ai/DeepSeek-V4.1-Flash
    served-model-name: deepseek-ai/DeepSeek-V4.1-Flash
    trust-remote-code: true
    tp-size: 4
    ep-size: 4
    page-size: 256
    mem-fraction-static: 0.8
    max-running-requests: 256
    max-prefill-tokens: 16384
    # The native parser gates guided decoding. Dynamo builds the response from
    # --dyn-reasoning-parser. Both are needed.
    reasoning-parser: auto
    enable-metrics: true
    watchdog-timeout: 3600
    host: 0.0.0.0
    port: 30000
    disaggregation-mode: prefill
    disaggregation-transfer-backend: mooncake
    disaggregation-bootstrap-port: 30001
    load-balance-method: round_robin
