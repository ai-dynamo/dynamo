# DeepSeek-V4.1-Flash on SGLang, disaggregated. One prefill and one decode
# worker, TP4 each, 8x GB200. Up to 1M tokens of context.
#
# DSpark speculative decoding is absent here. SGLang refuses it under prefill
# and decode disaggregation for this model. The aggregated recipe ships it.
#
# Each worker needs TP4 and a GB200 node holds 4 GPUs. So prefill and decode
# always sit on different nodes, and KV must cross nodes. Mooncake picks the
# transport: TCP here, RDMA where the cluster attaches RDMA devices.
#
# KV does NOT ride the NVLink fabric. The fabric is faster, but it needs both
# workers in one NVLink clique, because a fabric memory handle cannot be
# imported across cliques. A split gives no error: the deployment reports
# Ready and chat completions return HTTP 200 with content null. This recipe
# takes the transport that works on any clique layout. To opt into the
# fabric, read the documentation page.
#
# Do not set the attention, MoE, or GEMM backend flags. SGLang resolves them for
# this model. A hand-set backend flag selects a slower fallback.
