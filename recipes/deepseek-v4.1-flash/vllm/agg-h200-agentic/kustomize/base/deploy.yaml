apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv41-flash-vllm-h200-agg-agentic
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - args:
          - -m
          - dynamo.frontend
          - --http-port
          - '8000'
          command:
          - python3
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: DYN_ROUTER_MODE
            value: kv
          - name: DYN_ROUTER_DECODE_ACTIVE_REQUEST_WEIGHT
            value: '50'
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-deepseek-v4.1-flash-dev.2
          imagePullPolicy: IfNotPresent
          name: main
          ports:
          - containerPort: 8000
            name: http
            protocol: TCP
          resources:
            requests:
              cpu: '4'
              memory: 8Gi
    replicas: 1
    type: frontend
  - name: Worker
    podTemplate:
      spec:
        containers:
        - args:
          - -m
          - dynamo.vllm
          - --model
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --served-model-name
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --tokenizer-mode
          - deepseek_v41
          - --tensor-parallel-size
          - '4'
          - --kv-cache-dtype
          - fp8_ds_mla
          - --enable-expert-parallel
          - --moe-backend
          - flashinfer_cutlass
          - --enable-ep-weight-filter
          - --numa-bind
          - --language-model-only
          - --reasoning-parser
          - deepseek_v41
          - --dyn-reasoning-parser
          - deepseek_v41
          - --dyn-tool-call-parser
          - deepseek_v41
          - --dyn-enable-structural-tag
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557","enable_kv_cache_events":true}'
          - --max-cudagraph-capture-size
          - '512'
          - --prefix-cache-retention-interval
          - '1024'
          - --speculative-config
          - '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
          - --enable-eplb
          - --gpu-memory-utilization
          - '0.92'
          - --max-num-batched-tokens
          - '8192'
          - --max-num-seqs
          - '1024'
          command:
          - python3
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '3600'
          - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
            value: '300'
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-deepseek-v4.1-flash-dev.2
          imagePullPolicy: IfNotPresent
          name: main
          ports:
          - containerPort: 9090
            name: system
            protocol: TCP
          - containerPort: 5557
            name: kv-events
            protocol: TCP
          resources:
            limits:
              nvidia.com/gpu: '4'
            requests:
              cpu: '16'
              ephemeral-storage: 64Gi
              memory: 512Gi
              nvidia.com/gpu: '4'
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
          - mountPath: /shared-model-cache
            name: shared-model-cache
        terminationGracePeriodSeconds: 60
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
    replicas: 4
    sharedMemorySize: 200Gi
    type: worker
