apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv41-flash-vllm-gb200-agg-agentic
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.6.0-ci-842bca6a42b8e532766366e46a764e5e3a74c1d1-vllm-runtime@sha256:13ed3609d95c04e868230a30d68371ab73969c6f56c2399ca3a7302e7e0a774b
          imagePullPolicy: IfNotPresent
          command:
          - python3
          args:
          - -m
          - dynamo.frontend
          - --http-port
          - '8000'
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: DYN_ROUTER_MODE
            value: kv
          - name: DYN_ROUTER_DECODE_ACTIVE_REQUEST_WEIGHT
            value: '50'
          ports:
          - name: http
            containerPort: 8000
            protocol: TCP
          resources:
            requests:
              cpu: '16'
              memory: 128Gi
  - name: Worker
    type: worker
    replicas: 2
    sharedMemorySize: 200Gi
    podTemplate:
      spec:
        terminationGracePeriodSeconds: 60
        containers:
        - name: main
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.6.0-ci-842bca6a42b8e532766366e46a764e5e3a74c1d1-vllm-runtime@sha256:13ed3609d95c04e868230a30d68371ab73969c6f56c2399ca3a7302e7e0a774b
          imagePullPolicy: IfNotPresent
          command:
          - python3
          args:
          - -m
          - dynamo.vllm
          - --model
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --served-model-name
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --tokenizer-mode
          - deepseek_v41
          - --tensor-parallel-size
          - '4'
          - --enable-expert-parallel
          - --moe-backend
          - deep_gemm_mega_moe
          - --enable-ep-weight-filter
          - --enable-eplb
          - --eplb-config
          - '{"communicator":"torch_gloo"}'
          - --numa-bind
          - --language-model-only
          - --reasoning-parser
          - deepseek_v41
          - --dyn-reasoning-parser
          - deepseek_v41
          - --dyn-tool-call-parser
          - deepseek_v41
          - --dyn-enable-structural-tag
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557","enable_kv_cache_events":true}'
          - --max-cudagraph-capture-size
          - '512'
          - --prefix-cache-retention-interval
          - '1024'
          - --kv-cache-dtype
          - fp8_ds_mla
          - --max-num-seqs
          - '1024'
          - --max-num-batched-tokens
          - '16384'
          - --gpu-memory-utilization
          - '0.92'
          - --block-size
          - '128'
          - --max-model-len
          - '1048576'
          - --attention-config
          - '{"indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true,"backend":"FLASHMLA_MEGA_ATTN_DSV41"}'
          - --speculative-config
          - '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '3600'
          - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
            value: '300'
          ports:
          - name: system
            containerPort: 9090
            protocol: TCP
          - name: kv-events
            containerPort: 5557
            protocol: TCP
          resources:
            requests:
              cpu: '16'
              memory: 512Gi
              ephemeral-storage: 64Gi
              nvidia.com/gpu: '4'
            limits:
              nvidia.com/gpu: '4'
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
          volumeMounts:
          - name: shared-model-cache
            mountPath: /shared-model-cache
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
