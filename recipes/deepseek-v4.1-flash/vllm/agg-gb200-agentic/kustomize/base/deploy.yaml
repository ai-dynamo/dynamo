apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv41-flash-vllm-gb200-agg
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          nodeSelector:
            kubernetes.io/arch: arm64
          tolerations:
            - key: kubernetes.io/arch
              operator: Exists
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-deepseek-v4.1-flash-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3, -m, dynamo.frontend]
              args:
                - --http-port
                - "8000"
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                - name: DYN_ROUTER_MODE
                  value: kv
                - name: DYN_ROUTER_DECODE_ACTIVE_REQUEST_WEIGHT
                  value: "50"
              ports:
                - name: http
                  containerPort: 8000
                  protocol: TCP
              resources:
                requests:
                  cpu: "4"
                  memory: 8Gi
    - name: Worker
      type: worker
      replicas: 2
      sharedMemorySize: 200Gi
      podTemplate:
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-GB200
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
            - key: kubernetes.io/arch
              operator: Exists
              effect: NoSchedule
          terminationGracePeriodSeconds: 60
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-deepseek-v4.1-flash-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3, -m, dynamo.vllm]
              args:
                - --model
                - deepseek-ai/DeepSeek-V4.1-Flash
                - --served-model-name
                - deepseek-ai/DeepSeek-V4.1-Flash
                - --tokenizer-mode
                - deepseek_v41
                - --tensor-parallel-size
                - "4"
                - --enable-expert-parallel
                - --moe-backend
                - deep_gemm_mega_moe
                - --enable-ep-weight-filter
                - --enable-eplb
                - --eplb-config
                - '{"communicator":"torch_gloo"}'
                - --numa-bind
                - --language-model-only
                - --reasoning-parser
                - deepseek_v41
                - --dyn-reasoning-parser
                - deepseek_v41
                - --dyn-tool-call-parser
                - deepseek_v41
                - --dyn-enable-structural-tag
                - --kv-events-config
                - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557","enable_kv_cache_events":true}'
                - --max-cudagraph-capture-size
                - "512"
                - --prefix-cache-retention-interval
                - "1024"
                - --attention-config
                - '{"indexer_kv_dtype":"mxfp4"}'
                - --speculative-config
                - '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
              env:
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: "3600"
                - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
                  value: "300"
                - name: VLLM_ADAPTIVE_VERIFICATION_PROFILE_CONTEXT_LEN
                  value: "65536"
              ports:
                - name: system
                  containerPort: 9090
                  protocol: TCP
                - name: kv-events
                  containerPort: 5557
                  protocol: TCP
              livenessProbe:
                httpGet: {path: /live, port: system}
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 60
              readinessProbe:
                httpGet: {path: /health, port: system}
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 60
              startupProbe:
                httpGet: {path: /health, port: system}
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 120
              resources:
                requests:
                  cpu: "8"
                  memory: 512Gi
                  ephemeral-storage: 16Gi
                  nvidia.com/gpu: "4"
                limits:
                  nvidia.com/gpu: "4"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
