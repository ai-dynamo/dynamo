apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv41-flash-vllm-h200-disagg-agentic
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - args:
          - -m
          - dynamo.frontend
          - --http-port
          - '8000'
          command:
          - python3
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: DYN_ROUTER_MODE
            value: kv
          - name: DYN_ROUTER_DECODE_ACTIVE_REQUEST_WEIGHT
            value: '50'
          - name: DYN_ROUTER_CONDITIONAL_DISAGG
            value: 'true'
          - name: DYN_ROUTER_CONDITIONAL_DISAGG_CONFIG
            value: '{"policy":"isl_bounding","eff_isl_threshold":2048,"eff_isl_ratio_threshold":0.70,"decode_busy_threshold":0.50}'
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.6.0-ci-a2d5a6d72656851c96a8cad3f563326d7af9cb8c-vllm-runtime@sha256:13b928b02d11fb4990d01684166653178cd040db24fdff787e62075f56d99b58
          imagePullPolicy: IfNotPresent
          name: main
          ports:
          - containerPort: 8000
            name: http
            protocol: TCP
          resources:
            requests:
              cpu: '4'
              memory: 8Gi
    replicas: 1
    type: frontend
  - name: PrefillWorker
    podTemplate:
      spec:
        containers:
        - args:
          - -m
          - dynamo.vllm
          - --disaggregation-mode
          - prefill
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"],"num_threads":4}}'
          - --model
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --served-model-name
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --tokenizer-mode
          - deepseek_v41
          - --tensor-parallel-size
          - '4'
          - --kv-cache-dtype
          - fp8_ds_mla
          - --enable-expert-parallel
          - --moe-backend
          - flashinfer_cutlass
          - --enable-ep-weight-filter
          - --numa-bind
          - --language-model-only
          - --reasoning-parser
          - deepseek_v41
          - --dyn-reasoning-parser
          - deepseek_v41
          - --dyn-tool-call-parser
          - deepseek_v41
          - --dyn-enable-structural-tag
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557","enable_kv_cache_events":true}'
          - --max-cudagraph-capture-size
          - '512'
          - --prefix-cache-retention-interval
          - '1024'
          - --speculative-config
          - '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
          - --enable-eplb
          - --gpu-memory-utilization
          - '0.92'
          - --max-num-batched-tokens
          - '8192'
          - --max-num-seqs
          - '1024'
          command:
          - python3
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '3600'
          - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
            value: '300'
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.6.0-ci-a2d5a6d72656851c96a8cad3f563326d7af9cb8c-vllm-runtime@sha256:13b928b02d11fb4990d01684166653178cd040db24fdff787e62075f56d99b58
          imagePullPolicy: IfNotPresent
          name: main
          ports:
          - containerPort: 9090
            name: system
            protocol: TCP
          - containerPort: 5557
            name: kv-events
            protocol: TCP
          resources:
            requests:
              cpu: '16'
              ephemeral-storage: 64Gi
              memory: 512Gi
              nvidia.com/gpu: '4'
            limits:
              nvidia.com/gpu: '4'
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
          - mountPath: /shared-model-cache
            name: shared-model-cache
        terminationGracePeriodSeconds: 60
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
    replicas: 1
    sharedMemorySize: 200Gi
    type: prefill
  - name: DecodeWorker
    podTemplate:
      spec:
        containers:
        - args:
          - -m
          - dynamo.vllm
          - --disaggregation-mode
          - decode
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"],"num_threads":4}}'
          - --model
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --served-model-name
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --tokenizer-mode
          - deepseek_v41
          - --tensor-parallel-size
          - '4'
          - --kv-cache-dtype
          - fp8_ds_mla
          - --enable-expert-parallel
          - --moe-backend
          - flashinfer_cutlass
          - --enable-ep-weight-filter
          - --numa-bind
          - --language-model-only
          - --reasoning-parser
          - deepseek_v41
          - --dyn-reasoning-parser
          - deepseek_v41
          - --dyn-tool-call-parser
          - deepseek_v41
          - --dyn-enable-structural-tag
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557","enable_kv_cache_events":true}'
          - --max-cudagraph-capture-size
          - '512'
          - --prefix-cache-retention-interval
          - '1024'
          - --speculative-config
          - '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
          - --enable-eplb
          - --gpu-memory-utilization
          - '0.92'
          - --max-num-batched-tokens
          - '8192'
          - --max-num-seqs
          - '1024'
          command:
          - python3
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '3600'
          - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
            value: '300'
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.6.0-ci-a2d5a6d72656851c96a8cad3f563326d7af9cb8c-vllm-runtime@sha256:13b928b02d11fb4990d01684166653178cd040db24fdff787e62075f56d99b58
          imagePullPolicy: IfNotPresent
          name: main
          ports:
          - containerPort: 9090
            name: system
            protocol: TCP
          - containerPort: 5557
            name: kv-events
            protocol: TCP
          resources:
            requests:
              cpu: '16'
              ephemeral-storage: 64Gi
              memory: 512Gi
              nvidia.com/gpu: '4'
            limits:
              nvidia.com/gpu: '4'
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
          - mountPath: /shared-model-cache
            name: shared-model-cache
        terminationGracePeriodSeconds: 60
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
    replicas: 1
    sharedMemorySize: 200Gi
    type: decode
