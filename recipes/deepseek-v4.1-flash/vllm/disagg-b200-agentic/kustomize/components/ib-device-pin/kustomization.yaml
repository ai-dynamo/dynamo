# Pin UCX to named InfiniBand HCAs. The device list is node hardware, not
# recipe: read your own nodes and edit it. See ../../../../README.md.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: nvidia.com
      version: v1beta1
      kind: DynamoGraphDeployment
    path: patch-dgd.yaml
