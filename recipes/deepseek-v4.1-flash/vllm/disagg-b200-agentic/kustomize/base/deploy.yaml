apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv41-flash-vllm-b200-disagg-agentic
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.6.0-ci-a2d5a6d72656851c96a8cad3f563326d7af9cb8c-vllm-runtime@sha256:13b928b02d11fb4990d01684166653178cd040db24fdff787e62075f56d99b58
          imagePullPolicy: IfNotPresent
          command:
          - python3
          args:
          - -m
          - dynamo.frontend
          - --http-port
          - '8000'
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: DYN_ROUTER_MODE
            value: kv
          - name: DYN_ROUTER_CONDITIONAL_DISAGG
            value: 'true'
          - name: DYN_ROUTER_CONDITIONAL_DISAGG_CONFIG
            value: '{"policy":"isl_bounding","eff_isl_threshold":2048,"eff_isl_ratio_threshold":0.70,"decode_busy_threshold":0.50}'
          ports:
          - name: http
            containerPort: 8000
            protocol: TCP
          resources:
            requests:
              cpu: '16'
              memory: 128Gi
  - name: PrefillWorker
    type: prefill
    replicas: 1
    sharedMemorySize: 200Gi
    podTemplate:
      spec:
        terminationGracePeriodSeconds: 60
        containers:
        - name: main
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.6.0-ci-a2d5a6d72656851c96a8cad3f563326d7af9cb8c-vllm-runtime@sha256:13b928b02d11fb4990d01684166653178cd040db24fdff787e62075f56d99b58
          imagePullPolicy: IfNotPresent
          command:
          - python3
          args:
          - -m
          - dynamo.vllm
          - --disaggregation-mode
          - prefill
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"],"num_threads":4}}'
          - --model
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --served-model-name
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --tokenizer-mode
          - deepseek_v41
          - --tensor-parallel-size
          - '4'
          - --enable-expert-parallel
          - --moe-backend
          - deep_gemm_mega_moe
          - --enable-ep-weight-filter
          - --enable-eplb
          - --eplb-config
          - '{"communicator":"torch_gloo"}'
          - --numa-bind
          - --language-model-only
          - --reasoning-parser
          - deepseek_v41
          - --dyn-reasoning-parser
          - deepseek_v41
          - --dyn-tool-call-parser
          - deepseek_v41
          - --dyn-enable-structural-tag
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557","enable_kv_cache_events":true}'
          - --max-num-batched-tokens
          - '32768'
          - --long-prefill-token-threshold
          - '4096'
          - --max-cudagraph-capture-size
          - '512'
          - --prefix-cache-retention-interval
          - '1024'
          - --attention-config
          - '{"indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true,"backend":"FLASHMLA_MEGA_ATTN_DSV41"}'
          - --speculative-config
          - '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: UCX_CUDA_IPC_ENABLE_MNNVL
            value: n
          - name: UCX_MEMTYPE_CACHE
            value: y
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '3600'
          - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
            value: '300'
          ports:
          - name: system
            containerPort: 9090
            protocol: TCP
          - name: kv-events
            containerPort: 5557
            protocol: TCP
          resources:
            requests:
              cpu: '16'
              memory: 512Gi
              ephemeral-storage: 64Gi
              nvidia.com/gpu: '4'
            limits:
              nvidia.com/gpu: '4'
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
          volumeMounts:
          - name: shared-model-cache
            mountPath: /shared-model-cache
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
  - name: DecodeWorker
    type: decode
    replicas: 1
    sharedMemorySize: 200Gi
    podTemplate:
      spec:
        terminationGracePeriodSeconds: 60
        containers:
        - name: main
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.6.0-ci-a2d5a6d72656851c96a8cad3f563326d7af9cb8c-vllm-runtime@sha256:13b928b02d11fb4990d01684166653178cd040db24fdff787e62075f56d99b58
          imagePullPolicy: IfNotPresent
          command:
          - python3
          args:
          - -m
          - dynamo.vllm
          - --disaggregation-mode
          - decode
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"],"num_threads":4}}'
          - --model
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --served-model-name
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --tokenizer-mode
          - deepseek_v41
          - --tensor-parallel-size
          - '4'
          - --enable-expert-parallel
          - --moe-backend
          - deep_gemm_mega_moe
          - --enable-ep-weight-filter
          - --enable-eplb
          - --eplb-config
          - '{"communicator":"torch_gloo"}'
          - --numa-bind
          - --language-model-only
          - --reasoning-parser
          - deepseek_v41
          - --dyn-reasoning-parser
          - deepseek_v41
          - --dyn-tool-call-parser
          - deepseek_v41
          - --dyn-enable-structural-tag
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557","enable_kv_cache_events":true}'
          - --max-cudagraph-capture-size
          - '1024'
          - --prefix-cache-retention-interval
          - '1024'
          - --attention-config
          - '{"indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true,"backend":"FLASHMLA_MEGA_ATTN_DSV41"}'
          - --speculative-config
          - '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: UCX_CUDA_IPC_ENABLE_MNNVL
            value: n
          - name: UCX_MEMTYPE_CACHE
            value: y
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '3600'
          - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
            value: '300'
          ports:
          - name: system
            containerPort: 9090
            protocol: TCP
          - name: kv-events
            containerPort: 5557
            protocol: TCP
          resources:
            requests:
              cpu: '16'
              memory: 512Gi
              ephemeral-storage: 64Gi
              nvidia.com/gpu: '4'
            limits:
              nvidia.com/gpu: '4'
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
          volumeMounts:
          - name: shared-model-cache
            mountPath: /shared-model-cache
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
