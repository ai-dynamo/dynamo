# DeepSeek-V4.1-Flash on vLLM, aggregated. Two workers, TP4 each, 8x B200.
# KV-aware routing, DSpark speculative decoding, up to 1M tokens of context.
#
# This is the same serving configuration the GB200 aggregated recipe uses. Only
# the architecture label, the GPU product label, and the deployment name differ.
#
# Do not set --attention-backend, --moe-backend beyond what is here, or
# --linear-backend. vLLM resolves the rest for this model, and a mistyped
# --attention-backend value does not error: it silently falls through to a
# slower fallback. Do not set --block-size either; it resolves to 128 for this
# backend, and the DeepSeek-V4-Flash recipes' 256 belongs to a different model.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv41-flash-vllm-b200-agg
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          tolerations:
            - key: kubernetes.io/arch
              operator: Exists
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-deepseek-v4.1-flash-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3, -m, dynamo.frontend]
              args:
                - --http-port
                - "8000"
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                # The router scores workers from the KV events the workers
                # publish. See --kv-events-config on the worker.
                - name: DYN_ROUTER_MODE
                  value: kv
                # Balance decode batch size across the two replicas. The default
                # is 0.0, which optimizes purely for prefix overlap. That holds
                # to concurrency 80; past it the router concentrates work on one
                # worker, which then queues. Units are KV blocks of equivalent
                # decode cost per active request.
                - name: DYN_ROUTER_DECODE_ACTIVE_REQUEST_WEIGHT
                  value: "50"
              ports:
                - name: http
                  containerPort: 8000
                  protocol: TCP
              resources:
                requests:
                  cpu: "4"
                  memory: 8Gi
    - name: Worker
      type: worker
      replicas: 2
      sharedMemorySize: 200Gi
      podTemplate:
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-B200
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
            - key: kubernetes.io/arch
              operator: Exists
              effect: NoSchedule
          terminationGracePeriodSeconds: 60
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-deepseek-v4.1-flash-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3, -m, dynamo.vllm]
              args:
                - --model
                - deepseek-ai/DeepSeek-V4.1-Flash
                - --served-model-name
                - deepseek-ai/DeepSeek-V4.1-Flash
                - --tokenizer-mode
                - deepseek_v41
                - --tensor-parallel-size
                - "4"
                # Expert parallelism gates the MegaMoE backend below: every
                # member of that family refuses to load without it.
                - --enable-expert-parallel
                - --moe-backend
                - deep_gemm_mega_moe
                # Load-time only. Each rank reads just its own expert shard from
                # disk, which shortens model load on a 510 GB checkpoint.
                - --enable-ep-weight-filter
                # Expert-parallel load balancing. The communicator is named
                # explicitly: it defaults to None, which prefers NIXL, and NIXL
                # is not in this image.
                - --enable-eplb
                - --eplb-config
                - '{"communicator":"torch_gloo"}'
                # The engram tables are pinned host memory, about 47 GiB per
                # rank, read over UVA on every token, so NUMA placement matters.
                - --numa-bind
                # The checkpoint accepts images. This recipe serves text, so
                # drop the vision tower and its encoder cache.
                - --language-model-only
                # Two reasoning parsers, and both are required. The engine-side
                # one gates guided decoding; the Dynamo-side one splits the
                # response into reasoning_content and content. Do not also set
                # the engine-side --tool-call-parser: Dynamo refuses both halves
                # of the tool-call pair at once.
                - --reasoning-parser
                - deepseek_v41
                - --dyn-reasoning-parser
                - deepseek_v41
                - --dyn-tool-call-parser
                - deepseek_v41
                # Without this, response_format is accepted but never enforced.
                - --dyn-enable-structural-tag
                # enable_kv_cache_events is load-bearing. Omit it and it
                # defaults to false, Dynamo logs "KV event publishing skipped",
                # and DYN_ROUTER_MODE=kv silently degrades to load-based
                # routing with overlap_blocks=0 on every request.
                - --kv-events-config
                - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557","enable_kv_cache_events":true}'
                # A decode step is num_reqs x (1 + num_spec) tokens, so sizes
                # above 512 are captured and never replayed.
                - --max-cudagraph-capture-size
                - "512"
                # The single largest lever on this workload. The resolved
                # default is 0, which tells the sliding-window group to retain
                # only a 160-token tail at the previous prompt end. The
                # reconciled prefix hit is the minimum across groups, so that
                # tail caps every request. 1024 keeps one tail per 1024 tokens.
                # Must be a multiple of the scheduler block size.
                - --prefix-cache-retention-interval
                - "1024"
                # The DeepSeek sparse indexer K cache, fp8 to mxfp4. "auto"
                # resolves to fp8, so fp8 is the baseline, not bf16. mxfp4
                # requires compute capability 10.0; GB200 and B200 both qualify,
                # sm_120 consumer Blackwell does not. fp8 and mxfp4 are the only
                # two accepted values.
                - --attention-config
                - '{"indexer_kv_dtype":"mxfp4"}'
                # DSpark. The checkpoint's own dspark_block_size is 5; depth 3
                # measured better here. Do not copy DeepSeek-V4-Flash's 7.
                # Adaptive verification is off: it is the established cause of a
                # CUDA illegal memory access on this model, and turning it off
                # also forbids --enforce-eager, which that path requires.
                - --speculative-config
                - '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
              env:
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                # The default is 600 s. This checkpoint is 510 GB and engine
                # init alone measures over 600 s, after a silent engram load.
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: "3600"
                # Dynamo marks an endpoint notready when its canary health check
                # times out, and /live then returns 503, which the kubelet kills
                # on. The default is 3 seconds. The canary queues behind real
                # work, so any prefill longer than 3 s makes a healthy worker
                # report dead.
                - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
                  value: "300"
                # A corrected default, not an optimization. The
                # adaptive-verification cost curve profiles at 8192 tokens of KV
                # by default, against an agentic input median near 67,000.
                - name: VLLM_ADAPTIVE_VERIFICATION_PROFILE_CONTEXT_LEN
                  value: "65536"
              ports:
                - name: system
                  containerPort: 9090
                  protocol: TCP
                - name: kv-events
                  containerPort: 5557
                  protocol: TCP
              # The operator default is failureThreshold 1 with a 4 s timeout,
              # so one failed probe restarts the worker. The failure mode here
              # is a 503 rather than a timeout: the endpoint answers and reports
              # not-live while the scheduler is inside a forward pass. Only
              # failureThreshold buys anything. readinessProbe matters too, because
              # a 503 there pulls the worker out of the Service and its peer
              # then takes all the load.
              livenessProbe:
                httpGet: {path: /live, port: system}
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 60
              readinessProbe:
                httpGet: {path: /health, port: system}
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 60
              # Separate on purpose: first boot measures about 46 minutes to
              # ready on this SKU, dominated by a silent engram read with the
              # GPUs at 0 percent. Every other operator signal in that window
              # says "hung". 120 x 30 s = 60 minutes.
              startupProbe:
                httpGet: {path: /health, port: system}
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 120
              resources:
                requests:
                  cpu: "8"
                  # Must clear the pinned engram host memory, about 189 GiB per
                  # node at TP4, with real headroom. No limit is set on purpose:
                  # a hard limit turns a pinned-allocation spike into an
                  # OOMKill rather than reclaim.
                  memory: 512Gi
                  ephemeral-storage: 16Gi
                  nvidia.com/gpu: "4"
                limits:
                  nvidia.com/gpu: "4"
              # Workers run as root because FlashInfer's TRT-LLM FP4 MoE JIT
              # writes cubins into a root-owned site-packages directory during
              # determine_available_memory.
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
