# DeepSeek-V4.1-Flash on vLLM, disaggregated. Two prefill workers and one
# decode worker, TP4 each, 12x GB200. Up to 1M tokens of context.
#
# Both pools carry the aggregated recipe's full flag set. What differs is the
# prefill batch budget, the long-prefill cap, the decode CUDA-graph ceiling,
# and the NIXL transport below.
#
# 2 prefill to 1 decode is balanced for this workload, not a free parameter.
# Both sides saturate together at the ship point: the prefill queue grows into
# TTFT, which still holds headroom, while decode ITL grows into the per-user
# token rate, which is what binds. Every other ratio measured worse or the same
# per GPU.
#
# A GB200 node holds 4 GPUs, so each TP4 worker is one node and KV always
# crosses nodes. ALL POOLS MUST SHARE ONE NVLINK CLIQUE: a fabric memory handle
# cannot be imported across cliques, and a split placement does NOT error. The
# deployment reports Ready and chat completions return HTTP 200 with content
# null. The ComputeDomain below is the supported mechanism for that guarantee.
#
# Each worker also requests an RDMA device for the KV transfer. The `rdma/ib`
# resource name is what the reference cluster advertises; other providers
# expose RDMA differently, and GKE uses its own multi-network Component
# instead. This is the field to retarget first. See README.md.
#
# Do not set --attention-backend, --moe-backend beyond what is here, or
# --linear-backend. vLLM resolves the rest for this model, and a mistyped
# --attention-backend value does not error: it silently falls through to a
# slower fallback. Do not set --block-size either; it resolves to 128 for this
# backend, and the DeepSeek-V4-Flash recipes' 256 belongs to a different model.
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: dsv41-flash-vllm-gb200-disagg-compute-domain
spec:
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: dsv41-flash-vllm-gb200-disagg-compute-domain-channel
  # numNodes 0 lets the driver size the domain from the pods that claim it.
  numNodes: 0
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv41-flash-vllm-gb200-disagg
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - args:
          - --http-port
          - "8000"
          command:
          - python3
          - -m
          - dynamo.frontend
          env:
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: TRANSFORMERS_OFFLINE
            value: "1"
          - name: DYN_ROUTER_MODE
            value: kv
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-deepseek-v4.1-flash-dev.1
          imagePullPolicy: IfNotPresent
          name: main
          ports:
          - containerPort: 8000
            name: http
            protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
        - effect: NoSchedule
          key: kubernetes.io/arch
          operator: Exists
    replicas: 1
    type: frontend
  - name: PrefillWorker
    podTemplate:
      spec:
        containers:
        - args:
          - --disaggregation-mode
          - prefill
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_buffer_device":"cuda"}'
          - --model
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --served-model-name
          - deepseek-ai/DeepSeek-V4.1-Flash
          - --tokenizer-mode
          - deepseek_v41
          - --tensor-parallel-size
          - "4"
          # Expert parallelism gates the MegaMoE backend below: every
          # member of that family refuses to load without it.
          - --enable-expert-parallel
          - --moe-backend
          - deep_gemm_mega_moe
          # Load-time only. Each rank reads just its own expert shard from
          # disk, which shortens model load on a 510 GB checkpoint.
          - --enable-ep-weight-filter
          # Expert-parallel load balancing. The communicator is named
          # explicitly: it defaults to None, which prefers NIXL.
          - --enable-eplb
          - --eplb-config
          - '{"communicator":"torch_gloo"}'
          # The engram tables are pinned host memory, about 47 GiB per
          # rank, read over UVA on every token, so NUMA placement matters.
          - --numa-bind
          # The checkpoint accepts images. This recipe serves text, so
          # drop the vision tower and its encoder cache.
          - --language-model-only
          # Two reasoning parsers, and both are required. The engine-side
          # one gates guided decoding; the Dynamo-side one splits the
          # response into reasoning_content and content. Do not also set
          # the engine-side --tool-call-parser: Dynamo refuses both halves
          # of the tool-call pair at once.
          - --reasoning-parser
          - deepseek_v41
          - --dyn-reasoning-parser
          - deepseek_v41
          - --dyn-tool-call-parser
          - deepseek_v41
          # Without this, response_format is accepted but never enforced.
          - --dyn-enable-structural-tag
          # enable_kv_cache_events is load-bearing. Omit it and it
          # defaults to false and DYN_ROUTER_MODE=kv silently degrades to
          # load-based routing.
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557","enable_kv_cache_events":true}'
          # PREFILL ONLY. An agentic input median near 67,000 tokens
          # against the 16,384 default means one request's chunk fills the
          # batch, so the pool runs one request at a time and serializes.
          - --max-num-batched-tokens
          - "32768"
          # PREFILL ONLY. Defaults to 0, which disables it, so one giant
          # request takes the whole batch budget for a step and starves
          # the queue behind it. This caps only the rows past the
          # threshold; queued requests still fill the rest of the step, so
          # GEMM efficiency holds. It redistributes wait rather than
          # removing it: the giants slow down and everything behind them
          # speeds up, so the TTFT tail pays for the median. 8192 is the
          # tail-safe setting, about 3 percent slower with a much shorter
          # p99 TTFT.
          - --long-prefill-token-threshold
          - "4096"
          - --max-cudagraph-capture-size
          - "512"
          # The single largest lever on this workload. The resolved
          # default is 0, which retains only a 160-token tail at the
          # previous prompt end, and the reconciled prefix hit is the
          # minimum across groups, so that tail caps every request.
          - --prefix-cache-retention-interval
          - "1024"
          # The DeepSeek sparse indexer K cache, fp8 to mxfp4. "auto"
          # resolves to fp8, so fp8 is the baseline, not bf16. mxfp4
          # requires compute capability 10.0; GB200 and B200 both qualify.
          - --attention-config
          - '{"indexer_kv_dtype":"mxfp4"}'
          # DSpark. The checkpoint's own dspark_block_size is 5; depth 3
          # measured better here. Adaptive verification is off: it is the
          # established cause of a CUDA illegal memory access on this
          # model.
          - --speculative-config
          - '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
          command:
          - python3
          - -m
          - dynamo.vllm
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: UCX_TLS
            value: cuda_copy,cuda_ipc,tcp,rc
          - name: UCX_RC_TIMEOUT
            value: 600s
          - name: UCX_KEEPALIVE_INTERVAL
            value: 300s
          - name: UCX_CUDA_IPC_ENABLE_MNNVL
            value: "y"
          - name: UCX_MEMTYPE_CACHE
            value: "n"
          - name: TRANSFORMERS_OFFLINE
            value: "1"
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: "3600"
          - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
            value: "300"
          - name: VLLM_ADAPTIVE_VERIFICATION_PROFILE_CONTEXT_LEN
            value: "65536"
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-deepseek-v4.1-flash-dev.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 60
            httpGet:
              path: /live
              port: system
            periodSeconds: 10
            timeoutSeconds: 10
          name: main
          ports:
          - containerPort: 9090
            name: system
            protocol: TCP
          - containerPort: 5557
            name: kv-events
            protocol: TCP
          readinessProbe:
            failureThreshold: 60
            httpGet:
              path: /health
              port: system
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              nvidia.com/gpu: "4"
              rdma/ib: "4"
            requests:
              cpu: "8"
              ephemeral-storage: 16Gi
              memory: 512Gi
              nvidia.com/gpu: "4"
              rdma/ib: "4"
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
            runAsGroup: 0
            runAsUser: 0
          startupProbe:
            failureThreshold: 120
            httpGet:
              path: /health
              port: system
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
          - mountPath: /shared-model-cache
            name: shared-model-cache
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-GB200
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: dsv41-flash-vllm-gb200-disagg-compute-domain-channel
        terminationGracePeriodSeconds: 60
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - effect: NoSchedule
          key: kubernetes.io/arch
          operator: Exists
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
    replicas: 2
    sharedMemorySize: 200Gi
    type: worker
