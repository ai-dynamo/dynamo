#
# DeepSeek-V4.1-Flash on DeepInfer (python -m dynamo.deepinfer), disaggregated: one prefill
# and one decode worker, each four DP ranks with EP4 on its own 4x GB200 node (8 GPUs).
# The prefill worker keeps the prefix cache and publishes KV events. Decode reads each
# request's KV blocks and state from prefill over NIXL (UCX).
#
# The pod setup matches ../agg-gb200/deploy.yaml (IMEX channel, RDMA NICs for NCCL GIN,
# CPU-pinning shim). Disaggregation adds:
# - UCX over RoCE. MNNVL cuda_ipc cannot carry DeepInfer's cuMemAlloc KV pools across nodes,
#   so the transfer runs on the rc transport.
# - UCX_NET_DEVICES=mlx5_0:1 (NIXL only). GKE's rdma-0..3 are isolated rails and any prefill rank can
#   hand off to any decode rank, so every rank uses rail 0. Rail 0 is routed between nodes.
# - The same DEEPINFER_YOCO_* values on both workers. They are part of the KV layout hash,
#   and a mismatch fails every handoff.
# Do not enable conditional disaggregation on the frontend: a decode worker cannot prefill.
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: dsv41-flash-deepinfer-gb200-disagg-compute-domain
spec:
  # numNodes 0 lets the driver size the domain from the pods that claim it.
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: dsv41-flash-deepinfer-gb200-disagg-compute-domain-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv41-flash-deepinfer-gb200-disagg
spec:
  # No backendFramework: the operator treats dynamo.deepinfer as a generic worker.
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    # The image tag is not a Dynamo version; this is the runtime it carries (1.6.0.dev20261019).
    runtimeVersionOverride: 1.6.0
    podTemplate:
      spec:
        imagePullSecrets:
        - name: nvcr-imagepullsecret
        # The image is arm64 only.
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        containers:
        - name: main
          image: <your-registry>/deepinfer-dynamo:<tag>  # examples/backends/deepinfer/Dockerfile
          imagePullPolicy: IfNotPresent
          # The frontend has its own venv with the full ai-dynamo dependency set.
          command:
          - /opt/dynamo-frontend/bin/python
          args:
          - -m
          - dynamo.frontend
          - --http-port
          - "8000"
          - --router-mode
          - kv
          env:
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: TRANSFORMERS_OFFLINE
            value: "1"
          # Keep the worker's DeepInfer and dynamo.deepinfer paths out of the frontend.
          - name: PYTHONPATH
            value: ""
          ports:
          - name: http
            containerPort: 8000
            protocol: TCP
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
  - name: PrefillWorker
    type: prefill
    replicas: 1
    runtimeVersionOverride: 1.6.0
    # /dev/shm: 64Gi ran out of space. Crashed ranks leave segments behind, and a container
    # restart keeps them.
    sharedMemorySize: 300Gi
    podTemplate:
      metadata:
        annotations:
          networking.gke.io/default-interface: eth0
          networking.gke.io/interfaces: '[{"interfaceName":"eth0","network":"default"},{"interfaceName":"rdma0","network":"rdma-0"},{"interfaceName":"rdma1","network":"rdma-1"},{"interfaceName":"rdma2","network":"rdma-2"},{"interfaceName":"rdma3","network":"rdma-3"}]'
      spec:
        imagePullSecrets:
        - name: nvcr-imagepullsecret
        # A GB200 node pool with the rdma-0..3 networks; set the pool name for your cluster.
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-GB200
        tolerations:
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: dsv41-flash-deepinfer-gb200-disagg-compute-domain-channel
        terminationGracePeriodSeconds: 60
        containers:
        - name: main
          image: <your-registry>/deepinfer-dynamo:<tag>  # examples/backends/deepinfer/Dockerfile
          imagePullPolicy: IfNotPresent
          command:
          - /bin/bash
          - -c
          args:
          - |
            set -euo pipefail
            test -r "${DEEPINFER_HF_MODEL_DIR}/config.json" || {
              echo "No checkpoint at ${DEEPINFER_HF_MODEL_DIR}; run the model-download Job" >&2; exit 42; }
            # Only pods with the RDMA networks attached get uverbs devices;
            # /sys/class/infiniband lists the host NICs either way.
            compgen -G "/dev/infiniband/uverbs*" > /dev/null || {
              echo "No RDMA devices: NCCL GIN and NIXL need the rdma-0..3 networks" >&2; exit 43; }
            exec python -m dynamo.deepinfer \
              --model "${DEEPINFER_HF_MODEL_DIR}" \
              --served-model-name deepseek-ai/DeepSeek-V4.1-Flash \
              --disaggregation-mode prefill \
              --kv-transfer nixl \
              --dp-size 4 \
              --ep-size 4 \
              --max-model-len 1048576 \
              --max-num-batched-tokens 16384 \
              --max-num-seqs 64 \
              --prefix-snapshot-slots 4096 \
              --kv-cache-manager prefix \
              --dyn-reasoning-parser deepseek_v41 \
              --dyn-tool-call-parser deepseek_v41
          env:
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: TRANSFORMERS_OFFLINE
            value: "1"
          - name: PYTHONUNBUFFERED
            value: "1"
          # The model-download Job's revision of deepseek-ai/DeepSeek-V4.1-Flash. Its config.json
          # and tokenizer match DeepInfer's reference checkpoint, DeepSeek-V4.1-Flash-1017.
          - name: DEEPINFER_HF_MODEL_DIR
            value: /shared-model-cache/hub/models--deepseek-ai--DeepSeek-V4.1-Flash/snapshots/dba1be0a40aa45a94ad051997016db3960a90277
          # sitecustomize.py first; the rest is the image's own PYTHONPATH.
          - name: PYTHONPATH
            value: /opt/deepinfer-site:/opt/dynamo-deepinfer:/opt/DeepInfer
          - name: DEEPINFER_LOCAL_NGPUS
            value: "4"
          - name: DEEPINFER_JIT_CACHE_DIR
            value: /cache/jit
          - name: TRITON_CACHE_DIR
            value: /cache/triton
          - name: XDG_CACHE_HOME
            value: /cache
          # The prefix cache needs compact YOCO truncation. Decode sets the same values.
          - name: DEEPINFER_YOCO_PREFILL_TRUNCATION_MODE
            value: compact
          - name: DEEPINFER_YOCO_PREFILL_KEEP_TOKENS
            value: "140"
          # eth0 is the pod network. NCCL and Gloo must not bootstrap over an RDMA interface.
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: NCCL_MNNVL_ENABLE
            value: "1"
          - name: NCCL_CUMEM_ENABLE
            value: "1"
          - name: NCCL_NVLS_ENABLE
            value: "1"
          # GKE's rdma-0..3 are isolated rails (a multi-plane network): keep every NCCL/GIN
          # communicator on its own rail. Forcing all ranks onto mlx5_0 instead costs ~30% prefill.
          # DeepEP hybrid mode shares Engram storage via pidfd_getfd (needs SYS_PTRACE below).
          # Leave EP_DISABLE_GIN unset.
          - name: NCCL_CROSS_NIC
            value: "0"
          - name: UCX_TLS
            value: cuda_copy,cuda_ipc,tcp,rc
          - name: UCX_NET_DEVICES
            value: mlx5_0:1
          - name: UCX_IB_GID_INDEX
            value: "3"
          - name: UCX_CUDA_IPC_ENABLE_MNNVL
            value: "y"
          - name: UCX_MEMTYPE_CACHE
            value: "n"
          - name: UCX_RCACHE_MAX_UNRELEASED
            value: "1024"
          ports:
          - name: system
            containerPort: 9090
            protocol: TCP
          resources:
            claims:
            - name: compute-domain-channel
            requests:
              cpu: "120"
              memory: 700Gi
              ephemeral-storage: 100Gi
              nvidia.com/gpu: "4"
            # Kubernetes copies extended-resource limits into requests.
            limits:
              cpu: "136"
              memory: 840Gi
              ephemeral-storage: 200Gi
              nvidia.com/gpu: "4"
              networking.gke.io.networks/rdma-0: "1"
              networking.gke.io.networks/rdma-0.IP: "1"
              networking.gke.io.networks/rdma-1: "1"
              networking.gke.io.networks/rdma-1.IP: "1"
              networking.gke.io.networks/rdma-2: "1"
              networking.gke.io.networks/rdma-2.IP: "1"
              networking.gke.io.networks/rdma-3: "1"
              networking.gke.io.networks/rdma-3.IP: "1"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
          # DeepInfer aborts a checkpoint load after 30 min; JIT warmup follows. The worker
          # serves /live only after every rank is ready.
          startupProbe:
            httpGet:
              path: /live
              port: system
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 720
          volumeMounts:
          - name: shared-model-cache
            mountPath: /shared-model-cache
          - name: cache
            mountPath: /cache
          - name: deepinfer-site
            mountPath: /opt/deepinfer-site
            readOnly: true
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        # JIT kernels and Triton caches. Survives container restarts, not pod deletion.
        - name: cache
          emptyDir:
            sizeLimit: 100Gi
        - name: deepinfer-site
          configMap:
            name: deepinfer-sitecustomize
  - name: DecodeWorker
    type: decode
    replicas: 1
    runtimeVersionOverride: 1.6.0
    sharedMemorySize: 300Gi
    podTemplate:
      metadata:
        annotations:
          networking.gke.io/default-interface: eth0
          networking.gke.io/interfaces: '[{"interfaceName":"eth0","network":"default"},{"interfaceName":"rdma0","network":"rdma-0"},{"interfaceName":"rdma1","network":"rdma-1"},{"interfaceName":"rdma2","network":"rdma-2"},{"interfaceName":"rdma3","network":"rdma-3"}]'
      spec:
        imagePullSecrets:
        - name: nvcr-imagepullsecret
        # A GB200 node pool with the rdma-0..3 networks; set the pool name for your cluster.
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-GB200
        tolerations:
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: dsv41-flash-deepinfer-gb200-disagg-compute-domain-channel
        terminationGracePeriodSeconds: 60
        containers:
        - name: main
          image: <your-registry>/deepinfer-dynamo:<tag>  # examples/backends/deepinfer/Dockerfile
          imagePullPolicy: IfNotPresent
          command:
          - /bin/bash
          - -c
          args:
          - |
            set -euo pipefail
            test -r "${DEEPINFER_HF_MODEL_DIR}/config.json" || {
              echo "No checkpoint at ${DEEPINFER_HF_MODEL_DIR}; run the model-download Job" >&2; exit 42; }
            # Only pods with the RDMA networks attached get uverbs devices;
            # /sys/class/infiniband lists the host NICs either way.
            compgen -G "/dev/infiniband/uverbs*" > /dev/null || {
              echo "No RDMA devices: NCCL GIN and NIXL need the rdma-0..3 networks" >&2; exit 43; }
            exec python -m dynamo.deepinfer \
              --model "${DEEPINFER_HF_MODEL_DIR}" \
              --served-model-name deepseek-ai/DeepSeek-V4.1-Flash \
              --disaggregation-mode decode \
              --kv-transfer nixl \
              --dp-size 4 \
              --ep-size 4 \
              --max-model-len 1048576 \
              --max-num-seqs 128 \
              --dyn-reasoning-parser deepseek_v41 \
              --dyn-tool-call-parser deepseek_v41
          env:
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: TRANSFORMERS_OFFLINE
            value: "1"
          - name: PYTHONUNBUFFERED
            value: "1"
          - name: DEEPINFER_HF_MODEL_DIR
            value: /shared-model-cache/hub/models--deepseek-ai--DeepSeek-V4.1-Flash/snapshots/dba1be0a40aa45a94ad051997016db3960a90277
          - name: PYTHONPATH
            value: /opt/deepinfer-site:/opt/dynamo-deepinfer:/opt/DeepInfer
          - name: DEEPINFER_LOCAL_NGPUS
            value: "4"
          - name: DEEPINFER_JIT_CACHE_DIR
            value: /cache/jit
          - name: TRITON_CACHE_DIR
            value: /cache/triton
          - name: XDG_CACHE_HOME
            value: /cache
          # Must equal the prefill worker's values (KV layout hash).
          - name: DEEPINFER_YOCO_PREFILL_TRUNCATION_MODE
            value: compact
          - name: DEEPINFER_YOCO_PREFILL_KEEP_TOKENS
            value: "140"
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: NCCL_MNNVL_ENABLE
            value: "1"
          - name: NCCL_CUMEM_ENABLE
            value: "1"
          - name: NCCL_NVLS_ENABLE
            value: "1"
          # One NCCL/GIN communicator per rail (see PrefillWorker).
          - name: NCCL_CROSS_NIC
            value: "0"
          - name: UCX_TLS
            value: cuda_copy,cuda_ipc,tcp,rc
          - name: UCX_NET_DEVICES
            value: mlx5_0:1
          - name: UCX_IB_GID_INDEX
            value: "3"
          - name: UCX_CUDA_IPC_ENABLE_MNNVL
            value: "y"
          - name: UCX_MEMTYPE_CACHE
            value: "n"
          - name: UCX_RCACHE_MAX_UNRELEASED
            value: "1024"
          ports:
          - name: system
            containerPort: 9090
            protocol: TCP
          resources:
            claims:
            - name: compute-domain-channel
            requests:
              cpu: "120"
              memory: 700Gi
              ephemeral-storage: 100Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "136"
              memory: 840Gi
              ephemeral-storage: 200Gi
              nvidia.com/gpu: "4"
              networking.gke.io.networks/rdma-0: "1"
              networking.gke.io.networks/rdma-0.IP: "1"
              networking.gke.io.networks/rdma-1: "1"
              networking.gke.io.networks/rdma-1.IP: "1"
              networking.gke.io.networks/rdma-2: "1"
              networking.gke.io.networks/rdma-2.IP: "1"
              networking.gke.io.networks/rdma-3: "1"
              networking.gke.io.networks/rdma-3.IP: "1"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
          startupProbe:
            httpGet:
              path: /live
              port: system
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 720
          volumeMounts:
          - name: shared-model-cache
            mountPath: /shared-model-cache
          - name: cache
            mountPath: /cache
          - name: deepinfer-site
            mountPath: /opt/deepinfer-site
            readOnly: true
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        - name: cache
          emptyDir:
            sizeLimit: 100Gi
        - name: deepinfer-site
          configMap:
            name: deepinfer-sitecustomize
