---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sglang-qwen38max-agg-chat-config
data:
  agg.yaml: |-
    served-model-name: Qwen/Qwen3.8-2.4T-A95B-FP8
    trust-remote-code: true
    quantization: fp8
    kv-cache-dtype: fp8_e4m3
    tensor-parallel-size: 16
    expert-parallel-size: 1
    context-length: 262144
    mem-fraction-static: 0.90
    max-running-requests: 256
    speculative-algorithm: NEXTN
    speculative-num-steps: 3
    speculative-eagle-topk: 1
    speculative-num-draft-tokens: 4
    speculative-moe-runner-backend: flashinfer_trtllm
    chunked-prefill-size: 8192
    max-prefill-tokens: 8192
    page-size: 64
    attention-backend: trtllm_mha
    linear-attn-prefill-backend: flashinfer
    linear-attn-decode-backend: flashinfer
    moe-runner-backend: flashinfer_trtllm
    moe-a2a-backend: none
    mamba-ssm-dtype: bfloat16
    flashinfer-allreduce-fusion-backend: mnnvl
    weight-loader-prefetch-checkpoints: true
    weight-loader-prefetch-num-threads: 4
    cuda-graph-backend-decode: full
    disable-decode-cuda-graph: false
    decode-log-interval: 1
    enable-cache-report: true
    enable-metrics: true
    watchdog-timeout: 900
    kv-events-config:
      publisher: zmq
      topic: kv-events
      endpoint: tcp://*:5571
---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: sglang-qwen38max-compute-domain
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: sglang-qwen38max-compute-domain-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-qwen38max-agg
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-GB300
          volumes:
            - name: model-cache
              persistentVolumeClaim: {claimName: model-cache}
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.0-qwen-3.8-2.4t-dev.1
              securityContext: {runAsUser: 0}
              command: [python3, -m, dynamo.frontend]
              args: [--router-mode, kv, --router-kv-events, --http-port, "8000"]
              env:
                - {name: HF_HUB_OFFLINE, value: "1"}
                - {name: TRANSFORMERS_OFFLINE, value: "1"}
              volumeMounts:
                - {name: model-cache, mountPath: /model-cache, readOnly: true}

    - name: SglangWorker
      type: worker
      replicas: 1
      multinode:
        nodeCount: 4

      podTemplate:
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-GB300
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - {key: nvidia.com/gpu.product, operator: In, values: [NVIDIA-GB300]}
          resourceClaims:
            - {name: compute-domain-channel, resourceClaimTemplateName: sglang-qwen38max-compute-domain-channel}
          volumes:
            - name: sglang-config
              configMap: {name: sglang-qwen38max-agg-chat-config}
            - name: model-cache
              persistentVolumeClaim: {claimName: model-cache}
            - name: dshm
              emptyDir: {medium: Memory}
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.0-qwen-3.8-2.4t-dev.1
              securityContext:
                runAsUser: 0
                capabilities: {add: [IPC_LOCK, SYS_RESOURCE]}
              resources:
                limits: {nvidia.com/gpu: "4"}
                requests: {nvidia.com/gpu: "4"}
                claims: [{name: compute-domain-channel}]
              volumeMounts:
                - {name: sglang-config, mountPath: /etc/sglang, readOnly: true}
                - {name: model-cache, mountPath: /model-cache, readOnly: true}
                - {name: dshm, mountPath: /dev/shm}
              startupProbe:
                httpGet: {path: /live, port: 9090}
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 720
              env:
                - {name: HF_HOME, value: /model-cache}
                - {name: HF_HUB_OFFLINE, value: "1"}
                - {name: TRANSFORMERS_OFFLINE, value: "1"}
                - {name: PYTHONUNBUFFERED, value: "1"}
                - {name: NCCL_SOCKET_IFNAME, value: eth0}
                - {name: GLOO_SOCKET_IFNAME, value: eth0}
                - {name: NCCL_DEBUG, value: WARN}
                - {name: NCCL_MNNVL_ENABLE, value: "1"}
                - {name: NCCL_CUMEM_ENABLE, value: "1"}
                - {name: SGLANG_FLASHINFER_AUTOTUNE_CACHE, value: "1"}
                - {name: SGLANG_UNBALANCED_MODEL_LOADING_TIMEOUT_S, value: "3600"}
              command: [/bin/bash, -lc]
              args:
                - |
                  set -euo pipefail
                  ulimit -l unlimited || true
                  ulimit -n 1048576 || true
                  # Dynamo's forward-pass metrics adapter crashes on MTP decode in this
                  # image (seq_lens_cpu is unset). Keep SGLang Prometheus metrics enabled.
                  unset DYN_FORWARDPASS_METRIC_PORT
                  exec python3 -m dynamo.sglang \
                    --config /etc/sglang/agg.yaml \
                    --model-path Qwen/Qwen3.8-2.4T-A95B-FP8 \
                    --dyn-reasoning-parser qwen3 \
                    --dyn-tool-call-parser qwen3_coder \
                    --cuda-graph-backend-prefill breakable \
                    --cuda-graph-max-bs-prefill 8192 \
                    --mamba-radix-cache-strategy extra_buffer
