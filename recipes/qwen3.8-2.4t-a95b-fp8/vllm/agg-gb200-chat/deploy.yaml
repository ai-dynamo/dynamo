#
# Qwen3.8-2.4T-A95B on vLLM via Dynamo, aggregated, GB200 (TP=16) over MNNVL.
---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: qwen38max-agg-cd
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: qwen38max-agg-cd-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen38max-agg
  labels:
    app.kubernetes.io/name: qwen38max-agg
    engine: vllm
    hardware: gb200
    mode: agg

spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-GB200
        tolerations:
        - {key: kubernetes.io/arch, operator: Equal, value: arm64,         effect: NoSchedule}
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0-qwen-3.8-2.4t-dev.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
          - python3 -m dynamo.frontend --router-mode kv --http-port 8000 --router-kv-events
              --kv-cache-block-size 64
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities: {add: [IPC_LOCK]}
          volumeMounts:
          - {name: model-cache,   mountPath: /model-cache}
        volumes:
        - name: model-cache
          persistentVolumeClaim: {claimName: model-cache}

  - name: decode
    type: decode
    replicas: 1
    multinode:
      nodeCount: 4
    podTemplate:
      metadata:
        annotations:
          nvidia.com/vllm-distributed-executor-backend: mp
      spec:
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-GB200
        tolerations:
        - {key: kubernetes.io/arch, operator: Equal, value: arm64,         effect: NoSchedule}
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: qwen38max-agg-cd-channel
        terminationGracePeriodSeconds: 60
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0-qwen-3.8-2.4t-dev.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          workingDir: /workspace
          args:
          - |
            exec python3 -m dynamo.vllm \
              --model Qwen/Qwen3.8-2.4T-A95B-FP8 \
              --hf-overrides '{"architectures":["Qwen3_5MoeForCausalLM"]}' \
              --served-model-name Qwen/Qwen3.8-2.4T-A95B-FP8 \
              --trust-remote-code \
              --tensor-parallel-size 16 \
              --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
              --kv-cache-dtype fp8 \
              --max-model-len 262144 \
              --max-num-seqs 512 \
              --max-num-batched-tokens 12288 \
              --gpu-memory-utilization 0.90 \
              --max-cudagraph-capture-size 512 \
              --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","pass_config":{"fuse_allreduce_rms":false}}' \
              --scheduler-cls vllm.v1.core.sched.scheduler.Scheduler \
              --enable-prefix-caching \
              --no-async-scheduling \
              --moe-backend flashinfer_trtllm \
              --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5571","enable_kv_cache_events":true}' \
              --reasoning-parser qwen3 \
              --dyn-reasoning-parser qwen3 \
              --dyn-tool-call-parser qwen3_coder \
              --language-model-only
          env:
          - {name: VLLM_WORKER_MULTIPROC_METHOD,       value: spawn}
          - {name: HF_HOME,                            value: /model-cache}
          - {name: HF_HUB_OFFLINE,                      value: "1"}
          - {name: TRANSFORMERS_OFFLINE,                value: "1"}
          - {name: VLLM_ENGINE_READY_TIMEOUT_S,        value: "14400"}
          - {name: VLLM_USE_V2_MODEL_RUNNER,           value: "0"}
          - {name: VLLM_USE_RUST_FRONTEND,             value: "1"}
          - {name: VLLM_SERVER_DEV_MODE,               value: "1"}
          - {name: FLASHINFER_DISABLE_VERSION_CHECK,   value: "1"}
          - {name: VLLM_USE_DEEP_GEMM,                 value: "0"}
          - {name: VLLM_DEEP_GEMM_WARMUP,             value: skip}
          - {name: TORCHINDUCTOR_ENABLE_PDL,           value: "1"}
          - {name: PYTORCH_ALLOC_CONF,                value: "expandable_segments:True"}
          - {name: VLLM_ALLREDUCE_USE_FLASHINFER,      value: "1"}
          - {name: VLLM_FLASHINFER_ALLREDUCE_BACKEND,  value: mnnvl}
          - {name: NCCL_MNNVL_ENABLE,                 value: "1"}
          - {name: NCCL_CUMEM_ENABLE,                 value: "1"}
          - {name: MC_FORCE_MNNVL,                    value: "1"}
          - {name: NCCL_NVLS_ENABLE,                  value: "1"}
          - {name: NCCL_P2P_LEVEL,                    value: NVL}
          - {name: NCCL_SOCKET_IFNAME,                value: eth0}
          - {name: GLOO_SOCKET_IFNAME,                value: eth0}
          - {name: NCCL_DEBUG,                        value: WARN}
          - {name: VLLM_USE_NCCL_SYMM_MEM,           value: "0"}
          - {name: UCX_TLS,                           value: "cuda_copy,cuda_ipc,tcp"}
          - {name: UCX_CUDA_IPC_ENABLE_MNNVL,         value: "y"}
          - {name: UCX_MEMTYPE_CACHE,                 value: "n"}
          - {name: UCX_MEMTYPE_REG_WHOLE,             value: "n"}
          - {name: NVIDIA_GDRCOPY,                    value: "1"}
          - {name: TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC,  value: "3600"}
          - {name: VLLM_SSM_CONV_STATE_LAYOUT,        value: DS}
          - {name: DYN_REQUEST_PLANE,                 value: tcp}
          - {name: ETCD_LEASE_TTL,                    value: "120"}
          - {name: VLLM_CACHE_ROOT,                   value: /cache-persist/vllm}
          - {name: TORCHINDUCTOR_CACHE_DIR,           value: /cache-persist/torchinductor}
          - {name: TRITON_CACHE_DIR,                  value: /cache-persist/triton}
          - {name: FLASHINFER_WORKSPACE_BASE,         value: /cache-persist/flashinfer}
          - {name: FLASHINFER_CUBIN_DIR,              value: /cache-persist/flashinfer/cubins}
          - {name: XDG_CACHE_HOME,                    value: /cache-persist/xdg}
          resources:
            claims:
            - name: compute-domain-channel
            limits:
              nvidia.com/gpu: "4"
            requests:
              nvidia.com/gpu: "4"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities: {add: [IPC_LOCK, SYS_RESOURCE]}
          volumeMounts:
          - {name: model-cache,    mountPath: /model-cache}
          - {name: compile-cache,  mountPath: /cache-persist}
        volumes:
        - name: model-cache
          persistentVolumeClaim: {claimName: model-cache}
        - name: compile-cache
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd/cache/qwen38max-agg
            type: DirectoryOrCreate
