---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: qwen38max-compute-domain
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: qwen38max-compute-domain-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen38max-agg-agentic
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-GB300
          volumes:
            - name: model-cache
              persistentVolumeClaim: {claimName: model-cache}
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0-qwen-3.8-2.4t-dev.1
              securityContext: {runAsUser: 0}
              command: [python3, -m, dynamo.frontend]
              args: [--router-mode, kv, --router-kv-events, --http-port, "8000"]
              env:
                - {name: HF_HOME, value: /model-cache}
                - {name: HF_HUB_OFFLINE, value: "1"}
                - {name: TRANSFORMERS_OFFLINE, value: "1"}
              volumeMounts:
                - {name: model-cache, mountPath: /model-cache, readOnly: true}
    - name: worker
      type: decode
      replicas: 1
      multinode:
        nodeCount: 4
      sharedMemorySize: 64Gi
      podTemplate:
        metadata:
          annotations: {nvidia.com/vllm-distributed-executor-backend: mp}
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-GB300
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - {key: nvidia.com/gpu.product, operator: In, values: [NVIDIA-GB300]}
          resourceClaims:
            - {name: compute-domain-channel, resourceClaimTemplateName: qwen38max-compute-domain-channel}
          volumes:
            - name: model-cache
              persistentVolumeClaim: {claimName: model-cache}
            - name: dshm
              emptyDir: {medium: Memory, sizeLimit: 64Gi}
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0-qwen-3.8-2.4t-dev.1
              securityContext: {runAsUser: 0, capabilities: {add: [IPC_LOCK]}}
              resources:
                limits: {nvidia.com/gpu: "4"}
                requests: {nvidia.com/gpu: "4"}
                claims: [{name: compute-domain-channel}]
              volumeMounts:
                - {name: model-cache, mountPath: /model-cache, readOnly: true}
                - {name: dshm, mountPath: /dev/shm}
              startupProbe:
                httpGet: {path: /health, port: 9090}
                periodSeconds: 10
                failureThreshold: 720
              env:
                - {name: PYTHONUNBUFFERED, value: "1"}
                - {name: HF_HOME, value: /model-cache}
                - {name: HF_HUB_OFFLINE, value: "1"}
                - {name: TRANSFORMERS_OFFLINE, value: "1"}
                - {name: NCCL_SOCKET_IFNAME, value: eth0}
                - {name: GLOO_SOCKET_IFNAME, value: eth0}
                - {name: VLLM_USE_V2_MODEL_RUNNER, value: "0"}
                - {name: VLLM_USE_RUST_FRONTEND, value: "1"}
                - {name: NCCL_MNNVL_ENABLE, value: "1"}
                - {name: NCCL_NVLS_ENABLE, value: "1"}
                - {name: NCCL_P2P_LEVEL, value: NVL}
                - {name: NCCL_CUMEM_ENABLE, value: "1"}
                - {name: VLLM_USE_NCCL_SYMM_MEM, value: "0"}
                - {name: UCX_CUDA_IPC_ENABLE_MNNVL, value: "y"}
                - {name: VLLM_ALLREDUCE_USE_FLASHINFER, value: "1"}
                - {name: VLLM_FLASHINFER_ALLREDUCE_BACKEND, value: mnnvl}
                - {name: FLASHINFER_DISABLE_VERSION_CHECK, value: "1"}
              command: [/bin/bash, -lc]
              args:
                - |
                  exec python3 -m dynamo.vllm \
                    --model Qwen/Qwen3.8-2.4T-A95B-FP8 \
                    --hf-overrides '{"architectures":["Qwen3_5MoeForCausalLM"]}' \
                    --served-model-name Qwen/Qwen3.8-2.4T-A95B-FP8 \
                    --trust-remote-code \
                    --tensor-parallel-size 16 \
                    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
                    --kv-cache-dtype fp8 \
                    --max-model-len 262144 \
                    --max-num-seqs 512 \
                    --max-num-batched-tokens 12288 \
                    --gpu-memory-utilization 0.90 \
                    --max-cudagraph-capture-size 512 \
                    --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","pass_config":{"fuse_allreduce_rms":false}}' \
                    --scheduler-cls vllm.v1.core.sched.scheduler.Scheduler \
                    --enable-prefix-caching \
                    --no-async-scheduling \
                    --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5571","enable_kv_cache_events":true}' \
                    --reasoning-parser qwen3 \
                    --dyn-reasoning-parser qwen3 \
                    --dyn-tool-call-parser qwen3_coder \
                    --language-model-only
