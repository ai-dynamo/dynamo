#
# Disaggregated SGLang deployment: prefill/decode split with nixl KV transfer.
# Tested with dynamo 1.0 (SGLang 0.5.9).
#
# Uses TP=2 per worker (prefill: 2 GPUs, decode: 2 GPUs) for a total of 4 GPUs.
# KV cache is transferred between workers via nixl (GPU-direct).
#
# NOT working on dynamo 0.9.1 — same blocking bugs as sglang/agg.
#
# Known issue: Prefill warmup logs a non-blocking warning:
#   "Prefill warmup failed: 'SamplingParams' object is not subscriptable"
# This does not affect functionality.
#
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: nemotron-super-fp8-sglang-disagg
spec:
  backendFramework: sglang
  env:
  - name: HF_HOME
    value: /opt/models
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
          command:
          - /bin/sh
          - -c
          args:
          - python3 -m dynamo.frontend --router-mode kv --no-kv-events --http-port 8000
          volumeMounts:
          - name: model-cache
            mountPath: /opt/models
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
  - name: decode
    type: decode
    replicas: 1
    sharedMemorySize: 16Gi
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
          command:
          - python3
          - -m
          - dynamo.sglang
          args:
          - --model-path
          - nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
          - --served-model-name
          - nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
          - --tp
          - "2"
          - --trust-remote-code
          - --disaggregation-mode
          - decode
          - --disaggregation-bootstrap-port
          - "12345"
          - --disaggregation-transfer-backend
          - nixl
          - --host
          - 0.0.0.0
          - --dyn-tool-call-parser
          - nemotron_nano
          - --dyn-reasoning-parser
          - nemotron_nano
          workingDir: /workspace
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            requests:
              nvidia.com/gpu: "2"
            limits:
              nvidia.com/gpu: "2"
          volumeMounts:
          - name: model-cache
            mountPath: /opt/models
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
  - name: prefill
    type: prefill
    replicas: 1
    sharedMemorySize: 16Gi
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
          command:
          - python3
          - -m
          - dynamo.sglang
          args:
          - --model-path
          - nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
          - --served-model-name
          - nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
          - --tp
          - "2"
          - --trust-remote-code
          - --disaggregation-mode
          - prefill
          - --disaggregation-bootstrap-port
          - "12345"
          - --disaggregation-transfer-backend
          - nixl
          - --host
          - 0.0.0.0
          - --dyn-tool-call-parser
          - nemotron_nano
          - --dyn-reasoning-parser
          - nemotron_nano
          workingDir: /workspace
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            requests:
              nvidia.com/gpu: "2"
            limits:
              nvidia.com/gpu: "2"
          volumeMounts:
          - name: model-cache
            mountPath: /opt/models
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
