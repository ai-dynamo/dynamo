apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: solar-open2-250b-vllm-b200-disagg-chat
spec:
  backendFramework: vllm
  env:
  - name: DYN_ROUTER_MODE
    value: round_robin
  - name: HF_HOME
    value: /shared-model-cache
  - name: HF_HUB_CACHE
    value: /shared-model-cache/hub
  - name: HF_HUB_OFFLINE
    value: '1'
  - name: TRANSFORMERS_OFFLINE
    value: '1'
  - name: VLLM_WORKER_MULTIPROC_METHOD
    value: spawn
  - name: PYTHONHASHSEED
    value: '0'
  - name: NCCL_IB_DISABLE
    value: '0'
  - name: NCCL_CUMEM_ENABLE
    value: '1'
  - name: NCCL_NVLS_ENABLE
    value: '1'
  - name: UCX_TLS
    value: ^cuda_ipc
  - name: UCX_RNDV_SCHEME
    value: get_zcopy
  - name: UCX_MAX_RNDV_RAILS
    value: '4'
  - name: VLLM_SSM_CONV_STATE_LAYOUT
    value: DS
  - name: VLLM_ALLREDUCE_USE_SYMM_MEM
    value: '0'
  - name: VLLM_ALLREDUCE_USE_FLASHINFER
    value: '1'
  - name: VLLM_USE_NCCL_SYMM_MEM
    value: '0'
  - name: VLLM_FLASHINFER_ALLREDUCE_BACKEND
    value: mnnvl
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    minAvailable: 1
    podTemplate:
      spec:
        # TODO: remove before merge, once the runtime image is published to a
        # public registry. The image is currently hosted privately, so this
        # secret is required to pull it.
        imagePullSecrets:
        - name: nvcr-secret
        # TODO: remove before merge. Internal B200 nodes carry the taint
        # nvidia.com/gpu=true:NoSchedule; without this the pods never schedule and
        # the DynamoGraphDeployment reports insufficient_capacity even when GPUs
        # are free. Not needed on clusters whose GPU nodes are untainted.
        tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: 'true'
          effect: NoSchedule
        containers:
        - name: main
          image: nvcr.io/nvstaging/nim/snarravula:1.4.1-solar-open2-toolfix-preview1@sha256:deea685b67f14e7fb8be7a7c07d634337bf0dfa39adb0aca40731587a5c6bfff
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
          - python3
          - -m
          - dynamo.frontend
          args:
          - --dyn-chat-processor=vllm
          - --tool-call-parser=solar_open2
          - --reasoning-parser=solar_open2
          - --enable-auto-tool-choice
          - --default-chat-template-kwargs={"think_render_option":"preserved","reasoning_effort":"high"}
          - --max-model-len=1048576
          - --http-host=0.0.0.0
          - --http-port=8000
          ports:
          - name: http
            containerPort: 8000
          resources:
            requests:
              cpu: '16'
              memory: 128Gi
          volumeMounts:
          - name: runtime-tmp
            mountPath: /tmp
        volumes:
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 20Gi
  - name: PrefillWorker
    type: prefill
    replicas: 1
    minAvailable: 1
    sharedMemorySize: 64Gi
    podTemplate:
      spec:
        # TODO: remove before merge, once the runtime image is published to a
        # public registry. The image is currently hosted privately, so this
        # secret is required to pull it.
        imagePullSecrets:
        - name: nvcr-secret
        # TODO: remove before merge. Internal B200 nodes carry the taint
        # nvidia.com/gpu=true:NoSchedule; without this the pods never schedule and
        # the DynamoGraphDeployment reports insufficient_capacity even when GPUs
        # are free. Not needed on clusters whose GPU nodes are untainted.
        tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: 'true'
          effect: NoSchedule
        containers:
        - name: main
          image: nvcr.io/nvstaging/nim/snarravula:1.4.1-solar-open2-toolfix-preview1@sha256:deea685b67f14e7fb8be7a7c07d634337bf0dfa39adb0aca40731587a5c6bfff
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model=/shared-model-cache/hub/models--nota-ai--Solar-Open2-250B-Nota-NVFP4/snapshots/3cc673335f4c2f41181e05a98fc2b8324d586a64
          - --served-model-name=solar-open2-250b
          - --tensor-parallel-size=4
          - --enable-expert-parallel
          - --dtype=bfloat16
          - --kv-cache-dtype=fp8
          - --calculate-kv-scales
          - --max-model-len=1048576
          - --max-num-seqs=512
          - --max-num-batched-tokens=65536
          - --enable-chunked-prefill
          - --no-async-scheduling
          - --gpu-memory-utilization=0.90
          - --disable-custom-all-reduce
          - --moe-backend=flashinfer_trtllm
          - --enable-flashinfer-autotune
          - --compilation-config={"pass_config":{"fuse_allreduce_rms":true}}
          - --enable-prefix-caching
          - --block-size=16
          - --reasoning-parser=solar_open2
          - --logits-processors=vllm.v1.sample.logits_processor.solar_open2:SolarOpen2TemplateLogitsProcessor
          - --kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_connector_extra_config":{"num_threads":8}}
          - --disaggregation-mode=prefill
          - --kv-events-config={"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5571","enable_kv_cache_events":true}
          resources:
            limits:
              nvidia.com/gpu: '4'
              rdma/ib: '4'
            requests:
              cpu: '16'
              ephemeral-storage: 64Gi
              memory: 640Gi
              nvidia.com/gpu: '4'
              rdma/ib: '4'
          volumeMounts:
          - name: shared-model-cache
            mountPath: /shared-model-cache
          - name: runtime-tmp
            mountPath: /tmp
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 100Gi
  - name: DecodeWorker
    type: decode
    replicas: 2
    minAvailable: 2
    sharedMemorySize: 64Gi
    podTemplate:
      spec:
        # TODO: remove before merge, once the runtime image is published to a
        # public registry. The image is currently hosted privately, so this
        # secret is required to pull it.
        imagePullSecrets:
        - name: nvcr-secret
        # TODO: remove before merge. Internal B200 nodes carry the taint
        # nvidia.com/gpu=true:NoSchedule; without this the pods never schedule and
        # the DynamoGraphDeployment reports insufficient_capacity even when GPUs
        # are free. Not needed on clusters whose GPU nodes are untainted.
        tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: 'true'
          effect: NoSchedule
        containers:
        - name: main
          image: nvcr.io/nvstaging/nim/snarravula:1.4.1-solar-open2-toolfix-preview1@sha256:deea685b67f14e7fb8be7a7c07d634337bf0dfa39adb0aca40731587a5c6bfff
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model=/shared-model-cache/hub/models--nota-ai--Solar-Open2-250B-Nota-NVFP4/snapshots/3cc673335f4c2f41181e05a98fc2b8324d586a64
          - --served-model-name=solar-open2-250b
          - --tensor-parallel-size=2
          - --dtype=bfloat16
          - --kv-cache-dtype=fp8
          - --calculate-kv-scales
          - --max-model-len=1048576
          - --max-num-seqs=512
          - --max-num-batched-tokens=65536
          - --enable-chunked-prefill
          - --gpu-memory-utilization=0.90
          - --disable-custom-all-reduce
          - --moe-backend=flashinfer_trtllm
          - --enable-flashinfer-autotune
          - --compilation-config={"pass_config":{"fuse_allreduce_rms":true}}
          - --enable-prefix-caching
          - --block-size=16
          - --reasoning-parser=solar_open2
          - --logits-processors=vllm.v1.sample.logits_processor.solar_open2:SolarOpen2TemplateLogitsProcessor
          - --kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"num_threads":8}}
          - --disaggregation-mode=decode
          resources:
            limits:
              nvidia.com/gpu: '2'
              rdma/ib: '2'
            requests:
              cpu: '16'
              ephemeral-storage: 64Gi
              memory: 320Gi
              nvidia.com/gpu: '2'
              rdma/ib: '2'
          volumeMounts:
          - name: shared-model-cache
            mountPath: /shared-model-cache
          - name: runtime-tmp
            mountPath: /tmp
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 100Gi
