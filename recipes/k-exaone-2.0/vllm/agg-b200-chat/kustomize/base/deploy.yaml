#
# K-EXAONE 2.0 750B-A37B NVFP4 on vLLM via Dynamo, aggregated, B200 (TP=4, 4 GPUs),
# chat workload (8K ISL / 1K OSL). The trace is DESIGNED for 70% prefix reuse; the
# rate actually achieved on this topology is ~8.8%, because the working set is ~42x
# oversubscribed against TP4 KV capacity and blocks are evicted before reuse.
#
# Model: 764.5 B total params, ~37 B active per token. 78 layers, 256 experts top-8.
# Hybrid attention: 20 full_attention + 58 sliding_attention layers. Native context 262,144.
# Checkpoint: LGAI-EXAONE/K-EXAONE-2.0-750B-A37B-NVFP4 (~530 GB on disk, NVFP4 W4A4).
#
# Key model-specific requirements:
#   - --kernel-config moe_backend=FLASHINFER_CUTLASS is MANDATORY, not a tuning choice.
#     vLLM's 'auto' selects FLASHINFER_TRTLLM, which silently corrupts long-form output on
#     this checkpoint: it produces fluent, plausible, wrong text with no error. The pin costs
#     some throughput and that cost is included in the published numbers.
#   - --spec-method exaone_moe_mtp --spec-tokens 2: the checkpoint ships MTP heads.
#     Draft length 1 is statistically indistinguishable; 4 is worse.
#   - --dyn-reasoning-parser / --dyn-tool-call-parser: the plain --reasoning-parser and
#     --tool-call-parser flags configure the ENGINE only and never reach the Dynamo frontend.
#   - --block-size 64: block-size 16 is measurably worse on this model.
#   - --kv-events-config on the worker publishes the prefix-block index that the
#     frontend's --router-kv-events consumes. Both halves are inert at replicas: 1
#     (one destination), but without them raising replicas silently gives round-robin
#     under a --router-mode kv label. Measured at parity with round-robin on this
#     workload; shipped so that scaling out behaves as labelled, not for throughput.
#   - TP=4 is the floor: ~530 GB of weights does not fit TP=2 on 180 GB B200s. TP=8 is slower
#     per GPU -- the model is communication-bound, not KV-capacity-bound.
#   - --enable-prompt-tokens-details is a 'vllm serve' flag; 'dynamo.vllm' rejects it. Read the
#     achieved KV reuse from the worker log instead:
#       kubectl logs <worker> | grep -o 'Prefix cache hit rate: [0-9.]*%'
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: k-exaone-2-agg
spec:
  backendFramework: vllm
  env:
    - {name: HF_HOME, value: /model-cache}
    - {name: HF_HUB_OFFLINE, value: "1"}
    - {name: TRANSFORMERS_OFFLINE, value: "1"}
    - {name: MODEL_NAME, value: LGAI-EXAONE/K-EXAONE-2.0-750B-A37B-NVFP4}
    - {name: VLLM_WORKER_MULTIPROC_METHOD, value: spawn}
  components:
    - name: Frontend
      minAvailable: 1
      replicas: 1
      type: frontend
      podTemplate:
        spec:
          containers:
            - name: main
              # Public released frontend. CPU-only -- it routes traffic and loads no weights,
              # so it takes the released frontend image rather than the model-specific
              # vLLM runtime. Multi-arch: linux/amd64 and linux/arm64.
              image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.4.1
              command: [/bin/bash, -lc]
              args:
                - exec python3 -m dynamo.frontend --router-mode kv --router-kv-events --kv-cache-block-size 64 --http-host 0.0.0.0 --http-port 8000
              ports: [{containerPort: 8000, name: http, protocol: TCP}]
              volumeMounts:
                - {mountPath: /model-cache, name: model-cache, readOnly: true}
          volumes:
            - name: model-cache
              persistentVolumeClaim: {claimName: model-cache}
    - name: Worker
      # digest-pinned image has no semver tag for the operator to parse
      runtimeVersionOverride: "1.4.1"
      minAvailable: 1
      replicas: 1
      type: worker
      sharedMemorySize: 40Gi
      podTemplate:
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-B200
          tolerations:
            - {key: nvidia.com/gpu, operator: Equal, value: "true", effect: NoSchedule}
          containers:
            - name: main
              # Public released runtime for this model. Carries vLLM 0.28.0 plus the
              # exaone_moe lm_head prefix fix (ai-dynamo/dynamo#14599); stock vLLM 0.28.0
              # cannot load this NVFP4 checkpoint without it.
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1-k-exaone-2.0-750b-post.1
              command: [/bin/bash, -lc]
              args:
                - |
                  ulimit -l unlimited
                  exec python3 -m dynamo.vllm --model "${MODEL_NAME}" --served-model-name "${MODEL_NAME}" \
                    --tensor-parallel-size 4 \
                    --gpu-memory-utilization 0.93 \
                    --max-num-seqs 32 \
                    --max-num-batched-tokens 8192 \
                    --block-size 64 \
                    --dyn-reasoning-parser qwen3 \
                    --dyn-tool-call-parser qwen3_coder \
                    --kernel-config '{"moe_backend":"FLASHINFER_CUTLASS"}' \
                    --kv-events-config '{"enable_kv_cache_events":true,"publisher":"zmq"}' \
                    --spec-method exaone_moe_mtp \
                    --spec-tokens 2
              securityContext:
                runAsUser: 0
                capabilities: {add: [IPC_LOCK, SYS_RESOURCE]}
              resources:
                requests: {memory: 200Gi, nvidia.com/gpu: "4"}
                limits: {memory: 480Gi, nvidia.com/gpu: "4"}
              # 530 GB of weights over a shared PVC, then torch.compile and cudagraph
              # capture: first start is tens of minutes. 60 x 60 s of grace, matching the
              # other 1T-class recipes. Without an explicit probe the operator default is
              # far shorter and kills the worker mid-load.
              startupProbe:
                failureThreshold: 60
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 20
              volumeMounts:
                - {mountPath: /model-cache, name: model-cache, readOnly: true}
                - {mountPath: /dev/shm, name: dshm}
          volumes:
            - name: model-cache
              persistentVolumeClaim: {claimName: model-cache}
            - name: dshm
              emptyDir: {medium: Memory}
