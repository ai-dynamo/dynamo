#
# K-EXAONE 2.0 750B-A37B NVFP4 on vLLM via Dynamo -- aggregated, B200, TP=4, 4 GPUs.
# Documentation: https://docs.nvidia.com/dynamo/recipes/k-exaone-2
#
# Correctness requirements, not tuning choices:
#   - --kernel-config moe_backend=FLASHINFER_CUTLASS is MANDATORY. vLLM's 'auto' selects
#     FLASHINFER_TRTLLM, which silently corrupts long-form output on this checkpoint --
#     fluent, plausible, wrong, with no error.
#   - --dyn-reasoning-parser / --dyn-tool-call-parser: the plain --reasoning-parser and
#     --tool-call-parser flags configure the ENGINE only and never reach the Dynamo
#     frontend, so tool calling silently does nothing.
#   - TP=4 is the floor: ~530 GB of weights does not fit TP=2 on 180 GB B200s.
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: k-exaone-2-vllm-b200-agg-chat
spec:
  backendFramework: vllm
  env:
    - {name: HF_HOME, value: /shared-model-cache}
    - {name: HF_HUB_OFFLINE, value: "1"}
    - {name: TRANSFORMERS_OFFLINE, value: "1"}
    - {name: MODEL_NAME, value: LGAI-EXAONE/K-EXAONE-2.0-750B-A37B-NVFP4}
    - {name: VLLM_WORKER_MULTIPROC_METHOD, value: spawn}
  components:
    - name: Frontend
      minAvailable: 1
      replicas: 1
      type: frontend
      podTemplate:
        spec:
          containers:
            - name: main
              # CPU-only: routes traffic, loads no weights. Multi-arch.
              image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.4.1@sha256:7a54b0d601b7b2c50d41c6e683ddc8b6d2b4fa2b17262db1fa2e84ab7ebaf7e2
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.frontend
                - --router-mode
                - kv
                - --router-kv-events
                - --kv-cache-block-size
                - "64"
                - --http-host
                - 0.0.0.0
                - --http-port
                - "8000"
              ports: [{containerPort: 8000, name: http, protocol: TCP}]
              resources:
                requests: {cpu: "8", memory: 16Gi, ephemeral-storage: 16Gi}
    - name: Worker
      # a digest-pinned image exposes no tag for the operator to parse a version from
      runtimeVersionOverride: "1.4.1"
      minAvailable: 1
      replicas: 1
      type: worker
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-B200
          tolerations:
            - {key: nvidia.com/gpu, operator: Equal, value: "true", effect: NoSchedule}
          containers:
            - name: main
              # vLLM 0.28.0 + the exaone_moe lm_head prefix fix (ai-dynamo/dynamo#14599);
              # stock 0.28.0 cannot load this NVFP4 checkpoint.
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1-k-exaone-2.0-750b-post.1@sha256:671b3f6ed5b94a572ae976cd59344bf26b27121618344a97d978d09737e6c7a2
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.vllm
                - --model
                - $(MODEL_NAME)
                - --served-model-name
                - $(MODEL_NAME)
                - --tensor-parallel-size
                - "4"
                - --gpu-memory-utilization
                - "0.93"
                - --max-num-seqs
                - "32"
                - --max-num-batched-tokens
                - "8192"
                - --block-size
                - "64"
                - --dyn-reasoning-parser
                - qwen3
                - --dyn-tool-call-parser
                - qwen3_coder
                - --kernel-config
                - '{"moe_backend":"FLASHINFER_CUTLASS"}'
                - --kv-events-config
                - '{"enable_kv_cache_events":true,"publisher":"zmq"}'
                - --spec-method
                - exaone_moe_mtp
                - --spec-tokens
                - "2"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities: {add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]}
              resources:
                requests: {cpu: "16", memory: 200Gi, ephemeral-storage: 64Gi, nvidia.com/gpu: "4"}
                limits: {nvidia.com/gpu: "4"}
              startupProbe:
                failureThreshold: 60
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 20
              volumeMounts:
                - {mountPath: /shared-model-cache, name: model-cache}
          volumes:
            - name: model-cache
              persistentVolumeClaim: {claimName: shared-model-cache}
