apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: k-exaone-2-disagg
spec:
  backendFramework: vllm
  components:
  - minAvailable: 1
    name: Frontend
    podTemplate:
      spec:
        containers:
        - args:
          - exec python3 -m dynamo.frontend --router-mode kv --router-kv-events --kv-cache-block-size
            64 --http-host 0.0.0.0 --http-port 8000
          command:
          - /bin/bash
          - -lc
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.4.1
          name: main
          ports:
          - containerPort: 8000
            name: http
            protocol: TCP
          volumeMounts:
          - mountPath: /model-cache
            name: model-cache
            readOnly: true
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
    replicas: 1
    type: frontend
  - minAvailable: 1
    name: PrefillWorker
    podTemplate:
      spec:
        containers:
        - args:
          - |
            ulimit -l unlimited
            exec python3 -m dynamo.vllm --model "${MODEL_NAME}" --served-model-name "${MODEL_NAME}" \
              --disaggregation-mode=prefill \
              --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
              --tensor-parallel-size 4 \
              --gpu-memory-utilization 0.93 \
              --max-num-seqs 32 \
              --max-num-batched-tokens 8192 \
              --block-size 64 \
              --dyn-reasoning-parser qwen3 \
              --dyn-tool-call-parser qwen3_coder \
              --kernel-config '{"moe_backend":"FLASHINFER_CUTLASS"}' \
              --kv-events-config '{"enable_kv_cache_events":true,"publisher":"zmq"}' \
              --spec-method exaone_moe_mtp \
              --spec-tokens 2
          command:
          - /bin/bash
          - -lc
          env:
          - name: VLLM_NIXL_SIDE_CHANNEL_PORT
            value: "5560"
          - name: KV_TRANSFER_CONFIG
            value: '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_buffer_device":"cuda","kv_connector_extra_config":{"num_threads":8}}'
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1-k-exaone-2.0-750b-post.1
          name: main
          resources:
            limits:
              memory: 480Gi
              nvidia.com/gpu: "4"
              rdma/shared_ib: "4"
            requests:
              memory: 200Gi
              nvidia.com/gpu: "4"
              rdma/shared_ib: "4"
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
            runAsUser: 0
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
          volumeMounts:
          - mountPath: /model-cache
            name: model-cache
            readOnly: true
          - mountPath: /dev/shm
            name: dshm
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-B200
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Equal
          value: "true"
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - emptyDir:
            medium: Memory
          name: dshm
    replicas: 1
    # digest-pinned image has no semver tag for the operator to parse
    runtimeVersionOverride: 1.4.1
    sharedMemorySize: 40Gi
    type: worker
  - minAvailable: 1
    name: DecodeWorker
    podTemplate:
      spec:
        # Pack decode onto prefill's node so the NIXL KV hop stays on one fabric.
        # PREFERRED, not required: the operator schedules the deployment as a gang, so a
        # required affinity on a peer that is not placed yet leaves the whole gang Pending
        # forever -- neither role can go first. Co-location is an optimisation here, not a
        # correctness requirement: KV moves over IB RDMA, which works cross-node, just slower.
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: nvidia.com/dynamo-graph-deployment-name
                    operator: In
                    values:
                    - k-exaone-2-disagg
                  - key: nvidia.com/dynamo-component
                    operator: In
                    values:
                    - PrefillWorker
                topologyKey: kubernetes.io/hostname
              weight: 100
        containers:
        - args:
          - |
            ulimit -l unlimited
            exec python3 -m dynamo.vllm --model "${MODEL_NAME}" --served-model-name "${MODEL_NAME}" \
              --disaggregation-mode=decode \
              --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
              --tensor-parallel-size 4 \
              --gpu-memory-utilization 0.93 \
              --max-num-seqs 256 \
              --max-num-batched-tokens 8192 \
              --block-size 64 \
              --dyn-reasoning-parser qwen3 \
              --dyn-tool-call-parser qwen3_coder \
              --kernel-config '{"moe_backend":"FLASHINFER_CUTLASS"}' \
              --spec-method exaone_moe_mtp \
              --spec-tokens 2
          command:
          - /bin/bash
          - -lc
          env:
          - name: VLLM_NIXL_SIDE_CHANNEL_PORT
            value: "5558"
          - name: KV_TRANSFER_CONFIG
            value: '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_buffer_device":"cuda","kv_connector_extra_config":{"num_threads":8}}'
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1-k-exaone-2.0-750b-post.1
          name: main
          resources:
            limits:
              memory: 480Gi
              nvidia.com/gpu: "4"
              rdma/shared_ib: "4"
            requests:
              memory: 200Gi
              nvidia.com/gpu: "4"
              rdma/shared_ib: "4"
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
            runAsUser: 0
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
          volumeMounts:
          - mountPath: /model-cache
            name: model-cache
            readOnly: true
          - mountPath: /dev/shm
            name: dshm
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-B200
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Equal
          value: "true"
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - emptyDir:
            medium: Memory
          name: dshm
    replicas: 1
    # digest-pinned image has no semver tag for the operator to parse
    runtimeVersionOverride: 1.4.1
    sharedMemorySize: 40Gi
    type: worker
  env:
  - name: HF_HOME
    value: /model-cache
  - name: HF_HUB_OFFLINE
    value: "1"
  - name: TRANSFORMERS_OFFLINE
    value: "1"
  - name: MODEL_NAME
    value: LGAI-EXAONE/K-EXAONE-2.0-750B-A37B-NVFP4
  - name: VLLM_WORKER_MULTIPROC_METHOD
    value: spawn
  # rc_x/rc are the InfiniBand RDMA transports. tcp is omitted on purpose -- see the header.
  - name: UCX_TLS
    value: rc_x,rc,cuda_copy,cuda_ipc
  - name: UCX_MEMTYPE_CACHE
    value: "n"
  - name: UCX_RCACHE_MAX_UNRELEASED
    value: "1024"
  - name: UCX_NET_DEVICES
    value: all
  # TP is intra-pod and belongs on NVLink. Exposing the HCAs makes NCCL probe IB for
  # tensor-parallel traffic as well; pin it off so the two fabrics stay separated by role.
  - name: NCCL_IB_DISABLE
    value: "1"
