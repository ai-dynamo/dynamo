#
# K-EXAONE 2.0 750B-A37B NVFP4 on vLLM via Dynamo -- disaggregated 1P1D, B200, TP=4 per role, 8 GPUs.
# Documentation: https://docs.nvidia.com/dynamo/recipes/k-exaone-2
#
# Correctness requirements, not tuning choices:
#   - --kernel-config moe_backend=FLASHINFER_CUTLASS is MANDATORY. vLLM's 'auto' selects
#     FLASHINFER_TRTLLM, which silently corrupts long-form output on this checkpoint --
#     fluent, plausible, wrong, with no error.
#   - --dyn-reasoning-parser / --dyn-tool-call-parser: the plain --reasoning-parser and
#     --tool-call-parser flags configure the ENGINE only and never reach the Dynamo
#     frontend, so tool calling silently does nothing.
#   - TP=4 is the floor: ~530 GB of weights does not fit TP=2 on 180 GB B200s.
#   - Prefill and decode MUST carry identical spec-dec and block-size settings. A mismatch
#     changes KV block geometry and produces silent garbage output, not an error.
#     --max-num-seqs is the deliberate exception: 32 on prefill, 256 on decode.
#   - --kv-transfer-config must be passed to BOTH roles. Setting only the env var leaves
#     NIXL unconfigured and the deployment serves without disaggregating.
#   - UCX_TLS deliberately excludes tcp. The rdma/ extended-resource name is
#     cluster-specific -- see the documentation before deploying.
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: k-exaone-2-disagg
spec:
  backendFramework: vllm
  env:
    - {name: HF_HOME, value: /model-cache}
    - {name: HF_HUB_OFFLINE, value: "1"}
    - {name: TRANSFORMERS_OFFLINE, value: "1"}
    - {name: MODEL_NAME, value: LGAI-EXAONE/K-EXAONE-2.0-750B-A37B-NVFP4}
    - {name: VLLM_WORKER_MULTIPROC_METHOD, value: spawn}
    # rc_x/rc are the IB RDMA transports; tcp is omitted on purpose.
    - {name: UCX_TLS, value: "rc_x,rc,cuda_copy,cuda_ipc"}
    - {name: UCX_MEMTYPE_CACHE, value: "n"}
    - {name: UCX_RCACHE_MAX_UNRELEASED, value: "1024"}
    - {name: UCX_NET_DEVICES, value: all}
    # TP is intra-pod and belongs on NVLink; keep NCCL off IB so the fabrics stay separated.
    - {name: NCCL_IB_DISABLE, value: "1"}
  components:
    - name: Frontend
      minAvailable: 1
      replicas: 1
      type: frontend
      podTemplate:
        spec:
          containers:
            - name: main
              # CPU-only: routes traffic, loads no weights. Multi-arch.
              image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.4.1
              imagePullPolicy: IfNotPresent
              command: [/bin/bash, -lc]
              args:
                - exec python3 -m dynamo.frontend --router-mode kv --router-kv-events --kv-cache-block-size 64 --http-host 0.0.0.0 --http-port 8000
              ports: [{containerPort: 8000, name: http, protocol: TCP}]
              volumeMounts:
                - {mountPath: /model-cache, name: model-cache, readOnly: true}
          volumes:
            - name: model-cache
              persistentVolumeClaim: {claimName: model-cache}
    - name: PrefillWorker
      # the operator cannot parse a version from a 1.4.1-<model>-post.1 tag
      runtimeVersionOverride: "1.4.1"
      minAvailable: 1
      replicas: 1
      type: worker
      sharedMemorySize: 40Gi
      podTemplate:
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-B200
          tolerations:
            - {key: nvidia.com/gpu, operator: Equal, value: "true", effect: NoSchedule}
          containers:
            - name: main
              # vLLM 0.28.0 + the exaone_moe lm_head prefix fix (ai-dynamo/dynamo#14599);
              # stock 0.28.0 cannot load this NVFP4 checkpoint.
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1-k-exaone-2.0-750b-post.1
              imagePullPolicy: IfNotPresent
              env:
                - {name: VLLM_NIXL_SIDE_CHANNEL_PORT, value: "5560"}
                - {name: KV_TRANSFER_CONFIG, value: '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_buffer_device":"cuda","kv_connector_extra_config":{"num_threads":8}}'}
              command: [/bin/bash, -lc]
              args:
                - |
                  ulimit -l unlimited
                  exec python3 -m dynamo.vllm --model "${MODEL_NAME}" --served-model-name "${MODEL_NAME}" \
                    --disaggregation-mode=prefill \
                    --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
                    --tensor-parallel-size 4 \
                    --gpu-memory-utilization 0.93 \
                    --max-num-seqs 32 \
                    --max-num-batched-tokens 8192 \
                    --block-size 64 \
                    --dyn-reasoning-parser qwen3 \
                    --dyn-tool-call-parser qwen3_coder \
                    --kernel-config '{"moe_backend":"FLASHINFER_CUTLASS"}' \
                    --kv-events-config '{"enable_kv_cache_events":true,"publisher":"zmq"}' \
                    --spec-method exaone_moe_mtp \
                    --spec-tokens 2
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities: {add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]}
              resources:
                requests: {memory: 200Gi, nvidia.com/gpu: "4", rdma/shared_ib: "4"}
                limits: {nvidia.com/gpu: "4", rdma/shared_ib: "4"}
              startupProbe:
                failureThreshold: 60
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 20
              volumeMounts:
                - {mountPath: /model-cache, name: model-cache, readOnly: true}
          volumes:
            - name: model-cache
              persistentVolumeClaim: {claimName: model-cache}
    - name: DecodeWorker
      # the operator cannot parse a version from a 1.4.1-<model>-post.1 tag
      runtimeVersionOverride: "1.4.1"
      minAvailable: 1
      replicas: 1
      type: worker
      sharedMemorySize: 40Gi
      podTemplate:
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-B200
          # Pack decode onto prefill's node so the KV hop stays on one fabric.
          # PREFERRED, not required: a required peer affinity deadlocks the operator's
          # gang scheduling, since neither role can be placed first.
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchExpressions:
                        - {key: nvidia.com/dynamo-graph-deployment-name, operator: In, values: [k-exaone-2-disagg]}
                        - {key: nvidia.com/dynamo-component, operator: In, values: [PrefillWorker]}
          tolerations:
            - {key: nvidia.com/gpu, operator: Equal, value: "true", effect: NoSchedule}
          containers:
            - name: main
              # vLLM 0.28.0 + the exaone_moe lm_head prefix fix (ai-dynamo/dynamo#14599);
              # stock 0.28.0 cannot load this NVFP4 checkpoint.
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1-k-exaone-2.0-750b-post.1
              imagePullPolicy: IfNotPresent
              env:
                - {name: VLLM_NIXL_SIDE_CHANNEL_PORT, value: "5558"}
                - {name: KV_TRANSFER_CONFIG, value: '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_buffer_device":"cuda","kv_connector_extra_config":{"num_threads":8}}'}
              command: [/bin/bash, -lc]
              args:
                - |
                  ulimit -l unlimited
                  exec python3 -m dynamo.vllm --model "${MODEL_NAME}" --served-model-name "${MODEL_NAME}" \
                    --disaggregation-mode=decode \
                    --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
                    --tensor-parallel-size 4 \
                    --gpu-memory-utilization 0.93 \
                    --max-num-seqs 256 \
                    --max-num-batched-tokens 8192 \
                    --block-size 64 \
                    --dyn-reasoning-parser qwen3 \
                    --dyn-tool-call-parser qwen3_coder \
                    --kernel-config '{"moe_backend":"FLASHINFER_CUTLASS"}' \
                    --spec-method exaone_moe_mtp \
                    --spec-tokens 2
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities: {add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]}
              resources:
                requests: {memory: 200Gi, nvidia.com/gpu: "4", rdma/shared_ib: "4"}
                limits: {nvidia.com/gpu: "4", rdma/shared_ib: "4"}
              startupProbe:
                failureThreshold: 60
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 20
              volumeMounts:
                - {mountPath: /model-cache, name: model-cache, readOnly: true}
          volumes:
            - name: model-cache
              persistentVolumeClaim: {claimName: model-cache}
