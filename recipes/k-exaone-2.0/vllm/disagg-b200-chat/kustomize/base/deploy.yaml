#
# K-EXAONE 2.0 750B-A37B NVFP4 on vLLM via Dynamo, disaggregated 1P1D, B200
# (TP=4 per worker, 8 GPUs total), chat workload (8K ISL / 1K OSL). The trace is
# DESIGNED for 70% prefix reuse; achieved reuse on this topology is ~8.8% -- the working
# set is ~42x oversubscribed against KV capacity, so blocks are evicted before reuse.
#
# See ../agg-b200-chat/deploy.yaml for the model-level requirements (FLASHINFER_CUTLASS,
# MTP, the --dyn-* parsers). Everything below is disaggregation-specific.
#
#   - Prefill and decode MUST carry identical spec-dec and block-size settings. A mismatch
#     changes KV block geometry and produces silent garbage output, not an error.
#   - Decode runs --max-num-seqs 256 while prefill keeps 32. Decode is the bottleneck on this
#     workload; prefill idles. Leaving decode at 32 costs ~48% throughput to head-of-line
#     blocking at ~10% KV utilisation.
#   - KV transfer is NixlConnector over UCX. UCX_TLS deliberately EXCLUDES tcp: if a fast
#     transport is unavailable UCX will silently fall back to TCP and stage GPU memory through
#     host RAM, which is roughly two orders of magnitude slower and shows up only as a large
#     TTFT. Verify the selected transport before trusting any number:
#       kubectl exec <decode-worker> -- curl -s localhost:9090/metrics \
#         | grep vllm:nixl_xfer_time_seconds
#     A ~1 GB KV transfer should take milliseconds, not seconds.
#   - InfiniBand RDMA requires a device plugin exposing the HCAs as a Kubernetes extended
#     resource. THE RESOURCE NAME IS CLUSTER-SPECIFIC. This file requests
#     'rdma/shared_ib', which is what our validation cluster exposes; other clusters use
#     'rdma/ib' or 'rdma/rdma_shared_device_a'. Replace it to match your device plugin, and
#     prefer a SHARED flavour: with an exclusive-mode resource, two co-located workers each
#     claiming HCAs can deadlock NCCL bootstrap in whichever initialises second.
#   - podAffinity packs decode onto prefill's node so the KV hop stays on one fabric.
#   - --kv-events-config on the PREFILL worker publishes the prefix-block index that the
#     frontend's --router-kv-events consumes; decode receives KV and does not publish.
#     Both halves are inert at replicas: 1 (one destination), but without them raising
#     replicas silently gives round-robin under a --router-mode kv label. Measured at
#     parity with round-robin on this workload -- shipped so scaling behaves as labelled,
#     not as a throughput claim.
#     It is PREFERRED, not required: gang scheduling deadlocks on a required peer affinity.
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: k-exaone-2-disagg
spec:
  backendFramework: vllm
  env:
    - {name: HF_HOME, value: /model-cache}
    - {name: HF_HUB_OFFLINE, value: "1"}
    - {name: TRANSFORMERS_OFFLINE, value: "1"}
    - {name: MODEL_NAME, value: LGAI-EXAONE/K-EXAONE-2.0-750B-A37B-NVFP4}
    - {name: VLLM_WORKER_MULTIPROC_METHOD, value: spawn}
    # rc_x/rc are the InfiniBand RDMA transports. tcp is omitted on purpose -- see the header.
    - {name: UCX_TLS, value: "rc_x,rc,cuda_copy,cuda_ipc"}
    - {name: UCX_MEMTYPE_CACHE, value: "n"}
    - {name: UCX_RCACHE_MAX_UNRELEASED, value: "1024"}
    - {name: UCX_NET_DEVICES, value: all}
    # TP is intra-pod and belongs on NVLink. Exposing the HCAs makes NCCL probe IB for
    # tensor-parallel traffic as well; pin it off so the two fabrics stay separated by role.
    - {name: NCCL_IB_DISABLE, value: "1"}
  components:
    - name: Frontend
      minAvailable: 1
      replicas: 1
      type: frontend
      podTemplate:
        spec:
          containers:
            - name: main
              # Public released frontend. CPU-only -- it routes traffic and loads no weights,
              # so it takes the released frontend image rather than the model-specific
              # vLLM runtime. Multi-arch: linux/amd64 and linux/arm64.
              image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.4.1
              command: [/bin/bash, -lc]
              args:
                - exec python3 -m dynamo.frontend --router-mode kv --router-kv-events --kv-cache-block-size 64 --http-host 0.0.0.0 --http-port 8000
              ports: [{containerPort: 8000, name: http, protocol: TCP}]
              volumeMounts:
                - {mountPath: /model-cache, name: model-cache, readOnly: true}
          volumes:
            - name: model-cache
              persistentVolumeClaim: {claimName: model-cache}
    - name: PrefillWorker
      # digest-pinned image has no semver tag for the operator to parse
      runtimeVersionOverride: "1.4.1"
      minAvailable: 1
      replicas: 1
      type: worker
      sharedMemorySize: 40Gi
      podTemplate:
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-B200
          tolerations:
            - {key: nvidia.com/gpu, operator: Equal, value: "true", effect: NoSchedule}
          containers:
            - name: main
              # Public released runtime for this model. Carries vLLM 0.28.0 plus the
              # exaone_moe lm_head prefix fix (ai-dynamo/dynamo#14599); stock vLLM 0.28.0
              # cannot load this NVFP4 checkpoint without it.
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1-k-exaone-2.0-750b-post.1
              env:
                - {name: VLLM_NIXL_SIDE_CHANNEL_PORT, value: "5560"}
                - {name: KV_TRANSFER_CONFIG, value: '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_buffer_device":"cuda","kv_connector_extra_config":{"num_threads":8}}'}
              command: [/bin/bash, -lc]
              args:
                - |
                  ulimit -l unlimited
                  exec python3 -m dynamo.vllm --model "${MODEL_NAME}" --served-model-name "${MODEL_NAME}" \
                    --disaggregation-mode=prefill \
                    --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
                    --tensor-parallel-size 4 \
                    --gpu-memory-utilization 0.93 \
                    --max-num-seqs 32 \
                    --max-num-batched-tokens 8192 \
                    --block-size 64 \
                    --dyn-reasoning-parser qwen3 \
                    --dyn-tool-call-parser qwen3_coder \
                    --kernel-config '{"moe_backend":"FLASHINFER_CUTLASS"}' \
                    --kv-events-config '{"enable_kv_cache_events":true,"publisher":"zmq"}' \
                    --spec-method exaone_moe_mtp \
                    --spec-tokens 2
              securityContext:
                runAsUser: 0
                capabilities: {add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]}
              resources:
                requests: {memory: 200Gi, nvidia.com/gpu: "4", rdma/shared_ib: "4"}
                limits: {memory: 480Gi, nvidia.com/gpu: "4", rdma/shared_ib: "4"}
              # 530 GB of weights over a shared PVC, then torch.compile and cudagraph
              # capture: first start is tens of minutes. 60 x 60 s of grace, matching the
              # other 1T-class recipes. Without an explicit probe the operator default is
              # far shorter and kills the worker mid-load.
              startupProbe:
                failureThreshold: 60
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 20
              volumeMounts:
                - {mountPath: /model-cache, name: model-cache, readOnly: true}
                - {mountPath: /dev/shm, name: dshm}
          volumes:
            - name: model-cache
              persistentVolumeClaim: {claimName: model-cache}
            - name: dshm
              emptyDir: {medium: Memory}
    - name: DecodeWorker
      # digest-pinned image has no semver tag for the operator to parse
      runtimeVersionOverride: "1.4.1"
      minAvailable: 1
      replicas: 1
      type: worker
      sharedMemorySize: 40Gi
      podTemplate:
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-B200
          # Pack decode onto prefill's node so the NIXL KV hop stays on one fabric.
          # PREFERRED, not required: the operator schedules the deployment as a gang, so a
          # required affinity on a peer that is not placed yet leaves the whole gang Pending
          # forever -- neither role can go first. Co-location is an optimisation here, not a
          # correctness requirement: KV moves over IB RDMA, which works cross-node, just slower.
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchExpressions:
                        - {key: nvidia.com/dynamo-graph-deployment-name, operator: In, values: [k-exaone-2-disagg]}
                        - {key: nvidia.com/dynamo-component, operator: In, values: [PrefillWorker]}
          tolerations:
            - {key: nvidia.com/gpu, operator: Equal, value: "true", effect: NoSchedule}
          containers:
            - name: main
              # Public released runtime for this model. Carries vLLM 0.28.0 plus the
              # exaone_moe lm_head prefix fix (ai-dynamo/dynamo#14599); stock vLLM 0.28.0
              # cannot load this NVFP4 checkpoint without it.
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1-k-exaone-2.0-750b-post.1
              env:
                - {name: VLLM_NIXL_SIDE_CHANNEL_PORT, value: "5558"}
                - {name: KV_TRANSFER_CONFIG, value: '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_buffer_device":"cuda","kv_connector_extra_config":{"num_threads":8}}'}
              command: [/bin/bash, -lc]
              args:
                - |
                  ulimit -l unlimited
                  exec python3 -m dynamo.vllm --model "${MODEL_NAME}" --served-model-name "${MODEL_NAME}" \
                    --disaggregation-mode=decode \
                    --kv-transfer-config "${KV_TRANSFER_CONFIG}" \
                    --tensor-parallel-size 4 \
                    --gpu-memory-utilization 0.93 \
                    --max-num-seqs 256 \
                    --max-num-batched-tokens 8192 \
                    --block-size 64 \
                    --dyn-reasoning-parser qwen3 \
                    --dyn-tool-call-parser qwen3_coder \
                    --kernel-config '{"moe_backend":"FLASHINFER_CUTLASS"}' \
                    --spec-method exaone_moe_mtp \
                    --spec-tokens 2
              securityContext:
                runAsUser: 0
                capabilities: {add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]}
              resources:
                requests: {memory: 200Gi, nvidia.com/gpu: "4", rdma/shared_ib: "4"}
                limits: {memory: 480Gi, nvidia.com/gpu: "4", rdma/shared_ib: "4"}
              # 530 GB of weights over a shared PVC, then torch.compile and cudagraph
              # capture: first start is tens of minutes. 60 x 60 s of grace, matching the
              # other 1T-class recipes. Without an explicit probe the operator default is
              # far shorter and kills the worker mid-load.
              startupProbe:
                failureThreshold: 60
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 60
                timeoutSeconds: 20
              volumeMounts:
                - {mountPath: /model-cache, name: model-cache, readOnly: true}
                - {mountPath: /dev/shm, name: dshm}
          volumes:
            - name: model-cache
              persistentVolumeClaim: {claimName: model-cache}
            - name: dshm
              emptyDir: {medium: Memory}
