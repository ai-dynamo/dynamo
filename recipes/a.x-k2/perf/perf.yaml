#
# AIPerf 0.12.0 benchmark for the A.X-K2 recipes.
#
# Deploy a recipe and populate the shared-model-cache PVC before creating this
# Job. The default endpoint targets vllm/disagg-h200 and the default W1 workload
# uses 32 shared 10,240-token prefixes, 6,144 unique input tokens, and 1,024
# output tokens at concurrency 8. Edit the endpoint or workload arguments below
# to benchmark another recipe or operating point.
#
# Create the Job in the deployment namespace:
#   kubectl apply -f perf/perf.yaml -n ${NAMESPACE}
#
# Raw artifacts persist under
# /shared-model-cache/perf/axk2/aiperf-0.12.0-w1-c8 on the PVC.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: axk2-bench
  labels:
    app.kubernetes.io/name: axk2-bench
    app.kubernetes.io/part-of: axk2
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axk2-bench
        app.kubernetes.io/part-of: axk2
    spec:
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aiperf
          image: nvcr.io/nvidia/ai-dynamo/aiperf:0.12.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: HF_HOME
              value: /shared-model-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: AIPERF_HTTP_CONNECTION_LIMIT
              value: "200"
            - name: AIPERF_HTTP_SO_RCVTIMEO
              value: "120"
            - name: AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT
              value: "600"
            - name: AIPERF_DATASET_CONFIGURATION_TIMEOUT
              value: "600"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: COLUMNS
              value: "200"
          command:
            - aiperf
          args:
            - profile
            - --model
            - A.X-K2
            - --tokenizer
            - skt/A.X-K2
            - --tokenizer-trust-remote-code
            - --endpoint-type
            - chat
            - --endpoint
            - /v1/chat/completions
            - --streaming
            - --url
            - http://axk2-vllm-disagg-h200-frontend:8000
            # W1: 10,240 shared-prefix + 6,144 unique input tokens.
            - --synthetic-input-tokens-mean
            - "6144"
            - --synthetic-input-tokens-stddev
            - "0"
            - --prefix-prompt-length
            - "10240"
            - --num-prefix-prompts
            - "32"
            - --output-tokens-mean
            - "1024"
            - --output-tokens-stddev
            - "0"
            - --extra-inputs
            - max_tokens:1024
            - --extra-inputs
            - min_tokens:1024
            - --extra-inputs
            - ignore_eos:true
            - --concurrency
            - "8"
            - --request-count
            - "32"
            - --warmup-request-count
            - "32"
            - --num-dataset-entries
            - "32"
            - --no-allow-dataset-wrap
            - --use-server-token-count
            - --no-server-metrics
            - --workers-max
            - "8"
            - --random-seed
            - "42"
            - --request-timeout-seconds
            - "1800"
            - --ui
            - simple
            - --output-artifact-dir
            - /shared-model-cache/perf/axk2/aiperf-0.12.0-w1-c8
          resources:
            requests:
              cpu: "8"
              memory: 16Gi
            limits:
              cpu: "16"
              memory: 32Gi
          volumeMounts:
            - name: shared-model-cache
              mountPath: /shared-model-cache
      volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
