#
# AIPerf closed-loop concurrency sweep for the A.X-K2 recipes.
#
# Reproduces the three synthetic workloads of the 32-GPU H200 study in
# ../README.md#performance. Every request is 16,384 input tokens and 1,024
# output tokens; the workloads differ only in how much of the input is a
# shared prefix:
#
#   w1  32 shared 10,240-token prefixes + 6,144 unique tokens per request
#       (the "few-shot prompt" production shape; KV routing has to pick the
#       worker that holds the matching prefix)
#   w2  16,384 unique tokens per request (cold; no cache reuse)
#   w3  1 shared 10,240-token prefix + 6,144 unique tokens (cache upper bound)
#
# Deploy a recipe first, then:
#   kubectl apply -f perf/perf.yaml -n ${NAMESPACE}
# Edit ENDPOINT, WORKLOAD, and CONCURRENCIES in the env block below.
apiVersion: batch/v1
kind: Job
metadata:
  name: axk2-bench
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 14400 # 4h hard cap on the Job (the default 5-cell sweep takes about an hour)
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: axk2-bench
    spec:
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: perf
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          workingDir: /workspace
          env:
            # --- Edit these to target the DGD and workload you want to benchmark ---
            # <DGD name>-frontend:8000, e.g. axk2-vllm-agg-h200-frontend:8000
            - name: ENDPOINT
              value: axk2-vllm-disagg-h200-frontend:8000
            # w1 | w2 | w3 (see the header comment)
            - name: WORKLOAD
              value: w1
            # Each value runs as its own aiperf profile with its own artifact
            # subdirectory. 256 saturates the decode KV cache of the 2P2D
            # recipe on cold prompts; see ../README.md#known-issues.
            - name: CONCURRENCIES
              value: "8 16 32 64 128"
            # --- The remainder is shared across all variants ---
            - name: TARGET_MODEL
              value: A.X-K2
            # Tokenizer is read from the model cache (offline).
            - name: TOKENIZER
              value: skt/A.X-K2
            - name: HF_HOME
              value: /shared-model-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: ARTIFACT_ROOT
              value: /shared-model-cache/perf/axk2
            - name: RANDOM_SEED
              value: "42"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: COLUMNS
              value: "200"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              ulimit -n 600000 || echo "WARNING: could not raise the open-file limit; using $(ulimit -n)"
              apt-get update && apt-get install -y --no-install-recommends curl jq && apt-get clean
              pip install -q "aiperf==0.10.0" "transformers==4.57.3" "tokenizers==0.22.2"

              case "${WORKLOAD}" in
                w1) PREFIX_LEN=10240; NUM_PREFIXES=32; UNIQUE_ISL=6144 ;;
                w2) PREFIX_LEN=0;     NUM_PREFIXES=0;  UNIQUE_ISL=16384 ;;
                w3) PREFIX_LEN=10240; NUM_PREFIXES=1;  UNIQUE_ISL=6144 ;;
                *) echo "ERROR: WORKLOAD must be w1, w2, or w3 (got '${WORKLOAD}')"; exit 1 ;;
              esac
              OSL=1024

              echo "Waiting for model '${TARGET_MODEL}' at http://${ENDPOINT}/v1/models ..."
              attempt=0
              until curl -sf "http://${ENDPOINT}/v1/models" | jq -e --arg m "${TARGET_MODEL}" '.data[]? | select(.id == $m)' >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "${attempt}" -ge 720 ]; then
                  echo "ERROR: model '${TARGET_MODEL}' not ready after 1h. Aborting."
                  exit 1
                fi
                echo "[$(date '+%H:%M:%S')] not ready (attempt ${attempt}/720), sleeping 5s"
                sleep 5
              done
              curl -s "http://${ENDPOINT}/v1/models" | jq .

              ROOT_DIR="${ARTIFACT_ROOT}/$(date +%Y%m%d-%H%M%S)_${WORKLOAD}_${ENDPOINT%%:*}"
              mkdir -p "${ROOT_DIR}"
              echo "=============================================="
              echo "A.X-K2 closed-loop sweep (aiperf)"
              echo "=============================================="
              echo "Endpoint:      http://${ENDPOINT}"
              echo "Model:         ${TARGET_MODEL}"
              echo "Workload:      ${WORKLOAD} (prefix ${PREFIX_LEN} x ${NUM_PREFIXES} pool + ${UNIQUE_ISL} unique -> ${OSL} out)"
              echo "Concurrencies: ${CONCURRENCIES}"
              echo "Artifact root: ${ROOT_DIR}"
              echo "=============================================="

              PREFIX_FLAGS=""
              if [ "${NUM_PREFIXES}" -gt 0 ]; then
                PREFIX_FLAGS="--prefix-prompt-length ${PREFIX_LEN} --num-prefix-prompts ${NUM_PREFIXES}"
              fi

              for c in ${CONCURRENCIES}; do
                # 12 requests per concurrency slot (minimum 48) keeps every cell
                # in steady state for roughly 6-12 minutes at 16K/1K.
                REQUESTS=$(( c * 12 < 48 ? 48 : c * 12 ))
                RUN_DIR="${ROOT_DIR}/c${c}"
                mkdir -p "${RUN_DIR}"
                echo ""
                echo "================================================================"
                echo " concurrency=${c}   requests=${REQUESTS}   artifact=${RUN_DIR}"
                echo "================================================================"
                # 90-minute guard per cell: a decode KV-saturation stall otherwise
                # holds the Job until activeDeadlineSeconds. A failed or timed-out
                # cell is reported and the sweep continues with the next one.
                # shellcheck disable=SC2086
                if ! timeout 90m aiperf profile \
                  --model "${TARGET_MODEL}" \
                  --tokenizer "${TOKENIZER}" \
                  --tokenizer-trust-remote-code \
                  --endpoint-type chat \
                  --endpoint /v1/chat/completions \
                  --streaming \
                  --url "http://${ENDPOINT}" \
                  --synthetic-input-tokens-mean "${UNIQUE_ISL}" \
                  --synthetic-input-tokens-stddev 0 \
                  ${PREFIX_FLAGS} \
                  --output-tokens-mean "${OSL}" \
                  --output-tokens-stddev 0 \
                  --extra-inputs "max_tokens:${OSL}" \
                  --extra-inputs "min_tokens:${OSL}" \
                  --extra-inputs "ignore_eos:true" \
                  --concurrency "${c}" \
                  --request-count "${REQUESTS}" \
                  --warmup-request-count 32 \
                  --num-dataset-entries "${REQUESTS}" \
                  --random-seed "${RANDOM_SEED}" \
                  --request-timeout-seconds 1800 \
                  --ui simple \
                  --artifact-dir "${RUN_DIR}"; then
                  echo "WARNING: concurrency ${c} failed or timed out; continuing sweep"
                else
                  echo "Concurrency ${c} complete; artifacts in ${RUN_DIR}"
                fi
                # Let in-flight decode drain and KV usage settle between cells.
                sleep 60
              done

              echo ""
              echo "Sweep complete. Root: ${ROOT_DIR}"
              echo "Total tok/s (input+output) = request_throughput x (${PREFIX_LEN} + ${UNIQUE_ISL} + ${OSL}); per-GPU = / GPUs in the DGD (32 for the shipped recipes)"
              ls -la "${ROOT_DIR}"
          resources:
            requests:
              cpu: "8"
              memory: 16Gi
            limits:
              cpu: "16"
              memory: 32Gi
          volumeMounts:
            - name: shared-model-cache
              mountPath: /shared-model-cache
      volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
