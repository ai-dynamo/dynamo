#
# AIPerf synthetic agentic benchmark for the Nemotron 3.5 Super VL aggregate DGD.
#
# The workload is synthetic and approximates the Terminal Bench 2.1 mooncake
# trace, so no trace file has to be staged on the PVC.
#
# Restart the DGD pods between independent concurrency points so TensorRT-LLM
# KV-cache state and Dynamo routing state are reset.
#
# Prerequisites:
# - Target DGD is Ready (see ../README.md)
#
# Results: /model-cache/perf/<epoch>_<job-name>/
apiVersion: batch/v1
kind: Job
metadata:
  name: nemotron-35-super-vl-bench
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 10800
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: nemotron-35-super-vl-bench
    spec:
      # Prefer co-locating the benchmark pod with the Nemotron 3.5 Super VL DGD frontend.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: nvidia.com/dynamo-component-type
                  operator: In
                  values:
                  - frontend
                - key: nvidia.com/dynamo-graph-deployment-name
                  operator: In
                  values:
                  # Change together with ENDPOINT, TARGET_MODEL and CONCURRENCY below.
                  # Variants: nemotron-35-super-vl-agg-{b200,gb200,h200}-agentic
                  - nemotron-35-super-vl-agg-b200
              topologyKey: kubernetes.io/hostname
      # tolerations: # Uncomment and populate for tainted frontend nodes.
      containers:
      - name: perf
        image: nvcr.io/nvidia/ai-dynamo/aiperf:0.11.0
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          ulimit -n 600000
          export COLUMNS=200
          EPOCH=$(/busybox/date +%s)

          wait_for_model_ready() {
            python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          endpoint = os.environ["ENDPOINT"]
          model = os.environ["TARGET_MODEL"]
          max_attempts = int(os.environ.get("WAIT_FOR_MODEL_MAX_ATTEMPTS", "720"))
          url = f"http://{endpoint}/v1/models"

          print(f"Waiting for model '{model}' at {url} (max {max_attempts} attempts) ...")
          for attempt in range(1, max_attempts + 1):
              try:
                  with urllib.request.urlopen(url, timeout=5) as response:
                      payload = json.load(response)
                  if any(item.get("id") == model for item in payload.get("data", [])):
                      print(json.dumps(payload, indent=2))
                      raise SystemExit(0)
              except Exception:
                  pass

              if attempt == max_attempts:
                  break
              timestamp = time.strftime("%H:%M:%S")
              print(f"[{timestamp}] not ready (attempt {attempt}/{max_attempts}), sleeping 5s")
              time.sleep(5)

          raise SystemExit(
              f"model '{model}' did not become ready after {max_attempts} attempts"
          )
          PY
          }

          wait_for_model_ready
          ROOT_DIR="${ROOT_ARTIFACT_DIR}/${EPOCH}_${JOB_NAME}"
          /busybox/mkdir -p "$ROOT_DIR"
          echo "=============================================="
          echo "Synthetic Agentic Benchmark (aiperf)"
          echo "=============================================="
          echo "Endpoint:     http://${ENDPOINT}"
          echo "Model:        ${TARGET_MODEL}"
          echo "ISL/OSL:      ${FRESH_ISL}/${OSL} (+${SHARED_PROMPT_LEN} shared)"
          echo "Concurrency:  ${CONCURRENCY}"
          echo "Artifact root:${ROOT_DIR}"
          echo "=============================================="

          # Warmup
          WARMUP_DIR="${ROOT_DIR}/warmup"
          /busybox/mkdir -p "$WARMUP_DIR"
          aiperf profile \
            -m "$TARGET_MODEL" \
            --tokenizer "$TARGET_MODEL" \
            --tokenizer-trust-remote-code \
            --url "http://$ENDPOINT" \
            --streaming \
            --ui simple \
            --isl 8000 \
            --osl 400 \
            --concurrency 1 \
            --request-count 5 \
            --artifact-dir "$WARMUP_DIR"
          echo "Warmup complete"

          MODEL_BASE="${TARGET_MODEL##*/}"
          TS=$(/busybox/date +'%Y%m%d_%H%M%S')
          RUN_DIR="${ROOT_DIR}/${MODEL_BASE}_tbench_c${CONCURRENCY}_${TS}"
          /busybox/mkdir -p "$RUN_DIR"
          aiperf profile \
            -m "$TARGET_MODEL" \
            --tokenizer "$TARGET_MODEL" \
            --tokenizer-trust-remote-code \
            --shared-system-prompt-length "$SHARED_PROMPT_LEN" \
            --isl "$FRESH_ISL" \
            --osl "$OSL" \
            --num-requests $((3 * CONCURRENCY)) \
            --url "http://$ENDPOINT" \
            --streaming \
            --use-server-token-count \
            --extra-inputs ignore_eos:true \
            --extra-inputs "cache_salt:salt_${EPOCH}" \
            --concurrency "$CONCURRENCY" \
            --workers-max "$CONCURRENCY" \
            --warmup-request-count 1 \
            --random-seed 42 \
            --ui simple \
            --artifact-dir "$RUN_DIR" \
            --request-timeout-seconds 600 \
            --export-http-trace
          echo "Concurrency ${CONCURRENCY} complete; artifacts in ${RUN_DIR}"
          /busybox/ls -la "$RUN_DIR" || true
          echo ""
          echo "Done. Root: ${ROOT_DIR}"
        # The checkpoint is a private repo, so AIPerf needs the same token as the
        # workers to pull its tokenizer for client-side token counting.
        envFrom:
        - secretRef:
            name: hf-token-secret
        env:
        # Change together with podAffinity graph-deployment-name above.
        - name: ENDPOINT
          value: nemotron-35-super-vl-agg-b200-frontend:8000
        # Workload approximates the Terminal Bench 2.1 mooncake trace
        # (qwen_3_6_35b_terminal_bench_2_1_base_mooncake, 32,887 requests /
        # 712 sessions). Median total ISL 42,684 decomposes as:
        #   640 globally shared + 41,600 per-session context + 444 fresh.
        # The per-session context is what makes this differ from a single
        # global shared prompt: 712 distinct session prefixes reproduce the
        # concurrent KV footprint of the trace instead of collapsing it into
        # one cached prefix.
        # Approximates the Terminal Bench 2.1 trace with one globally shared prefix,
        # the same way the gemma4-31b recipe approximates its agentic trace. The
        # trace's median request is 42,684 input tokens of which 42,240 are a cache
        # hit (99.2% token-weighted), leaving 444 fresh; median output is 417.
        #
        # This reproduces the TTFT/throughput/latency a highly-cached agentic
        # workload sees. It does NOT reproduce the trace's KV footprint: real reuse
        # is per-session across many growing contexts, not one prefix shared by
        # every request, so concurrent KV demand here is far lower.
        - name: SHARED_PROMPT_LEN
          value: "42240"
        - name: FRESH_ISL
          value: "444"
        - name: OSL
          value: "417"
        # Blackwell (b200/gb200) variants serve this trace at c=192 within a
        # ~3s TTFT p50. The h200 variant cannot: bf16 weights plus a 16-bit KV
        # cache (fp8 KV is unavailable on Hopper for this model) leave far less
        # KV pool, so c=192 runs deep in admission queueing and TTFT p50 reaches
        # ~5 minutes. Use CONCURRENCY=32 for h200, which keeps TTFT p50 at
        # ~1.6s while reaching most of the achievable throughput.
        - name: CONCURRENCY
          value: "192"
        # h200 variant serves bf16 weights, so use nvidia/nemotron_35_super_conservative_fp8kv there.
        - name: TARGET_MODEL
          value: nvidia/nemotron_35_super_conservative_fp8kv
        - name: AIPERF_HTTP_CONNECTION_LIMIT
          value: "200"
        - name: AIPERF_HTTP_SO_RCVTIMEO
          value: "120"
        - name: AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT
          value: "3600"
        - name: AIPERF_DATASET_CONFIGURATION_TIMEOUT
          value: "3600"
        - name: JOB_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.labels['job-name']
        - name: ROOT_ARTIFACT_DIR
          value: /model-cache/perf
        - name: HF_HOME
          value: /model-cache
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
          limits:
            cpu: "16"
            memory: 64Gi
        volumeMounts:
        - name: model-cache
          mountPath: /model-cache
      restartPolicy: Never
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: shared-model-cache
