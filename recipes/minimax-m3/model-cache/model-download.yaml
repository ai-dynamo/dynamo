apiVersion: batch/v1
kind: Job
metadata:
  name: minimax-m3-model-download
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: minimax-m3-model-download
    spec:
      restartPolicy: Never
      containers:
        - name: model-download
          image: python:3.10-slim
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command: ["sh", "-c"]
          envFrom:
            - secretRef:
                name: hf-token-secret
          env:
            - name: HF_HOME
              value: /shared-model-cache
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          args:
            - |
              set -eux
              pip install --no-cache-dir huggingface_hub==1.16.4
              hf download nvidia/MiniMax-M3-NVFP4 \
                --revision 901464083161bf8612a29ff7ad29914cd4ab4a85
              hf download Inferact/MiniMax-M3-EAGLE3-GQA \
                --revision 96692486b5fd38ebf8fd2a5f6bb53427d30819a8
          volumeMounts:
            - name: shared-model-cache
              mountPath: /shared-model-cache
      volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
