- op: test
  path: /spec/components/1/name
  value: PrefillWorker
- op: test
  path: /spec/components/1/type
  value: prefill
- op: test
  path: /spec/components/1/podTemplate/spec/containers/0/name
  value: main
# Allow up to two hours for worker initialization before restarting.
- op: add
  path: /spec/components/1/podTemplate/spec/containers/0/startupProbe
  value:
    httpGet:
      path: /live
      port: system
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 720
# Allow first-request FMHA compilation to finish before restarting.
- op: add
  path: /spec/components/1/podTemplate/spec/containers/0/livenessProbe
  value:
    httpGet:
      path: /live
      port: 9090
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 12
# Keep the worker discoverable while cold compilation delays health checks.
- op: add
  path: /spec/components/1/podTemplate/spec/containers/0/readinessProbe
  value:
    httpGet:
      path: /health
      port: system
    periodSeconds: 10
    timeoutSeconds: 4
    failureThreshold: 18

