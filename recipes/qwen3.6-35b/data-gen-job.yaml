#
# Generate 30u_8t_5w_8000word_sharedtext_base64_uuid.jsonl into
# /perf-cache/datasets/. Sliding-window: 30 users × 8 turns × window=5 =
# 240 requests over 12 unique images per user, 8000 text tokens per
# request, 2400x1080 base64-inlined. --shared-user-text emits one user
# text shared by every row (KV prefix), and --uuid emits image_uuids for
# AIPerf --uuid-and-strip. Each row has session_id=user_<N> so aiperf
# issues same-user turns in causal order.
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen36-generate-datasets
  labels:
    app.kubernetes.io/name: qwen3.6-35b
    app.kubernetes.io/component: data-gen
    app.kubernetes.io/managed-by: dynamo-recipe
spec:
  backoffLimit: 1
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3.6-35b
        app.kubernetes.io/component: data-gen
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: generate-datasets
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          imagePullPolicy: IfNotPresent
          # No privilege escalation, drop all Linux caps, default seccomp.
          # runAsUser:0 is set at the pod level for PVC fsGroup writes —
          # this container security context complements it without removing
          # the root requirement.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            # vllm-runtime:1.3.0 has git/python/numpy/pillow baked in. The
            # --shared-user-text and --uuid flags live on this benchmark
            # branch, so we shallow fetch the branch and run the generator
            # from the clone rather than the image's older baked copy.
            - name: DYNAMO_REF
              value: "qiwa/vllm-ec-uuid-benchmark"
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              GEN_SRC=/tmp/dynamo-jsonl
              rm -rf "$GEN_SRC"
              git init -q "$GEN_SRC"
              git -C "$GEN_SRC" remote add origin https://github.com/ai-dynamo/dynamo.git
              git -C "$GEN_SRC" fetch --depth=1 origin "$DYNAMO_REF"
              git -C "$GEN_SRC" checkout -q FETCH_HEAD
              cd "$GEN_SRC/benchmarks/multimodal/jsonl"
              echo "[gen] using dynamo @ $(git -C $GEN_SRC rev-parse --short HEAD)"
              python3 main.py --help | head -3
              OUTPUT_DIR="/perf-cache/datasets"
              IMAGE_DIR="/perf-cache/images/2400x1080"
              mkdir -p "${OUTPUT_DIR}" "${IMAGE_DIR}"
              python3 main.py sliding-window \
                --num-users 30 \
                --turns-per-user 8 \
                --window-size 5 \
                --image-size 2400 1080 \
                --image-mode base64 \
                --image-dir "${IMAGE_DIR}" \
                --user-text-tokens 8000 \
                --uuid \
                --shared-user-text \
                -o "${OUTPUT_DIR}/30u_8t_5w_8000word_sharedtext_base64_uuid.jsonl"
              ls -lh "${OUTPUT_DIR}/30u_8t_5w_8000word_sharedtext_base64_uuid.jsonl"
              echo "Dataset generation complete in ${OUTPUT_DIR}"
          volumeMounts:
            - name: shared-model-cache
              mountPath: /perf-cache
              # Per-recipe subdir so different recipes (qwen36, qwen3-vl-30b…)
              # don't collide on /perf-cache/datasets and /perf-cache/images.
              subPath: qwen36-bench/perf-cache
      volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
