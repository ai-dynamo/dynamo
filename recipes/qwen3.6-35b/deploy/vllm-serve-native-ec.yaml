#
# vllm serve with native vLLM CPU embedding-cache (ECCPUConnector).
# Same baseline params as vllm-serve.yaml plus --ec-transfer-config and
# VLLM_USE_V2_MODEL_RUNNER=1.
---
apiVersion: v1
kind: Service
metadata:
  name: qwen36-vllm-serve-native-ec
  labels:
    app.kubernetes.io/name: qwen3.6-35b
    app.kubernetes.io/component: vllm-serve-native-ec
    app.kubernetes.io/managed-by: dynamo-recipe
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qwen3.6-35b
    app.kubernetes.io/component: vllm-serve-native-ec
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen36-vllm-serve-native-ec
  labels:
    app.kubernetes.io/name: qwen3.6-35b
    app.kubernetes.io/component: vllm-serve-native-ec
    app.kubernetes.io/managed-by: dynamo-recipe
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen3.6-35b
      app.kubernetes.io/component: vllm-serve-native-ec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3.6-35b
        app.kubernetes.io/component: vllm-serve-native-ec
        app.kubernetes.io/managed-by: dynamo-recipe
    spec:
      restartPolicy: Always
      nodeSelector: ${HW_NODE_SELECTOR}
      tolerations: ${HW_TOLERATIONS}
      securityContext:
        runAsUser: 0
      containers:
        - name: vllm
          image: ${VLLM_IMAGE}
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              ulimit -l unlimited
              exec vllm serve "${MODEL_NAME}" \
                --host 0.0.0.0 \
                --port 8000 \
                --tensor-parallel-size 1 \
                --gpu-memory-utilization 0.85 \
                --max-model-len 32768 \
                --mm-processor-cache-gb 30 \
                --enable-prefix-caching \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_coder \
                --reasoning-parser qwen3 \
                --no-enable-log-requests \
                --ec-transfer-config '{"ec_connector":"ECCPUConnector","ec_role":"ec_both","ec_connector_extra_config":{"ec_cpu_bytes":4294967296}}'
          env:
            - name: MODEL_NAME
              value: "Qwen/Qwen3.6-35B-A3B-FP8"
            - name: HF_HOME
              value: /home/dynamo/.cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /home/dynamo/.cache/vllm
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: VLLM_USE_V2_MODEL_RUNNER
              value: "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "1"
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
          volumeMounts:
            - name: shared-model-cache
              mountPath: /home/dynamo/.cache/huggingface
            - name: shared-model-cache
              mountPath: /home/dynamo/.cache/vllm
              subPath: qwen36-bench/vllm-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 40Gi
