apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: disagg-workers
spec:
  components:
  - name: DecodeWorker
    podTemplate:
      spec:
        containers:
        - name: main
          securityContext: &rdmaSecurityContext
            privileged: true
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
          env: &rdmaEnvironment
          - name: NIXL_TELEMETRY_ENABLE
            value: "y"
          - name: NIXL_TELEMETRY_EXPORTER
            value: prometheus
          - name: NIXL_TELEMETRY_PROMETHEUS_PORT
            value: "19090"
          - name: NCCL_DEBUG
            value: WARN
  - name: PrefillWorker
    podTemplate:
      spec:
        containers:
        - name: main
          securityContext: *rdmaSecurityContext
          env: *rdmaEnvironment
