apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: disagg-workers
spec:
  services:
    PrefillWorker:
      extraPodSpec:
        tolerations: &gpuTolerations
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        mainContainer:
          env: &nscaleEnvironment
            - name: NIXL_LOG_LEVEL
              value: INFO
            # Compute-fabric NICs only; mlx5_6..9 are side fabric on the referenced Nscale nodes.
            - name: UCX_NET_DEVICES
              value: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_10:1,mlx5_11:1
          volumeMounts: &nscaleVolumeMounts
            - name: ib
              mountPath: /dev/infiniband
            - name: shm
              mountPath: /dev/shm
        volumes: &nscaleVolumes
          - name: ib
            hostPath:
              path: /dev/infiniband
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi
      resources: &nscaleResources
        limits:
          custom:
            rdma/ib: "1"
        requests:
          custom:
            rdma/ib: "1"
    DecodeWorker:
      extraPodSpec:
        tolerations: *gpuTolerations
        mainContainer:
          env: *nscaleEnvironment
          volumeMounts: *nscaleVolumeMounts
        volumes: *nscaleVolumes
      resources: *nscaleResources
