apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: disagg-workers
spec:
  services:
    PrefillWorker: &nscaleWorker
      extraPodSpec:
        tolerations: &gpuTolerations
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        mainContainer:
          env: &nscaleEnvironment
            - name: NIXL_LOG_LEVEL
              value: INFO
      resources:
        limits: &nscaleRdmaResources
          custom:
            rdma/ib: "1"
        requests: *nscaleRdmaResources
    DecodeWorker: *nscaleWorker
