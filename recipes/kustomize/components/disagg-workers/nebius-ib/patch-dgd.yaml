apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: disagg-workers
spec:
  services:
    PrefillWorker: &nebiusWorker
      extraPodSpec:
        mainContainer:
          env: &nebiusEnvironment
            - name: NCCL_SOCKET_IFNAME
              value: eth0
          volumeMounts: &nebiusVolumeMounts
            - name: ib
              mountPath: /dev/infiniband
            - name: shm
              mountPath: /dev/shm
        volumes: &nebiusVolumes
          - name: ib
            hostPath:
              path: /dev/infiniband
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi
      resources: &nebiusResources
        limits:
          custom:
            rdma/ib: "1"
        requests:
          custom:
            rdma/ib: "1"
    DecodeWorker: *nebiusWorker
