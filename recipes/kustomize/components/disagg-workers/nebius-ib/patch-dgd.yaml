apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: disagg-workers
spec:
  components:
  - name: DecodeWorker
    podTemplate:
      spec:
        containers:
        - name: main
          env: &nebiusEnvironment
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          resources:
            requests:
              rdma/ib: "1"
            limits:
              rdma/ib: "1"
          volumeMounts: &nebiusVolumeMounts
          - name: ib
            mountPath: /dev/infiniband
          - name: shm
            mountPath: /dev/shm
        volumes: &nebiusVolumes
        - name: ib
          hostPath:
            path: /dev/infiniband
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
  - name: PrefillWorker
    podTemplate:
      spec:
        containers:
        - name: main
          env: *nebiusEnvironment
          resources:
            requests:
              rdma/ib: "1"
            limits:
              rdma/ib: "1"
          volumeMounts: *nebiusVolumeMounts
        volumes: *nebiusVolumes
