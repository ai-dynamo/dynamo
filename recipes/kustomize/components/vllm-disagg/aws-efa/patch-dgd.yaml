apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-disagg-aws-efa
spec:
  components:
  - name: DecodeWorker
    podTemplate:
      spec:
        containers:
        - name: main
          env:
          - name: KV_TRANSFER_CONFIG
            value: '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"backends":["LIBFABRIC"]}}'
  - name: PrefillWorker
    podTemplate:
      spec:
        containers:
        - name: main
          env:
          - name: KV_TRANSFER_CONFIG
            value: '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_connector_extra_config":{"backends":["LIBFABRIC"]}}'
