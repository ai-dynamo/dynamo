apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-config
data:
  prefill.yaml: |
    cache_transceiver_config:
      backend: UCX
      max_tokens_in_buffer: 9216
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 30
    disable_overlap_scheduler: true
    enable_attention_dp: false
    kv_cache_config:
      dtype: fp8
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.8
    max_batch_size: 64
    max_num_tokens: 20000
    max_seq_len: 9000
    moe_config:
      backend: TRTLLM
    moe_expert_parallel_size: 1
    pipeline_parallel_size: 1
    print_iter_log: true
    stream_interval: 20
    tensor_parallel_size: 1
    trust_remote_code: true
  decode.yaml: |
    allreduce_strategy: AUTO
    attention_dp_config:
      enable_balance: true
    cache_transceiver_config:
      backend: UCX
      max_tokens_in_buffer: 9216
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 1280
    disable_overlap_scheduler: false
    enable_attention_dp: false
    kv_cache_config:
      dtype: fp8
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.85
    max_batch_size: 1280
    max_num_tokens: 20000
    max_seq_len: 11000
    moe_config:
      backend: TRTLLM
    moe_expert_parallel_size: 1
    pipeline_parallel_size: 1
    print_iter_log: true
    stream_interval: 20
    tensor_parallel_size: 4
    trust_remote_code: true
spec:
  components: []
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: gpt-oss-disagg
spec:
  backendFramework: trtllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
              command:
                - /bin/sh
                - -c
              args:
                - python3 -m dynamo.frontend --router-mode round-robin --http-port 8000
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: nvidia.com/dynamo-graph-deployment-name
                        operator: In
                        values:
                          - gpt-oss-disagg-frontend
                  topologyKey: kubernetes.io/hostname
    - name: TrtllmDecodeWorker
      type: decode
      replicas: 1
      sharedMemorySize: 80Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
              command:
                - /bin/sh
                - -c
              args:
                - |
                  python3 -m dynamo.trtllm \
                    --model-path "${MODEL_PATH}" \
                    --served-model-name "openai/gpt-oss-120b" \
                    --extra-engine-args "${ENGINE_ARGS}" \
                    --disaggregation-mode decode
              workingDir: /workspace/examples/backends/trtllm
              env:
                - name: TRTLLM_ENABLE_PDL
                  value: "1"
                - name: TRT_LLM_DISABLE_LOAD_WEIGHTS_IN_PARALLEL
                  value: "True"
                - name: OVERRIDE_QUANT_ALGO
                  value: "W4A8_MXFP4_MXFP8"
                - name: NCCL_GRAPH_REGISTER
                  value: "0"
                - name: OMPI_MCA_coll_ucc_enable
                  value: "0"
                - name: SERVED_MODEL_NAME
                  value: "openai/gpt-oss-120b"
                - name: ENGINE_ARGS
                  value: "/opt/dynamo/configs/decode.yaml"
                - name: MODEL_PATH
                  value: "openai/gpt-oss-120b"
                - name: HF_HOME
                  value: /opt/models
              envFrom:
                - secretRef:
                    name: hf-token-secret
              resources:
                requests:
                  nvidia.com/gpu: "4"
                limits:
                  nvidia.com/gpu: "4"
              volumeMounts:
                - mountPath: /opt/dynamo/configs
                  name: llm-config
                  readOnly: true
                - name: model-cache
                  mountPath: /opt/models
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.present
                        operator: In
                        values:
                          - "true"
          volumes:
            - configMap:
                name: llm-config
              name: llm-config
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
    - name: TrtllmPrefillWorker
      type: prefill
      replicas: 1
      sharedMemorySize: 80Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
              command:
                - /bin/sh
                - -c
              args:
                - |
                  python3 -m dynamo.trtllm \
                    --model-path "${MODEL_PATH}" \
                    --served-model-name "openai/gpt-oss-120b" \
                    --extra-engine-args "${ENGINE_ARGS}" \
                    --disaggregation-mode prefill
              workingDir: /workspace/examples/backends/trtllm
              env:
                - name: TRTLLM_ENABLE_PDL
                  value: "1"
                - name: TRT_LLM_DISABLE_LOAD_WEIGHTS_IN_PARALLEL
                  value: "True"
                - name: OVERRIDE_QUANT_ALGO
                  value: "W4A8_MXFP4_MXFP8"
                - name: NCCL_GRAPH_REGISTER
                  value: "0"
                - name: OMPI_MCA_coll_ucc_enable
                  value: "0"
                - name: SERVED_MODEL_NAME
                  value: "openai/gpt-oss-120b"
                - name: ENGINE_ARGS
                  value: "/opt/dynamo/configs/prefill.yaml"
                - name: MODEL_PATH
                  value: "openai/gpt-oss-120b"
                - name: HF_HOME
                  value: /opt/models
              envFrom:
                - secretRef:
                    name: hf-token-secret
              resources:
                requests:
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
              volumeMounts:
                - mountPath: /opt/dynamo/configs
                  name: llm-config
                  readOnly: true
                - name: model-cache
                  mountPath: /opt/models
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.present
                        operator: In
                        values:
                          - "true"
          volumes:
            - configMap:
                name: llm-config
              name: llm-config
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
