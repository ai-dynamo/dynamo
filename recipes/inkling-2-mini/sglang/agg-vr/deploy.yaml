# Aggregated, 2x Vera Rubin (VR-NVL72, sm_107) (TP2/EP2), Dynamo SGLang.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: inkling-2-mini-sglang-agg
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      runtimeVersionOverride: "1.7.0"
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.8.0-inkling-2-mini-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.frontend
                - --model-name
                - inkling-2-mini
                - --dyn-chat-processor
                - dynamo
                - --trust-remote-code
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"

    - name: Worker
      type: worker
      replicas: 1
      sharedMemorySize: 16Gi
      runtimeVersionOverride: "1.7.0"
      podTemplate:
        spec:
          nodeSelector:
            kubernetes.io/arch: arm64
            nvidia.com/gpu.machine: VR-NVL72
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.8.0-inkling-2-mini-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.sglang
                - --model-path
                - $(MODEL_NAME)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --trust-remote-code
                - --tp
                - "2"
                - --ep-size
                - "2"
                - --attention-backend
                - fa4
                - --page-size
                - "128"
                - --dtype
                - bfloat16
                - --grammar-backend
                - xgrammar
                - --mem-fraction-static
                - "0.6"
                - --dyn-reasoning-parser
                - inkling
                - --dyn-tool-call-parser
                - inkling
                - --enable-metrics
                - --enable-multimodal
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              env:
                - name: MODEL_NAME
                  value: /shared-model-cache/Inkling-2-Mini
                - name: SERVED_MODEL_NAME
                  value: inkling-2-mini
                - name: DYN_HEALTH_CHECK_ENABLED
                  value: "false"
                - name: CUDA_HOME
                  value: /opt/cuda134-home
                - name: TRITON_PTXAS_BLACKWELL_PATH
                  value: /opt/cuda134/nvcc/nvidia/cu13/bin/ptxas
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              resources:
                requests:
                  cpu: "8"
                  memory: 64Gi
                limits:
                  nvidia.com/gpu: "2"
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                  readOnly: true
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
