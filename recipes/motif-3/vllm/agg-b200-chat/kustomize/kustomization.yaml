apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
sortOptions:
  order: fifo
resources:
  - ../base
components:
  # Dynamo release/1.5.0 schema, pinned so rendering is reproducible.
  - https://github.com/ai-dynamo/dynamo//recipes/kustomize/components/dynamo-openapi?ref=b83b1d9304ebfc624709ac46db32b1b6f1ff1615&timeout=120s
  - components/registry-credentials/agg
  - components/scheduling/agg
