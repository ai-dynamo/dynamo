apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: motif3-agg-b200
spec:
  components:
    - name: Frontend
      podTemplate:
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
    - name: Worker
      podTemplate:
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
            node.kubernetes.io/instance-type: g.192.b200.8
            nvidia.com/gpu.product: NVIDIA-B200
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
