apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: motif3-disagg-b200
spec:
  components:
  - name: Frontend
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
  - name: PrefillWorker
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
          node.kubernetes.io/instance-type: g.192.b200.8
          nvidia.com/gpu.product: NVIDIA-B200
        containers:
        - name: main
          env:
          - name: UCX_TLS
            value: rc_x,rc,cuda_copy,cuda_ipc
          - name: NIXL_LOG_LEVEL
            value: INFO
          resources:
            requests:
              rdma/shared_ib: '1'
            limits:
              rdma/shared_ib: '1'
  - name: DecodeWorker
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
          node.kubernetes.io/instance-type: g.192.b200.8
          nvidia.com/gpu.product: NVIDIA-B200
        containers:
        - name: main
          env:
          - name: UCX_TLS
            value: rc_x,rc,cuda_copy,cuda_ipc
          - name: NIXL_LOG_LEVEL
            value: INFO
          resources:
            requests:
              rdma/shared_ib: '1'
            limits:
              rdma/shared_ib: '1'
