# Run warmup separately, then clear both worker roles before this profiling run.
# Set variables.concurrency to 8, 16, or 32; preserve all 1,805 trace rows.
schemaVersion: '2.0'
randomSeed: 42
benchmark:
  model: Motif-Technologies/Motif-3-NVFP4
  tokenizer:
    name: Motif-Technologies/Motif-3-NVFP4
    revision: 79f2fad1f8229f5db8a7ad08bbd24a20d6fb0bff
    trustRemoteCode: false
    applyChatTemplate: false
  endpoint:
    url: ${INFERENCE_URL:http://motif3-disagg-b200-frontend:8000/v1/chat/completions}
    type: chat
    streaming: true
    useServerTokenCount: true
    timeout: 7200
    extra:
      ignore_eos: true
      temperature: 0
      seed: 42
  dataset:
    type: file
    path: /shared-model-cache/traces/8k_1k_70kv_chat_new_noschedule_short_15perc.jsonl
    format: mooncake_trace
    sampling: sequential
  profiling:
    type: concurrency
    concurrency: '{{ concurrency }}'
    requests: 1805
  artifacts:
    dir: ${AIPERF_ARTIFACT_DIR}
    prefix: report_aiperf
    summary:
    - json
    records:
    - jsonl
    raw: true
    autoPlot: false
  runtime:
    ui: none
    apiHost: 127.0.0.1
    apiPort: 18080
    workers: '{{ concurrency }}'
variables:
  concurrency: 8
