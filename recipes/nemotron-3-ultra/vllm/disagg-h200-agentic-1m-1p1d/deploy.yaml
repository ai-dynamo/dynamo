---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: ultra-disagg-h200-1m-1p1d
  annotations:
    nemotron-ultra-refresh.nvidia.com/mtp: disabled
    nemotron-ultra-refresh.nvidia.com/prefix-caching: enabled
    nemotron-ultra-refresh.nvidia.com/async-scheduling: enabled
  labels:
    app.kubernetes.io/name: ultra-disagg-h200-1m-1p1d
    app.kubernetes.io/part-of: nemotron-3-ultra
    nemotron-ultra-refresh.nvidia.com/sku: h200
    nemotron-ultra-refresh.nvidia.com/backend: vllm
    nemotron-ultra-refresh.nvidia.com/topology: 1p1d-tp8
    nemotron-ultra-refresh.nvidia.com/context: 1m
    nemotron-ultra-refresh.nvidia.com/workload: agentic
spec:
  backendFramework: vllm
  env:
  - name: HF_HOME
    value: "/opt/models"
  - name: HF_HUB_CACHE
    value: "/opt/models/hub"
  - name: HF_HUB_OFFLINE
    value: '1'
  - name: TRANSFORMERS_OFFLINE
    value: '1'
  - name: SERVED_MODEL_NAME
    value: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
  - name: MODEL_PATH
    value: "/opt/models/patched/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
  - name: HOME
    value: "/tmp"
  - name: HF_MODULES_CACHE
    value: "/tmp/hf_modules"
  - name: XDG_CACHE_HOME
    value: "/tmp/cache"
  - name: TORCH_EXTENSIONS_DIR
    value: "/tmp/torch_extensions"
  - name: TRITON_CACHE_DIR
    value: "/tmp/triton"
  - name: VLLM_CACHE_ROOT
    value: "/tmp/vllm"
  - name: PYTHONHASHSEED
    value: '0'
  - name: VLLM_LOGGING_LEVEL
    value: INFO
  - name: VLLM_WORKER_MULTIPROC_METHOD
    value: spawn
  - name: VLLM_ALLREDUCE_USE_SYMM_MEM
    value: '0'
  - name: VLLM_DISABLED_KERNELS
    value: FlashInferFP8ScaledMMLinearKernel
  - name: VLLM_SSM_CONV_STATE_LAYOUT
    value: DS
  - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
    value: '1'
  - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
    value: '1'
  - name: DYN_VLLM_APPEND_PREFILL_OUTPUT_TOKENS
    value: '0'
  - name: NCCL_CUMEM_ENABLE
    value: '1'
  - name: NCCL_NVLS_ENABLE
    value: '1'
  - name: NCCL_DEBUG
    value: WARN
  - name: DYN_LOG
    value: info,dynamo_kv_router=debug,dynamo_llm::kv_router=debug
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      metadata:
        labels:
          nemotron-ultra-refresh.nvidia.com/role: frontend
          nemotron-ultra-refresh.nvidia.com/topology: 1p1d-tp8
          nemotron-ultra-refresh.nvidia.com/recipe: ultra-disagg-h200-1m-1p1d
      spec:
        imagePullSecrets:
        - name: nvcr-secret
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0@sha256:8401411dc8e968eff9310462102491509e3f93d3ce03d6febc8d5566f067a7b1
          imagePullPolicy: IfNotPresent
          command:
          - "/bin/bash"
          - "-lc"
          args:
          - |
            set -Eeuo pipefail
            exec python3 -m dynamo.frontend   --router-mode kv   --router-kv-events   --kv-cache-block-size 64   --router-track-prefill-tokens   --router-kv-overlap-score-credit-decay 0.1   --http-host 0.0.0.0   --http-port 8000
          ports:
          - name: http
            containerPort: 8000
          startupProbe:
            httpGet:
              path: "/health"
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: "/health"
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: '4'
              memory: 16Gi
            limits:
              cpu: '8'
              memory: 32Gi
          volumeMounts:
          - name: shared-model-cache
            mountPath: "/opt/models"
            readOnly: true
          - name: runtime-tmp
            mountPath: "/tmp"
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
            readOnly: true
        - name: runtime-tmp
          emptyDir: {}
  - name: VllmPrefillWorker
    type: prefill
    replicas: 1
    sharedMemorySize: 64Gi
    podTemplate:
      metadata:
        labels:
          nemotron-ultra-refresh.nvidia.com/role: prefill
          nemotron-ultra-refresh.nvidia.com/topology: 1p1d-tp8
          nemotron-ultra-refresh.nvidia.com/recipe: ultra-disagg-h200-1m-1p1d
      spec:
        imagePullSecrets:
        - name: nvcr-secret
        runtimeClassName: nvidia
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-H200
        tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: 'true'
          effect: NoSchedule
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0@sha256:8401411dc8e968eff9310462102491509e3f93d3ce03d6febc8d5566f067a7b1
          imagePullPolicy: IfNotPresent
          workingDir: "/workspace"
          command:
          - "/bin/bash"
          - "-lc"
          args:
          - |
            set -Eeuo pipefail
            test -r "${MODEL_PATH}/config.json" || { echo "MODEL_PREFLIGHT_FAIL class=model_config_missing path=${MODEL_PATH}"; exit 42; }
            PLUGIN="${MODEL_PATH}/ultra_v3_reasoning_parser.py"
            test -r "${PLUGIN}" || { echo "MODEL_PREFLIGHT_FAIL class=reasoning_parser_missing path=${PLUGIN}"; exit 43; }
            echo "PRESTART_GPU_GUARD_BEGIN role=prefill"
            visible_count="$(nvidia-smi -L | grep -c '^GPU ')"
            test "${visible_count}" -eq 8 || { echo "PRESTART_GPU_GUARD_FAIL class=gpu_visibility_count_mismatch role=prefill visible_count=${visible_count}"; exit 96; }
            nvidia-smi --query-gpu=index,uuid,memory.total,memory.used,memory.free,utilization.gpu --format=csv,noheader,nounits
            ls -l /dev/infiniband
            UCX_NET_DEVICES=""
            for uverbs in /dev/infiniband/uverbs*; do
              [ -e "${uverbs}" ] || continue
              index="${uverbs##*uverbs}"
              UCX_NET_DEVICES="${UCX_NET_DEVICES:+${UCX_NET_DEVICES},}mlx5_${index}:1"
            done
            test -n "${UCX_NET_DEVICES}" || { echo "RDMA_PREFLIGHT_FAIL class=no_uverbs role=prefill"; exit 98; }
            export UCX_NET_DEVICES
            echo "RDMA_PREFLIGHT_PASS role=prefill UCX_NET_DEVICES=${UCX_NET_DEVICES}"
            ulimit -l unlimited
            exec python3 -m dynamo.vllm   --model "${MODEL_PATH}" \
              --served-model-name "${SERVED_MODEL_NAME}" \
              --tensor-parallel-size 8 \
              --data-parallel-size 1 \
              --pipeline-parallel-size 1 \
              --decode-context-parallel-size 1 \
              --no-enable-expert-parallel \
              --trust-remote-code \
              --kv-cache-dtype fp8 \
              --max-model-len 1048576 \
              --max-num-seqs 256 \
              --max-num-batched-tokens 24576 \
              --gpu-memory-utilization 0.95 \
              --block-size 64 \
              --attention-backend FLASH_ATTN \
              --mamba-backend triton \
              --no-enable-flashinfer-autotune \
              --mamba-cache-mode align \
              --mamba-ssm-cache-dtype bfloat16 \
              --enable-prefix-caching \
              --no-disable-hybrid-kv-cache-manager \
              --async-scheduling \
              -cc.pass_config.fuse_norm_quant=True \
              -cc.pass_config.fuse_act_quant=True \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}' \
              --disaggregation-mode prefill \
              --dyn-tool-call-parser qwen3_coder \
              --dyn-reasoning-parser nemotron3 \
              --reasoning-parser-plugin "${PLUGIN}" \
              --reasoning-parser nemotron_v3 \
              --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5571","enable_kv_cache_events":true}'
          env:
          - name: UCX_TLS
            value: rc_x,rc,cuda_copy,cuda_ipc
          - name: UCX_IB_ADDR_TYPE
            value: eth
          - name: UCX_RNDV_SCHEME
            value: get_zcopy
          - name: UCX_RNDV_THRESH
            value: '0'
          - name: UCX_RC_TIMEOUT
            value: 600s
          - name: UCX_KEEPALIVE_INTERVAL
            value: 300s
          - name: NCCL_IB_DISABLE
            value: '0'
          - name: NCCL_STORE_TIMEOUT
            value: '7200'
          - name: NIXL_LOG_LEVEL
            value: INFO
          resources:
            requests:
              nvidia.com/gpu: '8'
              rdma/ib: '8'
              memory: 750Gi
              ephemeral-storage: 20Gi
            limits:
              nvidia.com/gpu: '8'
              rdma/ib: '8'
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          startupProbe:
            httpGet:
              path: "/live"
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 30
          volumeMounts:
          - name: shared-model-cache
            mountPath: "/opt/models"
            readOnly: true
          - name: runtime-tmp
            mountPath: "/tmp"
          - name: dshm
            mountPath: "/dev/shm"
          - name: flashinfer-cubins
            mountPath: "/usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins/flashinfer"
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
            readOnly: true
        - name: runtime-tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: flashinfer-cubins
          emptyDir:
            medium: Memory
  - name: VllmDecodeWorker
    type: decode
    replicas: 1
    sharedMemorySize: 64Gi
    podTemplate:
      metadata:
        labels:
          nemotron-ultra-refresh.nvidia.com/role: decode
          nemotron-ultra-refresh.nvidia.com/topology: 1p1d-tp8
          nemotron-ultra-refresh.nvidia.com/recipe: ultra-disagg-h200-1m-1p1d
      spec:
        imagePullSecrets:
        - name: nvcr-secret
        runtimeClassName: nvidia
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-H200
        tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: 'true'
          effect: NoSchedule
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0@sha256:8401411dc8e968eff9310462102491509e3f93d3ce03d6febc8d5566f067a7b1
          imagePullPolicy: IfNotPresent
          workingDir: "/workspace"
          command:
          - "/bin/bash"
          - "-lc"
          args:
          - |
            set -Eeuo pipefail
            test -r "${MODEL_PATH}/config.json" || { echo "MODEL_PREFLIGHT_FAIL class=model_config_missing path=${MODEL_PATH}"; exit 42; }
            PLUGIN="${MODEL_PATH}/ultra_v3_reasoning_parser.py"
            test -r "${PLUGIN}" || { echo "MODEL_PREFLIGHT_FAIL class=reasoning_parser_missing path=${PLUGIN}"; exit 43; }
            echo "PRESTART_GPU_GUARD_BEGIN role=decode"
            visible_count="$(nvidia-smi -L | grep -c '^GPU ')"
            test "${visible_count}" -eq 8 || { echo "PRESTART_GPU_GUARD_FAIL class=gpu_visibility_count_mismatch role=decode visible_count=${visible_count}"; exit 96; }
            nvidia-smi --query-gpu=index,uuid,memory.total,memory.used,memory.free,utilization.gpu --format=csv,noheader,nounits
            ls -l /dev/infiniband
            UCX_NET_DEVICES=""
            for uverbs in /dev/infiniband/uverbs*; do
              [ -e "${uverbs}" ] || continue
              index="${uverbs##*uverbs}"
              UCX_NET_DEVICES="${UCX_NET_DEVICES:+${UCX_NET_DEVICES},}mlx5_${index}:1"
            done
            test -n "${UCX_NET_DEVICES}" || { echo "RDMA_PREFLIGHT_FAIL class=no_uverbs role=decode"; exit 98; }
            export UCX_NET_DEVICES
            echo "RDMA_PREFLIGHT_PASS role=decode UCX_NET_DEVICES=${UCX_NET_DEVICES}"
            ulimit -l unlimited
            exec python3 -m dynamo.vllm   --model "${MODEL_PATH}" \
              --served-model-name "${SERVED_MODEL_NAME}" \
              --tensor-parallel-size 8 \
              --data-parallel-size 1 \
              --pipeline-parallel-size 1 \
              --decode-context-parallel-size 1 \
              --no-enable-expert-parallel \
              --trust-remote-code \
              --kv-cache-dtype fp8 \
              --max-model-len 1048576 \
              --max-num-seqs 256 \
              --max-num-batched-tokens 24576 \
              --gpu-memory-utilization 0.95 \
              --block-size 64 \
              --attention-backend FLASH_ATTN \
              --mamba-backend triton \
              --no-enable-flashinfer-autotune \
              --mamba-cache-mode align \
              --mamba-ssm-cache-dtype bfloat16 \
              --enable-prefix-caching \
              --no-disable-hybrid-kv-cache-manager \
              --async-scheduling \
              -cc.pass_config.fuse_norm_quant=True \
              -cc.pass_config.fuse_act_quant=True \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}' \
              --disaggregation-mode decode \
              --dyn-tool-call-parser qwen3_coder \
              --dyn-reasoning-parser nemotron3 \
              --reasoning-parser-plugin "${PLUGIN}" \
              --reasoning-parser nemotron_v3
          env:
          - name: UCX_TLS
            value: rc_x,rc,cuda_copy,cuda_ipc
          - name: UCX_IB_ADDR_TYPE
            value: eth
          - name: UCX_RNDV_SCHEME
            value: get_zcopy
          - name: UCX_RNDV_THRESH
            value: '0'
          - name: UCX_RC_TIMEOUT
            value: 600s
          - name: UCX_KEEPALIVE_INTERVAL
            value: 300s
          - name: NCCL_IB_DISABLE
            value: '0'
          - name: NCCL_STORE_TIMEOUT
            value: '7200'
          - name: NIXL_LOG_LEVEL
            value: INFO
          resources:
            requests:
              nvidia.com/gpu: '8'
              rdma/ib: '8'
              memory: 750Gi
              ephemeral-storage: 20Gi
            limits:
              nvidia.com/gpu: '8'
              rdma/ib: '8'
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          startupProbe:
            httpGet:
              path: "/live"
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 30
          volumeMounts:
          - name: shared-model-cache
            mountPath: "/opt/models"
            readOnly: true
          - name: runtime-tmp
            mountPath: "/tmp"
          - name: dshm
            mountPath: "/dev/shm"
          - name: flashinfer-cubins
            mountPath: "/usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins/flashinfer"
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
            readOnly: true
        - name: runtime-tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: flashinfer-cubins
          emptyDir:
            medium: Memory
