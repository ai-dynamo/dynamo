---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: ultra-disagg-gb200-1m
  annotations:
    nemotron-ultra.nvidia.com/mtp: disabled
    nemotron-ultra.nvidia.com/prefix-caching: enabled
    nemotron-ultra.nvidia.com/transport: ucx-rdma-gke-extended-resources
    nemotron-ultra.nvidia.com/async-scheduling: enabled
  labels:
    app.kubernetes.io/name: ultra-disagg-gb200-1m
    app.kubernetes.io/part-of: nemotron-3-ultra
    nemotron-ultra.nvidia.com/sku: gb200
    nemotron-ultra.nvidia.com/backend: vllm
    nemotron-ultra.nvidia.com/topology: 1p1d-tp4-tp4
    nemotron-ultra.nvidia.com/context: 1m
    nemotron-ultra.nvidia.com/workload: agentic
spec:
  backendFramework: vllm
  env:
    - name: HF_HOME
      value: /opt/models
    - name: HF_HUB_CACHE
      value: /opt/models/hub
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: TRANSFORMERS_OFFLINE
      value: "1"
    - name: SERVED_MODEL_NAME
      value: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
    - name: MODEL_PATH
      value: /opt/models/patched/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
    - name: LOG_DIR
      value: /artifacts/logs
    - name: HOME
      value: /tmp
    - name: HF_MODULES_CACHE
      value: /tmp/hf_modules
    - name: XDG_CACHE_HOME
      value: /tmp/cache
    - name: TORCH_EXTENSIONS_DIR
      value: /tmp/torch_extensions
    - name: TRITON_CACHE_DIR
      value: /tmp/triton
    - name: VLLM_CACHE_ROOT
      value: /tmp/vllm
    - name: PYTHONHASHSEED
      value: "0"
    - name: VLLM_LOGGING_LEVEL
      value: INFO
    - name: VLLM_WORKER_MULTIPROC_METHOD
      value: spawn
    - name: VLLM_ALLREDUCE_USE_SYMM_MEM
      value: "0"
    - name: VLLM_DISABLED_KERNELS
      value: FlashInferFP8ScaledMMLinearKernel
    - name: VLLM_SSM_CONV_STATE_LAYOUT
      value: DS
    - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
      value: "1"
    - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
      value: "1"
    - name: DYN_VLLM_APPEND_PREFILL_OUTPUT_TOKENS
      value: "0"
    - name: DYN_LOG
      value: info,dynamo_kv_router=debug,dynamo_llm::kv_router=debug
    - name: NCCL_CUMEM_ENABLE
      value: "1"
    - name: NCCL_NVLS_ENABLE
      value: "1"
    - name: NCCL_DEBUG
      value: WARN
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        metadata:
          labels:
            nemotron-ultra.nvidia.com/role: frontend
            nemotron-ultra.nvidia.com/topology: 1p1d-tp4-tp4
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0@sha256:8401411dc8e968eff9310462102491509e3f93d3ce03d6febc8d5566f067a7b1
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -Eeuo pipefail
                  exec python3 -m dynamo.frontend \
                    --router-mode kv \
                    --router-kv-events \
                    --kv-cache-block-size 64 \
                    --router-track-prefill-tokens \
                    --router-kv-overlap-score-credit-decay 0.1 \
                    --http-host 0.0.0.0 \
                    --http-port 8000
              ports:
                - name: http
                  containerPort: 8000
              startupProbe:
                httpGet: {path: /health, port: http}
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 360
              readinessProbe:
                httpGet: {path: /health, port: http}
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
              volumeMounts:
                - {name: shared-model-cache, mountPath: /opt/models, readOnly: true}
                - {name: runtime-tmp, mountPath: /tmp}
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim: {claimName: shared-model-cache}
            - name: runtime-tmp
              emptyDir: {}

    - name: VllmPrefillWorker
      type: prefill
      replicas: 1
      sharedMemorySize: 128Gi
      podTemplate:
        metadata:
          labels:
            nemotron-ultra.nvidia.com/role: prefill
            nemotron-ultra.nvidia.com/topology: 1p1d-tp4-tp4
          annotations:
            networking.gke.io/default-interface: eth0
            networking.gke.io/interfaces: '[{"interfaceName":"eth0","network":"default"},{"interfaceName":"rdma0","network":"rdma-0"},{"interfaceName":"rdma1","network":"rdma-1"},{"interfaceName":"rdma2","network":"rdma-2"},{"interfaceName":"rdma3","network":"rdma-3"}]'
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-GB200
            kubernetes.io/arch: arm64
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: present
              effect: NoSchedule
            - key: kubernetes.io/arch
              operator: Equal
              value: arm64
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0@sha256:8401411dc8e968eff9310462102491509e3f93d3ce03d6febc8d5566f067a7b1
              imagePullPolicy: IfNotPresent
              workingDir: /workspace
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -Eeuo pipefail
                  test -r "${MODEL_PATH}/config.json" || { echo "MODEL_PREFLIGHT_FAIL class=model_config_missing path=${MODEL_PATH}"; exit 42; }
                  PLUGIN="${MODEL_PATH}/ultra_v3_reasoning_parser.py"
                  test -r "${PLUGIN}" || { echo "MODEL_PREFLIGHT_FAIL class=reasoning_parser_missing path=${PLUGIN}"; exit 43; }
                  echo "PRESTART_GPU_GUARD_BEGIN role=prefill"
                  nvidia-smi -L
                  visible_count="$(nvidia-smi -L | grep -c '^GPU ')"
                  if [ "${visible_count}" -ne 4 ]; then
                    echo "PRESTART_GPU_GUARD_FAIL class=gpu_visibility_count_mismatch role=prefill visible_count=${visible_count}"
                    exit 96
                  fi
                  mem_rows="$(nvidia-smi --query-gpu=index,uuid,memory.used,utilization.gpu --format=csv,noheader,nounits)"
                  echo "${mem_rows}"
                  dirty_count="$(printf '%s\n' "${mem_rows}" | awk -F',' '{gsub(/ /,"",$3); if (($3+0)>1024) c++} END{print c+0}')"
                  if [ "${dirty_count}" -ne 0 ]; then
                    echo "PRESTART_GPU_GUARD_FAIL class=gpu_memory_dirty role=prefill dirty_count=${dirty_count}"
                    exit 97
                  fi
                  rdma_ifaces=""
                  for iface in rdma0 rdma1 rdma2 rdma3; do
                    test -e "/sys/class/net/${iface}" || { echo "RDMA_PREFLIGHT_FAIL class=missing_gke_rdma_interface role=prefill interface=${iface}"; exit 98; }
                    rdma_ifaces="${rdma_ifaces}${iface} "
                  done
                  for ibdev in mlx5_0 mlx5_1 mlx5_2 mlx5_3; do
                    test -e "/sys/class/infiniband/${ibdev}" || { echo "RDMA_PREFLIGHT_FAIL class=missing_infiniband_device role=prefill device=${ibdev}"; exit 99; }
                  done
                  test -c /dev/infiniband/rdma_cm || { echo "RDMA_PREFLIGHT_FAIL class=missing_rdma_cm role=prefill"; exit 100; }
                  for uverbs in uverbs0 uverbs1 uverbs2 uverbs3; do
                    test -c "/dev/infiniband/${uverbs}" || { echo "RDMA_PREFLIGHT_FAIL class=missing_uverbs_device role=prefill device=${uverbs}"; exit 101; }
                  done
                  python3 -c 'import nixl; a=nixl.nixl_agent("ucx_preflight_prefill"); assert "UCX" in a.get_plugin_list()'
                  unset UCX_NET_DEVICES
                  echo "TRANSPORT_PREFLIGHT_PASS role=prefill backend=UCX path=rdma platform=gcp attachment=extended-resource interfaces=${rdma_ifaces}"
                  echo "PRESTART_GPU_GUARD_PASS role=prefill"
                  ulimit -l unlimited
                  exec python3 -m dynamo.vllm \
                    --model "${MODEL_PATH}" \
                    --served-model-name "${SERVED_MODEL_NAME}" \
                    --tensor-parallel-size 4 \
                    --trust-remote-code \
                    --kv-cache-dtype fp8 \
                    --max-model-len 1048576 \
                    --max-num-seqs 256 \
                    --max-num-batched-tokens 49152 \
                    --gpu-memory-utilization 0.9 \
                    --no-enable-flashinfer-autotune \
                    --block-size 64 \
                    --no-enable-expert-parallel \
                    --enable-prefix-caching \
                    --async-scheduling \
                    --mamba-cache-mode align \
                    --mamba-ssm-cache-dtype bfloat16 \
                    --mamba-backend triton \
                    --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}' \
                    --dyn-tool-call-parser qwen3_coder \
                    --dyn-reasoning-parser nemotron3 \
                    --reasoning-parser-plugin "${PLUGIN}" \
                    --reasoning-parser nemotron_v3 \
                    --no-disable-hybrid-kv-cache-manager \
                    --disaggregation-mode prefill \
                    --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5571","enable_kv_cache_events":true}'
              env:
                - name: UCX_TLS
                  value: rc_x,rc,cuda_copy,cuda_ipc
                - name: UCX_IB_ADDR_TYPE
                  value: eth
                - name: UCX_RNDV_SCHEME
                  value: get_zcopy
                - name: UCX_RNDV_THRESH
                  value: "0"
                - name: UCX_RC_TIMEOUT
                  value: 600s
                - name: UCX_KEEPALIVE_INTERVAL
                  value: 300s
                - name: NCCL_IB_DISABLE
                  value: "0"
                - name: NCCL_SOCKET_IFNAME
                  value: eth0
                - name: GLOO_SOCKET_IFNAME
                  value: eth0
                - name: NCCL_STORE_TIMEOUT
                  value: "7200"
                - name: NIXL_LOG_LEVEL
                  value: INFO
              resources:
                requests:
                  nvidia.com/gpu: "4"
                  memory: 750Gi
                  ephemeral-storage: 20Gi
                  networking.gke.io.networks/rdma-0: "1"
                  networking.gke.io.networks/rdma-0.IP: "1"
                  networking.gke.io.networks/rdma-1: "1"
                  networking.gke.io.networks/rdma-1.IP: "1"
                  networking.gke.io.networks/rdma-2: "1"
                  networking.gke.io.networks/rdma-2.IP: "1"
                  networking.gke.io.networks/rdma-3: "1"
                  networking.gke.io.networks/rdma-3.IP: "1"
                limits:
                  nvidia.com/gpu: "4"
                  networking.gke.io.networks/rdma-0: "1"
                  networking.gke.io.networks/rdma-0.IP: "1"
                  networking.gke.io.networks/rdma-1: "1"
                  networking.gke.io.networks/rdma-1.IP: "1"
                  networking.gke.io.networks/rdma-2: "1"
                  networking.gke.io.networks/rdma-2.IP: "1"
                  networking.gke.io.networks/rdma-3: "1"
                  networking.gke.io.networks/rdma-3.IP: "1"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_RESOURCE]
              startupProbe:
                httpGet: {path: /live, port: 9090}
                periodSeconds: 60
                timeoutSeconds: 20
                failureThreshold: 30
              volumeMounts:
                - {name: shared-model-cache, mountPath: /opt/models, readOnly: true}
                - {name: runtime-tmp, mountPath: /tmp}
                - {name: flashinfer-cubins, mountPath: /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins/flashinfer}
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim: {claimName: shared-model-cache}
            - name: runtime-tmp
              emptyDir: {}
            - name: flashinfer-cubins
              emptyDir: {medium: Memory}

    - name: VllmDecodeWorker
      type: decode
      replicas: 1
      sharedMemorySize: 128Gi
      podTemplate:
        metadata:
          labels:
            nemotron-ultra.nvidia.com/role: decode
            nemotron-ultra.nvidia.com/topology: 1p1d-tp4-tp4
          annotations:
            networking.gke.io/default-interface: eth0
            networking.gke.io/interfaces: '[{"interfaceName":"eth0","network":"default"},{"interfaceName":"rdma0","network":"rdma-0"},{"interfaceName":"rdma1","network":"rdma-1"},{"interfaceName":"rdma2","network":"rdma-2"},{"interfaceName":"rdma3","network":"rdma-3"}]'
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-GB200
            kubernetes.io/arch: arm64
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: present
              effect: NoSchedule
            - key: kubernetes.io/arch
              operator: Equal
              value: arm64
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0@sha256:8401411dc8e968eff9310462102491509e3f93d3ce03d6febc8d5566f067a7b1
              imagePullPolicy: IfNotPresent
              workingDir: /workspace
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -Eeuo pipefail
                  test -r "${MODEL_PATH}/config.json" || { echo "MODEL_PREFLIGHT_FAIL class=model_config_missing path=${MODEL_PATH}"; exit 42; }
                  PLUGIN="${MODEL_PATH}/ultra_v3_reasoning_parser.py"
                  test -r "${PLUGIN}" || { echo "MODEL_PREFLIGHT_FAIL class=reasoning_parser_missing path=${PLUGIN}"; exit 43; }
                  echo "PRESTART_GPU_GUARD_BEGIN role=decode"
                  nvidia-smi -L
                  visible_count="$(nvidia-smi -L | grep -c '^GPU ')"
                  if [ "${visible_count}" -ne 4 ]; then
                    echo "PRESTART_GPU_GUARD_FAIL class=gpu_visibility_count_mismatch role=decode visible_count=${visible_count}"
                    exit 96
                  fi
                  mem_rows="$(nvidia-smi --query-gpu=index,uuid,memory.used,utilization.gpu --format=csv,noheader,nounits)"
                  echo "${mem_rows}"
                  dirty_count="$(printf '%s\n' "${mem_rows}" | awk -F',' '{gsub(/ /,"",$3); if (($3+0)>1024) c++} END{print c+0}')"
                  if [ "${dirty_count}" -ne 0 ]; then
                    echo "PRESTART_GPU_GUARD_FAIL class=gpu_memory_dirty role=decode dirty_count=${dirty_count}"
                    exit 97
                  fi
                  rdma_ifaces=""
                  for iface in rdma0 rdma1 rdma2 rdma3; do
                    test -e "/sys/class/net/${iface}" || { echo "RDMA_PREFLIGHT_FAIL class=missing_gke_rdma_interface role=decode interface=${iface}"; exit 98; }
                    rdma_ifaces="${rdma_ifaces}${iface} "
                  done
                  for ibdev in mlx5_0 mlx5_1 mlx5_2 mlx5_3; do
                    test -e "/sys/class/infiniband/${ibdev}" || { echo "RDMA_PREFLIGHT_FAIL class=missing_infiniband_device role=decode device=${ibdev}"; exit 99; }
                  done
                  test -c /dev/infiniband/rdma_cm || { echo "RDMA_PREFLIGHT_FAIL class=missing_rdma_cm role=decode"; exit 100; }
                  for uverbs in uverbs0 uverbs1 uverbs2 uverbs3; do
                    test -c "/dev/infiniband/${uverbs}" || { echo "RDMA_PREFLIGHT_FAIL class=missing_uverbs_device role=decode device=${uverbs}"; exit 101; }
                  done
                  python3 -c 'import nixl; a=nixl.nixl_agent("ucx_preflight_decode"); assert "UCX" in a.get_plugin_list()'
                  unset UCX_NET_DEVICES
                  echo "TRANSPORT_PREFLIGHT_PASS role=decode backend=UCX path=rdma platform=gcp attachment=extended-resource interfaces=${rdma_ifaces}"
                  echo "PRESTART_GPU_GUARD_PASS role=decode"
                  ulimit -l unlimited
                  exec python3 -m dynamo.vllm \
                    --model "${MODEL_PATH}" \
                    --served-model-name "${SERVED_MODEL_NAME}" \
                    --tensor-parallel-size 4 \
                    --trust-remote-code \
                    --kv-cache-dtype fp8 \
                    --max-model-len 1048576 \
                    --max-num-seqs 256 \
                    --max-num-batched-tokens 49152 \
                    --gpu-memory-utilization 0.9 \
                    --no-enable-flashinfer-autotune \
                    --block-size 64 \
                    --no-enable-expert-parallel \
                    --enable-prefix-caching \
                    --async-scheduling \
                    --mamba-cache-mode align \
                    --mamba-ssm-cache-dtype bfloat16 \
                    --mamba-backend triton \
                    --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}' \
                    --dyn-tool-call-parser qwen3_coder \
                    --dyn-reasoning-parser nemotron3 \
                    --reasoning-parser-plugin "${PLUGIN}" \
                    --reasoning-parser nemotron_v3 \
                    --no-disable-hybrid-kv-cache-manager \
                    --disaggregation-mode decode
              env:
                - name: UCX_TLS
                  value: rc_x,rc,cuda_copy,cuda_ipc
                - name: UCX_IB_ADDR_TYPE
                  value: eth
                - name: UCX_RNDV_SCHEME
                  value: get_zcopy
                - name: UCX_RNDV_THRESH
                  value: "0"
                - name: UCX_RC_TIMEOUT
                  value: 600s
                - name: UCX_KEEPALIVE_INTERVAL
                  value: 300s
                - name: NCCL_IB_DISABLE
                  value: "0"
                - name: NCCL_SOCKET_IFNAME
                  value: eth0
                - name: GLOO_SOCKET_IFNAME
                  value: eth0
                - name: NCCL_STORE_TIMEOUT
                  value: "7200"
                - name: NIXL_LOG_LEVEL
                  value: INFO
              resources:
                requests:
                  nvidia.com/gpu: "4"
                  memory: 750Gi
                  ephemeral-storage: 20Gi
                  networking.gke.io.networks/rdma-0: "1"
                  networking.gke.io.networks/rdma-0.IP: "1"
                  networking.gke.io.networks/rdma-1: "1"
                  networking.gke.io.networks/rdma-1.IP: "1"
                  networking.gke.io.networks/rdma-2: "1"
                  networking.gke.io.networks/rdma-2.IP: "1"
                  networking.gke.io.networks/rdma-3: "1"
                  networking.gke.io.networks/rdma-3.IP: "1"
                limits:
                  nvidia.com/gpu: "4"
                  networking.gke.io.networks/rdma-0: "1"
                  networking.gke.io.networks/rdma-0.IP: "1"
                  networking.gke.io.networks/rdma-1: "1"
                  networking.gke.io.networks/rdma-1.IP: "1"
                  networking.gke.io.networks/rdma-2: "1"
                  networking.gke.io.networks/rdma-2.IP: "1"
                  networking.gke.io.networks/rdma-3: "1"
                  networking.gke.io.networks/rdma-3.IP: "1"
              securityContext:
