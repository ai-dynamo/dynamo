---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: ultra-disagg-gb200-256k-1p1d
  annotations:
    nemotron-ultra-refresh.nvidia.com/mtp: disabled
    nemotron-ultra-refresh.nvidia.com/prefix-caching: enabled
    nemotron-ultra-refresh.nvidia.com/transport: ucx-tcp
    nemotron-ultra-refresh.nvidia.com/async-scheduling: enabled
  labels:
    app.kubernetes.io/name: ultra-disagg-gb200-256k-1p1d
    app.kubernetes.io/part-of: nemotron-3-ultra
    nemotron-ultra-refresh.nvidia.com/sku: gb200
    nemotron-ultra-refresh.nvidia.com/backend: vllm
    nemotron-ultra-refresh.nvidia.com/topology: 1p1d-tp4-tp4
    nemotron-ultra-refresh.nvidia.com/context: 256k
    nemotron-ultra-refresh.nvidia.com/workload: agentic
spec:
  backendFramework: vllm
  env:
    - name: HF_HOME
      value: /opt/models
    - name: HF_HUB_CACHE
      value: /opt/models/hub
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: TRANSFORMERS_OFFLINE
      value: "1"
    - name: SERVED_MODEL_NAME
      value: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
    - name: MODEL_PATH
      value: /opt/models/patched/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
    - name: LOG_DIR
      value: /artifacts/logs
    - name: HOME
      value: /tmp
    - name: HF_MODULES_CACHE
      value: /tmp/hf_modules
    - name: XDG_CACHE_HOME
      value: /tmp/cache
    - name: TORCH_EXTENSIONS_DIR
      value: /tmp/torch_extensions
    - name: TRITON_CACHE_DIR
      value: /tmp/triton
    - name: VLLM_CACHE_ROOT
      value: /tmp/vllm
    - name: PYTHONHASHSEED
      value: "0"
    - name: VLLM_LOGGING_LEVEL
      value: INFO
    - name: VLLM_WORKER_MULTIPROC_METHOD
      value: spawn
    - name: VLLM_ALLREDUCE_USE_SYMM_MEM
      value: "0"
    - name: VLLM_DISABLED_KERNELS
      value: FlashInferFP8ScaledMMLinearKernel
    - name: VLLM_SSM_CONV_STATE_LAYOUT
      value: DS
    - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
      value: "1"
    - name: DYN_VLLM_APPEND_PREFILL_OUTPUT_TOKENS
      value: "0"
    - name: DYN_LOG
      value: info,dynamo_kv_router=debug,dynamo_llm::kv_router=debug
    - name: NCCL_CUMEM_ENABLE
      value: "1"
    - name: NCCL_NVLS_ENABLE
      value: "1"
    - name: NCCL_DEBUG
      value: WARN
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        metadata:
          labels:
            nemotron-ultra-refresh.nvidia.com/role: frontend
            nemotron-ultra-refresh.nvidia.com/topology: 1p1d-tp4-tp4
        spec:
          imagePullSecrets:
            - name: nvcr-secret
          containers:
            - name: main
              image: nvcr.io/nvstaging/ai-dynamo/vllm-runtime:1.4.0-rc.4@sha256:3f8cbbf4b8d0919fd3e81595da0a00029fe11af251ca5a9ecd7e66cd50ae03ea
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -Eeuo pipefail
                  exec python3 -m dynamo.frontend \
                    --router-mode kv \
                    --router-kv-events \
                    --kv-cache-block-size 64 \
                    --http-host 0.0.0.0 \
                    --http-port 8000
              ports:
                - name: http
                  containerPort: 8000
              startupProbe:
                httpGet: {path: /health, port: http}
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 360
              readinessProbe:
                httpGet: {path: /health, port: http}
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
              volumeMounts:
                - {name: shared-model-cache, mountPath: /opt/models, readOnly: true}
                - {name: runtime-tmp, mountPath: /tmp}
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim: {claimName: shared-model-cache}
            - name: runtime-tmp
              emptyDir: {}

    - name: VllmPrefillWorker
      type: prefill
      replicas: 1
      sharedMemorySize: 128Gi
      podTemplate:
        metadata:
          labels:
            nemotron-ultra-refresh.nvidia.com/role: prefill
            nemotron-ultra-refresh.nvidia.com/topology: 1p1d-tp4-tp4
        spec:
          imagePullSecrets:
            - name: nvcr-secret
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-GB200
            kubernetes.io/arch: arm64
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: present
              effect: NoSchedule
            - key: kubernetes.io/arch
              operator: Equal
              value: arm64
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvstaging/ai-dynamo/vllm-runtime:1.4.0-rc.4@sha256:3f8cbbf4b8d0919fd3e81595da0a00029fe11af251ca5a9ecd7e66cd50ae03ea
              imagePullPolicy: IfNotPresent
              workingDir: /workspace
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -Eeuo pipefail
                  test -r "${MODEL_PATH}/config.json" || { echo "MODEL_PREFLIGHT_FAIL class=model_config_missing path=${MODEL_PATH}"; exit 42; }
                  PLUGIN="${MODEL_PATH}/ultra_v3_reasoning_parser.py"
                  test -r "${PLUGIN}" || { echo "MODEL_PREFLIGHT_FAIL class=reasoning_parser_missing path=${PLUGIN}"; exit 43; }
                  echo "PRESTART_GPU_GUARD_BEGIN role=prefill"
                  nvidia-smi -L
                  visible_count="$(nvidia-smi -L | grep -c '^GPU ')"
                  if [ "${visible_count}" -ne 4 ]; then
                    echo "PRESTART_GPU_GUARD_FAIL class=gpu_visibility_count_mismatch role=prefill visible_count=${visible_count}"
                    exit 96
                  fi
                  mem_rows="$(nvidia-smi --query-gpu=index,uuid,memory.used,utilization.gpu --format=csv,noheader,nounits)"
                  echo "${mem_rows}"
                  dirty_count="$(printf '%s\n' "${mem_rows}" | awk -F',' '{gsub(/ /,"",$3); if (($3+0)>1024) c++} END{print c+0}')"
                  if [ "${dirty_count}" -ne 0 ]; then
                    echo "PRESTART_GPU_GUARD_FAIL class=gpu_memory_dirty role=prefill dirty_count=${dirty_count}"
                    exit 97
                  fi
                  python3 -c 'import nixl; a=nixl.nixl_agent("ucx_preflight_prefill"); assert "UCX" in a.get_plugin_list()'
                  unset UCX_NET_DEVICES
                  echo "TRANSPORT_PREFLIGHT_PASS role=prefill backend=UCX path=tcp"
                  echo "PRESTART_GPU_GUARD_PASS role=prefill"
                  ulimit -l unlimited
                  exec python3 -m dynamo.vllm \
                    --model "${MODEL_PATH}" \
                    --served-model-name "${SERVED_MODEL_NAME}" \
                    --tensor-parallel-size 4 \
                    --trust-remote-code \
                    --kv-cache-dtype fp8 \
                    --max-model-len 262144 \
                    --max-num-seqs 64 \
                    --max-num-batched-tokens 32768 \
                    --gpu-memory-utilization 0.9 \
                    --attention-backend FLASHINFER \
                    --linear-backend CUTLASS \
                    --moe-backend CUTLASS \
                    --no-enable-flashinfer-autotune \
                    --block-size 64 \
                    --no-enable-expert-parallel \
                    --enable-prefix-caching \
                    --async-scheduling \
                    --mamba-cache-mode align \
                    --mamba-ssm-cache-dtype bfloat16 \
                    --mamba-backend triton \
                    --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}' \
                    --dyn-tool-call-parser qwen3_coder \
                    --dyn-reasoning-parser nemotron3 \
                    --reasoning-parser-plugin "${PLUGIN}" \
                    --reasoning-parser nemotron_v3 \
                    --no-disable-hybrid-kv-cache-manager \
                    --disaggregation-mode prefill \
                    --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5571","enable_kv_cache_events":true}'
              env:
                - name: UCX_TLS
                  value: tcp,cuda_copy,cuda_ipc
                - name: NCCL_IB_DISABLE
                  value: "0"                 # explicitly ENABLED (the agg B200 file sets "1")
                - name: NCCL_SOCKET_IFNAME
                  value: eth0
                - name: GLOO_SOCKET_IFNAME
                  value: eth0
                - name: NCCL_STORE_TIMEOUT
                  value: "7200"
                - name: NIXL_LOG_LEVEL
                  value: INFO
              resources:
                requests:
                  nvidia.com/gpu: "4"
                  memory: 750Gi
                  ephemeral-storage: 20Gi
                limits:
                  nvidia.com/gpu: "4"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_RESOURCE]
              startupProbe:
                httpGet: {path: /live, port: 9090}
                periodSeconds: 60
                timeoutSeconds: 20
                failureThreshold: 30
              volumeMounts:
                - {name: shared-model-cache, mountPath: /opt/models, readOnly: true}
                - {name: runtime-tmp, mountPath: /tmp}
                - {name: flashinfer-cubins, mountPath: /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins/flashinfer}
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim: {claimName: shared-model-cache}
            - name: runtime-tmp
              emptyDir: {}
            - name: flashinfer-cubins
              emptyDir: {medium: Memory}

    - name: VllmDecodeWorker
      type: decode
      replicas: 1
      sharedMemorySize: 128Gi
      podTemplate:
        metadata:
          labels:
            nemotron-ultra-refresh.nvidia.com/role: decode
            nemotron-ultra-refresh.nvidia.com/topology: 1p1d-tp4-tp4
        spec:
          imagePullSecrets:
            - name: nvcr-secret
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-GB200
            kubernetes.io/arch: arm64
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: present
              effect: NoSchedule
            - key: kubernetes.io/arch
              operator: Equal
              value: arm64
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvstaging/ai-dynamo/vllm-runtime:1.4.0-rc.4@sha256:3f8cbbf4b8d0919fd3e81595da0a00029fe11af251ca5a9ecd7e66cd50ae03ea
              imagePullPolicy: IfNotPresent
              workingDir: /workspace
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -Eeuo pipefail
                  test -r "${MODEL_PATH}/config.json" || { echo "MODEL_PREFLIGHT_FAIL class=model_config_missing path=${MODEL_PATH}"; exit 42; }
                  PLUGIN="${MODEL_PATH}/ultra_v3_reasoning_parser.py"
                  test -r "${PLUGIN}" || { echo "MODEL_PREFLIGHT_FAIL class=reasoning_parser_missing path=${PLUGIN}"; exit 43; }
                  echo "PRESTART_GPU_GUARD_BEGIN role=decode"
                  nvidia-smi -L
                  visible_count="$(nvidia-smi -L | grep -c '^GPU ')"
                  if [ "${visible_count}" -ne 4 ]; then
                    echo "PRESTART_GPU_GUARD_FAIL class=gpu_visibility_count_mismatch role=decode visible_count=${visible_count}"
                    exit 96
                  fi
                  mem_rows="$(nvidia-smi --query-gpu=index,uuid,memory.used,utilization.gpu --format=csv,noheader,nounits)"
                  echo "${mem_rows}"
                  dirty_count="$(printf '%s\n' "${mem_rows}" | awk -F',' '{gsub(/ /,"",$3); if (($3+0)>1024) c++} END{print c+0}')"
                  if [ "${dirty_count}" -ne 0 ]; then
                    echo "PRESTART_GPU_GUARD_FAIL class=gpu_memory_dirty role=decode dirty_count=${dirty_count}"
                    exit 97
                  fi
                  python3 -c 'import nixl; a=nixl.nixl_agent("ucx_preflight_decode"); assert "UCX" in a.get_plugin_list()'
                  unset UCX_NET_DEVICES
                  echo "TRANSPORT_PREFLIGHT_PASS role=decode backend=UCX path=tcp"
                  echo "PRESTART_GPU_GUARD_PASS role=decode"
                  ulimit -l unlimited
                  exec python3 -m dynamo.vllm \
                    --model "${MODEL_PATH}" \
                    --served-model-name "${SERVED_MODEL_NAME}" \
                    --tensor-parallel-size 4 \
                    --trust-remote-code \
                    --kv-cache-dtype fp8 \
                    --max-model-len 262144 \
                    --max-num-seqs 64 \
                    --max-num-batched-tokens 32768 \
                    --gpu-memory-utilization 0.9 \
                    --attention-backend FLASHINFER \
                    --linear-backend CUTLASS \
                    --moe-backend CUTLASS \
                    --no-enable-flashinfer-autotune \
                    --block-size 64 \
                    --no-enable-expert-parallel \
                    --enable-prefix-caching \
                    --async-scheduling \
                    --mamba-cache-mode align \
                    --mamba-ssm-cache-dtype bfloat16 \
                    --mamba-backend triton \
                    --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}' \
                    --dyn-tool-call-parser qwen3_coder \
                    --dyn-reasoning-parser nemotron3 \
                    --reasoning-parser-plugin "${PLUGIN}" \
                    --reasoning-parser nemotron_v3 \
                    --no-disable-hybrid-kv-cache-manager \
                    --disaggregation-mode decode
              env:
                - name: UCX_TLS
                  value: tcp,cuda_copy,cuda_ipc
                - name: NCCL_IB_DISABLE
                  value: "0"
                - name: NCCL_SOCKET_IFNAME
                  value: eth0
                - name: GLOO_SOCKET_IFNAME
                  value: eth0
                - name: NCCL_STORE_TIMEOUT
                  value: "7200"
                - name: NIXL_LOG_LEVEL
                  value: INFO
              resources:
                requests:
                  nvidia.com/gpu: "4"
                  memory: 750Gi
                  ephemeral-storage: 20Gi
                limits:
                  nvidia.com/gpu: "4"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_RESOURCE]
              startupProbe:
                httpGet: {path: /live, port: 9090}
                periodSeconds: 60
                timeoutSeconds: 20
                failureThreshold: 30
              volumeMounts:
                - {name: shared-model-cache, mountPath: /opt/models, readOnly: true}
                - {name: runtime-tmp, mountPath: /tmp}
                - {name: flashinfer-cubins, mountPath: /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins/flashinfer}
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim: {claimName: shared-model-cache}
            - name: runtime-tmp
              emptyDir: {}
            - name: flashinfer-cubins
              emptyDir: {medium: Memory}
