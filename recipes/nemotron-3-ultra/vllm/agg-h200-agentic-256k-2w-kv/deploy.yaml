---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: ultra-agg-h200-256k-2w-kv
  labels:
    app.kubernetes.io/name: ultra-agg-h200-256k-2w-kv
    app.kubernetes.io/part-of: nemotron-3-ultra
    nemotron-ultra-refresh.nvidia.com/backend: vllm
    nemotron-ultra-refresh.nvidia.com/topology: agg-2worker
    nemotron-ultra-refresh.nvidia.com/workload: agentic
    nemotron-ultra-refresh.nvidia.com/routing: kv-aware
spec:
  backendFramework: vllm
  env:
  - name: HF_HOME
    value: "/opt/models"
  - name: HF_HUB_CACHE
    value: "/opt/models/hub"
  - name: HF_HUB_OFFLINE
    value: '1'
  - name: TRANSFORMERS_OFFLINE
    value: '1'
  - name: SERVED_MODEL_NAME
    value: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
  - name: MODEL_PATH
    value: "/opt/models/patched/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
  - name: HOME
    value: "/tmp"
  - name: HF_MODULES_CACHE
    value: "/tmp/hf_modules"
  - name: XDG_CACHE_HOME
    value: "/tmp/cache"
  - name: TORCH_EXTENSIONS_DIR
    value: "/tmp/torch_extensions"
  - name: TRITON_CACHE_DIR
    value: "/tmp/triton"
  - name: VLLM_CACHE_ROOT
    value: "/tmp/vllm"
  - name: PYTHONHASHSEED
    value: '0'
  - name: VLLM_LOGGING_LEVEL
    value: INFO
  - name: VLLM_WORKER_MULTIPROC_METHOD
    value: spawn
  - name: VLLM_ALLREDUCE_USE_SYMM_MEM
    value: '0'
  - name: VLLM_DISABLED_KERNELS
    value: FlashInferFP8ScaledMMLinearKernel
  - name: VLLM_SSM_CONV_STATE_LAYOUT
    value: SD
  - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
    value: '1'
  - name: DYN_VLLM_APPEND_PREFILL_OUTPUT_TOKENS
    value: '0'
  - name: NCCL_IB_DISABLE
    value: '1'
  - name: NCCL_CUMEM_ENABLE
    value: '1'
  - name: NCCL_NVLS_ENABLE
    value: '1'
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      metadata:
        labels:
          nemotron-ultra-refresh.nvidia.com/role: frontend
          nemotron-ultra-refresh.nvidia.com/workload: agentic
          nemotron-ultra-refresh.nvidia.com/routing: kv-aware
      spec:
        imagePullSecrets:
        - name: nvcr-secret
        containers:
        - name: main
          image: nvcr.io/nvstaging/ai-dynamo/vllm-runtime:1.4.0-rc.4@sha256:3f8cbbf4b8d0919fd3e81595da0a00029fe11af251ca5a9ecd7e66cd50ae03ea
          imagePullPolicy: IfNotPresent
          command:
          - "/bin/bash"
          - "-lc"
          args:
          - |
            set -Eeuo pipefail
            exec python3 -m dynamo.frontend \
              --router-mode kv \
              --router-kv-events \
              --kv-cache-block-size 64 \
              --router-track-prefill-tokens \
              --router-kv-overlap-score-credit-decay 0.1 \
              --http-host 0.0.0.0 \
              --http-port 8000
          ports:
          - name: http
            containerPort: 8000
          startupProbe:
            httpGet:
              path: "/health"
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: "/health"
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
          - name: shared-model-cache
            mountPath: "/opt/models"
            readOnly: true
          - name: runtime-tmp
            mountPath: "/tmp"
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        - name: runtime-tmp
          emptyDir: {}
  - name: VllmWorker
    type: worker
    replicas: 2
    sharedMemorySize: 64Gi
    podTemplate:
      metadata:
        labels:
          nemotron-ultra-refresh.nvidia.com/role: aggregate-worker
          nemotron-ultra-refresh.nvidia.com/workload: agentic
          nemotron-ultra-refresh.nvidia.com/routing: kv-aware
      spec:
        imagePullSecrets:
        - name: nvcr-secret
        runtimeClassName: nvidia
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-H200
        tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: 'true'
          effect: NoSchedule
        containers:
        - name: main
          image: nvcr.io/nvstaging/ai-dynamo/vllm-runtime:1.4.0-rc.4@sha256:3f8cbbf4b8d0919fd3e81595da0a00029fe11af251ca5a9ecd7e66cd50ae03ea
          imagePullPolicy: IfNotPresent
          workingDir: "/workspace"
          command:
          - "/bin/bash"
          - "-lc"
          args:
          - |
            set -Eeuo pipefail
            test -r "${MODEL_PATH}/config.json" || { echo "MODEL_PREFLIGHT_FAIL class=model_config_missing path=${MODEL_PATH}/config.json"; exit 42; }
            test -r "${MODEL_PATH}/ultra_v3_reasoning_parser.py" || { echo "MODEL_PREFLIGHT_FAIL class=reasoning_parser_missing path=${MODEL_PATH}/ultra_v3_reasoning_parser.py"; exit 43; }
            ulimit -l unlimited
            exec python3 -m dynamo.vllm \
              --model "${MODEL_PATH}" \
              --served-model-name "${SERVED_MODEL_NAME}" \
              --tensor-parallel-size 8 \
              --data-parallel-size 1 \
              --pipeline-parallel-size 1 \
              --decode-context-parallel-size 1 \
              --no-enable-expert-parallel \
              --trust-remote-code \
              --kv-cache-dtype fp8 \
              --max-model-len 262144 \
              --max-num-seqs 48 \
              --max-num-batched-tokens 24576 \
              --gpu-memory-utilization 0.95 \
              --block-size 64 \
              --kv-events-config '{"enable_kv_cache_events": true}' \
              --attention-backend FLASH_ATTN \
              --mamba-backend triton \
              --no-enable-flashinfer-autotune \
              --mamba-cache-mode align \
              --mamba-ssm-cache-dtype bfloat16 \
              --enable-prefix-caching \
              --no-disable-hybrid-kv-cache-manager \
              --spec-method nemotron_h_mtp \
              --spec-tokens 5 \
              --async-scheduling \
              -cc.pass_config.fuse_norm_quant=True \
              -cc.pass_config.fuse_act_quant=True \
              --dyn-tool-call-parser qwen3_coder \
              --dyn-reasoning-parser nemotron3 \
              --reasoning-parser-plugin "${MODEL_PATH}/ultra_v3_reasoning_parser.py" \
              --reasoning-parser nemotron_v3
          resources:
            requests:
              nvidia.com/gpu: '8'
              memory: 750Gi
              ephemeral-storage: 20Gi
            limits:
              nvidia.com/gpu: '8'
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
            runAsUser: 0
            runAsGroup: 0
          startupProbe:
            httpGet:
              path: "/live"
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 30
          volumeMounts:
          - name: shared-model-cache
            mountPath: "/opt/models"
            readOnly: true
          - name: runtime-tmp
            mountPath: "/tmp"
          - name: flashinfer-cubins
            mountPath: "/usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins/flashinfer"
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        - name: runtime-tmp
          emptyDir: {}
        - name: flashinfer-cubins
          emptyDir:
            medium: Memory
