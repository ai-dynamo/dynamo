#
# kimi-k3 on vLLM via Dynamo, aggregated, GB200 (TP=16) over MNNVL.
---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: kimi-k3-agg-compute-domain
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: kimi-k3-agg-compute-domain-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  labels:
    app.kubernetes.io/name: kimi-k3-agg
  name: kimi-k3-agg
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - args:
          - --dyn-chat-processor
          - dynamo
          - --router-mode
          - kv
          - --router-kv-events
          - --router-temperature
          - '0'
          - --router-min-initial-workers
          - '1'
          - --kv-cache-block-size
          - '64'
          - --http-port
          - '8000'
          command:
          - python3
          - -m
          - dynamo.frontend
          env:
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: VLLM_USE_V2_MODEL_RUNNER
            value: '0'
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.4.0-ci-181a088d750c896fe0a575ebdbe72d7f000bfc4d-vllm-runtime
          imagePullPolicy: IfNotPresent
          name: main
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
          - mountPath: /models
            name: models
            readOnly: true
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-GB200
        tolerations:
        - effect: NoSchedule
          key: kubernetes.io/arch
          operator: Equal
          value: arm64
        volumes:
        - hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd/models
            type: Directory
          name: models
    replicas: 1
    type: frontend

  - multinode:
      nodeCount: 4
    name: VllmDecodeWorker
    podTemplate:
      metadata:
        annotations:
          nvidia.com/vllm-distributed-executor-backend: mp
      spec:
        containers:
        - args:
          - |
            exec python3 -m dynamo.vllm \
              --model "${MODEL_PATH}" \
              --served-model-name "${SERVED_MODEL_NAME}" \
              --load-format fastsafetensors \
              --safetensors-load-strategy lazy \
              --trust-remote-code \
              --tensor-parallel-size 16 \
              --gpu-memory-utilization 0.92 \
              --kv-cache-dtype fp8 \
              --attention-backend FLASHINFER_MLA \
              --attention-config '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}' \
              --moe-backend auto \
              --kda-prefill-backend flashkda \
              --kernel-config '{"enable_cutedsl_warmup":true}' \
              --max-num-seqs 1907 \
              --max-num-batched-tokens 32768 \
              --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","max_cudagraph_capture_size":8192,"cudagraph_capture_sizes":[1,2,4,8,12,16,24,32,64,128,256,512,1024,2048,4096,5120,6144,6656,7168,7680,8192]}' \
              --block-size 64 \
              --no-enable-flashinfer-autotune \
              --enable-multimodal \
              --disable-custom-all-reduce \
              --enable-prefix-caching \
              --no-disable-hybrid-kv-cache-manager \
              --no-enable-log-requests \
              --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}' \
              --cpu-distributed-timeout-seconds 3600 \
              --scheduler-cls vllm.v1.core.sched.async_scheduler.AsyncScheduler \
              --dyn-enable-structural-tag \
              --dyn-tool-call-parser kimi_k3 \
              --reasoning-parser kimi_k3 \
              --dyn-reasoning-parser kimi_k3
          command:
          - /bin/bash
          - -lc
          env:
          - name: MODEL_PATH
            value: /models/model_weight
          - name: SERVED_MODEL_NAME
            value: moonshotai/Kimi-K3
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: FLASHINFER_WORKSPACE_BASE
            value: /tmp/flashinfer
          - name: XDG_CACHE_HOME
            value: /tmp/.cache
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '7200'
          - name: VLLM_SSM_CONV_STATE_LAYOUT
            value: DS
          - name: VLLM_USE_V2_MODEL_RUNNER
            value: '0'
          - name: VLLM_USE_NCCL_SYMM_MEM
            value: '0'
          - name: VLLM_DEEP_GEMM_WARMUP
            value: skip
          - name: VLLM_FASTSAFETENSORS_QUEUE_SIZE
            value: '1'
          - name: TILELANG_CLEANUP_TEMP_FILES
            value: '1'
          # Disables CUDA graph memory estimation; restores 7 GiB KV cache stolen by the vLLM 0.27.1 default.
          - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
            value: '0'
          # Disable periodic KDA checkpoint; removes ~300 ms TTFT overhead for fixed system prompts.
          - name: VLLM_PREFIX_CACHE_RETENTION_INTERVAL
            value: '0'
          # TP all-reduce over MNNVL via FlashInfer — reduces collective latency vs NCCL.
          - name: VLLM_ALLREDUCE_USE_FLASHINFER
            value: '1'
          - name: VLLM_FLASHINFER_ALLREDUCE_BACKEND
            value: mnnvl
          - name: NCCL_CUMEM_ENABLE
            value: '1'
          - name: NCCL_MNNVL_ENABLE
            value: '1'
          - name: NCCL_NVLS_ENABLE
            value: '0'
          # Ring + LL128 outperforms default TREE_LL for TP=16 on GB200 NVL72.
          - name: NCCL_ALGO
            value: Ring
          - name: NCCL_PROTO
            value: LL128
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC
            value: '1800'
          - name: NVIDIA_GDRCOPY
            value: '1'
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: expandable_segments:False
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: ETCD_LEASE_TTL
            value: '120'
          # Disables cuDNN for Conv2d in MoonViT patch-embed; prevents cudnnCreate crash on GB200 (nvbug 6608287).
          - name: GP_DISABLE_CUDNN
            value: '1'
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.4.0-ci-181a088d750c896fe0a575ebdbe72d7f000bfc4d-vllm-runtime
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            claims:
            - name: compute-domain-channel
            limits:
              nvidia.com/gpu: '4'
            requests:
              cpu: '32'
              memory: 200Gi
              nvidia.com/gpu: '4'
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add: [IPC_LOCK, SYS_RESOURCE]
          startupProbe:
            failureThreshold: 720
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
          - mountPath: /models
            name: models
            readOnly: true
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-GB200
          # On clusters with multiple NVLink domains (cliques), all worker pods must land
          # on the same clique or MNNVL rendezvous fails at model load. Find your clique:
          #   kubectl get nodes -L nvidia.com/gpu.clique
          # Then uncomment and set the label below:
          # nvidia.com/gpu.clique: <clique-uuid>
        tolerations:
        - effect: NoSchedule
          key: kubernetes.io/arch
          operator: Equal
          value: arm64
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: kimi-k3-agg-compute-domain-channel
        terminationGracePeriodSeconds: 60
        volumes:
        - hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd/models
            type: Directory
          name: models
    replicas: 1
    sharedMemorySize: 256Gi
    type: decode
