#
# Kimi-K3 on vLLM via Dynamo, disaggregated, GB200 (TP=16 per worker) over MNNVL.
---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: kimi-k3-vllm-gb200-disagg-agentic-prefill-compute-domain
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: kimi-k3-vllm-gb200-disagg-agentic-prefill-compute-domain-channel
---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: kimi-k3-vllm-gb200-disagg-agentic-decode-compute-domain
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: kimi-k3-vllm-gb200-disagg-agentic-decode-compute-domain-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: kimi-k3-vllm-gb200-disagg-agentic
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0-kimi-k3-dev.1
          imagePullPolicy: IfNotPresent
          command: [python3, -m, dynamo.frontend]
          args:
          - --http-host
          - 0.0.0.0
          - --http-port
          - "8000"
          - --dyn-chat-processor
          - dynamo
          - --router-kv-events
          - --kv-cache-block-size
          - "64"
          - --router-prefill-load-scale
          - "8"
          - --router-min-initial-workers
          - "1"
          - --model-name
          - moonshotai/Kimi-K3
          - --trust-remote-code
          env:
          - name: DYN_ROUTER_MODE
            value: kv
          resources:
            requests:
              cpu: "16"
              memory: 128Gi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false

  - name: PrefillWorker
    type: prefill
    replicas: 1
    multinode:
      nodeCount: 4
    sharedMemorySize: 64Gi
    podTemplate:
      metadata:
        annotations:
          nvidia.com/vllm-distributed-executor-backend: mp
      spec:
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: kimi-k3-vllm-gb200-disagg-agentic-prefill-compute-domain-channel
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0-kimi-k3-dev.1
          imagePullPolicy: IfNotPresent
          command: [python3, -m, dynamo.vllm]
          args:
          - --model
          - moonshotai/Kimi-K3
          - --served-model-name
          - moonshotai/Kimi-K3
          - --load-format
          - fastsafetensors
          - --safetensors-load-strategy
          - lazy
          - --trust-remote-code
          - --tensor-parallel-size
          - "16"
          - --gpu-memory-utilization
          - "0.90"
          - --kv-cache-dtype
          - fp8
          - --mm-encoder-tp-mode
          - data
          - --mm-encoder-attn-backend
          - TORCH_SDPA
          - --attention-backend
          - FLASHINFER_MLA
          - --attention-config
          - '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
          - --moe-backend
          - flashinfer_trtllm
          - --kernel-config
          - '{"enable_cutedsl_warmup":true}'
          - --kda-prefill-backend
          - flashkda
          - --max-num-seqs
          - "4"
          - --max-num-batched-tokens
          - "16384"
          - --block-size
          - "64"
          - --no-enable-flashinfer-autotune
          - --enable-multimodal
          - --skip-mm-profiling
          - --disable-custom-all-reduce
          - --enable-prefix-caching
          - --no-disable-hybrid-kv-cache-manager
          - --no-enable-log-requests
          - --cpu-distributed-timeout-seconds
          - "3600"
          - --scheduler-cls
          - vllm.v1.core.sched.async_scheduler.AsyncScheduler
          - --dyn-tool-call-parser
          - kimi_k3
          - --dyn-reasoning-parser
          - kimi_k3
          - --dyn-enable-structural-tag
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
          - --disaggregation-mode
          - prefill
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: GP_DISABLE_CUDNN
            value: "1"
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: "7200"
          - name: VLLM_SSM_CONV_STATE_LAYOUT
            value: DS
          - name: VLLM_USE_V2_MODEL_RUNNER
            value: "0"
          - name: VLLM_USE_NCCL_SYMM_MEM
            value: "0"
          - name: VLLM_DEEP_GEMM_WARMUP
            value: skip
          - name: VLLM_FASTSAFETENSORS_QUEUE_SIZE
            value: "1"
          - name: TILELANG_CLEANUP_TEMP_FILES
            value: "1"
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: ETCD_LEASE_TTL
            value: "120"
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: expandable_segments:False
          - name: UCX_MEMTYPE_CACHE
            value: "n"
          - name: UCX_TLS
            value: ^cuda_ipc
          - name: UCX_CUDA_IPC_ENABLE_MNNVL
            value: "y"
          - name: UCX_RCACHE_MAX_UNRELEASED
            value: "1024"
          - name: UCX_MEMTYPE_REG_WHOLE
            value: "n"
          - name: NCCL_CUMEM_ENABLE
            value: "1"
          - name: NCCL_MNNVL_ENABLE
            value: "1"
          - name: NCCL_NVLS_ENABLE
            value: "1"
          - name: NCCL_P2P_LEVEL
            value: NVL
          - name: NCCL_STORE_TIMEOUT
            value: "7200"
          - name: NVIDIA_GDRCOPY
            value: "1"
          - name: TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC
            value: "1800"
          - name: VLLM_RPC_TIMEOUT
            value: "600000"
          - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
            value: "1800"
          - name: VLLM_CONNECTOR_PREFETCH_DEPTH
            value: "8"
          - name: VLLM_CONNECTOR_PREFETCH_KV_CAP
            value: "0.65"
          resources:
            claims:
            - name: compute-domain-channel
            requests:
              cpu: "16"
              memory: 700Gi
              ephemeral-storage: 64Gi
              nvidia.com/gpu: "4"
            limits:
              nvidia.com/gpu: "4"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
          volumeMounts:
          - name: shared-model-cache
            mountPath: /shared-model-cache
        terminationGracePeriodSeconds: 60
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache

  - name: DecodeWorker
    type: decode
    replicas: 1
    multinode:
      nodeCount: 4
    sharedMemorySize: 64Gi
    podTemplate:
      metadata:
        annotations:
          nvidia.com/vllm-distributed-executor-backend: mp
      spec:
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: kimi-k3-vllm-gb200-disagg-agentic-decode-compute-domain-channel
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0-kimi-k3-dev.1
          imagePullPolicy: IfNotPresent
          command: [python3, -m, dynamo.vllm]
          args:
          - --model
          - moonshotai/Kimi-K3
          - --served-model-name
          - moonshotai/Kimi-K3
          - --load-format
          - fastsafetensors
          - --safetensors-load-strategy
          - lazy
          - --trust-remote-code
          - --tensor-parallel-size
          - "16"
          - --gpu-memory-utilization
          - "0.90"
          - --kv-cache-dtype
          - fp8
          - --mm-encoder-tp-mode
          - data
          - --mm-encoder-attn-backend
          - TORCH_SDPA
          - --attention-backend
          - FLASHINFER_MLA
          - --attention-config
          - '{"mla_prefill_backend":"FLASHINFER"}'
          - --moe-backend
          - flashinfer_trtllm
          - --kernel-config
          - '{"enable_cutedsl_warmup":true}'
          - --kda-prefill-backend
          - flashkda
          - --max-num-seqs
          - "256"
          - --max-num-batched-tokens
          - "2048"
          - --compilation-config
          - '{"cudagraph_mode":"FULL_AND_PIECEWISE","max_cudagraph_capture_size":2048,"cudagraph_capture_sizes":[1,2,4,8,12,16,24,32,64,128,256,512,1024,2048]}'
          - --block-size
          - "64"
          - --no-enable-flashinfer-autotune
          - --enable-multimodal
          - --skip-mm-profiling
          - --disable-custom-all-reduce
          - --enable-prefix-caching
          - --no-disable-hybrid-kv-cache-manager
          - --no-enable-log-requests
          - --cpu-distributed-timeout-seconds
          - "3600"
          - --scheduler-cls
          - vllm.v1.core.sched.async_scheduler.AsyncScheduler
          - --dyn-tool-call-parser
          - kimi_k3
          - --dyn-reasoning-parser
          - kimi_k3
          - --dyn-enable-structural-tag
          - --disaggregation-mode
          - decode
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: GP_DISABLE_CUDNN
            value: "1"
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: "7200"
          - name: VLLM_SSM_CONV_STATE_LAYOUT
            value: DS
          - name: VLLM_USE_V2_MODEL_RUNNER
            value: "0"
          - name: VLLM_USE_NCCL_SYMM_MEM
            value: "0"
          - name: VLLM_DEEP_GEMM_WARMUP
            value: skip
          - name: VLLM_FASTSAFETENSORS_QUEUE_SIZE
            value: "1"
          - name: TILELANG_CLEANUP_TEMP_FILES
            value: "1"
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: ETCD_LEASE_TTL
            value: "120"
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: expandable_segments:False
          - name: UCX_MEMTYPE_CACHE
            value: "n"
          - name: UCX_TLS
            value: ^cuda_ipc
          - name: UCX_CUDA_IPC_ENABLE_MNNVL
            value: "y"
          - name: UCX_RCACHE_MAX_UNRELEASED
            value: "1024"
          - name: UCX_MEMTYPE_REG_WHOLE
            value: "n"
          - name: NCCL_CUMEM_ENABLE
            value: "1"
          - name: NCCL_MNNVL_ENABLE
            value: "1"
          - name: NCCL_NVLS_ENABLE
            value: "1"
          - name: NCCL_P2P_LEVEL
            value: NVL
          - name: NCCL_STORE_TIMEOUT
            value: "7200"
          - name: NVIDIA_GDRCOPY
            value: "1"
          - name: TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC
            value: "1800"
          - name: VLLM_RPC_TIMEOUT
            value: "600000"
          - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
            value: "1800"
          - name: VLLM_CONNECTOR_PREFETCH_DEPTH
            value: "8"
          - name: VLLM_CONNECTOR_PREFETCH_KV_CAP
            value: "0.65"
          resources:
            claims:
            - name: compute-domain-channel
            requests:
              cpu: "16"
              memory: 700Gi
              ephemeral-storage: 64Gi
              nvidia.com/gpu: "4"
            limits:
              nvidia.com/gpu: "4"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
          volumeMounts:
          - name: shared-model-cache
            mountPath: /shared-model-cache
        terminationGracePeriodSeconds: 60
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
