---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: kimi-k3-vllm-gb300-agg-agentic-compute-domain
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: kimi-k3-vllm-gb300-agg-agentic-compute-domain-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: kimi-k3-vllm-gb300-agg-agentic
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.4.0-ci-267a3244b74ebfe7834bbb59de90a77d35f35d01-vllm-runtime@sha256:c76257455802d4aae42c5dac4d4754e71a821ef626672814efdf0b3e9328a557
          imagePullPolicy: IfNotPresent
          command: [python3, -m, dynamo.frontend]
          args:
          - --dyn-chat-processor
          - dynamo
          - --router-kv-events
          - --router-min-initial-workers
          - "1"
          - --model-name
          - moonshotai/Kimi-K3
          - --trust-remote-code
          - --http-port
          - "8000"
          env:
          - name: DYN_ROUTER_MODE
            value: kv
          resources:
            requests:
              cpu: "16"
              memory: 128Gi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false

  - name: Worker
    type: worker
    replicas: 1
    multinode:
      nodeCount: 4
    sharedMemorySize: 64Gi
    podTemplate:
      spec:
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: kimi-k3-vllm-gb300-agg-agentic-compute-domain-channel
        containers:
        - name: main
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.4.0-ci-267a3244b74ebfe7834bbb59de90a77d35f35d01-vllm-runtime@sha256:c76257455802d4aae42c5dac4d4754e71a821ef626672814efdf0b3e9328a557
          imagePullPolicy: IfNotPresent
          command: [python3, -m, dynamo.vllm]
          args:
          - --model
          - moonshotai/Kimi-K3
          - --served-model-name
          - moonshotai/Kimi-K3
          - --trust-remote-code
          - --tensor-parallel-size
          - "16"
          - --decode-context-parallel-size
          - "16"
          - --dcp-comm-backend
          - a2a
          - --cp-kv-cache-interleave-size
          - "1"
          - --enable-expert-parallel
          - --enable-ep-weight-filter
          - --moe-backend
          - deep_gemm_mega_moe
          - --all2all-backend
          - flashinfer_nvlink_two_sided
          - --distributed-executor-backend
          - mp
          - --load-format
          - fastsafetensors
          - --safetensors-load-strategy
          - lazy
          - --compilation-config
          - '{"cudagraph_mode":"FULL_AND_PIECEWISE", "max_cudagraph_capture_size": 8192, "cudagraph_capture_sizes": [1, 2, 4, 8, 12, 16, 20, 24, 32, 48, 64, 96, 128, 192, 256, 512, 1024, 1536, 2048, 2560, 3072, 4096, 6144, 8192]}'
          - --gpu-memory-utilization
          - "0.85"
          - --max-num-batched-tokens
          - "8192"
          - --max-num-seqs
          - "32"
          - --enable-prefix-caching
          - --prefix-match-unit
          - "128"
          - --stream-interval
          - "10"
          - --enable-multimodal
          - --no-enable-flashinfer-autotune
          - --kv-cache-dtype
          - fp8
          - --attention-config
          - '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}'
          - --attention-backend
          - TOKENSPEED_MLA
          - --scheduler-cls
          - vllm.v1.core.sched.async_scheduler.AsyncScheduler
          - --dyn-tool-call-parser
          - kimi_k3
          - --dyn-enable-structural-tag
          - --dyn-reasoning-parser
          - kimi_k3
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20081","enable_kv_cache_events":true}'
          - --speculative-config
          - '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":7}'
          # For perf benchmarking only, replace the two entries above with:
          # - --speculative-config
          # - '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":7,"rejection_sample_method":"synthetic","synthetic_acceptance_length":4.2584}'
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: VLLM_USE_NCCL_SYMM_MEM
            value: "0"
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: ETCD_LEASE_TTL
            value: "120"
          - name: PYTORCH_ALLOC_CONF
            value: expandable_segments:True
          - name: TORCHINDUCTOR_ENABLE_PDL
            value: "1"
          - name: VLLM_USE_V2_MODEL_RUNNER
            value: "1"
          - name: VLLM_USE_RUST_FRONTEND
            value: "0"
          - name: VLLM_ALLREDUCE_USE_FLASHINFER
            value: "1"
          - name: NCCL_CUMEM_ENABLE
            value: "1"
          - name: NCCL_MNNVL_ENABLE
            value: "1"
          - name: NCCL_NVLS_ENABLE
            value: "1"
          - name: NCCL_P2P_LEVEL
            value: NVL
          - name: UCX_CUDA_IPC_ENABLE_MNNVL
            value: "y"
          - name: UCX_MEMTYPE_CACHE
            value: "n"
          - name: UCX_MEMTYPE_REG_WHOLE
            value: "n"
          resources:
            claims:
            - name: compute-domain-channel
            requests:
              cpu: "16"
              memory: 512Gi
              ephemeral-storage: 64Gi
              nvidia.com/gpu: "4"
            limits:
              nvidia.com/gpu: "4"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
          volumeMounts:
          - name: shared-model-cache
            mountPath: /shared-model-cache
        terminationGracePeriodSeconds: 60
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
