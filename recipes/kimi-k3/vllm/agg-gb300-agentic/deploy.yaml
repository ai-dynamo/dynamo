# --speculative-config '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":7,"rejection_sample_method":"synthetic","synthetic_acceptance_length":4.2584}'

apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: kimi-k3-agg-compute-domain
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: kimi-k3-agg-compute-domain-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: kimi-k3-agg
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          imagePullSecrets:
            - name: acr-token-secret
            - name: nvcr-secret
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-GB300
            nvidia.com/gpu.clique: "0e804531-7d0e-ce6f-a1f4-9a9854394a7f.1"
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
          containers:
            - name: main
              image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.4.0-ci-cb5a78bc81476659052a2889271a5e10dd545d97-vllm-runtime
              securityContext:
                runAsUser: 0
              command: [python3, -m, dynamo.frontend]
              args: [--dyn-chat-processor, dynamo, --router-mode, kv, --http-port, "8000"]
              volumeMounts:
                - {name: model-cache, mountPath: /model-cache, readOnly: true}
              env:
                - {name: HF_HOME, value: /model-cache}
                - {name: HF_HUB_OFFLINE, value: "1"}
                - {name: TRANSFORMERS_OFFLINE, value: "1"}
    - name: VllmDecodeWorker
      type: decode
      replicas: 1
      multinode:
        nodeCount: 4
      sharedMemorySize: 200Gi
      podTemplate:
        spec:
          imagePullSecrets:
            - name: acr-token-secret
            - name: nvcr-secret
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-GB300
            nvidia.com/gpu.clique: "0e804531-7d0e-ce6f-a1f4-9a9854394a7f.1"
          resourceClaims:
            - name: compute-domain-channel
              resourceClaimTemplateName: kimi-k3-agg-compute-domain-channel
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
          containers:
            - name: main
              image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.4.0-ci-cb5a78bc81476659052a2889271a5e10dd545d97-vllm-runtime
              securityContext:
                runAsUser: 0
              resources:
                limits:
                  nvidia.com/gpu: "4"
                requests:
                  nvidia.com/gpu: "4"
                claims:
                  - name: compute-domain-channel
              volumeMounts:
                - {name: model-cache, mountPath: /model-cache, readOnly: true}
              startupProbe:
                httpGet: {path: /health, port: 9090}
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 720
              env:
                - {name: MODEL_PATH, value: moonshotai/Kimi-K3}
                - {name: SERVED_MODEL_NAME, value: moonshotai/Kimi-K3}
                - {name: HF_HOME, value: /model-cache}
                - {name: HF_MODULES_CACHE, value: /tmp/hf_modules}
                - {name: HF_HUB_OFFLINE, value: "1"}
                - {name: TRANSFORMERS_OFFLINE, value: "1"}
                - {name: NCCL_SOCKET_IFNAME, value: eth0}
                - {name: GLOO_SOCKET_IFNAME, value: eth0}
                - {name: VLLM_USE_NCCL_SYMM_MEM, value: "0"}
                - {name: DYN_REQUEST_PLANE, value: tcp}
                - {name: ETCD_LEASE_TTL, value: "120"}
                - {name: CUDA_HOME, value: /usr/local/cuda}
                - {name: VLLM_SERVER_DEV_MODE, value: "1"}
                - {name: PYTORCH_ALLOC_CONF, value: "expandable_segments:True"}
                - {name: TORCHINDUCTOR_ENABLE_PDL, value: "1"}
                - {name: VLLM_USE_V2_MODEL_RUNNER, value: "1"}
                - {name: VLLM_USE_RUST_FRONTEND, value: "0"}
                - {name: VLLM_ALLREDUCE_USE_FLASHINFER, value: "1"}
                - {name: NCCL_CUMEM_ENABLE, value: "1"}
                - {name: NCCL_MNNVL_ENABLE, value: "1"}
                - {name: NCCL_NVLS_ENABLE, value: "1"}
                - {name: NCCL_P2P_LEVEL, value: NVL}
                - {name: UCX_CUDA_IPC_ENABLE_MNNVL, value: "y"}
                - {name: UCX_MEMTYPE_CACHE, value: "n"}
                - {name: UCX_MEMTYPE_REG_WHOLE, value: "n"}
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  exec python3 -m dynamo.vllm \
                    --model "${MODEL_PATH}" \
                    --served-model-name "${SERVED_MODEL_NAME}" \
                    --trust-remote-code \
                    --tensor-parallel-size 16 \
                    --decode-context-parallel-size 16 \
                    --dcp-comm-backend a2a \
                    --cp-kv-cache-interleave-size 1 \
                    --enable-expert-parallel \
                    --enable-ep-weight-filter \
                    --moe-backend deep_gemm_mega_moe \
                    --all2all-backend flashinfer_nvlink_two_sided \
                    --distributed-executor-backend mp \
                    --load-format fastsafetensors \
                    --safetensors-load-strategy lazy \
                    --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE", "max_cudagraph_capture_size": 8192, "cudagraph_capture_sizes": [1, 2, 4, 8, 12, 16, 20, 24, 32, 48, 64, 96, 128, 192, 256, 512, 1024, 1536, 2048, 2560, 3072, 4096, 6144, 8192]}' \
                    --gpu-memory-utilization 0.85 \
                    --max-num-batched-tokens 8192 \
                    --max-num-seqs 32 \
                    --enable-prefix-caching \
                    --prefix-match-unit 128 \
                    --stream-interval 10 \
                    --enable-multimodal \
                    --no-enable-flashinfer-autotune \
                    --kv-cache-dtype fp8 \
                    --attention-config '{"mla_prefill_backend":"TRTLLM_RAGGED","use_prefill_query_quantization":true}' \
                    --attention-backend TOKENSPEED_MLA \
                    --scheduler-cls vllm.v1.core.sched.async_scheduler.AsyncScheduler \
                    --dyn-tool-call-parser kimi_k3 \
                    --dyn-enable-structural-tag \
                    --reasoning-parser kimi_k3 \
                    --dyn-reasoning-parser kimi_k3 \
                    --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20081","enable_kv_cache_events":true}' \
                    --speculative-config '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":7,"rejection_sample_method":"synthetic","synthetic_acceptance_length":4.2584}'
