apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: kimi-k3-disagg
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - args:
          - --dyn-chat-processor
          - dynamo
          - --router-mode
          - kv
          - --http-port
          - "8000"
          command:
          - python3
          - -m
          - dynamo.frontend
          env:
          - name: HF_HOME
            value: /model-cache
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: TRANSFORMERS_OFFLINE
            value: "1"
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.4.0-ci-cb5a78bc81476659052a2889271a5e10dd545d97-vllm-runtime
          name: main
          securityContext:
            runAsUser: 0
          volumeMounts:
          - mountPath: /model-cache
            name: model-cache
            readOnly: true
        imagePullSecrets:
        - name: acr-token-secret
        - name: k3-baked-nvcr-pull
        nodeSelector:
          nvidia.com/gpu.clique: 0e804531-7d0e-ce6f-a1f4-9a9854394a7f.1
          nvidia.com/gpu.product: NVIDIA-GB300
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
    replicas: 1
    type: frontend
  - multinode:
      nodeCount: 2
    name: PrefillWorker
    podTemplate:
      spec:
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-GB300
          nvidia.com/gpu.clique: 0e804531-7d0e-ce6f-a1f4-9a9854394a7f.1
        containers:
        - args:
          - |-
            set -eu
            exec python3 -m dynamo.vllm \
              --model "${MODEL_ID}" \
              --served-model-name "${SERVED_MODEL_NAME}" \
              --trust-remote-code \
              --tensor-parallel-size 8 \
              --gpu-memory-utilization 0.9 \
              --block-size 768 \
              --max-num-seqs 16 \
              --distributed-executor-backend mp \
              --load-format fastsafetensors \
              --safetensors-load-strategy lazy \
              --enable-cumem-allocator \
              --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE", "max_cudagraph_capture_size": 16384, "cudagraph_capture_sizes": [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 6656, 8192, 12288, 13312, 14336, 16384]}' \
              --max-num-batched-tokens 16384 \
              --kv-cache-dtype fp8 \
              --no-enable-flashinfer-autotune \
              --enable-prefix-caching \
              --enable-multimodal \
              --attention-backend TOKENSPEED_MLA \
              --attention-config '{"mla_prefill_backend":"TRTLLM_RAGGED", "use_prefill_query_quantization":true}' \
              --scheduler-cls vllm.v1.core.sched.async_scheduler.AsyncScheduler \
              --dyn-tool-call-parser kimi_k3 \
              --reasoning-parser kimi_k3 \
              --dyn-reasoning-parser kimi_k3 \
              --dyn-enable-structural-tag \
              --disaggregation-mode prefill \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}' \
              --speculative-config '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":7,"rejection_sample_method":"synthetic","synthetic_acceptance_length":4.2584}' \
              --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20081","enable_kv_cache_events":true}'
          command:
          - /bin/sh
          - -c
          env:
          - name: HF_HOME
            value: /model-cache
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: MODEL_ID
            value: moonshotai/Kimi-K3
          - name: SERVED_MODEL_NAME
            value: moonshotai/Kimi-K3
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: CUDA_HOME
            value: /usr/local/cuda
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: expandable_segments:True
          - name: ETCD_LEASE_TTL
            value: "120"
          - name: VLLM_USE_NCCL_SYMM_MEM
            value: "0"
          - name: TORCH_SYMMMEM
            value: NVSHMEM
          - name: NCCL_CUMEM_ENABLE
            value: "1"
          - name: NCCL_MNNVL_ENABLE
            value: "1"
          - name: NCCL_NVLS_ENABLE
            value: "1"
          - name: VLLM_SERVER_DEV_MODE
            value: "1"
          - name: VLLM_DEEP_GEMM_WARMUP
            value: skip
          - name: VLLM_FASTSAFETENSORS_QUEUE_SIZE
            value: "1"
          - name: TORCHINDUCTOR_ENABLE_PDL
            value: "1"
          - name: VLLM_USE_V2_MODEL_RUNNER
            value: "1"
          - name: VLLM_ALLREDUCE_USE_FLASHINFER
            value: "1"
          - name: VLLM_FLASHINFER_ALLREDUCE_BACKEND
            value: mnnvl
          - name: VLLM_PREFIX_CACHE_RETENTION_INTERVAL
            value: "0"
          - name: VLLM_SSM_CONV_STATE_LAYOUT
            value: DS
          - name: NCCL_P2P_LEVEL
            value: NVL
          - name: TRANSFORMERS_OFFLINE
            value: "1"
          - name: UCX_RCACHE_MAX_UNRELEASED
            value: "1024"
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.4.0-ci-cb5a78bc81476659052a2889271a5e10dd545d97-vllm-runtime
          name: main
          resources:
            claims:
            - name: compute-domain-channel
            limits:
              nvidia.com/gpu: "4"
            requests:
              nvidia.com/gpu: "4"
          securityContext:
            runAsUser: 0
          startupProbe:
            failureThreshold: 720
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
          - mountPath: /model-cache
            name: model-cache
            readOnly: true
        imagePullSecrets:
        - name: acr-token-secret
        - name: k3-baked-nvcr-pull
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: kimi-k3-disagg-compute-domain-channel
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
    replicas: 1
    sharedMemorySize: 200Gi
    type: prefill
  - multinode:
      nodeCount: 2
    name: DecodeWorker
    podTemplate:
      spec:
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-GB300
          nvidia.com/gpu.clique: 0e804531-7d0e-ce6f-a1f4-9a9854394a7f.1
        containers:
        - args:
          - |
            set -eu
            exec python3 -m dynamo.vllm \
              --model "${MODEL_ID}" \
              --served-model-name "${SERVED_MODEL_NAME}" \
              --trust-remote-code \
              --tensor-parallel-size 8 \
              --gpu-memory-utilization 0.85 \
              --block-size 1536 \
              --max-num-seqs 128 \
              --max-num-batched-tokens 2048 \
              --distributed-executor-backend mp \
              --load-format fastsafetensors \
              --safetensors-load-strategy lazy \
              --enable-cumem-allocator \
              --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY", "max_cudagraph_capture_size": 256}' \
              --no-enable-flashinfer-autotune \
              --enable-prefix-caching \
              --kv-cache-dtype fp8 \
              --enable-multimodal \
              --attention-backend TOKENSPEED_MLA \
              --attention-config '{"mla_prefill_backend":"TRTLLM_RAGGED", "use_prefill_query_quantization":true}' \
              --scheduler-cls vllm.v1.core.sched.async_scheduler.AsyncScheduler \
              --dyn-tool-call-parser kimi_k3 \
              --reasoning-parser kimi_k3 \
              --dyn-reasoning-parser kimi_k3 \
              --dyn-enable-structural-tag \
              --disaggregation-mode decode \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}' \
              --speculative-config '{"model":"Inferact/Kimi-K3-DSpark","attention_backend":"TOKENSPEED_MLA","method":"dspark","num_speculative_tokens":7,"rejection_sample_method":"synthetic","synthetic_acceptance_length":4.2584}'
          command:
          - /bin/sh
          - -c
          env:
          - name: HF_HOME
            value: /model-cache
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: TRANSFORMERS_OFFLINE
            value: "1"
          - name: MODEL_ID
            value: moonshotai/Kimi-K3
          - name: SERVED_MODEL_NAME
            value: moonshotai/Kimi-K3
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: CUDA_HOME
            value: /usr/local/cuda
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: expandable_segments:True
          - name: ETCD_LEASE_TTL
            value: "120"
          - name: VLLM_USE_NCCL_SYMM_MEM
            value: "0"
          - name: VLLM_USE_DIRECT_DCP_A2A
            value: "0"
          - name: VLLM_USE_DIRECT_DCP_Q_GATHER
            value: "0"
          - name: VLLM_USE_DIRECT_DCP_KV_GATHER
            value: "0"
          - name: TORCH_SYMMMEM
            value: NVSHMEM
          - name: NCCL_CUMEM_ENABLE
            value: "1"
          - name: NCCL_MNNVL_ENABLE
            value: "1"
          - name: NCCL_NVLS_ENABLE
            value: "1"
          - name: VLLM_SERVER_DEV_MODE
            value: "1"
          - name: VLLM_DEEP_GEMM_WARMUP
            value: skip
          - name: VLLM_FASTSAFETENSORS_QUEUE_SIZE
            value: "1"
          - name: TORCHINDUCTOR_ENABLE_PDL
            value: "1"
          - name: VLLM_USE_V2_MODEL_RUNNER
            value: "1"
          - name: VLLM_ALLREDUCE_USE_FLASHINFER
            value: "1"
          - name: VLLM_FLASHINFER_ALLREDUCE_BACKEND
            value: mnnvl
          - name: VLLM_PREFIX_CACHE_RETENTION_INTERVAL
            value: "0"
          - name: VLLM_SSM_CONV_STATE_LAYOUT
            value: DS
          - name: NCCL_P2P_LEVEL
            value: NVL
          - name: UCX_RCACHE_MAX_UNRELEASED
            value: "1024"
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.4.0-ci-cb5a78bc81476659052a2889271a5e10dd545d97-vllm-runtime
          name: main
          resources:
            claims:
            - name: compute-domain-channel
            limits:
              nvidia.com/gpu: "4"
            requests:
              nvidia.com/gpu: "4"
          securityContext:
            runAsUser: 0
          startupProbe:
            failureThreshold: 720
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
          - mountPath: /model-cache
            name: model-cache
            readOnly: true
        imagePullSecrets:
        - name: acr-token-secret
        - name: k3-baked-nvcr-pull
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: kimi-k3-disagg-compute-domain-channel
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
    replicas: 1
    sharedMemorySize: 200Gi
    type: decode
---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: kimi-k3-disagg-compute-domain
spec:
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: kimi-k3-disagg-compute-domain-channel
  numNodes: 0
