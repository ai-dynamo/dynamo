apiVersion: v1
kind: ConfigMap
metadata:
  name: kimi-k3-sglang-gb200-agg-agentic-sglang-config
data:
  worker.yaml: |-
    model-path: moonshotai/Kimi-K3
    served-model-name: moonshotai/Kimi-K3
    trust-remote-code: true
    tp-size: 16
    dcp-size: 16
    ep-size: 16
    context-length: 1048576
    max-running-requests: 64
    mem-fraction-static: 0.88
    chunked-prefill-size: 8192
    max-prefill-tokens: 8192
    page-size: 64
    schedule-policy: fcfs
    weight-loader-prefetch-checkpoints: true
    enable-multimodal: true
    speculative-algorithm: DSPARK
    speculative-draft-model-path: RadixArk/Kimi-K3-DSpark
    speculative-dspark-block-size: 7
    enable-linear-replayssm-spec: true
    moe-runner-backend: deep_gemm
    moe-a2a-backend: megamoe
    mamba-full-memory-ratio: 0.9
    enable-nccl-nvls: true
    enable-hierarchical-cache: true
    hicache-size: 100
    kv-cache-dtype: fp8_e4m3
    host: 0.0.0.0
    port: 30000
    kv-events-config:
      publisher: zmq
      topic: kv-events
      endpoint: tcp://*:5557
    enable-metrics: true
---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: kimi-k3-sglang-gb200-agg-agentic-compute-domain
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: kimi-k3-sglang-gb200-agg-agentic-compute-domain-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: kimi-k3-sglang-gb200-agg-agentic
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvstaging/nim/alexandrem:1.4.0-sglang-runtime-pr12513-26ea9a09-arm64@sha256:8a976389818342f7fbd5dca9a6595beeed7edc8ce74d611aa9f9e98b5bf3cdcb
              imagePullPolicy: IfNotPresent
              command: [python3, -m, dynamo.frontend]
              args:
                - --http-port
                - "8000"
                - --router-kv-events
                - --router-min-initial-workers
                - "1"
                - --dyn-chat-processor
                - dynamo
                - --model-name
                - moonshotai/Kimi-K3
                - --trust-remote-code
              env:
                - name: DYN_ROUTER_MODE
                  value: least-loaded
              ports:
                - name: http
                  containerPort: 8000
                  protocol: TCP
              resources:
                requests:
                  cpu: "16"
                  memory: 128Gi
              securityContext:
                runAsUser: 0
                runAsGroup: 0

    - name: Worker
      type: worker
      replicas: 2
      multinode:
        nodeCount: 4
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          resourceClaims:
            - name: compute-domain-channel
              resourceClaimTemplateName: kimi-k3-sglang-gb200-agg-agentic-compute-domain-channel
          terminationGracePeriodSeconds: 60
          containers:
            - name: main
              image: nvcr.io/nvstaging/nim/alexandrem:1.4.0-sglang-runtime-pr12513-26ea9a09-arm64@sha256:8a976389818342f7fbd5dca9a6595beeed7edc8ce74d611aa9f9e98b5bf3cdcb
              imagePullPolicy: IfNotPresent
              command: [python3, -m, dynamo.sglang]
              args:
                - --config
                - /etc/sglang/worker.yaml
                - --dyn-reasoning-parser
                - kimi_k3
                - --dyn-tool-call-parser
                - kimi_k3
                - --dyn-enable-structural-tag
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: HF_HOME
                  value: /shared-model-cache
                - name: DYN_FORWARDPASS_METRIC_PORT
                  value: ""
                - name: NCCL_MNNVL_ENABLE
                  value: "1"
                - name: NCCL_NVLS_ENABLE
                  value: "1"
                - name: NCCL_CUMEM_ENABLE
                  value: "1"
                - name: SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK
                  value: "512"
                # For perf benchmarking only
                # - name: SGLANG_RAGGED_VERIFY_MODE
                #   value: static
                # - name: SGLANG_SIMULATE_ACC_LEN
                #   value: "4.05"
                # - name: SGLANG_SIMULATE_ACC_METHOD
                #   value: match-expected
              ports:
                - name: system
                  containerPort: 9090
                  protocol: TCP
              resources:
                claims:
                  - name: compute-domain-channel
                requests:
                  cpu: "16"
                  memory: 512Gi
                  ephemeral-storage: 64Gi
                  nvidia.com/gpu: "4"
                limits:
                  nvidia.com/gpu: "4"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              volumeMounts:
                - name: sglang-config
                  mountPath: /etc/sglang
                  readOnly: true
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                  readOnly: true
          volumes:
            - name: sglang-config
              configMap:
                name: kimi-k3-sglang-gb200-agg-agentic-sglang-config
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
