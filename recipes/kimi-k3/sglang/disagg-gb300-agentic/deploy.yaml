apiVersion: v1
kind: ConfigMap
metadata:
  name: kimi-k3-sglang-gb300-disagg-agentic-sglang-config
data:
  prefill.yaml: |-
    model-path: moonshotai/Kimi-K3
    served-model-name: moonshotai/Kimi-K3
    trust-remote-code: true
    context-length: 1048576
    max-running-requests: 32
    mem-fraction-static: 0.92
    weight-loader-prefetch-checkpoints: true
    enable-multimodal: true
    speculative-algorithm: DSPARK
    speculative-draft-model-path: RadixArk/Kimi-K3-DSpark
    speculative-dspark-block-size: 7
    disable-overlap-schedule: true
    disaggregation-mode: prefill
    disaggregation-transfer-backend: mooncake
    disaggregation-bootstrap-port: 30001
    enable-metrics: true
    enable-nccl-nvls: true
    tp-size: 8
    dp-size: 1
    ep-size: 8
    pp-size: 1
    dcp-size: 1
    moe-runner-backend: deep_gemm
    moe-a2a-backend: megamoe
    cuda-graph-backend-decode: disabled
    mamba-full-memory-ratio: 0.7
    page-size: 64
    enable-hierarchical-cache: true
    hicache-size: 100
    kv-cache-dtype: fp8_e4m3

  decode.yaml: |-
    model-path: moonshotai/Kimi-K3
    served-model-name: moonshotai/Kimi-K3
    trust-remote-code: true
    context-length: 1048576
    max-running-requests: 64
    mem-fraction-static: 0.92
    mamba-full-memory-ratio: 0.9
    kv-cache-dtype: fp8_e4m3
    weight-loader-prefetch-checkpoints: true
    enable-multimodal: true
    speculative-algorithm: DSPARK
    speculative-draft-model-path: RadixArk/Kimi-K3-DSpark
    speculative-dspark-block-size: 7
    disaggregation-mode: decode
    disaggregation-transfer-backend: mooncake
    disaggregation-bootstrap-port: 30001
    enable-metrics: true
    enable-nccl-nvls: true
    tp-size: 8
    dcp-size: 8
    ep-size: 8
    decode-attention-backend: cutedsl_mla
    moe-runner-backend: deep_gemm
    moe-a2a-backend: megamoe
    page-size: 64
---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: kimi-k3-sglang-gb300-disagg-agentic-compute-domain
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: kimi-k3-sglang-gb300-disagg-agentic-compute-domain-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: kimi-k3-sglang-gb300-disagg-agentic
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.4.0-ci-267a3244b74ebfe7834bbb59de90a77d35f35d01-sglang-runtime@sha256:80a0704364a7e5789c3ba236182040e60bd63c65e5ddc481716695b5ae6391c4
              imagePullPolicy: IfNotPresent
              command: [python3, -m, dynamo.frontend]
              args:
                - --http-port
                - "8000"
                - --router-min-initial-workers
                - "1"
                - --dyn-chat-processor
                - dynamo
                - --model-name
                - moonshotai/Kimi-K3
                - --trust-remote-code
              env:
                - name: DYN_ROUTER_MODE
                  value: least-loaded
              ports:
                - name: http
                  containerPort: 8000
                  protocol: TCP
              resources:
                requests:
                  cpu: "16"
                  memory: 128Gi
              securityContext:
                runAsUser: 0
                runAsGroup: 0

    - name: PrefillWorker
      type: prefill
      replicas: 1
      multinode:
        nodeCount: 2
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          resourceClaims:
            - name: compute-domain-channel
              resourceClaimTemplateName: kimi-k3-sglang-gb300-disagg-agentic-compute-domain-channel
          terminationGracePeriodSeconds: 60
          containers:
            - name: main
              image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.4.0-ci-267a3244b74ebfe7834bbb59de90a77d35f35d01-sglang-runtime@sha256:80a0704364a7e5789c3ba236182040e60bd63c65e5ddc481716695b5ae6391c4
              imagePullPolicy: IfNotPresent
              command: [python3, -m, dynamo.sglang]
              args:
                - --config
                - /etc/sglang/prefill.yaml
                - --dyn-reasoning-parser
                - kimi_k3
                - --dyn-tool-call-parser
                - kimi_k3
                - --dyn-enable-structural-tag
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: HF_HOME
                  value: /shared-model-cache
                - name: DYN_FORWARDPASS_METRIC_PORT
                  value: ""
                - name: NCCL_MNNVL_ENABLE
                  value: "1"
                - name: NCCL_NVLS_ENABLE
                  value: "1"
                - name: NCCL_CUMEM_ENABLE
                  value: "1"
                - name: SGLANG_OPT_USE_CUSTOM_ALL_REDUCE_V2
                  value: "1"
                - name: SGLANG_ENABLE_CUSTOM_ALL_REDUCE_V2_MULTINODE
                  value: "1"
                - name: SGLANG_OPT_MAMBA_SKIP_DECODE_LOCK
                  value: "1"
                - name: SGLANG_MOONCAKE_CUSTOM_MEM_POOL
                  value: NVLINK
                - name: MC_FORCE_MNNVL
                  value: "true"
                - name: SGLANG_RAGGED_VERIFY_MODE
                  value: static
                - name: SGLANG_K3_SP_COLLECTIVE
                  value: "1"
                - name: SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK
                  value: "2048"
                # For perf benchmarking only
                # - name: SGLANG_SIMULATE_ACC_LEN
                #   value: "4.05"
                # - name: SGLANG_SIMULATE_ACC_METHOD
                #   value: match-expected
              ports:
                - name: system
                  containerPort: 9090
                  protocol: TCP
                - name: bootstrap
                  containerPort: 30001
                  protocol: TCP
              resources:
                claims:
                  - name: compute-domain-channel
                requests:
                  cpu: "16"
                  memory: 512Gi
                  ephemeral-storage: 64Gi
                  nvidia.com/gpu: "4"
                limits:
                  nvidia.com/gpu: "4"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              volumeMounts:
                - name: sglang-config
                  mountPath: /etc/sglang
                  readOnly: true
                - name: shared-model-cache
                  mountPath: /shared-model-cache
          volumes:
            - name: sglang-config
              configMap:
                name: kimi-k3-sglang-gb300-disagg-agentic-sglang-config
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache

    - name: DecodeWorker
      type: decode
      replicas: 1
      multinode:
        nodeCount: 2
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          resourceClaims:
            - name: compute-domain-channel
              resourceClaimTemplateName: kimi-k3-sglang-gb300-disagg-agentic-compute-domain-channel
          terminationGracePeriodSeconds: 60
          containers:
            - name: main
              image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.4.0-ci-267a3244b74ebfe7834bbb59de90a77d35f35d01-sglang-runtime@sha256:80a0704364a7e5789c3ba236182040e60bd63c65e5ddc481716695b5ae6391c4
              imagePullPolicy: IfNotPresent
              command: [python3, -m, dynamo.sglang]
              args:
                - --config
                - /etc/sglang/decode.yaml
                - --dyn-reasoning-parser
                - kimi_k3
                - --dyn-tool-call-parser
                - kimi_k3
                - --dyn-enable-structural-tag
                # The SGLang YAML parser rejects this StoreTrue flag because a
                # deprecated alias shares its destination. Pass it via CLI.
                - --enable-linear-replayssm-spec
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: HF_HOME
                  value: /shared-model-cache
                - name: DYN_FORWARDPASS_METRIC_PORT
                  value: ""
                - name: NCCL_MNNVL_ENABLE
                  value: "1"
                - name: NCCL_NVLS_ENABLE
                  value: "1"
                - name: NCCL_CUMEM_ENABLE
                  value: "1"
                - name: SGLANG_OPT_USE_CUSTOM_ALL_REDUCE_V2
                  value: "1"
                - name: SGLANG_ENABLE_CUSTOM_ALL_REDUCE_V2_MULTINODE
                  value: "1"
                - name: SGLANG_MOONCAKE_CUSTOM_MEM_POOL
                  value: NVLINK
                - name: MC_FORCE_MNNVL
                  value: "true"
                - name: SGLANG_RAGGED_VERIFY_MODE
                  value: static
                # For perf benchmarking only
                # - name: SGLANG_SIMULATE_ACC_LEN
                #   value: "4.05"
                # - name: SGLANG_SIMULATE_ACC_METHOD
                #   value: match-expected
                - name: SGLANG_K3_SP_COLLECTIVE
                  value: "1"
              ports:
                - name: system
                  containerPort: 9090
                  protocol: TCP
                - name: bootstrap
                  containerPort: 30001
                  protocol: TCP
              resources:
                claims:
                  - name: compute-domain-channel
                requests:
                  cpu: "16"
                  memory: 512Gi
                  ephemeral-storage: 64Gi
                  nvidia.com/gpu: "4"
                limits:
                  nvidia.com/gpu: "4"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              volumeMounts:
                - name: sglang-config
                  mountPath: /etc/sglang
                  readOnly: true
                - name: shared-model-cache
                  mountPath: /shared-model-cache
          volumes:
            - name: sglang-config
              configMap:
                name: kimi-k3-sglang-gb300-disagg-agentic-sglang-config
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
