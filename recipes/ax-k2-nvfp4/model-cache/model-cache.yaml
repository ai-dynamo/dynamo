apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 600Gi
  # Edit this to a ReadWriteMany storage class available on the target cluster.
  storageClassName: "your-storage-class-name"
