#
# One IMEX ComputeDomain spans the four trays so NIXL moves KV over MNNVL (UCX CUDA IPC).
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: mistral-large-4-vllm-gb300-disagg-agentic-compute-domain
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: mistral-large-4-vllm-gb300-disagg-agentic-compute-domain-channel
