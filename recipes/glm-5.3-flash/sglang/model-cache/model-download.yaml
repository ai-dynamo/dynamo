apiVersion: batch/v1
kind: Job
metadata:
  name: glm53-flash-nvfp4-model-download
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: glm53-flash-nvfp4-model-download
    spec:
      restartPolicy: Never
      containers:
        - name: model-download
          image: python:3.10-slim
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
          envFrom:
            - secretRef:
                name: hf-token-secret
                optional: true
          env:
            - name: HF_HOME
              value: /shared-model-cache
            - name: HF_XET_HIGH_PERFORMANCE
              value: '1'
          args:
            - |
              set -eu
              pip install --no-cache-dir huggingface_hub==1.16.4
              hf download RadixArk/GLM-5.3-Flash-NVFP4 \
                --revision f46cf340d35a22d0d83d0c1dac8957cf2b1bcd35
          volumeMounts:
            - name: shared-model-cache
              mountPath: /shared-model-cache
          imagePullPolicy: IfNotPresent
      volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
