- op: add
  path: /spec/priorityClassName
  value: inference
- op: test
  path: /spec/components/0/name
  value: Frontend
- op: add
  path: /spec/components/0/podTemplate/spec/priorityClassName
  value: inference
- op: add
  path: /spec/components/0/podTemplate/spec/nodeSelector
  value:
    kubernetes.io/arch: amd64
- op: add
  path: /spec/components/0/podTemplate/spec/tolerations
  value:
  - key: nvidia.com/gpu
    operator: Equal
    value: 'true'
    effect: NoSchedule
- op: test
  path: /spec/components/1/name
  value: Worker
- op: add
  path: /spec/components/1/podTemplate/spec/priorityClassName
  value: inference
- op: add
  path: /spec/components/1/podTemplate/spec/nodeSelector
  value:
    kubernetes.io/arch: amd64
    nvidia.com/gpu.product: NVIDIA-B200
- op: add
  path: /spec/components/1/podTemplate/spec/tolerations
  value:
  - key: nvidia.com/gpu
    operator: Equal
    value: 'true'
    effect: NoSchedule
- op: add
  path: /spec/components/1/podTemplate/spec/containers/0/startupProbe
  value:
    httpGet:
      path: /health
      port: 9090
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 720
- op: add
  path: /spec/components/1/podTemplate/spec/containers/0/readinessProbe
  value:
    httpGet:
      path: /health
      port: 9090
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 18
