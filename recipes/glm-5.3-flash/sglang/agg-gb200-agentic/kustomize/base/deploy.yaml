apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: glm53-flash-sglang-agg-gb200
  labels:
    app.kubernetes.io/name: glm53-flash-sglang-agg-gb200
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-glm-5.3-flash-dev.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.frontend
                - --http-host
                - 0.0.0.0
                - --http-port
                - '8000'
                - --trust-remote-code
              env:
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: TRANSFORMERS_OFFLINE
                  value: '1'
                - name: DYN_ROUTER_MODE
                  value: round-robin
              ports:
                - name: http
                  containerPort: 8000
              resources:
                requests:
                  cpu: '4'
                  memory: 16Gi
    - name: Worker
      type: worker
      replicas: 1
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-glm-5.3-flash-dev.1
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.sglang
                - --trust-remote-code
                - --enable-multimodal
                - --frontend-decoding
                - --mm-enable-dp-encoder
                - --model-path
                - RadixArk/GLM-5.3-Flash-NVFP4
                - --revision
                - f46cf340d35a22d0d83d0c1dac8957cf2b1bcd35
                - --served-model-name
                - RadixArk/GLM-5.3-Flash-NVFP4
                - --quantization
                - modelopt_fp4
                - --tp-size
                - '4'
                - --dsa-prefill-backend
                - trtllm
                - --dsa-decode-backend
                - trtllm
                - --kv-cache-dtype
                - fp8_e4m3
                - --moe-runner-backend
                - flashinfer_trtllm
                - --speculative-algorithm
                - EAGLE
                - --speculative-num-steps
                - '3'
                - --speculative-eagle-topk
                - '1'
                - --speculative-num-draft-tokens
                - '4'
                - --mem-fraction-static
                - '0.7'
                - --cuda-graph-max-bs-decode
                - '64'
                - --host
                - 0.0.0.0
                - --port
                - '30000'
                - --chunked-prefill-size
                - '16384'
                - --cuda-graph-backend-prefill
                - breakable
                - --dyn-reasoning-parser
                - glm45
                - --dyn-tool-call-parser
                - glm47
                - --enable-metrics
                - --linear-attn-decode-backend
                - triton
                - --linear-attn-prefill-backend
                - ptx_kda
                - --linear-attn-verify-backend
                - triton
                - --mamba-ssm-dtype
                - float32
                - --max-prefill-tokens
                - '16384'
                - --page-size
                - '64'
                - --weight-loader-prefetch-checkpoints
                - --enable-nccl-nvls
                - --max-running-requests
                - '64'
                - --enable-linear-replayssm-spec
                - --enable-hierarchical-cache
                - --hicache-size
                - '100'
              env:
                - name: HF_HOME
                  value: /shared-model-cache
                - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
                  value: '300'
                - name: HF_HUB_OFFLINE
                  value: '1'
                - name: TRANSFORMERS_OFFLINE
                  value: '1'
                - name: NCCL_MNNVL_ENABLE
                  value: '1'
                - name: NCCL_NVLS_ENABLE
                  value: '1'
                - name: NCCL_CUMEM_ENABLE
                  value: '1'
                - name: SGLANG_OPT_USE_CUSTOM_ALL_REDUCE_V2
                  value: '1'
                - name: SGLANG_ENABLE_CUSTOM_ALL_REDUCE_V2_MULTINODE
                  value: '1'
              ports:
                - name: system
                  containerPort: 9090
              livenessProbe:
                httpGet:
                  path: /live
                  port: system
                periodSeconds: 5
                timeoutSeconds: 4
                failureThreshold: 60
              resources:
                requests:
                  cpu: '16'
                  memory: 448Gi
                  nvidia.com/gpu: '4'
                limits:
                  nvidia.com/gpu: '4'
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
                    - SYS_RESOURCE
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
