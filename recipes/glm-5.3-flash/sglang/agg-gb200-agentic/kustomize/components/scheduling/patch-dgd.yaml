- op: test
  path: /spec/components/0/name
  value: Frontend
- op: add
  path: /spec/components/0/podTemplate/spec/nodeSelector
  value:
    kubernetes.io/arch: arm64
- op: add
  path: /spec/components/0/podTemplate/spec/tolerations
  value:
  - key: kubernetes.io/arch
    operator: Equal
    value: arm64
    effect: NoSchedule
- op: test
  path: /spec/components/1/name
  value: Worker
- op: add
  path: /spec/components/1/podTemplate/spec/nodeSelector
  value:
    kubernetes.io/arch: arm64
    nvidia.com/gpu.product: NVIDIA-GB200
- op: add
  path: /spec/components/1/podTemplate/spec/tolerations
  value:
  - key: kubernetes.io/arch
    operator: Equal
    value: arm64
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule
