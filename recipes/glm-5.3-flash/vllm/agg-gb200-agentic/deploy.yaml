# GLM-5.3-Flash — aggregated, 4x GB200 (TP=4), agentic workload (64K ISL / 400 OSL).
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: glm53-flash-agg-gb200-agentic-compute-domain
spec:
  # 0 = on-demand; spans full NVL72 rack so MNNVL all-reduce handles are valid across nodes.
  numNodes: 0
  channel:
    resourceClaimTemplate:
      name: glm53-flash-agg-gb200-agentic-compute-domain-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: glm53-flash-agg-gb200-agentic
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          tolerations:
            - key: kubernetes.io/arch
              operator: Equal
              value: arm64
              effect: NoSchedule
          containers:
            - name: main
              image: vllm/vllm-openai:glm53-flash
              imagePullPolicy: IfNotPresent
              env:
                - name: DYN_ROUTER_MODE
                  value: kv
              startupProbe:
                httpGet:
                  path: /health
                  port: 8000
                periodSeconds: 15
                failureThreshold: 200
              command:
                - /bin/bash
                - -c
              args:
                - |
                  pip install --no-cache-dir ai-dynamo==1.4.1
                  exec python3 -m dynamo.frontend \
                    --router-mode kv \
                    --http-host 0.0.0.0 \
                    --http-port 8000 \
                    --router-kv-events \
                    --kv-cache-block-size 16
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: false
                capabilities:
                  add: [IPC_LOCK]

    - name: VllmWorker
      type: worker
      replicas: 1
      podTemplate:
        metadata:
          annotations:
            nvidia.com/vllm-distributed-executor-backend: mp
        spec:
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-GB200
          tolerations:
            - key: kubernetes.io/arch
              operator: Equal
              value: arm64
              effect: NoSchedule
          resourceClaims:
            - name: compute-domain-channel
              resourceClaimTemplateName: glm53-flash-agg-gb200-agentic-compute-domain-channel
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 200Gi
          containers:
            - name: main
              image: vllm/vllm-openai:glm53-flash
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                - name: dshm
                  mountPath: /dev/shm
              env:
                - name: VLLM_WORKER_MULTIPROC_METHOD
                  value: spawn
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: "14400"
                - name: VLLM_USE_RUST_FRONTEND
                  value: "1"
                - name: VLLM_SERVER_DEV_MODE
                  value: "1"
                - name: FLASHINFER_DISABLE_VERSION_CHECK
                  value: "1"
                # GLM-5.3-Flash uses GLA/KDA attention; deep_gemm expert sharding not applicable.
                - name: VLLM_USE_DEEP_GEMM
                  value: "0"
                - name: VLLM_DEEP_GEMM_WARMUP
                  value: skip
                - name: TORCHINDUCTOR_ENABLE_PDL
                  value: "1"
                - name: PYTORCH_ALLOC_CONF
                  value: "expandable_segments:True"
                - name: VLLM_ALLREDUCE_USE_FLASHINFER
                  value: "1"
                - name: VLLM_FLASHINFER_ALLREDUCE_BACKEND
                  value: mnnvl
                - name: NCCL_MNNVL_ENABLE
                  value: "1"
                - name: NCCL_CUMEM_ENABLE
                  value: "1"
                - name: MC_FORCE_MNNVL
                  value: "1"
                - name: NCCL_NVLS_ENABLE
                  value: "1"
                - name: NCCL_P2P_LEVEL
                  value: NVL
                - name: NCCL_SOCKET_IFNAME
                  value: eth0
                - name: GLOO_SOCKET_IFNAME
                  value: eth0
                - name: NCCL_DEBUG
                  value: WARN
                - name: VLLM_USE_NCCL_SYMM_MEM
                  value: "0"
                - name: UCX_TLS
                  value: cuda_copy,cuda_ipc,tcp
                - name: UCX_CUDA_IPC_ENABLE_MNNVL
                  value: "y"
                - name: UCX_MEMTYPE_CACHE
                  value: "n"
                - name: TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC
                  value: "86400"
                - name: DYN_REQUEST_PLANE
                  value: tcp
                - name: ETCD_LEASE_TTL
                  value: "120"
              startupProbe:
                httpGet:
                  path: /health
                  port: 9090
                periodSeconds: 15
                failureThreshold: 200
              command:
                - /bin/bash
                - -c
              args:
                - |
                  pip install --no-cache-dir ai-dynamo==1.4.1

                  # WAR: disable cudnn globally to prevent segfault in GLM _kpool_* kernels during MM profiling.
                  mkdir -p /opt/glm53-workarounds
                  printf 'import torch\ntorch.backends.cudnn.enabled = False\n' \
                    > /opt/glm53-workarounds/sitecustomize.py
                  export PYTHONPATH="/opt/glm53-workarounds${PYTHONPATH:+:$PYTHONPATH}"

                  exec python3 -m dynamo.vllm \
                    --model zai-org/GLM-5.3-Flash \
                    --served-model-name zai-org/GLM-5.3-Flash \
                    --trust-remote-code \
                    --tensor-parallel-size 4 \
                    --max-num-seqs 256 \
                    --max-num-batched-tokens 8192 \
                    --gpu-memory-utilization 0.92 \
                    --enable-prefix-caching \
                    --dyn-tool-call-parser glm47 \
                    --dyn-reasoning-parser glm45 \
                    --reasoning-parser glm45 \
                    --enable-multimodal \
                    --limit-mm-per-prompt '{"image":1,"video":0}' \
                    --mm-encoder-tp-mode data \
                    --no-disable-hybrid-kv-cache-manager \
                    --compilation-config '{"cudagraph_mm_encoder":true}' \
                    --kv-events-config '{"enable_kv_cache_events":true,"publisher":"zmq"}'
              resources:
                claims:
                  - name: compute-domain-channel
                limits:
                  nvidia.com/gpu: "4"
                requests:
                  nvidia.com/gpu: "4"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: false
                capabilities:
                  add: [IPC_LOCK, SYS_RESOURCE]
