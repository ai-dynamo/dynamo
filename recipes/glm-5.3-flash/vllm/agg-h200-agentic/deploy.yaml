# For performance testing, use the following speculative config:
# --speculative-config '{"method":"mtp","num_speculative_tokens":7, "rejection_sample_method":"synthetic", "synthetic_acceptance_length":3.9764}'

apiVersion: v1
kind: ConfigMap
metadata:
  name: glm53-agg-workarounds
  namespace: shreyasm-kimi-k3
data:
  sitecustomize.py: |
    import torch

    # Work around the native cuDNN Conv2d crash observed with the
    # vllm/vllm-openai:glm53-flash image on GB200.
    torch.backends.cudnn.enabled = False
    print(
        "GLM 5.3 workaround: torch.backends.cudnn.enabled=False",
        flush=True,
    )
---
apiVersion: v1
kind: Pod
metadata:
  name: glm53-flash-agg
  namespace: shreyasm-kimi-k3
  labels:
    app: glm53-flash-agg
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/arch: amd64
    nvidia.com/gpu.product: NVIDIA-H200
  tolerations:
    - key: team
      operator: Equal
      value: kimi-k3
      effect: NoSchedule
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: dynamo-vllm
      image: vllm/vllm-openai:glm53-flash
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8000
        - name: system
          containerPort: 8081
      command:
        - /bin/bash
        - -lc
      args:
        - |
          set -euo pipefail
          ulimit -l unlimited || true

          echo "Installing ai-dynamo==1.4.1 into the GLM vLLM image"
          python3 -m pip install ai-dynamo==1.4.1

          # Python automatically imports sitecustomize.py from this directory.
          export PYTHONPATH="/opt/glm53-workarounds${PYTHONPATH:+:$PYTHONPATH}"

          python3 - <<'PY'
          import importlib.metadata as metadata
          import torch
          import vllm

          print("ai-dynamo", metadata.version("ai-dynamo"))
          print("vllm", vllm.__version__)
          print("torch", torch.__version__)
          print("cuDNN enabled", torch.backends.cudnn.enabled)
          print("cuDNN version", torch.backends.cudnn.version())
          PY

          model_path=""
          for cache_root in \
            /model-cache/models--zai-org--GLM-5.3-Flash/snapshots \
            /model-cache/hub/models--zai-org--GLM-5.3-Flash/snapshots \
            /model-cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots
          do
            [ -d "$cache_root" ] || continue
            for cache_snapshot in "$cache_root"/*
            do
              if [ -e "$cache_snapshot/config.json" ] && \
                 [ -e "$cache_snapshot/tokenizer_config.json" ]
              then
                model_path="$cache_snapshot"
                break 2
              fi
            done
          done

          if [ -z "$model_path" ]
          then
            echo "Cached zai-org/GLM-5.3-Flash snapshot not found"
            exit 42
          fi

          echo "Starting Dynamo frontend"
          python3 -m dynamo.frontend \
            --discovery-backend file \
            --http-port 8000 \
            --dyn-chat-processor dynamo &

          echo "Starting Dynamo vLLM TP8 worker with $model_path"
          exec python3 -m dynamo.vllm \
            --model "$model_path" \
            --served-model-name zai-org/GLM-5.3-Flash \
            --discovery-backend file \
            --distributed-executor-backend mp \
            --load-format fastsafetensors \
            --safetensors-load-strategy lazy \
            --kv-events-config '{"enable_kv_cache_events":false}' \
            --tensor-parallel-size 8 \
            --enable-multimodal \
            --enable-prefix-caching \
            --prefix-match-unit 128 \
            --limit-mm-per-prompt '{"image":1}' \
            --mm-encoder-tp-mode data \
            --no-enable-flashinfer-autotune \
            --skip-mm-profiling \
            --moe-backend deep_gemm \
            --attention-backend FLASHMLA_SPARSE \
            --max-num-seqs 32 \
            --max-num-batched-tokens 8192 \
            --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE", "max_cudagraph_capture_size": 8192, "cudagraph_capture_sizes": [1, 2, 4, 8, 12, 16, 20, 24, 32, 48, 64, 96, 128, 192, 256, 512, 1024, 1536, 2048, 2560, 3072, 4096, 6144, 8192]}' \
            --gpu-memory-utilization 0.80 \
            --dyn-tool-call-parser glm47 \
            --dyn-reasoning-parser glm45 \
            --speculative-config '{"method":"mtp","num_speculative_tokens":7}'
      env:
        - name: HF_HOME
          value: /model-cache
        - name: HF_HUB_CACHE
          value: /model-cache/hub
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        - name: VLLM_ENGINE_READY_TIMEOUT_S
          value: "3600"
        - name: VLLM_USE_NCCL_SYMM_MEM
          value: "0"
        - name: VLLM_ALLREDUCE_USE_SYMM_MEM
          value: "0"
        - name: VLLM_SKIP_P2P_CHECK
          value: "1"
        - name: DYN_SYSTEM_PORT
          value: "8081"
        - name: PYTHONUNBUFFERED
          value: "1"
      resources:
        requests:
          cpu: "64"
          memory: 700Gi
          nvidia.com/gpu: "8"
        limits:
          cpu: "120"
          memory: 900Gi
          nvidia.com/gpu: "8"
      securityContext:
        capabilities:
          add:
            - IPC_LOCK
            - SYS_RESOURCE
      volumeMounts:
        - name: pytorch-workarounds
          mountPath: /opt/glm53-workarounds
          readOnly: true
        - name: shared-model-cache
          mountPath: /model-cache
        - name: vllm-cache
          mountPath: /vllm-cache
        - name: pip-cache
          mountPath: /root/.cache/pip
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: pytorch-workarounds
      configMap:
        name: glm53-agg-workarounds
    - name: shared-model-cache
      persistentVolumeClaim:
        claimName: model-cache
    - name: vllm-cache
      emptyDir: {}
    - name: pip-cache
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 128Gi
---
apiVersion: v1
kind: Service
metadata:
  name: glm53-flash-agg
  namespace: shreyasm-kimi-k3
spec:
  selector:
    app: glm53-flash-agg
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: system
      port: 8081
      targetPort: system
