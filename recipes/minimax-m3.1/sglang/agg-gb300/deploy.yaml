# MiniMax-M3.1-Flash on SGLang, aggregated serving on GB300.
# Topology: one TP4 + EP4 worker on a single GB300 node, with KV-aware routing.
# Profile: 1M-token context, up to 256 concurrent requests, FP8 KV cache and prefix caching.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: minimax-m3-1-sglang-agg-gb300
  labels:
    app.kubernetes.io/name: minimax-m3-1-sglang-agg-gb300
    app.kubernetes.io/part-of: dynamo
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      runtimeVersionOverride: "1.6.0"
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-minimax-m3.1-flash-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.frontend
                - --router-mode
                - kv
                - --router-kv-events
                - --http-host
                - 0.0.0.0
                - --http-port
                - "8000"
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              resources:
                requests:
                  cpu: "2"
                  memory: 8Gi
                limits:
                  cpu: "8"
                  memory: 24Gi

    - name: Worker
      type: worker
      runtimeVersionOverride: "1.6.0"
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-minimax-m3.1-flash-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.sglang
                - --model-path
                - $(MODEL_PATH)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --trust-remote-code
                - --enable-multimodal
                - --tp
                - "4"
                - --ep
                - "4"
                - --context-length
                - "1048576"
                # Per-rank prefill chunks must stay within the MegaMoE token
                # cap set by SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK.
                - --chunked-prefill-size
                - "16384"
                - --max-prefill-tokens
                - "16384"
                - --max-running-requests
                - "256"
                - --mem-fraction-static
                - "0.90"
                - --kv-cache-dtype
                - fp8_e4m3
                # The NVFP4 experts require MegaMoE without shared-expert fusion.
                - --moe-a2a-backend
                - megamoe
                - --disable-shared-experts-fusion
                - --fp8-gemm-backend
                - flashinfer_cutedsl
                - --reasoning-parser
                - minimax-m3
                - --dyn-reasoning-parser
                - minimax_m3
                - --dyn-tool-call-parser
                - minimax_m3
                - --enable-metrics
                - --kv-events-config
                - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5571"}'
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              env:
                - name: MODEL_PATH
                  value: /shared-model-cache/MiniMax-M3.1-Flash
                - name: SERVED_MODEL_NAME
                  value: minimax-m3.1
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                - name: SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK
                  value: "16384"
              resources:
                requests:
                  cpu: "16"
                  memory: 128Gi
                  nvidia.com/gpu: "4"
                limits:
                  cpu: "32"
                  memory: 256Gi
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
