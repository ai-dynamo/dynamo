# Downloads MiniMaxAI/MiniMax-M3.1-Flash from Hugging Face into
# /shared-model-cache/MiniMax-M3.1-Flash, the path every deployment profile
# serves from.
apiVersion: batch/v1
kind: Job
metadata:
  name: minimax-m3-1-model-download
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: minimax-m3-1-model-download
    spec:
      restartPolicy: Never
      containers:
        - name: model-download
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command: ["sh", "-c"]
          envFrom:
            - secretRef:
                name: hf-token-secret
          env:
            - name: HF_MODEL
              value: MiniMaxAI/MiniMax-M3.1-Flash
            - name: HF_REVISION
              value: 9e7ebacac350497ad4a1272a2e817639bf11561c
            - name: MODEL_DIR
              value: /shared-model-cache/MiniMax-M3.1-Flash
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          args:
            - |
              set -eu
              pip install --no-cache-dir huggingface_hub==1.16.4
              hf download "$HF_MODEL" --revision "$HF_REVISION" --local-dir "$MODEL_DIR"
              python3 - <<'PY'
              import json
              import os
              import pathlib
              import sys

              model_dir = pathlib.Path(os.environ["MODEL_DIR"])
              index = json.loads((model_dir / "model.safetensors.index.json").read_text())
              shards = set(index["weight_map"].values())
              missing = sorted(s for s in shards if not (model_dir / s).is_file())
              if missing:
                  sys.exit(f"missing shards: {missing}")
              print(f"verified {len(shards)} indexed shards in {model_dir}")
              PY
          volumeMounts:
            - name: shared-model-cache
              mountPath: /shared-model-cache
      volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
