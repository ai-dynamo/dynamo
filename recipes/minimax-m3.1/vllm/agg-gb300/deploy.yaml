# MiniMax-M3.1-Flash on vLLM, aggregated serving on GB300.
# Topology: one TP4 + EP worker on a single GB300 node, with KV-aware routing.
# Profile: 1M-token context, up to 256 concurrent sequences, FP8 KV cache and prefix caching.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: minimax-m3-1-vllm-agg-gb300
  labels:
    app.kubernetes.io/name: minimax-m3-1-vllm-agg-gb300
    app.kubernetes.io/part-of: dynamo
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      runtimeVersionOverride: "1.6.0"
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-minimax-m3.1-flash-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.frontend
                - --router-mode
                - kv
                - --router-kv-events
                - --http-host
                - 0.0.0.0
                - --http-port
                - "8000"
                - --kv-cache-block-size
                - "128"
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              resources:
                requests:
                  cpu: "2"
                  memory: 8Gi
                limits:
                  cpu: "8"
                  memory: 24Gi

    - name: Worker
      type: worker
      runtimeVersionOverride: "1.6.0"
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-minimax-m3.1-flash-dev.1
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.vllm
                - --model
                - $(MODEL_PATH)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --trust-remote-code
                - --enable-multimodal
                - --tensor-parallel-size
                - "4"
                - --enable-expert-parallel
                - --block-size
                - "128"
                - --gpu-memory-utilization
                - "0.9"
                - --max-model-len
                - "1048576"
                - --max-num-seqs
                - "256"
                - --max-num-batched-tokens
                - "16384"
                - --enable-prefix-caching
                - --kv-cache-dtype
                - fp8
                - --kv-events-config
                - '{"enable_kv_cache_events":true,"publisher":"zmq"}'
                - --reasoning-parser
                - minimax_m3
                - --dyn-reasoning-parser
                - minimax_m3
                - --dyn-tool-call-parser
                - minimax_m3
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              env:
                - name: MODEL_PATH
                  value: /shared-model-cache/MiniMax-M3.1-Flash
                - name: SERVED_MODEL_NAME
                  value: minimax-m3.1
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              resources:
                requests:
                  cpu: "16"
                  memory: 128Gi
                  nvidia.com/gpu: "4"
                limits:
                  cpu: "32"
                  memory: 256Gi
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
