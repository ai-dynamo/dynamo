apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sgl-dsr1-8gpu
spec:
  env:
  - name: HF_HOME
    value: /opt/model
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
          volumeMounts:
          - name: model-cache
            mountPath: /opt/model
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
  - name: decode
    type: decode
    replicas: 1
    sharedMemorySize: 80Gi
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
          command:
          - python3
          - -m
          - dynamo.sglang
          args:
          - --model-path
          - deepseek-ai/DeepSeek-R1
          - --served-model-name
          - deepseek-ai/DeepSeek-R1
          - --tp
          - "8"
          - --dp
          - "8"
          - --enable-dp-attention
          - --ep-size
          - "8"
          - --trust-remote-code
          - --disaggregation-mode
          - decode
          - --disaggregation-bootstrap-port
          - "30001"
          - --mem-fraction-static
          - "0.75"
          - --host
          - 0.0.0.0
          - --prefill-round-robin-balance
          - --watchdog-timeout
          - "3600"
          workingDir: /workspace
          resources:
            limits:
              nvidia.com/gpu: "8"
          volumeMounts:
          - name: model-cache
            mountPath: /opt/model
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
  - name: prefill
    type: prefill
    replicas: 1
    sharedMemorySize: 80Gi
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
          command:
          - python3
          - -m
          - dynamo.sglang
          args:
          - --model-path
          - deepseek-ai/DeepSeek-R1
          - --served-model-name
          - deepseek-ai/DeepSeek-R1
          - --tp
          - "8"
          - --ep-size
          - "8"
          - --trust-remote-code
          - --disaggregation-mode
          - prefill
          - --disaggregation-bootstrap-port
          - "30001"
          - --mem-fraction-static
          - "0.75"
          - --host
          - 0.0.0.0
          - --load-balance-method
          - round_robin
          - --watchdog-timeout
          - "3600"
          workingDir: /workspace
          resources:
            limits:
              nvidia.com/gpu: "8"
          volumeMounts:
          - name: model-cache
            mountPath: /opt/model
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
