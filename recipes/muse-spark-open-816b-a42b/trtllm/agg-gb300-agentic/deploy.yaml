# Muse-Spark-open-816B-A42B NVFP4 aggregate serving on one GB300 node with TP4 and EP4.
apiVersion: v1
kind: ConfigMap
metadata:
  name: muse-spark-trtllm-aggregate-gb300-config
data:
  agg.yaml: |
    backend: pytorch
    trust_remote_code: true
    tensor_parallel_size: 4
    moe_expert_parallel_size: 4
    moe_tensor_parallel_size: 1
    enable_attention_dp: false
    max_batch_size: 64
    max_num_tokens: 32768
    max_seq_len: 1048576
    enable_chunked_prefill: true
    stream_interval: 10
    guided_decoding_backend: xgrammar
    kv_cache_config:
      dtype: fp8
      enable_block_reuse: true
      free_gpu_memory_fraction: 0.75
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 64
    moe_config:
      backend: TRTLLM
      use_low_precision_moe_combine: true
    nvfp4_gemm_config:
      allowed_backends: [cutlass, cublaslt, cuda_core]
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: muse-spark-trtllm-aggregate-gb300
  labels:
    app.kubernetes.io/name: muse-spark-trtllm-aggregate-gb300
    app.kubernetes.io/part-of: dynamo
spec:
  backendFramework: trtllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      runtimeVersionOverride: 1.5.0
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.6.0-muse-spark-open-dev.1@sha256:af77713116acf4bbd06a0d21c0b80dbd36634718bb0e584026e257e53739a328
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.frontend
                - --router-mode
                - round-robin
                - --http-port
                - "8000"
                - --model-name
                - Muse-Spark-open-816B-A42B
                - --model-path
                - /model
                - --trust-remote-code
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              volumeMounts:
                - name: model
                  mountPath: /model
                  readOnly: true
          volumes:
            - name: model
              persistentVolumeClaim:
                claimName: shared-model-cache
    - name: TrtllmWorker
      type: worker
      replicas: 1
      runtimeVersionOverride: 1.5.0
      sharedMemorySize: 128Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.6.0-muse-spark-open-dev.1@sha256:af77713116acf4bbd06a0d21c0b80dbd36634718bb0e584026e257e53739a328
              imagePullPolicy: IfNotPresent
              workingDir: /workspace
              command: [python3]
              args:
                - -m
                - dynamo.trtllm
                - --model
                - /model
                - --served-model-name
                - meta-models/Muse-Spark-Open-816B-A42B-NVFP4
                - --tensor-parallel-size
                - "4"
                - --expert-parallel-size
                - "4"
                - --enable-multimodal
                - --max-batch-size
                - "64"
                - --max-num-tokens
                - "32768"
                - --max-seq-len
                - "1048576"
                - --extra-engine-args
                - /config/agg.yaml
                - --disaggregation-mode
                - agg
                - --dyn-tool-call-parser
                - muse_spark
                - --dyn-reasoning-parser
                - muse_spark
                - --custom-jinja-template
                - /model/chat_template.jinja
              env:
                - name: HF_HOME
                  value: /model
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: TRITON_CACHE_DIR
                  value: /tmp/.triton-cache
                - name: PYTHONHASHSEED
                  value: "0"
                - name: TLLM_LOG_LEVEL
                  value: INFO
                # Open MPI 5 singleton spawn truncates long Kubernetes hostnames.
                - name: PMIX_HOSTNAME
                  value: muse-trtllm-gb300
                - name: TRTLLM_ENABLE_PDL
                  value: "1"
                - name: TRTLLM_SKIP_KV_CACHE_ESTIMATION
                  value: "1"
                - name: TRTLLM_SERVER_DISABLE_GC
                  value: "1"
                - name: TRTLLM_WORKER_DISABLE_GC
                  value: "1"
                - name: NCCL_CUMEM_ENABLE
                  value: "1"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              resources:
                requests:
                  cpu: "64"
                  memory: 512Gi
                  nvidia.com/gpu: "4"
                limits:
                  cpu: "128"
                  memory: 850Gi
                  nvidia.com/gpu: "4"
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 30
                timeoutSeconds: 20
                failureThreshold: 120
              volumeMounts:
                - name: model
                  mountPath: /model
                  readOnly: true
                - name: trtllm-config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: model
              persistentVolumeClaim:
                claimName: shared-model-cache
            - name: trtllm-config
              configMap:
                name: muse-spark-trtllm-aggregate-gb300-config
