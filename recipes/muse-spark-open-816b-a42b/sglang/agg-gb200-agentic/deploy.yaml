# Checkpoint: HF-native config with model_type muse_spark.
# Serve the checkpoint chat_template.jinja without modification.
# Base deployment (nvidia.com/v1beta1). Configure scheduling, registry
# credentials, and network interfaces for your cluster before deployment.
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: muse-spark-sglang-aggregate-gb200-cd
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: muse-spark-sglang-aggregate-gb200-cd-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: muse-spark-sglang-aggregate-gb200
  labels:
    app.kubernetes.io/name: muse-spark-sglang-aggregate-gb200
    app.kubernetes.io/part-of: dynamo
spec:
  backendFramework: sglang
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    runtimeVersionOverride: 1.5.0
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-muse-spark-open-dev.1@sha256:300e34e80fa7d79bf49faf16a28c83d6c2639180423413c6795c7ec9d62ed827
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
          # Correctness-critical for the NVFP4 checkpoint: the fork sets it only for an explicit
          # --quantization modelopt_fp4; pinned here because quantization is auto-detected.
          - name: SGLANG_FLASHINFER_NVFP4_PER_TOKEN_ACTIVATION
            value: "1"
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_SGL_FRONTEND_DECODING
            value: 'true'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          command:
          - python3
          args:
          - -m
          - dynamo.frontend
  - name: Worker
    type: worker
    replicas: 1
    runtimeVersionOverride: 1.5.0
    sharedMemorySize: 128Gi
    podTemplate:
      spec:
        volumes:
        - name: model
          persistentVolumeClaim:
            claimName: shared-model-cache
        resourceClaims:
        - name: compute-domain-channel
          resourceClaimTemplateName: muse-spark-sglang-aggregate-gb200-cd-channel
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-muse-spark-open-dev.1@sha256:300e34e80fa7d79bf49faf16a28c83d6c2639180423413c6795c7ec9d62ed827
          imagePullPolicy: IfNotPresent
          command:
          - python3
          args:
          - -m
          - dynamo.sglang
          - --model-path
          - /model
          - --served-model-name
          - meta-models/Muse-Spark-Open-816B-A42B-NVFP4
          - --moe-runner-backend
          - flashinfer_trtllm
          - --chat-template
          - /model/chat_template.jinja
          - --custom-jinja-template
          - /model/chat_template.jinja
          - --dyn-reasoning-parser
          - muse_spark
          - --trust-remote-code
          - --mem-fraction-static
          - '0.90'
          - --context-length
          - '1048576'
          - --max-running-requests
          - '64'
          - --cuda-graph-max-bs-decode
          - '64'
          - --swa-full-tokens-ratio
          - '0.032'
          - --tp-size
          - '4'
          - --ep-size
          - '4'
          - --kv-cache-dtype
          - fp8_e4m3
          - --mm-preprocess-cache-size-mb
          - '0'
          - --mm-feature-transport
          - cpu
          env:
          # Correctness-critical for the NVFP4 checkpoint: the fork sets it only for an explicit
          # --quantization modelopt_fp4; pinned here because quantization is auto-detected.
          - name: SGLANG_FLASHINFER_NVFP4_PER_TOKEN_ACTIVATION
            value: "1"
          - name: TRITON_ALLOW_NON_CONSTEXPR_GLOBALS
            value: "1"
          - name: DYN_HEALTH_CHECK_ENABLED
            value: 'false'
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: DYN_SGL_FRONTEND_DECODING
            value: 'true'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: NCCL_MNNVL_ENABLE
            value: '1'
          - name: NCCL_CUMEM_ENABLE
            value: '1'
          - name: NCCL_NVLS_ENABLE
            value: '1'
          - name: NCCL_P2P_LEVEL
            value: NVL
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
              - SYS_PTRACE
          resources:
            requests:
              cpu: '64'
              memory: 512Gi
              nvidia.com/gpu: '4'
            limits:
              cpu: '128'
              memory: 850Gi
              nvidia.com/gpu: '4'
            claims:
            - name: compute-domain-channel
          volumeMounts:
          - name: model
            mountPath: /model
            readOnly: true
