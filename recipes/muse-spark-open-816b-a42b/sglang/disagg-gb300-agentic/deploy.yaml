---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: muse-spark-sglang-disagg-gb300-compute-domain
spec:
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: muse-spark-sglang-disagg-gb300-compute-domain-channel
  numNodes: 0
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: muse-spark-sglang-disagg-gb300
  labels:
    app.kubernetes.io/name: muse-spark-sglang-disagg-gb300
    app.kubernetes.io/part-of: dynamo
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      runtimeVersionOverride: 1.5.0
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-muse-spark-open-dev.1@sha256:300e34e80fa7d79bf49faf16a28c83d6c2639180423413c6795c7ec9d62ed827
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              command: [python3]
              args:
                - -m
                - dynamo.frontend
                - --http-port
                - "8000"
                - --model-name
                - Muse-Spark-open-816B-A42B
                - --trust-remote-code
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: DYN_SGL_FRONTEND_DECODING
                  value: "false"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"

    - name: PrefillWorker
      type: prefill
      replicas: 1
      runtimeVersionOverride: 1.5.0
      podTemplate:
        spec:
          resourceClaims:
            - name: compute-domain-channel
              resourceClaimTemplateName: muse-spark-sglang-disagg-gb300-compute-domain-channel
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-muse-spark-open-dev.1@sha256:300e34e80fa7d79bf49faf16a28c83d6c2639180423413c6795c7ec9d62ed827
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.sglang
                - --model-path
                - $(MODEL_NAME)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --tp-size
                - "4"
                - --ep-size
                - "4"
                - --moe-runner-backend
                - flashinfer_trtllm
                - --disable-flashinfer-autotune
                - --chunked-prefill-size
                - "8192"
                - --max-prefill-tokens
                - "8192"
                - --cuda-graph-max-bs-prefill
                - "8192"
                - --chat-template
                - /model/chat_template.jinja
                - --custom-jinja-template
                - /model/chat_template.jinja
                - --dyn-reasoning-parser
                - muse_spark
                - --trust-remote-code
                - --mem-fraction-static
                - "0.88"
                - --mm-preprocess-cache-size-mb
                - "0"
                - --mm-feature-transport
                - cpu
                - --host
                - 0.0.0.0
                - --disaggregation-mode
                - prefill
                - --disaggregation-transfer-backend
                - nixl
                - --disaggregation-bootstrap-port
                - "30001"
              env:
                - name: SGLANG_FLASHINFER_NVFP4_PER_TOKEN_ACTIVATION
                  value: "1"
                - name: TRITON_ALLOW_NON_CONSTEXPR_GLOBALS
                  value: "1"
                - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
                  value: UCX
                - name: MODEL_NAME
                  value: /model
                - name: SERVED_MODEL_NAME
                  value: meta-models/Muse-Spark-Open-816B-A42B-NVFP4
                - name: UCX_TLS
                  value: cuda_copy,cuda_ipc,tcp
                - name: UCX_MEMTYPE_CACHE
                  value: "n"
                - name: MC_FORCE_MNNVL
                  value: "1"
                - name: NCCL_MNNVL_ENABLE
                  value: "1"
                - name: NCCL_NVLS_ENABLE
                  value: "1"
                - name: NCCL_P2P_LEVEL
                  value: NVL
                - name: NCCL_CUMEM_ENABLE
                  value: "1"
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: DYN_SGL_FRONTEND_DECODING
                  value: "false"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              resources:
                requests:
                  cpu: "64"
                  memory: 512Gi
                  nvidia.com/gpu: "4"
                claims:
                  - name: compute-domain-channel
                limits:
                  cpu: "128"
                  memory: 850Gi
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /model
                  readOnly: true
      sharedMemorySize: 128Gi

    - name: DecodeWorker
      type: decode
      replicas: 1
      runtimeVersionOverride: 1.5.0
      podTemplate:
        spec:
          resourceClaims:
            - name: compute-domain-channel
              resourceClaimTemplateName: muse-spark-sglang-disagg-gb300-compute-domain-channel
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-muse-spark-open-dev.1@sha256:300e34e80fa7d79bf49faf16a28c83d6c2639180423413c6795c7ec9d62ed827
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.sglang
                - --model-path
                - $(MODEL_NAME)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --tp-size
                - "4"
                - --ep-size
                - "4"
                - --moe-runner-backend
                - flashinfer_trtllm
                - --disable-flashinfer-autotune
                - --chat-template
                - /model/chat_template.jinja
                - --custom-jinja-template
                - /model/chat_template.jinja
                - --dyn-reasoning-parser
                - muse_spark
                - --trust-remote-code
                - --mem-fraction-static
                - "0.88"
                - --mm-preprocess-cache-size-mb
                - "0"
                - --mm-feature-transport
                - cpu
                - --disaggregation-mode
                - decode
                - --disaggregation-transfer-backend
                - nixl
                - --disaggregation-bootstrap-port
                - "30001"
              env:
                - name: SGLANG_FLASHINFER_NVFP4_PER_TOKEN_ACTIVATION
                  value: "1"
                - name: TRITON_ALLOW_NON_CONSTEXPR_GLOBALS
                  value: "1"
                - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
                  value: UCX
                - name: MODEL_NAME
                  value: /model
                - name: SERVED_MODEL_NAME
                  value: meta-models/Muse-Spark-Open-816B-A42B-NVFP4
                - name: UCX_TLS
                  value: cuda_copy,cuda_ipc,tcp
                - name: UCX_MEMTYPE_CACHE
                  value: "n"
                - name: MC_FORCE_MNNVL
                  value: "1"
                - name: NCCL_MNNVL_ENABLE
                  value: "1"
                - name: NCCL_NVLS_ENABLE
                  value: "1"
                - name: NCCL_P2P_LEVEL
                  value: NVL
                - name: NCCL_CUMEM_ENABLE
                  value: "1"
                - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
                  value: "3600"
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: DYN_SGL_FRONTEND_DECODING
                  value: "false"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              resources:
                requests:
                  cpu: "64"
                  memory: 512Gi
                  nvidia.com/gpu: "4"
                claims:
                  - name: compute-domain-channel
                limits:
                  cpu: "128"
                  memory: 850Gi
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /model
                  readOnly: true
      sharedMemorySize: 128Gi
