---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: muse-spark-sglang-aggregate-gb300-kv
  labels:
    app.kubernetes.io/name: muse-spark-sglang-aggregate-gb300-kv
    app.kubernetes.io/part-of: dynamo
spec:
  backendFramework: sglang
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      runtimeVersionOverride: 1.5.0
      podTemplate:
        spec:
          volumes:
            - name: model
              persistentVolumeClaim:
                claimName: shared-model-cache
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-muse-spark-open-dev.1@sha256:300e34e80fa7d79bf49faf16a28c83d6c2639180423413c6795c7ec9d62ed827
              imagePullPolicy: Always
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              command: [python3]
              args:
                - -m
                - dynamo.frontend
                - --http-port
                - "8000"
                - --model-name
                - Muse-Spark-open-816B-A42B
                - --model-path
                - /model
                - --router-mode
                - kv
                - --router-kv-events
                - --kv-cache-block-size
                - "64"
                - --trust-remote-code
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: DYN_SGL_FRONTEND_DECODING
                  value: "true"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              volumeMounts:
                - name: model
                  mountPath: /model
                  readOnly: true

    - name: Worker
      type: worker
      replicas: 2
      runtimeVersionOverride: 1.5.0
      podTemplate:
        spec:
          volumes:
            - name: model
              persistentVolumeClaim:
                claimName: shared-model-cache
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 128Gi
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.0-muse-spark-open-dev.1@sha256:300e34e80fa7d79bf49faf16a28c83d6c2639180423413c6795c7ec9d62ed827
              imagePullPolicy: Always
              command: [python3]
              args:
                - -m
                - dynamo.sglang
                - --model-path
                - /model
                - --served-model-name
                - meta-models/Muse-Spark-Open-816B-A42B-NVFP4
                - --tp-size
                - "4"
                - --ep-size
                - "4"
                - --moe-runner-backend
                - flashinfer_trtllm
                - --chat-template
                - /model/chat_template.jinja
                - --custom-jinja-template
                - /model/chat_template.jinja
                - --dyn-reasoning-parser
                - muse_spark
                - --trust-remote-code
                - --mem-fraction-static
                - "0.90"
                - --kv-cache-dtype
                - fp8_e4m3
                - --mm-preprocess-cache-size-mb
                - "0"
                - --mm-feature-transport
                - cpu
                - --kv-events-config
                - '{"enable_kv_cache_events":true,"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: DYN_SGL_FRONTEND_DECODING
                  value: "true"
                - name: SGLANG_FLASHINFER_NVFP4_PER_TOKEN_ACTIVATION
                  value: "1"
                - name: TRITON_ALLOW_NON_CONSTEXPR_GLOBALS
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
                - name: NCCL_CUMEM_ENABLE
                  value: "1"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_RESOURCE]
              resources:
                requests:
                  cpu: "64"
                  memory: 512Gi
                  nvidia.com/gpu: "4"
                limits:
                  cpu: "128"
                  memory: 850Gi
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: model
                  mountPath: /model
                  readOnly: true
                - name: dshm
                  mountPath: /dev/shm
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 720
