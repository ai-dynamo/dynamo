apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-32b-fp8-vllm-disagg
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          env:
          - name: HF_HOME
            value: /opt/models
          volumeMounts:
          - name: model-cache
            mountPath: /opt/models
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
  - name: decode
    type: decode
    replicas: 1
    sharedMemorySize: 40Gi
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          command:
          - /bin/sh
          - -c
          args:
          - |
            ulimit -l unlimited && python3 -m dynamo.vllm \
              --model $MODEL_PATH \
              --served-model-name $SERVED_MODEL_NAME \
              --tensor-parallel-size 4 \
              --data-parallel-size 1 \
              --disaggregation-mode decode \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}' \
              --gpu-memory-utilization 0.90 \
              --max-model-len 8192 \
              --no-enable-prefix-caching \
              --block-size 128
          workingDir: /workspace/examples/backends/vllm
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          env:
          - name: SERVED_MODEL_NAME
            value: "Qwen/Qwen3-32B-FP8"
          - name: MODEL_PATH
            value: "Qwen/Qwen3-32B-FP8"
          - name: HF_HOME
            value: /opt/models
          - name: UCX_TLS
            value: "rc_x,rc,cuda_copy,cuda_ipc"
          - name: UCX_NET_DEVICES
            value: "mlx5_0:1"
          - name: UCX_IB_ADDR_TYPE
            value: "eth"
          - name: UCX_RNDV_SCHEME
            value: "get_zcopy"
          - name: UCX_RNDV_THRESH
            value: "0"
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            requests:
              nvidia.com/gpu: "4"
              rdma/ib: "2"
            limits:
              nvidia.com/gpu: "4"
              rdma/ib: "2"
          volumeMounts:
          - name: model-cache
            mountPath: /opt/models
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: nvidia.com/dynamo-component-type
                    operator: In
                    values:
                    - worker
                topologyKey: kubernetes.io/hostname
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
  - name: prefill
    type: prefill
    replicas: 2
    sharedMemorySize: 40Gi
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          command:
          - /bin/sh
          - -c
          args:
          - |
            ulimit -l unlimited && python3 -m dynamo.vllm \
              --model $MODEL_PATH \
              --served-model-name $SERVED_MODEL_NAME \
              --tensor-parallel-size 2 \
              --data-parallel-size 1 \
              --disaggregation-mode prefill \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}' \
              --gpu-memory-utilization 0.90 \
              --max-model-len 8192 \
              --no-enable-prefix-caching \
              --block-size 128
          workingDir: /workspace/examples/backends/vllm
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          env:
          - name: SERVED_MODEL_NAME
            value: "Qwen/Qwen3-32B-FP8"
          - name: MODEL_PATH
            value: "Qwen/Qwen3-32B-FP8"
          - name: HF_HOME
            value: /opt/models
          - name: UCX_TLS
            value: "rc_x,rc,cuda_copy,cuda_ipc"
          - name: UCX_NET_DEVICES
            value: "mlx5_0:1"
          - name: UCX_IB_ADDR_TYPE
            value: "eth"
          - name: UCX_RNDV_SCHEME
            value: "get_zcopy"
          - name: UCX_RNDV_THRESH
            value: "0"
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            requests:
              nvidia.com/gpu: "2"
              rdma/ib: "2"
            limits:
              nvidia.com/gpu: "2"
              rdma/ib: "2"
          volumeMounts:
          - name: model-cache
            mountPath: /opt/models
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: nvidia.com/dynamo-component-type
                    operator: In
                    values:
                    - worker
                topologyKey: kubernetes.io/hostname
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
