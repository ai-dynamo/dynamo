#
# Qwen3.8-27B (bf16) on the Dynamo vLLM sidecar, aggregated, 8 x GB200 (one GPU per worker).
# Workload: computer-use agent sessions (Hcompany/h_cua_perf), one screenshot per request.
# The frontend uses the multimodal-aware KV router with the two-tier worker-selection policy.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen38-27b-router-policy
data:
  worker-selection.yaml: |
    worker_selection:
      aggregated: dynamo-two-tier-cost-fn
      instances:
        - name: dynamo-two-tier-cost-fn
          type: dynamo-two-tier-cost-fn
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen38-27b-vllm-sidecar-agg
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              # Nightly until Dynamo 1.7.0 ships: 1.6.1 has no engine reasoning gate (the vllm-rs flag below).
              image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend-nightly:20261107-403ead2
              imagePullPolicy: IfNotPresent
              command: [python3]
              args:
                - -m
                - dynamo.frontend
                - --router-mode
                - kv
                - --router-policy-config
                - /etc/dynamo/router/worker-selection.yaml
              env:
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              volumeMounts:
                - name: router-policy
                  mountPath: /etc/dynamo/router
                  readOnly: true
          volumes:
            - name: router-policy
              configMap:
                name: qwen38-27b-router-policy
    - name: Worker
      type: worker
      replicas: 8
      podTemplate:
        spec:
          initContainers:
            - name: runtime
              image: nvcr.io/nvidia/ai-dynamo/dynamo-sidecar-nightly:20261107-403ead2
              imagePullPolicy: IfNotPresent
              restartPolicy: Always
              command: [dynamo-vllm-sidecar]
              args:
                - --grpc-endpoint
                - 127.0.0.1:30001
                - --dyn-tool-call-parser
                - qwen3_coder
                - --dyn-reasoning-parser
                - qwen3
              env:
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_HUB_CACHE
                  value: /shared-model-cache/hub
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              # The sidecar reads the model config to find the image token. Without it,
              # routing silently falls back to the text before the first image.
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                  readOnly: true
          containers:
            - name: main
              image: vllm/vllm-openai:v0.33.0
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                capabilities:
                  add: [IPC_LOCK, SYS_PTRACE, SYS_RESOURCE]
              command: [vllm-rs]
              # The engine reasoning parser matches --dyn-reasoning-parser, so tool and JSON grammars start
              # after reasoning. Dynamo sends the per-request reasoning gate (vllm-proto 0.6 and later).
              args:
                - serve
                - $(MODEL_NAME)
                - --served-model-name
                - $(SERVED_MODEL_NAME)
                - --host
                - 0.0.0.0
                - --grpc-port
                - "30001"
                - --max-model-len
                - "262144"
                - --limit-mm-per-prompt
                - '{"video":0}'
                - --tool-call-parser
                - none
                - --reasoning-parser
                - qwen3
                - --
                - --dtype
                - bfloat16
                - --no-mm-device-do-normalize
                - --no-enforce-eager
                - --max-num-seqs
                - "128"
                - --max-num-batched-tokens
                - "16384"
                - --enable-prefix-caching
                - --gpu-memory-utilization
                - "0.90"
                - --kv-events-config
                - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
              env:
                - name: MODEL_NAME
                  value: Qwen/Qwen3.8-27B
                - name: SERVED_MODEL_NAME
                  value: Qwen/Qwen3.8-27B
                - name: HF_HOME
                  value: /shared-model-cache
                - name: HF_HUB_CACHE
                  value: /shared-model-cache/hub
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: TRANSFORMERS_OFFLINE
                  value: "1"
              startupProbe:
                grpc:
                  port: 30001
                  service: ""
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 180
              readinessProbe:
                grpc:
                  port: 30001
                  service: ""
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 3
              livenessProbe:
                grpc:
                  port: 30001
                  service: ""
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 6
              resources:
                requests:
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /shared-model-cache
                  readOnly: true
          volumes:
            - name: shared-model-cache
              persistentVolumeClaim:
                claimName: shared-model-cache
