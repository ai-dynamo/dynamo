# DeepSeek-V4.1-Flash-1017 on H200: disaggregated 3 prefill workers (TP4) + 2 decode workers (DEP4), 20 GPUs,
# DSpark (5 draft tokens, same config on both roles), AgentX trace replay.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv41-flash-h200-disagg
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    runtimeVersionOverride: 1.7.0
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime-nightly:20261107-403ead2@sha256:d4720315eb5ad855d015b4da1f4b55bdaa26b065bc729e2de788829494ee3ee8
          imagePullPolicy: IfNotPresent
          command:
          - python3
          args:
          - -m
          - dynamo.frontend
          - --http-host
          - 0.0.0.0
          - --http-port
          - '8000'
          - --router-mode
          - kv
          - --router-session-affinity-ttl-secs
          - '14400'
          - --router-session-affinity-mode
          - soft
          - --active-decode-blocks-threshold
          - None
          - --active-prefill-tokens-threshold
          - None
          - --active-prefill-tokens-threshold-frac
          - None
          - --no-kv-events
          env:
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: DYN_ROUTER_TEMPERATURE
            value: '0'
          - name: DYN_ROUTER_QUEUE_THRESHOLD
            value: None
          - name: DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS
            value: '3600'
          - name: DYN_ROUTER_DECODE_ACTIVE_REQUEST_WEIGHT
            value: '10000000'
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 240
          resources:
            requests:
              cpu: '4'
              memory: 8Gi
            limits:
              cpu: '16'
              memory: 32Gi
  - name: PrefillWorker
    type: prefill
    runtimeVersionOverride: 1.7.0
    replicas: 3
    sharedMemorySize: 64Gi
    podTemplate:
      metadata:
        annotations:
          nvidia.com/vllm-distributed-executor-backend: mp
      spec:
        terminationGracePeriodSeconds: 60
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime-nightly:20261107-403ead2@sha256:d4720315eb5ad855d015b4da1f4b55bdaa26b065bc729e2de788829494ee3ee8
          imagePullPolicy: IfNotPresent
          command:
          - python3
          args:
          - -m
          - dynamo.vllm
          - --disaggregation-mode
          - prefill
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_load_failure_policy":"fail"}'
          - --model
          - deepseek-ai/DeepSeek-V4.1-Flash-1017
          - --revision
          - 1bae0e1088993b9b82de08f59de5be5a34e42170
          - --tokenizer-revision
          - 1bae0e1088993b9b82de08f59de5be5a34e42170
          - --served-model-name
          - deepseek-ai/DeepSeek-V4.1-Flash-1017
          - --tokenizer-mode
          - deepseek_v41
          - --tensor-parallel-size
          - '4'
          - --max-model-len
          - '1048576'
          - --reasoning-parser
          - deepseek_v41
          - --dyn-reasoning-parser
          - deepseek_v41
          - --dyn-tool-call-parser
          - deepseek_v41
          - --distributed-executor-backend
          - mp
          - --max-num-seqs
          - '96'
          - --enable-multimodal
          - --speculative-config
          - '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":true,"revision":"1bae0e1088993b9b82de08f59de5be5a34e42170"}'
          env:
          - name: HF_HOME
            value: /model-cache
          - name: HF_HUB_CACHE
            value: /model-cache/hub
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '3600'
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: DYN_HEALTH_CHECK_ENABLED
            value: 'false'
          - name: PYTHONUNBUFFERED
            value: '1'
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 720
          resources:
            requests:
              cpu: '32'
              memory: 400Gi
              nvidia.com/gpu: '4'
            limits:
              cpu: '64'
              memory: 600Gi
              nvidia.com/gpu: '4'
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
          volumeMounts:
          - name: model-cache
            mountPath: /model-cache
            readOnly: true
          - name: model-cache
            mountPath: /root/.cache/vllm
            subPath: vllmcache-disagg-prefill
          - name: pip-cache
            mountPath: /root/.cache/pip
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        - name: pip-cache
          emptyDir: {}
  - name: DecodeWorker
    type: decode
    runtimeVersionOverride: 1.7.0
    replicas: 2
    sharedMemorySize: 64Gi
    podTemplate:
      metadata:
        annotations:
          nvidia.com/vllm-distributed-executor-backend: mp
      spec:
        terminationGracePeriodSeconds: 60
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime-nightly:20261107-403ead2@sha256:d4720315eb5ad855d015b4da1f4b55bdaa26b065bc729e2de788829494ee3ee8
          imagePullPolicy: IfNotPresent
          command:
          - python3
          args:
          - -m
          - dynamo.vllm
          - --disaggregation-mode
          - decode
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail"}'
          - --model
          - deepseek-ai/DeepSeek-V4.1-Flash-1017
          - --revision
          - 1bae0e1088993b9b82de08f59de5be5a34e42170
          - --tokenizer-revision
          - 1bae0e1088993b9b82de08f59de5be5a34e42170
          - --served-model-name
          - deepseek-ai/DeepSeek-V4.1-Flash-1017
          - --tokenizer-mode
          - deepseek_v41
          - --tensor-parallel-size
          - '1'
          - --data-parallel-size
          - '4'
          - --data-parallel-size-local
          - '4'
          - --data-parallel-rpc-port
          - '13345'
          - --data-parallel-address
          - $(POD_IP)
          - --enable-expert-parallel
          - --max-model-len
          - '1048576'
          - --reasoning-parser
          - deepseek_v41
          - --dyn-reasoning-parser
          - deepseek_v41
          - --dyn-tool-call-parser
          - deepseek_v41
          - --distributed-executor-backend
          - mp
          - --max-num-seqs
          - '96'
          - --enable-multimodal
          - --speculative-config
          - '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":true,"revision":"1bae0e1088993b9b82de08f59de5be5a34e42170"}'
          - --compilation-config
          - '{"cudagraph_mode":"FULL_DECODE_ONLY","max_cudagraph_capture_size":1024}'
          env:
          - name: HF_HOME
            value: /model-cache
          - name: HF_HUB_CACHE
            value: /model-cache/hub
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '3600'
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: DYN_HEALTH_CHECK_ENABLED
            value: 'false'
          - name: PYTHONUNBUFFERED
            value: '1'
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 720
          resources:
            requests:
              cpu: '32'
              memory: 400Gi
              nvidia.com/gpu: '4'
            limits:
              cpu: '64'
              memory: 600Gi
              nvidia.com/gpu: '4'
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
          volumeMounts:
          - name: model-cache
            mountPath: /model-cache
            readOnly: true
          - name: model-cache
            mountPath: /root/.cache/vllm
            subPath: vllmcache-disagg-decode
          - name: pip-cache
            mountPath: /root/.cache/pip
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        - name: pip-cache
          emptyDir: {}
