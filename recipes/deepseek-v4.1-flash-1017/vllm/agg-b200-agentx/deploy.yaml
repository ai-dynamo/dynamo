# DeepSeek-V4.1-Flash-1017 on B200: aggregated DEP4 + FlashMLA MEGA attention + 128 GiB/rank host KV tier, DSpark (5 draft tokens), AgentX trace replay.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv41-flash-b200-agg
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    runtimeVersionOverride: 1.7.0
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime-nightly:20261107-403ead2@sha256:d4720315eb5ad855d015b4da1f4b55bdaa26b065bc729e2de788829494ee3ee8
          imagePullPolicy: IfNotPresent
          command:
          - python3
          args:
          - -m
          - dynamo.frontend
          - --http-host
          - 0.0.0.0
          - --http-port
          - '8000'
          - --router-mode
          - kv
          - --router-kv-events
          - --router-session-affinity-ttl-secs
          - '14400'
          - --router-session-affinity-mode
          - soft
          - --active-decode-blocks-threshold
          - None
          - --active-prefill-tokens-threshold
          - None
          - --active-prefill-tokens-threshold-frac
          - None
          env:
          # KV-aware routing with session affinity: a session keeps hitting the worker that holds its prefix cache.
          # Workers publish KV events (--kv-events-config); scale out by raising the worker replicas.
          - name: DYN_ROUTER_TEMPERATURE
            value: '0'
          - name: DYN_ROUTER_QUEUE_THRESHOLD
            value: 'None'
          - name: DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS
            value: '3600'
          - name: DYN_ROUTER_DECODE_ACTIVE_REQUEST_WEIGHT
            value: '10000000'
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 240
          resources:
            requests:
              cpu: '4'
              memory: 8Gi
            limits:
              cpu: '16'
              memory: 32Gi
  - name: worker
    type: worker
    runtimeVersionOverride: 1.7.0
    replicas: 1
    sharedMemorySize: 64Gi
    podTemplate:
      metadata:
        annotations:
          nvidia.com/vllm-distributed-executor-backend: mp
      spec:
        terminationGracePeriodSeconds: 60
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime-nightly:20261107-403ead2@sha256:d4720315eb5ad855d015b4da1f4b55bdaa26b065bc729e2de788829494ee3ee8
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 720
          command:
          - python3
          args:
          - -m
          - dynamo.vllm
          - --model
          - deepseek-ai/DeepSeek-V4.1-Flash-1017
          - --revision
          - 1bae0e1088993b9b82de08f59de5be5a34e42170
          - --tokenizer-revision
          - 1bae0e1088993b9b82de08f59de5be5a34e42170
          - --served-model-name
          - deepseek-ai/DeepSeek-V4.1-Flash-1017
          - --tokenizer-mode
          - deepseek_v41
          # DEP4: one engine per GPU (data parallel 4) with the experts spread across
          # them. Each rank holds only its own requests' KV, so the prefix cache is
          # about 4x larger than under TP4.
          - --tensor-parallel-size
          - '1'
          - --data-parallel-size
          - '4'
          - --data-parallel-size-local
          - '4'
          - --data-parallel-rpc-port
          - '13345'
          - --data-parallel-address
          - $(POD_IP)
          - --enable-expert-parallel
          - --max-model-len
          - '1048576'
          - --reasoning-parser
          - deepseek_v41
          - --dyn-reasoning-parser
          - deepseek_v41
          - --dyn-tool-call-parser
          - deepseek_v41
          - --distributed-executor-backend
          - mp
          # Per DP rank: 4 x 64 = 256 sequences per worker.
          - --max-num-seqs
          - '64'
          - --enable-multimodal
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557","enable_kv_cache_events":true}'
          - --attention-config
          - '{"backend":"FLASHMLA_MEGA_ATTN_DSV41","indexer_kv_dtype":"mxfp4","indexer_sparse_logits":true}'
          - --kv-cache-dtype
          - fp8
          # 128 GiB/rank host KV tier: avoids recomputing long agentic prefixes after
          # tool-call gaps of 300 s or more (+1.9% on DEP4).
          - --kv-transfer-config
          - '{"kv_connector":"SimpleCPUOffloadConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use_per_rank":137438953472,"lazy_offload":false}}'
          - --max-num-batched-tokens
          - '8192'
          - --gpu-memory-utilization
          - '0.92'
          - --kernel-config
          - '{"enable_flashinfer_autotune":true,"moe_backend":"deep_gemm_mega_moe","sparse_indexer_topk_backend":"deep_select"}'
          - --engram-config
          - '{"cpu_offload":true,"embedding_across_dp":true,"use_thp":true}'
          - --compilation-config
          - '{"mode":"VLLM_COMPILE","cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[6,12,18,24,30,36,48,60,72,96,120,144,192,240,288,384,480,576,768,1020,1536,2046,3072,4092]}'
          - --max-cudagraph-capture-size
          - '4092'
          # Real DSpark acceptance (block verification). perf/README.md gives the benchmark-only
          # synthetic-acceptance setting used for the published throughput numbers.
          - --speculative-config
          - '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":true,"revision":"1bae0e1088993b9b82de08f59de5be5a34e42170"}'
          env:
          - name: HF_HOME
            value: /shared-model-cache
          - name: HF_HUB_CACHE
            value: /shared-model-cache/hub
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: TRANSFORMERS_OFFLINE
            value: '1'
          - name: VLLM_ENGINE_READY_TIMEOUT_S
            value: '3600'
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: DYN_HEALTH_CHECK_ENABLED
            value: 'false'
          - name: VLLM_USE_V2_MODEL_RUNNER
            value: '1'
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          resources:
            requests:
              cpu: '32'
              memory: 1000Gi
              nvidia.com/gpu: '4'
            limits:
              cpu: '64'
              memory: 1200Gi
              nvidia.com/gpu: '4'
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_PTRACE
              - SYS_RESOURCE
          volumeMounts:
          - name: shared-model-cache
            mountPath: /shared-model-cache
          - name: vllm-cache
            mountPath: /root/.cache/vllm
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        - name: vllm-cache
          emptyDir: {}
