# DeepSeek-V4-Pro SGLang DynamoGraphDeployment
# Aggregated mode, B200x8 TP8, MXFP4 MoE
# EAGLE disabled: crashes on long context (>18k tokens) and tool calling on B200 TP8
# due to insufficient GPU memory headroom (4.23 GB/GPU with EAGLE vs 7.75 GB without)

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-dsv4-pro
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.2.0-deepseek-v4-cuda12-dev.3
          imagePullPolicy: Always
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 360

          env:
          - name: HF_HOME
            value: /models
          - name: HF_HUB_OFFLINE
            value: "1"
          volumeMounts:
          - name: shared-model-cache
            mountPath: /models
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
  - name: decode
    type: decode
    replicas: 1
    sharedMemorySize: 200Gi
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.2.0-deepseek-v4-cuda12-dev.3
          imagePullPolicy: Always
          command:
          - python3
          - -m
          - dynamo.sglang
          args:
          - --model-path
          - deepseek-ai/DeepSeek-V4-Pro
          - --served-model-name
          - deepseek-ai/DeepSeek-V4-Pro
          - --trust-remote-code
          - --tp
          - "8"
          - --moe-runner-backend
          - flashinfer_mxfp4
          - --chunked-prefill-size
          - "4096"
          - --disable-flashinfer-autotune
          - --dyn-tool-call-parser
          - deepseek_v4
          - --dyn-reasoning-parser
          - deepseek_v4
          workingDir: /workspace
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 360

          env:
          - name: HF_HOME
            value: /models
          - name: HF_HUB_OFFLINE
            value: "1"
          - name: CUDA_VISIBLE_DEVICES
            value: "0,1,2,3,4,5,6,7"
          - name: SGLANG_JIT_DEEPGEMM_PRECOMPILE
            value: "0"
          - name: SGLANG_JIT_DEEPGEMM_FAST_WARMUP
            value: "1"
          - name: NCCL_CUMEM_ENABLE
            value: "1"
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          resources:
            limits:
              nvidia.com/gpu: "8"
          volumeMounts:
          - name: shared-model-cache
            mountPath: /models
        tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-B200
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
