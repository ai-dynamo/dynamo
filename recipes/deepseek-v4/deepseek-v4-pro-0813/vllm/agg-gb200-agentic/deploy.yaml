#
# DeepSeek-V4-Pro-0813 (native FP8) — aggregated GB200, TP8 + expert parallelism +
# DSpark speculative decoding, 1M context.
#
# GB200 is 4 GPUs per node, so TP8 spans two nodes: `multinode.nodeCount: 2`.
# One replica = 8 GPUs = 2 nodes. This recipe ships single-replica; the SLA knee was
# measured at that shape.
#
# The worker's --speculative-config is sourced from the ConfigMap below via env:
#   - key `speculative-config`           = REAL DSpark rejection sampling (production).
#   - key `speculative-config-synthetic` = forced AL=2.27 (measured on SPEED-Bench against
#     real text), for benchmarking only. Do NOT ship it.
# Measured: synthetic acceptance overstates per-user throughput by ~36.5% because it skips
# the draft-model compute. See perf/README.md.
# GB200 cross-node NVLink (MNNVL) requires an IMEX channel, provided by a ComputeDomain plus
# a matching `resourceClaims` entry on the multinode component. Without it the workers hang in
# a Gloo barrier during torch.distributed init and die with
# `RuntimeError: Application timeout caused pair closure` BEFORE any weights are loaded -- so a
# generous startupProbe does not help. This is required for any component with nodeCount > 1.
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: dsv4-pro-0813-agg-gb200-agentic-compute-domain
spec:
  # 0 = on-demand allocation; nodes are assigned when pods request them via resourceClaims.
  numNodes: 0
  channel:
    resourceClaimTemplate:
      name: dsv4-pro-0813-agg-gb200-agentic-compute-domain-channel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsv4-pro-0813-agg-gb200-agentic-config
  labels:
    app.kubernetes.io/name: dsv4-pro-0813-agg-gb200-agentic
data:
  # Production: real rejection sampling, distribution-preserving.
  speculative-config: |
    {"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}
  # Benchmark only. Fabricates accepted tokens; overstates throughput ~36.5%.
  speculative-config-synthetic: |
    {"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":2.27}
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv4-pro-0813-agg-gb200-agentic
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.5.0-ci-e3ca1b40dd877531f3276116cb773c6a782b1122-vllm-runtime
              imagePullPolicy: Always
              workingDir: /workspace
              env:
                # Set explicitly rather than relying on the default: this trace has ~90%
                # shared prefix, so KV-aware routing is the meaningful choice for the family.
                - name: DYN_ROUTER_MODE
                  value: kv
              command:
                - /bin/bash
                - -lc
              args:
                - |
                  python3 -m dynamo.frontend \
                    --http-host 0.0.0.0 \
                    --http-port 8000
    - name: VllmDecodeWorker
      type: worker
      replicas: 1
      multinode:
        nodeCount: 2
      podTemplate:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.product
                        operator: In
                        values:
                          - NVIDIA-GB200
          tolerations:
            - key: kubernetes.io/arch
              operator: Equal
              value: arm64
              effect: NoSchedule
          # Binds this pod to the ComputeDomain's IMEX channel. Required for TP across
          # nodes on GB200; see the ComputeDomain at the top of this file.
          resourceClaims:
            - name: compute-domain-channel
              resourceClaimTemplateName: dsv4-pro-0813-agg-gb200-agentic-compute-domain-channel
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            # TP8 requires a Memory-backed /dev/shm. The Kubernetes default of 64 MB
            # causes shm_broadcast.acquire_read timeouts that surface as EngineDeadError.
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 200Gi
          containers:
            - name: main
              image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.5.0-ci-e3ca1b40dd877531f3276116cb773c6a782b1122-vllm-runtime
              imagePullPolicy: Always
              workingDir: /workspace/examples/backends/vllm
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                - name: dshm
                  mountPath: /dev/shm
              env:
                # TP8 spans two nodes, so the cross-node all-reduce runs over NVLink72
                # (MNNVL), not RoCE/IB. These must be set or the workers fail importing
                # fabric memory with "CUDA driver error: invalid resource handle ...
                # NCCL_MNNVL_CLIQUE_ID: unset".
                - name: NCCL_MNNVL_ENABLE
                  value: "1"
                - name: NCCL_NVLS_ENABLE
                  value: "1"
                - name: NCCL_CUMEM_ENABLE
                  value: "1"
                - name: UCX_CUDA_IPC_ENABLE_MNNVL
                  value: "y"
                - name: NCCL_P2P_LEVEL
                  value: NVL
                # Pin the control-plane interface; multinode bootstrap otherwise picks
                # an arbitrary NIC and can hang.
                - name: NCCL_SOCKET_IFNAME
                  value: eth0
                - name: GLOO_SOCKET_IFNAME
                  value: eth0
                # A 892.7 GB load can outlast the default NCCL store timeout.
                - name: NCCL_STORE_TIMEOUT
                  value: "7200"
                - name: UCX_TLS
                  value: cuda_copy,cuda_ipc,tcp
                - name: UCX_MEMTYPE_CACHE
                  value: "n"
                - name: NVIDIA_GDRCOPY
                  value: "1"
                # Upstream's GB200 manifests set this to 1. We ship 0: with symmetric
                # memory enabled this checkpoint crashes under sustained load on GB200.
                - name: VLLM_USE_NCCL_SYMM_MEM
                  value: "0"
                - name: TILELANG_CLEANUP_TEMP_FILES
                  value: "1"
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: SPECULATIVE_CONFIG
                  valueFrom:
                    configMapKeyRef:
                      name: dsv4-pro-0813-agg-gb200-agentic-config
                      # Swap to `speculative-config-synthetic` for benchmarking only.
                      key: speculative-config
                # A 892.7 GB checkpoint can exceed the default engine-ready timeout.
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: "10800"
              startupProbe:
                httpGet:
                  path: /health
                  port: 9090
                periodSeconds: 10
                timeoutSeconds: 10
                # 892.7 GB over a shared filesystem can take >90 min. A shorter budget
                # SIGKILLs the pod mid-load; the symptom is exit 137 with reason=Error.
                failureThreshold: 2160
              command:
                - /bin/sh
                - -c
              args:
                - |
                  exec python3 -m dynamo.vllm \
                    --model deepseek-ai/DeepSeek-V4-Pro-0813 \
                    --served-model-name deepseek-ai/DeepSeek-V4-Pro-0813 \
                    --trust-remote-code \
                    --tensor-parallel-size 8 \
                    --pipeline-parallel-size 1 \
                    --enable-expert-parallel \
                    --kv-cache-dtype fp8 \
                    --block-size 256 \
                    --max-num-seqs 256 \
                    --max-num-batched-tokens 16384 \
                    --max-model-len 1048576 \
                    --gpu-memory-utilization 0.9 \
                    --tokenizer-mode deepseek_v4 \
                    --dyn-reasoning-parser deepseek_v4 \
                    --dyn-tool-call-parser deepseek_v4 \
                    --attention-config '{"use_fp4_indexer_cache":true}' \
                    --moe-backend deep_gemm_mega_moe \
                    --compilation-config '{"mode":3,"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
                    --speculative-config "${SPECULATIVE_CONFIG}" \
                    --enable-prefix-caching \
                    --enable-chunked-prefill \
                    --no-enable-flashinfer-autotune
              resources:
                claims:
                  - name: compute-domain-channel
                requests:
                  nvidia.com/gpu: "4"
                limits:
                  nvidia.com/gpu: "4"
