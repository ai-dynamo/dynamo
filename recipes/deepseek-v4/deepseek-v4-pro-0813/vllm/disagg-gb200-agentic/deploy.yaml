#
# DeepSeek-V4-Pro-0813 (MXFP4 experts + FP8 KV) — disaggregated GB200, 1P1D. Each worker is
# TP8 + expert parallelism, 1M context; the decode worker adds DSpark speculative
# decoding. Total 16 GPUs = 4 nodes.
#
# GB200 is 4 GPUs per node, so each TP8 worker spans two nodes:
# `multinode.nodeCount: 2`. Both workers share one ComputeDomain.
#
# KV moves between workers over NIXL. On this cluster that path must be RDMA --
# over TCP, P50 TTFT was 4663 ms against 479 ms on RDMA, an order of magnitude.
# The `networking.gke.io.*` annotations and resources below are GKE-specific;
# adapt them to your cluster's RDMA plumbing. `rdma/ib` does NOT exist here and
# requesting it leaves pods Pending.
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: dsv4-0813-disagg-gb200-agentic-compute-domain
spec:
  # 0 = on-demand allocation; nodes are assigned when pods request them via resourceClaims.
  numNodes: 0
  channel:
    resourceClaimTemplate:
      name: dsv4-0813-disagg-gb200-agentic-compute-domain-channel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsv4-0813-disagg-gb200-agentic-config
  labels:
    app.kubernetes.io/name: dsv4-0813-disagg-gb200-agentic
data:
  # Production: real rejection sampling, distribution-preserving.
  speculative-config: |
    {"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}
  # Benchmark only. Fabricates accepted tokens; overstates throughput ~36.5%.
  speculative-config-synthetic: |
    {"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":2.27}
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv4-0813-disagg-gb200-agentic
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.5.0-ci-e3ca1b40dd877531f3276116cb773c6a782b1122-vllm-runtime
              imagePullPolicy: Always
              workingDir: /workspace
              env:
                # This trace has ~90% shared prefix, so KV-aware routing is the
                # meaningful choice for the family.
                - name: DYN_ROUTER_MODE
                  value: kv
              startupProbe:
                httpGet:
                  path: /health
                  port: 8000
                periodSeconds: 15
                failureThreshold: 200
              command:
                - /bin/bash
                - -lc
              args:
                - |
                  python3 -m dynamo.frontend \
                    --trust-remote-code \
                    --http-host 0.0.0.0 \
                    --http-port 8000
    - name: VllmPrefill
      type: prefill
      replicas: 1
      multinode:
        nodeCount: 2
      podTemplate:
        metadata:
          annotations:
            # Cluster-specific: attaches the four RDMA NICs used for KV transfer.
            networking.gke.io/default-interface: eth0
            networking.gke.io/interfaces: '[{"interfaceName":"eth0","network":"default"},{"interfaceName":"rdma0","network":"rdma-0"},{"interfaceName":"rdma1","network":"rdma-1"},{"interfaceName":"rdma2","network":"rdma-2"},{"interfaceName":"rdma3","network":"rdma-3"}]'
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.product
                        operator: In
                        values:
                          - NVIDIA-GB200
          tolerations:
            - key: kubernetes.io/arch
              operator: Equal
              value: arm64
              effect: NoSchedule
          # GB200 MNNVL: every rank of a TP group must land in ONE NVLink72
          # clique. deep_gemm_mega_moe allocates a symmetric-memory buffer via
          # torch.distributed._symmetric_memory.rendezvous, which cannot import
          # memory across cliques -- it fails at engine init with
          #   "CUDA driver error: invalid resource handle. Rank 0 failed to
          #    import memory from rank 4, NCCL_MNNVL_CLIQUE_ID: unset"
          # Without this the scheduler may split a TP group across cliques and
          # startup fails non-deterministically.
          # `required` (not `preferred`): cross-clique is a hard failure, so
          # staying Pending under capacity pressure is the correct outcome.
          # matchLabelKeys scopes the rule to THIS TP group's own scaling-group
          # value, which is operator-generated and cannot be hardcoded.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: nvidia.com/gpu.clique
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/managed-by
                        operator: In
                        values: [grove-operator]
                  matchLabelKeys:
                    - grove.io/podcliquescalinggroup
          resourceClaims:
            - name: compute-domain-channel
              resourceClaimTemplateName: dsv4-0813-disagg-gb200-agentic-compute-domain-channel
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 200Gi
          containers:
            - name: main
              image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.5.0-ci-e3ca1b40dd877531f3276116cb773c6a782b1122-vllm-runtime
              imagePullPolicy: Always
              workingDir: /workspace/examples/backends/vllm
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                - name: dshm
                  mountPath: /dev/shm
              env:
                - name: NCCL_MNNVL_ENABLE
                  value: "1"
                - name: NCCL_NVLS_ENABLE
                  value: "1"
                - name: NCCL_CUMEM_ENABLE
                  value: "1"
                - name: UCX_CUDA_IPC_ENABLE_MNNVL
                  value: "y"
                - name: NCCL_P2P_LEVEL
                  value: NVL
                - name: NCCL_SOCKET_IFNAME
                  value: eth0
                - name: GLOO_SOCKET_IFNAME
                  value: eth0
                - name: NCCL_STORE_TIMEOUT
                  value: "7200"
                # `rc` is what carries KV over RDMA. Drop it and NIXL silently
                # falls back to TCP, costing ~10x on TTFT.
                - name: UCX_TLS
                  value: cuda_copy,cuda_ipc,tcp,rc
                - name: UCX_IB_GID_INDEX
                  value: "3"
                - name: UCX_RC_TIMEOUT
                  value: 600s
                - name: UCX_KEEPALIVE_INTERVAL
                  value: 300s
                - name: DYN_NIXL_MEDIA_BUFFER_BYTES
                  value: "4294967296"
                - name: UCX_MEMTYPE_CACHE
                  value: "n"
                - name: NVIDIA_GDRCOPY
                  value: "1"
                # Upstream's GB200 manifests set this to 1. We ship 0: with symmetric
                # memory enabled this checkpoint crashes under sustained load on GB200.
                - name: VLLM_USE_NCCL_SYMM_MEM
                  value: "0"
                - name: TILELANG_CLEANUP_TEMP_FILES
                  value: "1"
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: "21600"
              startupProbe:
                httpGet:
                  path: /health
                  port: 9090
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 2160
              command:
                - /bin/sh
                - -c
              args:
                - |
                  exec python3 -m dynamo.vllm \
                    --model deepseek-ai/DeepSeek-V4-Pro-0813 \
                    --served-model-name deepseek-ai/DeepSeek-V4-Pro-0813 \
                    --trust-remote-code \
                    --tensor-parallel-size 8 \
                    --pipeline-parallel-size 1 \
                    --enable-expert-parallel \
                    --kv-cache-dtype fp8 \
                    --block-size 256 \
                    --max-num-seqs 256 \
                    --max-num-batched-tokens 16384 \
                    --max-model-len 1048576 \
                    --gpu-memory-utilization 0.9 \
                    --tokenizer-mode deepseek_v4 \
                    --dyn-reasoning-parser deepseek_v4 \
                    --dyn-tool-call-parser deepseek_v4 \
                    --attention-config '{"use_fp4_indexer_cache":true}' \
                    --moe-backend deep_gemm_mega_moe \
                    --compilation-config '{"mode":3,"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"],"pass_config":{"fuse_allreduce_rms":true}}' \
                    --disaggregation-mode prefill \
                    --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_buffer_device":"cuda"}' \
                    --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5571","enable_kv_cache_events":true}' \
                    --no-async-scheduling \
                    --no-enable-flashinfer-autotune
              resources:
                claims:
                  - name: compute-domain-channel
                requests:
                  cpu: "32"
                  memory: 200Gi
                  nvidia.com/gpu: "4"
                  networking.gke.io.networks/rdma-0: "1"
                  networking.gke.io.networks/rdma-0.IP: "1"
                  networking.gke.io.networks/rdma-1: "1"
                  networking.gke.io.networks/rdma-1.IP: "1"
                  networking.gke.io.networks/rdma-2: "1"
                  networking.gke.io.networks/rdma-2.IP: "1"
                  networking.gke.io.networks/rdma-3: "1"
                  networking.gke.io.networks/rdma-3.IP: "1"
                limits:
                  nvidia.com/gpu: "4"
                  networking.gke.io.networks/rdma-0: "1"
                  networking.gke.io.networks/rdma-0.IP: "1"
                  networking.gke.io.networks/rdma-1: "1"
                  networking.gke.io.networks/rdma-1.IP: "1"
                  networking.gke.io.networks/rdma-2: "1"
                  networking.gke.io.networks/rdma-2.IP: "1"
                  networking.gke.io.networks/rdma-3: "1"
                  networking.gke.io.networks/rdma-3.IP: "1"
    - name: VllmDecode
      type: decode
      replicas: 1
      multinode:
        nodeCount: 2
      podTemplate:
        metadata:
          annotations:
            networking.gke.io/default-interface: eth0
            networking.gke.io/interfaces: '[{"interfaceName":"eth0","network":"default"},{"interfaceName":"rdma0","network":"rdma-0"},{"interfaceName":"rdma1","network":"rdma-1"},{"interfaceName":"rdma2","network":"rdma-2"},{"interfaceName":"rdma3","network":"rdma-3"}]'
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.product
                        operator: In
                        values:
                          - NVIDIA-GB200
          tolerations:
            - key: kubernetes.io/arch
              operator: Equal
              value: arm64
              effect: NoSchedule
          # GB200 MNNVL: every rank of a TP group must land in ONE NVLink72
          # clique. deep_gemm_mega_moe allocates a symmetric-memory buffer via
          # torch.distributed._symmetric_memory.rendezvous, which cannot import
          # memory across cliques -- it fails at engine init with
          #   "CUDA driver error: invalid resource handle. Rank 0 failed to
          #    import memory from rank 4, NCCL_MNNVL_CLIQUE_ID: unset"
          # Without this the scheduler may split a TP group across cliques and
          # startup fails non-deterministically (NVBug 6678925).
          # `required` (not `preferred`): cross-clique is a hard failure, so
          # staying Pending under capacity pressure is the correct outcome.
          # matchLabelKeys scopes the rule to THIS TP group's own scaling-group
          # value, which is operator-generated and cannot be hardcoded.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: nvidia.com/gpu.clique
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/managed-by
                        operator: In
                        values: [grove-operator]
                  matchLabelKeys:
                    - grove.io/podcliquescalinggroup
          resourceClaims:
            - name: compute-domain-channel
              resourceClaimTemplateName: dsv4-0813-disagg-gb200-agentic-compute-domain-channel
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 200Gi
          containers:
            - name: main
              image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.5.0-ci-e3ca1b40dd877531f3276116cb773c6a782b1122-vllm-runtime
              imagePullPolicy: Always
              workingDir: /workspace/examples/backends/vllm
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                - name: dshm
                  mountPath: /dev/shm
              env:
                - name: NCCL_MNNVL_ENABLE
                  value: "1"
                - name: NCCL_NVLS_ENABLE
                  value: "1"
                - name: NCCL_CUMEM_ENABLE
                  value: "1"
                - name: UCX_CUDA_IPC_ENABLE_MNNVL
                  value: "y"
                - name: NCCL_P2P_LEVEL
                  value: NVL
                - name: NCCL_SOCKET_IFNAME
                  value: eth0
                - name: GLOO_SOCKET_IFNAME
                  value: eth0
                - name: NCCL_STORE_TIMEOUT
                  value: "7200"
                # `rc` is what carries KV over RDMA. Drop it and NIXL silently
                # falls back to TCP, costing ~10x on TTFT.
                - name: UCX_TLS
                  value: cuda_copy,cuda_ipc,tcp,rc
                - name: UCX_IB_GID_INDEX
                  value: "3"
                - name: UCX_RC_TIMEOUT
                  value: 600s
                - name: UCX_KEEPALIVE_INTERVAL
                  value: 300s
                - name: DYN_NIXL_MEDIA_BUFFER_BYTES
                  value: "4294967296"
                - name: UCX_MEMTYPE_CACHE
                  value: "n"
                - name: NVIDIA_GDRCOPY
                  value: "1"
                # Upstream's GB200 manifests set this to 1. We ship 0: with symmetric
                # memory enabled this checkpoint crashes under sustained load on GB200.
                - name: VLLM_USE_NCCL_SYMM_MEM
                  value: "0"
                - name: TILELANG_CLEANUP_TEMP_FILES
                  value: "1"
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: VLLM_ENGINE_READY_TIMEOUT_S
                  value: "21600"
                - name: SPECULATIVE_CONFIG
                  valueFrom:
                    configMapKeyRef:
                      name: dsv4-0813-disagg-gb200-agentic-config
                      # Swap to `speculative-config-synthetic` for benchmarking only.
                      key: speculative-config
              startupProbe:
                httpGet:
                  path: /health
                  port: 9090
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 2160
              command:
                - /bin/sh
                - -c
              args:
                - |
                  exec python3 -m dynamo.vllm \
                    --model deepseek-ai/DeepSeek-V4-Pro-0813 \
                    --served-model-name deepseek-ai/DeepSeek-V4-Pro-0813 \
                    --trust-remote-code \
                    --tensor-parallel-size 8 \
                    --pipeline-parallel-size 1 \
                    --enable-expert-parallel \
                    --kv-cache-dtype fp8 \
                    --block-size 256 \
                    --max-num-seqs 256 \
                    --max-num-batched-tokens 2048 \
                    --stream-interval 50 \
                    --max-model-len 1048576 \
                    --gpu-memory-utilization 0.9 \
                    --tokenizer-mode deepseek_v4 \
                    --dyn-reasoning-parser deepseek_v4 \
                    --dyn-tool-call-parser deepseek_v4 \
                    --attention-config '{"use_fp4_indexer_cache":true}' \
                    --moe-backend deep_gemm_mega_moe \
                    --compilation-config '{"mode":3,"cudagraph_mode":"FULL_DECODE_ONLY","custom_ops":["all"],"pass_config":{"fuse_allreduce_rms":true}}' \
                    --speculative-config "${SPECULATIVE_CONFIG}" \
                    --disaggregation-mode decode \
                    --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_buffer_device":"cuda","kv_connector_extra_config":{"num_threads":8}}' \
                    --no-enable-flashinfer-autotune
              resources:
                claims:
                  - name: compute-domain-channel
                requests:
                  cpu: "32"
                  memory: 200Gi
                  nvidia.com/gpu: "4"
                  networking.gke.io.networks/rdma-0: "1"
                  networking.gke.io.networks/rdma-0.IP: "1"
                  networking.gke.io.networks/rdma-1: "1"
                  networking.gke.io.networks/rdma-1.IP: "1"
                  networking.gke.io.networks/rdma-2: "1"
                  networking.gke.io.networks/rdma-2.IP: "1"
                  networking.gke.io.networks/rdma-3: "1"
                  networking.gke.io.networks/rdma-3.IP: "1"
                limits:
                  nvidia.com/gpu: "4"
                  networking.gke.io.networks/rdma-0: "1"
                  networking.gke.io.networks/rdma-0.IP: "1"
                  networking.gke.io.networks/rdma-1: "1"
                  networking.gke.io.networks/rdma-1.IP: "1"
                  networking.gke.io.networks/rdma-2: "1"
                  networking.gke.io.networks/rdma-2.IP: "1"
                  networking.gke.io.networks/rdma-3: "1"
                  networking.gke.io.networks/rdma-3.IP: "1"
