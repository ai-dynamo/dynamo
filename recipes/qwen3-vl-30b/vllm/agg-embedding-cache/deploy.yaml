apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-vl-agg
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          env:
          - name: HF_HOME
            value: /home/dynamo/.cache/huggingface
          - name: DYN_REQUEST_PLANE
            value: tcp
          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "1"
  - name: worker
    type: worker
    replicas: 1
    compilationCache:
      pvcName: compilation-cache
      mountPath: /home/dynamo/.cache/vllm
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          imagePullPolicy: IfNotPresent
          command:
          - /bin/bash
          - -lc
          args:
          - |
            set -euo pipefail
            python3 -m dynamo.vllm \
              --model Qwen/Qwen3-VL-30B-A3B-Instruct-FP8 \
              --enable-multimodal \
              --tensor-parallel-size 1 \
              --gpu-memory-utilization 0.85 \
              --max-model-len 16384 \
              --no-enable-log-requests \
              --enable-prefix-caching \
              --multimodal-embedding-cache-capacity-gb "${DYN_MULTIMODAL_EMBEDDING_CACHE_GB}"
          workingDir: /workspace
          env:
          - name: HF_HOME
            value: /home/dynamo/.cache/huggingface
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_VLLM_EMBEDDING_TRANSFER_MODE
            value: nixl-write
          - name: DYN_MULTIMODAL_EMBEDDING_CACHE_GB
            value: "10"
            # Permit the COCO http:// image URLs in the multimodal benchmark dataset.
          - name: DYN_MM_ALLOW_INTERNAL
            value: "1"
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: model-cache
            mountPath: /home/dynamo/.cache/huggingface
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
