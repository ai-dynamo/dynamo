<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="800" height="470" fill="#000000"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/>
    </marker>
  </defs>

  <!-- ==================== GMS sidecar (peer process, off to the side) ==================== -->
  <rect x="30" y="40" width="190" height="145" fill="#101820" stroke="#3b6cb0" stroke-width="1.5" rx="6"/>
  <text x="125" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#e0e0e0">GMS sidecar</text>
  <text x="125" y="92" text-anchor="middle" font-size="10.5" fill="#5a7fa8" font-style="italic">no CUDA context</text>
  <text x="125" y="119" text-anchor="middle" font-size="10.5" fill="#a8b8c8">holds the allocation</text>
  <text x="125" y="138" text-anchor="middle" font-size="10.5" fill="#a8b8c8">hands out handles</text>
  <text x="125" y="164" text-anchor="middle" font-size="10.5" fill="#5a7fa8" font-style="italic">not on the access path</text>

  <!-- GMS ownership link: down, then right into the allocation -->
  <path d="M 125 185 V 350 H 246" fill="none" stroke="#3b6cb0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="134" y="272" font-size="11" fill="#5a7fa8" font-weight="600">owns</text>

  <!-- ==================== engine A (active) ==================== -->
  <rect x="250" y="40" width="238" height="145" fill="#152008" stroke="#76b900" stroke-width="2" rx="6"/>
  <text x="369" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#e0e0e0">engine A (active)</text>
  <text x="369" y="92" text-anchor="middle" font-size="10.5" fill="#999" font-style="italic">its own CUDA context</text>
  <text x="369" y="115" text-anchor="middle" font-size="9.5" fill="#76b900" letter-spacing="0.6">VIRTUAL ADDRESSES</text>
  <rect x="269" y="125" width="44" height="42" fill="#1e2b10" stroke="#5f9400" stroke-width="1.2" rx="3"/>
  <rect x="321" y="125" width="44" height="42" fill="#1e2b10" stroke="#5f9400" stroke-width="1.2" rx="3"/>
  <rect x="373" y="125" width="44" height="42" fill="#1e2b10" stroke="#5f9400" stroke-width="1.2" rx="3"/>
  <rect x="425" y="125" width="44" height="42" fill="#1e2b10" stroke="#5f9400" stroke-width="1.2" rx="3"/>

  <!-- ==================== engine B (shadow) ==================== -->
  <rect x="512" y="40" width="238" height="145" fill="#1f1f1f" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3" rx="6"/>
  <text x="631" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#cccccc">engine B (shadow)</text>
  <text x="631" y="92" text-anchor="middle" font-size="10.5" fill="#777" font-style="italic">its own CUDA context</text>
  <text x="631" y="115" text-anchor="middle" font-size="9.5" fill="#999" letter-spacing="0.6">VIRTUAL ADDRESSES</text>
  <rect x="531" y="125" width="44" height="42" fill="#262626" stroke="#777" stroke-width="1.2" rx="3"/>
  <rect x="583" y="125" width="44" height="42" fill="#262626" stroke="#777" stroke-width="1.2" rx="3"/>
  <rect x="635" y="125" width="44" height="42" fill="#262626" stroke="#777" stroke-width="1.2" rx="3"/>
  <rect x="687" y="125" width="44" height="42" fill="#262626" stroke="#777" stroke-width="1.2" rx="3"/>

  <!-- ============ mapping paths: straight down, along a shared bus, straight down ============ -->
  <line x1="369" y1="185" x2="369" y2="245" stroke="#76b900" stroke-width="2"/>
  <text x="379" y="219" font-size="11" fill="#76b900" font-weight="600">maps</text>

  <line x1="631" y1="185" x2="631" y2="245" stroke="#888" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="641" y="219" font-size="11" fill="#999" font-weight="600">maps</text>

  <line x1="369" y1="245" x2="500" y2="245" stroke="#76b900" stroke-width="2"/>
  <line x1="500" y1="245" x2="631" y2="245" stroke="#888" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="500" y1="245" x2="500" y2="296" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== the one physical copy ==================== -->
  <rect x="250" y="300" width="500" height="100" fill="#1a1a1a" stroke="#e0e0e0" stroke-width="1.5" rx="6"/>
  <text x="500" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#e0e0e0">one physical copy of the weights, resident in HBM</text>
  <rect x="270" y="340" width="100" height="42" fill="#3a3a3a" stroke="#999" stroke-width="1" rx="3"/>
  <rect x="390" y="340" width="100" height="42" fill="#3a3a3a" stroke="#999" stroke-width="1" rx="3"/>
  <rect x="510" y="340" width="100" height="42" fill="#3a3a3a" stroke="#999" stroke-width="1" rx="3"/>
  <rect x="630" y="340" width="100" height="42" fill="#3a3a3a" stroke="#999" stroke-width="1" rx="3"/>

  <!-- ==================== footer ==================== -->
  <text x="400" y="443" text-anchor="middle" font-size="11" fill="#999" font-style="italic">Both engines reach the same physical pages through ordinary pointers in their own address spaces.</text>
</svg>
