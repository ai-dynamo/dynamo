<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title description">
  <title id="title">Ownership boundary for reinforcement learning rollout serving with Dynamo</title>
  <desc id="description">The RL framework owns training and policy decisions, Dynamo owns the rollout-serving plane, and the inference backend owns token generation and applying weight updates. Rollout requests travel from the framework through Dynamo to the backend. Tokens, log probabilities, health, and telemetry return to the framework. During policy refresh, the framework selects and gates the policy, Dynamo exposes worker controls and health, and the backend applies weights and clears stale KV cache.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#8a8a8a" />
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#76b900" />
    </marker>
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="620" fill="#000000" />

  <text x="56" y="48" fill="#8a8a8a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ROLLOUT REQUEST PATH</text>

  <rect x="56" y="74" width="332" height="278" fill="#111111" stroke="#3b3b3b" stroke-width="1.5" />
  <text x="80" y="108" fill="#767676" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TRAINING PLANE</text>
  <text x="80" y="151" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">RL framework</text>
  <line x1="80" y1="170" x2="364" y2="170" stroke="#2b2b2b" />
  <circle cx="86" cy="206" r="4" fill="#767676" />
  <text x="104" y="212" fill="#d0d0d0" font-family="Arial, Helvetica, sans-serif" font-size="16">Training, rewards, environments</text>
  <circle cx="86" cy="245" r="4" fill="#767676" />
  <text x="104" y="251" fill="#d0d0d0" font-family="Arial, Helvetica, sans-serif" font-size="16">Retries and sample acceptance</text>
  <circle cx="86" cy="284" r="4" fill="#767676" />
  <text x="104" y="290" fill="#d0d0d0" font-family="Arial, Helvetica, sans-serif" font-size="16">Policy freshness and checkpoints</text>
  <text x="80" y="328" fill="#8a8a8a" font-family="'SFMono-Regular', Consolas, monospace" font-size="13">decides what is trainable</text>

  <rect x="474" y="74" width="332" height="278" fill="#142007" stroke="#76b900" stroke-width="2" filter="url(#green-glow)" />
  <text x="498" y="108" fill="#76b900" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SERVING PLANE</text>
  <text x="498" y="151" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Dynamo</text>
  <line x1="498" y1="170" x2="782" y2="170" stroke="#365800" />
  <circle cx="504" cy="206" r="4" fill="#76b900" />
  <text x="522" y="212" fill="#e8e8e8" font-family="Arial, Helvetica, sans-serif" font-size="16">Shared frontend and routing</text>
  <circle cx="504" cy="245" r="4" fill="#76b900" />
  <text x="522" y="251" fill="#e8e8e8" font-family="Arial, Helvetica, sans-serif" font-size="16">Worker discovery and health</text>
  <circle cx="504" cy="284" r="4" fill="#76b900" />
  <text x="522" y="290" fill="#e8e8e8" font-family="Arial, Helvetica, sans-serif" font-size="16">Serving telemetry and controls</text>
  <text x="498" y="328" fill="#76b900" font-family="'SFMono-Regular', Consolas, monospace" font-size="13">operates the rollout fleet</text>

  <rect x="892" y="74" width="332" height="278" fill="#111111" stroke="#3b3b3b" stroke-width="1.5" />
  <text x="916" y="108" fill="#767676" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">EXECUTION PLANE</text>
  <text x="916" y="151" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Inference backend</text>
  <line x1="916" y1="170" x2="1200" y2="170" stroke="#2b2b2b" />
  <circle cx="922" cy="206" r="4" fill="#767676" />
  <text x="940" y="212" fill="#d0d0d0" font-family="Arial, Helvetica, sans-serif" font-size="16">Token and logprob generation</text>
  <circle cx="922" cy="245" r="4" fill="#767676" />
  <text x="940" y="251" fill="#d0d0d0" font-family="Arial, Helvetica, sans-serif" font-size="16">Worker state and KV cache</text>
  <circle cx="922" cy="284" r="4" fill="#767676" />
  <text x="940" y="290" fill="#d0d0d0" font-family="Arial, Helvetica, sans-serif" font-size="16">Backend-specific weight apply</text>
  <text x="916" y="328" fill="#8a8a8a" font-family="'SFMono-Regular', Consolas, monospace" font-size="13">vLLM · SGLang · TensorRT-LLM</text>

  <line x1="388" y1="144" x2="466" y2="144" stroke="#76b900" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="427" y="131" fill="#76b900" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" text-anchor="middle">requests</text>
  <line x1="806" y1="144" x2="884" y2="144" stroke="#76b900" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="845" y="131" fill="#76b900" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" text-anchor="middle">dispatch</text>
  <line x1="884" y1="274" x2="806" y2="274" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arrow-gray)" />
  <text x="845" y="297" fill="#8a8a8a" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">tokens · state</text>
  <line x1="466" y1="274" x2="388" y2="274" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arrow-gray)" />
  <text x="427" y="297" fill="#8a8a8a" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" text-anchor="middle">results</text>

  <rect x="56" y="398" width="1168" height="162" fill="#0a0a0a" stroke="#303030" stroke-width="1.5" />
  <text x="80" y="430" fill="#8a8a8a" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">POLICY REFRESH — SHARED WORKFLOW, EXPLICIT OWNERS</text>

  <circle cx="92" cy="486" r="18" fill="#76b900" />
  <text x="92" y="492" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1</text>
  <text x="124" y="478" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Select and gate the policy</text>
  <text x="124" y="505" fill="#8a8a8a" font-family="'SFMono-Regular', Consolas, monospace" font-size="13">RL framework</text>

  <line x1="392" y1="486" x2="462" y2="486" stroke="#76b900" stroke-width="2" marker-end="url(#arrow-green)" />

  <circle cx="498" cy="486" r="18" fill="#76b900" />
  <text x="498" y="492" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2</text>
  <text x="530" y="478" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Expose controls and health</text>
  <text x="530" y="505" fill="#76b900" font-family="'SFMono-Regular', Consolas, monospace" font-size="13">Dynamo</text>

  <line x1="802" y1="486" x2="872" y2="486" stroke="#76b900" stroke-width="2" marker-end="url(#arrow-green)" />

  <circle cx="908" cy="486" r="18" fill="#76b900" />
  <text x="908" y="492" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3</text>
  <text x="940" y="478" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Apply weights and clear KV</text>
  <text x="940" y="505" fill="#8a8a8a" font-family="'SFMono-Regular', Consolas, monospace" font-size="13">Inference backend</text>

  <line x1="56" y1="590" x2="1224" y2="590" stroke="#1f1f1f" />
</svg>
