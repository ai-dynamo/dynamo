<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title description">
  <title id="title">Where Dynamo fits in the reinforcement learning post-training loop</title>
  <desc id="description">Prompt and task data enter Dynamo rollout serving. Dynamo routes work to inference backends that generate tokens and log probabilities. The reinforcement learning framework evaluates rewards, computes advantages, updates the policy, and sends the next policy back to the rollout fleet. The framework owns training decisions, Dynamo owns serving orchestration, and the inference backend owns model execution.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
    .muted { fill: #4b5563; }
    .accent { fill: #5a8f00; }
    .line { stroke: #64748b; }
    .line-green { stroke: #76b900; }
    .arrow-head { fill: #64748b; }
    .arrow-head-green { fill: #76b900; }
    .panel { fill: #ffffff; }
    .panel-border { stroke: #cbd5e1; }
    .framework { fill: #f8fafc; stroke: #cbd5e1; }
    .dynamo { fill: #f3fae8; stroke: #76b900; }
    .backend { fill: #eff6ff; stroke: #3b82f6; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f8fafc; }
      .muted { fill: #cbd5e1; }
      .accent { fill: #8ed100; }
      .line { stroke: #94a3b8; }
      .line-green { stroke: #8ed100; }
      .arrow-head { fill: #94a3b8; }
      .arrow-head-green { fill: #8ed100; }
      .panel { fill: #0f172a; }
      .panel-border { stroke: #475569; }
      .framework { fill: #111827; stroke: #475569; }
      .dynamo { fill: #17220d; stroke: #8ed100; }
      .backend { fill: #0f1d33; stroke: #60a5fa; }
    }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .title { font-size: 21px; font-weight: 700; }
    .inner-title { font-size: 19px; font-weight: 700; }
    .body { font-size: 14px; }
    .small { font-size: 12px; }
    .arrow-label { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" class="arrow-head" />
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" class="arrow-head-green" />
    </marker>
  </defs>

  <text x="48" y="42" class="eyebrow muted">RL POST-TRAINING LOOP</text>

  <!-- Connections render behind the component boxes. -->
  <line x1="252" y1="206" x2="314" y2="206" class="line" stroke-width="2" marker-end="url(#arrow)" />
  <text x="283" y="192" class="arrow-label muted" text-anchor="middle">prompts</text>

  <line x1="754" y1="206" x2="808" y2="206" class="line" stroke-width="2" marker-end="url(#arrow)" />
  <text x="781" y="192" class="arrow-label muted" text-anchor="middle">samples</text>

  <line x1="990" y1="206" x2="1034" y2="206" class="line" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1012" y="192" class="arrow-label muted" text-anchor="middle">rewards</text>

  <path d="M 1135 286 L 1135 410 Q 1135 438 1107 438 L 658 438 Q 630 438 630 410 L 630 306" fill="none" class="line-green" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="884" y="427" class="arrow-label accent" text-anchor="middle">updated policy · weight refresh</text>

  <!-- Framework-owned inputs. -->
  <rect x="48" y="142" width="204" height="144" rx="10" class="framework" stroke-width="1.5" />
  <text x="68" y="170" class="eyebrow muted">RL FRAMEWORK</text>
  <text x="68" y="208" class="title">Prompts and tasks</text>
  <text x="68" y="238" class="body muted">Environments, tools, and</text>
  <text x="68" y="260" class="body muted">sampling intent</text>

  <!-- Dynamo serving span. -->
  <rect x="318" y="84" width="436" height="222" rx="12" class="dynamo" stroke-width="2" />
  <text x="340" y="114" class="eyebrow accent">DYNAMO · ROLLOUT SERVING</text>

  <rect x="340" y="138" width="174" height="110" rx="8" class="panel line-green" stroke-width="1.5" />
  <text x="427" y="171" class="title" text-anchor="middle">Frontend</text>
  <text x="427" y="198" class="body muted" text-anchor="middle">Routing and admission</text>
  <text x="427" y="222" class="small muted" text-anchor="middle">health · telemetry · controls</text>

  <line x1="514" y1="193" x2="550" y2="193" class="line-green" stroke-width="2" marker-end="url(#arrow-green)" />

  <rect x="554" y="138" width="178" height="110" rx="8" class="backend" stroke-width="1.5" />
  <text x="643" y="171" class="inner-title" text-anchor="middle">Inference backends</text>
  <text x="643" y="198" class="body muted" text-anchor="middle">Generate and apply weights</text>
  <text x="643" y="222" class="small muted" text-anchor="middle">vLLM · SGLang · TRT-LLM</text>

  <text x="340" y="279" class="small muted">Dynamo operates the fleet; the backend executes the model.</text>

  <!-- Framework-owned evaluation and optimization. -->
  <rect x="810" y="142" width="180" height="144" rx="10" class="framework" stroke-width="1.5" />
  <text x="830" y="170" class="eyebrow muted">RL FRAMEWORK</text>
  <text x="830" y="208" class="title">Reward and verifier</text>
  <text x="830" y="238" class="body muted">Score trajectories and</text>
  <text x="830" y="260" class="body muted">apply environment rules</text>

  <rect x="1036" y="142" width="196" height="144" rx="10" class="framework" stroke-width="1.5" />
  <text x="1056" y="170" class="eyebrow muted">RL FRAMEWORK</text>
  <text x="1056" y="208" class="title">Optimize policy</text>
  <text x="1056" y="238" class="body muted">Advantages, optimizer,</text>
  <text x="1056" y="260" class="body muted">checkpoint, acceptance</text>

  <!-- Compact ownership legend. -->
  <line x1="48" y1="492" x2="1232" y2="492" class="panel-border" stroke-width="1" />
  <rect x="48" y="515" width="14" height="14" rx="3" class="framework" />
  <text x="72" y="527" class="small muted">RL framework owns training decisions and trajectory semantics</text>
  <rect x="492" y="515" width="14" height="14" rx="3" class="dynamo" />
  <text x="516" y="527" class="small muted">Dynamo owns rollout-serving orchestration</text>
  <rect x="830" y="515" width="14" height="14" rx="3" class="backend" />
  <text x="854" y="527" class="small muted">Inference backend owns execution and weight application</text>
</svg>
