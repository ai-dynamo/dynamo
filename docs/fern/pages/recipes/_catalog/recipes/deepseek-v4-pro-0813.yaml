id: deepseek-v4-pro-0813
title: DeepSeek-V4-Pro-0813
page: pages/recipes/model-recipes/deepseek-v4-pro-0813.mdx
provider: deepseek
model:
  name: DeepSeek-V4-Pro-0813
  hf_id: deepseek-ai/DeepSeek-V4-Pro-0813
  precision: MXFP4 experts + FP8 KV
status: experimental
targets:
- id: agg-gb200-agentic
  recommended: true
  hardware:
    gpu: GB200
    count: 8
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0-deepseek-v4-pro-0813-dev.1
  topology: aggregated
  techniques:
  - expert-parallel
  - fp8-kv-cache
  - kv-aware-routing
  - prefix-caching
  workload:
    type: trace-replay
    traffic: 'Agentic Mooncake trace: 64K median ISL / 400 median OSL, ~90% KV reuse'
    sla: user output >= 50 tok/s and TTFT p50 < 5 s
  deploy:
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/vllm/agg-gb200-agentic/deploy.yaml
  benchmark:
    tool: aiperf
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/perf/perf.yaml
  expected_performance:
    available: true
    summary: c8 = 69.45 system tok/s/GPU @ user 51.85 tok/s, TTFT p50 403 ms.
- id: disagg-gb200-agentic
  recommended: false
  hardware:
    gpu: GB200
    count: 16
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0-deepseek-v4-pro-0813-dev.1
  topology: disaggregated
  techniques:
  - disaggregated-prefill-decode
  - expert-parallel
  - fp8-kv-cache
  - kv-aware-routing
  - prefix-caching
  workload:
    type: trace-replay
    traffic: 'Agentic Mooncake trace: 64K median ISL / 400 median OSL, ~90% KV reuse; 1P1D'
    sla: user output >= 50 tok/s and TTFT p50 < 5 s
  deploy:
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/vllm/disagg-gb200-agentic/deploy.yaml
  benchmark:
    tool: aiperf
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/perf/perf.yaml
  expected_performance:
    available: true
    summary: c10 = 50.58 system tok/s/GPU @ user 53.42 tok/s, TTFT p50 1,237 ms.
- id: agg-h200-agentic
  recommended: false
  hardware:
    gpu: H200
    count: 8
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
  topology: aggregated
  techniques:
  - expert-parallel
  - fp8-kv-cache
  - kv-aware-routing
  - prefix-caching
  workload:
    type: trace-replay
    traffic: 'Agentic Mooncake trace: 64K median ISL / 400 median OSL, ~90% KV reuse; TP8 + EP, Marlin MoE, max_model_len 1048576'
    sla: user output >= 50 tok/s and TTFT p50 < 5 s
  deploy:
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/vllm/agg-h200-agentic/deploy.yaml
  benchmark:
    tool: aiperf
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/perf/perf.yaml
  expected_performance:
    available: true
    summary: 'c4 = 21.4 system tok/s/GPU @ user 51.8 tok/s, TTFT p50 322 ms.'
- id: disagg-h200-agentic
  recommended: false
  hardware:
    gpu: H200
    count: 16
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
  topology: disaggregated
  techniques:
  - disaggregated-prefill-decode
  - expert-parallel
  - fp8-kv-cache
  - kv-aware-routing
  - prefix-caching
  workload:
    type: trace-replay
    traffic: 'Agentic Mooncake trace: 64K median ISL / 400 median OSL, ~90% KV reuse; 1P1D (TP8 + EP per worker), NIXL KV transfer'
    sla: user output >= 50 tok/s and TTFT p50 < 5 s
  deploy:
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/vllm/disagg-h200-agentic/deploy.yaml
  benchmark:
    tool: aiperf
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/perf/perf.yaml
  expected_performance:
