id: deepseek-v4-pro-0813
title: DeepSeek-V4-Pro-0813
page: pages/recipes/model-recipes/deepseek-v4-pro-0813.mdx
provider: deepseek
model:
  name: DeepSeek-V4-Pro-0813
  hf_id: deepseek-ai/DeepSeek-V4-Pro-0813
  precision: MXFP4 experts + FP8 KV
status: experimental
targets:
- id: agg-gb200-agentic
  recommended: true
  hardware:
    gpu: GB200
    count: 8
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
  topology: aggregated
  techniques:
  - expert-parallel
  - fp8-kv-cache
  - kv-aware-routing
  - prefix-caching
  workload:
    type: trace-replay
    traffic: 'Agentic Mooncake trace: 64K median ISL / 400 median OSL, ~90% KV reuse'
    sla: user output >= 50 tok/s
  deploy:
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/vllm/agg-gb200-agentic/deploy.yaml
  benchmark:
    tool: aiperf
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/perf/perf.yaml
  expected_performance:
    available: true
    summary: c8 = 64.88 system tok/s/GPU @ user 55.9 tok/s, TTFT p50 383 ms.
- id: disagg-gb200-agentic
  recommended: false
  hardware:
    gpu: GB200
    count: 16
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
  topology: disaggregated
  techniques:
  - disaggregated-prefill-decode
  - expert-parallel
  - fp8-kv-cache
  - kv-aware-routing
  - prefix-caching
  workload:
    type: trace-replay
    traffic: 'Agentic Mooncake trace: 64K median ISL / 400 median OSL, ~90% KV reuse; 1P1D'
    sla: user output >= 50 tok/s
  deploy:
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/vllm/disagg-gb200-agentic/deploy.yaml
  benchmark:
    tool: aiperf
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/perf/perf.yaml
  expected_performance:
    available: true
    summary: c12 = 50.31 system tok/s/GPU @ user 50.0 tok/s, TTFT p50 2.37 s.
- id: agg-h200-agentic
  recommended: false
  hardware:
    gpu: H200
    count: 8
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
  topology: aggregated
  techniques:
  - expert-parallel
  - fp8-kv-cache
  - kv-aware-routing
  - prefix-caching
  workload:
    type: trace-replay
    traffic: 'Agentic Mooncake trace: 64K median ISL / 400 median OSL, ~90% KV reuse; TP8 + EP, Marlin MoE, max_model_len 1048576'
    sla: user output >= 50 tok/s
  deploy:
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/vllm/agg-h200-agentic/deploy.yaml
  benchmark:
    tool: aiperf
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/perf/perf.yaml
  expected_performance:
    available: true
    summary: 'Trace replay c4 (complete, 3,541 requests, 14.0 h) = 21.4 system tok/s/GPU @ user 51.8 tok/s P50, TTFT 322 ms P50 -- clears the joint gate. c6 was also measured and misses it (user 43.5 tok/s). Mean user throughput is 47.0 tok/s against the 51.8 P50; the trace has a long tail (ISL 5.6K-1.04M). Prompt-cache read reaches only 42.7% because the trace working set (~57.5M tokens) is 18.4x oversubscribed against H200 GPU KV (~3.12M tokens).'
- id: disagg-h200-agentic
  recommended: false
  hardware:
    gpu: H200
    count: 16
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
  topology: disaggregated
  techniques:
  - disaggregated-prefill-decode
  - expert-parallel
  - fp8-kv-cache
  - kv-aware-routing
  - prefix-caching
  workload:
    type: synthetic
    traffic: '64K ISL / 400 OSL, 90% prefix reuse; 1P1D (TP8 + EP per worker), NIXL KV transfer'
    sla: user output >= 50 tok/s
  deploy:
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/vllm/disagg-h200-agentic/deploy.yaml
  benchmark:
    tool: aiperf
    asset: recipes/deepseek-v4/deepseek-v4-pro-0813/perf/perf.yaml
  expected_performance:
    available: true
    summary: 'Synthetic 64K/400/90%-reuse: SLA crossing near c6 = 18.25-19.9 system tok/s/GPU @ user ~50. Not yet run on the shared trace; expect the same KV-oversubscription penalty as the aggregated H200 target.'
related_benchmarks: []
maintainer:
gaps:
- 'H200 aggregated now has a complete trace run at c4 (3,541/3,541 requests). It clears the joint gate; c6 does not. The residual GB200/H200 gap is KV capacity, not configuration: the trace working set is ~57.5M tokens against ~3.12M tokens of H200 GPU KV, so measured prompt-cache read is 42.7% versus the ~94% the trace could offer.'
- H200 disaggregated has synthetic numbers only; a complete trace run is still outstanding.
- 'All H200 figures are N=1 against a measured 17% run-to-run variance.'
- 'This is a different checkpoint from deepseek-ai/DeepSeek-V4-Pro (see the deepseek-v4-pro recipe); the two must not share a model cache.'
- maintainer unknown
