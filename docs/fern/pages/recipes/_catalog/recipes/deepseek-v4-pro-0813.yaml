- 'A partial H200 aggregated trace run (93% of the 15% subset, c6) measured user output 43.5 tok/s -- below the 50 tok/s SLA -- with prompt-cache read of only 42.5% against the trace''s ~94% shared-block potential. The reuse shortfall is not yet explained and should be understood before comparing H200 and GB200 trace numbers.'
- 'This is a different checkpoint from deepseek-ai/DeepSeek-V4-Pro (see the deepseek-v4-pro recipe); the two must not share a model cache.'
