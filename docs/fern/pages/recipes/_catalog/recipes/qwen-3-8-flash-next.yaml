gaps:
  - Uses upstream vllm/vllm-openai:qwen38-flash-next image (not a dynamo-built
    image); ai-dynamo is pip-installed at pod startup
  - Disaggregated recipe uses reduced prefill --max-num-seqs 32 (OOM avoidance
    on 260K-token prompts with 4 GPUs); async scheduling is enabled
