    topology: aggregated
    techniques:
      - kv-aware-routing
      - mtp-speculative-decode
      - expert-parallel
      - ngram-embedding-offload
    workload:
      type: agentic
      traffic: 64K ISL / 400 OSL, 90% KV cache hit (shared system prompt)
