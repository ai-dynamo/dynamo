id: ax-k2
title: A.X-K2
page: pages/recipes/model-recipes/ax-k2.mdx
provider: skt
model:
  name: A.X-K2
  hf_id: skt/A.X-K2-NVFP4
  precision: NVFP4 (B200) or FP8 (H200) weights, FP8 KV cache
status: experimental
targets:
- id: vllm-agg-b200
  recommended: false
  hardware:
    gpu: B200
    count: 8
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1-a.x-k2-post.1
  topology: aggregated
  techniques:
  - nvfp4
  - fp8-kv-cache
  - kv-aware-routing
  - eagle3
  workload:
    type: chat
    traffic: 8K/1K Mooncake chat, 15% trace subset, 70% KV reuse, concurrency 16
  deploy:
    asset: recipes/ax-k2/vllm/agg-b200-chat/deploy-generic.yaml
  expected_performance:
    available: true
    summary: 'C=16, chat 15%: 76.49 output toks/sec/GPU, 55.83 mean toks/sec/user, 0.525 s p50 TTFT. Historical
      synthetic EAGLE3 AL=2.12 run; 1765/1765 successful requests, 0 failed, 20 warmup requests. Predates
      the published NVCR runtime update.'
  benchmark:
    tool: aiperf
    asset: recipes/ax-k2/perf/perf.yaml
- id: vllm-disagg-b200
  recommended: false
  hardware:
    gpu: B200
    count: 12
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1-a.x-k2-post.1
  topology: disaggregated
  techniques:
  - nvfp4
  - fp8-kv-cache
  - kv-aware-routing
  - eagle3
  workload:
    type: chat
    traffic: 8K/1K Mooncake chat, 15% trace subset, 70% KV reuse, concurrency 16
  deploy:
    asset: recipes/ax-k2/vllm/disagg-b200-chat/deploy-generic.yaml
  expected_performance:
    available: true
    summary: 'C=16, chat 15%: 61.97 output toks/sec/GPU, 83 mean toks/sec/user, 3.879 s p50 TTFT. Historical
      synthetic EAGLE3 AL=2.12 run; 1755/1765 successful requests, 10 failed, 32 warmup requests. Predates
      the published NVCR runtime update.'
- id: vllm-agg-h200
  recommended: false
  hardware:
    gpu: H200
    count: 32
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1-a.x-k2-post.1@sha256:2aa1db2002f58d2a821f27908ef0e25e86b7c14b154249f7c68626c1c43dbccd
  topology: aggregated
  techniques:
  - fp8
  - fp8-kv-cache
  - expert-parallelism
  - eagle3
  - kv-aware-routing
  workload:
    type: chat
    traffic: W1 shared-prefix and W2 unique-input synthetic traffic, 16K input / 1K output, concurrency 16, 32, 64, and 128; sequential sweep without cache reset
  deploy:
    asset: recipes/ax-k2/vllm/agg-h200/deploy-generic.yaml
  benchmark:
    tool: aiperf
    asset: recipes/ax-k2/perf/h200/perf.yaml
  expected_performance:
    available: false
    summary: Historical cold-cache results are documented on the recipe page; current 262K sequential sweep is not yet measured.
- id: vllm-disagg-h200
  recommended: false
  hardware:
    gpu: H200
    count: 32
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.1-a.x-k2-post.1@sha256:2aa1db2002f58d2a821f27908ef0e25e86b7c14b154249f7c68626c1c43dbccd
  topology: disaggregated
  techniques:
  - fp8
  - fp8-kv-cache
  - expert-parallelism
  - eagle3
  - kv-aware-routing
  workload:
    type: chat
    traffic: W1 shared-prefix and W2 unique-input synthetic traffic, 16K input / 1K output, concurrency 16, 32, 64, and 128; sequential sweep without cache reset
  deploy:
    asset: recipes/ax-k2/vllm/disagg-h200/deploy-generic.yaml
  benchmark:
    tool: aiperf
    asset: recipes/ax-k2/perf/h200/perf.yaml
  expected_performance:
    available: false
    summary: Historical cold-cache results are documented on the recipe page; current 262K sequential sweep is not yet measured.
related_benchmarks: []
maintainer: Vanshil Shah
gaps:
- Published C16 short-trace results predate the published NVCR runtime; no measurements for this image.
- Disaggregated C16 run had 10 failed requests out of 1765; warmup differed between topologies.
- H200 page includes historical cold-cache results; current 262K manifests and sequential one-Job sweep have not been remeasured.
