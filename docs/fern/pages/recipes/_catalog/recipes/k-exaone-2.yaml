id: k-exaone-2
title: K-EXAONE 2.0
page: pages/recipes/model-recipes/k-exaone-2.mdx
provider: lg-ai-research
model:
  name: K-EXAONE 2.0 750B-A37B
  hf_id: LGAI-EXAONE/K-EXAONE-2.0-750B-A37B-NVFP4
  precision: NVFP4 W4A4 (FP8 KV cache)
status: experimental
maintainer: null
targets:
- id: vllm-agg-b200-chat
  recommended: true
  hardware:
    gpu: B200
    count: 4
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0-k-exaone-2.0-dev.1
  topology: aggregated
  techniques:
  - mtp-spec-dec
  - fp8-kv-cache
  - prefix-caching
  - kv-aware-routing
  workload:
    type: trace-replay
    traffic: Mooncake chat trace, 8K ISL / 1K OSL, ~70% prefix reuse, 1,805 requests, concurrency 7
  deploy:
    asset: recipes/k-exaone-2.0/vllm/agg-b200-chat/deploy.yaml
  benchmark:
    tool: aiperf
    asset: recipes/k-exaone-2.0/perf/perf.yaml
  expected_performance:
    available: true
    summary: 87 tok/s/GPU at concurrency 7, E2E 51.4 tok/s/user, TTFT p50 291 ms, ITL 19.15 ms, meeting a joint gate of
      E2E >= 50 tok/s/user and TTFT p50 < 5 s
- id: vllm-disagg-b200-chat
  recommended: false
  hardware:
    gpu: B200
    count: 8
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0-k-exaone-2.0-dev.1
  topology: disaggregated
  techniques:
  - disagg-pd
  - mtp-spec-dec
  - fp8-kv-cache
  - prefix-caching
  - kv-aware-routing
  - nixl-ucx
  workload:
    type: trace-replay
    traffic: Mooncake chat trace, 8K ISL / 1K OSL, ~70% prefix reuse, 1,805 requests, concurrency 7
  deploy:
    asset: recipes/k-exaone-2.0/vllm/disagg-b200-chat/deploy.yaml
  benchmark:
    tool: aiperf
    asset: recipes/k-exaone-2.0/perf/perf.yaml
  expected_performance:
    available: true
    summary: 55 tok/s/GPU at concurrency 7, E2E 70.6 tok/s/user, TTFT p50 1,018 ms, ITL 13.15 ms; quoted at the same
      concurrency as the aggregated target for comparability, and conservative because the gate is met with wide margin
gaps:
- Disaggregated is quoted at concurrency 7 for comparability with the aggregated target; its true operating point is at a higher concurrency that has not been swept.
- The InfiniBand RDMA extended-resource name in the disaggregated manifest is cluster-specific and must be adjusted per cluster.
- 1M context is not supported; the checkpoint declares 262,144 positions with unscaled rope.
