targets:
- id: vllm-agg-gb200
  recommended: true
  hardware:
    gpu: GB200
    count: 8
  runtime:
    framework: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0-deepseek-v4.1-flash-dev.1
  topology: aggregated
  techniques:
  - kv-aware-routing
  - dspark-speculative-decoding
  - expert-parallel
  - eplb
  - tp4
  - prefix-caching
  - mxfp4-indexer-kv
  - 1m-context
  workload:
    type: trace-replay
    traffic: 'Agentic Mooncake trace: 64K median ISL / 400 median OSL, ~90% KV reuse'
    sla: user output >= 50 tok/s p50 and TTFT p50 < 5 s
  deploy:
    asset: recipes/deepseek-v4.1-flash/vllm/agg-gb200-agentic/deploy-generic.yaml
  benchmark:
    tool: aiperf
    asset: recipes/deepseek-v4.1-flash/perf/perf.yaml
  expected_performance:
    available: true
    summary: c88 = 533.2 output tok/s/GPU @ user 54.23 tok/s, TTFT p50 296 ms.
