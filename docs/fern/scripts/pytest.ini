#
# Standalone config for the docs generator tests.
#
# The repo-root pytest run carries `--ignore-glob=docs/*` (pyproject.toml), so
# these tests never reach the marker-selected CI jobs. They run instead from
# the `gen-llms-tables` pre-commit hook, which points pytest here with `-c`.
# Markers mirror the repo-root registrations so the file stays valid under
# either config if docs/ is ever un-ignored.
[pytest]
addopts = -q --strict-markers
markers =
    pre_merge: marks tests to run before merging
    gpu_0: marks tests that don't require GPU
    unit: marks tests as unit tests
