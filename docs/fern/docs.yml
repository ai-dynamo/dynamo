# GitHub repository link in navbar
navbar-links:
  - type: github
    value: https://github.com/ai-dynamo/dynamo

footer: ./components/CustomFooter.tsx

layout:
  searchbar-placement: header
  page-width: 1376px
  sidebar-width: 272px
  content-width: 912px
  tabs-placement: header
  hide-feedback: true

metadata:
  canonical-host: "docs.nvidia.com/dynamo"

experimental:
  mdx-components:
    - ./components

colors:
  accentPrimary:
    dark: '#76B900'
    light: '#76B900'
  background:
    light: '#FFFFFF'
    dark: '#000000'
typography:
  bodyFont:
    name: NVIDIA
    paths:
      - path: ./assets/fonts/NVIDIASans.woff2
        style: normal
      - path: ./assets/fonts/NVIDIASans_Italic.woff2
        style: italic
  codeFont:
    name: RobotoMono
    paths:
      - path: ./assets/fonts/RobotoMono.woff2
        weight: 100 700
        style: normal
theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: ./assets/NVIDIA_dark.svg
  light: ./assets/NVIDIA_light.svg
  height: 20
  href: /dynamo/
  right-text: Dynamo

favicon: ./assets/NVIDIA_symbol.svg

js:
  - url: https://assets.adobedtm.com/5d4962a43b79/c1061d2c5e7b/launch-191c2462b890.min.js
    strategy: beforeInteractive
  - path: ./custom.js
    strategy: beforeInteractive
css:
  - ./main.css
