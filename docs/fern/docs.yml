# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: dynamo.docs.buildwithfern.com/dynamo
    custom-domain: [docs.nvidia.com/dynamo, docs.dynamo.nvidia.com/dynamo]
    multi-source: true

title: NVIDIA Dynamo Documentation

# Locales for the docs site. `en` is default; `zh-CN` enables the native
# language picker (pages under docs/fern/translations/zh-CN/pages/**). (A4)
translations:
  - lang: en
    default: true
  - lang: zh-CN

agents:
  page-directive: "For clean Markdown content of this page, append .md to this URL. For the complete documentation index, see https://docs.nvidia.com/dynamo/llms.txt. For full content including API reference and SDK examples, see https://docs.nvidia.com/dynamo/llms-full.txt."


# Render the Home experience at the bare site URL. Without a root-level
# landing page, Fern redirects the URL to the default version's first docs page.
landing-page:
  page: Home
  path: ./pages/home/index.mdx
  slug: /

# Keep Home and the documentation tabs in the same versioned navigation.
# Standalone versioning avoids rendering a product selector for one product.
versions:
  - display-name: dev
    path: ./index.yml

redirects:
  # Exact paths that published pages link to but that no longer resolve.
  # Found by crawling every published version, English and zh-CN, counting
  # Fern's "Page Not Found" 200 responses as dead. Each maps to the page the
  # source link named in that version's nav, or to the repository file at the
  # version's tag when the target is not a nav page. Kept above the pattern
  # rules, which would otherwise send some of these to pages that are also gone.
  - source: "/dynamo/archive/0.6.0/index.html"
    destination: "https://github.com/ai-dynamo/dynamo/releases/tag/v0.6.0"
  - source: "/dynamo/archive/0.6.1/index.html"
    destination: "https://github.com/ai-dynamo/dynamo/releases/tag/v0.6.1"
