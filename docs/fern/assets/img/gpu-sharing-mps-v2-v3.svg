  <text x="214.0" y="130.2" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Control daemon</text>
  <line x1="214.0" y1="146.0" x2="214.0" y2="164.0" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-ink)"/>
  <rect x="114.0" y="166.0" width="200.0" height="42.0" fill="#F3F4F6" rx="8" stroke="#9CA3AF" stroke-width="1.8"/>
