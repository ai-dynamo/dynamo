  <rect x="620.0" y="268.0" width="80.0" height="34.0" fill="#FFFFFF" rx="8" stroke="#76B900" stroke-width="1.8"/>
  <text x="660.0" y="289.9" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">pod</text>
