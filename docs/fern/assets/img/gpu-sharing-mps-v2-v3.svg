  <text x="124.0" y="266.0" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="middle">Client A</text>
  <text x="124.0" y="284.0" font-size="13" font-weight="400" fill="#5A6270" text-anchor="middle">60% · 30 GB</text>
