  <text x="680" y="106" font-size="18.0" fill="#4B5563" text-anchor="middle">hit: skip the encoder</text>
  <line x1="458" y1="250" x2="552" y2="285" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="500" y="252" font-size="19.5" font-weight="700" fill="#92400E" text-anchor="middle">miss</text>
  <line x1="748" y1="270" x2="876" y2="242" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <path d="M650,340 C650,380 360,380 360,278" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-gray)"/>
  <text x="505" y="376" font-size="18.0" fill="#4B5563" text-anchor="middle">save</text>
</svg>
