<svg xmlns="http://www.w3.org/2000/svg" width="1044" height="429" viewBox="22 28 1044 429" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Skip the vision encoder for images already encoded</title>
  <desc id="desc">On a hit, the embedding cache supplies the stored embeddings and the vision encoder is skipped. On a miss, the vision encoder runs and its output is saved to the cache.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-green-start" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker><marker id="arrow-blue-start" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker></defs>
  <rect x="22" y="28" width="1044" height="429" fill="#FFFFFF"/>
  <text x="36" y="66" font-size="25.8" font-weight="700" fill="#1A1A1A">Skip the vision encoder for images already encoded</text>
  <rect x="36" y="110" width="130" height="100" rx="10" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/>
  <rect x="84.0" y="133.0" width="34" height="26" rx="4" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/><circle cx="93.0" cy="141.0" r="3" fill="#76B900"/><polygon points="88.0,155.0 98.0,146.0 104.0,151.0 110.0,145.0 114.0,155.0" fill="#76B900"/>
  <text x="101.0" y="194" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">seen before</text>
  <rect x="36" y="260" width="130" height="100" rx="10" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/>
  <rect x="84.0" y="283.0" width="34" height="26" rx="4" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/><circle cx="93.0" cy="291.0" r="3" fill="#76B900"/><polygon points="88.0,305.0 98.0,296.0 104.0,301.0 110.0,295.0 114.0,305.0" fill="#76B900"/>
  <text x="101.0" y="344" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">new</text>
  <line x1="168" y1="160" x2="262" y2="215" stroke="#76B900" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <line x1="168" y1="310" x2="262" y2="255" stroke="#76B900" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="264" y="170" width="220" height="116" rx="10" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/>
  <path d="M361.0,202.76 v18 a13,5 0 0 0 26,0 v-18" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/><ellipse cx="374.0" cy="202.76" rx="13" ry="5" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/><path d="M361.0,211.76 a13,5 0 0 0 26,0" fill="none" stroke="#76B900" stroke-width="1.6"/>
