  <circle cx="941.0400000000001" cy="201.9" r="2.52" fill="#234CDA"/>
  <circle cx="953.36" cy="201.9" r="2.52" fill="#234CDA"/>
  <circle cx="947.2" cy="213.66" r="2.52" fill="#234CDA"/>
  <text x="950" y="240.5" font-size="19.5" font-weight="700" fill="#1A1A1A" text-anchor="middle">LLM</text>
  <line x1="150" y1="160" x2="262" y2="205" stroke="#76B900" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <line x1="150" y1="290" x2="262" y2="238" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
