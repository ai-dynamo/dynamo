<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="510" viewBox="0 0 1380 510" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Embedding cache: hit and miss paths</title>
  <desc id="desc">Images in a request are looked up in a CPU-side LRU embedding cache. An image seen before is a hit: the cached embedding is used and the vision encoder is skipped. A new image is a miss: the encode worker runs the vision encoder, sends embeddings over NIXL, and they are saved in the cache before reaching the inference engine.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#234CDA"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-green-start" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker></defs>
  <rect width="1380" height="510" fill="#FFFFFF"/>
  <text x="50" y="40" font-size="13" font-weight="700" letter-spacing="1.6" fill="#5A8F00">EMBEDDING CACHE</text>
  <text x="50" y="68" font-size="22" font-weight="700" fill="#1A1A1A">Skip the vision encoder for content it has already encoded</text>
  <rect x="50" y="200" width="200" height="100" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <text x="66" y="226" font-size="14" font-weight="700" fill="#1A1A1A">Request</text>
  <rect x="66" y="244" width="27.5" height="22" rx="4" fill="#F4F9E8" stroke="#76B900" stroke-width="2"/>
  <circle cx="73.7" cy="250.6" r="2.2" fill="#76B900"/>
  <polygon points="68.2,262.04 76.45,254.12 81.4,258.96 85.8,255.0 91.3,262.04" fill="#76B900"/>
  <circle cx="93.5" cy="244" r="5.279999999999999" fill="#76B900" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M90.86,244 L92.84,245.98 L96.36,242.02" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="262" font-size="12" fill="#4C7A00">seen before</text>
  <rect x="66" y="274" width="27.5" height="22" rx="4" fill="#F0F4FF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="73.7" cy="280.6" r="2.2" fill="#234CDA"/>
  <polygon points="68.2,292.04 76.45,284.12 81.4,288.96 85.8,285.0 91.3,292.04" fill="#234CDA"/>
  <circle cx="93.5" cy="274" r="5.279999999999999" fill="#234CDA" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="93.5" y="275.98" font-size="6.6" font-weight="700" text-anchor="middle" fill="#FFFFFF">N</text>
  <text x="112" y="292" font-size="12" fill="#234CDA">new</text>
  <line x1="252" y1="250" x2="296" y2="250" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="300" y="180" width="290" height="140" rx="10" fill="#F0F4FF" stroke="#234CDA" stroke-width="1.5"/>
  <path d="M312,194.356 L312,209.844 A11.0,3.8720000000000003 0 0 0 334,209.844 L334,194.356" fill="#F0F4FF" stroke="#234CDA" stroke-width="2"/>
  <ellipse cx="323.0" cy="194.356" rx="11.0" ry="3.8720000000000003" fill="#F0F4FF" stroke="#234CDA" stroke-width="2"/>
  <path d="M312,202.1 A11.0,3.8720000000000003 0 0 0 334,202.1" fill="none" stroke="#234CDA" stroke-width="1.5"/>
  <text x="352" y="207" font-size="13" font-weight="700" fill="#234CDA">CPU LRU embedding cache</text>
  <circle cx="319" cy="224" r="2.2" fill="#1A1A1A"/>
  <text x="328" y="228" font-size="13" fill="#1A1A1A">Holds vision encoder outputs</text>
  <circle cx="319" cy="242" r="2.2" fill="#1A1A1A"/>
  <text x="328" y="246" font-size="13" fill="#1A1A1A">Prefill worker owns it (SGLang</text>
  <text x="328" y="264" font-size="13" fill="#1A1A1A">E/PD: the encode worker)</text>
  <path d="M592,222 C640,222 640,140 690,140" fill="none" stroke="#76B900" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="650" y="196" font-size="12" fill="#4B5563" text-anchor="middle">hit</text>
  <rect x="694" y="100" width="320" height="80" rx="10" fill="#F4F9E8" stroke="#76B900" stroke-width="1.5"/>
  <text x="708" y="127" font-size="13" font-weight="700" fill="#4C7A00">Reuse the cached embedding</text>
  <text x="708" y="148" font-size="13" fill="#1A1A1A">The encode worker is skipped entirely.</text>
  <path d="M592,282 C640,282 640,372 690,372" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="650" y="330" font-size="12" fill="#4B5563" text-anchor="middle">miss</text>
  <rect x="694" y="332" width="250" height="100" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="1.5"/>
  <text x="708" y="359" font-size="13" font-weight="700" fill="#92400E">Encode worker</text>
  <text x="708" y="380" font-size="13" fill="#1A1A1A">Runs the vision encoder on the</text>
  <text x="708" y="398" font-size="13" fill="#1A1A1A">new image.</text>
  <line x1="946" y1="382" x2="990" y2="382" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="968" y="372" font-size="12" fill="#4B5563" text-anchor="middle">NIXL</text>
  <rect x="994" y="332" width="170" height="100" rx="10" fill="#F4F9E8" stroke="#76B900" stroke-width="1.5"/>
  <text x="1008" y="359" font-size="13" font-weight="700" fill="#4C7A00">Save to cache</text>
  <text x="1008" y="380" font-size="13" fill="#1A1A1A">Stored for next</text>
  <text x="1008" y="398" font-size="13" fill="#1A1A1A">time.</text>
  <rect x="1190" y="206" width="150" height="104" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <text x="1204" y="233" font-size="13" font-weight="700" fill="#1A1A1A">Inference engine</text>
  <text x="1204" y="254" font-size="13" fill="#4B5563">Prefill and</text>
  <text x="1204" y="272" font-size="13" fill="#4B5563">decode.</text>
  <line x1="1016" y1="140" x2="1186" y2="232" stroke="#76B900" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <line x1="1166" y1="382" x2="1262" y2="312" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="50" y="490" font-size="13" fill="#4B5563">The embedding cache is separate from the KV cache. KV reuse skips prefill; the embedding cache skips image encoding. Use both together.</text>
</svg>
