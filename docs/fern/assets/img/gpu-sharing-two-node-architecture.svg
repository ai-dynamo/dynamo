<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Example: two MPS-enabled GPU nodes in one Kubernetes cluster</title>
  <desc id="desc">Cluster services run KAI-Scheduler, the Dynamo operator, one Dynamo frontend per model, and the GPU Operator. Each of two GPU nodes with four H100 80GB GPUs runs mpsd, which starts one MPS v3 server per GPU, and fractiond, which wires each pod to its own namespace. On gpu-node-1, GPU 0 holds chat-8b at 0.5, code-7b at 0.3 and guard-1b at 0.2; GPU 1 holds tenant-a-8b and tenant-b-8b at 0.4 each and embed at 0.2; GPU 2 holds sql-7b and summarize-3b at 0.3 each and rerank at 0.2, with 0.2 free; GPU 3 is free. On gpu-node-2, GPUs 0 and 1 run chat-70b as a whole-GPU tensor-parallel model without MPS; GPU 2 holds four fine-tuned tenant models at 0.25 each; GPU 3 holds vision-7b at 0.6 and ocr-2b at 0.2, with 0.2 free.</desc>
