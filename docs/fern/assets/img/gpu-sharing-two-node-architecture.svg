<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Example: two MPS-enabled GPU nodes in one Kubernetes cluster</title>
  <desc id="desc">Cluster services: KAI-Scheduler, Dynamo operator, Dynamo frontends, GPU Operator. Two GPU nodes, each with four H100 80GB GPUs, mpsd, and fractiond. gpu-node-1: GPU 0 holds chat-8b 0.5, code-7b 0.3, guard-1b 0.2; GPU 1 holds tenant-a-8b 0.4, tenant-b-8b 0.4, embed 0.2; GPU 2 holds sql-7b 0.3, summarize-3b 0.3, rerank 0.2, with 0.2 free; GPU 3 is free. gpu-node-2: GPUs 0 and 1 run chat-70b on whole GPUs without MPS; GPU 2 holds four tenant models at 0.25 each; GPU 3 holds vision-7b 0.6 and ocr-2b 0.2, with 0.2 free.</desc>
