  <rect x="66.4" y="156.4" width="13.2" height="13.2" rx="3" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
  <rect x="69.92" y="159.92" width="6.16" height="6.16" fill="#374151"/>
  <line x1="68.6" y1="152" x2="68.6" y2="156.4" stroke="#374151" stroke-width="2"/><line x1="68.6" y1="169.6" x2="68.6" y2="174" stroke="#374151" stroke-width="2"/>
  <line x1="62" y1="158.6" x2="66.4" y2="158.6" stroke="#374151" stroke-width="2"/><line x1="79.6" y1="158.6" x2="84" y2="158.6" stroke="#374151" stroke-width="2"/>
  <line x1="73.0" y1="152" x2="73.0" y2="156.4" stroke="#374151" stroke-width="2"/><line x1="73.0" y1="169.6" x2="73.0" y2="174" stroke="#374151" stroke-width="2"/>
  <line x1="62" y1="163.0" x2="66.4" y2="163.0" stroke="#374151" stroke-width="2"/><line x1="79.6" y1="163.0" x2="84" y2="163.0" stroke="#374151" stroke-width="2"/>
  <line x1="77.4" y1="152" x2="77.4" y2="156.4" stroke="#374151" stroke-width="2"/><line x1="77.4" y1="169.6" x2="77.4" y2="174" stroke="#374151" stroke-width="2"/>
  <line x1="62" y1="167.4" x2="66.4" y2="167.4" stroke="#374151" stroke-width="2"/><line x1="79.6" y1="167.4" x2="84" y2="167.4" stroke="#374151" stroke-width="2"/>
