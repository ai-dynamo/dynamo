  <text x="78" y="213" font-size="13" font-weight="700" fill="#374151">Model A</text>
  <circle cx="83" cy="230" r="2.2" fill="#1A1A1A"/>
  <text x="92" y="234" font-size="12.5" fill="#1A1A1A">All of the memory</text>
  <circle cx="83" cy="248" r="2.2" fill="#1A1A1A"/>
  <text x="92" y="252" font-size="12.5" fill="#1A1A1A">All streaming multiprocessors (SMs)</text>
  <text x="64" y="306" font-size="12" font-weight="700" fill="#4B5563">SMs</text>
  <rect x="64" y="314" width="312" height="30" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="220.0" y="333.0" font-size="12" font-weight="700" fill="#374151" text-anchor="middle">Model A, always</text>
  <rect x="494" y="186" width="150" height="96" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="1.5"/>
  <text x="508" y="213" font-size="13" font-weight="700" fill="#92400E">Model A</text>
  <circle cx="513" cy="230" r="2.2" fill="#1A1A1A"/>
  <text x="522" y="234" font-size="12.5" fill="#1A1A1A">Half the memory,</text>
  <text x="522" y="252" font-size="12.5" fill="#1A1A1A">a hard cap</text>
  <rect x="654" y="186" width="150" height="96" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="1.5"/>
  <text x="668" y="213" font-size="13" font-weight="700" fill="#92400E">Model B</text>
  <circle cx="673" cy="230" r="2.2" fill="#1A1A1A"/>
