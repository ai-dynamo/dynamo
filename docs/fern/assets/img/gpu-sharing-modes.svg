  <line x1="937.4" y1="152" x2="937.4" y2="156.4" stroke="#374151" stroke-width="2"/><line x1="937.4" y1="169.6" x2="937.4" y2="174" stroke="#374151" stroke-width="2"/>
  <line x1="922" y1="167.4" x2="926.4" y2="167.4" stroke="#374151" stroke-width="2"/><line x1="939.6" y1="167.4" x2="944" y2="167.4" stroke="#374151" stroke-width="2"/>
  <text x="952" y="170" font-size="12" font-weight="700" fill="#374151">One GPU</text>
