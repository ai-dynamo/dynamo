  <text x="50" y="68" font-size="22" font-weight="700" fill="#1A1A1A">Three ways to place Qwen3-4B on a GPU</text>
  <text x="50" y="108" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4B5563">BASELINE</text>
  <text x="50" y="130" font-size="13" font-weight="700" fill="#1A1A1A">One model per GPU</text>
