  <line x1="492" y1="163.0" x2="496.4" y2="163.0" stroke="#374151" stroke-width="2"/><line x1="509.6" y1="163.0" x2="514" y2="163.0" stroke="#374151" stroke-width="2"/>
  <line x1="507.4" y1="152" x2="507.4" y2="156.4" stroke="#374151" stroke-width="2"/><line x1="507.4" y1="169.6" x2="507.4" y2="174" stroke="#374151" stroke-width="2"/>
  <line x1="492" y1="167.4" x2="496.4" y2="167.4" stroke="#374151" stroke-width="2"/><line x1="509.6" y1="167.4" x2="514" y2="167.4" stroke="#374151" stroke-width="2"/>
  <text x="522" y="170" font-size="12" font-weight="700" fill="#374151">One GPU</text>
  <text x="910" y="108" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4B5563">GPU FRACTIONS</text>
  <text x="910" y="130" font-size="13" font-weight="700" fill="#1A1A1A">Two models, memory and compute limits</text>
  <rect x="910" y="144" width="340" height="226" rx="12" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
  <rect x="926.4" y="156.4" width="13.2" height="13.2" rx="3" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
  <rect x="929.92" y="159.92" width="6.16" height="6.16" fill="#374151"/>
