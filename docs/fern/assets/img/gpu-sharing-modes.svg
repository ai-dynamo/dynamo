  <text x="924" y="306" font-size="12" font-weight="700" fill="#4B5563">SMs, capped at half each, running concurrently</text>
  <rect x="924" y="314" width="156" height="30" rx="4" fill="#DCEFB5" stroke="#76B900" stroke-width="1.5"/>
  <text x="1002.0" y="333.0" font-size="12" font-weight="700" fill="#4C7A00" text-anchor="middle">A</text>
