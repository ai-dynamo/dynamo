<svg xmlns="http://www.w3.org/2000/svg" width="1028" height="302" viewBox="36 8 1028 302" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">GPU sharing: one model per GPU versus two</title>
  <desc id="desc">The baseline runs one model per GPU. HAMi runs two models on a GPU with memory caps and time-slices compute between them. GPU fractions give each model half the memory and half the compute, running concurrently.</desc>
