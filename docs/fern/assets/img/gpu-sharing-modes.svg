  <text x="1158.0" y="333.0" font-size="12" font-weight="700" fill="#4C7A00" text-anchor="middle">B</text>
  <text x="50" y="402" font-size="13" font-weight="700" fill="#1A1A1A">Built from</text>
  <text x="50" y="424" font-size="13" fill="#4B5563">HAMi: KAI-Scheduler places pods on a GPU fraction, and HAMi caps each pod's memory.</text>
  <text x="50" y="446" font-size="13" fill="#4B5563">GPU fractions: KAI-Scheduler and kai-gpu-fractioning, with each pod in its own MPS namespace that enforces its SM share.</text>
