<svg xmlns="http://www.w3.org/2000/svg" width="1118" height="351" viewBox="22 27 1118 351" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Higher priority goes first when workers are busy</title>
  <desc id="desc">Requests arrive in order, with three background requests ahead of an interactive one. In the router queue, the interactive request moves ahead of the background ones. Priority acts at three places: the router queue, the engine scheduler, and KV cache eviction.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-green-start" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker><marker id="arrow-blue-start" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker></defs>
  <rect x="22" y="27" width="1118" height="351" fill="#FFFFFF"/>
  <text x="36" y="66" font-size="27.6" font-weight="700" fill="#1A1A1A">Higher priority goes first when workers are busy</text>
  <text x="36" y="108" font-size="15" font-weight="700" fill="#5A6572" text-anchor="start" letter-spacing="1.2">ARRIVAL</text>
  <rect x="36" y="122" width="116" height="54" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="2"/>
  <text x="94" y="155" font-size="15.5" font-weight="700" fill="#92400E" text-anchor="middle">Background</text>
  <rect x="164" y="122" width="116" height="54" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="2"/>
  <text x="222" y="155" font-size="15.5" font-weight="700" fill="#92400E" text-anchor="middle">Background</text>
  <rect x="292" y="122" width="116" height="54" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="2"/>
  <text x="350" y="155" font-size="15.5" font-weight="700" fill="#92400E" text-anchor="middle">Background</text>
  <rect x="420" y="122" width="116" height="54" rx="10" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/>
  <text x="478" y="155" font-size="15.5" font-weight="700" fill="#3F6600" text-anchor="middle">Interactive</text>
  <line x1="552" y1="149" x2="624" y2="149" stroke="#76B900" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="626" y="98" width="500" height="104" rx="12" fill="#F4F9E8" stroke="#76B900" stroke-width="1.5"/>
  <text x="646" y="124" font-size="15" font-weight="700" fill="#5A6572" text-anchor="start" letter-spacing="1.2">ROUTER QUEUE</text>
  <rect x="646" y="138" width="110" height="50" rx="10" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/>
  <text x="701" y="168" font-size="15" font-weight="700" fill="#3F6600" text-anchor="middle">Interactive</text>
  <rect x="764" y="138" width="110" height="50" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="2"/>
  <text x="819" y="168" font-size="15" font-weight="700" fill="#92400E" text-anchor="middle">Background</text>
  <rect x="882" y="138" width="110" height="50" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="2"/>
  <text x="937" y="168" font-size="15" font-weight="700" fill="#92400E" text-anchor="middle">Background</text>
  <rect x="1000" y="138" width="110" height="50" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="2"/>
  <text x="1055" y="168" font-size="15" font-weight="700" fill="#92400E" text-anchor="middle">Background</text>
  <text x="36" y="262" font-size="15" font-weight="700" fill="#5A6572" text-anchor="start" letter-spacing="1.2">THREE PLACES PRIORITY CAN ACT</text>
  <rect x="36" y="280" width="320" height="84" rx="10" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/>
  <circle cx="60" cy="300" r="11" fill="#5A8F00"/>
