  <text x="50" y="68" font-size="22" font-weight="700" fill="#1A1A1A">Higher priority goes first when workers are busy</text>
  <text x="50" y="112" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4B5563">ARRIVAL</text>
  <rect x="50.0" y="125.0" width="112" height="50" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="1.5"/>
  <text x="106.0" y="152.5" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">Background</text>
  <rect x="176.0" y="125.0" width="112" height="50" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="1.5"/>
  <text x="232.0" y="152.5" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">Background</text>
  <rect x="302.0" y="125.0" width="112" height="50" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="1.5"/>
  <text x="358.0" y="152.5" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">Background</text>
