  <text x="1066.0" y="160.5" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">Background</text>
  <text x="50" y="244" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4B5563">THREE PLACES PRIORITY CAN ACT</text>
