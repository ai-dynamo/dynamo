  <text x="136" y="328" font-size="18" font-weight="700" fill="#1A1A1A" text-anchor="start">Router queue</text>
  <line x1="358" y1="322" x2="414" y2="322" stroke="#76B900" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="416" y="280" width="320" height="84" rx="10" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/>
  <circle cx="440" cy="300" r="11" fill="#5A8F00"/>
  <text x="440" y="304.5" font-size="13.8" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <rect x="466.0" y="310.0" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/><rect x="472.0" y="316.0" width="12.0" height="12.0" fill="#76B900"/><line x1="473.2" y1="305.0" x2="473.2" y2="310.0" stroke="#76B900" stroke-width="2" stroke-linecap="round"/><line x1="473.2" y1="334.0" x2="473.2" y2="339.0" stroke="#76B900" stroke-width="2" stroke-linecap="round"/><line x1="461.0" y1="317.2" x2="466.0" y2="317.2" stroke="#76B900" stroke-width="2" stroke-linecap="round"/><line x1="490.0" y1="317.2" x2="495.0" y2="317.2" stroke="#76B900" stroke-width="2" stroke-linecap="round"/><line x1="482.8" y1="305.0" x2="482.8" y2="310.0" stroke="#76B900" stroke-width="2" stroke-linecap="round"/><line x1="482.8" y1="334.0" x2="482.8" y2="339.0" stroke="#76B900" stroke-width="2" stroke-linecap="round"/><line x1="461.0" y1="326.8" x2="466.0" y2="326.8" stroke="#76B900" stroke-width="2" stroke-linecap="round"/><line x1="490.0" y1="326.8" x2="495.0" y2="326.8" stroke="#76B900" stroke-width="2" stroke-linecap="round"/>
  <text x="516" y="328" font-size="18" font-weight="700" fill="#1A1A1A" text-anchor="start">Engine scheduler</text>
  <line x1="738" y1="322" x2="794" y2="322" stroke="#76B900" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="796" y="280" width="320" height="84" rx="10" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/>
  <circle cx="820" cy="300" r="11" fill="#5A8F00"/>
  <text x="820" y="304.5" font-size="13.8" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <rect x="845" y="313" width="7" height="8" rx="1.5" fill="#76B900" fill-opacity="1" stroke="#76B900" stroke-width="1.2"/><rect x="845" y="323" width="7" height="8" rx="1.5" fill="#76B900" fill-opacity="0.35" stroke="#76B900" stroke-width="1.2"/><rect x="854" y="313" width="7" height="8" rx="1.5" fill="#76B900" fill-opacity="0.35" stroke="#76B900" stroke-width="1.2"/><rect x="854" y="323" width="7" height="8" rx="1.5" fill="#76B900" fill-opacity="1" stroke="#76B900" stroke-width="1.2"/><rect x="863" y="313" width="7" height="8" rx="1.5" fill="#76B900" fill-opacity="1" stroke="#76B900" stroke-width="1.2"/><rect x="863" y="323" width="7" height="8" rx="1.5" fill="#76B900" fill-opacity="0.35" stroke="#76B900" stroke-width="1.2"/>
  <text x="896" y="328" font-size="18" font-weight="700" fill="#1A1A1A" text-anchor="start">KV cache eviction</text>
</svg>