  <text x="484.0" y="152.5" font-size="13" font-weight="700" fill="#4C7A00" text-anchor="middle">Interactive</text>
  <line x1="554" y1="150" x2="610" y2="150" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="616" y="100" width="544" height="100" rx="12" fill="#F0F4FF" stroke="#234CDA" stroke-width="1.5"/>
  <text x="632" y="120" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4B5563">ROUTER QUEUE</text>
  <rect x="632.0" y="133.0" width="112" height="50" rx="10" fill="#F4F9E8" stroke="#76B900" stroke-width="1.5"/>
  <text x="688.0" y="160.5" font-size="13" font-weight="700" fill="#4C7A00" text-anchor="middle">Interactive</text>
