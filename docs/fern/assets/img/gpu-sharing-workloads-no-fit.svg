  <line x1="676.0" y1="564.0" x2="722.0" y2="564.0" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#a-gray)"/>
  <rect x="734.0" y="520.0" width="482.0" height="88.0" fill="#EAF5D3" rx="12" stroke="#76B900" stroke-width="1.5"/>
  <text x="754.0" y="561.0" font-size="16" font-weight="700" fill="#3B6B00" text-anchor="start">MIG, or separate GPUs</text>
