  <rect x="36.0" y="330.0" width="88.0" height="68.0" fill="#FBE3E3" rx="8"/>
  <rect x="44.0" y="354.0" width="72.0" height="22.0" fill="#FFFFFF" rx="4" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="47.0" y="357.0" width="64.0" height="16.0" fill="#DDEBFD" rx="2" stroke="#2F80ED" stroke-width="1.2"/>
  <text x="80.0" y="348.0" font-size="11" font-weight="700" fill="#5A6270" text-anchor="middle">memory</text>
  <text x="112.0" y="388.0" font-size="11" font-weight="700" fill="#C62828" text-anchor="end">full</text>
  <text x="140.0" y="359.0" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">A model whose weights and KV cache need most of the GPU's</text>
  <text x="140.0" y="379.0" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">memory</text>
  <line x1="676.0" y1="364.0" x2="722.0" y2="364.0" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#a-gray)"/>
  <rect x="734.0" y="320.0" width="482.0" height="88.0" fill="#EAF5D3" rx="12" stroke="#76B900" stroke-width="1.5"/>
  <text x="754.0" y="361.0" font-size="16" font-weight="700" fill="#3B6B00" text-anchor="start">Dedicated GPUs</text>
  <text x="754.0" y="383.0" font-size="14" font-weight="400" fill="#1A1A1A" text-anchor="start">there is no room for a neighbor</text>
  <rect x="24.0" y="420.0" width="640.0" height="88.0" fill="#FFFFFF" rx="12" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="36.0" y="430.0" width="88.0" height="68.0" fill="#FBE3E3" rx="8"/>
  <line x1="42.0" y1="489.0" x2="118.0" y2="489.0" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44.0" y1="456.0" x2="116.0" y2="456.0" stroke="#C62828" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/>
  <path d="M44,480.0 L68,478.0 L76,446.0 L84,478.0 L116,480.0" stroke="#2F80ED" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="140.0" y="459.0" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Strict tail-latency targets that can't absorb a neighbor's</text>
  <text x="140.0" y="479.0" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">memory bandwidth or power draw</text>
  <line x1="676.0" y1="464.0" x2="722.0" y2="464.0" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#a-gray)"/>
  <rect x="734.0" y="420.0" width="482.0" height="88.0" fill="#EAF5D3" rx="12" stroke="#76B900" stroke-width="1.5"/>
  <text x="754.0" y="461.0" font-size="16" font-weight="700" fill="#3B6B00" text-anchor="start">Dedicated GPUs, or MIG</text>
  <text x="754.0" y="483.0" font-size="14" font-weight="400" fill="#1A1A1A" text-anchor="start">MIG partitions memory bandwidth</text>
  <rect x="24.0" y="520.0" width="640.0" height="88.0" fill="#FFFFFF" rx="12" stroke="#D1D5DB" stroke-width="1.5"/>
