<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="632" viewBox="0 0 1240 632" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Workloads that don't fit GPU fractions</title>
  <desc id="desc">Five kinds of workload that don't fit MPS GPU fractions, each with a better choice. One model with enough traffic to keep a GPU busy: use Dedicated GPUs, scaled with whole-GPU replicas. Replicas of one model, or LoRA adapters of one base model: use One engine per base model, with batching or multi-LoRA serving. A model whose weights and KV cache need most of the GPU's memory: use Dedicated GPUs, there is no room for a neighbor. Strict tail-latency targets that can't absorb a neighbor's memory bandwidth or power draw: use Dedicated GPUs, or MIG, MIG partitions memory bandwidth. Tenants that don't trust each other, or must not share a fault domain: use MIG, or separate GPUs, each gets its own fault domain.</desc>
  <defs><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker></defs>
  <rect x="0.0" y="0.0" width="1240.0" height="632.0" fill="#FFFFFF"/>
  <text x="24.0" y="44.0" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">Workloads that don't fit GPU fractions</text>
  <text x="24.0" y="70.0" font-size="15" font-weight="400" fill="#5A6270" text-anchor="start">Each of these is better served another way.</text>
  <text x="40.0" y="106.0" font-size="13" font-weight="700" fill="#5A6270" text-anchor="start">Workload</text>
  <text x="750.0" y="106.0" font-size="13" font-weight="700" fill="#5A6270" text-anchor="start">Better choice</text>
  <rect x="24.0" y="120.0" width="640.0" height="88.0" fill="#FFFFFF" rx="12" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="36.0" y="130.0" width="88.0" height="68.0" fill="#FBE3E3" rx="8"/>
  <rect x="44.0" y="142.0" width="72.0" height="44.0" fill="#FFFFFF" rx="5" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="49.0" y="147.0" width="62.0" height="34.0" fill="#DDEBFD" rx="3" stroke="#2F80ED" stroke-width="1.2"/>
  <text x="80.0" y="169.0" font-size="12" font-weight="700" fill="#2F80ED" text-anchor="middle">100%</text>
  <text x="140.0" y="169.0" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">One model with enough traffic to keep a GPU busy</text>
  <line x1="676.0" y1="164.0" x2="722.0" y2="164.0" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" marker-end="url(#a-gray)"/>
  <rect x="734.0" y="120.0" width="482.0" height="88.0" fill="#EAF5D3" rx="12" stroke="#76B900" stroke-width="1.5"/>
  <text x="754.0" y="161.0" font-size="16" font-weight="700" fill="#3B6B00" text-anchor="start">Dedicated GPUs</text>
  <text x="754.0" y="183.0" font-size="14" font-weight="400" fill="#1A1A1A" text-anchor="start">scaled with whole-GPU replicas</text>
  <rect x="24.0" y="220.0" width="640.0" height="88.0" fill="#FFFFFF" rx="12" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="36.0" y="230.0" width="88.0" height="68.0" fill="#FBE3E3" rx="8"/>
