<svg xmlns="http://www.w3.org/2000/svg" width="1052" height="629" viewBox="22 9 1052 629" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Aggregated versus EPD serving</title>
  <desc id="desc">In aggregated serving, one worker does media decode, preprocessing, the vision encoder, prefill, and decode. In EPD serving, a prefill worker checks the embedding cache first and calls encoder workers over NIXL on a miss, then runs LLM prefill and sends the KV cache over NIXL to a decode worker.</desc>
