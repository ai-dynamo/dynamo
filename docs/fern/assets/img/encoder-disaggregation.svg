<svg xmlns="http://www.w3.org/2000/svg" width="1052" height="610" viewBox="22 28 1052 610" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Aggregated versus EPD serving</title>
  <desc id="desc">In aggregated serving, one worker does media decode, preprocessing, the vision encoder, prefill, and decode. In E/PD disaggregated serving, encoder workers do media decode, preprocessing, and the vision encoder, and send embeddings over NIXL to PD workers that run prefill and decode. A prefill worker checks the embedding cache first and calls the encoder workers only on a miss.</desc>
