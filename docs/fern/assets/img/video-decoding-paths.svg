<svg xmlns="http://www.w3.org/2000/svg" width="978" height="381" viewBox="36 10 978 381" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Where video is decoded</title>
  <desc id="desc">H.264 and H.265 decode on the GPU with NVDEC. VP8 and VP9 decode on the CPU in the Rust frontend when frontend decoding is on. Without frontend decoding, the backend decodes with a Python library.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#234CDA"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-green-start" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker></defs>
  <rect x="36" y="10" width="978" height="381" fill="#FFFFFF"/>
  <text x="50" y="40" font-size="14.3" font-weight="700" letter-spacing="1.6" fill="#5A8F00">VIDEO DECODING</text>
  <text x="50" y="68" font-size="24.2" font-weight="700" fill="#1A1A1A">Each codec has its own decoder</text>
  <rect x="70" y="170" width="57.2" height="44" rx="4" fill="#F0F4FF" stroke="#234CDA" stroke-width="2"/>
  <polygon points="92.88,182.32 92.88,201.68 110.03999999999999,192.0" fill="#234CDA"/>
  <rect x="74.576" y="178.8" width="5.720000000000001" height="5.279999999999999" fill="#234CDA"/>
  <rect x="74.576" y="189.8" width="5.720000000000001" height="5.279999999999999" fill="#234CDA"/>
  <rect x="74.576" y="200.8" width="5.720000000000001" height="5.279999999999999" fill="#234CDA"/>
  <text x="100" y="252" font-size="18.2" font-weight="700" fill="#1A1A1A" text-anchor="middle">Video</text>
  <rect x="310.0" y="123.0" width="260" height="62" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <text x="440" y="157.0" font-size="18.2" font-weight="700" fill="#1A1A1A" text-anchor="middle">H.264, H.265</text>
  <rect x="720.0" y="123.0" width="280" height="62" rx="10" fill="#F4F9E8" stroke="#76B900" stroke-width="1.5"/>
  <text x="860" y="157.0" font-size="18.2" font-weight="700" fill="#4C7A00" text-anchor="middle">NVDEC on the GPU</text>
  <line x1="572" y1="154" x2="716" y2="154" stroke="#76B900" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <line x1="160" y1="205" x2="308" y2="154" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="310.0" y="219.0" width="260" height="62" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <text x="440" y="253.0" font-size="18.2" font-weight="700" fill="#1A1A1A" text-anchor="middle">VP8, VP9</text>
  <rect x="720.0" y="219.0" width="280" height="62" rx="10" fill="#F4F9E8" stroke="#76B900" stroke-width="1.5"/>
  <text x="860" y="253.0" font-size="18.2" font-weight="700" fill="#4C7A00" text-anchor="middle">Frontend CPU (FFmpeg)</text>
  <line x1="572" y1="250" x2="716" y2="250" stroke="#76B900" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <line x1="160" y1="205" x2="308" y2="250" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="310.0" y="315.0" width="260" height="62" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <text x="440" y="349.0" font-size="18.2" font-weight="700" fill="#1A1A1A" text-anchor="middle">Without --frontend-decoding</text>
  <rect x="720.0" y="315.0" width="280" height="62" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="1.5"/>
  <text x="860" y="349.0" font-size="18.2" font-weight="700" fill="#92400E" text-anchor="middle">Backend Python library</text>
  <line x1="572" y1="346" x2="716" y2="346" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <line x1="160" y1="205" x2="308" y2="346" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
