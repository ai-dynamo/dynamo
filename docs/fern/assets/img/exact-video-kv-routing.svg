<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="694" viewBox="0 0 1200 694" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Exact video KV routing</title>
  <desc id="desc">A chat request with a video arrives at the frontend. The frontend decodes and samples the video, hashes the decoded content, reproduces the worker's video token layout with a model adapter, builds a routing-only prompt, and scores workers by KV overlap and load. The worker that holds the clip's KV blocks is selected.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#234CDA"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-green-start" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker></defs>
  <rect width="1200" height="694" fill="#FFFFFF"/>
  <text x="50" y="40" font-size="13" font-weight="700" letter-spacing="1.6" fill="#5A8F00">EXACT VIDEO KV ROUTING</text>
  <text x="50" y="68" font-size="22" font-weight="700" fill="#1A1A1A">How the frontend credits cached video blocks</text>
  <rect x="380.0" y="96" width="440" height="74" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <rect x="396.0" y="112" width="46.800000000000004" height="36" rx="4" fill="#F4F9E8" stroke="#76B900" stroke-width="2"/>
  <polygon points="414.72,122.08 414.72,137.92 428.76,130.0" fill="#76B900"/>
  <rect x="399.744" y="119.2" width="4.680000000000001" height="4.32" fill="#76B900"/>
  <rect x="399.744" y="128.2" width="4.680000000000001" height="4.32" fill="#76B900"/>
  <rect x="399.744" y="137.2" width="4.680000000000001" height="4.32" fill="#76B900"/>
  <text x="464.0" y="128" font-size="14" font-weight="700" fill="#1A1A1A">Chat request with a video</text>
  <text x="464.0" y="150" font-size="12.5" fill="#4B5563">The same clip appeared in an earlier request</text>
  <line x1="600.0" y1="172" x2="600.0" y2="214" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="38" y="216" width="1124" height="214" rx="12" fill="#F0F4FF" stroke="#234CDA" stroke-width="1.5"/>
  <text x="54" y="238" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4B5563">DYNAMO FRONTEND  (requires --frontend-decoding)</text>
  <rect x="54" y="254" width="199.2" height="158" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="80" cy="280" r="13" fill="#234CDA"/>
  <text x="80" y="285" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="102" y="285" font-size="15" font-weight="700" fill="#1A1A1A">Decode and sample</text>
  <circle cx="73" cy="303" r="2.2" fill="#4B5563"/>
  <text x="82" y="307" font-size="13" fill="#4B5563">Samples up to DYN_MM_V</text>
  <text x="82" y="325" font-size="13" fill="#4B5563">IDEO_NUM_FRAMES frames</text>
  <text x="82" y="343" font-size="13" fill="#4B5563">(default 32)</text>
  <rect x="277.2" y="254" width="199.2" height="158" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="303.2" cy="280" r="13" fill="#234CDA"/>
  <text x="303.2" y="285" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="325.2" y="285" font-size="15" font-weight="700" fill="#1A1A1A">Hash the decoded</text>
  <text x="325.2" y="303" font-size="15" font-weight="700" fill="#1A1A1A">video</text>
  <circle cx="296.2" cy="321" r="2.2" fill="#4B5563"/>
  <text x="305.2" y="325" font-size="13" fill="#4B5563">XXH3-64 over sampled</text>
  <text x="305.2" y="343" font-size="13" fill="#4B5563">RGB frames, shape, and</text>
  <text x="305.2" y="361" font-size="13" fill="#4B5563">timing metadata</text>
  <rect x="500.4" y="254" width="199.2" height="158" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="526.4" cy="280" r="13" fill="#234CDA"/>
  <text x="526.4" y="285" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="548.4" y="285" font-size="15" font-weight="700" fill="#1A1A1A">Reproduce the</text>
  <text x="548.4" y="303" font-size="15" font-weight="700" fill="#1A1A1A">token layout</text>
  <circle cx="519.4" cy="321" r="2.2" fill="#4B5563"/>
  <text x="528.4" y="325" font-size="13" fill="#4B5563">A model adapter turns</text>
  <text x="528.4" y="343" font-size="13" fill="#4B5563">frame count, size,</text>
  <text x="528.4" y="361" font-size="13" fill="#4B5563">FPS, and timestamps</text>
  <text x="528.4" y="379" font-size="13" fill="#4B5563">into the worker's</text>
  <text x="528.4" y="397" font-size="13" fill="#4B5563">video tokens</text>
  <rect x="723.5999999999999" y="254" width="199.2" height="158" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="749.5999999999999" cy="280" r="13" fill="#234CDA"/>
  <text x="749.5999999999999" y="285" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="771.5999999999999" y="285" font-size="15" font-weight="700" fill="#1A1A1A">Build the routing</text>
  <text x="771.5999999999999" y="303" font-size="15" font-weight="700" fill="#1A1A1A">view</text>
  <circle cx="742.5999999999999" cy="321" r="2.2" fill="#4B5563"/>
  <text x="751.5999999999999" y="325" font-size="13" fill="#4B5563">Video tokens carry the</text>
  <text x="751.5999999999999" y="343" font-size="13" fill="#4B5563">hash into each KV</text>
  <text x="751.5999999999999" y="361" font-size="13" fill="#4B5563">block's media info</text>
  <rect x="946.8" y="254" width="199.2" height="158" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="972.8" cy="280" r="13" fill="#234CDA"/>
  <text x="972.8" y="285" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="994.8" y="285" font-size="15" font-weight="700" fill="#1A1A1A">Score the workers</text>
  <circle cx="965.8" cy="303" r="2.2" fill="#4B5563"/>
  <text x="974.8" y="307" font-size="13" fill="#4B5563">KV overlap credit</text>
  <text x="974.8" y="325" font-size="13" fill="#4B5563">against projected load</text>
  <circle cx="965.8" cy="339" r="2.2" fill="#4B5563"/>
  <text x="974.8" y="343" font-size="13" fill="#4B5563">Lowest combined cost</text>
  <text x="974.8" y="361" font-size="13" fill="#4B5563">wins</text>
  <line x1="255.2" y1="333.0" x2="275.2" y2="333.0" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="478.4" y1="333.0" x2="498.4" y2="333.0" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="701.5999999999999" y1="333.0" x2="721.5999999999999" y2="333.0" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="924.8" y1="333.0" x2="944.8" y2="333.0" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="48.0" y="506" width="340" height="86" rx="6" fill="#F4F9E8" stroke="#76B900" stroke-width="3"/>
  <rect x="64.4" y="520.4" width="13.2" height="13.2" rx="3" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
  <rect x="67.92" y="523.92" width="6.16" height="6.16" fill="#374151"/>
  <line x1="66.6" y1="516" x2="66.6" y2="520.4" stroke="#374151" stroke-width="2"/><line x1="66.6" y1="533.6" x2="66.6" y2="538" stroke="#374151" stroke-width="2"/>
  <line x1="60.0" y1="522.6" x2="64.4" y2="522.6" stroke="#374151" stroke-width="2"/><line x1="77.6" y1="522.6" x2="82.0" y2="522.6" stroke="#374151" stroke-width="2"/>
  <line x1="71.0" y1="516" x2="71.0" y2="520.4" stroke="#374151" stroke-width="2"/><line x1="71.0" y1="533.6" x2="71.0" y2="538" stroke="#374151" stroke-width="2"/>
  <line x1="60.0" y1="527.0" x2="64.4" y2="527.0" stroke="#374151" stroke-width="2"/><line x1="77.6" y1="527.0" x2="82.0" y2="527.0" stroke="#374151" stroke-width="2"/>
  <line x1="75.4" y1="516" x2="75.4" y2="520.4" stroke="#374151" stroke-width="2"/><line x1="75.4" y1="533.6" x2="75.4" y2="538" stroke="#374151" stroke-width="2"/>
  <line x1="60.0" y1="531.4" x2="64.4" y2="531.4" stroke="#374151" stroke-width="2"/><line x1="77.6" y1="531.4" x2="82.0" y2="531.4" stroke="#374151" stroke-width="2"/>
  <text x="100.0" y="533" font-size="13" font-weight="700" fill="#4C7A00">Worker A</text>
  <circle cx="67.0" cy="550" r="2.2" fill="#1A1A1A"/>
  <text x="76.0" y="554" font-size="13" fill="#1A1A1A">Holds this clip's KV blocks</text>
  <circle cx="67.0" cy="568" r="2.2" fill="#1A1A1A"/>
  <text x="76.0" y="572" font-size="13" fill="#1A1A1A">Cache credit outweighs its load</text>
  <rect x="430.0" y="506" width="340" height="86" rx="6" fill="#F7F8FA" stroke="#374151" stroke-width="2.5"/>
  <rect x="446.4" y="520.4" width="13.2" height="13.2" rx="3" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
  <rect x="449.92" y="523.92" width="6.16" height="6.16" fill="#374151"/>
  <line x1="448.6" y1="516" x2="448.6" y2="520.4" stroke="#374151" stroke-width="2"/><line x1="448.6" y1="533.6" x2="448.6" y2="538" stroke="#374151" stroke-width="2"/>
  <line x1="442.0" y1="522.6" x2="446.4" y2="522.6" stroke="#374151" stroke-width="2"/><line x1="459.6" y1="522.6" x2="464.0" y2="522.6" stroke="#374151" stroke-width="2"/>
  <line x1="453.0" y1="516" x2="453.0" y2="520.4" stroke="#374151" stroke-width="2"/><line x1="453.0" y1="533.6" x2="453.0" y2="538" stroke="#374151" stroke-width="2"/>
  <line x1="442.0" y1="527.0" x2="446.4" y2="527.0" stroke="#374151" stroke-width="2"/><line x1="459.6" y1="527.0" x2="464.0" y2="527.0" stroke="#374151" stroke-width="2"/>
  <line x1="457.4" y1="516" x2="457.4" y2="520.4" stroke="#374151" stroke-width="2"/><line x1="457.4" y1="533.6" x2="457.4" y2="538" stroke="#374151" stroke-width="2"/>
  <line x1="442.0" y1="531.4" x2="446.4" y2="531.4" stroke="#374151" stroke-width="2"/><line x1="459.6" y1="531.4" x2="464.0" y2="531.4" stroke="#374151" stroke-width="2"/>
  <text x="482.0" y="533" font-size="13" font-weight="700" fill="#111827">Worker B</text>
  <circle cx="449.0" cy="550" r="2.2" fill="#1A1A1A"/>
  <text x="458.0" y="554" font-size="13" fill="#1A1A1A">No cached blocks for this clip</text>
  <circle cx="449.0" cy="568" r="2.2" fill="#1A1A1A"/>
  <text x="458.0" y="572" font-size="13" fill="#1A1A1A">Would pay the full prefill again</text>
  <rect x="812.0" y="506" width="340" height="86" rx="6" fill="#F7F8FA" stroke="#374151" stroke-width="2.5"/>
  <rect x="828.4" y="520.4" width="13.2" height="13.2" rx="3" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
  <rect x="831.92" y="523.92" width="6.16" height="6.16" fill="#374151"/>
  <line x1="830.6" y1="516" x2="830.6" y2="520.4" stroke="#374151" stroke-width="2"/><line x1="830.6" y1="533.6" x2="830.6" y2="538" stroke="#374151" stroke-width="2"/>
  <line x1="824.0" y1="522.6" x2="828.4" y2="522.6" stroke="#374151" stroke-width="2"/><line x1="841.6" y1="522.6" x2="846.0" y2="522.6" stroke="#374151" stroke-width="2"/>
  <line x1="835.0" y1="516" x2="835.0" y2="520.4" stroke="#374151" stroke-width="2"/><line x1="835.0" y1="533.6" x2="835.0" y2="538" stroke="#374151" stroke-width="2"/>
  <line x1="824.0" y1="527.0" x2="828.4" y2="527.0" stroke="#374151" stroke-width="2"/><line x1="841.6" y1="527.0" x2="846.0" y2="527.0" stroke="#374151" stroke-width="2"/>
  <line x1="839.4" y1="516" x2="839.4" y2="520.4" stroke="#374151" stroke-width="2"/><line x1="839.4" y1="533.6" x2="839.4" y2="538" stroke="#374151" stroke-width="2"/>
  <line x1="824.0" y1="531.4" x2="828.4" y2="531.4" stroke="#374151" stroke-width="2"/><line x1="841.6" y1="531.4" x2="846.0" y2="531.4" stroke="#374151" stroke-width="2"/>
  <text x="864.0" y="533" font-size="13" font-weight="700" fill="#111827">Worker C</text>
  <circle cx="831.0" cy="550" r="2.2" fill="#1A1A1A"/>
  <text x="840.0" y="554" font-size="13" fill="#1A1A1A">Holds the blocks too, but is busy</text>
  <circle cx="831.0" cy="568" r="2.2" fill="#1A1A1A"/>
  <text x="840.0" y="572" font-size="13" fill="#1A1A1A">Load outweighs the overlap credit</text>
  <path d="M1046.3999999999999,414 C1046.3999999999999,466 218.0,466 218.0,503" fill="none" stroke="#76B900" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M1046.3999999999999,414 C1046.3999999999999,466 600.0,466 600.0,503" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <path d="M1046.3999999999999,414 C1046.3999999999999,466 982.0,466 982.0,503" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="48.0" y="490" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4B5563">WORKERS</text>
  <line x1="50" y1="616" x2="84" y2="616" stroke="#76B900" stroke-width="3"/>
  <text x="92" y="620" font-size="12" fill="#4B5563">Selected worker</text>
  <line x1="220" y1="616" x2="254" y2="616" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="262" y="620" font-size="12" fill="#4B5563">Considered, not selected</text>
  <text x="50" y="650" font-size="13" fill="#4B5563">Workers report their processor behavior at startup. If it does not match the adapter, or a clip is ineligible, routing falls back to text-prefix routing.</text>
  <text x="50" y="670" font-size="13" fill="#4B5563">The selected worker receives the same video hash, so its KV events use the identity the router scored.</text>
</svg>
