<svg xmlns="http://www.w3.org/2000/svg" width="1096" height="396" viewBox="0 0 1096 396" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Four ways to share one GPU between two models</title>
  <desc id="desc">Time-slicing: A and B take turns on the SMs, memory is not capped, bandwidth and L2 are shared, faults are separate. HAMi: the same turn-taking with memory caps. MPS: A and B run at the same time under SM and memory caps; bandwidth, L2, and faults are shared. MIG: hardware walls around SMs, memory, bandwidth, L2, and faults.</desc>
