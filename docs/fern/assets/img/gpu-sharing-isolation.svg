<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="520" viewBox="0 0 1230 520" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Four ways to share one GPU between two models</title>
  <desc id="desc">Time-slicing and HAMi make two models take turns on all of the GPU's SMs; HAMi adds a memory cap. Each process keeps its own fault domain. MPS lets both models run at the same time, each under a compute ceiling and a memory cap, but memory bandwidth and L2 cache stay shared, and by default so does the fault domain. MIG cuts the GPU into hardware instances with walls around SMs, memory, bandwidth and L2, and separate fault domains, in fixed sizes.</desc>
