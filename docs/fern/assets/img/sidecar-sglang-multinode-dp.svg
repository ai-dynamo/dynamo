  <text x="340.0" y="131.0" class="box-sub-center" dominant-baseline="central" style="font-size:10px; fill: var(--text-muted);">Leader</text>
  <text x="340.0" y="143.5" fill="var(--text-muted)" font-size="11px" text-anchor="middle" dominant-baseline="central">Registers DP ranks 0-3</text>
