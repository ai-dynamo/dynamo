  <text x="636.0" y="137.5" class="box-sub-center" dominant-baseline="central" style="font-size:10px; fill: var(--text-muted);">DP ranks 0-1</text>
  <rect x="262" y="328" width="152" height="96" rx="10" fill="var(--accent)" opacity="0.7"/>
  <rect x="264" y="328" width="152" height="96" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340.0" y="362.0" class="box-label-center" dominant-baseline="central" style="font-size:14px; fill: var(--text-secondary);">Dynamo Sidecar</text>
  <text x="340.0" y="379.0" class="box-sub-center" dominant-baseline="central" style="font-size:10px; fill: var(--text-muted);">Follower</text>
  <text x="340.0" y="391.5" fill="var(--text-muted)" font-size="11px" text-anchor="middle" dominant-baseline="central">KV events only</text>
  <rect x="568" y="328" width="136" height="96" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.0" filter="url(#shadow)"/>
  <text x="636.0" y="368.5" class="box-label-center" dominant-baseline="central" style="font-size:14px; fill: var(--text-secondary);">SGLang</text>
  <text x="636.0" y="385.5" class="box-sub-center" dominant-baseline="central" style="font-size:10px; fill: var(--text-muted);">DP ranks 2-3</text>

  <path d="M620,176 L620,326" fill="none" stroke="var(--connector)" stroke-width="1" marker-start="url(#arrow-green-rev-var--connector)" marker-end="url(#arrow-var--connector)"/>
  <rect x="482.5947999999999" y="242.0" width="121.40520000000002" height="20.0" rx="10" class="pill-info"/>
  <text x="543.2973999999999" y="252.0" class="conn-label label-info" dominant-baseline="central" style="font-size:10px;">Dispatch and collectives</text>

