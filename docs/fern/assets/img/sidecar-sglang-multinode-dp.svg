  <rect x="232" y="272" width="496" height="184" rx="14" fill="var(--surface-zone)" stroke="var(--border-zone)" stroke-width="1.0" stroke-dasharray="6 3" filter="url(#blue-glow)"/>
  <text x="242.0" y="285.5" class="zone-label" dominant-baseline="central" style="fill:var(--text-muted);text-anchor:start;font-size:11px;">Node 1</text>

  <rect x="40" y="208" width="136" height="64" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.0" filter="url(#shadow)"/>
