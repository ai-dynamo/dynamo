      --text-primary: #0F172A;
      --text-secondary: #1E293B;
      --text-muted: #475569;
      --text-subtle: #64748B;
      --text-faint: #94A3B8;
      --text-on-accent: #FFFFFF;
      --text-on-bright-accent: #000000;
      --text-on-strong: #FFFFFF;
      --border: rgba(203,213,225,0.8);
      --border-zone: rgba(147,197,253,0.5);
      --border-strong: #94A3B8;
      --accent: #76B900;
      --accent-start: #8BD420;
      --accent-end: #6AAF00;
      --error: #EF4444;
      --info: #3B82F6;
      --connector: #94A3B8;
      --connector-dark: #64748B;
      --shadow: rgba(15,23,42,0.20);
      --glow-green: rgba(118,185,0,0.35);
      --glow-blue: rgba(59,130,246,0.15);
      --glow-red: rgba(239,68,68,0.25);
      --accent-tint: rgba(118,185,0,0.08);
      --accent-tint-faint: rgba(118,185,0,0.05);
      --grid-dot: rgba(148,163,184,0.2);
      --pill-primary: #3B82F6;
      --pill-secondary: #D97706;
      --pill-secondary-dark: #B45309;
      --pill-info: #64748B;
      --pill-success: #76B900;
      --pill-danger: #EF4444;
      --zone-label: rgba(59,130,246,0.75);
      --zone-sub-label: rgba(59,130,246,0.45);
      --zone-title: #64748B;
      --zone-title-strip: rgba(100,116,139,0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1E293B;
        --surface-zone: rgba(59,130,246,0.08);
        --surface-accent: url(#green-fill);
        --surface-strong: #CBD5E1;
        --surface-subtle: rgba(148,163,184,0.10);
        --text-primary: #F1F5F9;
        --text-secondary: #CBD5E1;
        --text-muted: #94A3B8;
        --text-subtle: #64748B;
        --text-faint: #64748B;
        --text-on-accent: #FFFFFF;
        --text-on-bright-accent: #000000;
        --text-on-strong: #0F172A;
        --border: rgba(148,163,184,0.25);
        --border-zone: rgba(147,197,253,0.3);
        --border-strong: #64748B;
        --accent: #76B900;
        --accent-start: #8BD420;
        --accent-end: #6AAF00;
        --error: #F87171;
        --info: #60A5FA;
        --connector: #475569;
        --connector-dark: #94A3B8;
        --shadow: rgba(0,0,0,0.40);
        --glow-green: rgba(118,185,0,0.25);
        --glow-blue: rgba(59,130,246,0.10);
        --glow-red: rgba(239,68,68,0.18);
        --accent-tint: rgba(118,185,0,0.12);
        --accent-tint-faint: rgba(118,185,0,0.08);
        --grid-dot: rgba(226,232,240,0.15);
        --pill-primary: #60A5FA;
        --pill-secondary: #FBBF24;
        --pill-secondary-dark: #D97706;
        --pill-info: #94A3B8;
        --pill-success: #76B900;
        --pill-danger: #F87171;
        --zone-label: rgba(96,165,250,0.7);
        --zone-sub-label: rgba(96,165,250,0.5);
        --zone-title: #94A3B8;
        --zone-title-strip: rgba(148,163,184,0.14);
      }
    }
    text { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: var(--text-primary); }
    .subtitle { font-size: 11px; font-weight: 400; fill: var(--text-muted); letter-spacing: 0.3px; }
    .box-label { font-size: 14px; font-weight: 600; fill: var(--text-secondary); text-anchor: start; }
    .box-label-center { font-size: 14px; font-weight: 600; fill: var(--text-secondary); text-anchor: middle; }
    .box-label-white { font-size: 14px; font-weight: 700; fill: var(--text-on-accent); text-anchor: middle; }
    .box-sub { font-size: 10px; font-weight: 400; fill: var(--text-muted); text-anchor: start; }
    .box-sub-center { font-size: 10px; font-weight: 400; fill: var(--text-muted); text-anchor: middle; }
    .box-sub-white { font-size: 10px; font-weight: 400; fill: var(--text-on-accent); opacity: 0.75; text-anchor: middle; }
    .conn-label { font-size: 10px; font-weight: 600; fill: var(--text-secondary); text-anchor: middle; }
    .zone-label { font-size: 11px; font-weight: 700; fill: var(--text-muted); text-anchor: middle; letter-spacing: 1.2px; }
    .zone-label-desc { font-size: 9px; font-weight: 400; fill: var(--text-muted); text-anchor: start; }
    .pill-primary { fill: rgba(59,130,246,0.35); stroke: rgba(59,130,246,0.60); stroke-width: 1.5; }
    .label-primary { fill: #1E293B; }
    .pill-secondary { fill: rgba(217,119,6,0.35); stroke: rgba(217,119,6,0.60); stroke-width: 1.5; }
    .label-secondary { fill: #1E293B; }
    .pill-info { fill: rgba(100,116,139,0.30); stroke: rgba(100,116,139,0.55); stroke-width: 1.5; }
    .label-info { fill: #1E293B; }
    .pill-success { fill: rgba(118,185,0,0.35); stroke: rgba(118,185,0,0.60); stroke-width: 1.5; }
    .label-success { fill: #1E293B; }
    .pill-danger { fill: rgba(239,68,68,0.35); stroke: rgba(239,68,68,0.60); stroke-width: 1.5; }
    .label-danger { fill: #1E293B; }
    @media (prefers-color-scheme: dark) {
      .pill-primary { fill: rgba(96,165,250,0.22); stroke: rgba(96,165,250,0.35); }
      .label-primary { fill: #CBD5E1; }
      .pill-secondary { fill: rgba(251,191,36,0.22); stroke: rgba(251,191,36,0.35); }
      .label-secondary { fill: #CBD5E1; }
      .pill-info { fill: rgba(148,163,184,0.20); stroke: rgba(148,163,184,0.28); }
      .label-info { fill: #CBD5E1; }
      .pill-success { fill: rgba(118,185,0,0.22); stroke: rgba(118,185,0,0.35); }
      .label-success { fill: #CBD5E1; }
      .pill-danger { fill: rgba(248,113,113,0.22); stroke: rgba(248,113,113,0.35); }
      .label-danger { fill: #CBD5E1; }
    }
  </style>
  <rect x="232" y="24" width="496" height="184" rx="14" fill="var(--surface-zone)" stroke="var(--border-zone)" stroke-width="1.0" stroke-dasharray="6 3" filter="url(#blue-glow)"/>
