<svg xmlns="http://www.w3.org/2000/svg" width="1252" height="368" viewBox="24 13 1252 368" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Where each VLM performance feature helps</title>
  <desc id="desc">A VLM request has six steps: the frontend receives it, the router picks a worker, the worker loads the image, runs the vision encoder, prefills, and decodes. Multimodal KV routing helps at the router. Frontend media decoding and the shared image cache help when loading. The embedding cache and encoder disaggregation help at the encoder.</desc>
