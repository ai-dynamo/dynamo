<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="281" viewBox="22 9 1012 281" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">A custom vision encoder runs inside the aggregated vLLM worker</title>
  <desc id="desc">A custom vision encoder, a decoder-selected adapter and the vLLM language model run in one aggregated dynamo.vllm worker process and share one GPU. The encoder sends projected features to the adapter, which sends an EmbedsPrompt or TokensPrompt to vLLM.</desc>
