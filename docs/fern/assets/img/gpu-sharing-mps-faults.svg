<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="596" viewBox="0 0 1240 596" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Which MPS configurations contain a GPU fault</title>
  <desc id="desc">A matrix of three MPS configurations against four questions, measured on one GPU with two models, A and B. One namespace per model, the GPU fractions layout using active thread percentages: the models run at the same time; a memory fault such as an illegal address or misaligned access in one model breaks every model on the GPU; a trap or breakpoint breaks every model on the GPU; a device-side assert affects only the model that asserted. One static SM partition per model, with MPS v3 sm-partition or MPS v2 started with -S: the models run at the same time; a memory fault breaks only the models in the faulting partition and the others keep serving; a trap or breakpoint still breaks every model and the GPU resets; a device-side assert affects only the model that asserted. One MPS server per model on the same GPU: the models take turns instead of running at the same time; a memory fault stays in its server; traps and asserts were not tested. Models that share a partition, namespace, or server always share its faults. A final row, set apart for comparison and taken from NVIDIA's MIG documentation rather than measured: with MIG, the models run at the same time, and memory faults, traps, and asserts stay inside the faulting model's instance.</desc>
