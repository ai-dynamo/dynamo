  <title id="title">Which MPS configurations contain a GPU fault</title>
  <desc id="desc">What a fault in model B reaches. Namespace per model, the GPU fractions layout: concurrent; a memory fault, trap, or breakpoint reaches every model; a device-side assert stays with B. SM partition per model: concurrent; a memory fault stays with B's partition; a trap or breakpoint reaches every model; an assert stays with B. MPS server per model: the models take turns; every fault stays with B. MIG, for comparison and not measured: concurrent; every fault stays with B.</desc>
