  <text x="400.0" y="121.0" font-size="13" font-weight="400" fill="#5A6270" text-anchor="start">same time?</text>
  <text x="580.0" y="101.0" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Memory fault</text>
  <text x="580.0" y="121.0" font-size="13" font-weight="400" fill="#5A6270" text-anchor="start">illegal address, misaligned</text>
  <text x="802.0" y="101.0" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Trap or breakpoint</text>
  <text x="802.0" y="121.0" font-size="13" font-weight="400" fill="#5A6270" text-anchor="start">__trap(), __brkpt()</text>
  <text x="1024.0" y="101.0" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="start">Device-side assert</text>
  <text x="1024.0" y="121.0" font-size="13" font-weight="400" fill="#5A6270" text-anchor="start">such as an index check</text>
  <text x="580.0" y="64.0" font-size="13" font-weight="700" fill="#5A6270" text-anchor="start">Which models a fault in model B reaches</text>
