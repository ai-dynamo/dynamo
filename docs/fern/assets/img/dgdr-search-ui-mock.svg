<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dynamo Search UI mock</title>
  <desc id="desc">A mock search dashboard with run progress, a parallel-coordinates search-space plot, a Pareto plot, ranked deployment candidates, and an expandable Sweeper log.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#091425" flood-opacity="0.12"/>
    </filter>
    <clipPath id="search-clip">
      <rect x="55" y="276" width="825" height="285" rx="8"/>
    </clipPath>
  </defs>

  <rect width="1440" height="900" fill="#F5F7FA"/>
  <rect x="0" y="0" width="1440" height="72" fill="#111827"/>
  <circle cx="38" cy="36" r="18" fill="#76B900"/>
  <path d="M29 37 L35 43 L47 29" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="43" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Dynamo Search</text>
  <text x="1174" y="42" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#CBD5E1">namespace</text>
  <rect x="1250" y="20" width="156" height="34" rx="6" fill="#273449"/>
  <text x="1266" y="42" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF">inference</text>
  <path d="M1384 34 l6 6 l6 -6" fill="none" stroke="#CBD5E1" stroke-width="2"/>

  <text x="32" y="116" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#64748B">DGDR / minimax-planner-search /</text>
  <text x="263" y="116" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">run-4</text>
  <text x="32" y="151" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">MiniMax-M2.5 · B200 search</text>
  <rect x="1255" y="118" width="151" height="38" rx="19" fill="#E8F7D0" stroke="#76B900"/>
  <circle cx="1277" cy="137" r="6" fill="#76B900"/>
  <text x="1292" y="142" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3F6212">SEARCHING</text>

  <g filter="url(#shadow)">
    <rect x="32" y="178" width="1374" height="72" rx="10" fill="#FFFFFF"/>
  </g>
  <text x="55" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748B">ROUND PROGRESS</text>
  <text x="55" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">23 / 80</text>
  <rect x="165" y="213" width="480" height="13" rx="6.5" fill="#E2E8F0"/>
  <rect x="165" y="213" width="138" height="13" rx="6.5" fill="#76B900"/>
  <line x1="303" y1="210" x2="303" y2="229" stroke="#4D7C0F" stroke-width="2"/>
  <text x="705" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748B">EVALUATIONS</text>
  <text x="705" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">54 / 640</text>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
    <circle cx="890" cy="220" r="5" fill="#16A34A"/><text x="903" y="225" fill="#334155">41 feasible</text>
    <circle cx="1000" cy="220" r="5" fill="#F59E0B"/><text x="1013" y="225" fill="#334155">8 infeasible</text>
    <circle cx="1128" cy="220" r="5" fill="#DC2626"/><text x="1141" y="225" fill="#334155">2 failed</text>
    <circle cx="1218" cy="220" r="5" fill="#64748B"/><text x="1231" y="225" fill="#334155">3 cache hits</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="32" y="270" width="870" height="330" rx="10" fill="#FFFFFF"/>
  </g>
  <text x="55" y="304" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Search-space exploration</text>
  <text x="55" y="327" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">Each line is one evaluated configuration · color is outcome · opacity is objective score</text>

