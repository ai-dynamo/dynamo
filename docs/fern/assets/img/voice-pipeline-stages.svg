  <rect x="131.0" y="199.2" width="10" height="18" rx="5" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/><path d="M126.0,211.2 a10,10 0 0 0 20,0" fill="none" stroke="#76B900" stroke-width="2" stroke-linecap="round"/><line x1="136.0" y1="221.2" x2="136.0" y2="226.2" stroke="#76B900" stroke-width="2" stroke-linecap="round"/><line x1="131.0" y1="226.2" x2="141.0" y2="226.2" stroke="#76B900" stroke-width="2" stroke-linecap="round"/>
