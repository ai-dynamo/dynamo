<svg xmlns="http://www.w3.org/2000/svg" width="1248" height="379" viewBox="36 9 1248 379" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Cascaded or full-duplex voice pipelines</title>
  <desc id="desc">A voice application, such as Pipecat, can use a cascaded pipeline of streaming ASR, an LLM, and text to speech, or one full-duplex audio-in, audio-out model.</desc>
