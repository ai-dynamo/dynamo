<svg xmlns="http://www.w3.org/2000/svg" width="1066" height="421" viewBox="22 28 1066 421" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Dynamo calls your hooks at four points</title>
  <desc id="desc">Worker startup calls build once. For each request, optional preprocess runs per image, Dynamo batches ready items across requests, forward_batch runs the encoder, and the decoder-selected adapter builds a TokensPrompt or EmbedsPrompt for vLLM. Worker shutdown calls close.</desc>
