<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="566" viewBox="0 0 1300 566" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Sequential versus parallel image decoding</title>
  <desc id="desc">Illustrative example: a request with five images, about 50 ms to preprocess each. Decoding them one after another on the backend takes about 250 ms. Decoding them in parallel in the Dynamo Rust frontend takes about 60 ms, saving about 200 ms per request. The numbers are illustrative.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#234CDA"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="arrow-green-start" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76B900"/></marker></defs>
  <rect width="1300" height="566" fill="#FFFFFF"/>
  <text x="50" y="40" font-size="13" font-weight="700" letter-spacing="1.6" fill="#5A8F00">FRONTEND MEDIA DECODING</text>
  <text x="50" y="68" font-size="22" font-weight="700" fill="#1A1A1A">Parallel image decoding in the Rust frontend</text>
  <text x="50" y="108" font-size="13" fill="#4B5563">Example: 5 images per request, about 50 ms to preprocess each (base64 to pixels).</text>
  <rect x="50" y="126" width="35.0" height="28" rx="4" fill="#F0F4FF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="59.8" cy="134.4" r="2.8000000000000003" fill="#234CDA"/>
  <polygon points="52.8,148.96 63.3,138.88 69.6,145.04 75.2,140.0 82.2,148.96" fill="#234CDA"/>
  <rect x="96" y="126" width="35.0" height="28" rx="4" fill="#F0F4FF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="105.8" cy="134.4" r="2.8000000000000003" fill="#234CDA"/>
  <polygon points="98.8,148.96 109.3,138.88 115.6,145.04 121.2,140.0 128.2,148.96" fill="#234CDA"/>
  <rect x="142" y="126" width="35.0" height="28" rx="4" fill="#F0F4FF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="151.8" cy="134.4" r="2.8000000000000003" fill="#234CDA"/>
  <polygon points="144.8,148.96 155.3,138.88 161.6,145.04 167.2,140.0 174.2,148.96" fill="#234CDA"/>
  <rect x="188" y="126" width="35.0" height="28" rx="4" fill="#F0F4FF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="197.8" cy="134.4" r="2.8000000000000003" fill="#234CDA"/>
  <polygon points="190.8,148.96 201.3,138.88 207.6,145.04 213.2,140.0 220.2,148.96" fill="#234CDA"/>
  <rect x="234" y="126" width="35.0" height="28" rx="4" fill="#F0F4FF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="243.8" cy="134.4" r="2.8000000000000003" fill="#234CDA"/>
  <polygon points="236.8,148.96 247.3,138.88 253.6,145.04 259.2,140.0 266.2,148.96" fill="#234CDA"/>
  <text x="50" y="214" font-size="18" font-weight="700" fill="#1A1A1A">Sequential</text>
  <text x="50" y="236" font-size="13" fill="#4B5563">Worker decodes each image</text>
  <text x="50" y="254" font-size="13" fill="#4B5563">in turn</text>
  <rect x="330.0" y="190" width="160.0" height="66" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="410.0" y="228" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">img 1</text>
  <rect x="490.0" y="190" width="160.0" height="66" fill="#C4C8CE" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="570.0" y="228" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">img 2</text>
  <rect x="650.0" y="190" width="160.0" height="66" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="730.0" y="228" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">img 3</text>
  <rect x="810.0" y="190" width="160.0" height="66" fill="#C4C8CE" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="890.0" y="228" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">img 4</text>
  <rect x="970.0" y="190" width="160.0" height="66" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="1050.0" y="228" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">img 5</text>
  <text x="1148.0" y="232" font-size="22" font-weight="700" fill="#374151">250 ms</text>
  <rect x="522.0" y="290" width="608.0" height="218" rx="8" fill="#F4F9E8" opacity="0.65"/>
  <text x="826.0" y="460" font-size="16" font-weight="700" fill="#4C7A00" text-anchor="middle">about 200 ms saved per request</text>
  <text x="50" y="372" font-size="18" font-weight="700" fill="#4C7A00">Parallel</text>
  <text x="50" y="394" font-size="13" fill="#4B5563">Dynamo Rust frontend decodes</text>
  <text x="50" y="412" font-size="13" fill="#4B5563">all images at once</text>
  <rect x="330.0" y="304" width="160.0" height="28" rx="3" fill="#76B900"/>
  <text x="340.0" y="323" font-size="13" font-weight="700" fill="#FFFFFF">img 1</text>
  <rect x="338.0" y="338" width="160.0" height="28" rx="3" fill="#76B900"/>
  <text x="348.0" y="357" font-size="13" font-weight="700" fill="#FFFFFF">img 2</text>
  <rect x="346.0" y="372" width="160.0" height="28" rx="3" fill="#76B900"/>
  <text x="356.0" y="391" font-size="13" font-weight="700" fill="#FFFFFF">img 3</text>
  <rect x="354.0" y="406" width="160.0" height="28" rx="3" fill="#76B900"/>
  <text x="364.0" y="425" font-size="13" font-weight="700" fill="#FFFFFF">img 4</text>
  <rect x="362.0" y="440" width="160.0" height="28" rx="3" fill="#76B900"/>
  <text x="372.0" y="459" font-size="13" font-weight="700" fill="#FFFFFF">img 5</text>
  <text x="544.0" y="372" font-size="22" font-weight="700" fill="#4C7A00">about 60 ms</text>
  <line x1="330" y1="486" x2="1130.0" y2="486" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="330.0" y1="486" x2="330.0" y2="492" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="330.0" y="508" font-size="12" fill="#4B5563" text-anchor="middle">0</text>
  <line x1="490.0" y1="486" x2="490.0" y2="492" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="490.0" y="508" font-size="12" fill="#4B5563" text-anchor="middle">50</text>
  <line x1="650.0" y1="486" x2="650.0" y2="492" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="650.0" y="508" font-size="12" fill="#4B5563" text-anchor="middle">100</text>
  <line x1="810.0" y1="486" x2="810.0" y2="492" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="810.0" y="508" font-size="12" fill="#4B5563" text-anchor="middle">150</text>
  <line x1="970.0" y1="486" x2="970.0" y2="492" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="970.0" y="508" font-size="12" fill="#4B5563" text-anchor="middle">200</text>
  <line x1="1130.0" y1="486" x2="1130.0" y2="492" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="1130.0" y="508" font-size="12" fill="#4B5563" text-anchor="middle">250</text>
  <text x="1156.0" y="508" font-size="12" fill="#4B5563">ms</text>
  <text x="50" y="548" font-size="13" fill="#4B5563">The backend still runs its multimodal processor and vision encoder. Only where media is decoded changes.</text>
</svg>
