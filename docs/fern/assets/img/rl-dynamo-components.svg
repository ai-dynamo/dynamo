<svg xmlns="http://www.w3.org/2000/svg" width="1267" height="533" viewBox="22 23 1267 533" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Dynamo serves the rollouts. Your framework owns the rest</title>
  <desc id="desc">In the RL loop, prompts go to rollout serving, which Dynamo provides: the router sends them to workers, and fault tolerance keeps them running. Samples go to rewards and then to the trainer, which belong to the RL framework and harness. Updated policy weights flow back to Dynamo through ModelExpress and NIXL. Request traces and DynoSim profile and replay the rollouts.</desc>
