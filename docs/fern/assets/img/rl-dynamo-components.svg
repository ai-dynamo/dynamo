<svg xmlns="http://www.w3.org/2000/svg" width="1253" height="547" viewBox="36 9 1253 547" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Where Dynamo fits in the reinforcement learning loop</title>
  <desc id="desc">In the RL loop, prompts go to rollout serving, which Dynamo provides: the router sends them to workers, and fault tolerance keeps them running. Samples go to rewards and then to the trainer, which belong to the RL framework and harness. Updated policy weights return to the workers through ModelExpress and NIXL. Request traces and DynoSim profile and replay the serving workload.</desc>
