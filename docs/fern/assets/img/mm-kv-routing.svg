<svg xmlns="http://www.w3.org/2000/svg" width="1054" height="475" viewBox="22 29 1054 475" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">A repeated image goes to the worker that already holds its cache</title>
  <desc id="desc">The frontend hashes the image, reads its size, counts its tokens, builds a routing view, and scores workers. The request goes to Worker A, which already holds the cache. Worker B has no cache and Worker C is busy.</desc>
