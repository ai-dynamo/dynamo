  <text x="92" y="620" font-size="12" fill="#4B5563">Selected worker</text>
  <line x1="220" y1="616" x2="254" y2="616" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="262" y="620" font-size="12" fill="#4B5563">Considered, not selected</text>
  <text x="50" y="650" font-size="13" fill="#4B5563">With --frontend-decoding, the frontend decodes the image and hashes its content, so two URLs for the same pixels match.</text>
  <text x="50" y="670" font-size="13" fill="#4B5563">The selected worker receives the same image hash, so its KV events line up with the routing view.</text>
