  <line x1="701.5999999999999" y1="333.0" x2="721.5999999999999" y2="333.0" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="924.8" y1="333.0" x2="944.8" y2="333.0" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
