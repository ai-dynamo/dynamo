  <rect x="396.0" y="112" width="45.0" height="36" rx="4" fill="#F4F9E8" stroke="#76B900" stroke-width="2"/>
  <circle cx="408.6" cy="122.8" r="3.6" fill="#76B900"/>
  <polygon points="399.6,141.52 413.1,128.56 421.2,136.48 428.4,130.0 437.4,141.52" fill="#76B900"/>
  <circle cx="441.0" cy="112" r="8.64" fill="#76B900" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M436.68,112 L439.92,115.24 L445.68,108.76" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="464.0" y="128" font-size="14" font-weight="700" fill="#1A1A1A">Chat request with an image</text>
  <text x="464.0" y="150" font-size="12.5" fill="#4B5563">The same image appeared in an earlier request</text>
  <line x1="600.0" y1="172" x2="600.0" y2="214" stroke="#234CDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="38" y="216" width="1124" height="214" rx="12" fill="#F0F4FF" stroke="#234CDA" stroke-width="1.5"/>
  <text x="54" y="238" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4B5563">DYNAMO FRONTEND  (default path: the backend decodes images)</text>
  <rect x="54" y="254" width="199.2" height="158" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="80" cy="280" r="13" fill="#234CDA"/>
  <text x="80" y="285" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="102" y="285" font-size="15" font-weight="700" fill="#1A1A1A">Hash the image</text>
  <circle cx="73" cy="303" r="2.2" fill="#4B5563"/>
  <text x="82" y="307" font-size="13" fill="#4B5563">Stable hash of the</text>
  <text x="82" y="325" font-size="13" fill="#4B5563">image URL bytes</text>
  <circle cx="73" cy="339" r="2.2" fill="#4B5563"/>
  <text x="82" y="343" font-size="13" fill="#4B5563">Identical URLs hash</text>
  <text x="82" y="361" font-size="13" fill="#4B5563">identically</text>
  <rect x="277.2" y="254" width="199.2" height="158" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="303.2" cy="280" r="13" fill="#234CDA"/>
  <text x="303.2" y="285" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="325.2" y="285" font-size="15" font-weight="700" fill="#1A1A1A">Read the image</text>
  <text x="325.2" y="303" font-size="15" font-weight="700" fill="#1A1A1A">size</text>
  <circle cx="296.2" cy="321" r="2.2" fill="#4B5563"/>
  <text x="305.2" y="325" font-size="13" fill="#4B5563">Fetches only the image</text>
  <text x="305.2" y="343" font-size="13" fill="#4B5563">header</text>
  <circle cx="296.2" cy="357" r="2.2" fill="#4B5563"/>
  <text x="305.2" y="361" font-size="13" fill="#4B5563">Width and height, no</text>
  <text x="305.2" y="379" font-size="13" fill="#4B5563">full download</text>
  <rect x="500.4" y="254" width="199.2" height="158" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="526.4" cy="280" r="13" fill="#234CDA"/>
  <text x="526.4" y="285" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="548.4" y="285" font-size="15" font-weight="700" fill="#1A1A1A">Count image</text>
  <text x="548.4" y="303" font-size="15" font-weight="700" fill="#1A1A1A">tokens</text>
  <circle cx="519.4" cy="321" r="2.2" fill="#4B5563"/>
  <text x="528.4" y="325" font-size="13" fill="#4B5563">The model's vision</text>
  <text x="528.4" y="343" font-size="13" fill="#4B5563">processor turns width</text>
  <text x="528.4" y="361" font-size="13" fill="#4B5563">and height into a</text>
  <text x="528.4" y="379" font-size="13" fill="#4B5563">token count</text>
  <rect x="723.5999999999999" y="254" width="199.2" height="158" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="749.5999999999999" cy="280" r="13" fill="#234CDA"/>
  <text x="749.5999999999999" y="285" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="771.5999999999999" y="285" font-size="15" font-weight="700" fill="#1A1A1A">Build the routing</text>
  <text x="771.5999999999999" y="303" font-size="15" font-weight="700" fill="#1A1A1A">view</text>
  <circle cx="742.5999999999999" cy="321" r="2.2" fill="#4B5563"/>
  <text x="751.5999999999999" y="325" font-size="13" fill="#4B5563">Image placeholders</text>
  <text x="751.5999999999999" y="343" font-size="13" fill="#4B5563">expand to that many</text>
  <text x="751.5999999999999" y="361" font-size="13" fill="#4B5563">tokens</text>
  <circle cx="742.5999999999999" cy="375" r="2.2" fill="#4B5563"/>
  <text x="751.5999999999999" y="379" font-size="13" fill="#4B5563">Filled with pad values</text>
  <text x="751.5999999999999" y="397" font-size="13" fill="#4B5563">from the hash</text>
  <rect x="946.8" y="254" width="199.2" height="158" rx="10" fill="#FFFFFF" stroke="#234CDA" stroke-width="2"/>
  <circle cx="972.8" cy="280" r="13" fill="#234CDA"/>
  <text x="972.8" y="285" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="994.8" y="285" font-size="15" font-weight="700" fill="#1A1A1A">Score the workers</text>
  <circle cx="965.8" cy="303" r="2.2" fill="#4B5563"/>
  <text x="974.8" y="307" font-size="13" fill="#4B5563">KV overlap credit</text>
  <text x="974.8" y="325" font-size="13" fill="#4B5563">against projected load</text>
  <circle cx="965.8" cy="339" r="2.2" fill="#4B5563"/>
  <text x="974.8" y="343" font-size="13" fill="#4B5563">Lowest combined cost</text>
  <text x="974.8" y="361" font-size="13" fill="#4B5563">wins</text>
