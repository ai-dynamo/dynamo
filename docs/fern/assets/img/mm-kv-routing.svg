<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="538" viewBox="0 0 1100 538" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Multimodal KV routing for images</title>
  <desc id="desc">A request with a repeated image reaches the frontend, which hashes the image, reads its size, counts image tokens, builds a routing view, and scores the workers. Worker A, which already holds the image's KV blocks, is selected. Workers B and C are considered but not chosen.</desc>
