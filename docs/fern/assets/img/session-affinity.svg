<svg xmlns="http://www.w3.org/2000/svg" width="1018" height="409" viewBox="22 29 1018 409" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Every turn within a session lands on the same worker</title>
  <desc id="desc">The turns of one agent session reach the router. With session affinity on, the router binds the session to one worker and sends every turn there, where the earlier turns' KV cache already is. The other workers are not used by the session.</desc>
