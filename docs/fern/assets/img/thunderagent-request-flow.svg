<svg xmlns="http://www.w3.org/2000/svg" width="1062" height="285" viewBox="22 9 1062 285" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">A request passes through the ThunderAgent classifier and worker selector</title>
  <desc id="desc">A request with a session ID reaches the ThunderAgent classifier, which releases it with a preferred worker into the Dynamo policy queue. The ThunderAgent worker selector then picks a worker. The aggregated worker sends progress and lifecycle events back to the classifier.</desc>
