  <text x="36" y="66" font-size="26.2" font-weight="700" fill="#1A1A1A">How a request is scheduled</text>
  <rect x="36" y="110" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/>
  <circle cx="121.0" cy="140.0" r="5" fill="none" stroke="#76B900" stroke-width="2"/><path d="M110.0,158.0 a11,9 0 0 1 22,0" fill="none" stroke="#76B900" stroke-width="2"/>
  <text x="121.0" y="194" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">Request + session</text>
  <rect x="252" y="110" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/>
  <line x1="324.0" y1="138.0" x2="350.0" y2="138.0" stroke="#76B900" stroke-width="2" stroke-linecap="round"/><circle cx="332.0" cy="138.0" r="3.4" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/><line x1="324.0" y1="146.0" x2="350.0" y2="146.0" stroke="#76B900" stroke-width="2" stroke-linecap="round"/><circle cx="343.0" cy="146.0" r="3.4" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/><line x1="324.0" y1="154.0" x2="350.0" y2="154.0" stroke="#76B900" stroke-width="2" stroke-linecap="round"/><circle cx="335.0" cy="154.0" r="3.4" fill="#FFFFFF" stroke="#76B900" stroke-width="2"/>
  <text x="337.0" y="194" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">Classifier</text>
