  <rect x="539.0" y="133.0" width="28" height="7" rx="3" fill="#76B900" fill-opacity="1.0"/><rect x="539.0" y="143.0" width="23" height="7" rx="3" fill="#76B900" fill-opacity="0.75"/><rect x="539.0" y="153.0" width="18" height="7" rx="3" fill="#76B900" fill-opacity="0.5"/>
