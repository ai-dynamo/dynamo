<svg xmlns="http://www.w3.org/2000/svg" width="1158" height="314" viewBox="22 26 1158 314" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The harness labels each request, and Dynamo acts on the label</title>
  <desc id="desc">The agent harness sends a session ID and a priority with each request. Inside Dynamo, the frontend records a trace, the router applies session affinity and queueing, and the engine applies priority.</desc>
