<svg xmlns="http://www.w3.org/2000/svg" width="1159" height="328" viewBox="31 8 1159 328" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">How Dynamo uses agent request metadata</title>
  <desc id="desc">An agent harness sends each request with a session ID and a priority. The Dynamo frontend reads them. The router uses the session ID for affinity and the priority for queue order. The engine uses the priority for scheduling and cache eviction. The frontend records a request trace.</desc>
