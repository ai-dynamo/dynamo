  <title id="title">Capture once, replay live or offline</title>
  <desc id="desc">The agent harness sends requests through the Dynamo frontend, which writes a request trace. The trace feeds DynoSim for offline simulation, or a live replay trace that AIPerf sends to a Dynamo endpoint.</desc>
