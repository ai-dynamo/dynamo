<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="604" viewBox="0 0 1240 604" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Workloads that fit GPU fractions</title>
  <desc id="desc">Five kinds of workload that fit MPS GPU fractions, each with several distinct models whose combined demand fits in one GPU. A long tail of lightly used models, such as full fine-tunes per customer, internal tools, language-specific models: Each would leave a dedicated GPU mostly idle, and their weights differ, so they can't share an engine. Supporting models beside a main model, such as embedding, reranking, guardrail and safety classifiers, small routers: They are small, distinct, and lightly loaded, so they fill the share a larger model leaves. Several model families behind one product, such as chat, code, sql, and summarization: Each sees part of the product's traffic, and none needs a whole GPU. Development, staging, and evaluation, such as many candidate models, used in bursts: Utilization is low and bursty, and GPU count matters more than peak throughput. A large tensor-parallel model, plus small ones, such as the large model held to a share of each of its gpus: A model that spans GPUs for its memory may not need all of their compute.</desc>
