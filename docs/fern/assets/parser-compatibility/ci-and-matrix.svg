<text x="1500.0" y="411.96" font-size="19" font-weight="700" text-anchor="middle">All required cells PASS → exit 0</text>
<text x="1500.0" y="436.96" font-size="19" font-weight="400" text-anchor="middle">Only for this complete, nonempty scope</text>
<text x="225" y="483" font-size="17" font-weight="400" text-anchor="start" fill="#53606a">A required skip or xfail cannot count as a pass. NOT TESTED stays visible outside the required profile.</text>
