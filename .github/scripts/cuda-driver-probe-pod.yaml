apiVersion: v1
kind: Pod
metadata:
  name: cuda-driver-probe
spec:
  serviceAccountName: cuda-driver-probe
  automountServiceAccountToken: false
  restartPolicy: Never
  runtimeClassName: nvidia
  tolerations:
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
    - {key: dedicated, operator: Exists, effect: NoSchedule}
  activeDeadlineSeconds: 180
  terminationGracePeriodSeconds: 5
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  initContainers:
    - name: helper
      image: dynamoci.azurecr.io/ghcr.io/ai-dynamo/snapshot/agent@sha256:42b340a7a58feadae76f209c066c08a3f3cb9262cee12487425808e39303e301
      command: ["/bin/cp", "/usr/local/bin/cuda-checkpoint-helper", "/helpers/cuda-checkpoint-helper"]
      volumeMounts:
        - {name: helpers, mountPath: /helpers}
  containers:
    - name: probe
      image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.6.0-ci-51b83df91f3fca2f52ed644f744c4465c3d163b3-trtllm-placeholder@sha256:350a865ffd4eff81a428ca80da945869d4755b7553ce9a743fc2d2166050ab86
      command: ["/bin/sleep", "180"]
      securityContext:
        runAsUser: 0
        capabilities:
          add: ["SYS_PTRACE"]
        seccompProfile:
          type: Unconfined
      resources:
        requests: {cpu: "1", memory: 1Gi}
        limits: {nvidia.com/gpu: "1", memory: 1Gi}
      volumeMounts:
        - {name: helpers, mountPath: /helpers, readOnly: true}
        - {name: probe, mountPath: /probe, readOnly: true}
  volumes:
    - name: helpers
      emptyDir: {}
    - name: probe
      configMap: {name: cuda-driver-probe}
