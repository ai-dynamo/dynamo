apiVersion: v1
kind: Pod
metadata:
  name: root-no-caps
spec:
  serviceAccountName: cuda-runtime-permission-probe
  automountServiceAccountToken: false
  restartPolicy: Never
  runtimeClassName: nvidia
  activeDeadlineSeconds: 210
  terminationGracePeriodSeconds: 1
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB
  tolerations:
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
    - {key: dedicated, operator: Exists, effect: NoSchedule}
  containers:
    - name: probe
      image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.6.0-ci-51b83df91f3fca2f52ed644f744c4465c3d163b3-trtllm-placeholder@sha256:350a865ffd4eff81a428ca80da945869d4755b7553ce9a743fc2d2166050ab86
      command: ["/bin/sleep", "210"]
      env:
        - {name: PROBE_MODE, value: root-no-caps}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL], add: []}
        # Hold seccomp constant to isolate UID and capability requirements.
        seccompProfile: {type: Unconfined}
      resources:
        requests: {cpu: "1", memory: 2Gi}
        limits: {nvidia.com/gpu: "1", memory: 2Gi}
      volumeMounts:
        - {name: helpers, mountPath: /helpers, readOnly: true}
        - {name: probe, mountPath: /probe, readOnly: true}
  volumes:
    - name: helpers
      configMap: {name: cuda-runtime-helper, defaultMode: 0555}
    - name: probe
      configMap: {name: cuda-runtime-permission-probe}
