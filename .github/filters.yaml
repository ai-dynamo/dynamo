# CI Filter Patterns - See FILTERS.md for documentation
#
# Filters that trigger CI jobs:
#   core     -> dynamo build-test, all backend builds (vllm/sglang/trtllm)
#   operator -> operator build and test
#   snapshot -> snapshot-agent build/test + all-framework DynamoCheckpoint deploy tests
#   snapshot_vllm / snapshot_sglang / snapshot_trtllm -> that framework's DynamoCheckpoint suite
#   power_agent -> power-agent image build
#   deploy   -> deploy tests
#   dgdr     -> DGDR deploy tests
#   planner  -> dynamo build-test
#   vllm     -> vllm build and test
#   sglang   -> sglang build and test
#   trtllm   -> trtllm build and test
#   frontend -> frontend EPP image build, dynamo build-test
#   benchmarks -> dynamo build-test (runs tests/benchmarks/** pytest suite)
#   efa      -> all framework EFA runtime image builds (changes to container/templates/aws.Dockerfile)
#   examples -> recipe-check (Kustomize recipe generation and unit tests)
#   sidecar  -> classification only; source and proto files also match rust
#   docs     -> fern docs lint, sync, and version release (docs/ directory)
#
# Filters for coverage only (no CI triggered):
#   examples, ignore, sidecar

all:
  - '**'

# Fern component sources only. The docs filter matches 458 of the last 1172
# commits on main, but only 21 of those touched a component source, so a step
# that only exercises components wastes ~95% of its runs on that filter.
# pre-merge.yml is listed because a change to the component-parsing step should
# run the step it changes.
fern_components:
  - 'docs/fern/components/**/*.ts'
  - 'docs/fern/components/**/*.tsx'
  - 'docs/fern/components/**/*.js'
  - 'docs/fern/components/**/*.jsx'
  - 'docs/fern/fern.config.json'
  - 'docs/fern/scripts/check_component_imports.py'
  - '.github/workflows/pre-merge.yml'

docs:
  - 'docs/**'
  - 'fern/**'
  - '.github/workflows/fern-docs.yml'
  - '**/*.md'
  - '**/*.txt'
  - '**/.gitignore'
  - '**/.helmignore'
  - '**/.gitattributes'
  - 'LICENSE'
  - 'CODEOWNERS'
  - '.coveragerc'
  - '.claude/**'
  - '.agents/**'
  # Codex role configs for the optimization skill pack; agent guidance, no CI surface.
  - '.codex/**'
  # Canonical agent skills live in .agents/skills; root skills/ is a symlink there.
  - 'skills/**'
  # Sidecar documentation is not part of the Fern docs site.
  - '!lib/sidecar/**'

api_docs:
  - '.github/filters.yaml'
  - '.github/workflows/fern-docs.yml'
  - '.github/workflows/pre-merge.yml'
  - 'pyproject.toml'
  - 'docs/fern/scripts/**'
  - 'docs/fern/components/**'
  - 'docs/fern/pages/reference/api/**'
  - 'docs/fern/index.yml'
  - 'docs/fern/docs.yml'
  - 'docs/fern/pages/reference/kubernetes-api/full-api-reference.mdx'
  - 'docs/fern/pages/reference/kubernetes-api/additional-resources/api-reference-k8s.md'
  - 'deploy/operator/docs/footer.md'
  - 'lib/bindings/python/src/**'
  - 'components/src/dynamo/**'
  - '**/Cargo.toml'

examples:
  - 'recipes/**'
  - 'recipes/**/.kustomize-matrix.yaml'
  - 'examples/**'
  - '.devcontainer/**'
  - 'deploy/discovery/**'
  - 'deploy/inference-gateway/**'
  - 'dev/observability/**'
  - 'deploy/observability/**'
  - 'deploy/pre-deployment/**'
  - 'scripts/generate_kustomize_openapi.py'
  - 'scripts/kustomize-matrix.py'
  - 'tests/test_generate_kustomize_openapi.py'
  - 'tests/test_kustomize_matrix.py'
  - 'deploy/operator/config/crd/bases/nvidia.com_dynamographdeployment.yaml'
  - 'deploy/operator/config/crd/bases/nvidia.com_dynamographdeploymentrequests.yaml'

ignore:
  # CI filter documentation does not affect any CI job.
  - '.github/FILTERS.md'
  - '.lycheeignore'
  - '.pre-commit-config.yaml'
  - '.coderabbit.yaml'
  - '.clang-format'
  - 'dynamo.code-workspace'
  - 'deploy/*'
  # Standalone CRD apiVersion converter: classification-only so it satisfies
  # the changed-files coverage check without triggering the operator deploy
  # pipeline (it is excluded from the `deploy` filter below).
  - 'deploy/utils/convert_api_version.py'
  - 'deploy/utils/tests/**'
  - 'dev/*'
  - '.github/scripts/**'
  - '.github/ISSUE_TEMPLATE/**'
  - '.github/pull_request_template.md'
  - '.github/labeler.yml'
  - '.github/release.yml'
  - '.github/copy-pr-bot.yaml'
  - '.github/dco.yml'
  - '.github/secret_scanning.yml'
  - '.github/allurerc.mjs'
  - 'container/Dockerfile.docs'
  - 'container/run.sh'
  - 'container/use-sccache.sh'
  - 'container/dev/**'
  # Removed by trtllm upstream-base migration; claim here so changed-files
  # validation passes on the deletion diff without triggering trtllm CI.
  - 'container/build_trtllm_wheel.sh'
  - 'container/deps/trtllm/**'
  - 'scripts/dco_check.py'
  - 'scripts/validate_skills.py'
  # CODEOWNERS generation tooling (data + scripts). Validated by its own
  # codeowners.yml workflow (triggers on '**'); no backend CI needed here.
  - '.github/codeowners/**'

ci: &ci
  - '.github/workflows/**'
  - '.github/filters.yaml'
  - '.github/actions/**'
  - '.github/scripts/parse_buildkit_output.py'
  - '.github/scripts/route_buildkit.sh'
  - 'container/Dockerfile.test'

core:
  - *ci
  - 'container/render.py'
  - 'container/Dockerfile.template'
  - 'container/context.yaml'
  - 'container/templates/args.Dockerfile'
  - 'container/templates/dynamo_*'
  - 'container/templates/wheel_builder.Dockerfile'
  - 'container/templates/compliance.Dockerfile'
  - '.dockerignore'
  - 'container/deps/*'
  - 'container/compliance/**'
  - '.cargo/config.toml'
  - 'lib/**'
  - 'tests/**'
  - 'components/src/dynamo/kv_dc_relay/**'
  - 'components/src/dynamo/kv_state_agent/**'
  - 'components/src/dynamo/router/**'
  - 'components/src/dynamo/thunderagent_router/**'
  - 'components/src/dynamo/mocker/**'
  - 'components/src/dynamo/replay/**'
  - 'components/src/dynamo/frontend/**'
  - 'components/src/dynamo/common/**'
  - 'components/src/dynamo/gpu_memory_service/**'
  # TODO(will): Move TokenSpeed to a dedicated framework filter once CI has
  # TokenSpeed Docker images and backend-specific build/test jobs.
  - 'components/src/dynamo/tokenspeed/**'
  - 'components/src/dynamo/squeeze_evolve/**'
  - '*.toml'
  - '*.lock'
  - '*.py'
  - '*.rs'
  - 'tests/report_pytest_markers.py'
  # Negation patterns MUST come after positive patterns — micromatch processes
  # patterns left-to-right, so negations only filter matches accumulated by
  # preceding patterns. Placing them first has no effect.
  # Rust sidecars have their own classification and do not use the framework
  # container or E2E pipelines triggered by `core`.
  - '!lib/sidecar/**'
  - '!tests/test_generate_kustomize_openapi.py'
  - '!tests/test_kustomize_matrix.py'
  - '!**/*.md'
  - '!**/*.rst'
  - '!**/*.txt'

# dev/local-dev image templates. These are NOT in `core`: dev.Dockerfile is `FROM
# runtime` and local_dev.Dockerfile is `FROM dev`, so neither can change a runtime
# artifact or a runtime test result -- gating them on `core` would run all three
# runtime builds plus the GPU test matrix for a change that cannot affect them.
# They were previously in `ignore`, which meant the templates defining every
# developer's image were never built by CI at all: both the missing libprotobuf-dev
# (#12443) and the vLLM dev image whose ENTRYPOINT pointed at a script it does not
# ship (#12515) shipped that way. Gate only the dev/local-dev build jobs on this.
dev_images:
  - 'container/templates/dev.Dockerfile'
  - 'container/templates/local_dev.Dockerfile'

operator:
  - *ci
  - 'deploy/operator/**'
  - 'deploy/operator/.*'
  - 'docs/fern/pages/reference/kubernetes-api/additional-resources/api-reference-k8s.md'
  - 'deploy/helm/charts/platform/**'
  # The operator check owns the real Go/Python DGD override contract test.
  - 'components/src/dynamo/profiler/utils/dgd_override.py'
  - 'components/src/dynamo/profiler/tests/integration/test_dgd_override_go_integration.py'
  - 'components/src/dynamo/profiler/utils/dgdr_*'

snapshot:
  - 'deploy/checkpoint-placeholder/**'
  - 'components/src/dynamo/common/snapshot/**'
  - 'deploy/operator/internal/checkpoint/**'
  - 'deploy/operator/internal/checkpointjob/**'
  - 'tests/deploy/test_dynamocheckpoint.py'
  # Where the pinned github.com/ai-dynamo/snapshot chart version/values live --
  # a version bump or install-config change must trigger the deploy-snapshot-
  # agent-checkpoint-*/deploy-test-checkpoint-* jobs, not just 'operator'.
  - 'deploy/helm/charts/platform/Chart.yaml'
  - 'deploy/helm/charts/platform/Chart.lock'
  - 'deploy/helm/charts/platform/values.yaml'

# Framework-local snapshot lifecycle files, plus TRT-LLM's unit test. These gate
# that framework's DynamoCheckpoint deploy jobs (and shared snapshot-agent/operator
# deps) without forcing the other backends' checkpoint suites.
snapshot_vllm:
  - 'components/src/dynamo/vllm/snapshot.py'

snapshot_sglang:
  - 'components/src/dynamo/sglang/snapshot.py'

snapshot_trtllm:
  - 'components/src/dynamo/trtllm/snapshot.py'
  - 'components/src/dynamo/trtllm/tests/test_trtllm_snapshot.py'

power_agent:
  - *ci
  - 'deploy/power-agent/**'
  - 'deploy/helm/charts/power-agent/**'
  - '!**/*.md'
  - '!**/*.rst'

deploy:
  - *ci
  - 'deploy/helm/**'
  - 'deploy/utils/**'
  - 'deploy/checkpoint-placeholder/**'
  # Nothing exists here anymore; kept so the coverage check below still
  # classifies deletions under this now-defunct path.
  - 'deploy/snapshot/**'
  - 'tests/deploy/**'
  # Standalone CRD apiVersion converter: not used by the deploy-test harness and
  # has no CI test wiring, so it should not trigger the operator deploy pipeline.
  - '!deploy/utils/convert_api_version.py'
  - '!deploy/utils/tests/**'
  - '!**/*.md'
  - '!**/*.rst'

dgdr:
  - '.github/workflows/shared-dgdr-deploy-test.yml'
  - 'tests/conftest.py'
  - 'tests/deploy/conftest.py'
  - 'tests/deploy/dgdr_utils.py'
  - 'tests/deploy/test_dgdr.py'
  - 'tests/deploy/test_dgdr_h100.py'
  - 'tests/deploy/test_dgdr_utils.py'
  - 'tests/deploy/dgd_utils.py'

planner:
  - 'container/templates/planner.Dockerfile'
  - 'components/src/dynamo/planner/**'
  - 'components/src/dynamo/global_planner/**'
  - 'components/src/dynamo/profiler/**'
  - 'components/src/dynamo/global_router/**'
  - 'aisimulate/**'
  # Power-aware planner (PR #9369): per-node power agent component
  - 'deploy/power-agent/**'
  - 'deploy/helm/charts/power-agent/**'
  - '!**/*.md'
  - '!**/*.rst'

sidecar:
  - 'lib/sidecar/**'

vllm:
  - 'container/deps/requirements.vllm.txt'
  - 'container/deps/vllm/**'
  - 'examples/backends/vllm/**'
  - 'components/src/dynamo/vllm/**'
  - 'container/templates/vllm_*'
  - '!**/*.md'
  - '!**/*.rst'

sglang:
  - 'container/deps/sglang/**'
  - 'examples/backends/sglang/**'
  - 'components/src/dynamo/sglang*/**'
  - 'container/templates/sglang_*'
  - 'container/deps/sglang/**'
  - '!**/*.md'
  - '!**/*.rst'

trtllm:
  - 'container/deps/requirements.trtllm.txt'
  - 'examples/backends/trtllm/**'
  - 'components/src/dynamo/trtllm/**'
  - 'container/templates/trtllm_*'
  - '!**/*.md'
  - '!**/*.rst'

# sample -> sample-unified-test (framework-agnostic CPU-only backend
# reference implementation). Piggybacks on the vllm image, so a sample-only
# change triggers vllm-build + sample-unified-test. The common/backend ABC
# already triggers `core`; this filter is for the launch scripts and tests
# that are specific to the sample backend.
sample:
  - 'examples/backends/sample/**'
  - '!**/*.md'
  - '!**/*.rst'

frontend:
  - *ci
  - '.cargo/config.toml'
  - 'lib/**'
  - '*.toml'
  - '*.lock'
  - 'container/deps/*'
  - 'container/compliance/**'
  - 'components/src/dynamo/kv_dc_relay/**'
  - 'components/src/dynamo/kv_state_agent/**'
  - 'components/src/dynamo/router/**'
  - 'components/src/dynamo/thunderagent_router/**'
  - 'components/src/dynamo/mocker/**'
  - 'components/src/dynamo/replay/**'
  - 'components/src/dynamo/frontend/**'
  - 'components/src/dynamo/common/**'
  - 'tests/frontend/router_aic_image_smoke.py'
  - 'deploy/inference-gateway/**'
  - 'container/templates/frontend.Dockerfile'
  # Sidecars are standalone Rust binaries and are not part of the frontend
  # image or its E2E test pipeline.
  - '!lib/sidecar/**'
  - '!**/*.md'
  - '!**/*.rst'

rust:
  - '.github/workflows/pre-merge.yml'
  - '**/*.rs'
  - '**/Cargo.toml'
  - '**/Cargo.lock'
  - 'deny.toml'
  # Sidecar protobuf contracts are compiled by crate build scripts and need the
  # same workspace checks as sidecar Rust sources.
  - 'lib/sidecar/**/*.proto'

benchmarks:
  - 'benchmarks/**'
  - '!**/*.md'
  - '!**/*.rst'

efa:
  - 'container/templates/aws.Dockerfile'
