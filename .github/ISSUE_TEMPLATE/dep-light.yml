name: Lightweight DEP
description: Quick proposal for smaller changes
title: "DEP (light): "
labels: ["dep:draft", "dep:lightweight"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Primary area this DEP affects
      options:
        - frontend
        - agents
        - router
        - backend-vllm
        - backend-trtllm
        - backend-sglang
        - kv-memory
        - multimodal
        - diffusion
        - planner
        - runtime
        - observability
        - fault-tolerance
        - ops
        - docs
        - process
        - operator
        - gms
        - epp
        - tokenspeed
        - rl
        - performance
        - xpu
        - efa
        - cross-area (multiple)
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
