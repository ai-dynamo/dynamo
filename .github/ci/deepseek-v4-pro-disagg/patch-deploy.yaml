apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv4-pro-disagg
spec:
  priorityClassName: ci-nightly-high-priority
  components:
  - name: Frontend
    podTemplate:
      metadata: &podMetadata
        annotations:
          nvidia.com/disable-image-pull-secret-discovery: "true"
      spec:
        volumes: &modelCacheVolume
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        priorityClassName: ci-nightly-high-priority
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector: &arm64NodeSelector
          kubernetes.io/arch: arm64
        tolerations: &gpuTolerations
        - key: dedicated
          operator: Equal
          value: user-workload
          effect: NoExecute
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
        affinity:
          nodeAffinity: &gb200NodeAffinity
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: cloud.google.com/gke-nodepool
                  operator: In
                  values: [customer-gpu-o7v, customer-gpu-w0e]
        containers:
        - name: main
          volumeMounts:
          - name: shared-model-cache
            mountPath: /opt/models
  - name: decode
    podTemplate:
      metadata: *podMetadata
      spec:
        volumes: *modelCacheVolume
        priorityClassName: ci-nightly-high-priority
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector: *arm64NodeSelector
        tolerations: *gpuTolerations
        affinity:
          nodeAffinity: *gb200NodeAffinity
          podAffinity: &workerPodAffinity
            requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: nvidia.com/gpu.clique
              matchLabelKeys: [nvidia.com/dynamo-graph-deployment-name]
              labelSelector:
                matchExpressions:
                - key: nvidia.com/dynamo-component-type
                  operator: In
                  values: [prefill, decode]
        containers:
        - name: main
          env: &workerEnvs
          - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
            value: "1200"
          # vLLM reads per-transfer NIXL telemetry. The NOP exporter keeps that
          # data available without binding one Prometheus port per DP process.
          - name: NIXL_TELEMETRY_ENABLE
            value: "y"
          - name: NIXL_TELEMETRY_EXPORTER
            value: NOP
          startupProbe: &workerStartupProbe
            # DeepSeek V4 Pro loads an 805 GiB checkpoint from Lustre. Preserve
            # the first cold-start attempt instead of restarting it at 90 minutes.
            failureThreshold: 900
          volumeMounts:
          - name: shared-model-cache
            mountPath: /opt/models
  - name: prefill
    podTemplate:
      metadata: *podMetadata
      spec:
        volumes: *modelCacheVolume
        priorityClassName: ci-nightly-high-priority
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector: *arm64NodeSelector
        tolerations: *gpuTolerations
        affinity:
          nodeAffinity: *gb200NodeAffinity
          podAffinity: *workerPodAffinity
        containers:
        - name: main
          env: *workerEnvs
          startupProbe: *workerStartupProbe
          volumeMounts:
          - name: shared-model-cache
            mountPath: /opt/models
