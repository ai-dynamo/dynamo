apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: dsv4-pro-disagg
spec:
  priorityClassName: ci-nightly-high-priority
  pvcs:
  - name: shared-model-cache
    create: false
  services:
    Frontend:
      extraPodMetadata: &podMetadata
        annotations:
          nvidia.com/disable-image-pull-secret-discovery: "true"
      volumeMounts: &modelVolumeMounts
      - name: shared-model-cache
        mountPoint: /opt/models
      extraPodSpec:
        priorityClassName: ci-nightly-high-priority
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector: &arm64NodeSelector
          kubernetes.io/arch: arm64
        tolerations: &gpuTolerations
        - key: dedicated
          operator: Equal
          value: user-workload
          effect: NoExecute
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
        affinity:
          nodeAffinity: &gb200NodeAffinity
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: cloud.google.com/gke-nodepool
                  operator: In
                  values: [customer-gpu-o7v, customer-gpu-w0e]
    prefill:
      extraPodMetadata: *podMetadata
      envs: &workerEnvs
      - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
        value: "1200"
      # vLLM reads per-transfer NIXL telemetry. The NOP exporter keeps that
      # data available without binding one Prometheus port per DP process.
      - name: NIXL_TELEMETRY_ENABLE
        value: "y"
      - name: NIXL_TELEMETRY_EXPORTER
        value: NOP
      volumeMounts: *modelVolumeMounts
      extraPodSpec:
        priorityClassName: ci-nightly-high-priority
        mainContainer: &workerMainContainer
          # DeepSeek V4 Pro loads an 805 GiB checkpoint from Lustre. Preserve
          # the first cold-start attempt instead of restarting it at 90 minutes.
          startupProbe:
            failureThreshold: 900
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector: *arm64NodeSelector
        tolerations: *gpuTolerations
        affinity:
          nodeAffinity: *gb200NodeAffinity
          podAffinity: &workerPodAffinity
            requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: nvidia.com/gpu.clique
              matchLabelKeys: [nvidia.com/dynamo-graph-deployment-name]
              labelSelector:
                matchExpressions:
                - key: nvidia.com/dynamo-component-type
                  operator: In
                  values: [prefill, decode]
    decode:
      extraPodMetadata: *podMetadata
      envs: *workerEnvs
      volumeMounts: *modelVolumeMounts
      extraPodSpec:
        priorityClassName: ci-nightly-high-priority
        mainContainer: *workerMainContainer
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector: *arm64NodeSelector
        tolerations: *gpuTolerations
        affinity:
          nodeAffinity: *gb200NodeAffinity
          podAffinity: *workerPodAffinity
