apiVersion: batch/v1
kind: Job
metadata:
  name: dsv4-pro-disagg-bench
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    spec:
      affinity: null
      priorityClassName: ci-nightly-high-priority
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
      - key: dedicated
        operator: Equal
        value: user-workload
        effect: NoExecute
      containers:
      - name: bench
        env:
        # Chat framing adds about 80 tokens; leave room under max-model-len=9280.
        - name: ISL
          value: "8064"
        - name: CONCURRENCIES
          value: "512"
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: shared-model-cache
