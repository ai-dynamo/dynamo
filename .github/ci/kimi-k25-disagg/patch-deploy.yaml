apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: kimi-k25-disagg-kv-eagle
spec:
  backendFramework: trtllm
  priorityClassName: ci-nightly-high-priority
  components:
  - name: Frontend
    podTemplate:
      metadata: &podMetadata
        annotations:
          nvidia.com/disable-image-pull-secret-discovery: "true"
      spec:
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        priorityClassName: ci-nightly-high-priority
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector: &arm64NodeSelector
          kubernetes.io/arch: arm64
        tolerations: &gpuTolerations
        - key: dedicated
          operator: Equal
          value: user-workload
          effect: NoExecute
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
        affinity:
          nodeAffinity: &gb200NodeAffinity
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: cloud.google.com/gke-nodepool
                  operator: In
                  # The TRT-LLM nightly image is validated on o7v's driver stack.
                  values: [customer-gpu-o7v]
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                  - key: nvidia.com/dynamo-graph-deployment-name
                    operator: Exists
        containers:
        - name: main
          volumeMounts:
          - name: shared-model-cache
            mountPath: /opt/models
  - name: decode
    replicas: 1
    sharedMemorySize: 179Gi
    podTemplate:
      metadata: *podMetadata
      spec:
        priorityClassName: ci-nightly-high-priority
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector: *arm64NodeSelector
        tolerations: *gpuTolerations
        affinity:
          nodeAffinity: *gb200NodeAffinity
          podAffinity: &workerPodAffinity
            requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: nvidia.com/gpu.clique
              matchLabelKeys: [nvidia.com/dynamo-graph-deployment-name]
              labelSelector:
                matchExpressions:
                - key: nvidia.com/dynamo-component-type
                  operator: In
                  values: [prefill, decode]
        containers:
        - name: main
          resources:
            requests:
              nvidia.com/gpu: "4"
  - name: prefill
    replicas: 1
    sharedMemorySize: 179Gi
    podTemplate:
      metadata: *podMetadata
      spec:
        priorityClassName: ci-nightly-high-priority
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector: *arm64NodeSelector
        tolerations: *gpuTolerations
        affinity:
          nodeAffinity: *gb200NodeAffinity
          podAffinity: *workerPodAffinity
        containers:
        - name: main
          resources:
            requests:
              nvidia.com/gpu: "4"
