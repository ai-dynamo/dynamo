apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dynamo-nightly-dsv4
# Provides the strategic-merge schema (x-kubernetes-list-type=map) so the
# v1beta1 spec.components list merges by name instead of being replaced.
components:
- ../../../recipes/kustomize/components/dynamo-openapi
commonLabels:
  ci-run: local
resources:
- ../../../recipes/kimi-k2.5/trtllm/disagg-eagle-kv-router/deploy.yaml
- ../../../recipes/kimi-k2.5/model-cache/compute-domain.yaml
- ../../../recipes/kimi-k2.5/trtllm/disagg-eagle-kv-router/perf.yaml
patches:
- path: patch-deploy.yaml
- path: patch-prefill-config.yaml
- path: patch-perf.yaml
- target:
    kind: ComputeDomain
    name: your-compute-domain
  patch: |-
    - op: replace
      path: /metadata/name
      value: kimi-k25-disagg-compute-domain
    - op: replace
      path: /spec/channel/resourceClaimTemplate/name
      value: kimi-k25-disagg-compute-domain-channel
- target:
    kind: DynamoGraphDeployment
    name: kimi-k25-disagg-kv-eagle
  patch: |-
    # Components are sorted by name: Frontend is index 0, decode 1, prefill 2.
    # The op: test guards pin the positional paths to the expected shape.
    - op: test
      path: /spec/components/0/name
      value: Frontend
    - op: test
      path: /spec/components/0/podTemplate/spec/containers/0/name
      value: main
    - op: add
      path: /spec/components/0/podTemplate/spec/containers/0/env/-
      value: {name: HF_HOME, value: /opt/models}
    - op: test
      path: /spec/components/1/name
      value: decode
    - op: test
      path: /spec/components/1/podTemplate/spec/containers/0/name
      value: main
    - op: test
      path: /spec/components/1/podTemplate/spec/volumes/0/name
      value: model-cache
    - op: replace
      path: /spec/components/1/podTemplate/spec/resourceClaims/0/resourceClaimTemplateName
      value: kimi-k25-disagg-compute-domain-channel
    - op: replace
      path: /spec/components/1/podTemplate/spec/volumes/0/persistentVolumeClaim/claimName
      value: shared-model-cache
    - op: test
      path: /spec/components/2/name
      value: prefill
    - op: test
      path: /spec/components/2/podTemplate/spec/containers/0/name
      value: main
    - op: test
      path: /spec/components/2/podTemplate/spec/volumes/0/name
      value: model-cache
    - op: replace
      path: /spec/components/2/podTemplate/spec/resourceClaims/0/resourceClaimTemplateName
      value: kimi-k25-disagg-compute-domain-channel
    - op: replace
      path: /spec/components/2/podTemplate/spec/volumes/0/persistentVolumeClaim/claimName
      value: shared-model-cache
