apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dynamo-nightly-dsv4
commonLabels:
  ci-run: local
resources:
- ../../../recipes/kimi-k2.5/trtllm/disagg-eagle-kv-router/deploy.yaml
- ../../../recipes/kimi-k2.5/model-cache/compute-domain.yaml
- ../../../recipes/kimi-k2.5/trtllm/disagg-eagle-kv-router/perf.yaml
patches:
- path: patch-deploy.yaml
- path: patch-prefill-config.yaml
- path: patch-perf.yaml
- target:
    kind: ComputeDomain
    name: your-compute-domain
  patch: |-
    - op: replace
      path: /metadata/name
      value: kimi-k25-disagg-compute-domain
    - op: replace
      path: /spec/channel/resourceClaimTemplate/name
      value: kimi-k25-disagg-compute-domain-channel
- target:
    kind: DynamoGraphDeployment
    name: kimi-k25-disagg-kv-eagle
  patch: |-
    - op: add
      path: /spec/services/Frontend/extraPodSpec/mainContainer/env/-
      value: {name: HF_HOME, value: /opt/models}
    - op: replace
      path: /spec/services/prefill/extraPodSpec/resourceClaims/0/resourceClaimTemplateName
      value: kimi-k25-disagg-compute-domain-channel
    - op: replace
      path: /spec/services/prefill/extraPodSpec/volumes/0/persistentVolumeClaim/claimName
      value: shared-model-cache
    - op: replace
      path: /spec/services/decode/extraPodSpec/resourceClaims/0/resourceClaimTemplateName
      value: kimi-k25-disagg-compute-domain-channel
    - op: replace
      path: /spec/services/decode/extraPodSpec/volumes/0/persistentVolumeClaim/claimName
      value: shared-model-cache
