apiVersion: v1
kind: ConfigMap
metadata:
  name: kimi-k25-disagg-kv-eagle-config
data:
  prefill.yaml: |
    cache_transceiver_config:
      backend: UCX
      transceiver_runtime: CPP
      max_tokens_in_buffer: 0
      kv_transfer_sender_future_timeout_ms: 30000
    allreduce_strategy: MNNVL
    max_batch_size: 4
    max_num_tokens: 8192
    enable_chunked_prefill: true
    max_seq_len: 200000
    tensor_parallel_size: 4
    moe_expert_parallel_size: 4
    # TensorRT-LLM 1.3.0rc28 and rc29 allocate the same EAGLE3 request slot
    # twice with attention DP. Limit this workaround to the nightly CI overlay.
    enable_attention_dp: false
    pipeline_parallel_size: 1
    print_iter_log: true
    stream_interval: 100
    trust_remote_code: true
    cuda_graph_config: null
    disable_overlap_scheduler: true
    moe_config:
      backend: TRTLLM
    kv_cache_config:
      enable_block_reuse: true
      free_gpu_memory_fraction: 0.6
      host_cache_size: 107374182400  # 100 GiB host-memory KV offload
      secondary_offload_min_priority: 35
      dtype: fp8
      tokens_per_block: 32
    speculative_config:
      decoding_type: Eagle
      max_draft_len: 3
      allow_advanced_sampling: true
      speculative_model_dir: nvidia/Kimi-K2.5-Thinking-Eagle3
