apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimi-k25-nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kimi-k25-nats
  template:
    metadata:
      labels:
        app: kimi-k25-nats
    spec:
      priorityClassName: ci-nightly-high-priority
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
      - key: dedicated
        operator: Equal
        value: user-workload
        effect: NoExecute
      containers:
      - name: nats
        image: nats:2.12.4
        args: [-a, 0.0.0.0, -p, "4222"]
        ports:
        - name: client
          containerPort: 4222
        readinessProbe:
          tcpSocket:
            port: client
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kimi-k25-nats
spec:
  selector:
    app: kimi-k25-nats
  ports:
  - name: client
    port: 4222
    targetPort: client
