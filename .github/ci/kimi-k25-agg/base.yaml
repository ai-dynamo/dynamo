# Upstream: https://github.com/ai-dynamo/dynamo/tree/main/recipes/kimi-k2.5/trtllm/agg-eagle-kv-router

apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: kimi-k25-compute-domain
spec:
  numNodes: 0
  channel:
    resourceClaimTemplate:
      name: kimi-k25-compute-domain-channel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kimi-k25-agg-kv-eagle-config
data:
  agg.yaml: |
    allreduce_strategy: MNNVL
    max_num_tokens: 8192
    enable_chunked_prefill: true
    cuda_graph_config:
      batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
      enable_padding: true
    enable_attention_dp: false
    kv_cache_config:
      dtype: fp8
      enable_block_reuse: true
      free_gpu_memory_fraction: 0.75
      tokens_per_block: 32
    max_batch_size: 128
    moe_config:
      backend: CUTLASS
      use_low_precision_moe_combine: true
    moe_expert_parallel_size: 8
    nvfp4_gemm_config:
      allowed_backends:
        - cutlass
        - cublaslt
        - cuda_core
    print_iter_log: true
    stream_interval: 10
    tensor_parallel_size: 8
    trust_remote_code: true
    speculative_config:
      decoding_type: Eagle3
      max_draft_len: 3
      allow_advanced_sampling: true
      speculative_model_dir: nvidia/Kimi-K2.5-Thinking-Eagle3
---
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: kimi-k25-trtllm-aggregate
spec:
  backendFramework: trtllm
  envs:
    - name: NCCL_MNNVL_ENABLE
      value: "1"
    - name: NCCL_CUMEM_ENABLE
      value: "1"
    - name: TLLM_LOG_LEVEL
      value: info
  pvcs:
    - name: model-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
          workingDir: /workspace/
          command: [python3]
          args: [-m, dynamo.frontend, --router-mode, kv]
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HF_HOME
              value: /opt/models
    Worker:
      componentType: worker
      replicas: 3
      multinode:
        nodeCount: 2
      envFromSecret: hf-token-secret
      resources:
        requests:
          gpu: "4"
        limits:
          gpu: "4"
        claims:
          - name: compute-domain-channel
      sharedMemory:
        size: 179Gi
      volumeMounts:
        - name: model-cache
          mountPoint: /opt/models
      extraPodSpec:
        resourceClaims:
          - name: compute-domain-channel
            resourceClaimTemplateName: kimi-k25-compute-domain-channel
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
          workingDir: /workspace/
          command: [/bin/bash, -lc]
          args:
            - |
              python3 -m dynamo.trtllm \
                --model-path "${MODEL_NAME}" \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --extra-engine-args /config/agg.yaml \
                --publish-events-and-metrics \
                --kv-block-size 32 \
                --dyn-tool-call-parser kimi_k2 \
                --dyn-reasoning-parser kimi_k25
          env:
            - name: MODEL_NAME
              value: nvidia/Kimi-K2.5-NVFP4
            - name: SERVED_MODEL_NAME
              value: nvidia/Kimi-K2.5-NVFP4
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HF_HOME
              value: /opt/models
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRITON_CACHE_DIR
              value: /tmp/.triton-cache
            - name: HF_MODULES_CACHE
              value: /tmp/hf_modules
            - name: NCCL_GRAPH_MIXING_SUPPORT
              value: "0"
            - name: TRTLLM_ENABLE_PDL
              value: "1"
          securityContext:
            runAsUser: 0
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
          volumeMounts:
            - name: trtllm-config
              mountPath: /config
              readOnly: true
        volumes:
          - name: trtllm-config
            configMap:
              name: kimi-k25-agg-kv-eagle-config
