apiVersion: batch/v1
kind: Job
metadata:
  name: model-download
spec:
  template:
    spec:
      priorityClassName: ci-nightly-high-priority
      tolerations:
      - key: dedicated
        operator: Equal
        value: user-workload
        effect: NoExecute
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: shared-model-cache
