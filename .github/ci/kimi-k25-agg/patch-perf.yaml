apiVersion: batch/v1
kind: Job
metadata:
  name: kimi-k25-agg-kv-eagle-bench
spec:
  activeDeadlineSeconds: 900
  template:
    spec:
      priorityClassName: ci-nightly-high-priority
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
      - key: dedicated
        operator: Equal
        value: user-workload
        effect: NoExecute
      containers:
      - name: perf
        env:
        - name: CONCURRENCIES
          value: "128"
        - name: BENCHMARK_DURATION
          value: "120"
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: shared-model-cache
