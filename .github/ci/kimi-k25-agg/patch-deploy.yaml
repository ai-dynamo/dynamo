apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: kimi-k25-agg-kv-eagle
spec:
  backendFramework: trtllm
  priorityClassName: ci-nightly-high-priority
  components:
  - name: Frontend
    podTemplate:
      metadata:
        annotations:
          nvidia.com/disable-image-pull-secret-discovery: "true"
      spec:
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        priorityClassName: ci-nightly-high-priority
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
        - key: dedicated
          operator: Equal
          value: user-workload
          effect: NoExecute
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: cloud.google.com/gke-nodepool
                  operator: In
                  values: [customer-gpu-o7v, customer-gpu-w0e]
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                  - key: nvidia.com/dynamo-graph-deployment-name
                    operator: Exists
        containers:
        - name: main
          volumeMounts:
          - name: shared-model-cache
            mountPath: /opt/models
  - name: agg
    replicas: 1
    sharedMemorySize: 179Gi
    podTemplate:
      metadata:
        annotations:
          nvidia.com/disable-image-pull-secret-discovery: "true"
      spec:
        priorityClassName: ci-nightly-high-priority
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
        - key: dedicated
          operator: Equal
          value: user-workload
          effect: NoExecute
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: cloud.google.com/gke-nodepool
                  operator: In
                  values: [customer-gpu-o7v, customer-gpu-w0e]
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: nvidia.com/gpu.clique
              matchLabelKeys: [nvidia.com/dynamo-graph-deployment-name]
              labelSelector:
                matchExpressions:
                - key: nvidia.com/dynamo-component-type
                  operator: In
                  values: [worker, prefill, decode]
        initContainers:
        - name: sshd-privsep-dir
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [sh, -c, "chmod 0755 /run/sshd && chown root:root /run/sshd"]
          securityContext:
            runAsUser: 0
          volumeMounts:
          - name: sshd-run
            mountPath: /run/sshd
        containers:
        - name: main
          resources:
            requests:
              nvidia.com/gpu: "4"
