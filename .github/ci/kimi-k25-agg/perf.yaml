# Reusable synthetic AIPerf benchmark Job for RecipeDeployment.
#
# This is an ordinary Kubernetes Job, not a values file or template. Required
# markers make each experiment choose its workload shape explicitly. The
# RecipeDeployment compiler rejects any marker left unresolved.
apiVersion: batch/v1
kind: Job
metadata:
  name: aiperf-synthetic
  annotations:
    benchmarks.dynamo.nvidia.com/tool: aiperf
    benchmarks.dynamo.nvidia.com/result-schema: aiperf
    benchmarks.dynamo.nvidia.com/scenario: synthetic
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: dynamo-ci-k8s
        artifacts: "true"
    spec:
      restartPolicy: Never
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: nvidia.com/dynamo-graph-deployment-name
                    operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: perf
          # TODO(recipe-deployment): Replace the mutable Python base and runtime
          # apt/pip installs with a digest-pinned benchmark-client image. Record
          # the client version in artifacts, keep future version transitions as
          # separately named YAML contracts, and load-test the worker/connection
          # policy before changing it.
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          securityContext:
            privileged: true
          # TODO(recipe-deployment): Add measured CPU/memory requests and limits
          # in a follow-up QoS change. The legacy path is also BestEffort, so
          # omission is not a migration regression; guessed limits could throttle
          # the load generator and alter benchmark results.
          env:
            - name: ENDPOINT
              value: DYNAMO_CI_RUNTIME__ENDPOINT
            - name: TARGET_MODEL
              value: DYNAMO_CI_REQUIRED__TARGET_MODEL
            - name: TOKENIZER
              value: DYNAMO_CI_REQUIRED__TOKENIZER
            - name: SCENARIO
              value: DYNAMO_CI_REQUIRED__SCENARIO
            - name: CONCURRENCIES
              value: DYNAMO_CI_REQUIRED__CONCURRENCIES
            - name: ISL
              value: DYNAMO_CI_REQUIRED__ISL
            - name: OSL
              value: DYNAMO_CI_REQUIRED__OSL
            - name: WARMUP_MULTIPLIER
              value: DYNAMO_CI_REQUIRED__WARMUP_MULTIPLIER
            # Set this in a plan when the benchmark contract requires one
            # fixed warm-up count across the entire concurrency sweep. When
            # empty, WARMUP_MULTIPLIER remains authoritative.
            - name: WARMUP_REQUEST_COUNT
              value: ""
            - name: REQUEST_MULTIPLIER
              value: DYNAMO_CI_REQUIRED__REQUEST_MULTIPLIER
            - name: READINESS_TIMEOUT
              value: "3600"
            - name: RANDOM_SEED
              value: "100"
            - name: NUM_DATASET_ENTRIES
              value: "12800"
            - name: WORKERS_MAX
              value: "252"
            - name: RECORD_PROCESSORS
              value: "32"
            - name: ENDPOINT_CHECK_PATH
              value: /v1/chat/completions
            - name: ENDPOINT_CHECK_INTERVAL
              value: "5"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
            - name: HF_HOME
              value: /model-cache
            - name: HF_MODULES_CACHE
              value: /tmp/hf_modules
            # Benchmark methodology: keep the HTTP pool aligned with
            # WORKERS_MAX so transport does not silently cap the authored load.
            - name: AIPERF_HTTP_CONNECTION_LIMIT
              value: "252"
            - name: AIPERF_DATASET_CONFIGURATION_TIMEOUT
              value: "900"
            - name: AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT
              value: "900"
            - name: PYTHONUNBUFFERED
              value: "1"
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail
              ulimit -n 600000

              # AIPerf >=0.8.0 depends on crick, which has no Linux aarch64
              # wheel. GB200 benchmark pods need build tools to compile it.
              timeout 300 apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                update -qq
              timeout 600 apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                install -y --no-install-recommends build-essential curl jq procps
              apt-get clean
              rm -rf /var/lib/apt/lists/*
              timeout 900 pip install --no-cache-dir --retries 5 --timeout 60 \
                "aiperf==0.10.0" \
                "protobuf==7.35.0" \
                "transformers==4.57.3" \
                "tiktoken==0.13.0"
              sysctl -w net.ipv4.ip_local_port_range="1024 65000" >/dev/null 2>&1 || true

              for value in "$READINESS_TIMEOUT" "$ENDPOINT_CHECK_INTERVAL"; do
                case "$value" in
                  ''|*[!0-9]*)
                    echo "READINESS_TIMEOUT and ENDPOINT_CHECK_INTERVAL must be positive integers" >&2
                    exit 2
                    ;;
                esac
                if [ "$value" -eq 0 ]; then
                  echo "READINESS_TIMEOUT and ENDPOINT_CHECK_INTERVAL must be greater than zero" >&2
                  exit 2
                fi
              done

              readiness_deadline=$((SECONDS + READINESS_TIMEOUT))
              echo "Waiting for model '$TARGET_MODEL' at http://$ENDPOINT/v1/models"
              until curl --connect-timeout 5 --max-time 15 -sf "http://$ENDPOINT/v1/models" \
                | jq -e --arg model "$TARGET_MODEL" '.data[]? | select(.id == $model)' >/dev/null; do
                if [ "$SECONDS" -ge "$readiness_deadline" ]; then
                  echo "Model readiness exhausted the shared ${READINESS_TIMEOUT}s API-readiness budget" >&2
                  exit 1
                fi
                sleep "$ENDPOINT_CHECK_INTERVAL"
              done

              while true; do
                if [ "$SECONDS" -ge "$readiness_deadline" ]; then
                  echo "Endpoint readiness exhausted the shared ${READINESS_TIMEOUT}s API-readiness budget" >&2
                  exit 1
                fi
                http_code="$(curl --connect-timeout 5 --max-time 30 -sS -o /dev/null -w '%{http_code}' -X POST \
                  "http://$ENDPOINT$ENDPOINT_CHECK_PATH" \
                  -H 'Content-Type: application/json' \
                  -H 'Authorization: Bearer placeholder' \
                  -d "{\"model\":\"$TARGET_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Hi\"}],\"max_tokens\":1}" \
                  || true)"
                case "$http_code" in
                  2*) break ;;
                esac
                if [ "$SECONDS" -ge "$readiness_deadline" ]; then
                  echo "Endpoint readiness exhausted the shared ${READINESS_TIMEOUT}s API-readiness budget (HTTP $http_code)" >&2
                  exit 1
                fi
                sleep "$ENDPOINT_CHECK_INTERVAL"
              done

              for value in $CONCURRENCIES $ISL $OSL $WARMUP_MULTIPLIER $REQUEST_MULTIPLIER; do
                case "$value" in
                  ''|*[!0-9]*)
                    echo "Benchmark shape values must be non-negative integers; found '$value'" >&2
                    exit 2
                    ;;
                esac
              done
              if [ -n "$WARMUP_REQUEST_COUNT" ]; then
                case "$WARMUP_REQUEST_COUNT" in
                  *[!0-9]*)
                    echo "WARMUP_REQUEST_COUNT must be a non-negative integer; found '$WARMUP_REQUEST_COUNT'" >&2
                    exit 2
                    ;;
                esac
              fi

              base_artifact_dir="/shared-artifacts/results/$SCENARIO"
              mkdir -p "$base_artifact_dir"
              export COLUMNS=200

              for concurrency in $CONCURRENCIES; do
                artifact_dir="$base_artifact_dir/c$concurrency"
                mkdir -p "$artifact_dir"
                if [ -n "$WARMUP_REQUEST_COUNT" ]; then
                  warmup_count="$WARMUP_REQUEST_COUNT"
                else
                  warmup_count=$((concurrency * WARMUP_MULTIPLIER))
                fi
                request_count=$((concurrency * REQUEST_MULTIPLIER))

                # Eagle3 rejects min_tokens; ignore_eos and max_tokens fix output length.
                set -- aiperf profile \
                  --model "$TARGET_MODEL" \
                  --tokenizer "$TOKENIZER" \
                  --tokenizer-trust-remote-code \
                  --endpoint-type chat \
                  --endpoint /v1/chat/completions \
                  --url "http://$ENDPOINT" \
                  --streaming \
                  --concurrency "$concurrency" \
                  --warmup-request-count "$warmup_count" \
                  --request-count "$request_count" \
                  --synthetic-input-tokens-mean "$ISL" \
                  --synthetic-input-tokens-stddev 0 \
                  --output-tokens-mean "$OSL" \
                  --output-tokens-stddev 0 \
                  --extra-inputs "max_tokens:$OSL" \
                  --extra-inputs ignore_eos:true \
                  --extra-inputs repetition_penalty:1.0 \
                  --extra-inputs temperature:0.0 \
                  --num-dataset-entries "$NUM_DATASET_ENTRIES" \
                  --workers-max "$WORKERS_MAX" \
                  --record-processors "$RECORD_PROCESSORS" \
                  --random-seed "$RANDOM_SEED" \
                  --artifact-dir "$artifact_dir" \
                  --ui simple \
                  -H 'Authorization: Bearer NOT USED' \
                  -H 'Accept: text/event-stream'

                "$@"
                sleep 5
              done
          volumeMounts:
            - name: results
              mountPath: /shared-artifacts
            - name: model-cache
              mountPath: /model-cache
        - name: sidecar-for-cp
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - echo 'Sidecar ready for artifact collection'; sleep infinity
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: results
              mountPath: /shared-artifacts
      volumes:
        - name: results
          emptyDir: {}
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
