apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dynamo-nightly-dsv4
# Provides the strategic-merge schema (x-kubernetes-list-type=map) so the
# v1beta1 spec.components list merges by name instead of being replaced.
components:
- ../../../recipes/kustomize/components/dynamo-openapi
commonLabels:
  ci-run: local
resources:
- ../../../recipes/kimi-k2.5/trtllm/agg-eagle-kv-router/deploy.yaml
- ../../../recipes/kimi-k2.5/model-cache/compute-domain.yaml
- ../../../recipes/kimi-k2.5/trtllm/agg-eagle-kv-router/perf.yaml
patches:
- path: patch-deploy.yaml
- path: patch-perf.yaml
- target:
    kind: ComputeDomain
    name: your-compute-domain
  patch: |-
    - op: replace
      path: /metadata/name
      value: kimi-k25-compute-domain
    - op: replace
      path: /spec/channel/resourceClaimTemplate/name
      value: kimi-k25-compute-domain-channel
- target:
    kind: DynamoGraphDeployment
    name: kimi-k25-agg-kv-eagle
  patch: |-
    # Components are sorted by name: Frontend is index 0, agg is index 1.
    # The op: test guards pin the positional paths to the expected shape.
    - op: test
      path: /spec/components/0/name
      value: Frontend
    - op: test
      path: /spec/components/0/podTemplate/spec/containers/0/name
      value: main
    - op: add
      path: /spec/components/0/podTemplate/spec/containers/0/env/-
      value: {name: HF_HOME, value: /opt/models}
    - op: test
      path: /spec/components/1/name
      value: agg
    - op: test
      path: /spec/components/1/podTemplate/spec/containers/0/name
      value: main
    # Spread MPI ranks across both GPU pods and keep each pod's ranks contiguous.
    - op: add
      path: /spec/components/1/podTemplate/spec/containers/0/env/-
      value: {name: PRTE_MCA_rmaps_default_mapping_policy, value: "node:oversubscribe"}
    - op: add
      path: /spec/components/1/podTemplate/spec/containers/0/env/-
      value: {name: PRTE_MCA_rmaps_default_ranking_policy, value: slot}
    # These pods expose no gIB devices; Socket preserves intra-clique MNNVL.
    - op: add
      path: /spec/components/1/podTemplate/spec/containers/0/env/-
      value: {name: NCCL_NET, value: Socket}
    - op: test
      path: /spec/components/1/podTemplate/spec/volumes/0/name
      value: model-cache
    - op: replace
      path: /spec/components/1/podTemplate/spec/resourceClaims/0/resourceClaimTemplateName
      value: kimi-k25-compute-domain-channel
    - op: replace
      path: /spec/components/1/podTemplate/spec/volumes/0/persistentVolumeClaim/claimName
      value: shared-model-cache
    - op: add
      path: /spec/components/1/podTemplate/spec/containers/0/volumeMounts/-
      value: {name: sshd-run, mountPath: /run/sshd}
    - op: add
      path: /spec/components/1/podTemplate/spec/volumes/-
      value: {name: sshd-run, emptyDir: {}}
