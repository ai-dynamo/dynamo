apiVersion: batch/v1
kind: Job
metadata:
  name: dsv4-bench
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    spec:
      affinity: null
      priorityClassName: ci-nightly-high-priority
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
      - key: dedicated
        operator: Equal
        value: user-workload
        effect: NoExecute
      containers:
      - name: perf
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
        env:
        - name: ENDPOINT
          value: dsv4-pro-agg-frontend:8000
        - name: TARGET_MODEL
          value: deepseek-ai/DeepSeek-V4-Pro
        - name: CONCURRENCY
          value: "1"
        - name: REQUEST_TIMEOUT_SECONDS
          value: "120"
        - name: WAIT_FOR_MODEL_MAX_ATTEMPTS
          value: "12"
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: shared-model-cache
