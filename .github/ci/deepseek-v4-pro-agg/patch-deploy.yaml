apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: dsv4-pro-agg
spec:
  priorityClassName: ci-nightly-high-priority
  components:
  - name: Frontend
    podTemplate:
      metadata:
        annotations:
          nvidia.com/disable-image-pull-secret-discovery: "true"
      spec:
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        priorityClassName: ci-nightly-high-priority
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
        - key: dedicated
          operator: Equal
          value: user-workload
          effect: NoExecute
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: cloud.google.com/gke-nodepool
                  operator: In
                  values: [customer-gpu-o7v, customer-gpu-w0e]
        containers:
        - name: main
          volumeMounts:
          - name: shared-model-cache
            mountPath: /opt/models
  - name: worker
    podTemplate:
      metadata:
        annotations:
          nvidia.com/disable-image-pull-secret-discovery: "true"
      spec:
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
        priorityClassName: ci-nightly-high-priority
        imagePullSecrets:
        - name: acr-token-secret
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
        - key: dedicated
          operator: Equal
          value: user-workload
          effect: NoExecute
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: cloud.google.com/gke-nodepool
                  operator: In
                  values: [customer-gpu-o7v, customer-gpu-w0e]
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: nvidia.com/gpu.clique
              matchLabelKeys: [nvidia.com/dynamo-graph-deployment-name]
              labelSelector:
                matchExpressions:
                - key: nvidia.com/dynamo-component-type
                  operator: In
                  values: [worker, decode]
        containers:
        - name: main
          env:
          # Allow long prefills and cold JIT before marking workers unhealthy.
          - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
            value: "1200"
          volumeMounts:
          - name: shared-model-cache
            mountPath: /opt/models
