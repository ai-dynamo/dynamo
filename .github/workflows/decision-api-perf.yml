name: Decision API Instrument CPU

on:
  pull_request:
    paths:
      - 'benchmarks/decision_api/**'
      - '.github/workflows/decision-api-perf.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/decision_api/**'
      - '.github/workflows/decision-api-perf.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  instrument-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmarks/decision_api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the pinned instrument and CPU test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate unit contracts and coverage
        env:
          CUDA_VISIBLE_DEVICES: ''
          COVERAGE_FILE: ${{ runner.temp }}/decision-api.coverage
        run: python -m pytest -q -m unit --cov=dynamo_decision_perf --cov-fail-under=80
      - name: Validate actual AIPerf HTTP and SSE instrumentation
        env:
          CUDA_VISIBLE_DEVICES: ''
          DECISION_PERF_INTEGRATION: '1'
        run: python -m pytest -q tests/test_instrument_integration.py
