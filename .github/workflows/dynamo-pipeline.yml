# Dynamo Pipeline — single entry point for building the dynamo runtime image
# and running all of its associated checks (mypy, pytest parallel/
# sequential/GPU).

name: Dynamo Pipeline

on:
  workflow_call:
    inputs:
      gpu_runner_labels:
        description: 'JSON runner labels for Python GPU tests; defaults to the existing unpinned runner selector'
        required: false
        type: string
        default: '["prod-tester-amd-gpu-v2"]'
      builder_name:
        description: 'BuildKit builder name'
        required: true
        type: string
      cuda_version:
        description: 'CUDA version for the runtime image (e.g. 13.0). cuda13 is the default.'
        required: false
        type: string
        default: '13.0'
      fresh_builder:
        description: 'Always create a fresh K8s BuildKit builder (for nightly)'
        required: false
        type: boolean
        default: false
      build_timeout_minutes:
        description: 'Timeout for the image build job. Matches the 60 min the other framework builds get in pr.yaml.'
        required: false
        type: number
        default: 60
      no_cache:
        description: 'Disable BuildKit cache-from/to. Nightly sets true for regression detection.'
        required: false
        type: boolean
        default: false
      dev_version_suffix:
        description: 'PEP 440 dev suffix (e.g. .dev20260423+g1234567). Empty = stable build.'
        required: false
        type: string
        default: ''
      source_ref:
        description: 'Git ref/SHA to checkout and tag images with. Empty = caller SHA (github.sha).'
        required: false
        type: string
        default: ''
      image_tag_suffix:
        description: 'Suffix appended to the SHA-keyed image tag (e.g. "-nightly"). Empty = no suffix.'
        required: false
        type: string
        default: ''
      cpu_parallel_test_markers:
        required: true
        type: string
      gpu_test_markers:
        required: true
        type: string
    secrets:
      AWS_DEFAULT_REGION:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AZURE_ACR_HOSTNAME:
        required: true
      AZURE_ACR_USER:
        required: true
      AZURE_ACR_PASSWORD:
        required: true
      SCCACHE_S3_BUCKET:
        required: false
      HF_TOKEN:
        required: false


jobs:
  image:
    uses: $/.github/workflows/shared-build-image.yml
    with:
      framework: dynamo
      target: runtime
      cuda_version: '["${{ inputs.cuda_version }}"]'
      platform: 'linux/amd64,linux/arm64'
      builder_name: ${{ inputs.builder_name }}
      fresh_builder: ${{ inputs.fresh_builder }}
      no_cache: ${{ inputs.no_cache }}
      build_timeout_minutes: ${{ inputs.build_timeout_minutes }}
      dev_version_suffix: ${{ inputs.dev_version_suffix }}
      source_ref: ${{ inputs.source_ref }}
      image_tag_suffix: ${{ inputs.image_tag_suffix }}
    secrets: inherit

  # mypy runs inside the built image because it depends on pinned Python
  # package versions that aren't reproducible on plain ubuntu-latest runners.
  mypy:
    needs: image
    runs-on: prod-tester-amd-v2
    container:
      image: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}-${{ needs.image.outputs.target_tag_plain }}${{ inputs.image_tag_suffix }}-test
      env:
        # The image creates user 'dynamo' at uid 1000, but the ARC k8s runner
        # executes the job pod as uid 1001 (runner's uid). Overriding HOME and
        # USER here sidesteps two symptoms of that mismatch:
        #   * actions/checkout probing $HOME/.gitconfig (owned by 1000, unreadable by 1001)
        #   * torch._inductor calling getpass.getuser() -> pwd.getpwuid(1001) -> KeyError
        HOME: /__w/dynamo/dynamo
        USER: dynamo
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
      - name: Run mypy (components)
        working-directory: /workspace
        shell: bash
        # We have to exclude the components/src/dynamo/triton folder from the mypy check
        # due its required dependencies not being available at verification time.
        run: |
          MYPYPATH=components/src:lib/bindings/python/src
          TARGETS=$(find components/src/dynamo -maxdepth 1 -mindepth 1 -type d ! -name "triton" | sort | tr "\n" " ")
          MYPYPATH=$MYPYPATH mypy --explicit-package-bases $TARGETS
      - name: Run mypy (bindings)
        working-directory: /workspace
        shell: bash
        run: |
          MYPYPATH=lib/bindings/python/src mypy -p dynamo

  # TODO: real xdist parallelism port conflicts. cpu_parallel_mode='none'
  # below runs -n 0, so this job is NOT actually parallel right now.
  parallel:
    name: test
    needs: image
    uses: $/.github/workflows/shared-test.yml
    with:
      test_suite_name: dynamo
      framework: dynamo  # matches the framework passed to image
      test_type: parallel
      amd_runner: prod-tester-amd-v2
      target_tag_plain: ${{ needs.image.outputs.target_tag_plain }}
      cuda_version: '["${{ inputs.cuda_version }}"]'
      platform: '["amd64", "arm64"]'
      run_sanity_check: false
      run_cpu_only_tests: true
      cpu_only_test_markers: ${{ inputs.cpu_parallel_test_markers }}
      cpu_only_test_timeout_minutes: 30
      cpu_parallel_mode: 'none'
      run_gpu_tests: false
      source_ref: ${{ inputs.source_ref }}
      image_tag_suffix: ${{ inputs.image_tag_suffix }}
    secrets: inherit

  sequential:
    name: test
    needs: image
    uses: $/.github/workflows/shared-test.yml
    with:
      test_suite_name: dynamo
      framework: dynamo  # matches the framework passed to image
      test_type: sequential
      amd_runner: prod-tester-amd-v2
      target_tag_plain: ${{ needs.image.outputs.target_tag_plain }}
      cuda_version: '["${{ inputs.cuda_version }}"]'
      platform: '["amd64", "arm64"]'
      run_sanity_check: false
      run_cpu_only_tests: true
      cpu_only_test_markers: 'pre_merge and not parallel and not defaulted and not (vllm or sglang or trtllm) and (gpu_0)'
      cpu_only_test_timeout_minutes: 45
      cpu_parallel_mode: 'none'
      run_gpu_tests: false
      source_ref: ${{ inputs.source_ref }}
      image_tag_suffix: ${{ inputs.image_tag_suffix }}
    secrets: inherit

  gpu:
    name: test
    needs: image
    uses: $/.github/workflows/shared-test.yml
    with:
      test_suite_name: dynamo
      framework: dynamo  # matches the framework passed to image
      test_type: gpu
      amd_runner: prod-tester-amd-gpu-v2
      amd_runner_labels: ${{ inputs.gpu_runner_labels }}
      target_tag_plain: ${{ needs.image.outputs.target_tag_plain }}
      cuda_version: '["${{ inputs.cuda_version }}"]'
      platform: '["amd64"]'
      run_sanity_check: false
      run_cpu_only_tests: false
      run_gpu_tests: true
      gpu_test_markers: ${{ inputs.gpu_test_markers }}
      gpu_test_timeout_minutes: 30
      source_ref: ${{ inputs.source_ref }}
      image_tag_suffix: ${{ inputs.image_tag_suffix }}
    secrets: inherit
