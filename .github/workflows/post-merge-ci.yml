name: CUDA runtime permission probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Compile helper
        shell: bash
        run: |
          set -euo pipefail
          command -v gcc dpkg-deb curl sha256sum
          build_dir="$RUNNER_TEMP/cuda-runtime-helper"
          mkdir -p "$build_dir"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-cudart-dev-13-0_13.0.96-1_amd64.deb \
            --output "$build_dir/cuda-headers.deb"
          printf '%s  %s\n' fb74ece01ea01e6c44335967fae3d47ff60524a5e061037b6be446dcc9ef1ee3 "$build_dir/cuda-headers.deb" | sha256sum --check
          dpkg-deb --extract "$build_dir/cuda-headers.deb" "$build_dir/headers"
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror .github/scripts/cuda-runtime-helper.c \
            -I "$build_dir/headers/usr/local/cuda-13.0/targets/x86_64-linux/include" -ldl -o "$build_dir/cuda-checkpoint-helper"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cuda-runtime-helper
          path: ${{ runner.temp }}/cuda-runtime-helper/cuda-checkpoint-helper
          if-no-files-found: error
          retention-days: 1
  probe:
    needs: build-helper
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 9
    env:
      PROBE_NAMESPACE: cuda-permission-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cuda-runtime-helper
          path: ${{ runner.temp }}/cuda-runtime-helper
      - name: Run isolated permission comparison
        shell: bash
        run: |
          set -euo pipefail
          kubectl --request-timeout=10s create namespace "$PROBE_NAMESPACE"
          kubectl --request-timeout=10s label namespace "$PROBE_NAMESPACE" \
            nscleanup/enabled=true nscleanup/ttl=600 dynamo.github/run-id="${GITHUB_RUN_ID}"
          kubectl --request-timeout=10s -n "$PROBE_NAMESPACE" create serviceaccount cuda-runtime-permission-probe
          kubectl --request-timeout=10s -n "$PROBE_NAMESPACE" create configmap cuda-runtime-permission-probe \
            --from-file=.github/scripts/cuda-runtime-permission-probe.py
          kubectl --request-timeout=10s -n "$PROBE_NAMESPACE" create configmap cuda-runtime-helper \
            --from-file=cuda-checkpoint-helper="$RUNNER_TEMP/cuda-runtime-helper/cuda-checkpoint-helper"
          all_passed=true
          probe_node=""
          for mode in root-no-caps nonroot-no-caps; do
            kubectl -n "$PROBE_NAMESPACE" create --dry-run=client -f .github/scripts/cuda-runtime-permission-probe-pod.yaml -o json \
              | jq --arg mode "$mode" --arg node "$probe_node" '.metadata.name=$mode | .spec.containers[0].env[0].value=$mode |
                  if $node != "" then .spec.nodeName=$node else . end |
                  if $mode == "nonroot-no-caps" then .spec.containers[0].securityContext.runAsUser=1000 |
                    .spec.containers[0].securityContext.runAsGroup=1000 else . end' \
              | kubectl --request-timeout=10s -n "$PROBE_NAMESPACE" create -f -
            startup_deadline=$((SECONDS + 120))
            phase=Pending
            while true; do
              pod=$(kubectl --request-timeout=10s -n "$PROBE_NAMESPACE" get pod "$mode" -o json)
              phase=$(jq -r '.status.phase' <<< "$pod")
              [[ "$phase" == Running || "$phase" == Succeeded || "$phase" == Failed ]] && break
              if jq -e '[.status.initContainerStatuses[]?, .status.containerStatuses[]?] |
                  any(.state.waiting.reason == "ImagePullBackOff" or .state.waiting.reason == "ErrImagePull" or
                      .state.waiting.reason == "CreateContainerConfigError" or .state.waiting.reason == "RunContainerError")' \
                  <<< "$pod" >/dev/null; then
                echo "::error::$mode has a container startup error"
                break
              fi
              if ((SECONDS >= startup_deadline)); then
                echo "::error::$mode reached its bounded startup deadline"
                break
              fi
              sleep 2
            done
            result=1
            if [[ "$phase" == Running ]]; then
              if timeout --signal=KILL 95s kubectl --request-timeout=95s -n "$PROBE_NAMESPACE" exec "$mode" -c probe \
                -- python3 -S /probe/cuda-runtime-permission-probe.py; then result=0; else result=$?; fi
            fi
            kubectl --request-timeout=10s -n "$PROBE_NAMESPACE" get events --field-selector "involvedObject.name=$mode" || true
            echo "### $mode: exec exit $result (pod $phase)" >> "$GITHUB_STEP_SUMMARY"
            probe_node=$(jq -r '.spec.nodeName // ""' <<< "$pod")
            if [[ "$result" != 0 ]]; then all_passed=false; fi
            kubectl --request-timeout=10s -n "$PROBE_NAMESPACE" delete pod "$mode" --wait=true --timeout=10s
          done
          "$all_passed"
      - name: Always remove isolated namespace
        if: always()
        shell: bash
        run: kubectl --request-timeout=10s delete namespace "$PROBE_NAMESPACE" --ignore-not-found --wait=false
