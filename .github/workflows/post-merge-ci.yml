name: Bounded TRTLLM host-driver diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda-probe:
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 5
    env:
      PROBE_NAMESPACE: cuda-driver-rca-${{ github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Create isolated probe pod (setup limit 120 seconds)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          kubectl --request-timeout=10s create namespace "$PROBE_NAMESPACE"
          kubectl --request-timeout=10s label namespace "$PROBE_NAMESPACE" nscleanup/enabled=true nscleanup/ttl=900 dynamo.github/run-id="${{ github.run_id }}"
          kubectl --request-timeout=10s -n "$PROBE_NAMESPACE" create serviceaccount cuda-driver-probe
          kubectl --request-timeout=10s -n "$PROBE_NAMESPACE" create configmap cuda-driver-probe --from-file=.github/scripts/trtllm-host-driver-probe.py
          kubectl --request-timeout=10s -n "$PROBE_NAMESPACE" apply -f .github/scripts/cuda-driver-probe-pod.yaml
          timeout --signal=TERM --kill-after=5s 120s kubectl -n "$PROBE_NAMESPACE" wait pod/cuda-driver-probe --for=condition=Ready --timeout=115s
      - name: Test TRTLLM on host driver (hard limit 90 seconds)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p cuda-probe-evidence
          # Expand LD_PRELOAD inside the workload image, preserving its defaults.
          # shellcheck disable=SC2016
          timeout --signal=TERM --kill-after=5s 100s kubectl -n "$PROBE_NAMESPACE" exec cuda-driver-probe -c probe -- \
            timeout --signal=TERM --kill-after=5s 90s bash -c \
              'export LD_PRELOAD="/usr/lib/x86_64-linux-gnu/libcuda.so.595.58.03:${LD_PRELOAD:-}"; exec python3 -u /probe/trtllm-host-driver-probe.py --mpi' \
            2>&1 | tee cuda-probe-evidence/result.log
      - name: Save pod state and events
        if: always()
        run: |
          mkdir -p cuda-probe-evidence
          kubectl --request-timeout=10s -n "$PROBE_NAMESPACE" get pods -o yaml > cuda-probe-evidence/pods.yaml || true
          kubectl --request-timeout=10s -n "$PROBE_NAMESPACE" get events --sort-by=.metadata.creationTimestamp -o yaml > cuda-probe-evidence/events.yaml || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: trtllm-host-driver-${{ github.run_id }}
          path: cuda-probe-evidence/
          retention-days: 7
  cleanup:
    needs: cuda-probe
    if: always()
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 2
    steps:
      - name: Remove only the diagnostic namespace
        env:
          PROBE_NAMESPACE: cuda-driver-rca-${{ github.run_id }}
        run: |
          kubectl --request-timeout=10s delete namespace "$PROBE_NAMESPACE" --ignore-not-found --wait=false
          timeout --signal=TERM --kill-after=5s 60s kubectl wait namespace/"$PROBE_NAMESPACE" --for=delete --timeout=55s
