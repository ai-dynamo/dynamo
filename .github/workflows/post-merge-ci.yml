# Temporary diagnostic branch only. No builds, publishing, or unrelated tests.
name: TRTLLM checkpoint diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Create isolated diagnostic vCluster
        uses: ./.github/actions/setup-dynamo-operator
        with:
          vcluster_name: checkpoint-rca-${{ github.run_id }}
          vcluster_namespace: checkpoint-rca-${{ github.run_id }}
          registry: ${{ secrets.AZURE_ACR_HOSTNAME }}
          repository: ${{ vars.ACR_REPOSITORY }}
          operator_tag: 51b83df91f3fca2f52ed644f744c4465c3d163b3-operator
          hf_token: ${{ secrets.HF_TOKEN }}
          dockerhub_username: ${{ secrets.DOCKERHUB_LOGIN_USER }}
          dockerhub_password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          checkpoint_enabled: 'true'
          model_cache_server: ${{ vars.AZURE_MODEL_CACHE_SERVER }}
          model_cache_path: ${{ vars.AZURE_MODEL_CACHE_PATH }}
      - name: Connect
        id: connect
        uses: ./.github/actions/connect-vcluster
        with:
          vcluster_name: checkpoint-rca-${{ github.run_id }}
          vcluster_namespace: checkpoint-rca-${{ github.run_id }}
      - name: Install the same Snapshot release as the failing run
        uses: ./.github/actions/setup-snapshot-agent
        with:
          kubeconfig_base64: ${{ steps.connect.outputs.kubeconfig_base64 }}
          namespace: default
          chart_version: 0.1.0-rc.1
          storage_class: azurefile-csi
          storage_size: 64Gi
      - name: Enable debug logs and collect during capture
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n default set env daemonset/snapshot-agent SNAPSHOT_LOG_LEVEL=debug
          kubectl -n default rollout status daemonset/snapshot-agent --timeout=180s
          mkdir -p checkpoint-diagnostics
          nohup bash .github/scripts/watch-checkpoint.sh > checkpoint-diagnostics/collector.log 2>&1 < /dev/null &
          echo "$!" > checkpoint-diagnostics/collector.pid
      - name: Run the unchanged test with the exact failing worker and frontend images
        uses: ./.github/actions/dynamo-deploy-test
        with:
          kubeconfig_base64: ${{ steps.connect.outputs.kubeconfig_base64 }}
          namespace: default
          registry: ${{ secrets.AZURE_ACR_HOSTNAME }}
          operator_tag: 51b83df91f3fca2f52ed644f744c4465c3d163b3-operator
          framework: checkpoint
          profile: dgd_restore
          image: dynamoci.azurecr.io/ai-dynamo/dynamo:1.6.0-ci-51b83df91f3fca2f52ed644f744c4465c3d163b3-trtllm-placeholder@sha256:350a865ffd4eff81a428ca80da945869d4755b7553ce9a743fc2d2166050ab86
          test_name: checkpoint_rca_trtllm
          test_file: tests/deploy/test_dynamocheckpoint.py
          model_cache_pvc: ${{ vars.AZURE_MODEL_CACHE_SERVER != '' && vars.AZURE_MODEL_CACHE_PATH != '' && 'model-cache' || '' }}
          extra_pytest_args: >-
            -m snapshot_restore
            --checkpoint-backend=trtllm
            --frontend-image=dynamoci.azurecr.io/ai-dynamo/dynamo:1.6.0-ci-51b83df91f3fca2f52ed644f744c4465c3d163b3-dynamo-frontend@sha256:9b40f5e9d14f795143f950e1e6b126983ed816d0bf27165ab7716816f2b324cb
      - name: Stop collector
        if: always()
        shell: bash
        run: |
          if [ -f checkpoint-diagnostics/collector.pid ]; then
            kill "$(cat checkpoint-diagnostics/collector.pid)" 2>/dev/null || true
          fi
      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: checkpoint-rca-${{ github.run_id }}
          path: checkpoint-diagnostics/
          retention-days: 7
          if-no-files-found: warn

  cleanup:
    needs: checkpoint
    if: always()
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Remove only this run's vCluster and namespace
        uses: ./.github/actions/teardown-dynamo-operator
        with:
          vcluster_name: checkpoint-rca-${{ github.run_id }}
          vcluster_namespace: checkpoint-rca-${{ github.run_id }}
