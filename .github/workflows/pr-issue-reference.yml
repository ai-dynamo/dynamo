name: PR Issue Reference

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: read

concurrency:
  group: pr-issue-reference-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify referenced issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target enables Linear lookup for fork PRs. Execute only
      # trusted base code, never the PR head; PR text is data, not shell input.
      - name: Checkout trusted base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Verify GitHub and Linear issues
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        env:
          # Personal API key with read access to the referenced Linear teams.
          LINEAR_ACCESS_KEY: ${{ secrets.LINEAR_ACCESS_KEY }}
        with:
          script: |
            const { verify } = require('./.github/scripts/verify-pr-issues.cjs');
            await verify({ github, context, core });
