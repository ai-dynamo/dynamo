name: Build On Demand

on:
  workflow_dispatch:
    inputs:
      build_vllm:
        description: 'Build and push vllm image, tagged with branch name'
        type: boolean
        default: false
      build_sglang:
        description: 'Build and push sglang image, tagged with branch name'
        type: boolean
        default: false
      build_trtllm:
        description: 'Build and push trtllm image, tagged with branch name'
        type: boolean
        default: false
      build_triton:
        description: 'Build and push triton image, tagged with branch name'
        type: boolean
        default: false
      build_operator:
        description: 'Build and push operator image, tagged with branch name'
        type: boolean
        default: false
      run_kimi_disagg:
        description: 'Validate the EAGLE3 attention-DP fix after building TensorRT-LLM'
        type: boolean
        default: false
      kimi_preflight_only:
        description: 'Validate the Kimi recipe without deploying'
        type: boolean
        default: true
      capture_trtllm_baseline:
        description: 'Capture the matching daily-image SBOM before building'
        type: boolean
        default: false
      diagnose_kimi:
        description: 'Collect read-only diagnostics for the running Kimi test'
        type: boolean
        default: false

env:
  BUILDER_NAME: b-${{ github.run_id }}-${{ github.run_attempt }}

jobs:

  kimi-diagnostics:
    if: inputs.diagnose_kimi
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      KUBECONFIG: /teleport/kubeconfig.yaml
      KUBE_CONTEXT: nv-prd-dgxc.teleport.sh-dynamo-gcp-dev-02
      NAMESPACE: dynamo-nightly-dsv4
    steps:
      - name: Collect Kimi state and logs
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/kimi-diagnostics-${{ github.run_id }}"
          mkdir -p "$bundle"
          k=(kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" --request-timeout=30s)
          selector=nvidia.com/dynamo-graph-deployment-name=kimi-k25-disagg-kv-eagle
          "${k[@]}" get dgd kimi-k25-disagg-kv-eagle -o yaml > "$bundle/dgd.yaml" || true
          "${k[@]}" get pods -l "$selector" -o yaml > "$bundle/pods.yaml" || true
          "${k[@]}" describe pods -l "$selector" > "$bundle/pods-describe.txt" || true
          "${k[@]}" get events --sort-by=.lastTimestamp > "$bundle/events.txt" || true
          "${k[@]}" get limitrange -o yaml > "$bundle/limitranges.yaml" || true
          "${k[@]}" get nodes -o json > "$bundle/nodes.json" || true
          "${k[@]}" describe nodes > "$bundle/nodes-describe.txt" || true
          "${k[@]}" logs -l "$selector" -c main --prefix --tail=500 \
            > "$bundle/deployment.log" 2>&1 || true
          for pod in $("${k[@]}" get pods -l "$selector" -o name); do
            "${k[@]}" logs "$pod" -c main --prefix --previous --tail=500 \
              >> "$bundle/deployment-previous.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: always()
        with:
          name: kimi-readiness-diagnostics
          path: ${{ runner.temp }}/kimi-diagnostics-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7

  trtllm-baseline:
    if: inputs.capture_trtllm_baseline
    runs-on:
      group: Fastchecker
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Install baseline tooling
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --user --break-system-packages pyyaml
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Capture daily-image baseline
        env:
          REF: nvcr.io/nvidia/tensorrt-llm/release:1.4.0rc0.dev202610070001
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')
          [[ "$digest" == sha256:4b814c463dfb9574bc9299ed4228c99b1e614f004745fd0303439bd9e01d5206 ]]
          for platform in linux/amd64 linux/arm64; do
            python3 container/compliance/base_sboms/capture_baseline_sbom.py \
              --from "$REF" --baseline "$REF" --platform "$platform" --prune-superseded -v
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: kimi-fixed-trtllm-baseline
          path: |
            container/compliance/base_sboms/manifest.json
            container/compliance/base_sboms/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  init:
    runs-on: ubuntu-slim
    outputs:
      builder_name: ${{ steps.export-builder-name.outputs.builder_name }}
      sanitized_ref_name: ${{ steps.sanitize-ref.outputs.sanitized_ref_name }}
    steps:
      - name: Export builder name
        id: export-builder-name
        run: |
          echo "builder_name=${{ env.BUILDER_NAME }}" >> $GITHUB_OUTPUT
      - name: Sanitize ref name for container tags
        id: sanitize-ref
        shell: bash
        run: |
          sanitized=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/^-//;s/-$//' | cut -c1-128)
          echo "sanitized_ref_name=${sanitized}" >> $GITHUB_OUTPUT

  # ============================================================================
  # FRAMEWORK PIPELINES (build-only)
  # ============================================================================

  vllm-build:
    name: vllm-runtime # This name overlaps with other vllm jobs to group them in the UI
    needs: [init]
    if: inputs.build_vllm
    uses: $/.github/workflows/shared-build-image.yml
    with:
      framework: vllm
      target: runtime
      cuda_version: '["13.0"]'
      platform: 'linux/amd64,linux/arm64'
      builder_name: ${{ needs.init.outputs.builder_name }}
      build_timeout_minutes: 60
    secrets: inherit

  sglang-build:
    name: sglang-runtime # This name overlaps with other sglang jobs to group them in the UI
    needs: [init]
    if: inputs.build_sglang
    uses: $/.github/workflows/shared-build-image.yml
    with:
      framework: sglang
      target: runtime
      cuda_version: '["13.0"]'
      platform: 'linux/amd64,linux/arm64'
      builder_name: ${{ needs.init.outputs.builder_name }}
      build_timeout_minutes: 60
    secrets: inherit

  trtllm-build:
    name: trtllm-runtime # This name overlaps with other trtllm jobs to group them in the UI
    needs: [init]
    if: inputs.build_trtllm
    uses: $/.github/workflows/shared-build-image.yml
    with:
      framework: trtllm
      target: runtime
      cuda_version: '["13.1"]'
      platform: 'linux/amd64,linux/arm64'
      builder_name: ${{ needs.init.outputs.builder_name }}
      build_timeout_minutes: 60
      build_only: true
      extra_build_args: |
        RUNTIME_IMAGE_TAG=1.4.0rc0.dev202610070001@sha256:4b814c463dfb9574bc9299ed4228c99b1e614f004745fd0303439bd9e01d5206
    secrets: inherit

  triton-build:
    name: triton-runtime # This name overlaps with other triton jobs to group them in the UI
    needs: [init]
    if: inputs.build_triton
    uses: ./.github/workflows/shared-build-image.yml
    with:
      framework: triton
      target: runtime
      cuda_version: '[""]'
      platform: 'linux/amd64'
      builder_name: ${{ needs.init.outputs.builder_name }}
      build_timeout_minutes: 60
    secrets: inherit

  vllm-copy-to-acr:
    name: vllm-runtime # This name overlaps with other vllm jobs to group them in the UI
    needs: [vllm-build]
    uses: $/.github/workflows/shared-copy.yml
    with:
      target_tag_plain: ${{ needs.vllm-build.outputs.target_tag_plain }}
      cuda_version: '["13.0"]'
      copy_timeout_minutes: 20
    secrets: inherit

  sglang-copy-to-acr:
    name: sglang-runtime # This name overlaps with other sglang jobs to group them in the UI
    needs: [sglang-build]
    uses: $/.github/workflows/shared-copy.yml
    with:
      target_tag_plain: ${{ needs.sglang-build.outputs.target_tag_plain }}
      cuda_version: '["13.0"]'
      copy_timeout_minutes: 20
    secrets: inherit

  trtllm-copy-to-acr:
    name: trtllm-runtime # This name overlaps with other trtllm jobs to group them in the UI
    needs: [trtllm-build]
    uses: $/.github/workflows/shared-copy.yml
    with:
      target_tag_plain: ${{ needs.trtllm-build.outputs.target_tag_plain }}
      cuda_version: '["13.1"]'
      # The Kimi GB200 recipe needs the ARM64 member of the image index.
      copy_timeout_minutes: 20
    secrets: inherit

  # Triton images are published to AWS ECR only (no Azure ACR mirror), so there
  # is no triton-copy-to-acr job.

  # ============================================================================
  # OPERATOR (build-only)
  # ============================================================================

  kimi-disagg-perf:
    name: Kimi K2.5 EAGLE3 attention-DP regression
    needs: [trtllm-copy-to-acr]
    if: ${{ inputs.run_kimi_disagg }}
    uses: ./.github/workflows/kimi-k25-disagg-nightly.yml
    with:
      source_ref: ${{ github.sha }}
      image_tag: ${{ needs.trtllm-copy-to-acr.outputs.image_tag }}
      preflight_only: ${{ inputs.kimi_preflight_only }}
    secrets: inherit

  operator:
    needs: [init]
    if: inputs.build_operator
    name: Operator
    runs-on: prod-default-v2
    env:
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Initialize Dynamo Builder
        uses: $/.github/actions/init-dynamo-builder
        with:
          builder_name: ${{ needs.init.outputs.builder_name }}
          flavor: general
          arch: 'linux/amd64,linux/arm64'
          namespace: ${{ vars.BUILDKIT_NAMESPACE }}
      - name: Docker Login
        uses: $/.github/actions/docker-login
        with:
          aws_default_region: ${{ vars.AWS_DEFAULT_REGION }}
          ecr_registry: ${{ vars.ECR_REGISTRY }}
          azure_acr_hostname: ${{ secrets.AZURE_ACR_HOSTNAME }}
          azure_acr_user: ${{ secrets.AZURE_ACR_USER }}
          azure_acr_password: ${{ secrets.AZURE_ACR_PASSWORD }}
      - name: Build and push Container
        shell: bash
        working-directory: ./deploy/operator
        run: |
          ECR_DEFAULT_IMAGE_BASE="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          ACR_IMAGE_BASE="${{ secrets.AZURE_ACR_HOSTNAME }}/${ACR_REPOSITORY}"
          DEFAULT_TAG="${{ github.sha }}-operator"
          BRANCH_TAG="${{ needs.init.outputs.sanitized_ref_name }}-operator"
          IMAGE_URIS=(
            "${ECR_DEFAULT_IMAGE_BASE}:${DEFAULT_TAG}"
            "${ACR_IMAGE_BASE}:${DEFAULT_TAG}"
            "${ECR_DEFAULT_IMAGE_BASE}:${BRANCH_TAG}"
            "${ACR_IMAGE_BASE}:${BRANCH_TAG}"
          )

          TAGGING_FLAGS=$(printf -- '-t %s ' "${IMAGE_URIS[@]}")
          echo "flags for docker buildx: ${TAGGING_FLAGS}"

          # deploy/operator/Dockerfile's licenses stage does `COPY --from=compliance`,
          # which resolves as an image unless the named build context is supplied.
          # Without this the build fails pulling docker.io/library/compliance.
          # .github/actions/build-deploy-component passes the same flag.
          docker buildx build --push \
              --platform linux/amd64,linux/arm64 \
              --build-arg DOCKER_PROXY=${ECR_REGISTRY}/dockerhub/ \
              --build-context compliance=../../container/compliance \
              ${TAGGING_FLAGS} -f Dockerfile .

          echo "### Operator Container Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image URI |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|" >> $GITHUB_STEP_SUMMARY
          for image_uri in "${IMAGE_URIS[@]}"; do
            echo "| \`${image_uri}\` |" >> $GITHUB_STEP_SUMMARY
          done

  # ============================================================================
  # CLEANUP
  # ============================================================================

  clean-k8s-builder:
    name: Clean K8s builder if exists
    runs-on: prod-default-small-v2
    if: always()
    needs: [init, vllm-build, sglang-build, trtllm-build, triton-build, operator]
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Create K8s builders (skip bootstrap)
      uses: $/.github/actions/bootstrap-buildkit
      continue-on-error: true
      with:
        builder_name: ${{ needs.init.outputs.builder_name }}
        buildkit_worker_addresses: ''
        namespace: ${{ vars.BUILDKIT_NAMESPACE }}
        skip_bootstrap: true
    - name: Builder Cleanup in case of k8s builder
      shell: bash
      run: |
        docker buildx rm ${{ needs.init.outputs.builder_name }} || true
