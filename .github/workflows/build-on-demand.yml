name: Temporary rerun-ci live check

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Temporary fixture PR number
        required: true
        type: string
      comment_id:
        description: First real command comment
        required: true
        type: string
      duplicate_comment_id:
        description: Second real command comment
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: read

concurrency:
  group: rerun-ci-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  live-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
          DUPLICATE_COMMENT_ID: ${{ inputs.duplicate_comment_id }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const crypto = require('node:crypto');
            const fs = require('node:fs');
            const expectedBranch = 'codex/ops-9297-live-check';
            assert.equal(context.ref, `refs/heads/${expectedBranch}`);
            const handlerBytes = fs.readFileSync('.github/scripts/rerun-ci.js');
            assert.equal(crypto.createHash('sha256').update(handlerBytes).digest('hex'), 'bf19231db1673b4e54f84b363cf1e4822e3b76dd450b26370e9293ebe22a5ef6');
            const repo = context.repo;
            const number = Number(process.env.PR_NUMBER);
            const commentIds = [Number(process.env.COMMENT_ID), Number(process.env.DUPLICATE_COMMENT_ID)];
            assert.ok(Number.isSafeInteger(number) && number > 0);
            assert.ok(commentIds.every(value => Number.isSafeInteger(value) && value > 0));
            const { data: pull } = await github.rest.pulls.get({ ...repo, pull_number: number });
            assert.equal(pull.state, 'open');
            assert.equal(pull.head.ref, expectedBranch);
            assert.equal(pull.head.sha, context.sha);
            const { data: issue } = await github.rest.issues.get({ ...repo, issue_number: number });
            const comments = [];
            for (const comment_id of commentIds) {
              const { data: comment } = await github.rest.issues.getComment({ ...repo, comment_id });
              assert.equal(comment.issue_url, `https://api.github.com/repos/${repo.owner}/${repo.repo}/issues/${number}`);
              assert.equal(comment.body.trim(), '/rerun ci');
              comments.push(comment);
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...repo, head_sha: pull.head.sha, per_page: 100,
            });
            const expected = [
              { path: '.github/workflows/pr.yaml', branch: `pull-request/${number}`, event: 'push', failed: true },
              { path: '.github/workflows/pr-xpu.yaml', branch: `pull-request/${number}`, event: 'push', failed: false },
              { path: '.github/workflows/pre-merge.yml', branch: expectedBranch, event: 'pull_request', failed: true },
            ];
            const before = [];
            for (const specification of expected) {
              const run = runs.filter(run => run.path === specification.path && run.head_branch === specification.branch && run.event === specification.event)
                .sort((a, b) => b.id - a.id)[0];
              assert.ok(run, `Missing ${specification.path}`);
              assert.equal(run.status, 'completed');
              assert.equal(run.run_attempt, 1);
              assert.equal(run.conclusion, specification.failed ? 'failure' : 'success');
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...repo, run_id: run.id, filter: 'all', per_page: 100 });
              const independent = jobs.find(job => job.name === 'independent');
              assert.equal(independent.conclusion, 'success');
              if (specification.failed) {
                assert.equal(jobs.find(job => job.name === 'flaky').conclusion, 'failure');
                assert.equal(jobs.find(job => job.name === 'dependent').conclusion, 'skipped');
              }
              before.push({ ...specification, run, jobs });
            }
            const rerun = require('./.github/scripts/rerun-ci.js');
            const replay = comment => ({ repo, eventName: 'issue_comment', payload: { action: 'created', issue, comment } });
            await rerun({ github, context: replay(comments[0]), core });
            await rerun({ github, context: replay(comments[0]), core });
            await rerun({ github, context: replay(comments[1]), core });
            const deadline = Date.now() + 6 * 60 * 1000;
            let after;
            while (Date.now() < deadline) {
              after = [];
              for (const item of before) {
                const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: item.run.id });
                after.push({ ...item, afterRun: run });
              }
              if (after.every(item => item.afterRun.run_attempt === (item.failed ? 2 : 1) && item.afterRun.status === 'completed')) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            const evidence = [];
            for (const item of after) {
              assert.equal(item.afterRun.status, 'completed');
              assert.equal(item.afterRun.run_attempt, item.failed ? 2 : 1);
              assert.equal(item.afterRun.conclusion, 'success');
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...repo, run_id: item.run.id, filter: 'all', per_page: 100 });
              const independent = jobs.filter(job => job.name === 'independent');
              assert.equal(independent.length, 1);
              assert.equal(independent[0].id, item.jobs.find(job => job.name === 'independent').id);
              if (item.failed) {
                assert.equal(jobs.find(job => job.name === 'flaky' && job.run_attempt === 2).conclusion, 'success');
                assert.equal(jobs.find(job => job.name === 'dependent' && job.run_attempt === 2).conclusion, 'success');
              }
              evidence.push({ workflow: item.path, run: item.run.html_url, attemptBefore: 1, attemptAfter: item.afterRun.run_attempt,
                jobs: jobs.map(job => ({ id: job.id, name: job.name, attempt: job.run_attempt, conclusion: job.conclusion })) });
            }
            core.info(JSON.stringify(evidence, null, 2));
            await core.summary.addHeading('Live retry check passed').addRaw('Unchanged production handler; real comments and GitHub APIs. Only the issue_comment delivery was replayed.').addCodeBlock(JSON.stringify(evidence, null, 2), 'json').write();
