# Temporary branch-only supplemental CI; never merge this replacement.
name: Build On Demand - Hook Source Validation
run-name: Hook source ${{ inputs.source }} / wrapper ${{ inputs.expected_head }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: Frozen hook source to validate (one source per run)
        type: choice
        options: [base, timings, file-chmod, pr340, metadata-stat, verification-control, metadata-corrected, verification-control-busybox, metadata-corrected-busybox, pinned-instrumentation, pinned-file-chmod, stat-before, modern-stat-exhaustion]
        default: base
        required: true
      expected_head:
        description: Exact reviewed Dynamo wrapper commit (40 characters)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: isolated-hook-source-validation
  cancel-in-progress: false

env:
  # Pinned-era sources use the reproducible Node24 patch; no lockfile exception.
  PINNED_SOURCE_CHECK: |
    import hashlib, json, os, pathlib, subprocess
    source = os.environ["HOOK_SOURCE_SHA"]
    assert source in ("8e9457620f44e0cfc0aa4bb87fc7341f7758118f",
                      "507471d420e6e548f28c98d44a4e0096f9a13d98",
                      "8559efb36c331e6c0ebe0b8d4cc2cb0ce559c396",
                      "9698a29869a257a892763098ca9476bbe492d2f5",
                      "c71f1b04748bde2d3da318abde88d248bb10aa49",
                      "e6d5d3f505e6c3db85ffd85d35607da08a5a7222",
                      "3876a4e1bb84542782b5039ec11a3c5ab5f3d47e",
                      "6ecda1d8eaeac48a73958b3c6bf9532433512435",
                      "40b463a129f3335e38a8ef6786f79b9b0f874dd9")
    def git(*args):
        return subprocess.check_output(["git", *args])
    assert git("rev-parse", "HEAD").decode().strip() == source
    versions = ("v24.21.0", "11.19.0") if source == "40b463a129f3335e38a8ef6786f79b9b0f874dd9" else ("v24.13.0", "11.6.2")
    for tool, expected in zip(("node", "npm"), versions):
        actual = subprocess.check_output([tool, "--version"]).decode().strip()
        print(json.dumps({"tool": tool, "expected": expected, "actual": actual}), flush=True)
        assert actual == expected
    assert not git("ls-files", "--others", "--exclude-standard").strip()
    subprocess.run(["git", "diff", "--exit-code", "HEAD", "--", ".",
                    ":!packages/k8s/tests/test-kind.yaml"], check=True)
    kind = "packages/k8s/tests/test-kind.yaml"
    assert not git("diff", "--summary", "HEAD", "--", kind).strip()
    original = git("show", source + ":" + kind)
    actual = pathlib.Path(kind).read_bytes()
    assert actual in (original, original.replace(b"{{PATHTOREPO}}", os.getcwd().encode()))
    paths = [".github/workflows/build.yaml", "package.json", "package-lock.json"]
    paths += sorted(str(path) for path in pathlib.Path("packages").glob("*/package*.json"))
    for path in paths:
        original = git("show", source + ":" + path)
        actual = pathlib.Path(path).read_bytes()
        print(json.dumps({"path": path, "original_sha256": hashlib.sha256(original).hexdigest(),
                          "actual_sha256": hashlib.sha256(actual).hexdigest()}), flush=True)
        assert actual == original
  HOOK_SOURCE_SHA: ${{ inputs.source == 'base' && 'd4731a43a2fe1a4d4f7ea24dc515a1a120a065c8' || inputs.source == 'timings' && '73d34cbebe8e647813e67f7fc768d2771b39aa06' || inputs.source == 'file-chmod' && '46faf02ef2fda46002c4ac3f8a51d3f2a1621a5c' || inputs.source == 'pr340' && '8e9457620f44e0cfc0aa4bb87fc7341f7758118f' || inputs.source == 'metadata-stat' && '15238c0d1d1dfa70811540518994bb435bc64787' || inputs.source == 'verification-control' && '507471d420e6e548f28c98d44a4e0096f9a13d98' || inputs.source == 'metadata-corrected' && '8559efb36c331e6c0ebe0b8d4cc2cb0ce559c396' || inputs.source == 'verification-control-busybox' && '9698a29869a257a892763098ca9476bbe492d2f5' || inputs.source == 'metadata-corrected-busybox' && 'c71f1b04748bde2d3da318abde88d248bb10aa49' || inputs.source == 'pinned-instrumentation' && 'e6d5d3f505e6c3db85ffd85d35607da08a5a7222' || inputs.source == 'pinned-file-chmod' && '3876a4e1bb84542782b5039ec11a3c5ab5f3d47e' || inputs.source == 'stat-before' && '6ecda1d8eaeac48a73958b3c6bf9532433512435' || inputs.source == 'modern-stat-exhaustion' && '40b463a129f3335e38a8ef6786f79b9b0f874dd9' || '' }}
  HOOK_SOURCE_REPOSITORY: ${{ (inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'modern-stat-exhaustion') && 'alec-flowers/runner-container-hooks' || 'actions/runner-container-hooks' }}
  HOOK_WORKFLOW_SHA256: ${{ (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before') && '1f1ae324b183fed6fcd2486fb8bf33e483d51ab3c2322e9d8c9b2b9a83ffba35' || 'ac9df6264ddbc8b58faf58215ac2622cbe1999ab5cc6d3bd2d8a243b880af63a' }}
  EXPECTED_WRAPPER_HEAD: ${{ inputs.expected_head }}
  WRAPPER_WORKFLOW_SHA: ${{ github.workflow_sha }}
  WRAPPER_WORKFLOW_REF: ${{ github.workflow_ref }}

jobs:
  format-and-lint:
    name: Format & Lint Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verify wrapper and allowlisted input
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = ai-dynamo/dynamo
          test "$GITHUB_REF" = refs/heads/agent/ci-hook-source-hosted
          [[ "$EXPECTED_WRAPPER_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_WRAPPER_HEAD"
          test "$WRAPPER_WORKFLOW_SHA" = "$EXPECTED_WRAPPER_HEAD"
          test "$WRAPPER_WORKFLOW_REF" = ai-dynamo/dynamo/.github/workflows/build-on-demand.yml@refs/heads/agent/ci-hook-source-hosted
          case "$HOOK_SOURCE_SHA" in
            d4731a43a2fe1a4d4f7ea24dc515a1a120a065c8|73d34cbebe8e647813e67f7fc768d2771b39aa06|46faf02ef2fda46002c4ac3f8a51d3f2a1621a5c|8e9457620f44e0cfc0aa4bb87fc7341f7758118f|15238c0d1d1dfa70811540518994bb435bc64787|507471d420e6e548f28c98d44a4e0096f9a13d98|8559efb36c331e6c0ebe0b8d4cc2cb0ce559c396|9698a29869a257a892763098ca9476bbe492d2f5|c71f1b04748bde2d3da318abde88d248bb10aa49|e6d5d3f505e6c3db85ffd85d35607da08a5a7222|3876a4e1bb84542782b5039ec11a3c5ab5f3d47e|6ecda1d8eaeac48a73958b3c6bf9532433512435|40b463a129f3335e38a8ef6786f79b9b0f874dd9) ;;
            *) echo 'Source is outside the frozen allowlist' >&2; exit 1 ;;
          esac
      - id: source_checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: ${{ env.HOOK_SOURCE_REPOSITORY }}
          ref: ${{ env.HOOK_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HOOK_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git remote get-url origin)" = "https://github.com/$HOOK_SOURCE_REPOSITORY"
          printf '%s  %s\n' "$HOOK_WORKFLOW_SHA256" .github/workflows/build.yaml | sha256sum --check
          printf 'run_id=%s attempt=%s job=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB"
          printf 'wrapper_head=%s workflow_sha=%s workflow_ref=%s\n' "$GITHUB_SHA" "$WRAPPER_WORKFLOW_SHA" "$WRAPPER_WORKFLOW_REF"
          printf 'source_head=%s tree=%s\n' "$HOOK_SOURCE_SHA" "$(git rev-parse 'HEAD^{tree}')"
          sha256sum .github/workflows/build.yaml package*.json packages/*/package*.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: ${{ inputs.source == 'modern-stat-exhaustion' && '24.21.0' || (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before') && '24.13.0' || '24' }}
          package-manager-cache: false  # No shared cache reads or writes.
      - name: Verify pinned-era source tools and pristine source
        if: (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before' || inputs.source == 'modern-stat-exhaustion')
        run: python3 -I -c "$PINNED_SOURCE_CHECK"
      - run: node --version && npm --version
        name: Log Node and npm versions
        if: inputs.source != 'pr340' && inputs.source != 'verification-control' && inputs.source != 'metadata-corrected' && inputs.source != 'verification-control-busybox' && inputs.source != 'metadata-corrected-busybox' && inputs.source != 'pinned-instrumentation' && inputs.source != 'pinned-file-chmod' && inputs.source != 'stat-before' && inputs.source != 'modern-stat-exhaustion'
      - run: npm ci
        name: Install dependencies
      - run: npm run bootstrap
        name: Bootstrap the packages
      - name: Verify pinned-era source after bootstrap
        if: (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before' || inputs.source == 'modern-stat-exhaustion')
        run: python3 -I -c "$PINNED_SOURCE_CHECK"
      - run: npm run build-all
        name: Build packages
      - name: Verify pinned-era source after build
        if: (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before' || inputs.source == 'modern-stat-exhaustion')
        run: python3 -I -c "$PINNED_SOURCE_CHECK"
      - run: npm run format-check
        name: Check formatting
      - name: Check linter
        run: |
          npm run lint
          git diff --exit-code -- . ':!packages/k8s/tests/test-kind.yaml'
      - name: Verify pinned-era source after validation
        if: always() && !cancelled() && (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before' || inputs.source == 'modern-stat-exhaustion') && steps.source_checkout.outcome == 'success'
        run: python3 -I -c "$PINNED_SOURCE_CHECK"

  docker-tests:
    name: Docker Hook Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: format-and-lint
    steps:
      - id: source_checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: ${{ env.HOOK_SOURCE_REPOSITORY }}
          ref: ${{ env.HOOK_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HOOK_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git remote get-url origin)" = "https://github.com/$HOOK_SOURCE_REPOSITORY"
          printf '%s  %s\n' "$HOOK_WORKFLOW_SHA256" .github/workflows/build.yaml | sha256sum --check
          printf 'run_id=%s attempt=%s job=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB"
          printf 'wrapper_head=%s workflow_sha=%s workflow_ref=%s\n' "$GITHUB_SHA" "$WRAPPER_WORKFLOW_SHA" "$WRAPPER_WORKFLOW_REF"
          printf 'source_head=%s tree=%s\n' "$HOOK_SOURCE_SHA" "$(git rev-parse 'HEAD^{tree}')"
          sha256sum .github/workflows/build.yaml package*.json packages/*/package*.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: ${{ inputs.source == 'modern-stat-exhaustion' && '24.21.0' || (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before') && '24.13.0' || '24' }}
          package-manager-cache: false  # No shared cache reads or writes.
      - name: Verify pinned-era source tools and pristine source
        if: (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before' || inputs.source == 'modern-stat-exhaustion')
        run: python3 -I -c "$PINNED_SOURCE_CHECK"
      - run: node --version && npm --version
        name: Log Node and npm versions
        if: inputs.source != 'pr340' && inputs.source != 'verification-control' && inputs.source != 'metadata-corrected' && inputs.source != 'verification-control-busybox' && inputs.source != 'metadata-corrected-busybox' && inputs.source != 'pinned-instrumentation' && inputs.source != 'pinned-file-chmod' && inputs.source != 'stat-before' && inputs.source != 'modern-stat-exhaustion'
      - run: npm ci
        name: Install dependencies
      - run: npm run bootstrap
        name: Bootstrap the packages
      - name: Verify pinned-era source after bootstrap
        if: (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before' || inputs.source == 'modern-stat-exhaustion')
        run: python3 -I -c "$PINNED_SOURCE_CHECK"
      - run: npm run build-all
        name: Build packages
      - name: Verify pinned-era source after build
        if: (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before' || inputs.source == 'modern-stat-exhaustion')
        run: python3 -I -c "$PINNED_SOURCE_CHECK"
      - name: Run Docker tests
        run: npm run test --prefix packages/docker
      - name: Verify pinned-era source after validation
        if: always() && !cancelled() && (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before' || inputs.source == 'modern-stat-exhaustion') && steps.source_checkout.outcome == 'success'
        run: python3 -I -c "$PINNED_SOURCE_CHECK"

  k8s-tests:
    name: Kubernetes Hook Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: format-and-lint
    steps:
      - id: source_checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: ${{ env.HOOK_SOURCE_REPOSITORY }}
          ref: ${{ env.HOOK_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HOOK_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git remote get-url origin)" = "https://github.com/$HOOK_SOURCE_REPOSITORY"
          printf '%s  %s\n' "$HOOK_WORKFLOW_SHA256" .github/workflows/build.yaml | sha256sum --check
          printf 'run_id=%s attempt=%s job=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB"
          printf 'wrapper_head=%s workflow_sha=%s workflow_ref=%s\n' "$GITHUB_SHA" "$WRAPPER_WORKFLOW_SHA" "$WRAPPER_WORKFLOW_REF"
          printf 'source_head=%s tree=%s\n' "$HOOK_SOURCE_SHA" "$(git rev-parse 'HEAD^{tree}')"
          sha256sum .github/workflows/build.yaml package*.json packages/*/package*.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: ${{ inputs.source == 'modern-stat-exhaustion' && '24.21.0' || (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before') && '24.13.0' || '24' }}
          package-manager-cache: false  # No shared cache reads or writes.
      - name: Verify pinned-era source tools and pristine source
        if: (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before' || inputs.source == 'modern-stat-exhaustion')
        run: python3 -I -c "$PINNED_SOURCE_CHECK"
      - run: sed -i "s|{{PATHTOREPO}}|$(pwd)|" packages/k8s/tests/test-kind.yaml
        name: Setup kind cluster yaml config
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3  # v1.12.0
        with:
          config: packages/k8s/tests/test-kind.yaml
      - run: node --version && npm --version
        name: Log Node and npm versions
        if: inputs.source != 'pr340' && inputs.source != 'verification-control' && inputs.source != 'metadata-corrected' && inputs.source != 'verification-control-busybox' && inputs.source != 'metadata-corrected-busybox' && inputs.source != 'pinned-instrumentation' && inputs.source != 'pinned-file-chmod' && inputs.source != 'stat-before' && inputs.source != 'modern-stat-exhaustion'
      - run: ${{ (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before') && 'npm install' || 'npm ci' }}
        name: Install dependencies
      - run: npm run bootstrap
        name: Bootstrap the packages
      - name: Verify pinned-era source after bootstrap
        if: (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before' || inputs.source == 'modern-stat-exhaustion')
        run: python3 -I -c "$PINNED_SOURCE_CHECK"
      - run: npm run build-all
        name: Build packages
      - name: Verify pinned-era source after build
        if: (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before' || inputs.source == 'modern-stat-exhaustion')
        run: python3 -I -c "$PINNED_SOURCE_CHECK"
      - name: Run Kubernetes tests
        run: npm run test --prefix packages/k8s
      - name: Verify pinned-era source after validation
        if: always() && !cancelled() && (inputs.source == 'pr340' || inputs.source == 'verification-control' || inputs.source == 'metadata-corrected' || inputs.source == 'verification-control-busybox' || inputs.source == 'metadata-corrected-busybox' || inputs.source == 'pinned-instrumentation' || inputs.source == 'pinned-file-chmod' || inputs.source == 'stat-before' || inputs.source == 'modern-stat-exhaustion') && steps.source_checkout.outcome == 'success'
        run: python3 -I -c "$PINNED_SOURCE_CHECK"
