name: Ownership policy approvals

on:
  workflow_run:
    workflows: [codeowners]
    types: [requested, completed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to evaluate
        required: true
        type: number

# Load only trusted default-branch code; read PR policy blobs as data.
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

concurrency:
  group: ownership-policy-approvals-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  approvals:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Publish required ownership approval check
        env:
          GH_TOKEN: ${{ github.token }}
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: python .github/codeowners/check_ownership_approvals.py
