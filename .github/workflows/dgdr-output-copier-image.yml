name: DGDR output-copier image

on:
  pull_request:
    paths:
      - deploy/operator/output-copier/**
      - .github/workflows/dgdr-output-copier-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
      - name: Build and smoke-test
        run: |
          docker buildx build --platform ${{ matrix.platform }} --load \
            -t dgdr-output-copier:test deploy/operator/output-copier
          deploy/operator/output-copier/smoke-test.sh dgdr-output-copier:test ${{ matrix.platform }}
