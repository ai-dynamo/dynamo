name: Kimi K2.5 Aggregated Perf

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      image_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Published ACR TensorRT-LLM nightly tag (<version>-ci-<sha>-trtllm-runtime-nightly)'
        type: string
        required: true
      preflight_only:
        description: 'Render and server-side dry-run without deploying'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kimi-k25-nightly
  cancel-in-progress: false

jobs:
  perf:
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      # Read tbot's renewed credentials; every kubectl command selects its context.
      KUBECONFIG: /teleport/kubeconfig.yaml
      KUBE_CONTEXT: nv-prd-dgxc.teleport.sh-dynamo-gcp-dev-02
      NAMESPACE: dynamo-nightly-dsv4
      RUN_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}
      OVERLAY: .github/ci/kimi-k25-agg
    steps:
      - timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Prepare artifacts
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/kimi-artifacts"
          echo "ARTIFACTS=$RUNNER_TEMP/kimi-artifacts" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/kimi-registry-auth.json" >> "$GITHUB_ENV"
      - timeout-minutes: 5
        uses: ./.github/actions/skopeo-login
        with:
          azure_acr_hostname: ${{ secrets.AZURE_ACR_HOSTNAME }}
          azure_acr_user: ${{ secrets.AZURE_ACR_USER }}
          azure_acr_password: ${{ secrets.AZURE_ACR_PASSWORD }}
      - name: Render deployment and full AIPerf sweep
        timeout-minutes: 5
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ACR_HOST: ${{ secrets.AZURE_ACR_HOSTNAME }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
        run: |
          image="${ACR_HOST}/${ACR_REPOSITORY}:${IMAGE_TAG}"
          digest=$(skopeo inspect --raw "docker://$image" | jq -er '
            .manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
          export RUNTIME_IMAGE="$image@$digest"
          yq -i '.spec.services[].extraPodSpec.mainContainer.image = strenv(RUNTIME_IMAGE) |
            .spec.services[].extraPodSpec.imagePullSecrets = [{"name": "acr-" + strenv(RUN_KEY)}] |
            .spec.services.Worker.envFromSecret = "hf-" + strenv(RUN_KEY)' "$OVERLAY/patch-deploy.yaml"
          yq -i '.commonLabels.ci-run = strenv(RUN_KEY)' "$OVERLAY/kustomization.yaml"
          kubectl kustomize "$OVERLAY" --load-restrictor LoadRestrictionsNone > "$ARTIFACTS/rendered.yaml"
          yq -i '
            with(select(.kind == "Job" and .metadata.name == "kimi-k25-model-download");
              .spec.template.spec.containers[0].envFrom[0].secretRef.name = "hf-" + strenv(RUN_KEY)) |
            with(select(.kind == "Job" and .metadata.name == "aiperf-synthetic");
              (.spec.template.spec.containers[] | select(.name == "perf").env[] |
                select(.name == "HF_TOKEN").valueFrom.secretKeyRef.name) = "hf-" + strenv(RUN_KEY))' "$ARTIFACTS/rendered.yaml"
          yq 'select(.kind == "DynamoGraphDeployment")' "$ARTIFACTS/rendered.yaml" > "$ARTIFACTS/deploy.yaml"
          yq 'select(.metadata.name == "aiperf-synthetic")' "$ARTIFACTS/rendered.yaml" > "$ARTIFACTS/perf.yaml"
          yq 'select(.kind != "DynamoGraphDeployment" and .metadata.name != "aiperf-synthetic")' "$ARTIFACTS/rendered.yaml" > "$ARTIFACTS/prerequisites.yaml"
          git rev-parse HEAD > "$ARTIFACTS/source-sha.txt"
          echo "$RUNTIME_IMAGE" | tee "$ARTIFACTS/runtime-image.txt"
          echo "Runtime image: \`$RUNTIME_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Recipe commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Preflight and create run credentials
        timeout-minutes: 10
        env:
          DRY_RUN: ${{ inputs.preflight_only && 'server' || 'none' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ACR_HOST: ${{ secrets.AZURE_ACR_HOSTNAME }}
          ACR_USER: ${{ secrets.AZURE_ACR_USER }}
          ACR_PASSWORD: ${{ secrets.AZURE_ACR_PASSWORD }}
        run: |
          k=(kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" --request-timeout=60s)
          [[ "$("${k[@]}" get pvc shared-model-cache -o jsonpath='{.status.phase}')" == Bound ]]
          "${k[@]}" create --dry-run=server -f "$ARTIFACTS/rendered.yaml" > "$ARTIFACTS/dry-run.txt"
          "${k[@]}" create secret generic "hf-$RUN_KEY" --dry-run="$DRY_RUN" -o name \
            --from-literal=HF_TOKEN="${HF_TOKEN:?Missing HF_TOKEN}"
          "${k[@]}" create secret docker-registry "acr-$RUN_KEY" --dry-run="$DRY_RUN" -o name \
            --docker-server="$ACR_HOST" --docker-username="$ACR_USER" --docker-password="$ACR_PASSWORD"
      - name: Prepare model cache and aggregated ComputeDomain
        if: ${{ !inputs.preflight_only }}
        timeout-minutes: 45
        run: |
          k=(kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" --request-timeout=60s)
          "${k[@]}" create -f "$ARTIFACTS/prerequisites.yaml"
          until "${k[@]}" wait job/kimi-k25-model-download --for=condition=Complete --timeout=5s; do
            "${k[@]}" get job kimi-k25-model-download -o json |
              jq -e 'all(.status.conditions[]?; .type != "Failed" or .status != "True")' >/dev/null
            timeout 60s "${k[@]}" logs -f job/kimi-k25-model-download --tail=20 --ignore-errors || true
            sleep 5
          done
      - name: Deploy and wait for readiness
        if: ${{ !inputs.preflight_only }}
        timeout-minutes: 75
        run: |
          k=(kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" --request-timeout=60s)
          selector=nvidia.com/dynamo-graph-deployment-name=kimi-k25-trtllm-aggregate
          "${k[@]}" create -f "$ARTIFACTS/deploy.yaml"
          # Reconnect logs every two minutes to discover new pods and reload tbot certificates.
          until "${k[@]}" wait dgd/kimi-k25-trtllm-aggregate --for=condition=Ready --timeout=5s; do
            "${k[@]}" get dgd kimi-k25-trtllm-aggregate
            "${k[@]}" get pods -l "$selector" -o wide
            timeout 120s "${k[@]}" logs --request-timeout=120s -f -l "$selector" -c main \
              --prefix --timestamps --since=1m --tail=20 --ignore-errors --max-log-requests=7 || true
            sleep 5
          done
      - name: Run full AIPerf 1k_1.5k sweep
        if: ${{ !inputs.preflight_only }}
        timeout-minutes: 165
        run: |
          k=(kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" --request-timeout=60s)
          "${k[@]}" create -f "$ARTIFACTS/perf.yaml"
          # The existing artifact sidecar stays alive after the perf container exits.
          while true; do
            exit_code=$("${k[@]}" get pods -l job-name=aiperf-synthetic -o json |
              jq -r '[.items[].status.containerStatuses[]? | select(.name == "perf").state.terminated.exitCode][0] // empty')
            if [[ -n "$exit_code" ]]; then
              exit "$exit_code"
            fi
            "${k[@]}" get job aiperf-synthetic -o json |
              jq -e 'all(.status.conditions[]?; .type != "Failed" or .status != "True")' >/dev/null
            timeout 60s "${k[@]}" logs -f job/aiperf-synthetic -c perf \
              --timestamps --since=1m --tail=20 --ignore-errors || true
            sleep 5
          done
      - name: Collect logs and perf artifacts
        if: always()
        timeout-minutes: 5
        run: |
          k=(kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" --request-timeout=30s)
          "${k[@]}" get dgd,job,configmap,computedomain -l "ci-run=$RUN_KEY" -o yaml > "$ARTIFACTS/resources.yaml" || true
          "${k[@]}" get events --sort-by=.lastTimestamp > "$ARTIFACTS/events.txt" || true
          if [[ -n "$("${k[@]}" get dgd -l "ci-run=$RUN_KEY" -o name)" ]]; then
            "${k[@]}" logs -l nvidia.com/dynamo-graph-deployment-name=kimi-k25-trtllm-aggregate \
              --all-containers --prefix --tail=1000 > "$ARTIFACTS/deployment.log" 2>&1 || true
          fi
          for job in $("${k[@]}" get job -l "ci-run=$RUN_KEY" -o name); do
            "${k[@]}" logs "$job" --all-containers > "$ARTIFACTS/${job##*/}.log" 2>&1 || true
          done
          pod=$("${k[@]}" get pods -l "ci-run=$RUN_KEY,job-name=aiperf-synthetic" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [[ -n "$pod" ]]; then
            "${k[@]}" cp -c sidecar-for-cp "$pod:/shared-artifacts/results/." "$ARTIFACTS/perf"
          fi
      - name: Verify all nine sweep results
        if: ${{ success() && !inputs.preflight_only }}
        timeout-minutes: 5
        run: |
          for concurrency in 1 2 4 8 16 32 64 128 256; do
            jq -e --argjson requests "$((10 * concurrency))" '
              .request_count.avg == $requests and (.error_request_count.avg // 0) == 0 and
              .output_sequence_length.avg > 0' \
              "$ARTIFACTS/perf/1k_1.5k/c$concurrency/profile_export_aiperf.json"
          done
      - name: Clean up recipe resources
        if: always()
        timeout-minutes: 20
        run: |
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          failed=0
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" --request-timeout=0 \
            delete job,dgd,configmap,computedomain -l "ci-run=$RUN_KEY" --cascade=foreground --wait=true --timeout=15m || failed=1
          kubectl --context "$KUBE_CONTEXT" -n "$NAMESPACE" --request-timeout=30s \
            delete secret "hf-$RUN_KEY" "acr-$RUN_KEY" --ignore-not-found --wait=false || failed=1
          exit "$failed"
      - timeout-minutes: 5
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: always()
        with:
          name: kimi-k25-agg-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACTS }}
          retention-days: 14
          if-no-files-found: error
