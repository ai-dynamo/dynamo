name: Nebius H200 GPU Smoke

on:
  push:
    branches:
      - nebius_ci_smoke_test

concurrency:
  group: nebius-h200-gpu-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu-smoke:
    name: One GPU on Nebius H200
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 20
    env:
      KUBE_CONTEXT: nv-prd-dgxc.teleport.sh-dynamo-nebius-2
      KUBE_NAMESPACE: dynamo-deploy-test
      JOB_NAME: nebius-gpu-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      CUDA_IMAGE: nvidia/cuda:13.0.2-base-ubuntu24.04
    steps:
      - name: Select Nebius cluster
        shell: bash
        run: |
          set -euo pipefail

          test -r /teleport/kubeconfig.yaml
          KUBECONFIG_PATH="${RUNNER_TEMP}/kubeconfig-nebius.yaml"
          cp /teleport/kubeconfig.yaml "${KUBECONFIG_PATH}"
          chmod 600 "${KUBECONFIG_PATH}"

          kubectl --kubeconfig="${KUBECONFIG_PATH}" config view -o json |
            jq --arg context "${KUBE_CONTEXT}" '
              . as $config
              | ($config.contexts[] | select(.name == $context)) as $selected
              | ($config.clusters[] | select(.name == $selected.context.cluster)) as $cluster
              | ($config.users[] | select(.name == $selected.context.user)) as $user
              | {
                  context: {
                    name: $selected.name,
                    cluster: $selected.context.cluster,
                    user: $selected.context.user
                  },
                  cluster: {
                    name: $cluster.name,
                    server: $cluster.cluster.server,
                    tlsServerName: $cluster.cluster["tls-server-name"]
                  },
                  user: {
                    name: $user.name,
                    hasClientCertificate: ($user.user["client-certificate-data"] != null),
                    hasExecPlugin: ($user.user.exec != null)
                  }
                }
            '

          kubectl --kubeconfig="${KUBECONFIG_PATH}" config use-context "${KUBE_CONTEXT}"

          PROXY_KUBECONFIG="${RUNNER_TEMP}/kubeconfig-nebius-proxy.yaml"
          PROXY_PID=""

          for attempt in $(seq 1 10); do
            PROXY_PORT="$((18000 + attempt))"
            PROXY_LOG="${RUNNER_TEMP}/kubectl-proxy-${attempt}.log"

            kubectl \
              --kubeconfig="${KUBECONFIG_PATH}" \
              --context="${KUBE_CONTEXT}" \
              proxy \
              --address=127.0.0.1 \
              --port="${PROXY_PORT}" \
              > "${PROXY_LOG}" 2>&1 &
            CANDIDATE_PID="$!"

            kubectl config set-cluster nebius-pinned \
              --server="http://127.0.0.1:${PROXY_PORT}" \
              --kubeconfig="${PROXY_KUBECONFIG}"
            kubectl config set-context nebius-pinned \
              --cluster=nebius-pinned \
              --kubeconfig="${PROXY_KUBECONFIG}"
            kubectl config use-context nebius-pinned \
              --kubeconfig="${PROXY_KUBECONFIG}"

            proxy_ready=false
            for _ in $(seq 1 20); do
              if kubectl \
                --kubeconfig="${PROXY_KUBECONFIG}" \
                get --raw=/version >/dev/null 2>&1; then
                proxy_ready=true
                break
              fi
              sleep 1
            done

            if [ "${proxy_ready}" = "true" ] &&
              kubectl \
                --kubeconfig="${PROXY_KUBECONFIG}" \
                get clusterpolicy deploy-test-pod-policy >/dev/null 2>&1 &&
              test "$(
                kubectl \
                  --kubeconfig="${PROXY_KUBECONFIG}" \
                  get nodes \
                  -l nvidia.com/gpu.product=NVIDIA-H200 \
                  --no-headers 2>/dev/null |
                  wc -l |
                  tr -d '[:space:]'
              )" -gt 0; then
              PROXY_PID="${CANDIDATE_PID}"
              echo "Pinned verified Nebius connection on attempt ${attempt}"
              echo "KUBECONFIG=${PROXY_KUBECONFIG}" >> "${GITHUB_ENV}"
              echo "KUBECTL_PROXY_PID=${PROXY_PID}" >> "${GITHUB_ENV}"
              export KUBECONFIG="${PROXY_KUBECONFIG}"
              break
            fi

            echo "Connection attempt ${attempt} reached a non-Nebius backend; retrying"
            kill "${CANDIDATE_PID}" 2>/dev/null || true
            wait "${CANDIDATE_PID}" 2>/dev/null || true
          done

          if [ -z "${PROXY_PID}" ]; then
            echo "::error::Could not pin a Teleport connection to the Nebius H200 backend"
            exit 1
          fi

          kubectl get namespace kube-system "${KUBE_NAMESPACE}" \
            -o custom-columns='NAME:.metadata.name,UID:.metadata.uid,CREATED:.metadata.creationTimestamp'
          kubectl get priorityclass ci-nightly-high-priority
          kubectl get clusterpolicy deploy-test-pod-policy
          kubectl get nodes \
            -l nvidia.com/gpu.product=NVIDIA-H200 \
            -o custom-columns='NAME:.metadata.name,GPU:.status.allocatable.nvidia\.com/gpu,RDMA:.status.allocatable.rdma/ib'

      - name: Run one-GPU smoke job
        shell: bash
        run: |
          set -euo pipefail

          kubectl delete job "${JOB_NAME}" \
            --namespace "${KUBE_NAMESPACE}" \
            --ignore-not-found=true \
            --wait=true

          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB_NAME}
            namespace: ${KUBE_NAMESPACE}
            labels:
              app.kubernetes.io/name: nebius-gpu-smoke
              app.kubernetes.io/part-of: dynamo-ci
          spec:
            activeDeadlineSeconds: 900
            backoffLimit: 0
            completions: 1
            parallelism: 1
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: nebius-gpu-smoke
                  app.kubernetes.io/instance: ${JOB_NAME}
              spec:
                restartPolicy: Never
                containers:
                  - name: gpu-smoke
                    image: ${CUDA_IMAGE}
                    imagePullPolicy: IfNotPresent
                    command: ["/bin/bash", "-ceu"]
                    args:
                      - |
                        nvidia-smi
                        GPU_COUNT="\$(nvidia-smi --query-gpu=uuid --format=csv,noheader | wc -l | tr -d '[:space:]')"
                        GPU_NAME="\$(nvidia-smi --query-gpu=name --format=csv,noheader)"
                        test "\${GPU_COUNT}" = "1"
                        grep -q "H200" <<< "\${GPU_NAME}"
                        echo "Nebius one-GPU smoke passed: \${GPU_NAME}"
                    resources:
                      requests:
                        nvidia.com/gpu: "1"
                      limits:
                        nvidia.com/gpu: "1"
          EOF

          POD_NAME=""
          for _ in $(seq 1 60); do
            POD_NAME="$(kubectl get pods \
              --namespace "${KUBE_NAMESPACE}" \
              -l "job-name=${JOB_NAME}" \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            if [ -n "${POD_NAME}" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "${POD_NAME}" ]; then
            echo "::error::No pod was created for job ${JOB_NAME}"
            kubectl describe job "${JOB_NAME}" --namespace "${KUBE_NAMESPACE}" || true
            exit 1
          fi

          POD_JSON="$(kubectl get pod "${POD_NAME}" --namespace "${KUBE_NAMESPACE}" -o json)"
          jq -e '.spec.nodeSelector["nvidia.com/gpu.product"] == "NVIDIA-H200"' <<< "${POD_JSON}"
          jq -e '.spec.priorityClassName == "ci-nightly-high-priority"' <<< "${POD_JSON}"
          jq -e '
            any(
              .spec.tolerations[]?;
              .key == "nvidia.com/gpu" and
              .effect == "NoSchedule" and
              (
                .operator == "Exists" or
                (.operator == "Equal" and .value == "true")
              )
            )
          ' <<< "${POD_JSON}"
          jq -e '
            any(
              .spec.containers[];
              .name == "gpu-smoke" and
              .resources.requests["nvidia.com/gpu"] == "1" and
              .resources.limits["nvidia.com/gpu"] == "1"
            )
          ' <<< "${POD_JSON}"

          if ! kubectl wait \
            --namespace "${KUBE_NAMESPACE}" \
            --for=condition=complete \
            "job/${JOB_NAME}" \
            --timeout=15m; then
            kubectl get pod "${POD_NAME}" --namespace "${KUBE_NAMESPACE}" -o wide || true
            kubectl describe pod "${POD_NAME}" --namespace "${KUBE_NAMESPACE}" || true
            kubectl logs "${POD_NAME}" --namespace "${KUBE_NAMESPACE}" --all-containers || true
            exit 1
          fi

          kubectl logs "${POD_NAME}" --namespace "${KUBE_NAMESPACE}" --all-containers
          NODE_NAME="$(kubectl get pod "${POD_NAME}" \
            --namespace "${KUBE_NAMESPACE}" \
            -o jsonpath='{.spec.nodeName}')"

          {
            echo "### Nebius H200 one-GPU smoke passed"
            echo "- Context: \`${KUBE_CONTEXT}\`"
            echo "- Namespace: \`${KUBE_NAMESPACE}\`"
            echo "- Job: \`${JOB_NAME}\`"
            echo "- Node: \`${NODE_NAME}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup smoke job
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          cleanup_proxy() {
            if [ -n "${KUBECTL_PROXY_PID:-}" ]; then
              kill "${KUBECTL_PROXY_PID}" 2>/dev/null || true
              wait "${KUBECTL_PROXY_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup_proxy EXIT

          if [ -z "${KUBECONFIG:-}" ] || [ ! -f "${KUBECONFIG}" ]; then
            echo "Kubeconfig was not initialized; nothing to clean up"
            exit 0
          fi

          kubectl delete job "${JOB_NAME}" \
            --namespace "${KUBE_NAMESPACE}" \
            --ignore-not-found=true \
            --wait=true \
            --timeout=2m
