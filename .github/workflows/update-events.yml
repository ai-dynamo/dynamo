name: Update Community Events

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: update-community-events
  cancel-in-progress: false

# The bot PAT (not GITHUB_TOKEN) publishes the update: this org disables
# "Allow GitHub Actions to create and approve pull requests", so a
# GITHUB_TOKEN-authenticated create fails with
# "GitHub Actions is not permitted to create or approve pull requests".
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH: auto/update-community-events
    steps:
      # persist-credentials: false keeps the bot PAT out of the git config that
      # `npm install` (and any dependency lifecycle script) could reach; the PAT
      # is scoped to just the push and PR steps below.
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install node-ical@0.20.0

      - name: Regenerate events table
        run: node .github/scripts/update-events.js

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Events table already current on main; nothing to do."
            exit 0
          fi

          # The table differs from main, but an earlier run may have already
          # published this exact table to the bot branch and be waiting on
          # review. Re-pushing it would only churn the open PR with a fresh SHA
          # every 6 hours, so publish only when the branch is missing, is no
          # longer based on current main, or carries a different table.
          if git fetch --depth=2 origin "$BRANCH" 2>/dev/null \
            && [ "$(git rev-parse FETCH_HEAD^ 2>/dev/null)" = "$(git rev-parse HEAD)" ] \
            && git diff --quiet FETCH_HEAD -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Bot branch already carries this table on top of current main; nothing to do."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git --no-pager diff --stat -- README.md

      - name: Commit and push branch
        if: steps.diff.outputs.changed == 'true'
        env:
          BOT_TOKEN: ${{ secrets.OPS_BOT_PAT }}
        run: |
          git config user.name  "dynamo-ops"
          git config user.email "170655669+dynamo-ops@users.noreply.github.com"
          # Rebuild the branch from main each run so it carries exactly one
          # commit; the table is fully regenerated from the calendar anyway,
          # so history on this bot-owned branch is disposable.
          git checkout -B "$BRANCH"
          git add README.md
          git commit -s -m "chore: update community events from Google Calendar"
          git push --force \
            "https://x-access-token:${BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$BRANCH"

      - name: Open or reuse PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPS_BOT_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          # --state open matters: `gh pr view <branch>` falls back to the most
          # recent closed/merged PR, which would make every run after the first
          # merge silently skip creating a new PR.
          # isCrossRepository filtering matters too: --head matches on branch
          # name alone, and forks have opened PRs from a same-named branch
          # (e.g. #12530), which would otherwise be mistaken for ours.
          PR_URL=$(gh pr list --head "$BRANCH" --state open \
            --json url,isCrossRepository \
            --jq 'map(select(.isCrossRepository == false)) | .[0].url // empty' 2>/dev/null || true)
          if [[ -z "$PR_URL" ]]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update community events" \
              --body "Automated community events update from the Dynamo public Google Calendar.")
          fi
          echo "Community events PR: $PR_URL"
          echo "Community events PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
