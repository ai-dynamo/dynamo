name: Update Community Events

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: update-community-events
  cancel-in-progress: false

# The bot PAT (not GITHUB_TOKEN) opens the PR: this org disables
# "Allow GitHub Actions to create and approve pull requests", so a
# GITHUB_TOKEN-authenticated create fails with
# "GitHub Actions is not permitted to create or approve pull requests".
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH: auto/update-community-events
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main
          token: ${{ secrets.OPS_BOT_PAT }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install node-ical@0.20.0

      - name: Regenerate events table
        run: node .github/scripts/update-events.js

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "README events table already up to date; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- README.md
          fi

      - name: Commit and push branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "dynamo-ops"
          git config user.email "170655669+dynamo-ops@users.noreply.github.com"
          # Rebuild the branch from main each run so it carries exactly one
          # commit; the table is fully regenerated from the calendar anyway,
          # so history on this bot-owned branch is disposable.
          git checkout -B "$BRANCH"
          git add README.md
          git commit -s -m "chore: update community events from Google Calendar"
          git push --force origin "$BRANCH"

      - name: Open or reuse PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPS_BOT_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Idempotent across runs: the branch is force-updated in place, so
          # reuse the open PR if there is one instead of failing on create.
          PR_URL=$(gh pr view "$BRANCH" --json url --jq .url 2>/dev/null || true)
          if [[ -z "$PR_URL" ]]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update community events" \
              --body "Automated community events update from the Dynamo public Google Calendar.")
          fi
          echo "Community events PR: $PR_URL"
          echo "Community events PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
