name: Shared Compliance Audit

on:
  workflow_call:
    inputs:
      framework:
        required: false
        type: string
        default: ''
      target:
        required: false
        type: string
        default: ''
      cuda_version:
        required: false
        type: string
        default: ''
      baseline_sbom_file:
        description: 'Compatibility input; the producer manifest binds exact per-arch baseline bytes.'
        required: false
        type: string
        default: ''
      target_tag_plain:
        required: true
        type: string
      image_ref:
        description: 'Exact pushed image reference from the producing build.'
        required: true
        type: string
      source_sha:
        required: false
        type: string
        default: ''
      producer_run_id:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  audit:
    name: Compliance audit (amd64 + arm64)
    runs-on: prod-builder-v3
    timeout-minutes: 90
    steps:
      - name: Checkout audit implementation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Login to source registry
        uses: $/.github/actions/docker-login
        with:
          aws_default_region: ${{ vars.AWS_DEFAULT_REGION }}
          ecr_registry: ${{ vars.ECR_REGISTRY }}
      - name: Initialize native audit builder
        id: audit-builder
        uses: $/.github/actions/init-dynamo-builder
        with:
          builder_name: audit-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target_tag_plain }}
          flavor: general
          arch: linux/amd64
          namespace: ${{ vars.BUILDKIT_NAMESPACE }}
      - name: Audit every published platform by digest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id || github.run_id }}
          IMAGE_REF: ${{ inputs.image_ref }}
          PREFIX: ${{ inputs.target_tag_plain }}
          BUILDER: audit-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target_tag_plain }}
        run: |
          set -euo pipefail
          PYTHONPATH=container python3 -m compliance.publication audit \
            --repo "${GITHUB_REPOSITORY}" --run-id "${PRODUCER_RUN_ID}" \
            --sha "${SOURCE_SHA}" --prefix "${PREFIX}" --image-ref "${IMAGE_REF}" \
            --builder "${BUILDER}" --output "${RUNNER_TEMP}/compliance-audit"
      - name: Retain independent platform inventories and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: compliance-audit-${{ inputs.source_sha || github.sha }}-${{ inputs.target_tag_plain }}
          path: ${{ runner.temp }}/compliance-audit/
          overwrite: true
          retention-days: 30
          if-no-files-found: ignore
      - name: Remove this audit builder
        if: ${{ always() && steps.audit-builder.outcome != 'skipped' }}
        env:
          AUDIT_BUILDER: audit-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target_tag_plain }}
        run: docker buildx rm --force "${AUDIT_BUILDER}" || true
