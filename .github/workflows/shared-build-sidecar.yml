name: Shared Build Sidecar

on:
  workflow_call:
    inputs:
      builder_name:
        description: 'BuildKit builder name'
        required: true
        type: string
      build_timeout_minutes:
        description: 'Timeout in minutes for the sidecar build and tests'
        required: false
        type: number
        default: 60

jobs:
  tests:
    name: dynamo-sidecar / tests
    runs-on:
      group: Fastchecker
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up system dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Match the lightweight protoc setup used by pre-merge Rust tests.
          PB_REL="https://github.com/protocolbuffers/protobuf/releases"
          PROTOC_VER="30.2"
          PROTOC_ZIP="protoc-${PROTOC_VER}-linux-x86_64.zip"
          PROTOC_SHA256="327e9397c6fb3ea2a542513a3221334c6f76f7aa524a7d2561142b67b312a01f"
          curl --retry 5 --retry-delay 2 -fsSLO "${PB_REL}/download/v${PROTOC_VER}/${PROTOC_ZIP}"
          echo "${PROTOC_SHA256}  ${PROTOC_ZIP}" | sha256sum -c -
          unzip "${PROTOC_ZIP}" -d "${HOME}/.local"
          rm "${PROTOC_ZIP}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/protoc" --version

      - name: Cache Cargo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry
          key: ${{ runner.os }}-sidecar-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sidecar-cargo-

      - name: Run unit and integration tests
        shell: bash
        run: |
          set -euo pipefail
          # The framework-facing tests use local gRPC mocks and need no GPU.
          # Serialize compilation to bound peak linker memory on CI runners.
          cargo test --locked --jobs 1 \
            -p dynamo-sidecar-common \
            -p dynamo-vllm-sidecar \
            -p dynamo-sglang-sidecar \
            -p dynamo-trtllm-sidecar

  build:
    name: dynamo-sidecar / image
    needs: tests
    runs-on: prod-builder-v3
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Initialize Dynamo Builder
        uses: ./.github/actions/init-dynamo-builder
        with:
          builder_name: ${{ inputs.builder_name }}
          flavor: general
          arch: linux/amd64,linux/arm64
          namespace: ${{ vars.BUILDKIT_NAMESPACE }}

      - name: Build sidecar image
        shell: bash
        env:
          BUILDER_NAME: ${{ inputs.builder_name }}
        run: |
          set -euo pipefail
          # No output is exported: both platform images are fully built and
          # retained in BuildKit's cache as a CI gate, but not published.
          docker buildx build --builder "${BUILDER_NAME}" \
            --platform linux/amd64,linux/arm64 \
            --progress plain \
            --target runtime \
            --file lib/sidecar/Dockerfile \
            .
