name: Shared Build Sidecar

on:
  workflow_call:
    inputs:
      builder_name:
        description: 'BuildKit builder name'
        required: true
        type: string
      build_timeout_minutes:
        description: 'Timeout in minutes for the sidecar build and tests'
        required: false
        type: number
        default: 60
      extra_tags:
        description: 'Additional ECR tags (newline-separated)'
        required: false
        type: string
        default: ''
    outputs:
      target_tag_plain:
        description: 'Plain sidecar image tag prefix'
        value: ${{ jobs.build.outputs.target_tag_plain }}

jobs:
  tests:
    name: Test cpu, amd64
    runs-on:
      group: Fastchecker
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Protoc
        uses: $/.github/actions/setup-protoc

      - name: Cache Cargo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry
          key: ${{ runner.os }}-sidecar-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sidecar-cargo-

      - name: Run unit and integration tests
        shell: bash
        run: |
          set -euo pipefail
          # The framework-facing tests use local gRPC mocks and need no GPU.
          # Serialize compilation to bound peak linker memory on CI runners.
          cargo test --locked --jobs 1 \
            -p dynamo-sidecar-common \
            -p dynamo-vllm-sidecar \
            -p dynamo-sglang-sidecar \
            -p dynamo-trtllm-sidecar

  build:
    name: Build multi-arch cpu
    needs: tests
    runs-on: prod-builder-v3
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    permissions:
      contents: read
    outputs:
      target_tag_plain: ${{ steps.calculate-target-tag.outputs.target_tag_plain }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Docker Login
        uses: $/.github/actions/docker-login
        with:
          aws_default_region: ${{ vars.AWS_DEFAULT_REGION }}
          ecr_registry: ${{ vars.ECR_REGISTRY }}

      - name: Calculate target tag
        id: calculate-target-tag
        shell: bash
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          target_tag_plain="dynamo-sidecar"
          echo "target_tag_plain=${target_tag_plain}" >> "${GITHUB_OUTPUT}"
          echo "image_uri=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}-${target_tag_plain}" >> "${GITHUB_OUTPUT}"

      - name: Initialize Dynamo Builder
        uses: ./.github/actions/init-dynamo-builder
        with:
          builder_name: ${{ inputs.builder_name }}
          flavor: general
          arch: linux/amd64,linux/arm64
          namespace: ${{ vars.BUILDKIT_NAMESPACE }}

      - name: Calculate extra tags
        id: extra-tags
        shell: bash
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EXTRA_TAGS: ${{ inputs.extra_tags }}
        run: |
          set -euo pipefail
          {
            echo 'tags<<EOF'
            while IFS= read -r tag; do
              if [[ -n "${tag}" ]]; then
                echo "${ECR_REGISTRY}/${ECR_REPOSITORY}:${tag}"
              fi
            done <<< "${EXTRA_TAGS}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Build and Push Image
        uses: $/.github/actions/docker-remote-build
        with:
          image_tag: ${{ steps.calculate-target-tag.outputs.image_uri }}
          framework: dynamo-sidecar
          target: runtime
          build_target: runtime
          dockerfile: ./lib/sidecar/Dockerfile
          platform: linux/amd64,linux/arm64
          cuda_version: ''
          aws_default_region: ${{ vars.AWS_DEFAULT_REGION }}
          extra_tags: ${{ steps.extra-tags.outputs.tags }}
          push_image: true
          no_load: true
          use_sccache: false
