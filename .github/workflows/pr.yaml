name: PR

on:
  push:
    branches: ["pull-request/[0-9]+"]

permissions:
  contents: read

jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "Independent success"
  flaky:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail only on attempt one
        run: test "$GITHUB_RUN_ATTEMPT" -gt 1
  dependent:
    needs: flaky
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "Dependent success"
