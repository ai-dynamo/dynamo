name: PR

on:
  push:
    branches:
      - "pull-request/[0-9]+"

concurrency:
  # The group name is the ref_name, so that workflows on the same PR/branch have the same group name for cancelling.
  group: docker-build-test-${{ github.ref_name }}
  cancel-in-progress: true

env:
  BUILDER_NAME: b-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # ============================================================================
  # SETUP & DETECTION JOBS
  # ============================================================================
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
      dev_images: ${{ steps.changes.outputs.dev_images }}
      planner: ${{ steps.changes.outputs.planner }}
      operator: ${{ steps.changes.outputs.operator }}
      snapshot: ${{ steps.changes.outputs.snapshot }}
      snapshot_vllm: ${{ steps.changes.outputs.snapshot_vllm }}
      snapshot_sglang: ${{ steps.changes.outputs.snapshot_sglang }}
      snapshot_trtllm: ${{ steps.changes.outputs.snapshot_trtllm }}
      power_agent: ${{ steps.changes.outputs.power_agent }}
      sidecar: ${{ steps.changes.outputs.sidecar }}
      deploy: ${{ steps.changes.outputs.deploy }}
      dgdr: ${{ steps.changes.outputs.dgdr }}
      vllm: ${{ steps.changes.outputs.vllm }}
      sglang: ${{ steps.changes.outputs.sglang }}
      trtllm: ${{ steps.changes.outputs.trtllm }}
      triton: ${{ steps.changes.outputs.triton }}
      frontend: ${{ steps.changes.outputs.frontend }}
      benchmarks: ${{ steps.changes.outputs.benchmarks }}
      sample: ${{ steps.changes.outputs.sample }}
      efa: ${{ steps.changes.outputs.efa }}
      base_ref: ${{ steps.changes.outputs.base_ref }}
      merge_base_sha: ${{ steps.changes.outputs.merge_base_sha }}
      builder_name: ${{ steps.export-builder-name.outputs.builder_name }}
      run_deploy_tests: ${{ steps.deploy-test-configuration.outputs.enabled }}
      run_multigpu_tests: ${{ steps.multigpu-test-configuration.outputs.enabled }}
    steps:
      - name: Validate deploy test configuration
        id: deploy-test-configuration
        env:
          RUN_DEPLOY_TESTS: ${{ vars.RUN_DEPLOY_TESTS }}
        run: |
          case "$RUN_DEPLOY_TESTS" in
            true)
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              ;;
            false)
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              ;;
            '')
              echo "::error::Repository variable RUN_DEPLOY_TESTS must be set to true or false."
              exit 1
              ;;
            *)
              echo "::error::Repository variable RUN_DEPLOY_TESTS must be exactly true or false."
              exit 1
              ;;
          esac
      - name: Deploy tests skipped (RUN_DEPLOY_TESTS=false)
        if: steps.deploy-test-configuration.outputs.enabled == 'false'
        run: |
          echo "::notice title=Deploy tests skipped::Repository variable RUN_DEPLOY_TESTS is false."
          {
            echo '## Deploy tests skipped'
            echo
            echo 'Repository variable `RUN_DEPLOY_TESTS` is set to `false`.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate multi-GPU test configuration
        id: multigpu-test-configuration
        env:
          RUN_MULTIGPU_TESTS: ${{ vars.RUN_MULTIGPU_TESTS }}
        run: |
          case "$RUN_MULTIGPU_TESTS" in
            true)
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              ;;
            false)
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              ;;
            '')
              echo "::error::Repository variable RUN_MULTIGPU_TESTS must be set to true or false."
              exit 1
              ;;
            *)
              echo "::error::Repository variable RUN_MULTIGPU_TESTS must be exactly true or false."
              exit 1
              ;;
          esac
      - name: Multi-GPU tests skipped (RUN_MULTIGPU_TESTS=false)
        if: steps.multigpu-test-configuration.outputs.enabled == 'false'
        run: |
          echo "::notice title=Multi-GPU tests skipped::Repository variable RUN_MULTIGPU_TESTS is false."
          {
            echo '## Multi-GPU tests skipped'
            echo
            echo 'Repository variable `RUN_MULTIGPU_TESTS` is set to `false`.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        # Do not use fetch-depth: 0 — changed-files now works with shallow clone
      - name: Check for changes
        id: changes
        uses: $/.github/actions/changed-files
        with:
          gh_token: ${{ github.token }}
      - name: Export builder name
        id: export-builder-name
        run: |
          echo "builder_name=${{ env.BUILDER_NAME }}" >> $GITHUB_OUTPUT

  backend-status-check:
    runs-on: ubuntu-latest
    needs:
      - changed-files
      - vllm-build
      - vllm-test
      - vllm-multi-gpu-test
    if: always()
    steps:
      - name: Check all dependent jobs
        run: |
          echo '${{ toJson(needs) }}' | jq -e 'to_entries | map(.value.result) | all(. as $result | ["success", "skipped"] | any($result == .))'

  deploy-status-check:
    runs-on: ubuntu-latest
    needs:
      - changed-files
    if: always() && !cancelled()
    steps:
      - name: Check all deploy test jobs
        run: |
          echo '${{ toJson(needs) }}' | jq -e 'to_entries | map(.value.result) | all(. as $result | ["success", "skipped"] | any($result == .))'

  dynamo-status-check:
    runs-on: ubuntu-slim
    needs:
      - changed-files
    if: always()
    steps:
      - name: Check all dynamo jobs
        run: |
          echo '${{ toJson(needs) }}' | jq -e 'to_entries | map(.value.result) | all(. as $result | ["success", "skipped"] | any($result == .))'

  # ============================================================================
  # BUILD PIPELINES
  # ============================================================================

  vllm-build:
    name: vllm-runtime # This name overlaps with other vllm jobs to group them in the UI
    needs: [changed-files]
    # `sample` is here because sample tests piggyback on this image and run as part of vllm-test.
    # `operator` is here because operator changes run the deploy tests, which
    # deploy the CI-built runtime image. Snapshot checkpoint deploy tests also
    # use this image directly for capture and restore.
    if: |
      needs.changed-files.outputs.core == 'true' ||
      needs.changed-files.outputs.vllm == 'true' ||
      needs.changed-files.outputs.deploy == 'true' ||
      needs.changed-files.outputs.sample == 'true' ||
      needs.changed-files.outputs.operator == 'true' ||
      needs.changed-files.outputs.snapshot == 'true' ||
      needs.changed-files.outputs.snapshot_vllm == 'true'
    uses: $/.github/workflows/shared-build-image.yml
    with:
      framework: vllm
      target: runtime
      cuda_version: '["13.0"]'
      platform: 'linux/amd64,linux/arm64'
      builder_name: ${{ needs.changed-files.outputs.builder_name }}
      inline_compliance: true
      artifact_retention_days: '7'
      # Include cold multi-arch compilation and the later test-image/compliance stages.
      build_timeout_minutes: 90
      # OSRB CSV diff baseline: the target branch selects the rule, while the
      # merge-base pins PR->main diffs to the PR's fork point.
      diff_event_context: pr
      diff_current_branch: ${{ github.ref_name }}
      diff_base_branch: ${{ needs.changed-files.outputs.base_ref }}
      diff_merge_base_sha: ${{ needs.changed-files.outputs.merge_base_sha }}
    # actions: read lets the build download a prior run's baseline compliance
    # artifact to diff against (a reusable workflow's token can't exceed the
    # caller's). Missing -> the diff soft-degrades, build stays green.
    permissions:
      contents: read
      actions: read
    secrets: inherit

  # ============================================================================
  # TEST PIPELINES
  # Whole-job placement uses successful mean runtimes from Oct 2-9, 2026.
  # A full GPU-test run contributes about 111.3 job-minutes east and 103.9
  # west, requesting up to 6/5 GPUs respectively if all jobs run concurrently.
  # Keep each backend suite intact to avoid repeating container/setup work.
  # ============================================================================

  vllm-test:
    name: vllm-runtime # This name overlaps with other vllm jobs to group them in the UI
    needs: [changed-files, vllm-build]
    if: needs.changed-files.outputs.core == 'true' || needs.changed-files.outputs.vllm == 'true' || needs.changed-files.outputs.deploy == 'true' || needs.changed-files.outputs.sample == 'true'
    uses: $/.github/workflows/shared-test.yml
    with:
      test_suite_name: vllm
      framework: vllm  # matches the framework passed to vllm-build
      test_type: Test
      amd_runner: prod-tester-amd-gpu-v2 # ARM uses the CPU runner
      amd_runner_labels: '["gpu-1","amd64","v2","us-east-1"]'
      target_tag_plain: ${{ needs.vllm-build.outputs.target_tag_plain }}
      cuda_version: '["13.0"]'
      platform: '["amd64", "arm64"]' # arm64 for CPU tests, single GPU tests are skipped
      run_cpu_only_tests: true
      # Keep the fast CPU pool parallel and isolate deployment-level tests so a
      # slow startup cannot consume the whole pool's retry budget.
      cpu_only_test_markers: pre_merge and vllm and gpu_0 and not e2e
      run_cpu_e2e_tests: true
      cpu_e2e_test_markers: pre_merge and vllm and gpu_0 and e2e
      # Keep the outer step budget above the test's 450s timeout so pytest can
      # finish teardown and upload diagnostics instead of being killed first.
      cpu_e2e_test_timeout_minutes: 15
      # Plain runtime images do not include sidecar binaries.
      gpu_test_markers: pre_merge and vllm and gpu_1 and not sidecar
      gpu_test_timeout_minutes: 45
      # Profiled tests run in the parallel stage; unprofiled fall through to sequential.
      # 24 GiB admits all currently profiled vLLM tests (max is ~20.4 GiB) on a 48 GiB GPU.
      run_gpu_parallel_tests: true
      gpu_parallel_max_vram_gib: '24'
    secrets: inherit

  vllm-multi-gpu-test:
    name: vllm-runtime # This name overlaps with other vllm jobs to group them in the UI
    needs: [changed-files, vllm-build]
    if: |
      needs.changed-files.outputs.run_multigpu_tests == 'true' &&
      (needs.changed-files.outputs.core == 'true' ||
       needs.changed-files.outputs.vllm == 'true' ||
       needs.changed-files.outputs.deploy == 'true')
    uses: $/.github/workflows/shared-test.yml
    with:
      test_suite_name: vllm
      framework: vllm  # matches the framework passed to vllm-build
      test_type: 2-GPU Test
      amd_runner: prod-tester-amd-gpu-2-v2
      amd_runner_labels: '["gpu-2","amd64","v2","us-east-1"]'
      target_tag_plain: ${{ needs.vllm-build.outputs.target_tag_plain }}
      cuda_version: '["13.0"]'
      platform: '["amd64"]' # No ARM GPUs available
      run_sanity_check: false
      gpu_test_markers: pre_merge and vllm and gpu_2 and not sidecar
      gpu_test_timeout_minutes: 60
    secrets: inherit

  clean-k8s-builder:
    name: Clean K8s builder if exists
    runs-on: prod-default-small-v2
    if: always()
    # Wait for every builder consumer, including jobs that can fall back to
    # the same K8s pair. Test-only jobs use published images, not the builder.
    needs:
      - changed-files
      - vllm-build
      - vllm-multi-gpu-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Create K8s builders (skip bootstrap)
        uses: $/.github/actions/bootstrap-buildkit
        continue-on-error: true
        with:
          builder_name: ${{ needs.changed-files.outputs.builder_name }}
          buildkit_worker_addresses: ''
          namespace: ${{ vars.BUILDKIT_NAMESPACE }}
          skip_bootstrap: true
      - name: Builder Cleanup in case of k8s builder
        shell: bash
        run: |
          docker buildx rm ${{ needs.changed-files.outputs.builder_name }} || true
