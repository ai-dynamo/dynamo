#
# Keep main's generated API references current.
#
# The per-PR freshness gate is deliberately scoped: api_freshness.py blocks a
# branch only when the branch itself touched something feeding a generator, so
# a PR is never failed for drift main introduced. That scoping is right -- the
# alternative fails whoever is unlucky at merge time. But it assumes the other
# half of the sentence in api_freshness.py's own docstring:
#
#   "the next regeneration on main resolves it"
#
# Nothing regenerated main. Drift accumulated instead -- twice on 2026-08-11
# alone (#12985, #13035) -- and the cost is not a red check: the strict check
# runs BEFORE the sync/publish steps in fern-docs.yml, so stale output skips
# the publish and docs.nvidia.com stops updating.
#
# This job is that missing half. It pushes straight to main when it can, and
# degrades to a branch when it cannot, so it is correct under either
# permission state and needs no flag day.
#
# Direct push to main from a workflow does work, via OPS_BOT_PAT as
# dynamo-ops: @ai-dynamo/autobots (whose sole member is dynamo-ops) holds
# bypass on ruleset 4130136, and that is sufficient even though 3932713 also
# carries a pull_request rule with no bypass. Demonstrated 2026-08-11T23:57Z,
# when community-events-refresh.yml landed 3d77ee344 -- its first successful
# run after five failures.
#
# The fallback stays because that demonstration is narrower than it looks. It
# was one manual workflow_dispatch. The four scheduled runs before it failed on
# GH013, an identical dispatch on 08-10 also failed, and no scheduled run has
# succeeded yet -- so something changed that is not visible in the rulesets,
# and `on: push`, the mode this workflow actually uses, is untested by either.
# Until a scheduled or push-triggered run lands a commit, treat direct push as
# unproven in this mode and let the fallback carry it.
#
# The fallback exists because a workflow that fails 100% of the time is worse
# than one that degrades: community-events-refresh.yml pushes to main and has
# never once succeeded, and update-events.yml uses create-pull-request, which
# fails "GitHub Actions is not permitted to create or approve pull requests".
# Both merged green -- a workflow file passes CI without anything running it --
# and both sat broken unnoticed, one for three weeks.

name: Regenerate API references

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serialize: two merges landing close together would otherwise race two
# regeneration branches.
concurrency:
  group: regenerate-api-references
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate API references
    runs-on: ubuntu-latest
    # This job pushes with a PAT, and a PAT push re-triggers `on: push` (unlike
    # GITHUB_TOKEN, which GitHub suppresses to avoid exactly this). Without the
    # guard every run that pushes causes a second run. That run regenerates
    # nothing and exits, so it terminates either way, but it doubles the run
    # count and makes the history read as if two merges drifted.
    if: github.actor != 'dynamo-ops'
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main
          token: ${{ secrets.OPS_BOT_PAT }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'

      - name: Install generator dependencies
        run: python3 -m pip install 'griffe==2.1.0' pyyaml

      - name: Regenerate
        id: regen
        run: |
          set -euo pipefail
          # gen_kubernetes_api.py re-renders a committed intermediate that
          # `make generate-api-docs` produces from the operator Go types. That
          # first hop needs Go and crd-ref-docs, so it stays a human's job;
          # running the renderer here still catches renderer-side drift.
          for g in gen_python_api gen_rust_api gen_kubernetes_api gen_llms_tables; do
            python3 "docs/fern/scripts/${g}.py"
          done
          if [ -z "$(git status --porcelain -- docs/fern)" ]; then
            echo "All generated references current; nothing to do."
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Drift detected:"
          git status --porcelain -- docs/fern
          echo "drifted=true" >> "$GITHUB_OUTPUT"

          # Blast-radius cap. A merge that moves a documented symbol touches a
          # handful of pages; a BROKEN generator rewrites all of them. Since the
          # happy path pushes to main unreviewed, an unbounded diff is the one
          # way this job can do real damage. Past real regenerations for scale:
          # #12985 was 4 files, #13035 was 6.
          files=$(git status --porcelain -- docs/fern | wc -l | tr -d ' ')
          lines=$(git diff --numstat -- docs/fern | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "  files=${files}  lines=${lines}"
          if [ "$files" -gt 20 ] || [ "$lines" -gt 2000 ]; then
            echo "::warning::Drift exceeds the cap (${files} files, ${lines} lines); refusing to push to main."
            echo "capped=true" >> "$GITHUB_OUTPUT"
          else
            echo "capped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, then push to main (falling back to a branch)
        if: steps.regen.outputs.drifted == 'true'
        id: push
        run: |
          set -euo pipefail
          git config user.name  "dynamo-ops"
          git config user.email "170655669+dynamo-ops@users.noreply.github.com"

          commit() {
            # Only ever stage generated docs. A bare `git add -A` would sweep
            # up anything else the toolchain left in the workspace.
            git add docs/fern
            git commit -s \
              -m "docs(api): regenerate API references" \
              -m "Automated regeneration after ${GITHUB_SHA::9} moved a documented symbol." \
              -m "Generated by .github/workflows/regenerate-api-references.yml."
          }

          commit

          if [ "${{ steps.regen.outputs.capped }}" = "true" ]; then
            echo "Diff exceeds the cap; skipping the direct push and going to a branch."
            PUSH_TO_MAIN=false
          else
            PUSH_TO_MAIN=true
          fi

          # Preferred path: straight onto main, so the publish is unblocked
          # without waiting for a human. main moves under a post-merge job by
          # definition, so a rejected push is retried by regenerating against
          # whatever main now holds -- these files have no merge semantics, so
          # re-running the generators is always the right resolution.
          for attempt in 1 2 3; do
            if [ "$PUSH_TO_MAIN" != "true" ]; then break; fi
            if git push origin HEAD:main 2>/tmp/push.err; then
              echo "Pushed regenerated references directly to main."
              echo "target=main" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # A rules rejection will not resolve by retrying; fall back at once.
            if grep -q 'GH013\|protected branch\|Changes must be made through a pull request' /tmp/push.err; then
              echo "Direct push to main is blocked by repository rules; falling back to a branch."
              cat /tmp/push.err
              break
            fi

            echo "Push rejected on attempt ${attempt} (main moved); replaying."
            cat /tmp/push.err
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            for g in gen_python_api gen_rust_api gen_kubernetes_api gen_llms_tables; do
              python3 "docs/fern/scripts/${g}.py"
            done
            if [ -z "$(git status --porcelain -- docs/fern)" ]; then
              echo "Already current on main; nothing to publish."
              echo "target=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            commit
          done

          # Fallback: push a branch and let a human open the PR. Keyed on the
          # main SHA that drifted, so re-running the same merge reuses it
          # instead of stacking near-identical branches.
          BRANCH="docs/regen-api-references-${GITHUB_SHA::9}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Branch $BRANCH already exists on origin; nothing to push."
            echo "target=branch-exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "target=branch" >> "$GITHUB_OUTPUT"
          # Fail deliberately. The freshness check still blocks the publish, so
          # main now carries stale references and docs.nvidia.com will not
          # update until someone opens a PR from this branch. A green run would
          # hide that -- which is exactly how update-events.yml failed 100 times
          # unnoticed.
          echo "::error::Regenerated references could not be pushed to main; opened ${BRANCH}. The docs publish stays blocked until it merges."
          exit 1

      - name: Report
        if: steps.regen.outputs.drifted == 'true'
        run: |
          {
            echo "### API references drifted"
            echo
            case "${{ steps.push.outputs.target }}" in
              main)
                echo "Regenerated and pushed straight to \`main\`. Nothing to do." ;;
              branch)
                echo "Direct push to \`main\` is blocked by repository rules, so this pushed"
                echo "\`${{ steps.push.outputs.branch }}\`. **Open a PR from it** — until it merges,"
                echo "\`main\` carries stale generated references."
                echo
                echo "To remove this manual step, grant \`@ai-dynamo/autobots\` bypass on ruleset"
                echo "\`3932713\` (\"Default branches\"). It already has bypass on \`4130136\`, which is"
                echo "overruled while \`3932713\` grants none." ;;
              branch-exists)
                echo "A regeneration branch for this SHA already exists; no new push." ;;
              none)
                echo "main was already current by the time this ran." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  # The job above fails deliberately when it cannot self-heal. Route that
  # through the same notifier nightly and post-merge use, so a blocked publish
  # reaches a human instead of sitting red in the Actions tab -- the failure
  # mode that let update-events.yml fail 100 times unnoticed.
  notify:
    needs: regenerate
    if: always() && needs.regenerate.result == 'failure'
    uses: ./.github/workflows/notify-slack.yml
    with:
      pipeline_name: Regenerate API references
      runs_on: ubuntu-slim
    secrets: inherit
