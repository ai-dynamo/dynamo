name: Frontend OpenAPI composition

on:
  pull_request:
    paths:
      - 'container/context.yaml'
      - 'Cargo.lock'
      - 'lib/llm/src/protocols/**'
      - 'lib/llm/src/http/service/openapi_docs.rs'
      - 'lib/llm/src/bin/generate_frontend_openapi.rs'
      - 'lib/llm/tests/openapi_*.rs'
      - 'scripts/protocol_compatibility/**'
      - 'lib/llm/tests/fixtures/openapi/**'
      - '.github/workflows/openapi-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install composition dependencies
        run: python -m pip install -r scripts/protocol_compatibility/requirements.txt
      - name: Test standalone composition
        run: python -m unittest scripts.protocol_compatibility.tests.composition.test_openai scripts.protocol_compatibility.tests.composition.test_response_openai -v
