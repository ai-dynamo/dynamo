name: Test model cache tooling
on:
  pull_request:
    paths:
      - .github/approved-test-models.json
      - .github/*model*requirements.txt
      - .github/scripts/*model*cache*
      - .github/actions/hydrate-test-models/**
      - .github/workflows/*model*cache*.yml
      - .github/scripts/pytest-local.sh
      - tests/serve/lora_utils.py
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r .github/model-publisher-requirements.txt
      - run: |
          python .github/scripts/model-cache.py check
          python -m unittest discover -s .github/scripts -p test_model_cache.py -v
