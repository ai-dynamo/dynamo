name: DGDR and Sweeper recipe matrix

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Repository-relative comparison suite
        required: true
        default: components/src/dynamo/profiler/tests/sweeper/testsuite-issue-8469.yaml
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install comparison dependencies
        run: python -m pip install -e .
      - name: Run comparison suite
        env:
          DYNAMO_COMMIT_SHA: ${{ github.sha }}
          OUTPUT_DIR: components/src/dynamo/profiler/tests/sweeper/generated/workflow-${{ github.run_id }}
          SUITE: ${{ inputs.suite }}
        run: |
          python components/src/dynamo/profiler/tests/sweeper/run_cases.py \
            --suite "${SUITE}" \
            --output-dir "${OUTPUT_DIR}" \
            --report \
            --tested-by "${GITHUB_ACTOR}"
      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sweeper-comparison-${{ github.run_id }}
          path: components/src/dynamo/profiler/tests/sweeper/generated/workflow-${{ github.run_id }}/
          if-no-files-found: warn
