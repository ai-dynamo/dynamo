name: TRT-LLM Sidecar Upstream Nightly Media

on:
  workflow_call:
    inputs:
      builder_name:
        required: true
        type: string
    secrets:
      HF_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build standard serve test runtime
    runs-on: prod-builder-v3
    timeout-minutes: 60
    outputs:
      image: ${{ steps.config.outputs.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Test nightly resolution and launch configuration
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          python3 -m unittest discover -s lib/sidecar/trtllm/ci/tests -v
      - name: Resolve latest upstream nightly
        id: config
        run: >-
          python3 lib/sidecar/trtllm/ci/resolve_nightly.py
          --output resolved-nightly.json
          --github-output "$GITHUB_OUTPUT"
      - name: Refresh BuildKit builder
        uses: $/.github/actions/builder-refresher
        with:
          builder_name: ${{ inputs.builder_name }}
          flavor: general
          arch: linux/amd64,linux/arm64
          namespace: ${{ vars.BUILDKIT_NAMESPACE }}
      - name: Build current-source Dynamo runtime and sidecar
        shell: bash
        env:
          NATIVE_IMAGE: ${{ steps.config.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx build --target sidecar-trtllm-serve-tests \
            --platform linux/amd64 -f lib/sidecar/Dockerfile \
            --build-arg "TRTLLM_TEST_IMAGE=$NATIVE_IMAGE" \
            --build-arg "DYNAMO_SOURCE_COMMIT=$(git rev-parse HEAD)" \
            --output type=local,dest=trtllm-serve-runtime .
          cp resolved-nightly.json trtllm-serve-runtime/nightly.json
      - name: Upload resolved native identity
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: trtllm-nightly-selection-${{ github.sha }}
          path: resolved-nightly.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: trtllm-serve-runtime-${{ github.sha }}
          path: trtllm-serve-runtime/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Upstream TRT-LLM ${{ matrix.config }} serve (1 GPU)
    strategy:
      fail-fast: false
      matrix:
        config: [trtllm_image, trtllm_video, trtllm_audio, trtllm_image_routing, trtllm_image_e_pd, trtllm_image_e_p_d]
    needs: build
    runs-on: [gpu-1, amd64, runner-version-v1, gpu-generic, us-west-2]
    timeout-minutes: 45
    container:
      image: ${{ needs.build.outputs.image }}
      env:
        HOME: /__w/dynamo/dynamo
        USER: dynamo
        PRTE_ALLOW_RUN_AS_ROOT: '1'
        PRTE_ALLOW_RUN_AS_ROOT_CONFIRM: '1'
        PMIX_HOSTNAME: mpi-node0
        PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: upb
        TRTLLM_NO_USAGE_STATS: '1'
        # Upstream's framework-owned pytest plugins are not Dynamo's test suite.
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: trtllm-serve-runtime-${{ github.sha }}
          path: trtllm-serve-runtime
      - name: Record the stock runtime before installing test tooling
        shell: bash
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          mkdir -p "test-results/$CONFIG"
          python3 - <<'PYTHON'
          import importlib.metadata
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          identity = {
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "native_commit": os.environ.get("TRT_LLM_GIT_COMMIT"),
              "native_python": sys.executable,
              "python_version": sys.version,
              "packages": {d.metadata["Name"]: d.version for d in importlib.metadata.distributions()},
          }
          path = Path("test-results") / os.environ["CONFIG"] / "stock-runtime.json"
          path.write_text(json.dumps(identity, indent=2) + "\n")
          PYTHON
      - name: Install pinned native OpenEngine bindings without changing dependencies
        shell: bash
        env:
          PIP_NO_DEPS: '1'
        run: |
          set -euo pipefail
          source lib/sidecar/trtllm/launch/common.sh
          trtllm_ensure_openengine_bindings python3
      - name: Install the supported native video decoder without dependencies
        if: matrix.config == 'trtllm_video'
        run: python3 components/src/dynamo/common/utils/install_media_decoders.py trtllm
      - name: Ensure Python virtual-environment test tooling is available
        shell: bash
        run: |
          if ! python3 -c 'import ensurepip, venv'; then
            apt-get update
            apt-get install -y --no-install-recommends python3-venv
          fi
      - name: Bootstrap isolated frontend and standard pytest dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 lib/sidecar/trtllm/ci/bootstrap_serve.py \
            --artifact trtllm-serve-runtime \
            --results "test-results/${{ matrix.config }}" \
            --venv "$GITHUB_WORKSPACE/.serve-venv" \
            --github-env "$GITHUB_ENV"
      - name: Run standard serve test
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CONFIG: ${{ matrix.config }}
          DYN_TEST_OUTPUT_PATH: ${{ github.workspace }}/test-results/${{ matrix.config }}/serve
        run: |
          set -euo pipefail
          "$DYNAMO_TEST_PYTHON" -m pytest \
            "tests/serve/test_sidecar.py::test_serve_deployment[$CONFIG-4]" \
            -p pytest_asyncio.plugin -p pytest_timeout -p pytest_httpserver.pytest_plugin \
            -m upstream_trtllm \
            --junitxml="test-results/$CONFIG/junit.xml" \
            -o "log_file=test-results/$CONFIG/pytest.log" -ra -s
      - name: Require the selected test to pass without skipping
        if: always()
        shell: bash
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('test-results') / os.environ['CONFIG'] / 'junit.xml'
          cases = list(ET.parse(path).getroot().iter('testcase'))
          if len(cases) != 1 or any(child.tag in {'skipped', 'failure', 'error'} for child in cases[0]):
              raise SystemExit(f'Expected exactly one passed, non-skipped serve case: {path}')
          PY
      - name: Upload runtime identity, pytest logs and standard serve results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: trtllm-nightly-${{ matrix.config }}-results-${{ github.sha }}
          path: |
            test-results/${{ matrix.config }}/
            trtllm-serve-runtime/nightly.json
            trtllm-serve-runtime/build.json
          if-no-files-found: warn
          retention-days: 7
