name: Test contributor cache seeder
on:
  pull_request:
    paths:
      - .github/scripts/*contributor*sccache*
      - .github/workflows/*cache-seeder.yml
      - .github/workflows/seed-contributor-sccache.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install boto3==1.43.116
      - run: python -m unittest discover -s .github/scripts -p test_seed_contributor_sccache.py -v
