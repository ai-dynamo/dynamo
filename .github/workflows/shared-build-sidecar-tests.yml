name: Build sidecar native tests

on:
  workflow_call:
    outputs:
      binary_artifact:
        description: 'Artifact containing the native integration test executable'
        value: ${{ jobs.build-native.outputs.binary_artifact }}

jobs:
  build-native:
    name: Build native integration executable
    runs-on:
      group: Fastchecker
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      binary_artifact: ${{ steps.build.outputs.binary_artifact }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          lfs: true
          persist-credentials: false
      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 -fsSLO https://github.com/protocolbuffers/protobuf/releases/download/v30.2/protoc-30.2-linux-x86_64.zip
          echo '327e9397c6fb3ea2a542513a3221334c6f76f7aa524a7d2561142b67b312a01f  protoc-30.2-linux-x86_64.zip' | sha256sum -c -
          unzip -o protoc-30.2-linux-x86_64.zip -d "${RUNNER_TEMP}/protoc"
          echo "PROTOC=${RUNNER_TEMP}/protoc/bin/protoc" >> "${GITHUB_ENV}"
          echo "PROTOC_INCLUDE=${RUNNER_TEMP}/protoc/include" >> "${GITHUB_ENV}"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build native compatibility executable
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p dynamo-sidecar-testkit --features native-tests --test native_engine --no-run --message-format=json > "${RUNNER_TEMP}/sidecar-native-build.jsonl"
          executable=$(jq -ser '
            [.[] | select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "native_engine" and .executable != null)]
            | if length == 1 then .[0].executable else error("expected one native_engine executable") end
          ' "${RUNNER_TEMP}/sidecar-native-build.jsonl")
          mkdir -p "${RUNNER_TEMP}/sidecar-native"
          strip -o "${RUNNER_TEMP}/sidecar-native/native_engine" "$executable"
          echo "binary_artifact=sidecar-native-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: ${{ steps.build.outputs.binary_artifact }}
          path: ${{ runner.temp }}/sidecar-native/native_engine
          if-no-files-found: error
          retention-days: 7
