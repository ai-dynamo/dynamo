name: Shared GAIE Deploy Test

on:
  workflow_call:
    inputs:
      dd_env:
        description: 'Datadog env tag for test sessions (DD_ENV). Datadog Test Optimization settings (auto test retries, PR comments, etc.) are scoped per (service, env), so use a distinct value (e.g. "nightly", "post-merge") to configure those workflows independently of PR/pre-merge.'
        required: false
        type: string
        default: 'ci'
      namespace:
        description: 'Host namespace where the vCluster lives'
        type: string
        required: true
      vcluster_name:
        description: 'Name of the vCluster'
        type: string
        required: true
      operator_tag:
        description: 'Operator image tag used to self-bootstrap a missing vCluster'
        type: string
        required: true
      frontend_tag:
        description: 'Frontend image tag published to ACR; it runs the EPP, the frontend sidecars and the mocker workers'
        type: string
        required: true
    secrets:
      DD_API_KEY:
        description: 'Datadog API key for Test Optimization. Optional.'
        required: false
      AZURE_ACR_HOSTNAME:
        required: true
      HF_TOKEN:
        required: true
      DOCKERHUB_LOGIN_USER:
        required: false
      DOCKERHUB_ACCESS_TOKEN:
        required: false

jobs:
  deploy-test:
    name: vLLM examples on mockers
    runs-on: prod-deploy-tester-v1
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Check if vCluster exists
        id: vcluster-check
        uses: $/.github/actions/check-vcluster-exists
        with:
          vcluster_name: ${{ inputs.vcluster_name }}
          vcluster_namespace: ${{ inputs.namespace }}
      - name: Self-bootstrap vCluster (rerun)
        if: steps.vcluster-check.outputs.exists != 'true'
        uses: $/.github/actions/setup-dynamo-operator
        with:
          vcluster_name: ${{ inputs.vcluster_name }}
          vcluster_namespace: ${{ inputs.namespace }}
          registry: ${{ secrets.AZURE_ACR_HOSTNAME }}
          repository: ${{ vars.ACR_REPOSITORY }}
          operator_tag: ${{ inputs.operator_tag }}
          hf_token: ${{ secrets.HF_TOKEN }}
          dockerhub_username: ${{ secrets.DOCKERHUB_LOGIN_USER }}
          dockerhub_password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      - name: Connect to vCluster
        id: connect-vcluster
        uses: $/.github/actions/connect-vcluster
        with:
          vcluster_name: ${{ inputs.vcluster_name }}
          vcluster_namespace: ${{ inputs.namespace }}
      - name: Install GAIE prerequisites (Gateway API, agentgateway, Inference Extension CRDs)
        shell: bash
        env:
          KUBECONFIG: ${{ github.workspace }}/.kubeconfig-vcluster
        run: bash deploy/inference-gateway/scripts/install_gaie_crd_agentgateway.sh
      - name: Run GAIE Deploy Test
        id: deploy-test
        uses: $/.github/actions/dynamo-deploy-test
        with:
          dd_api_key: ${{ secrets.DD_API_KEY }}
          dd_env: ${{ inputs.dd_env }}
          kubeconfig_base64: ${{ steps.connect-vcluster.outputs.kubeconfig_base64 }}
          namespace: default
          registry: ${{ secrets.AZURE_ACR_HOSTNAME }}
          operator_tag: ${{ inputs.operator_tag }}
          hf_token: ${{ secrets.HF_TOKEN }}
          test_name: gaie
          frontend_image: ${{ secrets.AZURE_ACR_HOSTNAME }}/${{ vars.ACR_REPOSITORY }}:${{ inputs.frontend_tag }}
          extra_pytest_args: -m framework_with_gaie
