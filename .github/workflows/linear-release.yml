name: Linear Release Sync

on:
  push:
    # Stable release branches/tags only. Prerelease forms (e.g.
    # release/1.3.0-dev.1, v1.3.0-dev.1) are intentionally excluded: the tag
    # filter cannot match them, so syncing the branch would leave a Linear
    # release that the `complete` path never closes.
    branches:
      - 'release/[0-9]+.[0-9]+.[0-9]+'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      command:
        description: 'Linear Release command (sync or complete)'
        required: true
        type: choice
        options:
          - complete
          - sync
      version:
        description: 'Release version (e.g., 1.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # First-time bootstrap: Linear's `complete` targets an *existing* release, so
  # seed it first. Run this workflow manually once with command=sync and the
  # latest shipped version to create the Linear release, then run it again with
  # command=complete to set the baseline. After that, release-branch and tag
  # pushes drive sync/complete automatically.
  linear-release:
    name: Linear Release Sync
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine command and version
        id: params
        # User-controlled workflow_dispatch inputs are passed via env (not
        # inlined as ${{ }}) to avoid shell injection. GITHUB_* are runner-set.
        env:
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_VERSION: ${{ inputs.version }}
          BRANCH_CREATED: ${{ github.event.created }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid version '$INPUT_VERSION'; expected MAJOR.MINOR.PATCH (e.g. 1.0.1)"
              exit 1
            fi
            COMMAND="$INPUT_COMMAND"
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            COMMAND="sync"
            VERSION="${GITHUB_REF_NAME#release/}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            COMMAND="complete"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "::error::Unsupported trigger ref: $GITHUB_REF"
            exit 1
          fi
          # Stage moves run only when the release branch is created, so later
          # cherry-pick pushes never move a release backwards. A minor cut puts
          # that release in QA and main's next release In Development; a patch
          # cut puts the patch In Development. Both releases must already exist.
          QA_VERSION=""
          DEV_VERSION=""
          PLAN_VERSION=""
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$BRANCH_CREATED" == "true" && "$COMMAND" == "sync" ]]; then
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            if [[ "$PATCH" == "0" ]]; then
              QA_VERSION="$VERSION"
              if (( MINOR >= 9 )); then
                DEV_VERSION="$((MAJOR + 1)).0.0"
              else
                DEV_VERSION="${MAJOR}.$((MINOR + 1)).0"
              fi
              IFS=. read -r DEV_MAJOR DEV_MINOR _ <<< "$DEV_VERSION"
              if (( DEV_MINOR >= 9 )); then
                PLAN_VERSION="$((DEV_MAJOR + 1)).0.0"
              else
                PLAN_VERSION="${DEV_MAJOR}.$((DEV_MINOR + 1)).0"
              fi
              PLAN_VERSION="${PLAN_VERSION} ${MAJOR}.${MINOR}.1"
            else
              DEV_VERSION="$VERSION"
            fi
          fi
          {
            echo "command=${COMMAND}"
            echo "version=${VERSION}"
            echo "name=Dynamo v${VERSION}"
            echo "qa_version=${QA_VERSION}"
            echo "dev_version=${DEV_VERSION}"
            echo "plan_version=${PLAN_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Linear Release
        # Pinned to an audited commit SHA (not a mutable @v0 tag) since this step
        # receives LINEAR_ACCESS_KEY. Bump deliberately after reviewing upstream.
        uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384  # v0.17.2
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: ${{ steps.params.outputs.command }}
          version: ${{ steps.params.outputs.version }}
          name: ${{ steps.params.outputs.name }}

      - name: Create missing releases in Planned
        # The stage moves below target a release by version, so the release
        # must exist first, and a missing patch release is created here too. A
        # minor cut also creates the release after next, so PMs can plan a
        # whole cycle ahead, and the cut release's first patch. The IDs are the
        # Dynamo pipeline and its Planned stage in Linear.
        if: steps.params.outputs.dev_version != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PIPELINE_ID: f9c6223b-eb31-4d30-bd20-30359a48f184
          PLANNED_STAGE_ID: 13c52be3-063d-4db1-a69d-b12b48ed565d
          VERSIONS: ${{ steps.params.outputs.dev_version }} ${{ steps.params.outputs.plan_version }}
        run: |
          set -euo pipefail
          linear() {
            curl -sS --fail-with-body https://api.linear.app/graphql \
              -H "Authorization: ${LINEAR_API_KEY}" -H "Content-Type: application/json" -d "$1"
          }
          existing=$(linear "$(jq -n --arg id "$PIPELINE_ID" \
            '{query: "query($id: String!) { releasePipeline(id: $id) { releases(first: 250) { nodes { version } } } }", variables: {id: $id}}')" \
            | jq -r '.data.releasePipeline.releases.nodes[].version')
          for version in $VERSIONS; do
            if grep -qx -e "$version" -e "v$version" <<< "$existing"; then
              echo "Dynamo v${version} exists"
              continue
            fi
            result=$(linear "$(jq -n --arg name "Dynamo v${version}" --arg version "$version" \
              --arg pipeline "$PIPELINE_ID" --arg stage "$PLANNED_STAGE_ID" \
              '{query: "mutation($input: ReleaseCreateInput!) { releaseCreate(input: $input) { success } }", variables: {input: {name: $name, version: $version, pipelineId: $pipeline, stageId: $stage}}}')")
            if [[ "$(jq -r '.data.releaseCreate.success' <<< "$result")" != "true" ]]; then
              echo "::error::Could not create Dynamo v${version}: ${result}"
              exit 1
            fi
            echo "Created Dynamo v${version} in Planned"
          done

      - name: Move the cut release to QA
        if: steps.params.outputs.qa_version != ''
        uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384  # v0.17.2
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: update
          stage: QA
          version: ${{ steps.params.outputs.qa_version }}

      - name: Move the next release to In Development
        if: steps.params.outputs.dev_version != ''
        uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384  # v0.17.2
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: update
          stage: In Development
          version: ${{ steps.params.outputs.dev_version }}
