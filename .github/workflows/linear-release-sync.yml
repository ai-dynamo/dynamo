# Merged commits sync their referenced issues to the corresponding Linear
# release, keeping the Release view a live feature list without a manual step.
#
# Main only for the rollout: the action keeps per-pipeline scan state, so
# release/* branches join once the dry run confirms how that state behaves
# across concurrently active branches (they may need their own pipeline and
# access key per stream).

name: Linear Release Sync (main)

on:
  push:
    branches:
      - main

env:
  # The release currently in development on main. Update at each cycle open,
  # when the prior release branch is cut and main rolls to the next line.
  # The version is bare (no v prefix), matching linear-release.yml, which syncs
  # release/X.Y.Z pushes and completes vX.Y.Z tags with the bare X.Y.Z. The
  # action matches an existing release by this exact string, so a v-prefixed
  # value here creates a second release next to the real one.
  MAIN_RELEASE_VERSION: "1.7.0"

  # First-run scan base. With no base the action scans from the pipeline's
  # latest release, which would sweep in every issue merged since August. This
  # is the commit where the 1.6 branch was cut, so the first run sees exactly
  # the commits that belong to this cycle. Update it at each cycle open.
  RELEASE_SCAN_BASE: "16b2ae50032edbdde70a9e03a7e7056fac3b7c7d"

concurrency:
  group: linear-release-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync issues to the Linear release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout with history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Sync release
        uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384  # v0.17.2
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ env.MAIN_RELEASE_VERSION }}
          name: Dynamo v${{ env.MAIN_RELEASE_VERSION }}
          base_ref: ${{ env.RELEASE_SCAN_BASE }}
          # Live. The Linear "Dynamo v1.7.0" release carries version 1.7.0, so
          # each run updates that release instead of creating one. The action
          # echoes its JSON result, including the tracker release URL, into
          # this public job log (run.sh line 95 at the pinned SHA); that
          # disclosure was accepted when this was turned on.
          dry_run: false
