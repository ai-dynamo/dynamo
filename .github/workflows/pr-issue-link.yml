# Checks that every pull request references an issue: a Linear issue ID in the
# PR title, description, or branch name, or a GitHub issue reference in the
# title or description. Referenced issues are verified to exist. The check is
# advisory today; the failure message carries the date it becomes required.

name: PR Issue Link

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

env:
  # Referenced in the failure message; on this date the check is added to the
  # required status checks in branch protection after the announced notice.
  BLOCKING_DATE: "2026-10-15"

jobs:
  check-issue-link:
    name: Require an issue link
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout base repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          sparse-checkout: .github/workflows
      - name: Check for a linked issue
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REPO: ${{ github.repository }}
        run: python3 .github/workflows/pr_issue_link.py
