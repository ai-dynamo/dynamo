# Checks that every pull request references an issue: a Linear issue ID in the
# PR title, description, or branch name, or a GitHub issue reference in the
# title or description. Referenced issues are verified to exist. The check is
# advisory today; the failure message carries the date it becomes required.

name: PR Issue Link

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    # Only pull requests that target the trunk. A branch cut for a release
    # takes cherry-picks, and a cherry-pick cites the pull request it picks
    # rather than an issue, which this check does not accept and should not:
    # the issue link belongs on the original change, which was already
    # checked on its way into the trunk. Filtering on the base branch here
    # means the workflow never starts for those, so there is no check to
    # explain away and none to mark required by accident.
    branches: [main]
  # The unit tests below exercise the pull request's own copy of the check, so
  # they run on `pull_request` and never on `pull_request_target`: a fork's
  # test file must not execute against the base repository's token.
  pull_request:
    paths:
      - ".github/workflows/pr-issue-link.yml"
      - ".github/workflows/pr_issue_link.py"
      - ".github/workflows/test_pr_issue_link.py"

env:
  # Referenced in the failure message; on this date the check is added to the
  # required status checks in branch protection after the announced notice.
  # Two weeks of advisory failures is the whole runway, so the announcement
  # has to reach contributors rather than rely on them meeting the check by
  # accident.
  #
  # It falls before the v1.6.0 code freeze on 2026-10-07, so the check first
  # governs the freeze week on the trunk. Only the trunk: the base-branch
  # filter above keeps it away from the pull requests a frozen branch takes.
  #
  # The pull request template and the script default name this date too, so
  # that a contributor reads it before the check fails rather than after. Bump
  # all three together; the unit tests below fail when they disagree.
  BLOCKING_DATE: "2026-10-01"

jobs:
  check-issue-link:
    name: Require an issue link
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request_target' && !github.event.pull_request.draft }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout base repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          sparse-checkout: .github/workflows
      - name: Check for a linked issue
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REPO: ${{ github.repository }}
        run: python3 .github/workflows/pr_issue_link.py

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # The whole directory, not just workflows: one test reads the pull
          # request template, which carries the second copy of the date.
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest
      # The check treats an unverifiable reference as an outage and passes, so
      # what becomes a candidate and when the check may fail open are the two
      # properties worth pinning. The ini overrides and --confcutdir keep this
      # independent of the root test configuration, which the sparse checkout
      # above cannot satisfy anyway: it brings down the root conftest.py
      # without the tests/ package that conftest imports.
      - name: Unit tests (issue-link check)
        run: |
          python -m pytest .github/workflows/test_pr_issue_link.py -v \
            -p no:cacheprovider \
            --confcutdir=.github/workflows \
            --override-ini="addopts=" \
            --override-ini="filterwarnings="
