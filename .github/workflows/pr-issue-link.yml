# Checks that every pull request references an issue: a Linear issue ID in the
# PR title, description, or branch name, or a GitHub issue reference in the
# title or description. Referenced issues are verified to exist. The check
# fails only once the next minor release branch is cut; before that it passes
# with a warning and the same remediation.

name: PR Issue Link

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    # Only pull requests that target `main`. A branch cut for a release
    # takes cherry-picks, and a cherry-pick cites the original pull request
    # rather than an issue, which this check does not accept and should not:
    # the issue link belongs on that original change, which was already
    # checked on its way into `main`. Filtering on the base branch here
    # means the workflow never starts for those, so there is no check to
    # explain away and none to mark required by accident.
    branches: [main]
  # The unit tests below exercise the pull request's own copy of the check, so
  # they run on `pull_request` and never on `pull_request_target`: a fork's
  # test file must not execute against the base repository's token.
  pull_request:
    paths:
      - ".github/workflows/pr-issue-link.yml"
      - ".github/workflows/pr_issue_link.py"
      - ".github/workflows/test_pr_issue_link.py"
  # A result recorded before the cut stays on its commit after the cut, and
  # creating a branch fires no pull request event. The cut re-runs those
  # results so that a pull request without a link cannot merge on a green
  # check from before the switch.
  create:

env:
  # The check fails pull requests without a link once this branch exists, and
  # passes them with a warning before it does. Make it a required status check
  # before the cut, so it switches on at the cut with no further settings
  # change. Once `release/1.7.0` exists, `main` carries 1.8 work, so the check
  # first governs what lands for 1.8. The script matches the full branch name,
  # so model-launch branches like `release/1.6.0-<model>-dev.1` do not trip it.
  #
  # A branch, once cut, stays, so the check stays on without maintenance. Do
  # not bump this for later minors: naming a branch not yet cut switches the
  # check back off until that cut.
  #
  # The pull request template and the script default name this branch too, so
  # that a contributor reads it before the check fails rather than after. If
  # the switch-on release moves, change all three together, plus the literal in
  # the `recheck-at-cut` job condition; the unit tests below fail when they
  # disagree.
  BLOCKING_BRANCH: "release/1.7.0"

jobs:
  check-issue-link:
    name: Require an issue link
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request_target' && !github.event.pull_request.draft }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout base repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          sparse-checkout: .github/workflows
      - name: Check for a linked issue
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REPO: ${{ github.repository }}
        run: python3 .github/workflows/pr_issue_link.py

  recheck-at-cut:
    name: Re-check open pull requests at the cut
    runs-on: ubuntu-latest
    # Job conditions cannot read `env`, so the branch is a literal here. Other
    # branches are created often; matching at the job level keeps them from
    # starting a runner.
    if: ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'release/1.7.0' }}
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run green issue-link results on open pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        # A re-run reads the branch state live: a linked pull request passes
        # again and one without a link now fails.
        run: |
          gh pr list --repo "$REPO" --base main --state open --limit 1000 \
            --json headRefOid,isDraft \
            --jq '.[] | select(.isDraft | not) | .headRefOid' |
          while read -r sha; do
            run=$(gh api "repos/$REPO/actions/workflows/pr-issue-link.yml/runs?head_sha=$sha&event=pull_request_target&per_page=1" \
              --jq '.workflow_runs[0] | select(.conclusion == "success") | .id')
            if [ -n "$run" ]; then
              gh run rerun "$run" --repo "$REPO" || echo "::warning::Could not re-run $run for $sha"
            fi
          done

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # The whole directory, not just workflows: one test reads the pull
          # request template, which carries the second copy of the date.
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest
      # The check treats an unverifiable reference as an outage and passes, so
      # what becomes a candidate and when the check may fail open are the two
      # properties worth pinning. The ini overrides and --confcutdir keep this
      # independent of the root test configuration, which the sparse checkout
      # above cannot satisfy anyway: it brings down the root conftest.py
      # without the tests/ package that conftest imports.
      - name: Unit tests (issue-link check)
        run: |
          python -m pytest .github/workflows/test_pr_issue_link.py -v \
            -p no:cacheprovider \
            --confcutdir=.github/workflows \
            --override-ini="addopts=" \
            --override-ini="filterwarnings="
