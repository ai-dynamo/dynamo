# Sends failed PR / Pre Merge / Post-Merge / Nightly runs to the Devin CI failure-labels
# automation, at most one batch per 10 minutes. The automation's preflight filters scope and
# dedups by run_id:attempt, so overlapping batches are safe.
name: CI Failure Labels Signal

on:
  workflow_run:
    workflows:
      - 'PR'
      - 'Pre Merge'
      - 'Post-Merge CI Pipeline'
      - 'Nightly CI Pipeline'
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read

jobs:
  send-batch:
    if: >-
      github.repository == 'ai-dynamo/dynamo' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-slim
    timeout-minutes: 20
    # One running batch plus one pending; a newer pending job replaces the older one.
    concurrency:
      group: ci-failure-labels-signal
      cancel-in-progress: false
    steps:
      - name: Wait for the batch window
        if: github.event_name == 'workflow_run'
        run: sleep 600
      - name: Send failed runs
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.CI_FAILURE_LABELS_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.CI_FAILURE_LABELS_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${WEBHOOK_URL}" || -z "${WEBHOOK_SECRET}" ]]; then
            echo "::notice::CI failure-labels webhook secrets are not set; skipping."
            exit 0
          fi
          # Re-runs keep their original created_at, so look back 7 days for failed runs and
          # 24 hours for startup_failure (not a valid status filter); keep the recently updated ones.
          week=$(date -u -d '-7 days' +%Y-%m-%dT%H:%M:%SZ)
          day=$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ)
          updated_since=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)
          for wf in pr.yaml pre-merge.yml post-merge-ci.yml nightly-ci.yml; do
            for q in "status=failure&created=>=${week}" "status=timed_out&created=>=${week}" "status=completed&created=>=${day}"; do
              gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?per_page=100&${q}" \
                --jq '.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure")'
            done
          done | jq -sc --arg since "${updated_since}" \
              '[.[] | select(.updated_at >= $since)
                | {id, run_attempt, name, path, event, head_branch, head_sha, conclusion, updated_at,
                   pull_requests: [(.pull_requests // [])[].number]}]
               | unique_by(.id) | sort_by(.updated_at)' > runs.json
          echo "Sending $(jq length runs.json) failed run(s)"
          # Send in chunks of 50 so a burst of failures is never truncated.
          jq -c --arg repo "${GITHUB_REPOSITORY}" \
              '. as $r | range(0; length; 50) | {kind: "ci-failure-batch", repo: $repo, runs: $r[.:.+50]}' runs.json |
            while read -r batch; do
              curl -fsS --retry 3 --max-time 30 -X POST \
                -H "Content-Type: application/json" \
                -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
                --data "${batch}" "${WEBHOOK_URL}" -o /dev/null
            done
