# Approve CI for a fork PR by posting `/ok to test <head-sha>`.
# Approval applies only to that commit.
#
# This workflow handles fork PRs when they are opened, pushed to, or reopened,
# and when glamr-agent posts a CI request. PRs from branches in this repository
# use the internal-contributor CI workflow instead.
#
# Automatic approval is allowed in these cases:
#
# 1. A maintainer opens or reopens a PR. Here, a maintainer is someone with write,
#    maintain, or admin access to this repository.
# 2. A PR author listed in APPROVED_EXTERNAL_CONTRIBUTORS opens, updates, or
#    reopens a PR.
# 3. A maintainer pushes to a PR branch, for example by merging main into it.
#    Approval covers that head commit. Later pushes need a new approval.
# 4. glamr-agent posts `@dynamo-ops please run full CI for <full-head-sha>` on
#    its own PR. The request may start with a label and colon. The commenter,
#    PR author, and head repository owner must all have GitHub account ID
#    282374502, and the SHA must match the PR's current head. This case does not
#    require signed commits.
#    Set the repository Actions variable GLAMR_CI_REQUESTS_DISABLED=true to
#    disable these requests.
#
# Cases 1-3 require GitHub to verify the signature of every commit in the recorded
# base-to-head comparison. If verification fails, the workflow tells maintainer
# authors which commits failed. Authors on the approved list receive instructions
# for signing or getting manual approval. Other contributors receive no comment.
# Failed permission lookups cannot grant maintainer approval. An invalid approved
# contributor list cannot grant approval through that list.
#
# A maintainer can also approve CI manually with `/ok to test <head-sha>`.
# To let a maintainer push to a user-owned fork, the contributor must enable
# "Allow edits from maintainers" on the PR.
#
# Before posting approval, the workflow checks that the PR is still open and its
# base and head have not changed. A push can arrive after this check, so the CI
# trigger must also check the command's SHA when approval is required.

name: Trigger CI Approval Flow

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  ok-to-test:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       vars.GLAMR_CI_REQUESTS_DISABLED != 'true' &&
       github.event.comment.user.id == 282374502 &&
       contains(github.event.comment.body, '@dynamo-ops please run full CI for '))
    runs-on: ubuntu-latest
    environment: external_collaborator
    concurrency:
      group: ci-approval-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      UNSIGNED_COMMENT_MARKER: "<!-- dynamo-ext-contributor: unsigned -->"
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Resolve current PR and requested commit
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          GLAMR_USER_ID: "282374502"
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          [[ $(jq -r '.state == "open" and .head.repo.fork == true' <<< "$pr") == true ]] || exit 0
          head=$(jq -r '.head.sha' <<< "$pr")
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            [[ $(jq -r '.user.id' <<< "$pr") == "$GLAMR_USER_ID" ]] || exit 0
            [[ $(jq -r '.head.repo.owner.id' <<< "$pr") == "$GLAMR_USER_ID" ]] || exit 0
            body=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")
            pattern='^([^[:space:]]+:[[:blank:]]+)?@dynamo-ops please run full CI for ([0-9a-f]{40})[[:space:]]*$'
            [[ "$body" =~ $pattern ]] || exit 0
            [[ "${BASH_REMATCH[2]}" == "$head" ]] || exit 0
            echo "glamr_request_approved=true" >> "$GITHUB_OUTPUT"
          else
            [[ $(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH") == "$head" ]] || exit 0
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r '.base.sha' <<< "$pr")" >> "$GITHUB_OUTPUT"
          echo "author=$(jq -r '.user.login' <<< "$pr")" >> "$GITHUB_OUTPUT"
          echo "current=true" >> "$GITHUB_OUTPUT"
      - name: Validate approved contributor
        id: author_check
        if: steps.request.outputs.current == 'true'
        env:
          APPROVED_EXTERNAL_CONTRIBUTORS: ${{ secrets.APPROVED_EXTERNAL_CONTRIBUTORS }}
          PR_AUTHOR: ${{ steps.request.outputs.author }}
        run: |
          if ! echo "$APPROVED_EXTERNAL_CONTRIBUTORS" | jq -e 'if type == "array" then . else error("not an array") end' > /dev/null 2>&1; then
            echo "Warning: APPROVED_EXTERNAL_CONTRIBUTORS is not a valid JSON array." >&2
            echo "is_approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$APPROVED_EXTERNAL_CONTRIBUTORS" | jq -e --arg author "$PR_AUTHOR" 'any(.[]; . == $author)' > /dev/null; then
            echo "Author $PR_AUTHOR is in APPROVED_EXTERNAL_CONTRIBUTORS."
            echo "is_approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "Author $PR_AUTHOR is not in APPROVED_EXTERNAL_CONTRIBUTORS."
            echo "is_approved=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate PR author permission
        id: author_permission_check
        if: steps.request.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_AUTHOR: ${{ steps.request.outputs.author }}
        run: |
          # This checks effective repository permission, not organization membership.
          if ! author_permission=$(gh api \
            "repos/$REPOSITORY/collaborators/$PR_AUTHOR/permission" \
            --jq '.permission' 2>/dev/null); then
            echo "Author $PR_AUTHOR does not have maintainer repository permission."
            echo "is_maintainer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The endpoint returns one legacy base permission. Maintain maps to "write", while
          # admin remains "admin", so both returned values that grant write access are accepted.
          case "$author_permission" in
            admin|write)
              echo "Author $PR_AUTHOR has $author_permission repository permission."
              echo "is_maintainer=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Author $PR_AUTHOR does not have maintainer repository permission."
              echo "is_maintainer=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Validate triggering actor
        id: actor_check
        if: steps.request.outputs.current == 'true' && github.event_name == 'pull_request_target' && github.event.action == 'synchronize' && steps.author_check.outputs.is_approved != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGERING_ACTOR: ${{ github.actor }}
        run: |
          # This checks effective repository permission, not organization membership. GitHub's
          # collaborator-permission endpoint supports the repository-scoped GitHub App installation
          # token provided by github.token and requires only repository Metadata read access.
          if ! actor_permission=$(gh api \
            "repos/$REPOSITORY/collaborators/$TRIGGERING_ACTOR/permission" \
            --jq '.permission'); then
            echo "Warning: Could not determine repository permission for $TRIGGERING_ACTOR." >&2
            echo "is_approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The endpoint returns one legacy base permission. Maintain maps to "write", while
          # admin remains "admin", so both returned values that grant write access are accepted.
          case "$actor_permission" in
            admin|write)
              echo "Actor $TRIGGERING_ACTOR has $actor_permission repository permission."
              echo "is_approved=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Actor $TRIGGERING_ACTOR does not have write repository permission."
              echo "is_approved=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Determine CI approval
        id: approval_check
        if: steps.request.outputs.current == 'true'
        env:
          GLAMR_REQUEST_APPROVED: ${{ steps.request.outputs.glamr_request_approved }}
          AUTHOR_APPROVED: ${{ steps.author_check.outputs.is_approved }}
          AUTHOR_MAINTAINER: ${{ steps.author_permission_check.outputs.is_maintainer }}
          ACTOR_APPROVED: ${{ steps.actor_check.outputs.is_approved }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          if [[ "$GLAMR_REQUEST_APPROVED" == "true" || "$AUTHOR_APPROVED" == "true" ]]; then
            echo "is_approved=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_ACTION" == "synchronize" && "$ACTOR_APPROVED" == "true" ]]; then
            echo "is_approved=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_ACTION" != "synchronize" && "$AUTHOR_MAINTAINER" == "true" ]]; then
            echo "is_approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_approved=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify commit signatures
        id: signature_check
        if: steps.approval_check.outputs.is_approved == 'true' && steps.request.outputs.glamr_request_approved != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ steps.request.outputs.base }}
          PR_SHA: ${{ steps.request.outputs.head }}
        run: |
          commit_shas=$(gh api --paginate \
            "repos/$REPO_OWNER/$REPO_NAME/compare/$PR_BASE...$PR_SHA?per_page=100" \
            --jq '.commits[].sha')

          if [[ -z "$commit_shas" ]]; then
            echo "Warning: No commits found in PR." >&2
            echo "all_signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          all_signed=true
          unsigned_commits='[]'

          while IFS= read -r sha; do
            verification=$(gh api "repos/$REPO_OWNER/$REPO_NAME/commits/$sha" \
              --jq '.commit.verification | {verified, reason}')
            verified=$(echo "$verification" | jq -r '.verified')
            reason=$(echo "$verification" | jq -r '.reason // "not signed"')

            if [[ "$verified" != "true" ]]; then
              all_signed=false
              echo "Warning: Commit ${sha:0:7} is not properly signed: $reason" >&2
              unsigned_commits=$(jq -cn \
                --argjson arr "$unsigned_commits" \
                --arg sha "${sha:0:7}" \
                --arg reason "$reason" \
                '$arr + [{"sha": $sha, "reason": $reason}]')
            else
              echo "Commit $sha is verified with signature."
            fi
          done <<< "$commit_shas"

          if [[ "$all_signed" == "true" ]]; then
            echo "All commits are properly signed and verified."
            echo "all_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Warning: One or more commits are not properly signed." >&2
            echo "all_signed=false" >> "$GITHUB_OUTPUT"
            echo "unsigned_commits=$unsigned_commits" >> "$GITHUB_OUTPUT"
          fi
      - name: Clean up previous unsigned-commits comments
        if: steps.approval_check.outputs.is_approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_VERIFIER_CI_TOKEN }}
        run: |
          bot_login=$(gh api user --jq '.login')
          gh api "repos/$REPO_OWNER/$REPO_NAME/issues/$PR_NUMBER/comments" \
          | jq -r --arg login "$bot_login" --arg marker "$UNSIGNED_COMMENT_MARKER" \
            '.[] | select(.user.login == $login and (.body | contains($marker))) | .id' \
          | while read -r comment_id; do
              echo "Deleting stale unsigned-commits comment $comment_id"
              gh api --method DELETE "repos/$REPO_OWNER/$REPO_NAME/issues/comments/$comment_id"
            done
      - name: Comment unsigned commits
        if: steps.approval_check.outputs.is_approved == 'true' && steps.author_permission_check.outputs.is_maintainer == 'true' && steps.signature_check.outputs.all_signed == 'false'
        env:
          GH_TOKEN: ${{ secrets.AUTO_VERIFIER_CI_TOKEN }}
          UNSIGNED_COMMITS: ${{ steps.signature_check.outputs.unsigned_commits }}
        run: |
          table=$(echo "$UNSIGNED_COMMITS" | jq -r '.[] | "| `\(.sha)` | \(.reason) |"')
          body="$UNSIGNED_COMMENT_MARKER
          ## Unsigned Commits Detected

          The following commits are not GPG-signed and must be signed before CI can run:

          | Commit | Reason |
          |--------|--------|
          ${table}

          Please sign your commits and push again. See the [GitHub docs on commit signature verification](https://docs.github.com/en/authentication/managing-commit-signature-verification/signing-commits) for help."

          gh pr comment "$PR_NUMBER" \
            --repo "$REPO_OWNER/$REPO_NAME" \
            --body "$body"
      - name: Comment unsigned commits for approved external contributor
        if: steps.author_check.outputs.is_approved == 'true' && steps.author_permission_check.outputs.is_maintainer != 'true' && steps.signature_check.outputs.all_signed == 'false'
        env:
          GH_TOKEN: ${{ secrets.AUTO_VERIFIER_CI_TOKEN }}
          PR_SHA: ${{ steps.request.outputs.head }}
          UNSIGNED_COMMITS: ${{ steps.signature_check.outputs.unsigned_commits }}
        run: |
          table=$(echo "$UNSIGNED_COMMITS" | jq -r '.[] | "| `\(.sha)` | \(.reason) |"')
          body="$UNSIGNED_COMMENT_MARKER
          ## Automatic CI Approval Skipped

          Automatic approval requires every commit to have a signature that GitHub reports as verified. The following commits do not meet that requirement:

          | Commit | Reason |
          |--------|--------|
          ${table}

          To use automatic approval, sign the listed commits and push again. Alternatively, a maintainer can review this head and comment \`/ok to test $PR_SHA\`; you do not need to rewrite the commits for that manual approval path."

          gh pr comment "$PR_NUMBER" \
            --repo "$REPO_OWNER/$REPO_NAME" \
            --body "$body"
      - name: Comment /ok to test
        if: steps.approval_check.outputs.is_approved == 'true' && (steps.request.outputs.glamr_request_approved == 'true' || steps.signature_check.outputs.all_signed == 'true')
        env:
          GH_TOKEN: ${{ secrets.AUTO_VERIFIER_CI_TOKEN }}
          PR_BASE: ${{ steps.request.outputs.base }}
          PR_SHA: ${{ steps.request.outputs.head }}
        run: |
          if [[ -z "$PR_SHA" ]]; then
            echo "Could not determine PR head SHA; aborting /ok to test comment." >&2
            exit 1
          fi

          bot_login=$(gh api user --jq '.login')
          comments=$(gh api --paginate --slurp "repos/$REPO_OWNER/$REPO_NAME/issues/$PR_NUMBER/comments?per_page=100")
          if jq -e --arg login "$bot_login" --arg body "/ok to test $PR_SHA" \
            'any(.[][]; .user.login == $login and .body == $body)' <<< "$comments" > /dev/null; then
            echo "CI approval already posted for $PR_SHA."
            exit 0
          fi
          pr=$(gh api "repos/$REPO_OWNER/$REPO_NAME/pulls/$PR_NUMBER")
          jq -e --arg sha "$PR_SHA" --arg base "$PR_BASE" \
            '.state == "open" and .head.sha == $sha and .base.sha == $base' <<< "$pr" > /dev/null || exit 0

          gh pr comment "$PR_NUMBER" \
            --repo "$REPO_OWNER/$REPO_NAME" \
            --body "/ok to test $PR_SHA"
