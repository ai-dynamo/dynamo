name: Active-active CPU POC

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Active-active or controlled regional failover test
        required: true
        type: choice
        default: active-active
        options:
          - active-active
          - west-disabled

permissions:
  contents: read

concurrency:
  group: active-active-cpu-poc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  burst:
    name: ${{ inputs.scenario }} shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # Deliberately omit the runner group. Both regional scale sets expose this
    # name, allowing GitHub's assignment race to choose the region.
    runs-on: poc-active-active-cpu-v1
    timeout-minutes: 15
    container:
      image: ubuntu:24.04
      env:
        HOME: /tmp
        USER: runner
    steps:
      - name: Report assignment
        shell: bash
        run: |
          set -euo pipefail
          printf 'scenario=%s\n' '${{ inputs.scenario }}'
          printf 'shard=%s\n' '${{ matrix.shard }}'
          printf 'requested_scale_set=%s\n' 'poc-active-active-cpu-v1'
          printf 'runner_name=%s\n' "${RUNNER_NAME}"
          printf 'runner_os=%s\n' "${RUNNER_OS}"
          printf 'runner_arch=%s\n' "${RUNNER_ARCH}"
          printf 'poc_aws_region=%s\n' "${POC_AWS_REGION:-missing}"
          printf 'cpu_count=%s\n' "$(getconf _NPROCESSORS_ONLN)"
          uname -a
          sed -n '1,8p' /etc/os-release
          sed -n '1,3p' /proc/meminfo
          case "${POC_AWS_REGION:-missing}" in
            us-east-1|us-west-2) ;;
            *) printf 'unexpected POC_AWS_REGION\n' >&2; exit 1 ;;
          esac
          head -c 33554432 /dev/zero | sha256sum
