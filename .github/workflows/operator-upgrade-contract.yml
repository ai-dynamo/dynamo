name: Operator upgrade contract

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      operator: ${{ steps.filter.outputs.operator }}
      base: ${{ steps.filter.outputs.base }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          base = os.environ['BASE_SHA']
          paths = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines() if base else []
          def affects_operator(path):
              return (
                  (path.startswith('deploy/operator/') and not path.endswith(('.md', '.log')))
                  or path.startswith('deploy/helm/charts/platform/components/operator/')
                  or path == '.github/workflows/operator-upgrade-contract.yml'
              )
          changed = os.environ['EVENT_NAME'] == 'workflow_dispatch' or any(map(affects_operator, paths))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'operator={str(changed).lower()}\nbase={base}\n')
          PY
  replay:
    name: Historical Grove takeover
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DYNAMO_CLUSTERTEST_CONTEXT: kind-operator-upgrade
    steps:
      - name: Set isolated kubeconfig
        run: echo "KUBECONFIG=$RUNNER_TEMP/operator-upgrade.kubeconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00  # v6.0.0
        with:
          go-version-file: deploy/operator/go.mod
          cache-dependency-path: deploy/operator/go.sum
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - name: Verify frozen inputs and version-bump boundary
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: |
          args=()
          if [[ -n "$BASE_SHA" ]]; then args=(--base "$BASE_SHA"); fi
          python3 deploy/operator/hack/generate_upgrade_fixtures.py --check "${args[@]}"
          python3 -m unittest discover -s deploy/operator/hack -p test_upgrade_versions.py
          go test -C deploy/operator ./internal/testing/golden ./internal/testing/clusterenv ./internal/controller -run 'TestUpgradeSafetyIndependentOfGolden|TestReadManifests|TestApply|TestMatch|TestLoadRESTConfig' -count=1
      - name: Create an exclusive CPU test cluster
        run: |
          make -C deploy/operator kind
          deploy/operator/bin/kind create cluster --name operator-upgrade --image kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5 --kubeconfig "$KUBECONFIG"
          make -C deploy/operator install-upgrade-crds
      - name: Verify historical storage and cleanup
        run: go test -C deploy/operator -tags=clustertest ./internal/testing/clusterenv -run '^TestClusterHistoryStorage$' -count=1 -v -timeout=3m
      - name: Replay through candidate admission and controllers
        shell: bash
        run: |
          go test -C deploy/operator -tags='clustertest upgradecontract' ./internal/controller -run '^TestClusterOperatorUpgrade$' -count=1 -json -timeout=15m | tee "$RUNNER_TEMP/operator-upgrade.jsonl"
      - name: Retain concrete golden differences
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: operator-upgrade-${{ github.sha }}
          path: |
            ${{ runner.temp }}/operator-upgrade.jsonl
            deploy/operator/internal/controller/testdata/upgrade/**/*.new
          if-no-files-found: ignore
      - name: Remove the exclusive cluster
        if: always()
        run: |
          if [[ -x deploy/operator/bin/kind ]]; then
            deploy/operator/bin/kind delete cluster --name operator-upgrade
          fi
