name: 'Connect to vCluster'
description: 'Establish a port-forward to a vCluster and output its kubeconfig as base64'

inputs:
  host_kubeconfig_base64:
    description: 'Base64-encoded kubeconfig for host cluster access'
    required: false
    default: ''
  vcluster_name:
    description: 'Name of the vCluster to connect to'
    required: true
  vcluster_namespace:
    description: 'Host namespace where the vCluster is running'
    required: true
outputs:
  kubeconfig_base64:
    description: 'Base64-encoded kubeconfig for the vCluster (points to 127.0.0.1:8443 via port-forward)'
    value: ${{ steps.connect.outputs.kubeconfig_base64 }}

runs:
  using: "composite"
  steps:
    - name: Setup host kubeconfig
      if: inputs.host_kubeconfig_base64 != ''
      shell: bash
      run: |
        echo "${{ inputs.host_kubeconfig_base64 }}" | base64 -d > ${{ github.workspace }}/.kubeconfig-host
        chmod 600 ${{ github.workspace }}/.kubeconfig-host
        echo "KUBECONFIG=${{ github.workspace }}/.kubeconfig-host" >> $GITHUB_ENV

    - name: Install vCluster CLI
      uses: $/.github/actions/install-vcluster-cli

    - name: Connect to vCluster
      id: connect
      shell: bash
      env:
        VCLUSTER_NAME: ${{ inputs.vcluster_name }}
        NAMESPACE: ${{ inputs.vcluster_namespace }}
      run: |
        echo "::group::Port-forward and generate vCluster kubeconfig"
        set -e

        PF_LOG="${{ github.workspace }}/.vcluster-port-forward.log"
        PF_PID_FILE="${{ github.workspace }}/.vcluster-port-forward.pid"
        WATCHDOG_LOG="${{ github.workspace }}/.vcluster-port-forward-watchdog.log"
        WATCHDOG_PID_FILE="${{ github.workspace }}/.vcluster-port-forward-watchdog.pid"
        WATCHDOG_LOCK_FILE="${{ github.workspace }}/.vcluster-port-forward-watchdog.lock"
        WATCHDOG_SCRIPT="${GITHUB_ACTION_PATH}/watchdog.sh"
        KUBECONFIG_PATH="${{ github.workspace }}/.kubeconfig-vcluster"
        KUBECONFIG_TMP="${KUBECONFIG_PATH}.tmp"
        PF_PID=""

        cleanup_port_forward() {
          if [ "$?" -ne 0 ] && [ -n "${PF_PID}" ]; then
            kill "${PF_PID}" 2>/dev/null || true
            wait "${PF_PID}" 2>/dev/null || true
            rm -f "${PF_PID_FILE}"
          fi
        }
        trap cleanup_port_forward EXIT

        start_port_forward() {
          printf '\n[%s] Starting vCluster API port-forward\n' "$(date -u +%FT%TZ)" >> "${PF_LOG}"
          kubectl port-forward -n "${NAMESPACE}" "svc/${VCLUSTER_NAME}" 8443:443 >> "${PF_LOG}" 2>&1 &
          PF_PID=$!
          echo "${PF_PID}" > "${PF_PID_FILE}"
          echo "Started vCluster API port-forward pid ${PF_PID}; log: ${PF_LOG}"
        }

        wait_for_port_forward() {
          local deadline=$((SECONDS + 60))
          local remaining
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            if ! kill -0 "${PF_PID}" 2>/dev/null; then
              echo "::warning::Initial vCluster port-forward exited; restarting within the readiness deadline"
              wait "${PF_PID}" 2>/dev/null || true
              start_port_forward
            fi
            remaining=$((deadline - SECONDS))
            if [ "${remaining}" -le 0 ]; then
              break
            fi
            if curl -fsk --connect-timeout 1 --max-time "$((remaining < 2 ? remaining : 2))" \
              https://127.0.0.1:8443/healthz >/dev/null; then
              echo "vCluster API reachable"
              return 0
            fi
            remaining=$((deadline - SECONDS))
            if [ "${remaining}" -gt 0 ]; then
              sleep "$((remaining < 2 ? remaining : 2))"
            fi
          done
          echo "::error::vCluster API did not become reachable within 60s"
          tail -n 100 "${PF_LOG}" || true
          exit 1
        }

        # In the Self-bootstrap rerun path, setup-dynamo-operator already started a
        # backgrounded `kubectl port-forward` to 127.0.0.1:8443 that survives across
        # steps. Reuse it instead of racing for the same local port (which would
        # fail with "address already in use" and break this step).
        if curl -fsk --connect-timeout 1 --max-time 2 https://127.0.0.1:8443/healthz >/dev/null; then
          echo "Existing port-forward on 127.0.0.1:8443 detected; reusing"
        else
          # kubectl wait exits immediately when the StatefulSet is between pods, so
          # wait for a matching pod to exist before waiting for it to become Ready.
          POD_SELECTOR="app=vcluster,release=${VCLUSTER_NAME}"
          echo "Waiting for vCluster pod (${POD_SELECTOR}) to appear (timeout 300s)..."
          VCLUSTER_PODS=""
          for attempt in $(seq 1 60); do
            VCLUSTER_PODS="$(kubectl get pod -l "${POD_SELECTOR}" -n "${NAMESPACE}" -o name 2>/dev/null || true)"
            if [ -n "${VCLUSTER_PODS}" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "${VCLUSTER_PODS}" ]; then
            echo "::error::No vCluster pod (${POD_SELECTOR}) appeared within 300s"
            kubectl get statefulset "${VCLUSTER_NAME}" -n "${NAMESPACE}" -o wide || true
            kubectl get pods -n "${NAMESPACE}" -o wide || true
            exit 1
          fi

          echo "Waiting for vCluster pod (app=vcluster,release=${VCLUSTER_NAME}) to be Ready (timeout 300s)..."
          kubectl wait --for=condition=ready pod \
            -l "${POD_SELECTOR}" \
            -n "${NAMESPACE}" \
            --timeout=300s

          start_port_forward
          wait_for_port_forward
        fi

        for attempt in $(seq 1 5); do
          if vcluster connect "${VCLUSTER_NAME}" \
            --namespace "${NAMESPACE}" \
            --server=https://127.0.0.1:8443 \
            --print > "${KUBECONFIG_TMP}"; then
            mv "${KUBECONFIG_TMP}" "${KUBECONFIG_PATH}"
            # Keep the tunnel available for failure diagnostics.
            trap - EXIT
            break
          fi

          if [ "${attempt}" = "5" ]; then
            echo "::error::vcluster connect failed after ${attempt} attempts"
            exit 1
          fi

          echo "vcluster connect failed on attempt ${attempt}; retrying..."
          sleep $((attempt * 2))
        done

        echo "Verifying vCluster connectivity..."
        kubectl --kubeconfig="${KUBECONFIG_PATH}" \
          --request-timeout=15s get ns

        nohup env \
          PF_PID_FILE="${PF_PID_FILE}" \
          PF_LOG="${PF_LOG}" \
          WATCHDOG_LOG="${WATCHDOG_LOG}" \
          WATCHDOG_PID_FILE="${WATCHDOG_PID_FILE}" \
          WATCHDOG_LOCK_FILE="${WATCHDOG_LOCK_FILE}" \
          NAMESPACE="${NAMESPACE}" \
          VCLUSTER_NAME="${VCLUSTER_NAME}" \
          "${WATCHDOG_SCRIPT}" run >> "${WATCHDOG_LOG}" 2>&1 &
        WATCHDOG_LAUNCHER_PID=$!

        WATCHDOG_READY=false
        for _ in $(seq 1 50); do
          if env \
            WATCHDOG_PID_FILE="${WATCHDOG_PID_FILE}" \
            WATCHDOG_LOG="${WATCHDOG_LOG}" \
            "${WATCHDOG_SCRIPT}" status-watchdog; then
            WATCHDOG_READY=true
            break
          fi
          if ! kill -0 "${WATCHDOG_LAUNCHER_PID}" 2>/dev/null; then
            wait "${WATCHDOG_LAUNCHER_PID}" 2>/dev/null || true
          fi
          sleep 0.1
        done
        if [ "${WATCHDOG_READY}" != "true" ]; then
          echo "::error::vCluster port-forward watchdog did not acquire its lock"
          tail -n 100 "${WATCHDOG_LOG}" || true
          exit 1
        fi
        echo "vCluster API port-forward watchdog is active; log: ${WATCHDOG_LOG}"

        KUBECONFIG_B64=$(base64 < "${KUBECONFIG_PATH}" | tr -d '\n')
        # Masked before export: the value carries a vCluster client certificate,
        # and every consumer interpolates it into a shell script.
        echo "::add-mask::${KUBECONFIG_B64}"
        echo "kubeconfig_base64=${KUBECONFIG_B64}" >> $GITHUB_OUTPUT
        echo "::endgroup::"
