name: 'Setup Snapshot Agent'
description: 'Install the github.com/ai-dynamo/snapshot Helm chart (agent + operator) in a vCluster namespace'

inputs:
  kubeconfig_base64:
    description: 'Base64-encoded kubeconfig for the vCluster'
    required: true
  namespace:
    description: 'Kubernetes namespace for the snapshot-agent'
    required: false
    default: default
  release_name:
    description: 'Helm release name'
    required: false
    default: snapshot
  chart_version:
    description: 'github.com/ai-dynamo/snapshot chart version to install (pinned, never latest)'
    required: false
    default: 0.0.0-g28a7d5ad
  storage_size:
    description: 'Checkpoint PVC size'
    required: false
    default: 1Gi
  storage_pvc_name:
    description: 'Shared checkpoint PVC mounted by every snapshot-agent pod'
    required: false
    default: snapshot-pvc
  storage_class:
    description: 'RWX-capable storage class for the checkpoint PVC'
    required: false
    default: azurefile-csi
  storage_base_path:
    description: 'Checkpoint PVC mount path inside snapshot-agent pods'
    required: false
    default: /checkpoints

runs:
  using: "composite"
  steps:
    - name: Setup Kubeconfig
      shell: bash
      env:
        KUBECONFIG_B64: ${{ inputs.kubeconfig_base64 }}
      run: |
        set +x
        echo "${KUBECONFIG_B64}" | base64 -d > "${{ github.workspace }}/.kubeconfig-snapshot"
        chmod 600 "${{ github.workspace }}/.kubeconfig-snapshot"
        echo "KUBECONFIG=${{ github.workspace }}/.kubeconfig-snapshot" >> "$GITHUB_ENV"

    # Post-v0.1.0-alpha.1 charts (snapshot PR #61) drop podMount mode: every
    # agent pod mounts the shared checkpoint PVC directly, so the claim must
    # exist before the DaemonSet starts and must support ReadWriteMany.
    - name: Create checkpoint PVC
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        STORAGE_SIZE: ${{ inputs.storage_size }}
        STORAGE_PVC_NAME: ${{ inputs.storage_pvc_name }}
        STORAGE_CLASS: ${{ inputs.storage_class }}
      run: |
        echo "::group::Create checkpoint PVC"
        set -euo pipefail

        # PVC access modes are immutable, and reused vClusters can hold a stale
        # ReadWriteOnce claim under this name from podMount-era runs (the
        # operator's checkpoint.storage used the same name). Recreate it.
        EXISTING_MODES="$(kubectl get pvc "${STORAGE_PVC_NAME}" -n "${NAMESPACE}" \
          -o jsonpath='{.spec.accessModes[*]}' 2>/dev/null || true)"
        if [[ -n "${EXISTING_MODES}" && "${EXISTING_MODES}" != *ReadWriteMany* ]]; then
          echo "Deleting stale PVC ${NAMESPACE}/${STORAGE_PVC_NAME} with accessModes '${EXISTING_MODES}'"
          kubectl delete pvc "${STORAGE_PVC_NAME}" -n "${NAMESPACE}" --wait --timeout=120s
        fi

        kubectl apply --server-side --force-conflicts --field-manager=ci-setup -f - <<EOF
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${STORAGE_PVC_NAME}
          namespace: ${NAMESPACE}
        spec:
          accessModes: [ReadWriteMany]
          storageClassName: ${STORAGE_CLASS}
          resources:
            requests:
              storage: ${STORAGE_SIZE}
        EOF
        echo "::endgroup::"

    - name: Install snapshot-agent
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        RELEASE_NAME: ${{ inputs.release_name }}
        CHART_VERSION: ${{ inputs.chart_version }}
        STORAGE_PVC_NAME: ${{ inputs.storage_pvc_name }}
        STORAGE_BASE_PATH: ${{ inputs.storage_base_path }}
      run: |
        echo "::group::Install snapshot-agent"
        set -euo pipefail

        # Install the externally published github.com/ai-dynamo/snapshot chart
        # at a pinned version, using its own default (pinned-to-chart-appVersion)
        # images. The images are public, so drop the chart's default ngc-secret
        # pull secret, which does not exist in the vCluster.
        # Keep the helm timeout well under the job's timeout-minutes so the
        # debug step still runs when the rollout stalls.
        helm upgrade --install "${RELEASE_NAME}" oci://ghcr.io/ai-dynamo/snapshot/snapshot \
          --version "${CHART_VERSION}" \
          --namespace "${NAMESPACE}" \
          --create-namespace \
          --wait \
          --timeout 8m \
          --set storage.pvc.create=false \
          --set storage.pvc.name="${STORAGE_PVC_NAME}" \
          --set storage.pvc.basePath="${STORAGE_BASE_PATH}" \
          --set-json 'daemonset.imagePullSecrets=[]' \
          --debug

        DAEMONSET_NAME="$(kubectl get daemonset \
          -n "${NAMESPACE}" \
          -l "app.kubernetes.io/name=snapshot,app.kubernetes.io/instance=${RELEASE_NAME}" \
          -o jsonpath='{.items[0].metadata.name}')"
        if [[ -z "${DAEMONSET_NAME}" ]]; then
          echo "::error::snapshot-agent DaemonSet was not created"
          exit 1
        fi

        # Post-#61 agents watch pods cluster-wide; a RESTRICTED_NAMESPACE env
        # var means an old podMount-era chart slipped in.
        RESTRICTED_NAMESPACE_FIELD="$(kubectl get daemonset "${DAEMONSET_NAME}" \
          -n "${NAMESPACE}" \
          -o jsonpath='{.spec.template.spec.containers[?(@.name=="agent")].env[?(@.name=="RESTRICTED_NAMESPACE")].valueFrom.fieldRef.fieldPath}')"
        if [[ -n "${RESTRICTED_NAMESPACE_FIELD}" ]]; then
          echo "::error::snapshot-agent is namespace-restricted; expected a cluster-scoped agent (chart older than snapshot PR #61?)"
          kubectl get daemonset "${DAEMONSET_NAME}" -n "${NAMESPACE}" -o yaml
          exit 1
        fi

        DESIRED_SCHEDULED="$(kubectl get daemonset "${DAEMONSET_NAME}" \
          -n "${NAMESPACE}" \
          -o jsonpath='{.status.desiredNumberScheduled}')"
        if [[ -z "${DESIRED_SCHEDULED}" || "${DESIRED_SCHEDULED}" == "0" ]]; then
          echo "::error::snapshot-agent DaemonSet matches 0 nodes in namespace ${NAMESPACE}"
          kubectl get daemonset "${DAEMONSET_NAME}" -n "${NAMESPACE}" -o wide
          kubectl get nodes -o wide --show-labels
          exit 1
        fi

        kubectl rollout status "daemonset/${DAEMONSET_NAME}" \
          -n "${NAMESPACE}" \
          --timeout=120s
        kubectl get daemonset,pods,pvc \
          -n "${NAMESPACE}" \
          -l app.kubernetes.io/name=snapshot \
          -o wide
        echo "::endgroup::"

    - name: Debug snapshot-agent failure
      if: failure()
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        set +e
        echo "::group::Snapshot-agent status"
        kubectl get daemonset,pods,pvc -n "${NAMESPACE}" -o wide
        echo "::endgroup::"
        echo "::group::Checkpoint PVC describe"
        kubectl describe pvc -n "${NAMESPACE}"
        echo "::endgroup::"
        echo "::group::Snapshot-agent describe"
        kubectl describe daemonset -n "${NAMESPACE}" -l app.kubernetes.io/name=snapshot
        kubectl describe pods -n "${NAMESPACE}" -l app.kubernetes.io/name=snapshot
        echo "::endgroup::"
        echo "::group::Snapshot-agent logs"
        kubectl logs -n "${NAMESPACE}" -l app.kubernetes.io/name=snapshot --all-containers --tail=100
        echo "::endgroup::"
