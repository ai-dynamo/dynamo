name: Configure PyPI
description: Configure pip and uv to use NVIDIA Artifactory when credentials are available

runs:
  using: composite
  steps:
    - name: Configure package index
      shell: bash
      run: |
        set -euo pipefail

        ARTIFACTORY_USER="${ARTIFACTORY_PYPI_USER:-}"
        ARTIFACTORY_IDENTITY_TOKEN="${ARTIFACTORY_PYPI_IDENTITY_TOKEN:-}"

        {
          echo 'PIP_RETRIES=10'
          echo 'UV_HTTP_RETRIES=10'
        } >> "$GITHUB_ENV"

        if [ -z "${ARTIFACTORY_USER}" ] || [ -z "${ARTIFACTORY_IDENTITY_TOKEN}" ]; then
          echo '::notice::Artifactory credentials are unavailable; using public PyPI with retries.'
          exit 0
        fi

        if [[ "${ARTIFACTORY_USER}" == *$'\n'* || "${ARTIFACTORY_IDENTITY_TOKEN}" == *$'\n'* ]]; then
          echo '::error::Artifactory credentials must be single-line values.'
          exit 1
        fi

        NETRC_PATH="${RUNNER_TEMP}/artifactory-pypi-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}.netrc"
        umask 077
        printf 'machine artifactory.nvidia.com\n  login %s\n  password %s\n' \
          "${ARTIFACTORY_USER}" "${ARTIFACTORY_IDENTITY_TOKEN}" > "${NETRC_PATH}"

        PYPI_INDEX_URL='https://artifactory.nvidia.com/artifactory/api/pypi/pypi-remote/simple'
        {
          echo "NETRC=${NETRC_PATH}"
          echo "PIP_INDEX_URL=${PYPI_INDEX_URL}"
          echo "UV_DEFAULT_INDEX=${PYPI_INDEX_URL}"
        } >> "$GITHUB_ENV"
        echo '::notice::Configured NVIDIA Artifactory as the default Python package index.'
