name: 'Teardown Dynamo Operator'
description: 'Delete a vCluster and its dynamic host namespace, preserving shared deploy-test namespaces'

inputs:
  kubeconfig_base64:
    description: 'Base64-encoded kubeconfig for host cluster access'
    required: false
    default: ''
  vcluster_name:
    description: 'Name of the vCluster to delete'
    required: true
  vcluster_namespace:
    description: 'Host namespace where the vCluster is running'
    required: true
runs:
  using: "composite"
  steps:
    - name: Stop vCluster port-forward watchdog
      shell: bash
      run: |
        echo "::group::Stop vCluster port-forward watchdog"
        set -euo pipefail

        WATCHDOG_SCRIPT="${{ github.workspace }}/.github/actions/connect-vcluster/watchdog.sh"
        PF_PID_FILE="${{ github.workspace }}/.vcluster-port-forward.pid"
        PF_LOG="${{ github.workspace }}/.vcluster-port-forward.log"
        WATCHDOG_LOG="${{ github.workspace }}/.vcluster-port-forward-watchdog.log"
        WATCHDOG_PID_FILE="${{ github.workspace }}/.vcluster-port-forward-watchdog.pid"
        WATCHDOG_LOCK_FILE="${{ github.workspace }}/.vcluster-port-forward-watchdog.lock"

        env \
          PF_PID_FILE="${PF_PID_FILE}" \
          PF_LOG="${PF_LOG}" \
          WATCHDOG_LOG="${WATCHDOG_LOG}" \
          WATCHDOG_PID_FILE="${WATCHDOG_PID_FILE}" \
          WATCHDOG_LOCK_FILE="${WATCHDOG_LOCK_FILE}" \
          NAMESPACE="${{ inputs.vcluster_namespace }}" \
          VCLUSTER_NAME="${{ inputs.vcluster_name }}" \
          "${WATCHDOG_SCRIPT}" stop-watchdog

        env \
          PF_PID_FILE="${PF_PID_FILE}" \
          PF_LOG="${PF_LOG}" \
          WATCHDOG_LOG="${WATCHDOG_LOG}" \
          NAMESPACE="${{ inputs.vcluster_namespace }}" \
          VCLUSTER_NAME="${{ inputs.vcluster_name }}" \
          "${WATCHDOG_SCRIPT}" stop-port-forward

        echo "::endgroup::"

    - name: Setup host kubeconfig
      if: inputs.kubeconfig_base64 != ''
      shell: bash
      run: |
        echo "${{ inputs.kubeconfig_base64 }}" | base64 -d > ${{ github.workspace }}/.kubeconfig
        chmod 600 ${{ github.workspace }}/.kubeconfig
        echo "KUBECONFIG=${{ github.workspace }}/.kubeconfig" >> $GITHUB_ENV

    - name: Install vCluster CLI
      uses: $/.github/actions/install-vcluster-cli

    - name: Delete vCluster
      shell: bash
      env:
        VCLUSTER_NAME: ${{ inputs.vcluster_name }}
        NAMESPACE: ${{ inputs.vcluster_namespace }}
      run: |
        echo "::group::Delete vCluster ${VCLUSTER_NAME}"
        set -euo pipefail

        # Cleanup gates the next lifecycle; retry API errors without treating
        # an unsuccessful query as proof that the namespace is absent.
        get_namespace() {
          local attempt output query_status
          for attempt in 1 2 3; do
            if output=$(kubectl get namespace "${NAMESPACE}" --ignore-not-found \
              --request-timeout=30s -o name); then
              printf '%s' "${output}"
              return 0
            else
              query_status=$?
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Namespace query failed after ${attempt} attempts" >&2
              return "${query_status}"
            fi
            echo "::warning::Namespace query failed; retrying in 5s (${attempt}/3)" >&2
            sleep 5
          done
        }

        namespace=$(get_namespace)
        if [ -z "${namespace}" ]; then
          echo "Namespace ${NAMESPACE} does not exist; nothing to delete"
          echo "::endgroup::"
          exit 0
        fi

        # vCluster HostPath Mapper is installed on the host for checkpoint
        # tests. Remove it explicitly before deleting the namespace so GPU-node
        # DaemonSet pods do not linger until namespace garbage collection.
        helm uninstall vcluster-hpm \
          --namespace "${NAMESPACE}" \
          --wait \
          --timeout 5m || true

        kubectl delete daemonset \
          -n "${NAMESPACE}" \
          -l app=vcluster-hostpath-mapper,release=vcluster-hpm \
          --ignore-not-found \
          --wait=true \
          --timeout=300s || true

        if ! vcluster delete "${VCLUSTER_NAME}" --namespace "${NAMESPACE}" 2>&1; then
          echo "::warning::vcluster delete failed; deleting vCluster resources directly"
          kubectl delete statefulset "${VCLUSTER_NAME}" \
            -n "${NAMESPACE}" \
            --ignore-not-found 2>&1 || true
          kubectl delete pvc,secret,svc,configmap \
            -n "${NAMESPACE}" \
            -l "release=${VCLUSTER_NAME}" \
            --ignore-not-found 2>&1 || true
        fi

        kubectl wait "statefulset/${VCLUSTER_NAME}" -n "${NAMESPACE}" \
          --for=delete --timeout=120s 2>/dev/null || true

        if kubectl get statefulset "${VCLUSTER_NAME}" -n "${NAMESPACE}" >/dev/null 2>&1; then
          echo "::error::vCluster ${VCLUSTER_NAME} still exists in ${NAMESPACE} after cleanup"
          kubectl get pods,statefulsets -n "${NAMESPACE}" -l app=vcluster -o wide || true
          exit 1
        fi

        if [ "${NAMESPACE}" = "dynamo-deploy-test" ]; then
          echo "Preserving shared namespace ${NAMESPACE}"
          echo "::endgroup::"
          exit 0
        fi

        if ! kubectl delete namespace "${NAMESPACE}" --wait=true --timeout=300s; then
          echo "::error::Namespace ${NAMESPACE} did not delete cleanly"
          kubectl get daemonset,pods,pvc,svc -n "${NAMESPACE}" -o wide || true
          kubectl get all -n "${NAMESPACE}" -o wide || true
          kubectl describe namespace "${NAMESPACE}" || true
          exit 1
        fi

        namespace=$(get_namespace)
        if [ -n "${namespace}" ]; then
          echo "::error::Namespace ${NAMESPACE} still exists after delete completed"
          kubectl get daemonset,pods,pvc,svc -n "${NAMESPACE}" -o wide || true
          exit 1
        fi

        echo "Namespace ${NAMESPACE} deleted"
        echo "::endgroup::"
