name: Rust test reports
description: Convert completed cargo logs and upload Rust JUnit results to Datadog
inputs:
  api-key:
    description: Datadog API key; uploads are skipped when empty
    required: false
    default: ''
  dd-env:
    description: Datadog environment matching the Python test jobs
    default: ci
  artifact-name:
    description: Unique artifact name for this job and matrix entry
    required: true
  workspace:
    description: Workspace directory identifying the test results
    default: root
  serial-log:
    description: Log stem for a test command with one test thread
    default: ''
runs:
  using: composite
  steps:
    - name: Convert completed Rust test logs
      id: convert
      if: always()
      shell: bash
      env:
        REPORT_WORKSPACE: ${{ inputs.workspace }}
        SERIAL_LOG: ${{ inputs.serial-log }}
      run: |
        args=(--log-dir rust-test-results --workspace "$REPORT_WORKSPACE")
        if [[ -n "$SERIAL_LOG" ]]; then
          args+=(--serial-log "$SERIAL_LOG")
        fi
        python3 "$GITHUB_ACTION_PATH/convert.py" "${args[@]}"
    - name: Archive Rust test reports and console logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: rust-test-results/
        if-no-files-found: ignore
        retention-days: 7
    - name: Explain skipped Datadog upload
      if: ${{ !cancelled() && inputs.api-key == '' }}
      shell: bash
      run: echo '::notice::Datadog Rust upload skipped; no API key is available.'
    - name: Install Datadog CLI
      id: datadog_cli
      if: ${{ !cancelled() && steps.convert.outcome == 'success' && inputs.api-key != '' && hashFiles('rust-test-results/*.xml') != '' }}
      uses: DataDog/install-datadog-ci-github-action@6d7f0c7c5402a4b1912055b76970ca76bef71fe5  # v1.0.4
      with:
        version: v5.27.0
    - name: Upload Rust results to Datadog
      if: ${{ !cancelled() && steps.datadog_cli.outcome == 'success' && inputs.api-key != '' && hashFiles('rust-test-results/*.xml') != '' }}
      shell: bash
      env:
        DATADOG_API_KEY: ${{ inputs.api-key }}
        DATADOG_SITE: datadoghq.com
        DD_ENV: ${{ inputs.dd-env }}
        DD_TAGS: team:dynamo,test.language:rust,test.framework:libtest,rust_report_format:console
      run: |
        # source_ref callers can test a different SHA from github.sha.
        DD_GIT_COMMIT_SHA="$(git rev-parse HEAD)"
        export DD_GIT_COMMIT_SHA
        datadog-ci junit upload --service ai-dynamo rust-test-results/
