name: 'Docker Login'
description: 'Login to multiple container registries (ECR, NGC, ACR)'

inputs:
  ngc_ci_access_token:
    description: 'NGC CI Access Token'
    required: false
  aws_default_region:
    description: 'AWS Default Region'
    required: false
  ecr_registry:
    description: 'ECR registry hostname'
    required: false
  ecr_registry_east:
    description: 'East ECR registry hostname'
    required: false
    default: ''
  azure_acr_hostname:
    description: 'Azure ACR hostname'
    required: false
  azure_acr_user:
    description: 'Azure ACR user'
    required: false
  azure_acr_password:
    description: 'Azure ACR password'
    required: false

runs:
  using: "composite"
  steps:
    - name: ECR Login
      shell: bash
      if: ${{ inputs.aws_default_region != '' && inputs.ecr_registry != '' }}
      run: |
        set -euo pipefail
        aws ecr get-login-password --region ${{ inputs.aws_default_region }} | docker login --username AWS --password-stdin "${{ inputs.ecr_registry }}"
    - name: East ECR Login
      shell: bash
      if: ${{ inputs.ecr_registry_east != '' }}
      env:
        ECR_REGISTRY_EAST: ${{ inputs.ecr_registry_east }}
      run: |
        set -euo pipefail
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "${ECR_REGISTRY_EAST}"
    - name: NGC Login
      if: ${{ inputs.ngc_ci_access_token != '' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "${{ inputs.ngc_ci_access_token }}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
    - name: ACR Login
      shell: bash
      if: ${{ inputs.azure_acr_hostname != '' && inputs.azure_acr_user != '' && inputs.azure_acr_password != '' }}
      run: |
        set -euo pipefail
        echo "${{ inputs.azure_acr_password }}" | docker login "${{ inputs.azure_acr_hostname }}" --username "${{ inputs.azure_acr_user }}" --password-stdin
