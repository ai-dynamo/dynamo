name: 'Changed Files Check'
description: 'Detect changed files using filters.yaml and check for uncovered files'

inputs:
  gh_token:
    description: 'GitHub token for PR API calls'
    required: true

outputs:
  api_docs:
    description: 'Whether generated API documentation inputs changed'
    value: ${{ steps.filter.outputs.api_docs_any_modified }}
  core:
    description: 'Whether core files changed'
    value: ${{ steps.filter.outputs.core_any_modified }}
  dev_images:
    description: 'Whether dev/local-dev image templates changed'
    value: ${{ steps.filter.outputs.dev_images_any_modified }}
  operator:
    description: 'Whether operator files changed'
    value: ${{ steps.filter.outputs.operator_any_modified }}
  snapshot:
    description: 'Whether shared standalone Snapshot integration files changed'
    value: ${{ steps.filter.outputs.snapshot_any_modified }}
  snapshot_vllm:
    description: 'Whether vLLM snapshot lifecycle files changed'
    value: ${{ steps.filter.outputs.snapshot_vllm_any_modified }}
  snapshot_sglang:
    description: 'Whether SGLang snapshot lifecycle files changed'
    value: ${{ steps.filter.outputs.snapshot_sglang_any_modified }}
  snapshot_trtllm:
    description: 'Whether TRT-LLM snapshot lifecycle files changed'
    value: ${{ steps.filter.outputs.snapshot_trtllm_any_modified }}
  power_agent:
    description: 'Whether power-agent files changed'
    value: ${{ steps.filter.outputs.power_agent_any_modified }}
  deploy:
    description: 'Whether deploy files changed'
    value: ${{ steps.filter.outputs.deploy_any_modified }}
  dgdr:
    description: 'Whether DGDR deploy-test files changed'
    value: ${{ steps.filter.outputs.dgdr_any_modified }}
  vllm:
    description: 'Whether vllm files changed'
    value: ${{ steps.filter.outputs.vllm_any_modified }}
  sglang:
    description: 'Whether sglang files changed'
    value: ${{ steps.filter.outputs.sglang_any_modified }}
  trtllm:
    description: 'Whether trtllm files changed'
    value: ${{ steps.filter.outputs.trtllm_any_modified }}
  triton:
    description: 'Whether triton files changed'
    value: ${{ steps.filter.outputs.triton_any_modified }}
  sample:
    description: 'Whether sample-backend files changed'
    value: ${{ steps.filter.outputs.sample_any_modified }}
  planner_gym:
    description: 'Whether Planner Gym sources or its CPU test workflow changed'
    value: ${{ steps.filter.outputs.planner_gym_any_modified }}
  planner:
    description: 'Whether planner files changed'
    value: ${{ steps.filter.outputs.planner_any_modified }}
  sidecar:
    description: 'Whether sidecar files changed'
    value: ${{ steps.filter.outputs.sidecar_any_modified }}
  frontend:
    description: 'Whether frontend files changed'
    value: ${{ steps.filter.outputs.frontend_any_modified }}
  benchmarks:
    description: 'Whether benchmarks files changed'
    value: ${{ steps.filter.outputs.benchmarks_any_modified }}
  efa:
    description: 'Whether AWS EFA Dockerfile changed'
    value: ${{ steps.filter.outputs.efa_any_modified }}
  rust:
    description: 'Whether rust files changed'
    value: ${{ steps.filter.outputs.rust_any_modified }}
  docs:
    description: 'Whether docs files changed'
    value: ${{ steps.filter.outputs.docs_any_modified }}
  examples:
    description: 'Whether examples, recipes, or recipe validation helpers changed'
    value: ${{ steps.filter.outputs.examples_any_modified }}
  fern_components:
    description: 'Whether Fern component sources changed'
    value: ${{ steps.filter.outputs.fern_components_any_modified }}
  base_ref:
    description: 'PR target branch (baseRefName) for push-to-pull-request/N events; empty otherwise. Used for OSRB compliance-diff baseline selection.'
    value: ${{ steps.merge-base.outputs.base_ref }}
  merge_base_sha:
    description: 'True PR merge-base SHA for push-to-pull-request/N events; empty otherwise. Used as the stable OSRB diff baseline starting point.'
    value: ${{ steps.merge-base.outputs.base_sha }}

runs:
  using: "composite"
  steps:
    - name: Create changed-file output directory
      id: output-dir
      shell: bash
      run: |
        output_dir=$(mktemp -d "$RUNNER_TEMP/dynamo-changed-files.XXXXXX")
        printf 'path=%s\n' "$output_dir" >> "$GITHUB_OUTPUT"

    # Skipped for pull_request events — tj-actions uses the REST API instead.
    - name: Get merge base for push events
      id: merge-base
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REF_NAME: ${{ github.ref_name }}
        REPOSITORY: ${{ github.repository }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        # How changed-file detection works (callers use fetch-depth: 1):
        #
        #   pull_request events:
        #     tj-actions/changed-files calls the GitHub REST API (GET /pulls/{n}/files)
        #     to list changed files. No git history needed — works with shallow clones.
        #
        #   push to pull-request/N branches:
        #     The GitHub Compare API returns the true merge-base SHA. We fetch that
        #     single commit so tj-actions can run `git diff merge-base HEAD` locally.
        #
        #   push to main / release branches:
        #     base_sha is empty, skip_initial_fetch is false — tj-actions falls back
        #     to its default behaviour (deepens history and diffs against the previous
        #     commit). Callers short-circuit outputs to true for main/release anyway.
        if [[ "$REF_NAME" =~ ^pull-request/([0-9]+)$ ]]; then
          BASE=$(gh pr view "${BASH_REMATCH[1]}" --json baseRefName -q '.baseRefName')
          # Compare API returns the true merge-base (fork point), not the branch tip.
          BASE_SHA=$(gh api "repos/${REPOSITORY}/compare/${BASE}...${HEAD_SHA}" \
            --jq '.merge_base_commit.sha')
          echo "Merge base: $BASE_SHA"
          # Fetch the merge-base commit so tj-actions can `git diff` against it.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          # Expose the PR's target branch for the OSRB compliance-diff baseline
          # selection (main vs release/*). See resolve_diff_base.py.
          echo "base_ref=$BASE" >> "$GITHUB_OUTPUT"
        else
          echo "base_sha=" >> "$GITHUB_OUTPUT"
          echo "base_ref=" >> "$GITHUB_OUTPUT"
        fi

    - name: Check for changes
      uses: tj-actions/changed-files@aa08304bd477b800d468db44fe10f6c61f7f7b11  # v42.1.0
      id: filter
      with:
        files_yaml_from_source_file: .github/filters.yaml
        token: ${{ inputs.gh_token }}
        # v42 writes JSON files after removing one escape_json quote layer.
        # Keep filenames intact and consume those files as data, never shell code.
        json: 'true'
        escape_json: 'true'
        safe_output: 'false'
        write_output_files: 'true'
        output_dir: ${{ steps.output-dir.outputs.path }}
        # pull_request: calls GET /pulls/{n}/files — accurate, no git history needed.
        use_rest_api: ${{ github.event_name == 'pull_request' }}
        # push to pull-request/N: merge-base SHA from Compare API (set above).
        # push to main/release: empty — tj-actions uses default (previous commit).
        base_sha: ${{ steps.merge-base.outputs.base_sha || '' }}
        # When we provide base_sha we've already fetched everything needed.
        # When base_sha is empty, let tj-actions fetch history itself.
        skip_initial_fetch: ${{ steps.merge-base.outputs.base_sha != '' }}

    - name: Report changes and check filter coverage
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CHANGED_FILES_DIR: ${{ steps.output-dir.outputs.path }}
        BASE_SHA: ${{ steps.merge-base.outputs.base_sha }}
      run: python3 "$ACTION_PATH/report.py"
