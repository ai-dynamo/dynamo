# CPU-only endpoint for validating the benchmark transport and campaign runner.
# It is not a performance target and its results must not be compared with GPU runs.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: agent-well-lit-benchmark-mocker
  namespace: anish-agent-well-lit-path
  labels:
    app.kubernetes.io/name: agent-well-lit-benchmark-mocker
    app.kubernetes.io/part-of: agent-well-lit-path
    dynamo.nvidia.com/branch: agent-well-lit-shared
    dynamo.nvidia.com/owner: anish-maddipoti
    dynamo.nvidia.com/qualification: transport-only
spec:
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/name: agent-well-lit-benchmark-mocker-frontend
            app.kubernetes.io/part-of: agent-well-lit-path
            dynamo.nvidia.com/owner: anish-maddipoti
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime@sha256:effd250754b8a70517c27eab8f18463b395a7b2a8e868fd919226c3180636939
              command: ["python3", "-m", "dynamo.frontend"]
              args: ["--router-mode", "round-robin", "--http-port", "8000"]
              workingDir: /workspace
              resources:
                requests:
                  cpu: "1"
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
    - name: MockerWorker
      type: worker
      replicas: 1
      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/name: agent-well-lit-benchmark-mocker-worker
            app.kubernetes.io/part-of: agent-well-lit-path
            dynamo.nvidia.com/owner: anish-maddipoti
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime@sha256:effd250754b8a70517c27eab8f18463b395a7b2a8e868fd919226c3180636939
              command: ["python3", "-m", "dynamo.mocker"]
              args:
                - --model-path
                - Qwen/Qwen3-0.6B
                - --model-name
                - Qwen/Qwen3-0.6B
                - --num-workers
                - "2"
                - --speedup-ratio
                - "0"
                - --block-size
                - "16"
                - --num-gpu-blocks-override
                - "4096"
              env:
                - name: HF_HOME
                  value: /opt/models
              workingDir: /workspace
              resources:
                requests:
                  cpu: "1"
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - name: model-cache
                  mountPath: /opt/models
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: agent-well-lit-model-cache
