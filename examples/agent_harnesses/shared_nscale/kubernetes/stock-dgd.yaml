apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: agent-well-lit-stock
  namespace: anish-agent-well-lit-path
  labels:
    app.kubernetes.io/name: agent-well-lit-stock
    app.kubernetes.io/part-of: agent-well-lit-path
    dynamo.nvidia.com/branch: agent-well-lit-shared
    dynamo.nvidia.com/owner: anish-maddipoti
    dynamo.nvidia.com/router: stock
spec:
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/part-of: agent-well-lit-path
            dynamo.nvidia.com/owner: anish-maddipoti
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime@sha256:effd250754b8a70517c27eab8f18463b395a7b2a8e868fd919226c3180636939
              command: ["python3", "-m", "dynamo.frontend"]
              args: ["--router-mode", "round-robin", "--http-port", "8000"]
              workingDir: /workspace
              resources:
                requests:
                  cpu: "1"
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
    - name: VllmDecodeWorker
      type: worker
      replicas: 1
      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/part-of: agent-well-lit-path
            dynamo.nvidia.com/owner: anish-maddipoti
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime@sha256:effd250754b8a70517c27eab8f18463b395a7b2a8e868fd919226c3180636939
              command: ["python3", "-m", "dynamo.vllm"]
              args:
                - --model
                - Qwen/Qwen3-0.6B
                - --served-model-name
                - Qwen/Qwen3-0.6B
                - --revision
                - c1899de289a04d12100db370d81485cdf75e47ca
                - --gpu-memory-utilization
                - "0.70"
                - --max-model-len
                - "32768"
                - --dyn-tool-call-parser
                - hermes
                - --dyn-reasoning-parser
                - qwen3
                - --no-enable-log-requests
              env:
                - name: HF_HOME
                  value: /opt/models
              workingDir: /workspace/examples/backends/vllm
              resources:
                claims:
                  - name: gpu
                requests:
                  cpu: "2"
                  memory: 8Gi
                limits:
                  cpu: "4"
                  memory: 16Gi
              volumeMounts:
                - name: model-cache
                  mountPath: /opt/models
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: agent-well-lit-nvidia-1-gpu
          tolerations:
            - key: dra
              operator: Equal
              value: "true"
              effect: NoSchedule
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: agent-well-lit-model-cache
