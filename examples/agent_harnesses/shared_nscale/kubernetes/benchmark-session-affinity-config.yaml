apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-well-lit-benchmark-router
  namespace: anish-agent-well-lit-path
  labels:
    app.kubernetes.io/part-of: agent-well-lit-path
    dynamo.nvidia.com/owner: anish-maddipoti
    dynamo.nvidia.com/router: stock-kv-session-affinity
data:
  DYN_ROUTER_MODE: kv
  DYN_ROUTER_MIN_INITIAL_WORKERS: "2"
  DYN_ROUTER_SESSION_AFFINITY_TTL_SECS: "300"
  DYN_ROUTER_USE_KV_EVENTS: "true"
