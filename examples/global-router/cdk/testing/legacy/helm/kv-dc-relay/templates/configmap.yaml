{{- $config := dict
  "dc_id" .Values.relay.dcId
  "runtime_namespace" .Values.relay.runtimeNamespace
  "watch_namespaces" .Values.relay.watchNamespaces
  "wan_listen" .Values.relay.wanListen
  "stats_listen" .Values.relay.statsListen
  "stats_allow_non_loopback" .Values.relay.statsAllowNonLoopback
}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.relay.dgdName }}-relay-config
  labels:
    app.kubernetes.io/name: kv-dc-relay
    dynamo.nvidia.com/dgd: {{ .Values.relay.dgdName | quote }}
data:
  config.json: {{ $config | toJson | quote }}
