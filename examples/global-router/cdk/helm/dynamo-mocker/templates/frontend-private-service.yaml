apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-private" .Values.deployment.name | quote }}
  labels:
    app.kubernetes.io/name: dynamo-mocker-private-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
{{ toYaml .Values.frontendEndpoint.sourceCidrs | indent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
  selector:
    app.kubernetes.io/name: dynamo-mocker-frontend
    dynamo.nvidia.com/dgd: {{ .Values.deployment.name | quote }}
