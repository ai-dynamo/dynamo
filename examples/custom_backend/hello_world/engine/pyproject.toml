[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hello-dynamo-engine"
version = "0.1.0"
description = "Hello-world Dynamo unified backend: hardcoded token stream + synthetic KV events, no GPU"
requires-python = ">=3.11"
dependencies = [
    "ai-dynamo>=1.3.0",
    "tokenizers>=0.20",
]

[project.scripts]
hello-engine = "hello_engine.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_engine"]
