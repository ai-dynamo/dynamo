#
# Disaggregated + Planner deployment for Intel XPU.
# Requires 3 GPU devices: 1 prefill replica and 2 decode replicas.
# Increasing the replica count requires additional GPU capacity.

apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-template
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.intel.com
            count: 1
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-disagg-planner-xpu-dra
spec:
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - image: my-registry/sglang-runtime-xpu:my-tag
          imagePullPolicy: IfNotPresent
          name: main
    replicas: 1
    type: frontend
  - name: Planner
    podTemplate:
      spec:
        containers:
        - args:
          - --config
          - '{"environment": "kubernetes", "backend": "sglang", "optimization_target": "sla",
            "enable_throughput_scaling": true, "enable_load_scaling": true, "pre_deployment_sweeping_mode":
            "none", "throughput_adjustment_interval_seconds": 60, "load_adjustment_interval_seconds":
            5, "prefill_engine_num_gpu": 1, "decode_engine_num_gpu": 1, "max_gpu_budget":
            3}'
          command:
          - python3
          - -m
          - dynamo.planner
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: my-registry/dynamo-planner:my-tag
          imagePullPolicy: IfNotPresent
          name: main
    replicas: 1
    type: planner
  - name: decode
    podTemplate:
      spec:
        hostIPC: true
        containers:
        - args:
          # XPU SGLang has no forward-pass metrics support (it uses torch.cuda.Event), and the
          # operator injects DYN_FORWARDPASS_METRIC_PORT, so unset it before launch.
          - |
            unset DYN_FORWARDPASS_METRIC_PORT
            exec python3 -m dynamo.sglang \
              --model-path Qwen/Qwen3-0.6B \
              --served-model-name Qwen/Qwen3-0.6B \
              --page-size 16 \
              --tp 1 \
              --trust-remote-code \
              --device xpu \
              --attention-backend intel_xpu \
              --disaggregation-mode decode \
              --disaggregation-transfer-backend nixl \
              --disaggregation-bootstrap-port 12345 \
              --host 0.0.0.0
          command:
          - /bin/bash
          - -c
          env:
          - name: UCX_TLS
            value: "ze_ipc,ze_copy,tcp,cma,sysv,posix,self"
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: my-registry/sglang-runtime-xpu:my-tag
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            claims:
            - name: gpu
            requests:
              # Increase this value for larger models.
              ephemeral-storage: 8Gi
          workingDir: /workspace/examples/backends/sglang
        resourceClaims:
        - name: gpu
          resourceClaimTemplateName: gpu-template
    replicas: 2
    type: decode
  - name: prefill
    podTemplate:
      spec:
        hostIPC: true
        containers:
        - args:
          # XPU SGLang has no forward-pass metrics support (it uses torch.cuda.Event), and the
          # operator injects DYN_FORWARDPASS_METRIC_PORT, so unset it before launch.
          - |
            unset DYN_FORWARDPASS_METRIC_PORT
            exec python3 -m dynamo.sglang \
              --model-path Qwen/Qwen3-0.6B \
              --served-model-name Qwen/Qwen3-0.6B \
              --page-size 16 \
              --tp 1 \
              --trust-remote-code \
              --device xpu \
              --attention-backend intel_xpu \
              --disaggregation-mode prefill \
              --disaggregation-transfer-backend nixl \
              --disaggregation-bootstrap-port 12345 \
              --host 0.0.0.0
          command:
          - /bin/bash
          - -c
          env:
          - name: UCX_TLS
            value: "ze_ipc,ze_copy,tcp,cma,sysv,posix,self"
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: my-registry/sglang-runtime-xpu:my-tag
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            claims:
            - name: gpu
            requests:
              # Increase this value for larger models.
              ephemeral-storage: 8Gi
          workingDir: /workspace/examples/backends/sglang
        resourceClaims:
        - name: gpu
          resourceClaimTemplateName: gpu-template
    replicas: 1
    type: prefill
