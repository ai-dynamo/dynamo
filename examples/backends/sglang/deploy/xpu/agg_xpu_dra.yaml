apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-template
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.intel.com
            count: 1
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-agg-xpu-dra
spec:
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - image: my-registry/sglang-runtime-xpu:my-tag
          imagePullPolicy: IfNotPresent
          name: main
    replicas: 1
    type: frontend
  - name: decode
    podTemplate:
      spec:
        containers:
        - args:
          # XPU SGLang has no forward-pass metrics support (it uses torch.cuda.Event), and the
          # operator injects DYN_FORWARDPASS_METRIC_PORT, so unset it before launch.
          - |
            unset DYN_FORWARDPASS_METRIC_PORT
            exec python3 -m dynamo.sglang \
              --model-path Qwen/Qwen3-0.6B \
              --served-model-name Qwen/Qwen3-0.6B \
              --page-size 16 \
              --tp 1 \
              --trust-remote-code \
              --device xpu \
              --attention-backend intel_xpu
          command:
          - /bin/bash
          - -c
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: my-registry/sglang-runtime-xpu:my-tag
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            claims:
            - name: gpu
            requests:
              # Increase this value for larger models.
              ephemeral-storage: 8Gi
          workingDir: /workspace/examples/backends/sglang
        resourceClaims:
        - name: gpu
          resourceClaimTemplateName: gpu-template
    replicas: 1
    type: worker
