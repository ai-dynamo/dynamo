#
# Aggregated serving with KV-aware router for Intel XPU.
# 2 workers behind a KV router, each on a separate GPU.
# Workers publish KV events via ZMQ for routing optimization.
#
# Prerequisites:
# - Intel XPU GPU with DRA driver installed
# - 2+ GPU devices available
# - hf-token-secret created in target namespace

apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-template
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.intel.com
            count: 1
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-agg-router-xpu-dra
spec:
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - env:
          - name: DYN_ROUTER_MODE
            value: kv
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: docker.io/library/dynamo-sglang-xpu:latest
          imagePullPolicy: IfNotPresent
          name: main
    replicas: 1
    type: frontend
  - name: decode
    podTemplate:
      spec:
        containers:
        - args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --served-model-name
          - Qwen/Qwen3-0.6B
          - --page-size
          - "16"
          - --tp
          - "1"
          - --trust-remote-code
          - --skip-tokenizer-init
          - --device
          - xpu
          - --disable-cuda-graph
          - --grammar-backend
          - none
          - --enable-metrics
          # KV events for router - endpoint differs per worker instance.
          # Dynamo auto-assigns unique ports for each replica.
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
          command:
          - python3
          - -m
          - dynamo.sglang
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: docker.io/library/dynamo-sglang-xpu:latest
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            claims:
            - name: gpu
            requests:
              ephemeral-storage: 2Gi
          workingDir: /workspace/examples/backends/sglang
        resourceClaims:
        - name: gpu
          resourceClaimTemplateName: gpu-template
        # Uncomment if needed for your environment.
        # securityContext:
        #   runAsUser: 1000
        #   runAsGroup: 1000
        #   supplementalGroups:
        #     - 44    # video group
        #     - 991   # render group
    replicas: 2
    type: worker
