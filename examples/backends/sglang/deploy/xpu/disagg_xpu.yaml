#
# Disaggregated serving on Intel XPU using the gpu.intel.com/xe device plugin.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-disagg-xpu
spec:
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - image: my-registry/sglang-runtime-xpu:my-tag
          imagePullPolicy: IfNotPresent
          name: main
    replicas: 1
    type: frontend
  - name: decode
    podTemplate:
      spec:
        hostIPC: true
        containers:
        - args:
          # XPU SGLang has no forward-pass metrics support (it uses torch.cuda.Event), and the
          # operator injects DYN_FORWARDPASS_METRIC_PORT, so unset it before launch.
          - |
            unset DYN_FORWARDPASS_METRIC_PORT
            exec python3 -m dynamo.sglang \
              --model-path Qwen/Qwen3-0.6B \
              --served-model-name Qwen/Qwen3-0.6B \
              --page-size 16 \
              --tp 1 \
              --trust-remote-code \
              --device xpu \
              --attention-backend intel_xpu \
              --disaggregation-mode decode \
              --disaggregation-transfer-backend nixl \
              --disaggregation-bootstrap-port 12345 \
              --host 0.0.0.0
          command:
          - /bin/bash
          - -c
          env:
          - name: UCX_TLS
            value: "ze_ipc,ze_copy,tcp,cma,sysv,posix,self"
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: my-registry/sglang-runtime-xpu:my-tag
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            limits:
              gpu.intel.com/xe: "1"
            requests:
              # Increase this value for larger models.
              ephemeral-storage: 8Gi
          workingDir: /workspace/examples/backends/sglang
    replicas: 1
    type: decode
  - name: prefill
    podTemplate:
      spec:
        hostIPC: true
        containers:
        - args:
          # XPU SGLang has no forward-pass metrics support (it uses torch.cuda.Event), and the
          # operator injects DYN_FORWARDPASS_METRIC_PORT, so unset it before launch.
          - |
            unset DYN_FORWARDPASS_METRIC_PORT
            exec python3 -m dynamo.sglang \
              --model-path Qwen/Qwen3-0.6B \
              --served-model-name Qwen/Qwen3-0.6B \
              --page-size 16 \
              --tp 1 \
              --trust-remote-code \
              --device xpu \
              --attention-backend intel_xpu \
              --disaggregation-mode prefill \
              --disaggregation-transfer-backend nixl \
              --disaggregation-bootstrap-port 12345 \
              --host 0.0.0.0
          command:
          - /bin/bash
          - -c
          env:
          - name: UCX_TLS
            value: "ze_ipc,ze_copy,tcp,cma,sysv,posix,self"
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: my-registry/sglang-runtime-xpu:my-tag
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            limits:
              gpu.intel.com/xe: "1"
            requests:
              # Increase this value for larger models.
              ephemeral-storage: 8Gi
          workingDir: /workspace/examples/backends/sglang
    replicas: 1
    type: prefill
