#
# Disaggregated serving on Intel XPU using the gpu.intel.com/xe device plugin.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-disagg-xpu
spec:
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - image: docker.io/library/dynamo-sglang-xpu:latest
          imagePullPolicy: IfNotPresent
          name: main
    replicas: 1
    runtimeVersionOverride: 1.4.0
    type: frontend
  - name: decode
    podTemplate:
      spec:
        hostIPC: true
        containers:
        - args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --served-model-name
          - Qwen/Qwen3-0.6B
          - --page-size
          - "16"
          - --tp
          - "1"
          - --trust-remote-code
          - --skip-tokenizer-init
          - --device
          - xpu
          - --disable-cuda-graph
          - --disaggregation-mode
          - decode
          - --disaggregation-transfer-backend
          - nixl
          - --disaggregation-bootstrap-port
          - "12345"
          - --host
          - 0.0.0.0
          command:
          - python3
          - -m
          - dynamo.sglang
          env:
          # Select the decode device for the validated multi-device topology.
          # Adjust this value to match the Level Zero numbering on your node.
          - name: ZE_AFFINITY_MASK
            value: "2"
          - name: UCX_TLS
            value: "ze_ipc,ze_copy,tcp,cma,sysv,posix,self"
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: docker.io/library/dynamo-sglang-xpu:latest
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            limits:
              gpu.intel.com/xe: "1"
          workingDir: /workspace/examples/backends/sglang
    replicas: 1
    runtimeVersionOverride: 1.4.0
    type: decode
  - name: prefill
    podTemplate:
      spec:
        hostIPC: true
        containers:
        - args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --served-model-name
          - Qwen/Qwen3-0.6B
          - --page-size
          - "16"
          - --tp
          - "1"
          - --trust-remote-code
          - --skip-tokenizer-init
          - --device
          - xpu
          - --disable-cuda-graph
          - --disaggregation-mode
          - prefill
          - --disaggregation-transfer-backend
          - nixl
          - --disaggregation-bootstrap-port
          - "12345"
          - --host
          - 0.0.0.0
          command:
          - python3
          - -m
          - dynamo.sglang
          env:
          # Select the prefill device for the validated multi-device topology.
          # Adjust this value to match the Level Zero numbering on your node.
          - name: ZE_AFFINITY_MASK
            value: "0"
          - name: UCX_TLS
            value: "ze_ipc,ze_copy,tcp,cma,sysv,posix,self"
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: docker.io/library/dynamo-sglang-xpu:latest
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            limits:
              gpu.intel.com/xe: "1"
          workingDir: /workspace/examples/backends/sglang
    replicas: 1
    runtimeVersionOverride: 1.4.0
    type: prefill
