# Disaggregated serving on Intel XPU using traditional device plugin (gpu.intel.com/xe)
# This does not require DRA and is more stable than DRA-based deployment.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-disagg-xpu
spec:
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - image: docker.io/library/dynamo-sglang-xpu:latest
          imagePullPolicy: IfNotPresent
          name: main
    replicas: 1
    type: frontend
  - name: decode
    podTemplate:
      spec:
        hostIPC: true
        containers:
        - args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --served-model-name
          - Qwen/Qwen3-0.6B
          - --page-size
          - "16"
          - --tp
          - "1"
          - --trust-remote-code
          - --skip-tokenizer-init
          - --enable-metrics
          - --device
          - xpu
          - --disable-cuda-graph
          - --grammar-backend
          - none
          - --disaggregation-mode
          - decode
          - --disaggregation-transfer-backend
          - nixl
          - --disaggregation-bootstrap-port
          - "12345"
          - --host
          - "0.0.0.0"
          command:
          - python3
          - -m
          - dynamo.sglang
          env:
          # XPU-specific environment variables for disaggregated KV transfer.
          # ZE_AFFINITY_MASK selects a specific tile on the GPU.
          # Adjust values for your GPU topology (different tiles for prefill and decode).
          - name: ZE_AFFINITY_MASK
            value: "2"
          # UCX transport layer configuration for XPU.
          - name: UCX_TLS
            value: "ze_ipc,ze_copy,tcp,cma,sysv,posix,self"
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: docker.io/library/dynamo-sglang-xpu:latest
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            limits:
              gpu.intel.com/xe: "1"
          workingDir: /workspace/examples/backends/sglang
    replicas: 1
    type: decode
  - name: prefill
    podTemplate:
      spec:
        hostIPC: true
        containers:
        - args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --served-model-name
          - Qwen/Qwen3-0.6B
          - --page-size
          - "16"
          - --tp
          - "1"
          - --trust-remote-code
          - --skip-tokenizer-init
          - --enable-metrics
          - --device
          - xpu
          - --disable-cuda-graph
          - --grammar-backend
          - none
          - --disaggregation-mode
          - prefill
          - --disaggregation-transfer-backend
          - nixl
          - --disaggregation-bootstrap-port
          - "12345"
          - --host
          - "0.0.0.0"
          - --port
          - "40000"
          command:
          - python3
          - -m
          - dynamo.sglang
          env:
          # XPU-specific environment variables for disaggregated KV transfer.
          # ZE_AFFINITY_MASK selects a specific tile on the GPU.
          # Adjust values for your GPU topology (different tiles for prefill and decode).
          - name: ZE_AFFINITY_MASK
            value: "0"
          # UCX transport layer configuration for XPU.
          - name: UCX_TLS
            value: "ze_ipc,ze_copy,tcp,cma,sysv,posix,self"
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: docker.io/library/dynamo-sglang-xpu:latest
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            limits:
              gpu.intel.com/xe: "1"
          workingDir: /workspace/examples/backends/sglang
    replicas: 1
    type: prefill
