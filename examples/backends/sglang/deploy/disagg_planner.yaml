apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-disagg-planner
spec:
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - image: ${FRONTEND_IMAGE}
          name: main
    replicas: 1
    type: frontend
  - name: Planner
    podTemplate:
      spec:
        containers:
        - args:
          - --config
          # Bootstrap from worker self-benchmarks or live FPM; no profile ConfigMap.
          - >-
            {"environment": "kubernetes", "backend": "sglang", "mode": "disagg",
            "optimization_target": "sla", "ttft_ms": 500, "itl_ms": 50,
            "enable_throughput_scaling": true, "enable_load_scaling": true,
            "pre_deployment_sweeping_mode": "none", "min_endpoint": 1,
            "max_gpu_budget": 8, "throughput_adjustment_interval_seconds": 60,
            "load_adjustment_interval_seconds": 5}
          command:
          - python3
          - -m
          - dynamo.planner
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: ${PLANNER_IMAGE}
          name: main
    replicas: 1
    type: planner
  - name: decode
    scalingAdapter:
      enabled: true
    podTemplate:
      spec:
        containers:
        - args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --served-model-name
          - Qwen/Qwen3-0.6B
          - --page-size
          - "16"
          - --tp
          - "1"
          - --trust-remote-code
          - --disaggregation-mode
          - decode
          - --disaggregation-transfer-backend
          - nixl
          - --disaggregation-bootstrap-port
          - "12345"
          - --host
          - 0.0.0.0
          command:
          - python3
          - -m
          - dynamo.sglang
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: ${SGLANG_IMAGE}
          name: main
          resources:
            limits:
              nvidia.com/gpu: "1"
          workingDir: /workspace/examples/backends/sglang
    replicas: 2
    type: decode
  - name: prefill
    scalingAdapter:
      enabled: true
    podTemplate:
      spec:
        containers:
        - args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --served-model-name
          - Qwen/Qwen3-0.6B
          - --page-size
          - "16"
          - --tp
          - "1"
          - --trust-remote-code
          - --disaggregation-mode
          - prefill
          - --disaggregation-transfer-backend
          - nixl
          - --disaggregation-bootstrap-port
          - "12345"
          - --host
          - 0.0.0.0
          command:
          - python3
          - -m
          - dynamo.sglang
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: ${SGLANG_IMAGE}
          name: main
          resources:
            limits:
              nvidia.com/gpu: "1"
          workingDir: /workspace/examples/backends/sglang
    replicas: 2
    type: prefill
