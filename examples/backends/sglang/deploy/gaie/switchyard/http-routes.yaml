apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen-small
spec:
  parentRefs:
  - name: inference-gateway
    namespace: agentgateway-system
    sectionName: http
  rules:
  - matches:
    - path:
        type: Exact
        value: /v1/chat/completions
      headers:
      - name: X-Gateway-Model-Name
        type: Exact
        value: Qwen/Qwen3.5-27B
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: qwen-small-pool
      port: 8000
    timeouts:
      request: 120s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen-large
spec:
  parentRefs:
  - name: inference-gateway
    namespace: agentgateway-system
    sectionName: http
  rules:
  - matches:
    - path:
        type: Exact
        value: /v1/chat/completions
      headers:
      - name: X-Gateway-Model-Name
        type: Exact
        value: Qwen/Qwen3.5-397B-A17B
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: qwen-large-pool
      port: 8000
    timeouts:
      request: 120s
