schema_version = 1

# This StageRouter policy makes no routing-time model calls.
[llm_clients.dynamo]
format = "openai_chat"
base_url = "http://inference-gateway.agentgateway-system.svc.cluster.local/v1"

[targets.qwen-small]
id = "Qwen/Qwen3.5-27B"
llm_client = "dynamo"

[targets.qwen-large]
id = "Qwen/Qwen3.5-397B-A17B"
llm_client = "dynamo"

[routes.stage]
id = "auto"
type = "stage_router"
efficient_target = "qwen-small"
capable_target = "qwen-large"
picker = "efficient_first"
confidence_threshold = 0.5
