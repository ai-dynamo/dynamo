apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-disagg-planner
spec:
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - image: ${FRONTEND_IMAGE}
          name: main
    replicas: 1
    type: frontend
  - name: Planner
    podTemplate:
      spec:
        containers:
        - args:
          - --config
          # Bootstrap from worker self-benchmarks or live FPM; no profile ConfigMap.
          - >-
            {"environment": "kubernetes", "backend": "vllm", "mode": "disagg",
            "optimization_target": "sla", "ttft_ms": 500, "itl_ms": 50,
            "enable_throughput_scaling": true, "enable_load_scaling": true,
            "pre_deployment_sweeping_mode": "none", "min_endpoint": 1,
            "max_gpu_budget": 8, "throughput_adjustment_interval_seconds": 60,
            "load_adjustment_interval_seconds": 5}
          command:
          - python3
          - -m
          - dynamo.planner
          image: ${PLANNER_IMAGE}
          name: main
    replicas: 1
    type: planner
  - name: decode
    scalingAdapter:
      enabled: true
    podTemplate:
      spec:
        containers:
        - args:
          - -m
          - dynamo.vllm
          - --model
          - Qwen/Qwen3-0.6B
          - --disaggregation-mode
          - decode
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
          command:
          - python3
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: ${VLLM_IMAGE}
          name: main
          resources:
            limits:
              nvidia.com/gpu: "1"
          workingDir: /workspace/examples/backends/vllm
    replicas: 1
    type: decode
  - name: prefill
    scalingAdapter:
      enabled: true
    podTemplate:
      spec:
        containers:
        - args:
          - -m
          - dynamo.vllm
          - --model
          - Qwen/Qwen3-0.6B
          - --disaggregation-mode
          - prefill
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
          command:
          - python3
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: ${VLLM_IMAGE}
          name: main
          resources:
            limits:
              nvidia.com/gpu: "1"
          workingDir: /workspace/examples/backends/vllm
    replicas: 1
    type: prefill
