apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  annotations:
    nvidia.com/dynamo-discovery-backend: kubernetes
    nvidia.com/dynamo-kube-discovery-mode: container
  name: vllm-agg-kvcr-memory-service
spec:
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - env:
          - name: DYN_ROUTER_MODE
            value: kv
          image: ${DYNAMO_VLLM_IMAGE}
          name: main
    replicas: 1
    type: frontend
  - name: worker
    podTemplate:
      spec:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                - key: nvidia.com/dynamo-component
                  operator: In
                  values:
                  - worker
                - key: nvidia.com/dynamo-graph-deployment-name
                  operator: In
                  values:
                  - vllm-agg-kvcr-memory-service
              topologyKey: kubernetes.io/hostname
        containers:
        - args:
          - |
            set -euo pipefail
            if ! compgen -G '/dev/infiniband/uverbs*' >/dev/null; then
              echo "No RDMA userspace device is mounted" >&2
              exit 1
            fi

            for _ in $(seq 1 60); do
              if python3 -c "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect('/run/kvcr/memory.sock'); s.close()" >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            if ! python3 -c "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect('/run/kvcr/memory.sock'); s.close()"; then
              echo "KVCR memory service did not become ready" >&2
              exit 1
            fi

            if [ -e /run/kvcr/hold-engine-start ]; then
              echo "Waiting for the KVCR resiliency hold to be removed"
            fi
            while [ -e /run/kvcr/hold-engine-start ]; do
              sleep 1
            done

            case "$POD_INDEX" in
              0) owner_slot=00000000000000000000000000000000 ;;
              1) owner_slot=00000000000000000000000000000001 ;;
              *) echo "Unsupported Grove Pod index: $POD_INDEX" >&2; exit 1 ;;
            esac
            export KVCR_CACHE_OWNER="01010101010101010101010101010101:02020202020202020202020202020202/0303030303030303/${owner_slot}"
            kv_transfer_config=$(
              python3 - <<'PY'
            import json
            import os

            print(json.dumps({
                "kv_connector": "OffloadingConnector",
                "kv_role": "kv_both",
                "kv_connector_extra_config": {
                    "cpu_bytes_to_use": 2147483648,
                    "spec_name": "TieringOffloadingSpec",
                    "self_describing_kv_events": True,
                    "dynamo_state_agent": {
                        "raw_advertise_host": os.environ["POD_IP"],
                        "cache_owner_ids": {"0": os.environ["KVCR_CACHE_OWNER"]},
                    },
                    "secondary_tiers": [{
                        "type": "kvcr",
                        "kvcr_service_socket_path": "/run/kvcr/memory.sock",
                        "compatibility_digest": "${DYNAMO_KVCR_COMPATIBILITY_DIGEST}",
                        "router_capabilities": ["router_hint"],
                        "control_host": "0.0.0.0",
                        "control_ports": [23280],
                        "control_advertise_host": os.environ["POD_IP"],
                        "enable_telemetry": True,
                    }],
                },
            }))
            PY
            )
            exec python3 -m dynamo.vllm \
              --model Qwen/Qwen3-0.6B \
              --kv-transfer-config "$kv_transfer_config" \
              --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:23080","enable_kv_cache_events":true}'
          command:
          - /bin/bash
          - -c
          env:
          - name: CONTAINER_NAME
            value: main
          - name: DYN_KUBE_DISCOVERY_MODE
            value: container
          - name: DYN_SYSTEM_PORT
            value: "9090"
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: POD_INDEX
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['grove.io/podclique-pod-index']
          - name: PYTHONHASHSEED
            value: "0"
          - name: UCX_TLS
            value: rc_x,cuda
          - name: UCX_NET_DEVICES
            value: ${DYNAMO_UCX_NET_DEVICES}
          - name: UCX_PROTO_INFO
            value: "y"
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: ${DYNAMO_VLLM_IMAGE}
          name: main
          resources:
            limits:
              ${DYNAMO_RDMA_RESOURCE}: "1"
              nvidia.com/gpu: "1"
            requests:
              ${DYNAMO_RDMA_RESOURCE}: "1"
              ephemeral-storage: 2Gi
              nvidia.com/gpu: "1"
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
          volumeMounts:
          - mountPath: /run/kvcr
            name: kvcr-socket
          - mountPath: /dev/shm/kvcr
            name: kvcr-memory
          workingDir: /workspace/examples/backends/vllm
        - args:
          - |
            set -euo pipefail
            if ! compgen -G '/dev/infiniband/uverbs*' >/dev/null; then
              echo "No RDMA userspace device is mounted" >&2
              exit 1
            fi

            state_namespace=$DYN_NAMESPACE
            if [ -n "${DYN_NAMESPACE_WORKER_SUFFIX:-}" ]; then
              state_namespace="${state_namespace}-${DYN_NAMESPACE_WORKER_SUFFIX}"
            fi

            kvcr_pid=
            state_agent_pid=
            cleanup() {
              [ -z "$kvcr_pid" ] || kill -TERM "$kvcr_pid" 2>/dev/null || true
              [ -z "$state_agent_pid" ] || kill -TERM "$state_agent_pid" 2>/dev/null || true
              [ -z "$kvcr_pid" ] || wait "$kvcr_pid" 2>/dev/null || true
              [ -z "$state_agent_pid" ] || wait "$state_agent_pid" 2>/dev/null || true
            }
            trap cleanup EXIT INT TERM

            python3 -m kvcr.kvcr_service \
              --socket-path /run/kvcr/memory.sock \
              --pool-dir /dev/shm/kvcr \
              --guard-count 1 \
              --pool-sizes-gb 2 \
              --compatibility-digest "${DYNAMO_KVCR_COMPATIBILITY_DIGEST}" &
            kvcr_pid=$!
            if [ "$POD_INDEX" = "0" ]; then
              env DYN_NAMESPACE="$state_namespace" \
                python3 -m dynamo.kv_state_agent --max-slots 2 &
              state_agent_pid=$!
              wait -n "$kvcr_pid" "$state_agent_pid"
            else
              wait "$kvcr_pid"
            fi
          command:
          - /bin/bash
          - -c
          env:
          - name: CONTAINER_NAME
            value: kvcr-services
          - name: DYN_COMPONENT
            value: kv_state_agent
          - name: DYN_DISCOVERY_BACKEND
            value: kubernetes
          - name: DYN_KUBE_DISCOVERY_MODE
            value: container
          - name: DYN_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['nvidia.com/dynamo-namespace']
          - name: DYN_NAMESPACE_WORKER_SUFFIX
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['nvidia.com/dynamo-worker-hash']
          - name: DYN_SYSTEM_PORT
            value: "9091"
          - name: POD_INDEX
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['grove.io/podclique-pod-index']
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: UCX_TLS
            value: rc_x,cuda
          - name: UCX_NET_DEVICES
            value: ${DYNAMO_UCX_NET_DEVICES}
          - name: UCX_PROTO_INFO
            value: "y"
          image: ${DYNAMO_VLLM_IMAGE}
          livenessProbe:
            exec:
              command:
              - python3
              - -c
              - import os,socket,urllib.request; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect('/run/kvcr/memory.sock'); s.close(); os.environ['POD_INDEX'] != '0' or urllib.request.urlopen('http://127.0.0.1:9091/live', timeout=1).read()
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 4
          name: kvcr-services
          readinessProbe:
            exec:
              command:
              - python3
              - -c
              - import os,socket,urllib.request; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect('/run/kvcr/memory.sock'); s.close(); os.environ['POD_INDEX'] != '0' or urllib.request.urlopen('http://127.0.0.1:9091/live', timeout=1).read()
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 4
          resources:
            limits:
              ${DYNAMO_RDMA_RESOURCE}: "1"
              memory: 4Gi
            requests:
              ${DYNAMO_RDMA_RESOURCE}: "1"
              cpu: "1"
              memory: 3Gi
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
          startupProbe:
            exec:
              command:
              - python3
              - -c
              - import os,socket,urllib.request; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect('/run/kvcr/memory.sock'); s.close(); os.environ['POD_INDEX'] != '0' or urllib.request.urlopen('http://127.0.0.1:9091/live', timeout=1).read()
            failureThreshold: 60
            periodSeconds: 2
            timeoutSeconds: 4
          volumeMounts:
          - mountPath: /run/kvcr
            name: kvcr-socket
          - mountPath: /dev/shm/kvcr
            name: kvcr-memory
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
        volumes:
        - emptyDir: {}
          name: kvcr-socket
        - emptyDir:
            medium: Memory
            sizeLimit: 3Gi
          name: kvcr-memory
    replicas: 2
    type: worker
