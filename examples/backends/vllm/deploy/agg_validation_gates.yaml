# Aggregated vLLM worker with a publish gate: a check-runner sidecar serves
# the "completion" and "smoke" checks, and the worker calls both before it
# publishes its model card. A failing check holds the new worker, so with
# max-unavailable 0 the rollout stalls while the old pods serve. See docs:
# kubernetes/fault-tolerance/validation-gates.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-agg-validation-gates
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:my-tag
  - name: worker
    type: worker
    replicas: 2
    podTemplate:
      metadata:
        annotations:
          nvidia.com/deployment-rolling-update-max-surge: "1"
          nvidia.com/deployment-rolling-update-max-unavailable: "0"
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:my-tag
          command: [python3, -m, dynamo.vllm]
          args: [--model, Qwen/Qwen3-0.6B]
          env:
          - name: DYN_PUBLISH_GATE
            value: http://127.0.0.1:9100/checks/completion,http://127.0.0.1:9100/checks/smoke
          resources:
            limits:
              nvidia.com/gpu: "1"
        # Replace the image and checks with your own.
        - name: check-runner
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:my-tag
          command: [python3, -m, dynamo.validation.runner, --port, "9100", --timeout, "600",
                    --check, "completion=python3 -m dynamo.validation.completion",
                    --check, "smoke=python3 /checks/smoke.py"]
