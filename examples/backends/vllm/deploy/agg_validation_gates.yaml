# Aggregated vLLM worker with validation gates: "completion" runs in the
# worker container and "smoke" in a check-runner sidecar. A failing check
# holds the new worker, so with max-unavailable 0 the rollout stalls while the
# old pods serve. See docs: kubernetes/fault-tolerance/validation-gates.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-agg-validation-gates
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:my-tag
  - name: worker
    type: worker
    replicas: 2
    podTemplate:
      metadata:
        annotations:
          nvidia.com/deployment-rolling-update-max-surge: "1"
          nvidia.com/deployment-rolling-update-max-unavailable: "0"
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:my-tag
          command: [python3, -m, dynamo.vllm]
          args: [--model, Qwen/Qwen3-0.6B]
          env:
          - name: DYN_WORKER_VALIDATION_GATES
            value: |
              {
                "completion": {"exec": ["python3", "-m", "dynamo.validation.completion"], "timeout_secs": 600},
                "smoke": {"url": "http://127.0.0.1:9100/validate/smoke", "timeout_secs": 900}
              }
          resources:
            limits:
              nvidia.com/gpu: "1"
        # Replace the image and command with your own checks.
        - name: check-runner
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:my-tag
          command: [python3, -m, dynamo.validation.runner, --port, "9100",
                    --check, "smoke=python3 -m dynamo.validation.completion"]
