[package]
name = "dynamo-deepinfer-openengine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust OpenEngine server driving a DeepInfer Python engine, with a CPU mock"

[[bin]]
name = "deepinfer-openengine"
path = "src/main.rs"

[[bin]]
name = "deepinfer-example-frontend"
path = "src/bin/frontend.rs"

[dependencies]
dynamo-backend-common = { workspace = true }
dynamo-llm = { path = "../../../lib/llm", default-features = false }
dynamo-runtime = { workspace = true }
dynamo-sidecar-common = { workspace = true }
dynamo-trtllm-sidecar = { path = "../../../lib/sidecar/trtllm" }
anyhow = { workspace = true }
async-stream = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
futures = { workspace = true }
parking_lot = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
