apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: trtllm-disagg-planner
spec:
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - args:
          - -m
          - dynamo.frontend
          - --http-port
          - "8000"
          - --kv-cache-block-size
          - "128"
          - --router-mode
          - kv
          - --router-kv-overlap-score-credit
          - "0.0"
          - --router-temperature
          - "0.0"
          - --no-kv-events
          command:
          - python3
          image: ${FRONTEND_IMAGE}
          name: main
          workingDir: /workspace/examples/backends/trtllm
    replicas: 1
    type: frontend
  - name: Planner
    podTemplate:
      spec:
        containers:
        - args:
          - -m
          - dynamo.planner
          - --config
          # Bootstrap from worker self-benchmarks or live FPM; no profile ConfigMap.
          - >-
            {"environment": "kubernetes", "backend": "trtllm", "mode": "disagg",
            "optimization_target": "sla", "ttft_ms": 500, "itl_ms": 50,
            "enable_throughput_scaling": true, "enable_load_scaling": true,
            "pre_deployment_sweeping_mode": "none", "min_endpoint": 1,
            "max_gpu_budget": 8, "throughput_adjustment_interval_seconds": 60,
            "load_adjustment_interval_seconds": 5}
          command:
          - python3
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: ${PLANNER_IMAGE}
          name: main
          ports:
          - containerPort: 9085
            name: metrics
    replicas: 1
    type: planner
  - name: decode
    scalingAdapter:
      enabled: true
    podTemplate:
      spec:
        containers:
        - args:
          - -m
          - dynamo.trtllm
          - --model-path
          - Qwen/Qwen3-0.6B
          - --served-model-name
          - Qwen/Qwen3-0.6B
          - --extra-engine-args
          - ./examples/backends/trtllm/engine_configs/qwen3/decode.yaml
          - --disaggregation-mode
          - decode
          command:
          - python3
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: ${TRTLLM_IMAGE}
          livenessProbe:
            failureThreshold: 1
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 5
            timeoutSeconds: 30
          name: main
          readinessProbe:
            failureThreshold: 60
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 30
          resources:
            limits:
              nvidia.com/gpu: "1"
          workingDir: /workspace/
        terminationGracePeriodSeconds: 600
    replicas: 1
    type: decode
  - name: prefill
    scalingAdapter:
      enabled: true
    podTemplate:
      spec:
        containers:
        - args:
          - -m
          - dynamo.trtllm
          - --model-path
          - Qwen/Qwen3-0.6B
          - --served-model-name
          - Qwen/Qwen3-0.6B
          - --extra-engine-args
          - ./examples/backends/trtllm/engine_configs/qwen3/prefill.yaml
          - --disaggregation-mode
          - prefill
          command:
          - python3
          envFrom:
          - secretRef:
              name: hf-token-secret
          image: ${TRTLLM_IMAGE}
          name: main
          resources:
            limits:
              nvidia.com/gpu: "1"
          workingDir: /workspace/
        terminationGracePeriodSeconds: 600
    replicas: 1
    type: prefill
