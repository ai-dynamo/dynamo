# Adapted from ai-dynamo/snapshot PR #456 (c1abd78401f4).
# Uses Dynamo-managed capture and restore with the normal Dynamo entrypoint.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen3-0-6b-trtllm-snapshot-restore-engine
data:
  config.yaml: |
    tensor_parallel_size: 1
    moe_expert_parallel_size: 1
    enable_attention_dp: false
    max_num_tokens: 1024
    max_batch_size: 1
    trust_remote_code: true
    backend: pytorch
    enable_chunked_prefill: false
    kv_cache_config:
      free_gpu_memory_fraction: 0.1
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-0-6b-trtllm-snapshot-restore
  annotations:
    nvidia.com/enable-grove: 'false'
spec:
  backendFramework: trtllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: my-registry/tensorrtllm-runtime:my-tag
          imagePullPolicy: IfNotPresent
  - name: TRTLLMWorker
    type: worker
    replicas: 1
    experimental:
      checkpoint:
        enabled: true
        startupPolicy: WaitForCheckpoint
    podTemplate:
      spec:
        runtimeClassName: nvidia
        nodeSelector:
          nvidia.com/gpu.present: 'true'
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
        volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: criu-work
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: engine-config
          configMap:
            name: qwen3-0-6b-trtllm-snapshot-restore-engine
        containers:
        - name: main
          image: my-registry/tensorrtllm-runtime:my-tag
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/
          command:
          - python3
          - -m
          - dynamo.trtllm
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --served-model-name
          - Qwen/Qwen3-0.6B
          - --tensor-parallel-size
          - '1'
          - --expert-parallel-size
          - '1'
          - --extra-engine-args
          - /etc/dynamo-engine/config.yaml
          env:
          - name: OMPI_MCA_pml
            value: ob1
          - name: OMPI_MCA_btl
            value: tcp,self
          - name: TORCHINDUCTOR_COMPILE_THREADS
            value: '1'
          resources:
            requests:
              cpu: '4'
              memory: 16Gi
              nvidia.com/gpu: '1'
              ephemeral-storage: 10Gi
            limits:
              cpu: '8'
              memory: 32Gi
              nvidia.com/gpu: '1'
          volumeMounts:
          - name: hf-cache
            mountPath: /home/dynamo/.cache/huggingface
          - name: criu-work
            mountPath: /var/criu-work
          - name: shm
            mountPath: /dev/shm
          - name: engine-config
            mountPath: /etc/dynamo-engine
            readOnly: true
      metadata:
        annotations:
          nvidia.com/cuda-shared-memory-support: enabled
