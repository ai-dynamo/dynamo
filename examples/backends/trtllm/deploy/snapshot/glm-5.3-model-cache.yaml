# Download the pinned GLM model before the one-hour capture deadline starts.
# Allow for large model shards and limit concurrent transfers.
apiVersion: batch/v1
kind: Job
metadata:
  name: glm-5-3-model-cache
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 10800
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: download
        image: my-registry/tensorrtllm-runtime:my-tag
        command:
        - python3
        - -c
        args:
        - from huggingface_hub import snapshot_download; snapshot_download(repo_id="RadixArk/GLM-5.3-NVFP4",
          revision="363e8f086905afd83db356a620f9aa401c23800a", max_workers=2)
        env:
        - name: HF_HOME
          value: /home/dynamo/.cache/huggingface
        - name: HF_HUB_DISABLE_XET
          value: '1'
        - name: HF_HUB_DOWNLOAD_TIMEOUT
          value: '120'
        - name: HF_HUB_ETAG_TIMEOUT
          value: '30'
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
          limits:
            cpu: '8'
            memory: 32Gi
        volumeMounts:
        - name: hf-cache
          mountPath: /home/dynamo/.cache/huggingface
      volumes:
      - name: hf-cache
        persistentVolumeClaim:
          claimName: model-cache
