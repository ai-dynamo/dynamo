apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: {{ required "deployment.name is required" .Values.deployment.name | quote }}
  labels:
    app.kubernetes.io/name: dynamo-mocker
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: dynamo-mocker-frontend
      spec:
        nodeSelector:
{{ toYaml .Values.placement.nodeSelector | indent 10 }}
        affinity:
          nodeAffinity:
{{ toYaml .Values.placement.nodeAffinity | indent 12 }}
        containers:
        - name: main
          image: {{ required "image is required" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          resources:
{{ toYaml .Values.frontend.resources | indent 12 }}
  - name: decode
    type: decode
    replicas: {{ .Values.mocker.replicas }}
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: dynamo-mocker-worker
      spec:
        nodeSelector:
{{ toYaml .Values.placement.nodeSelector | indent 10 }}
        affinity:
          nodeAffinity:
{{ toYaml .Values.placement.nodeAffinity | indent 12 }}
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    nvidia.com/dynamo-component: decode
                    nvidia.com/dynamo-graph-deployment-name: {{ .Values.deployment.name | quote }}
                topologyKey: kubernetes.io/hostname
        containers:
        - name: main
          image: {{ required "image is required" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command:
          - python3
          - -m
          - dynamo.mocker
          args:
          - --model-path
          - {{ required "model.name is required" .Values.model.name | quote }}
          - --model-name
          - {{ .Values.model.name | quote }}
          - --num-workers
          - "1"
          - --speedup-ratio
          - {{ .Values.mocker.speedup_ratio | quote }}
          resources:
{{ toYaml .Values.worker.resources | indent 12 }}
