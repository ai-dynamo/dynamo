deployment:
  name: mocker-agg

image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.4.0

model:
  name: Qwen/Qwen3-0.6B

mocker:
  replicas: 3
  speedup_ratio: 1.0

placement:
  nodeSelector:
    dynamo.nvidia.com/purpose: mocker-cpu
    topology.kubernetes.io/zone: us-west-2a

frontend:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

worker:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
