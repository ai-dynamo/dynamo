apiVersion: v1
kind: Secret
metadata:
  # The v0.3.0 chart mounts this pre-existing Secret; it does not create it.
  name: batch-gateway-secrets
type: Opaque
stringData:
  redis-url: redis://batch-gateway-valkey:6379/0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: batch-gateway-files
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: batch-gateway-valkey
  labels:
    app.kubernetes.io/name: batch-gateway-valkey
spec:
  selector:
    app.kubernetes.io/name: batch-gateway-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: batch-gateway-valkey
  labels:
    app.kubernetes.io/name: batch-gateway-valkey
spec:
  serviceName: batch-gateway-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: batch-gateway-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-gateway-valkey
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: valkey
          image: valkey/valkey:8.0.10-alpine
          imagePullPolicy: IfNotPresent
          command:
            - valkey-server
          args:
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: batch-gateway-valkey
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
