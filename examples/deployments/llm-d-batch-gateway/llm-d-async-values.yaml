ap:
  image:
    repository: ghcr.io/llm-d/llm-d-async
    tag: v0.9.0
  imagePullPolicy: IfNotPresent
  concurrency: 8
  drainTimeout: 30s
  igwBaseURL: "http://qwen3-0-6b-batch-frontend:8000"
  messageQueueImpl: redis-sortedset
  redis:
    enabled: true
    secretName: batch-gateway-secrets
    secretKey: redis-url
    requestPathURL: "/v1/chat/completions"
    requestQueueName: "llm-d-async:requests:dynamo-batch"
    resultQueueName: "llm-d-async:results:dynamo-batch"
    pollIntervalMs: 100
    batchSize: 8
    gateType: constant
    gateParams: {}
  metrics:
    enabled: true
    port: 9090
    secure: false
