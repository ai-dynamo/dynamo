global:
  secretName: batch-gateway-secrets
  dbClient:
    type: redis
  fileClient:
    type: fs
    fs:
      basePath: /var/lib/batch-gateway/files
      pvcName: batch-gateway-files

apiserver:
  image:
    repository: ghcr.io/llm-d/batch-gateway-apiserver
    pullPolicy: IfNotPresent
    tag: v0.3.0
  config:
    inputHeaders:
      tenant: X-MaaS-Username
    batchAPI:
      passThroughHeaders:
        - Authorization

processor:
  image:
    repository: ghcr.io/llm-d/batch-gateway-processor
    pullPolicy: IfNotPresent
    tag: v0.3.0
  config:
    numWorkers: 1
    concurrency:
      global: 1
      perEndpoint: 1
      recovery: 1
      aimd:
        enabled: true
        min: 1
        backoffFactor: 0.5
        additiveIncrease: 1
    modelGateways:
      "Qwen/Qwen3-0.6B":
        url: http://qwen3-0-6b-batch-frontend:8000
        requestTimeout: 5m
        maxRetries: 3
        initialBackoff: 1s
        maxBackoff: 60s

gc:
  enabled: false
  image:
    repository: ghcr.io/llm-d/batch-gateway-gc
    pullPolicy: IfNotPresent
    tag: v0.3.0
