apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-0-6b-batch
spec:
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
              command:
                - python3
                - -m
                - dynamo.frontend
              args:
                - --router-mode
                - round-robin
                - --http-port
                - "8000"
              workingDir: /workspace
              resources:
                requests:
                  cpu: "1"
                limits:
                  cpu: "2"
    - name: VllmDecodeWorker
      type: worker
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
              command:
                - python3
                - -m
                - dynamo.vllm
              args:
                - --model
                - Qwen/Qwen3-0.6B
                - --served-model-name
                - Qwen/Qwen3-0.6B
                - --gpu-memory-utilization
                - "0.70"
                - --max-model-len
                - "4096"
                - --no-enable-log-requests
              env:
                - name: HF_HOME
                  value: /opt/models
              envFrom:
                - secretRef:
                    name: hf-token-secret
              volumeMounts:
                - name: model-cache
                  mountPath: /opt/models
              workingDir: /workspace/examples/backends/vllm
              resources:
                requests:
                  cpu: "2"
                  memory: 8Gi
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "4"
                  memory: 16Gi
                  nvidia.com/gpu: "1"
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
