#
# NAMESPACE, PLANNER_IMAGE, BATCH_TENANT, and BATCH_WARM_REPLICAS are
# intentionally required.
# Render this file with the documented envsubst command; do not apply it
# directly.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwen3-0-6b-batch-planner-scaling-adapter
  namespace: ${NAMESPACE}
rules:
  - apiGroups:
      - nvidia.com
    resources:
      - dynamographdeploymentscalingadapters
    resourceNames:
      - qwen3-0-6b-batch-worker
    verbs:
      - get
      - patch
  - apiGroups:
      - nvidia.com
    resources:
      - dynamographdeploymentscalingadapters/scale
    resourceNames:
      - qwen3-0-6b-batch-worker
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qwen3-0-6b-batch-planner-scaling-adapter
  namespace: ${NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: planner-serviceaccount
    namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qwen3-0-6b-batch-planner-scaling-adapter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen3-0-6b-batch-planner-config
  namespace: ${NAMESPACE}
data:
  planner.yaml: |
    environment: kubernetes
    namespace: ${NAMESPACE}-qwen3-0-6b-batch
    backend: vllm
    mode: agg
    model_name: Qwen/Qwen3-0.6B
    optimization_target: throughput
    pre_deployment_sweeping_mode: none
    enable_throughput_scaling: false
    enable_load_scaling: true
    load_adjustment_interval_seconds: 5
    throughput_adjustment_interval_seconds: 60
    # The batch policy owns the aggregate worker's warm target. Keep the
    # generic Planner floor at zero so BATCH_WARM_REPLICAS=0 can remove the
    # final worker after every source confirms that the pool is idle.
    min_endpoint: 0
    max_gpu_budget: 1
    # Mocker workers request no physical GPU. Keep one logical vLLM engine per
    # replica so Planner can use the same aggregate scaling contract for the
    # CPU campaign and the one-GPU deployment.
    decode_engine_num_gpu: 1
    metric_reporting_prometheus_port: 0
    live_dashboard_port: 0
    report_interval_hours: null
    scheduling:
      scale_interval_seconds: 5
      tick_max_duration_seconds: 20
    batch_scheduling:
      enabled: true
      gateway:
        base_url: http://batch-gateway-apiserver:8000
        tenant: ${BATCH_TENANT}
        request_timeout_seconds: 5
        page_size: 100
        max_pages: 100
        max_jobs: 10000
        collection_timeout_seconds: 15
        detail_concurrency: 16
      metrics:
        frontend_metrics_url: http://qwen3-0-6b-batch-frontend:8000/metrics
        dispatcher_metrics_url: http://async-dispatch-llm-d-async-metrics:9090/metrics
        online_match_labels:
          endpoint: chat_completions
          model: Qwen/Qwen3-0.6B
          request_type: stream
        request_timeout_seconds: 5
      redis:
        control_key: llm-d-async:drain-limit:dynamo-batch
        connect_timeout_seconds: 2
        socket_timeout_seconds: 2
      pool:
        pool_id: dynamo-batch
        work_class: gsm8k-qwen3-0.6b-chat-v1
        # The exact-head fixed-timing Mocker pilot sustained the online trace
        # alone, but these 128-token Batch requests consume materially more
        # service time than the online requests. A 5.5-RPS mixed-work envelope
        # leaves about 0.5 RPS for Batch in the low phases and pauses Batch in
        # the high phase; the post-online cap still returns to 5 RPS.
        safe_rps_per_ready_replica: 5.5
        cold_start_margin_seconds: 30
        finalization_margin_seconds: 5
        max_observation_age_seconds: 15
        drain_lease_duration_seconds: 90
        # Exact idle target after Gateway jobs, frontend work, and Async
        # queued/inflight requests are all authoritatively zero. It remains the
        # active-job floor as well. Use 0 for batch-triggered scale-to-zero or 1
        # to retain the POC's default warm worker.
        min_replicas: ${BATCH_WARM_REPLICAS}
        max_replicas: 1
        scale_from_zero_replicas: 1
        max_batch_admission_rps: 5
---
apiVersion: v1
kind: Service
metadata:
  name: async-dispatch-llm-d-async-metrics
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/instance: async-dispatch
    app.kubernetes.io/name: llm-d-async
spec:
  selector:
    app.kubernetes.io/instance: async-dispatch
    app.kubernetes.io/name: llm-d-async
  ports:
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: metrics
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-0-6b-batch-planner
  namespace: ${NAMESPACE}
spec:
  components:
    - name: Planner
      type: planner
      replicas: 1
      runtimeVersionOverride: "1.5.0"
      podTemplate:
        metadata:
          annotations:
            nvidia.com/deployment-strategy: Recreate
        spec:
          terminationGracePeriodSeconds: 30
          containers:
            - name: main
              image: ${PLANNER_IMAGE}
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - -m
                - dynamo.planner
              args:
                - --config
                - /etc/dynamo/planner/planner.yaml
              env:
                - name: DYN_NAMESPACE
                  value: ${NAMESPACE}-qwen3-0-6b-batch
                - name: DYN_PARENT_DGD_K8S_NAME
                  value: qwen3-0-6b-batch
                - name: DYN_PARENT_DGD_K8S_NAMESPACE
                  value: ${NAMESPACE}
                - name: DYN_PLANNER_BATCH_REDIS_URL
                  value: redis://batch-gateway-valkey:6379/0
              volumeMounts:
                - name: planner-config
                  mountPath: /etc/dynamo/planner
                  readOnly: true
              resources:
                requests:
                  cpu: "1"
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
          volumes:
            - name: planner-config
              configMap:
                name: qwen3-0-6b-batch-planner-config
