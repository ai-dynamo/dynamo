# Preview template for an existing, separately qualified Parse deployment.
# Set the DGD name, namespace, served model alias, readiness name and storage.
# This file does not create inference workers or establish available capacity.
targetDGD:
  name: nemotron-parse
  namespace: dynamo-batch-example
model: nemotron-parse
readinessModel: nemotron-parse
asyncConcurrency: 64
storage:
  mode: external
  secretName: dynamo-batch-storage
  s3:
    region: us-east-1
    bucket: REPLACE_ME
    accessKeyId: REPLACE_ME
    endpoint: ""
    usePathStyle: false
