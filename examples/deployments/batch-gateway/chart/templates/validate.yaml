{{- $name := required "Render profile-external-storage.yaml with render_values.py before installing: targetDGD.name is required" .Values.targetDGD.name -}}
{{- $namespace := required "targetDGD.namespace is required" .Values.targetDGD.namespace -}}
{{- if ne $namespace .Release.Namespace -}}
{{- fail "Install dynamo-batch in targetDGD.namespace" -}}
{{- end -}}
{{- if ne (index .Values "batch-gateway").apiserver.fullnameOverride (printf "%s-batch-api" $name) -}}
{{- fail "batch-gateway.apiserver.fullnameOverride must match the target DGD's batch API Service" -}}
{{- end -}}
