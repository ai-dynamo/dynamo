apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: flux-image-agg
spec:
  components:
  - name: FluxImageWorker
    podTemplate:
      spec:
        containers:
        - args:
          - --model
          - black-forest-labs/FLUX.2-klein-4B
          command:
          - python
          - deploy/flux_image_worker.py
          env:
          - name: DYN_DISCOVERY_BACKEND
            value: kubernetes
          - name: LD_LIBRARY_PATH
            value: ""
          - name: HF_HOME
            value: /root/.cache/huggingface
          image: my-registry/flux-image-runtime:my-tag
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          volumeMounts:
          - mountPath: /root/.cache/huggingface
            name: huggingface-cache
          workingDir: /opt/app
        volumes:
        - name: huggingface-cache
          persistentVolumeClaim:
            claimName: huggingface-cache
    replicas: 1
    sharedMemorySize: 8Gi
    type: worker
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - args:
          - --http-port
          - "8000"
          command:
          - python
          - -m
          - dynamo.frontend
          env:
          - name: DYN_DISCOVERY_BACKEND
            value: kubernetes
          image: my-registry/flux-image-runtime:my-tag
          imagePullPolicy: IfNotPresent
          name: main
          workingDir: /opt/app
    replicas: 1
    type: frontend
