apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: riva-cascaded-profile
    literals:
      - LLM_TP_SIZE=2
      - LLM_GPU_COUNT=2
      - NIM_TAGS_SELECTOR=name=magpie-tts-multilingual,batch_size=64
resources:
  - ../base
replacements:
  - source:
      kind: ConfigMap
      name: riva-cascaded-profile
      fieldPath: data.LLM_GPU_COUNT
    targets:
      - select:
          kind: DynamoGraphDeployment
          name: riva-cascaded
        fieldPaths:
          - spec.components.[name=VllmWorker].podTemplate.spec.containers.[name=main].resources.limits.[nvidia.com/gpu]
          - spec.components.[name=VllmWorker].podTemplate.spec.containers.[name=main].resources.requests.[nvidia.com/gpu]
