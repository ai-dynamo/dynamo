apiVersion: v1
kind: Service
metadata:
  name: slime-sglang-rollout
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    dynamo.nvidia.com/slime-role: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: slime-sglang-control
spec:
  clusterIP: None
  ports:
    - name: system
      port: 9090
      targetPort: 9090
  selector:
    dynamo.nvidia.com/slime-role: worker
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: slime-sglang
spec:
  backendFramework: sglang
  components:
    - name: frontend
      type: frontend
      replicas: 1
      podTemplate:
        metadata:
          labels:
            dynamo.nvidia.com/slime-role: frontend
        spec:
          containers:
            - name: main
              image: ${DYNAMO_IMAGE}
              env:
                - name: DYN_SGLANG_ENABLE_GENERATE
                  value: "1"
    - name: worker
      type: worker
      replicas: 2
      podTemplate:
        metadata:
          labels:
            dynamo.nvidia.com/slime-role: worker
        spec:
          containers:
            - name: main
              image: ${DYNAMO_IMAGE}
              command:
                - python3
                - -m
                - dynamo.sglang
              args:
                - --model-path
                - ${MODEL_PATH}
                - --served-model-name
                - ${MODEL_PATH}
                - --tp
                - "1"
                - --trust-remote-code
                - --skip-tokenizer-init
              env:
                - name: DYN_SYSTEM_PORT
                  value: "9090"
                - name: DYN_SGLANG_ENGINE_ROUTES
                  value: >-
                    server_info=get_server_info pause_generation:tm flush_cache
                    init_weights_update_group update_weights_from_distributed:tm
                    destroy_weights_update_group continue_generation:tm
              resources:
                limits:
                  nvidia.com/gpu: "1"
