job_name: swe-one
jobs_dir: /work/jobs
n_attempts: 1
n_concurrent_trials: 1
agents:
  - import_path: dynamo_pi:DynamoPi
    model_name: dynamo/${SERVED_MODEL}
    kwargs:
      version: "0.72.1"
      thinking: "off"
      preinstalled: true
    env:
      DYNAMO_BASE_URL: ${MODEL_BASE_URL}
      DYNAMO_CONTEXT_WINDOW: "${MODEL_CONTEXT_WINDOW}"
      DYNAMO_MAX_TOKENS: "${MODEL_MAX_TOKENS}"
      DYN_AGENT_SESSION_FINAL: "${DYN_AGENT_SESSION_FINAL}"
environment:
  import_path: substrate_environment:SubstrateEnvironment
  delete: true
  kwargs:
    endpoint: ate-env-api.ate-env.svc:7777
    kube_context: in-cluster
    ate_cli: /work/kubectl-ate
    ate_endpoint: api.ate-system.svc:443
    ate_token_file: /var/run/secrets/ateapi/token
    egress_policy: /work/example/egress.yaml
    ready_timeout: 1200
    template_map:
      astropy__astropy-12907: ${ACTOR_TEMPLATE}
tasks:
  - path: /work/tasks/astropy__astropy-12907
