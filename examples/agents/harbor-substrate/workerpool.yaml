# Render SANDBOX_NODE with envsubst before applying. It must run atelet.
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: harbor-workers
  namespace: ate-env
  labels:
    demo.harbor.dev/sandbox: gvisor
spec:
  replicas: 1
  sandboxClasses:
  - configRef:
      name: gvisor-default
    name: gvisor
  template:
    nodeSelector:
      kubernetes.io/arch: amd64
      kubernetes.io/hostname: ${SANDBOX_NODE}
    resources:
      limits:
        cpu: '2'
        memory: 6Gi
      requests:
        cpu: '2'
        memory: 6Gi
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0-rc.1@sha256:b1911bc8a14097289575c06d9410b8077ae6a1bbef2ec8af89eaa837eee7e4ee
