# Defaults to amd64. For arm64, change both architecture labels and the hostname.
# Keep the actor template workerSelector aligned with the pool labels.
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: harbor-workers
  namespace: ate-env
  labels:
    demo.harbor.dev/sandbox: gvisor
    demo.harbor.dev/arch: amd64
spec:
  replicas: 1
  sandboxClasses:
  - configRef:
      name: gvisor-default
    name: gvisor
  template:
    nodeSelector:
      kubernetes.io/arch: amd64
      kubernetes.io/hostname: your-amd64-sandbox-node
    resources:
      limits:
        cpu: '2'
        memory: 6Gi
      requests:
        cpu: '2'
        memory: 6Gi
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0-rc.1@sha256:02a31963cdfb1d250d205a55fb870385b1ba5bad1be1308d556a6296f76bf145
