apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-tool-trace-tls
  namespace: ${MODEL_NAMESPACE}
data:
  stunnel.conf: |
    foreground = yes
    pid =
    [tool-events]
    accept = 0.0.0.0:20391
    connect = 127.0.0.1:20390
    cert = /tls/tls.crt
    key = /tls/tls.key
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-tool-events
  namespace: ${MODEL_NAMESPACE}
spec:
  selector:
    nvidia.com/dynamo-namespace: ${MODEL_NAMESPACE}-${DGD_NAME}
    nvidia.com/dynamo-component: Frontend
  ports:
    - name: tls-zmq
      port: 20391
      targetPort: 20391
