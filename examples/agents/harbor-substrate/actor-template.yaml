containers:
- command:
  - /ate/ko-app/ate-env-guest
  - -workspace
  - /
  env:
  - name: PORT
    value: '80'
  image: ${PREPARED_IMAGE}
  name: guest
  volumeMounts:
  - mountPath: /ate
    name: guest
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 80
  securityContext:
    capabilities:
      add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
metadata:
  name: ${ACTOR_TEMPLATE}
  atespace: ate-env
resources:
  limits:
    cpuMillicores: '1000'
    memoryBytes: '4294967296'
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
  goldenSnapshotConfig:
    mode: GOLDEN_SNAPSHOT_MODE_DISABLED
volumes:
- image:
    reference: ${GUEST_IMAGE}
  name: guest
workerSelector:
  matchLabels:
    demo.harbor.dev/sandbox: gvisor
