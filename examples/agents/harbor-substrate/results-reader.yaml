# Start only after the runner Job has finished. Delete before the next Job
# so a ReadWriteOnce volume can move to another node.
apiVersion: v1
kind: Pod
metadata:
  name: harbor-results
  namespace: ate-env
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: reader
      image: python:3.12-slim-bookworm@sha256:e697c81897302a4c4333bade000d98038fbb21eb064f8ee1fd42d02ebcd9d337
      command: [sleep, infinity]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: '1'
          memory: 512Mi
      volumeMounts:
        - name: results
          mountPath: /work/jobs
          readOnly: true
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: harbor-results
        readOnly: true
