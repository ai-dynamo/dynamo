# Substrate denies actor egress by default. The adapter applies this policy
# to each actor so Pi can send HTTP requests to the Dynamo endpoint.
# Match the protocol, hostname, and port to DYNAMO_BASE_URL in harbor-job.yaml.
# Other destinations remain blocked. See "Allow additional egress" in the tutorial.
rules:
  - http:
      # Hostname only: no scheme or path.
      hostnames:
        - glm53-flash-sglang-agg-gb200-frontend.inference.svc.cluster.local
      ports:
        # Match the endpoint's port.
        numbers: [8000]
