# Substrate access policy for the ate-env atespace. kubectl-ate authenticates
# with the runner's ServiceAccount token, whose principal is the Kubernetes
# form below. Editor covers creating and deleting actors, creating egress
# policies, and listing templates.
metadata:
  name: default
bindings:
  - role: editor
    members:
      - user:system:serviceaccount:ate-env:harbor-runner
