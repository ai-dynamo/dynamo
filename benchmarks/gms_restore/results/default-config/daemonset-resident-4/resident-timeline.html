n for an already-online resident rank; these intentionally measure the initialization moved outside the request timer.", "The payload load window begins at the first O_DIRECT read and ends when every transfer lane returns. Cold lanes close/free their pinned slots and FDs before returning; resident lanes drain copies and retain their rings. Thus 448 GiB/window is an effective load rate, not raw storage bandwidth or an exact last-GPU-copy timestamp. Allocation/import and pinned-buffer setup are distinct; setup can overlap early reads.", "The final wake/inference/readiness segment includes correctness generation and readiness observation. Native GMS wake logs have only coarse wall-clock timestamps, so their durations are reported without invented exact placement."]}],COLORS={"orchestration": "#a9adb8", "discovery": "#c09549", "init": "#6384b3", "context": "#8064ad", "allocation": "#db9e45", "buffers": "#7eacd0", "read": "#399f68", "publication": "#298287", "criu": "#b175ab", "prepare": "#e38a35", "transfer": "#68bdb5", "complete": "#d65859", "wait": "#c6b8a0", "inference": "#607d8b", "idle": "#e4e8ee", "operation": "#e4e8ee", "observation": "#d6dce5", "dispatch": "#a1bbc3"},LABELS={"orchestration": "Orchestration", "discovery": "Container discovery", "init": "Imports / server", "context": "CUDA context", "allocation": "Allocate / map", "buffers": "Pinned buffers", "read": "Payload load window", "publication": "Publish / validate", "criu": "CRIU", "prepare": "CUDA PREPARE", "transfer": "Residual transfer", "complete": "CUDA COMPLETE", "wait": "Wait for weights", "inference": "Wake / inference / readiness", "idle": "Prestarted and waiting", "operation": "Snapshot operation", "observation": "API status observation", "dispatch": "Dispatch / open payload"};let mode='rows';const selector=document.querySelector('#case'),rankSelector=document.querySelector('#rank');
