[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamo-decision-perf"
version = "0.1.0"
description = "Strict decision API qualification adapters for AIPerf"
requires-python = ">=3.12"
dependencies = ["aiperf==0.13.0", "psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "pytest-timeout>=2"]
tokenizer = ["transformers==5.19.0"]

[project.entry-points."aiperf.plugins"]
dynamo_decision_perf = "dynamo_decision_perf:plugins.yaml"

[tool.setuptools.package-data]
dynamo_decision_perf = ["plugins.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: CPU unit tests",
    "gpu_0: no GPU required",
    "pre_merge: fast regression tests",
    "integration: process and service integration tests",
    "post_merge: opt-in extended qualification",
    "timeout: maximum test duration",
]
