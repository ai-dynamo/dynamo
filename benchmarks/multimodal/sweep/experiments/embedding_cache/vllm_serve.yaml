# Qwen3.5-122B two-arm native embedding-cache comparison on 2xH100.
# Repeated image payloads carry stable UUIDs and are stripped after their first
# use in each session. The mm processor cache is deliberately identical across
# arms; only the post-encoder embedding-cache connector changes.

model: Qwen/Qwen3.5-122B-A10B-FP8
concurrencies: [30]
osl: 1024
conversation_num: 30
warmup_count: 2
port: 8000
timeout: 2400
output_dir: /dynamo-tmp/logs/09-15/qwen35-122b-vllm-ec-h2d-overlap/default
skip_plots: true
restart_server_every_benchmark: true
uuid_and_strip: true

env:
  DYN_DISABLE_NSYS: "1"
  DYN_HTTP_BODY_LIMIT_MB: "200"
  VLLM_USE_V2_MODEL_RUNNER: "1"

input_files:
  - /dynamo-tmp/data/30u_8t_5w_8000word_base64_uuid_seed42.jsonl

configs:
  - label: vllm-serve
    workflow: benchmarks/multimodal/sweep/workflows/vllm_serve.sh
    extra_args:
      - --tensor-parallel-size
      - "2"
      - --quantization
      - fp8
      - --enable-expert-parallel
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "32768"
      - --max-num-batched-tokens
      - "32768"
      - --max-num-seqs
      - "50"
      - --mm-encoder-tp-mode
      - data
      - --mm-processor-cache-gb
      - "30"
      - --limit-mm-per-prompt
      - '{"image":5}'
      - --no-enable-prefix-caching
      - --no-enable-log-requests

  - label: vllm-serve-native-ec
    workflow: benchmarks/multimodal/sweep/workflows/vllm_serve.sh
    extra_args:
      - --tensor-parallel-size
      - "2"
      - --quantization
      - fp8
      - --enable-expert-parallel
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "32768"
      - --max-num-batched-tokens
      - "32768"
      - --max-num-seqs
      - "50"
      - --mm-encoder-tp-mode
      - data
      - --mm-processor-cache-gb
      - "30"
      - --limit-mm-per-prompt
      - '{"image":5}'
      - --no-enable-prefix-caching
      - --no-enable-log-requests
      - --ec-transfer-config
      - '{"ec_connector":"ECCPUConnector","ec_role":"ec_both","ec_connector_extra_config":{"ec_cpu_bytes":4294967296}}'

  # Dynamo EC is parked while this experiment isolates native vLLM EC.
  # - label: vllm-serve-dynamo-ec
  #   workflow: benchmarks/multimodal/sweep/workflows/vllm_serve.sh
  #   extra_args:
  #     - --tensor-parallel-size
  #     - "2"
  #     - --quantization
  #     - fp8
  #     - --enable-expert-parallel
  #     - --gpu-memory-utilization
  #     - "0.90"
  #     - --max-model-len
  #     - "32768"
  #     - --max-num-batched-tokens
  #     - "32768"
  #     - --max-num-seqs
  #     - "50"
  #     - --mm-encoder-tp-mode
  #     - data
  #     - --mm-processor-cache-gb
  #     - "30"
  #     - --limit-mm-per-prompt
  #     - '{"image":5}'
  #     - --no-enable-prefix-caching
  #     - --no-enable-log-requests
  #     - --multimodal-embedding-cache-capacity-gb
  #     - "4"

