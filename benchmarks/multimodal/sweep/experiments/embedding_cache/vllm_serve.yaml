  #     - fp8
  #     - --enable-expert-parallel
  #     - --gpu-memory-utilization
  #     - "0.90"
  #     - --max-model-len
  #     - "65536"
  #     - --max-num-batched-tokens
  #     - "32768"
  #     - --max-num-seqs
  #     - "50"
  #     - --mm-encoder-tp-mode
  #     - data
  #     - --mm-processor-cache-gb
  #     - "30"
  #     - --limit-mm-per-prompt
  #     - '{"image":10}'
  #     - --chat-template
  #     - /dynamo-tmp/data/qwen35_shared_system_8000.jinja
  #     - --enable-prefix-caching
  #     - --enable-prompt-tokens-details
  #     - --no-enable-log-requests

  - label: vllm-serve-native-ec-baseline
    workflow: benchmarks/multimodal/sweep/workflows/vllm_serve.sh
    env:
      PYTHONPATH: "${VLLM_BASELINE_PYTHONPATH}"
      DYN_VLLM_SOURCE_REVISION: "${VLLM_BASELINE_SOURCE_REVISION}"
      DYN_VLLM_EXPECTED_ROOT: "${VLLM_BASELINE_PYTHONPATH}"
    extra_args:
      - --tensor-parallel-size
      - "2"
      - --quantization
      - fp8
      - --enable-expert-parallel
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "65536"
      - --max-num-batched-tokens
      - "32768"
      - --max-num-seqs
      - "50"
      - --mm-encoder-tp-mode
      - data
      - --mm-processor-cache-gb
      - "30"
      - --limit-mm-per-prompt
      - '{"image":10}'
      - --chat-template
      - /dynamo-tmp/data/qwen35_shared_system_8000.jinja
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --no-enable-log-requests
      - --ec-transfer-config
      - '{"ec_connector":"ECCPUConnector","ec_role":"ec_both","ec_connector_extra_config":{"ec_cpu_bytes":8589934592}}'

  - label: vllm-serve-native-ec-overlap
    workflow: benchmarks/multimodal/sweep/workflows/vllm_serve.sh
    env:
      PYTHONPATH: "${VLLM_PATCHED_PYTHONPATH}"
      DYN_VLLM_SOURCE_REVISION: "${VLLM_PATCHED_SOURCE_REVISION}"
      DYN_VLLM_EXPECTED_ROOT: "${VLLM_PATCHED_PYTHONPATH}"
    extra_args:
      - --tensor-parallel-size
      - "2"
      - --quantization
      - fp8
      - --enable-expert-parallel
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "65536"
      - --max-num-batched-tokens
      - "32768"
      - --max-num-seqs
      - "50"
      - --mm-encoder-tp-mode
      - data
      - --mm-processor-cache-gb
      - "30"
      - --limit-mm-per-prompt
      - '{"image":10}'
      - --chat-template
      - /dynamo-tmp/data/qwen35_shared_system_8000.jinja
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --no-enable-log-requests
      - --ec-transfer-config
      - '{"ec_connector":"ECCPUConnector","ec_role":"ec_both","ec_connector_extra_config":{"ec_cpu_bytes":8589934592}}'

  # Dynamo EC is parked while this experiment isolates native vLLM EC.
