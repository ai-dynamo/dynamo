# Qwen3.5-122B native CPU embedding-cache comparison on two GPUs. A custom
# server-side chat template injects the same 8000-token system prompt into
# every request while AIPerf keeps its stock input-file and UUID-strip paths.
# The only measured difference is the vLLM source tree: synchronous native EC
# baseline versus same-step H2D / vision-encoder overlap.

model: Qwen/Qwen3.5-122B-A10B-FP8
concurrencies: [30]
osl: 1024
conversation_num: 30
warmup_count: 2
port: 8000
timeout: 2400
output_dir: /dynamo-tmp/logs/09-16/qwen35-122b-vllm-ec-h2d-overlap-shared8k/default
skip_plots: true
restart_server_every_benchmark: true
uuid_and_strip: true
prompt_manifest: /dynamo-tmp/data/qwen35_ec_h2d_overlap_manifest.json
# Qwen3.5's hybrid Mamba/KV cache aligns this 8026-token rendered prompt to
# 6288 reusable tokens. Require a stable majority hit without assuming pure-KV
# block accounting.
prefix_cache_probe_min_cached_tokens: 6000

env:
  DYN_DISABLE_NSYS: "1"
  DYN_HTTP_BODY_LIMIT_MB: "200"
  VLLM_USE_V2_MODEL_RUNNER: "1"

input_files:
  - /dynamo-tmp/data/30u_8t_5w_shared8k_base64_uuid_seed42.jsonl
  - /dynamo-tmp/data/30u_8t_10w_shared8k_base64_uuid_seed42.jsonl

configs:
  # The no-EC control is intentionally parked: this experiment isolates the
  # scheduling difference between two otherwise identical native EC servers.
