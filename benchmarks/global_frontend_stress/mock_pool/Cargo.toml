[package]
name = "mock-pool"
version = "0.1.0"
edition = "2024"
publish = false
description = "A minimal OpenAI pool frontend for Global Frontend stress tests"

# Not part of the Dynamo workspace: it builds on its own, with its own lockfile.
[workspace]

[dependencies]
bytes = "=1.12.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.10.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.17", features = ["tokio"] }
memchr = "=2.8.1"
tokio = { version = "=1.54.0", features = ["macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "=1.54.0", features = ["test-util"] }

[profile.release]
debug = "line-tables-only"
