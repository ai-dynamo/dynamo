default_policy_family: regular
uncached_isl_buckets:
  - min_tokens: 0
    bucket: all
# The workload uses 512-token uncached prompts. Keeping each quantum at or
# below one request cost makes the observed share independent of how many
# worker slots become available in each scheduler wakeup.
# The busy comparison is strict. A 1,536-token threshold lets four 512-token
# sequences fill the Mocker; at 2,048 active tokens, later requests queue.
policy_classes:
  - name: premium
    policy_family: premium
    cache_bucket: all
    queue_policy: fcfs
    quantum: 512
    prefill_busy_threshold: 1536
    request_queue_limit_per_worker: 1024
  - name: regular
    policy_family: regular
    cache_bucket: all
    queue_policy: fcfs
    quantum: 512
    prefill_busy_threshold: 1536
    request_queue_limit_per_worker: 1024
