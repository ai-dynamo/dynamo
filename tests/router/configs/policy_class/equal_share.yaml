default_policy_class: regular
# The workload uses 512-token uncached prompts. Keeping each quantum at or
# below one request cost makes the observed share independent of how many
# worker slots become available in each scheduler wakeup.
# The busy comparison is strict. A 1,536-token threshold lets four 512-token
# sequences fill the Mocker; at 2,048 active tokens, later requests queue.
policy_classes:
  - name: premium
    queue_policy: fcfs
    quantum: 512
    prefill_busy_threshold: 1536
    request_queue_limit_per_worker: 1024
  - name: regular
    queue_policy: fcfs
    quantum: 512
    prefill_busy_threshold: 1536
    request_queue_limit_per_worker: 1024

# Route on load alone: no cache credit, no KV events, and active load tracked
# without assuming KV reuse.
router:
  use_kv_events: false
  router_track_active_blocks: true
  router_track_prefill_tokens: true
  router_assume_kv_reuse: false
  use_remote_indexer: false
  serve_indexer: false
  shared_cache_type: none
  router_predicted_ttl_secs: null
worker_selection:
  aggregated:
    type: dynamo-default-cost-fn
    parameters:
      overlap_score_credit: 0
      shared_cache_multiplier: 0
