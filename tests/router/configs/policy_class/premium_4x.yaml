default_policy_class: regular
# The workload uses 512-token uncached prompts. These quanta express a 4:1
# service ratio without carrying enough credit for a multi-request burst
# across worker-capacity wakeups.
# The busy comparison is strict. A 1,536-token threshold lets four 512-token
# sequences fill the Mocker; at 2,048 active tokens, later requests queue.
# Both classes carry the same generous SLO so the measured split isolates the
# quantum ratio: no request expires and deadline order is arrival order.
policy_classes:
  - name: premium
    slo_ms: 600000
    quantum: 512
    prefill_busy_threshold: 1536
    request_queue_limit_per_worker: 1024
  - name: regular
    slo_ms: 600000
    quantum: 128
    prefill_busy_threshold: 1536
    request_queue_limit_per_worker: 1024
