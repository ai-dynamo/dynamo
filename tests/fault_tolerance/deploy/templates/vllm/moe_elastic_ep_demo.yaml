#
# Elastic EP Scaling Demo Deployment
#
# ONE POD PER DATA-PARALLEL RANK. You declare a single worker component; the operator
# derives the rest. --data-parallel-size 2 renders TWO pods: this component as the leader
# (rank 0, and the Ray head), plus one synthesized follower named "<leader>-flw" that runs
# a bare `ray start` and lends the leader its GPU. The leader spawns the real rank onto it
# as a Ray actor.
#
# This fixture previously reserved 4 GPUs in ONE pod and grew data-parallel-size into them
# in place. That is a standby-capacity shape, not an elastic one: it pre-buys the peak and
# never returns a GPU when it shrinks. It also renders differently now -- on a non-Grove
# cluster the operator derives a follower from it, so the deep-copied 4-GPU request is made
# twice and the deployment holds 8 GPUs to use 2.
#
# One GPU per pod, so the declaration and the cost agree: dp=2 is 2 pods, 2 GPUs, 2 ranks,
# nothing idle. Shrinking removes a pod and gives the GPU back.
#
# Requirements:
#   - 2 nodes with 1 free GPU each. The follower carries an anti-affinity that keeps it off
#     the leader's node, and a pod affinity that keeps it in the leader's NVLink partition.
#   - data-parallel-backend=ray (required for elastic EP)
#   - Model: deepseek-ai/DeepSeek-V2-Lite (small MoE, ~16B, 64 routed experts)
#   - Every data-parallel size you intend to scale to must divide the EPLB slot count,
#     which is (routed experts + num_redundant_experts). This fixture sets 8 redundant for
#     72 slots, so dp = 2, 3, 4, 6, 8, 9, 12 all work. See that flag below before changing
#     the model or the width.
#
# CHANGING THE WIDTH TAKES TWO STEPS, in opposite order for grow and shrink, because
# Kubernetes owns whether a pod exists and vLLM owns whether its GPU is used. Nothing in
# the operator calls scale_elastic_ep yet (Phase 6/7), so both steps are manual today:
#
#   grow    kubectl patch dcd <leader>-flw --type=merge -p '{"spec":{"replicas":3}}'
#           wait for the new pods to join Ray
#           POST /scale_elastic_ep {"new_data_parallel_size": 4}
#
#   shrink  POST /scale_elastic_ep {"new_data_parallel_size": 2}   # drain the ranks FIRST
#           kubectl patch dcd <leader>-flw --type=merge -p '{"spec":{"replicas":1}}'
#
# Deleting a follower pod that still holds a live rank leaves the engine committed to a
# data-parallel size whose members are gone (DYN-3838, DYN-2660), which is why the drain
# comes first on the way down.

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-elastic-ep-demo
spec:
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      extraPodSpec:
        mainContainer:
          # Update tag to match worker image below
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
    worker:
      envFromSecret: hf-token-secret
      componentType: worker
      # replicas is the number of LEADERS and must stay 1: the leader is the Ray head, and
      # width is added with followers, not more leaders. Admission rejects replicas > 1 for
      # an elastic-EP component when the feature gate is on.
      replicas: 1
      resources:
        requests:
          memory: "60Gi"
          # One rank per pod at tp=1, so one GPU per pod. The follower is a deep copy of
          # this component, so whatever is requested here is requested again for every
          # follower -- asking for 4 here would hold 8 GPUs across the two pods to run
          # two ranks.
          gpu: "1"
        limits:
          memory: "120Gi"
          gpu: "1"
      envs:
        - name: DYN_SYSTEM_ENABLED
          value: "true"
        # allgather_reducescatter: no PPLX infrastructure required, works for demo
        # Switch to "pplx" for production MoE workloads with PPLX cluster
        - name: VLLM_ALL2ALL_BACKEND
          value: "allgather_reducescatter"
        - name: VLLM_USE_ELASTIC_EP
          value: "1"
        - name: VLLM_USE_V1
          value: "1"
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: "spawn"
        # One GPU per pod, so one visible device. Ray places this pod's single rank on it;
        # the other ranks live in their own pods.
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: VLLM_LOGGING_LEVEL
          value: "INFO"
        # Speed up HF downloads and improve 429 rate-limit resilience
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "1"
        # Point HF cache to the PVC so the model is loaded from local storage
        - name: HF_HOME
          value: "/model-cache"
      extraPodSpec:
        imagePullSecrets:
        - name: nvcr-imagepullsecret
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0
          imagePullPolicy: Always
          workingDir: /workspace/examples/backends/vllm
          volumeMounts:
          - name: model-cache
            mountPath: /model-cache
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
            - --model
            - deepseek-ai/DeepSeek-V2-Lite
            - --trust-remote-code
            # tp=1: one GPU per rank. With one rank per pod, that is one GPU per pod.
            - --tensor-parallel-size
            - "1"
            # The declared width. The operator reads this to derive the follower count
            # (dp - 1, since the leader holds rank 0) and to make the leader wait for that
            # many Ray nodes before starting -- vLLM reads the cluster once at engine start
            # and never retries, so without the wait the launch is a race.
            # The operator also injects --data-parallel-size-local 1 to pin the leader to
            # its own single rank; set it yourself only if you mean to override that.
            - --data-parallel-size
            - "2"
            # REQUIRED for elastic EP — Ray backend manages dynamic worker lifecycle
            - --data-parallel-backend
            - ray
            - --gpu-memory-utilization
            - "0.8"
            - --max-model-len
            - "4096"
            - --enable-expert-parallel
            - --enable-elastic-ep
            - --enable-eplb
            # EPLB distributes (n_routed_experts + num_redundant_experts) evenly across the
            # EP ranks. With tp=1 the EP size IS the data-parallel size, so this value
            # decides which dp values the engine can LAUNCH at.
            #
            # It binds at launch, not when scaling. scale_elastic_ep derives its own
            # redundancy per step to keep the per-rank slot count fixed, so a running engine
            # can reach widths it could not have started at -- which is why
            # bare_multinode_elastic_ep.yaml walks dp=2->3->4 at 0 redundant (#8183).
            # THIS deployment declares its width up front: the operator reads
            # --data-parallel-size to size the follower set, so the engine cold-starts at
            # the declared width and the launch rule is the one that applies.
            #
            # DeepSeek-V2-Lite has 64 routed experts (the 2 shared experts are replicated
            # per rank, not sharded, so they do not count). 8 redundant gives 72 slots,
            # which divides by 2, 3 and 4 -- 36 / 24 / 18.
            #
            # Do not set this to 0 to "keep it simple". 64 divides by 2 and 4 but not 3, so
            # raising --data-parallel-size to 3 would fail at startup with
            #   ValueError: EPLB currently only supports even distribution of experts
            #               across ranks. Got 64 experts and 3 EP ranks.
            # Verified on gb300: this fixture at dp=3 with 0 redundant CrashLoops on exactly
            # that error, and at 8 redundant it starts and serves.
            - --eplb-config.num_redundant_experts
            - "8"
            - --no-enable-prefix-caching
            - --enforce-eager
