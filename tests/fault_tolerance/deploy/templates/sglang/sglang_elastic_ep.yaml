#
# SGLang Elastic EP Scale-Up Deployment (single node, warm standby)
#
# Drives the Dynamo SGLang worker's elastic-EP scale-up control, which calls
# SGLang's native runtime API:
#
#   POST /engine/control/scale_elastic_ep {"new_ep_size": <int>}   (leader system port 9090)
#   GET  /engine/control/is_scaling_elastic_ep                     (poll for completion)
#
# HOW SGLANG ELASTIC EP WORKS
# ---------------------------
#   * The running server is the "primary group". Scaling up requires a SEPARATE
#     "joining group" process, launched with
#       --elastic-ep-join-mode scale --elastic-ep-join-rank-offset <current_ep_size>
#     pointing at the primary's --dist-init-addr. Once the joiner's GPUs are up,
#     POSTing scale_elastic_ep integrates them and redistributes experts (ePLB).
#   * Only SCALE-UP is supported today: SGLang rejects a target below the
#     current EP size. The request field is "new_ep_size" (the target EP ranks).
#
# REQUIREMENTS
# ------------
#   * SGLang >= 0.5.16 in the runtime image (older builds have no
#     tokenizer_manager.scale_elastic_ep; the Dynamo worker capability-gates the
#     route and simply will not expose it there).
#   * A MoE model with DP-attention (here: deepseek-ai/DeepSeek-V2-Lite).
#   * 8 GPUs on ONE node: 4 for the primary group (--elastic-ep-initial-size 4),
#     4 idle warm-standby GPUs for the joining group (scale 4 -> 8).
#   * RDMA / InfiniBand for the mooncake weight-transfer backend. Set
#     --mooncake-ib-device to the node's IB device list before applying.
#   * A mooncake-transfer-engine build whose torch ProcessGroup extension matches
#     the image's exact torch. The worker checks this at startup and names the
#     mismatch, rather than failing from inside engine code after model load.
#   * DYN_SYSTEM_ENABLED=true so the leader exposes the :9090 system server that
#     serves /engine/control/*.
#   * BOTH the decode and the prefill CUDA graph disabled, passed explicitly
#     below: SGLang asserts this for elastic-EP scale-up and exits on startup.
#   * The BF16 DeepGEMM expert path, forced by the three settings below
#     (SGLANG_DEEPEP_BF16_DISPATCH, SGLANG_NIXL_EP_BF16_DISPATCH,
#     --moe-runner-backend deep_gemm). DeepSeek-V2-Lite is unquantized, and in
#     SGLang 0.5.21 and 0.5.22 (still unfixed upstream as of 2026-10-19) the
#     unquantized BF16 MoE gate in ep_moe/layer.py only covers the deepep and
#     pplx a2a backends, not nixl. Without these, the first MoE forward lands on
#     `assert False, "forward_deepgemm_masked is deprecated"` and the worker
#     crash-loops (NVBug 6912358 / DYN-4850). SGLang's own elastic-EP tests never
#     hit this: they use a different checkpoint (lmsys/sglang-ci-dsv3-test) and
#     pass none of these knobs.
#     The joiner in run_sglang_elastic_ep_scale_up_test.sh passes the same three.
#   * The NIXL-EP low-latency dispatch budget raised to 1024 tokens per rank
#     (SGLANG_NIXL_EP_NUM_MAX_DISPATCH_TOKENS_PER_RANK, default 128, 1024 is the
#     maximum) together with --chunked-prefill-size 1024, as SGLang's own scale
#     test does. With --deepep-mode low_latency every prefill chunk goes through
#     that dispatcher; SGLang divides the chunk across the DP ranks (1024 / 4 =
#     256 tokens per rank) and nixl_ep aborts the process on any batch above the
#     budget, so the default 8192-token chunk fails on the first real prompt.
#   * A lenient liveness probe (below, on the worker container). The scale-up
#     pauses serving for a few seconds while DeepGEMM recompiles for the new
#     expert-group count; the operator's default probe kills the worker then.
#   * --moe-dense-tp-size 1 on the primary and the joiner, as in SGLang's own
#     scale test; with the dense MLP sharded over TP the joiner's first forward
#     after admission fails (see the comment at the flag).
#
# The joining group is NOT launched by the operator yet (that orchestration is
# tracked separately). The accompanying run_sglang_elastic_ep_scale_up_test.sh
# launches it manually via `kubectl exec` on the worker pod's idle GPUs, then
# drives the scale-up.

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: sglang-elastic-ep
spec:
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: ${IMAGE}
    SGLangDecodeWorker:
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: 1
      resources:
        requests:
          memory: "60Gi"
          # Reserve the whole node: 4 GPUs run the primary EP group, the other 4
          # are idle warm standby that the joining group claims on scale-up.
          gpu: "8"
        limits:
          memory: "120Gi"
          gpu: "8"
      envs:
        # Required: exposes the :9090 system server that serves the
        # /engine/control/scale_elastic_ep and /engine/control/is_scaling_elastic_ep
        # routes registered by the SGLang worker.
        - name: DYN_SYSTEM_ENABLED
          value: "true"
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "1"
        - name: HF_HOME
          value: "/model-cache"
        # Rendezvous address the joining group dials on scale-up.
        - name: SGLANG_ELASTIC_SCALE_DIST_INIT
          value: "127.0.0.1:24555"
        # Unquantized (BF16) experts over the nixl a2a backend: route the MoE
        # layer through the modern FusedMoE/DeepGEMM path and make the nixl
        # dispatcher ship BF16 activations (together with --moe-runner-backend
        # deep_gemm below). See the header for why all three are required.
        - name: SGLANG_DEEPEP_BF16_DISPATCH
          value: "1"
        - name: SGLANG_NIXL_EP_BF16_DISPATCH
          value: "1"
        # NIXL-EP low-latency dispatch budget per rank (default 128, maximum
        # 1024); paired with --chunked-prefill-size 1024 below. See the header.
        - name: SGLANG_NIXL_EP_NUM_MAX_DISPATCH_TOKENS_PER_RANK
          value: "1024"
      extraPodSpec:
        imagePullSecrets:
        - name: nvcr-imagepullsecret
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        mainContainer:
          image: ${IMAGE}
          imagePullPolicy: Always
          workingDir: /workspace/examples/backends/sglang
          volumeMounts:
          - name: model-cache
            mountPath: /model-cache
          # A scale-up pauses serving for a few seconds: the first forward at the
          # new EP size JIT-compiles the DeepGEMM kernels for the new expert-group
          # count, Dynamo's health check (3 s timeout) flips /live to 503 meanwhile,
          # and the operator's default liveness probe (period 5 s, failureThreshold
          # 3) kills the worker right after a successful scale. Tolerate it.
          livenessProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 30
            failureThreshold: 20
            timeoutSeconds: 10
          command:
          - python3
          - -m
          - dynamo.sglang
          args:
            - --model-path
            - deepseek-ai/DeepSeek-V2-Lite
            - --served-model-name
            - deepseek-ai/DeepSeek-V2-Lite
            - --trust-remote-code
            - --skip-tokenizer-init
            - --page-size
            - "16"
            # Keeps every per-rank prefill chunk (1024 / dp 4 = 256 tokens) under
            # the NIXL-EP dispatch budget set by
            # SGLANG_NIXL_EP_NUM_MAX_DISPATCH_TOKENS_PER_RANK above.
            - --chunked-prefill-size
            - "1024"
            # DP-attention MoE: the primary group runs EP size 4 (4 GPUs).
            - --tp
            - "4"
            - --dp
            - "4"
            - --enable-dp-attention
            - --enable-dp-lm-head
            # Dense (non-MoE) MLP layers stay local to each DP rank, as in
            # SGLang's own scale test. Without it the joiner's first forward
            # after admission (an idle DP-attention batch) dies in
            # fused_add_rmsnorm with "Mismatched mR.shape[0]" and the primary
            # hangs on the lost ranks.
            - --moe-dense-tp-size
            - "1"
            # All-to-all + elastic-EP weight transfer backends.
            - --moe-a2a-backend
            - nixl
            - --deepep-mode
            - low_latency
            # BF16 DeepGEMM expert runner (with the two SGLANG_*_BF16_DISPATCH
            # envs above); nixl + unquantized experts has no other working path.
            - --moe-runner-backend
            - deep_gemm
            - --elastic-ep-backend
            - mooncake
            # REQUIRED: set to the node's IB device list, e.g. "mlx5_0,mlx5_1".
            - --mooncake-ib-device
            - "SET-ME"
            # ePLB keeps experts balanced across the (growing) EP group.
            - --enable-eplb
            - --ep-num-redundant-experts
            - "24"
            # Start at EP 4; allow growth up to EP 8 on scale-up.
            - --elastic-ep-initial-size
            - "4"
            - --max-ep-size
            - "8"
            - --cuda-graph-backend-decode
            - disabled
            - --cuda-graph-backend-prefill
            - disabled
            # Stable rendezvous address the joining group dials on scale-up.
            # Sourced from SGLANG_ELASTIC_SCALE_DIST_INIT (single source of truth).
            - --dist-init-addr
            - "$(SGLANG_ELASTIC_SCALE_DIST_INIT)"
