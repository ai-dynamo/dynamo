#
# Growth-only EP1 -> EP2 proof. Build IMAGE from this branch and render IMAGE,
# NATS_SERVER, ETCD_ENDPOINTS and SGLANG_MOONCAKE_IB_DEVICE with envsubst.
# The operator needs Grove CRDs/controllers and permission to scale member cliques.
# Apply this fixture, then run run_sglang_elastic_ep_engine_group_poc.sh.
#
# The dedicated PCS owns engine capacity; the separate DGD owns only the frontend.
# This avoids a DGD reconciler resetting the live member-clique count to its seed.
# Every capacity Pod runs the same template. Grove injects its stable slot index
# and rendezvous DNS; the isolated bootstrap launcher selects primary or joiner.
# Pod readiness means allocation availability, not committed serving membership.
# Recovery, shrink and automatic world recreation are intentionally unsupported.

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: sglang-elastic-ep-poc
spec:
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      envs:
      - name: DYN_NAMESPACE
        value: sglang-elastic-ep-poc
      - name: NATS_SERVER
        value: ${NATS_SERVER}
      - name: ETCD_ENDPOINTS
        value: ${ETCD_ENDPOINTS}
      extraPodSpec:
        mainContainer:
          image: ${IMAGE}
---
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: sglang-elastic-ep-poc-capacity
spec:
  replicas: 1
  updateStrategy:
    type: OnDelete
  template:
    headlessServiceConfig:
      publishNotReadyAddresses: true
    podCliqueScalingGroups:
    - name: world
      replicas: 1                       # independent engine world
      minAvailable: 1
      cliqueNames: [members]
    cliques:
    - name: members
      labels:
        nvidia.com/dynamo-engine-group: sglang-elastic-ep-poc
        nvidia.com/dynamo-scale-representative: "true"
      spec:
        replicas: 1                     # initial EP1 capacity; live /scale grows to 2
        minAvailable: 1
        podSpec:
          restartPolicy: Never          # no uncoordinated in-container engine restart
          imagePullSecrets:
          - name: nvcr-imagepullsecret
          volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: model-cache
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 8Gi
          containers:
          - name: main
            image: ${IMAGE}
            imagePullPolicy: Always
            envFrom:
            - secretRef:
                name: hf-token-secret
            env:
            - name: DYN_NAMESPACE
              value: sglang-elastic-ep-poc
            - name: NATS_SERVER
              value: ${NATS_SERVER}
            - name: ETCD_ENDPOINTS
              value: ${ETCD_ENDPOINTS}
            - name: DYN_SYSTEM_ENABLED
              value: "true"
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            - name: HF_HOME
              value: /model-cache
            resources:
              requests:
                memory: 30Gi
                nvidia.com/gpu: "1"
              limits:
                memory: 60Gi
                nvidia.com/gpu: "1"
            volumeMounts:
            - name: model-cache
              mountPath: /model-cache
            - name: shm
              mountPath: /dev/shm
            command: [python3, -m, dynamo.sglang.elastic_ep_bootstrap]
            args:
            - --model-path
            - deepseek-ai/DeepSeek-V2-Lite
            - --served-model-name
            - deepseek-ai/DeepSeek-V2-Lite
            - --trust-remote-code
            - --skip-tokenizer-init
            - --page-size
            - "16"
            - --tp
            - "1"
            - --dp
            - "1"
            - --nnodes
            - "1"
            - --enable-dp-attention
            - --enable-dp-lm-head
            - --moe-a2a-backend
            - nixl
            - --deepep-mode
            - low_latency
            - --elastic-ep-backend
            - mooncake
            - --mooncake-ib-device
            - ${SGLANG_MOONCAKE_IB_DEVICE}
            - --load-balance-method
            - round_robin
            - --enable-eplb
            - --ep-num-redundant-experts
            - "24"
            - --elastic-ep-initial-size
            - "1"
            - --max-ep-size
            - "2"
            - --disable-cuda-graph
            - --dist-init-addr
            - 0.0.0.0:24555            # port only; launcher derives Grove slot-zero DNS
