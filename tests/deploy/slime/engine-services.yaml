#
# The Slime tutorial's engine Services ("Create the engine Services"). Each one
# selects the Pod of one DGD worker in dgd.yaml and exposes its native SGLang
# API, which Slime uses for control and weight updates.
apiVersion: v1
kind: Service
metadata:
  name: slime-sglang-engine-0
spec:
  selector:
    dynamo.nvidia.com/slime-role: worker-0
  ports:
    - name: sglang-http
      port: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: slime-sglang-engine-1
spec:
  selector:
    dynamo.nvidia.com/slime-role: worker-1
  ports:
    - name: sglang-http
      port: 30000
