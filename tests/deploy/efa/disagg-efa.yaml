#
# Minimal vLLM disaggregated deployment for the EFA verification deploy test
# (tests/deploy/test_deploy_efa.py).
#
# Deliberately NOT under examples/backends/*/deploy/, so the auto-discovered
# deploy-test matrix (tests/deploy/conftest.py) never picks it up. It only runs
# on an EFA-capable cluster, via the framework_with_efa marker.
#
# Kept small: Qwen3-0.6B and TP=1 per worker, which still exercises the whole
# EFA path -- a disaggregated completion cannot succeed without a prefill->decode
# KV transfer, and with the LIBFABRIC kv-transfer-config below that transfer
# rides NIXL -> LIBFABRIC -> EFA.
#
# Two things are intentionally absent:
#
#   * No tolerations or nodeSelector. On the CI clusters the Kyverno policy
#     deploy-test-pod-policy injects them for any pod requesting a GPU in the
#     dynamo-deploy-test namespace, and what it injects differs per cluster
#     (an H100 ci-pool label on aws-dev-02, a GB200 gpu.product label on
#     aws-dev-01). Hardcoding either one here would break the other.
#
#   * No LD_LIBRARY_PATH or PATH override. The -efa image sets NIXL_PLUGIN_DIR
#     and LD_PRELOAD itself (container/templates/aws.Dockerfile), and those paths
#     are arch-dependent. Overriding them here would mask exactly the packaging
#     regression tests/container/test_efa_image.py exists to catch.
#
# The image: fields are placeholders; the test overrides every one of them via
# DeploymentSpec.set_image(--image) with the -efa image under test.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-disagg-efa
spec:
  components:
  - name: Frontend
    replicas: 1
    type: frontend
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:efa
  - name: VllmPrefillWorker
    replicas: 1
    type: prefill
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:efa
          workingDir: /workspace/examples/backends/vllm
          command: [python3, -m, dynamo.vllm]
          args:
          - --model
          - Qwen/Qwen3-0.6B
          - --served-model-name
          - Qwen/Qwen3-0.6B
          - --disaggregation-mode
          - prefill
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_connector_extra_config":{"backends":["LIBFABRIC"]}}'
          envFrom:
          - secretRef:
              name: hf-token-secret
          env:
          - { name: FI_PROVIDER, value: efa }
          # FI_LOG_LEVEL=info is what surfaces the libfabric:...:efa:mr: memory
          # registration lines the test greps for as proof of the LIBFABRIC path.
          - { name: FI_LOG_LEVEL, value: info }
          - { name: FI_EFA_USE_DEVICE_RDMA, value: "1" }
          - { name: FI_EFA_ENABLE_SHM_TRANSFER, value: "0" }
          - { name: NIXL_TELEMETRY_ENABLE, value: "y" }
          - { name: NIXL_TELEMETRY_EXPORTER, value: prometheus }
          - { name: NIXL_TELEMETRY_PROMETHEUS_PORT, value: "19090" }
          securityContext:
            capabilities:
              add: ["IPC_LOCK", "SYS_PTRACE"]
          resources:
            # nvidia.com/gpu is set on BOTH requests and limits on purpose: the
            # Kyverno rule that injects the node targeting keys off
            # spec.containers[].resources.requests."nvidia.com/gpu" > 0, so
            # relying on requests being defaulted from limits would make the
            # injection depend on admission ordering.
            requests:
              nvidia.com/gpu: "1"
              vpc.amazonaws.com/efa: "1"
              ephemeral-storage: 8Gi
            limits:
              nvidia.com/gpu: "1"
              vpc.amazonaws.com/efa: "1"
  - name: VllmDecodeWorker
    replicas: 1
    type: decode
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:efa
          workingDir: /workspace/examples/backends/vllm
          command: [python3, -m, dynamo.vllm]
          args:
          - --model
          - Qwen/Qwen3-0.6B
          - --served-model-name
          - Qwen/Qwen3-0.6B
          - --disaggregation-mode
          - decode
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_connector_extra_config":{"backends":["LIBFABRIC"]}}'
          envFrom:
          - secretRef:
              name: hf-token-secret
          env:
          - { name: FI_PROVIDER, value: efa }
          - { name: FI_LOG_LEVEL, value: info }
          - { name: FI_EFA_USE_DEVICE_RDMA, value: "1" }
          - { name: FI_EFA_ENABLE_SHM_TRANSFER, value: "0" }
          # With NIXL READ semantics the decode worker pulls KV from prefill, so
          # agent_rx_bytes here is the authoritative "bytes moved over EFA" counter.
          - { name: NIXL_TELEMETRY_ENABLE, value: "y" }
          - { name: NIXL_TELEMETRY_EXPORTER, value: prometheus }
          - { name: NIXL_TELEMETRY_PROMETHEUS_PORT, value: "19090" }
          securityContext:
            capabilities:
              add: ["IPC_LOCK", "SYS_PTRACE"]
          resources:
            requests:
              nvidia.com/gpu: "1"
              vpc.amazonaws.com/efa: "1"
              ephemeral-storage: 8Gi
            limits:
              nvidia.com/gpu: "1"
              vpc.amazonaws.com/efa: "1"
