#
# Aggregated TensorRT-LLM behind the Gateway, for test_gaie_deployment in
# tests/deploy/test_dgd.py: one worker with a direct-mode frontend sidecar,
# and the EPP that picks it. The test replaces every image.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: trtllm-gaie-agg
spec:
  components:
  - name: Epp
    type: epp
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:my-tag
          envFrom:
          - secretRef:
              name: hf-token-secret
          # Keeps the EPP off disk-starved nodes and out of the kubelet's
          # first eviction bucket under DiskPressure.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
  - name: worker
    type: worker
    replicas: 1
    frontendSidecar: sidecar-frontend
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:my-tag
          command:
          - python3
          - -m
          - dynamo.trtllm
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --served-model-name
          - Qwen/Qwen3-0.6B
          - --extra-engine-args
          - /workspace/examples/backends/trtllm/engine_configs/qwen3/agg.yaml
          envFrom:
          - secretRef:
              name: hf-token-secret
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              ephemeral-storage: 2Gi
        - name: sidecar-frontend
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:my-tag
          args:
          - -m
          - dynamo.frontend
          - --router-mode
          - direct
          envFrom:
          - secretRef:
              name: hf-token-secret
