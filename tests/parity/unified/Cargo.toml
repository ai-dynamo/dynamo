[package]
name = "dynamo-external-parser-check"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Keep this a real external consumer, separate from Dynamo's serving dependencies.
[workspace]

[dependencies]
anyhow = "1"
dynamo-conformance-fixtures-v2 = { version = "=0.1.0", git = "https://github.com/ai-dynamo/frontend-crates.git", rev = "54d616fc43c9fffa14b29be099221ffb0a7faede" }
dynamo-parsers-v2 = { version = "=0.9.11", git = "https://github.com/ai-dynamo/frontend-crates.git", rev = "54d616fc43c9fffa14b29be099221ffb0a7faede" }

[[bin]]
name = "dynamo-conformance"
path = "conformance.rs"

[[test]]
name = "native_parser"
path = "native_parser.rs"

[[test]]
name = "vendor_override"
path = "vendor_override.rs"
