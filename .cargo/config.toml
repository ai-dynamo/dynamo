[build]
# tokio-console needs this
rustflags = ["--cfg", "tokio_unstable"]

# Target Haswell (2013) era+ machines. That gets us AVX-2
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "force-frame-pointers=yes", "--cfg", "tokio_unstable"]

# Target Graviton 2 / Ampere Altra + machines. NEON vector, and LSE atomics.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=neoverse-n1", "-C", "force-frame-pointers=yes", "--cfg", "tokio_unstable"]

# Static-link pcre2 C library (used by the fastokens tokenizer crate).
# Without this, pcre2-sys tries to find a system libpcre2 via pkg-config,
# which breaks Docker builds and bundles a .so into the Python wheel.
[env]
PCRE2_SYS_STATIC = "1"

# jemalloc (the Python extension's and the router benches' Rust allocator) fixes its page
# size at build time and fails to initialize on a kernel with larger pages. A 64 KiB page size
# works on both 4 KiB and 64 KiB aarch64 kernels (for example, 64K-page kernels on Grace).
# jemalloc 5.3.1's configure already defaults to it for aarch64 Linux; this pins it so that a
# jemalloc update that drops that default cannot make arm64 wheels depend on the build host.
AARCH64_UNKNOWN_LINUX_GNU_JEMALLOC_SYS_WITH_LG_PAGE = "16"
