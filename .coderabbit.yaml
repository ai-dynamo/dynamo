# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit/
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
  suggested_labels: false
  suggested_reviewers: false
  sequence_diagrams: false
  related_issues: false
  related_prs: false
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  path_instructions:
    - path: "**/*.py"
      instructions: "Review against .ai/python-guidelines.md"
    - path: "**/tests/**/*.py"
      instructions: "Review against .ai/pytest-guidelines.md"
    - path: "**/tests/**/*.py"
      instructions: "Review against .ai/test-model-size-guardrails.md"
    - path: "**/launch/**/*.sh"
      instructions: "Review against .ai/bash-launch-guidelines.md"
    - path: "**/*.{py,rs,go,ts,tsx,js,mjs,cjs,sh,yaml,yml,toml}"
      instructions: "Flag internal Linear ticket references (e.g. DIS-XXXX, DYN-XXXX, OPS-XXXX, DEP-XXXX, or any <PROJECT>-NNNN ID) in the added lines; see .ai/linear-ticket-refs.md for what to recommend."
    - path: "**/*.{rs,py,go}"
      instructions: "If the change adds or modifies a metric, a log event, or a trace span, review it against .ai/metrics-guidelines.md, using the checks and finding format in .github/review-prompts/metrics.md."
    - path: "docs/fern/pages/reference/observability/*.mdx"
      instructions: "Review metric entries that the change adds, deprecates, or removes against the Stability and Documentation rules in .ai/metrics-guidelines.md."
knowledge_base:
  code_guidelines:
    filePatterns:
      - ".ai/**/*.md"
      - ".github/review-prompts/metrics.md"
chat:
  auto_reply: true
