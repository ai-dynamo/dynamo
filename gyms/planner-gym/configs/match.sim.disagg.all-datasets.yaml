schema_version: 1
name: planner-vs-baselines-disagg-all-datasets
description: >
  Disaggregated-topology leaderboard that mirrors configs/match.jev.example.yaml
  (the merged Jev pilot settings): Planner, the TypeSafe Jev decision engine,
  KEDA, reactive, static 4P4D, CloudAI MPC (cloudai-mpc) and the CloudAI
  offline-RL planner (cloudai-rl) in DynoSim over every locally available
  dataset — the 8 registry workloads (Mooncake anchor + 7 synthetic) and the 6
  Astra GPT-OSS Golden Set traces — against the single relaxed SLO (TTFT
  2000 ms, ITL 50 ms), 3 repetitions. Results are published under
  runs/match-sim-disagg-all-datasets/ with "disagg" in every file name; the
  published sweep was assembled from --autoscaler <entry> --merge sessions (see
  provenance.merged_sessions in the results JSON).

# Expected local layout (data/ is gitignored; see data/README.md). The registry
# "mooncake" anchor comes from this checkout's lib/bench/testdata/.
#
#   data/golden-set/astra-gpt-oss/*.jsonl            <- 6 Golden Set traces
#
# The CloudAI entries need `pip install -e '.[cloudai]'` (numpy; torch for the
# RL policies) and the CQL checkpoint under checkpoints/.

backend:
  type: sim
  topology: disagg
  gpu_budget: 32

  model:
    name: openai/gpt-oss-120b
    ais_model_path: openai/gpt-oss-120b

  # Engine settings copied from configs/match.jev.example.yaml.
  engines:
    common:
      system: h200_sxm
      backend: vllm
      backend_version: "0.24.0"
      tp_size: 1
      moe_tp_size: 1
      moe_ep_size: 1
      attention_dp_size: 1
      runtime:
        cold_start_delay_s: 30
      # The merged config leaves KV capacity to the AIS estimator, which gives
      # 29920 blocks on Dynamo main (the pilot's runtime) but 14961 with the
      # older aiconfigurator-core builds. Pin the Dynamo-main value so
      # this sweep matches both the pilot substrate and the agg sweep.
      extra_args:
        num_gpu_blocks: 29920
    prefill:
      runtime:
        kv_transfer_bandwidth_gbps: 100
        kv_bytes_per_token: 131072
    decode: {}

  router:
    mode: round_robin

  planner_config: planner.sim.example.yaml

  replay:
    ais_bootstrap: true
    concurrency: null
    telemetry_sample_interval_s: 5

  # Policy settings copied verbatim from configs/match.jev.example.yaml.
  autoscalers:
    - name: planner
      type: planner
      start:
        prefill: 1
        decode: 1

    # TypeSafe Jev decision engine over the hosted API (https://api.typesafe.ai;
    # TYPESAFE_API_KEY must be set in the environment, never in this file).
    # Settings copied from configs/match.jev.example.yaml except max_calls,
    # raised so the longest Golden Set trace (60 min / 15 s = 240 ticks) fits.
    # Pool bounds default to 1-16 prefill / 1-8 decode like the rivals.
    # failure_mode hold: the 2026-09-29 merges saw ~1.1% of hosted calls fail
    # (transient validation rejections, one HTTP error, one timeout), which
    # under `raise` aborted 29 of 84 cells, nearly all hour-long Golden Set
    # traces. `hold` keeps the fleet for that tick and logs it; per-cell error
    # counts are reported in each result's runtime.jev. An exhausted budget
    # still fails the cell.
    - name: jev
      type: jev
      start:
        prefill: 1
        decode: 1
      config:
        model: jev-1.13.0
        poll_interval_s: 15
        step: 1
        max_calls: 500
        failure_mode: hold
        min_confidence: 0

    - name: keda-default
      type: keda
      start:
        prefill: 1
        decode: 1
      config:
        poll_interval_s: 15
        queue_threshold: 5
        kv_threshold: 0.9
        min_prefill: 1
        max_prefill: 16
        min_decode: 1
        max_decode: 8
        tolerance: 0.1
        scale_up_stabilization_s: 0
        scale_down_stabilization_s: 300

    - name: reactive-default
      type: reactive
      start:
        prefill: 1
        decode: 1
      config:
        poll_interval_s: 15
        step: 1
        prefill_queue_up: 4
        prefill_queue_down: 1
        decode_kv_up: 0.8
        decode_kv_down: 0.3
        min_prefill: 1
        max_prefill: 16
        min_decode: 1
        max_decode: 8

    - name: static-4p4d
      type: static
      config:
        num_prefill: 4
        num_decode: 4
        poll_interval_s: 5

    # CloudAI MPC v3 (adapters/cloudai_mpc_v3.py): saturated-capacity plant
    # model over AIS prefill+decode, cold-start order book, model-based
    # scale-down rule, goodput-per-GPU (Dinkelbach) objective with ITL,
    # binned arrival forecaster. Replaced the v1 MPC entry on 2026-09-30; the
    # v1 adapter was removed from the tree on 2026-10-02.
    - name: cloudai-mpc
      type: cloudai_mpc_v3
      start:
        prefill: 1
        decode: 1
      config:
        forward_model: ais
        poll_interval_s: 5
        horizon: 5
        slo_ttft_ms: 2000
        slo_itl_ms: 50
        # Switching penalties are in good-request units under the ratio
        # objective; hysteresis is the scale-down rule's job.
        scale_up_penalty: 0
        scale_down_penalty: 0
        reactive_queue_threshold: 6
        min_replicas: 1
        max_replicas: 8
        # Replica cold start the plan accounts for (matches
        # engines.common.runtime.cold_start_delay_s).
        cold_start_s: 30

    # CloudAI RL planner (adapters/cloudai_rl_disagg.py, type cloudai_rl_disagg):
    # the cql_trainer disagg v3 + LSTM export. Every 5 s it encodes the replay
    # telemetry (pre-decision sample) plus its last requested targets into 37
    # current-interval features (demand and completed ISL/OSL, per-pool queues,
    # decode KV, per-pool requested / ready / starting / draining counts,
    # per-pool running requests and startup ETAs, trends, SLO-relative latency,
    # validity, counts, shape age, interval and observation-validity flags),
    # passes the last ten observations through a 32-unit LSTM and emits
    # independent prefill (1-16) and decode (1-8) targets, one delta in
    # [-4,-2,-1,0,1,2,4] per pool from an additive two-head critic, infeasible
    # deltas masked, Q-only. Trained with CQL (alpha 0.1, seed 0) on the seed-0
    # disagg coverage collection (14 workloads x 15 behaviors; flash_crowd,
    # diurnal and random-bursts held out and used to select epoch 100 of 400).
    # The config below must equal the checkpoint's training settings (checked
    # at load): SLO 2000/50, cold start 30 s, EMA alpha 0.4, one GPU per worker
    # in each pool; backend.replay.telemetry_sample_interval_s must be 5.
    # Checkpoint: checkpoints/cql_autoscaler_best_disagg_v3_lstm.pt
    # (cql_trainer export of 2026-10-01).
    - name: cloudai-rl
      type: cloudai_rl_disagg
      start:
        prefill: 1
        decode: 1
      config:
        checkpoint_path: ../checkpoints/cql_autoscaler_best_disagg_v3_lstm.pt
        poll_interval_s: 5
        slo_ttft_ms: 2000
        slo_itl_ms: 50
        min_prefill: 1
        max_prefill: 16
        min_decode: 1
        max_decode: 8
        cold_start_s: 30
        smoothing_alpha: 0.4

evaluations:
  # Registry dataset: "all" = mooncake anchor + flat, staircase, square_wave,
  # flash_crowd, diurnal, decode_heavy, shared_prefix. flat, staircase, and
  # flash_crowd at repetition 0 are exactly the merged pilot's cells.
  suites:
    - all

  # Astra GPT-OSS Golden Set (block size 16, timestamp-sorted). Paths resolve
  # relative to this file.
  traces:
    - name: steady-near-capacity
      path: ../data/golden-set/astra-gpt-oss/steady-near-capacity.jsonl
      block_size: 16
      presorted: true
    - name: step-and-recovery
      path: ../data/golden-set/astra-gpt-oss/step-and-recovery.jsonl
      block_size: 16
      presorted: true
    - name: gradual-ramp
      path: ../data/golden-set/astra-gpt-oss/gradual-ramp.jsonl
      block_size: 16
      presorted: true
    - name: repeated-cycles
      path: ../data/golden-set/astra-gpt-oss/repeated-cycles.jsonl
      block_size: 16
      presorted: true
    - name: composition-shift
      path: ../data/golden-set/astra-gpt-oss/composition-shift.jsonl
      block_size: 16
      presorted: true
    - name: random-bursts
      path: ../data/golden-set/astra-gpt-oss/random-bursts.jsonl
      block_size: 16
      presorted: true

  defaults:
    seed: 0
    max_requests: null
    arrival_speedup: 1.0

# Single profile, as in configs/match.jev.example.yaml and planner.sim.example.yaml.
slo_profiles:
  - name: relaxed
    ttft_ms: 2000
    itl_ms: 50

metrics:
  rank_by: goodput_per_gpu
  include:
    - goodput_per_gpu
    - goodput_rps
    - good_rate
    - gpu_hours
    - mean_ttft_ms
    - p99_ttft_ms
    - mean_itl_ms
    - oscillation_count
    - scale_events

execution:
  # Repetition r uses seed + r for the synthetic registry workloads; the
  # recorded traces are fixed inputs.
  repetitions: 3
  fail_fast: false
  # 7 autoscalers x 14 workloads x 1 SLA target x 3 repetitions.
  max_runs: 294

publish:
  # "disagg" is part of the directory and of every result file name.
  artifact_root: ../runs/match-sim-disagg-all-datasets/artifacts
  destinations:
    - type: console
    - type: json
      path: ../runs/match-sim-disagg-all-datasets/results.disagg.json
    - type: html
      path: ../runs/match-sim-disagg-all-datasets/report.disagg.html
