# Global Discovery Service with pools from Karmada, applied directly to the hub
# cluster (not through Karmada). Replace IMAGE with the pushed image, for example
# from the repository root:
#   sed "s#IMAGE#<registry>/global-discovery-service:<tag>#" container/global-discovery-service.yaml | kubectl apply -f -
#
# It takes no registrations. It lists a pool while Karmada imports a Ready
# endpoint of its `<DGD name>-pool-relay` Service; its frontends are the Ready
# endpoints of its `<DGD name>-frontend` Service. Set the --router-* arguments
# to the Global Router's namespace, Service and the port PoolRelays connect to.
#
# It reads the imported slices with the pod's credentials, so Karmada must
# propagate to this cluster a ServiceImport for each pool's PoolRelay and
# frontend Services and for the router Service, this cluster's own pools
# included. Karmada watches a member's ServiceExports only once it has
# propagated at least one ServiceExport there.
#
# To read the Karmada control plane instead, which holds every exported
# Service's slices, mount its kubeconfig from a Secret, point KUBECONFIG at
# it, and grant this access there.
#
# A pool's region is its member Cluster's spec.region on the Karmada control
# plane, else its cluster's --cluster-region, else the cluster's name. It
# keeps no state, so run any number.
#
# Coming from a version whose Pool Relays registered pools, upgrade the Global
# Routers first, and scale this Deployment to zero before applying the new one.
# The Global Discovery Service configuration reference has every step.
apiVersion: v1
kind: Namespace
metadata:
  name: global-discovery
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: global-discovery-service
  namespace: global-discovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: global-discovery-service
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Each member's region, on the Karmada control plane.
  - apiGroups: ["cluster.karmada.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: global-discovery-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: global-discovery-service
subjects:
  - kind: ServiceAccount
    name: global-discovery-service
    namespace: global-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-discovery-service
  namespace: global-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: global-discovery-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: global-discovery-service
    spec:
      serviceAccountName: global-discovery-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: global-discovery
          image: IMAGE
          args:
            # Takes IPv4 and IPv6. On nodes with IPv6 turned off, use
            # 0.0.0.0:8080.
            - --listen=[::]:8080
            - --pool-discovery=karmada
            - --router-namespace=global-discovery
            - --router-service=global-router
            - --router-port-name=http
            # Reading this cluster rather than the Karmada control plane, give
            # every pool cluster's region, by its member name.
            # - --cluster-region=aws-ohio=us-east-2
          env:
            - name: DYN_LOG
              value: info
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          lifecycle:
            # Keep serving while the Pod leaves the Service's endpoints.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: global-discovery-service
  namespace: global-discovery
spec:
  selector:
    app.kubernetes.io/name: global-discovery-service
  ports:
    - name: http
      port: 8080
      targetPort: http
