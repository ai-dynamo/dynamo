#
# Media-codec allowlist gate — consumed by container/compliance/scan_codecs.py.
#
# We ship an in-tree ffmpeg built to a narrow media-codec set (see
# wheel_builder.Dockerfile). This gate keeps the finished image aligned with
# that: it fails the image BUILD if a media-codec library/binary appears outside
# our in-tree allowlist (allow_paths) or a reasoned exception — catching a distro
# libav*, a wheel-bundled libavcodec, libx264/265, or a stray/imageio-bundled
# ffmpeg that slipped in via a base-image or dependency bump.
#
# Filesystem-first because bundled codec .so files don't appear as SBOM
# components; deny_components adds a supplementary SBOM version floor.
#
# Keep this in sync with the wheel_builder.Dockerfile ffmpeg allowlist and the
# vllm/sglang media-library cleanup. New third-party bundled media libraries must
# be either removed or added to `exceptions` with a reason + owner — never
# silently allowlisted.

# Filesystem globs (matched against absolute paths under the scan root) for
# media-codec libraries / binaries that must not ship. libav*/libsw* are matched
# wholesale and re-permitted only for our in-tree copy via allow_paths, so any
# THIRD-PARTY bundled libavcodec (distro, a vendored wheel) is caught.
deny_globs:
  # Both the plain soname and the auditwheel hash-renamed variant (e.g. a wheel
  # that vendors libx264-<hash>.so under its .libs/) must be caught.
  - "**/libx264.so*"
  - "**/libx264-*.so*"
  - "**/libx265.so*"
  - "**/libx265-*.so*"
  - "**/libfdk-aac.so*"
  - "**/libfdk-aac-*.so*"
  - "**/libavcodec.so*"
  - "**/libavcodec-*.so*"
  - "**/libavdevice.so*"
  - "**/libavdevice-*.so*"
  - "**/libavformat.so*"
  - "**/libavformat-*.so*"
  - "**/libavfilter.so*"
  - "**/libavfilter-*.so*"
  - "**/libavutil.so*"
  - "**/libavutil-*.so*"
  - "**/libswscale.so*"
  - "**/libswscale-*.so*"
  - "**/libswresample.so*"
  - "**/libswresample-*.so*"
  - "**/libpostproc.so*"
  - "**/libpostproc-*.so*"
  # Standalone ffmpeg/ffprobe CLIs (e.g. a distro /usr/bin/ffmpeg). Our own copy
  # at /usr/local/bin/ffmpeg is re-permitted by allow_paths below.
  - "**/bin/ffmpeg"
  - "**/bin/ffprobe"
  # GPL prebuilt ffmpeg binary that imageio-ffmpeg bundles under site-packages.
  - "**/imageio_ffmpeg/binaries/ffmpeg-*"

# CycloneDX component gate (only applied when --sbom is passed). `min_fixed_version`
# flags any version strictly below a known-good floor; kept current with upstream
# ffmpeg maintenance releases.
deny_components:
  - name: ffmpeg
    min_fixed_version: "8.1.2"
  - name: x264
  - name: x265
  - name: fdk-aac

# Absolute-path prefixes whose media libraries are OUR in-tree ffmpeg, built with
# the narrow decoder/encoder allowlist in wheel_builder.Dockerfile. Matches here
# are reported as ALLOWED and never fail the build.
allow_paths:
  - "/usr/local/lib/libav"
  - "/usr/local/lib/libsw"
  - "/usr/local/lib/libpostproc"
  - "/usr/local/bin/ffmpeg"
  - "/usr/local/src/ffmpeg"   # retained source tree (kept for legal reasons)

# Explicit third-party exceptions: LOGGED in the report but do NOT fail the build.
# Every entry must carry a reason and an owner so the waiver is auditable.
exceptions:
  - glob: "**/nvidia/dali/.libs/*"
    reason: >-
      NVIDIA DALI (nvidia-dali-cuda130) vendors its own ffmpeg stack (libav* plus
      the libsw*/libpostproc companions) under .libs/ for its video reader. It is
      owned and handled by its own component team and tracked separately rather
      than gated here. The glob covers the whole vendored dir so the libsw*
      companions are waived too, not just libavcodec.

      Resolved by a version bump, not by narrowing. Measured with
      container/compliance/enumerate_bundled_decoders.py against the shipped
      image: DALI 2.1.0 registers 446 decoders including h264, hevc, aac,
      aac_fixed and aac_latm. DALI restricted its own ffmpeg build to drop those
      (NVIDIA/DALI_deps#162, NVIDIA/DALI#6352, May 2026), first released in
      2.1.1 -- as a cherry-pick, so checking whether the merge commit is an
      ancestor of the tag gives the wrong answer; the release notes are the
      reliable source. Upgrading the wheel in place to 2.1.1 or 2.2.0 leaves 440
      decoders with all five absent, vp8/vp9/mjpeg/av1 still present, and the
      image importing and passing its unit suite.

      This waiver cannot be narrowed to the non-codec companions, which an
      earlier revision of this note claimed. libavcodec, libavfilter, libavformat,
      libavutil and libswscale are all DT_NEEDED by libdali.so, libdali_kernels.so,
      libdali_operators.so and every python_function_plugin, so removing the codec
      libraries on their own breaks `import nvidia.dali` outright. The vendored
      set is all-or-nothing with the package.

      The entry stays even so. trtllm_runtime.Dockerfile now pins
      nvidia-dali-cuda130>=2.1.1, so the vendored libraries no longer register
      those decoders -- but they are still on disk and still match the deny globs
      above, which gate on presence rather than content. What changed is the
      reason for the waiver: it now covers a vendored ffmpeg that carries no
      software h264/hevc/aac, rather than one that does.

      Enforcement lives at build time, not here. Two guards in
      trtllm_runtime.Dockerfile enumerate every bundled libavcodec -- one after
      the upgrade, and one after the overlay COPY, which is the only stage where
      a missed whiteout can leave the base image's older copy sitting beside the
      upgraded one -- and tests/dependencies/test_no_software_video_codecs.py
      repeats the check against the shipped image.

      Deliberately NOT expressed as a deny_components version floor:
      nvidia-dali-cuda130 appears in the base-image SBOM and is therefore
      subtracted from the generated delta, so such an entry would never match
      anything and would read as a check while doing nothing.

      Re-measure when the vendored version moves.
    owner: DALI
  # PyNvVideoCodec (NVDEC hardware video decode) vendors an ffmpeg stack under its
  # package dir to demux input containers before handing the elementary stream to
  # NVDEC. Decode itself runs on NVDEC via libnvcuvid.
  #
  # An earlier revision waived only libavutil + libavformat and said a bundled
  # libavcodec "would still fail the build". That tripwire fired: the TRT-LLM
  # release image now ships pynvvideocodec 2.1.0 in system site-packages (rc22
  # carried no such package at all), and it vendors the full stack -- libavcodec,
  # libavdevice, libavfilter, libswresample, libswscale.
  #
  # Resolved by measurement, not by assumption. container/compliance/
  # enumerate_bundled_decoders.py against the shipped libavcodec.so.61 reports
  # 1 decoder registered -- vp9 -- with h264, hevc, aac, aac_fixed and aac_latm
  # all ABSENT. NVIDIA already restricted this ffmpeg build, the same fix DALI
  # took in 2.1.1. So the deny globs match on presence while the content carries
  # no software h264/hevc/aac, exactly the DALI situation above.
  #
  # Enforcement moves to build time rather than being dropped: a guard in
  # trtllm_runtime.Dockerfile runs enumerate_bundled_decoders.py over every
  # bundled libavcodec and fails the build (exit 1) if any excluded decoder
  # reappears. The globs below stay enumerated per-library rather than covering
  # the whole directory, so a genuinely new artifact kind (libx264, libfdk-aac)
  # still fails the scan.
  #
  # Re-measure when the vendored version moves.
  - glob: "**/PyNvVideoCodec/libavutil.so*"
    reason: >-
      PyNvVideoCodec bundles libavutil (utility routines, no codec) to support its
      NVDEC container demux path. Decode runs on NVDEC (libnvcuvid).
    owner: PyNvVideoCodec
  - glob: "**/PyNvVideoCodec/libavformat.so*"
    reason: >-
      PyNvVideoCodec bundles libavformat (container demuxers/muxers only, no codec)
      to parse the input container before NVDEC decode.
    owner: PyNvVideoCodec
  - glob: "**/PyNvVideoCodec/libavcodec.so*"
    reason: >-
      Vendored by pynvvideocodec 2.1.0 in the TRT-LLM release image. Measured with
      enumerate_bundled_decoders.py: registers vp9 only; h264, hevc, aac, aac_fixed
      and aac_latm are absent. A build-time guard in trtllm_runtime.Dockerfile
      re-checks this and fails the build if any of them reappear.
    owner: PyNvVideoCodec
  - glob: "**/PyNvVideoCodec/libavdevice.so*"
    reason: >-
      Device I/O muxers/demuxers only, no codec implementation. Companion to the
      PyNvVideoCodec libavcodec entry above.
    owner: PyNvVideoCodec
  - glob: "**/PyNvVideoCodec/libavfilter.so*"
    reason: >-
      Filter graph library, no codec implementation. DT_NEEDED by the vendored
      stack, so it cannot be removed independently.
    owner: PyNvVideoCodec
  - glob: "**/PyNvVideoCodec/libswresample.so*"
    reason: >-
      Audio resampling helper, no codec implementation. Companion to the
      PyNvVideoCodec libavcodec entry above.
    owner: PyNvVideoCodec
  - glob: "**/PyNvVideoCodec/libswscale.so*"
    reason: >-
      Colourspace/scaling helper, no codec implementation. Companion to the
      PyNvVideoCodec libavcodec entry above.
    owner: PyNvVideoCodec
