#
# This file represents the default ARG values of Dockerfiles generated
# by render.py. These are the recommended default values for users and
# is the source of truth for the values used in our delivered images.
#
# Some ARGs have multiple valid values and can be changed for local testing,
# you can do so locally in this file, or pass the --build-arg into docker build
# when building.

dynamo:
  cuda13.0:
    base_image: nvcr.io/nvidia/cuda-dl-base
    base_image_tag: 25.11-cuda13.0-devel-ubuntu24.04
    # No baseline_sbom: dynamo-runtime is an unpublished wheel-builder image that
    # skips compliance (see dynamo_runtime.Dockerfile). The published framework
    # images + the wheels carry the attribution.
    #
    # Per-arch baseline convention (vllm/sglang/trtllm): the baseline_sbom value
    # is a STEM; the licenses stage appends -${TARGETARCH}.cdx.json so each arch
    # of a multi-arch build subtracts its own-arch floor (the @<digest8> is the
    # shared multi-arch index digest).
  frontend:
    # The frontend installs NIXL from PyPI (the tag minus its leading "v")
    # rather than building it in wheel_builder, so it moves independently of
    # the framework-level ref the runtime target's nixl-sys links against.
    nixl_ref: v1.5.0
  # Dynamo's native Rust EPP (deploy/inference-gateway/ext-proc). This is the
  # default value of the frontend's EPP_IMAGE build arg; the frontend copies
  # /epp out of it. CI overrides EPP_IMAGE with the per-commit image it just
  # built, so this default is what a plain `docker build` of the rendered
  # Dockerfile resolves to.
  epp_image: nvcr.io/nvidia/ai-dynamo/dynamo-epp:1.5.0
  frontend_image: nvcr.io/nvidia/base/ubuntu:noble-20250619
  # Self-baseline of the ubuntu frontend base; the licenses stage subtracts it so
  # frontend NOTICES attribute only what dynamo (+ the Rust EPP, via the SBOM
  # the epp image carries) add on top.
  frontend_baseline_sbom: ubuntu@7291df36
  planner_build_image: python
  planner_build_image_tag: 3.13.18-slim
  planner_runtime_image: nvcr.io/nvidia/distroless/python
  planner_runtime_image_tag: 3.13-v4.1.10
  # Self-baseline of the distroless-python runtime; the licenses stage subtracts
  # it so planner NOTICES attribute only what the builder adds on top.
  planner_baseline_sbom: python@c718fc95
  # Planner-scoped interpreter. The planner uses a separate, newer CPython line
  # from the global python_version below because it is the only stage whose
  # interpreter is decoupled from the framework/runtime bases: the build stage
  # FROMs python:${planner_build_image_tag} (Docker Hub), and the runtime
  # stage FROMs nvcr.io/nvidia/distroless/python:${planner_runtime_image_tag}.
  # Neither of those images pin the frontend or framework stacks. The global
  # python_version cannot follow because (a) frontend.Dockerfile apt-installs
  # python${PYTHON_VERSION}-dev on nvcr.io/nvidia/base/ubuntu:noble (Ubuntu
  # 24.04 ships python3.12 with no python3.13 in its archive), and (b) the
  # framework runtime images (vllm/vllm-openai, lmsysorg/sglang,
  # nvcr.io/nvidia/tensorrt-llm/release) ship python3.12 with cp312 ABI wheels
  # for torch/vllm/sglang/tensorrt-llm. Moving those is a separate change.
  planner_python_version: "3.13"
  python_version: "3.12"
  # Every stage must use the same uv: stages share one BuildKit uv cache mount,
  # and uv rejects cache entries written by a newer version.
  uv_version: "0.13.5"
  go_version: "1.27.3"

  nats_version: v2.14.8
  nats_commit: 3e47c8fa715b0e3b2feaeedc378c25fff88a966e
  etcd_version: v3.5.35
  etcd_commit: b0dc93710686bba178c9b6408e545be21d27b2ce

  nixl_ref: v1.3.2
  nixl_ucx_ref: v1.22.0
  nixl_gdrcopy_ref: v2.5.2
  nixl_libfabric_repo: https://github.com/ofiwg/libfabric.git
  # >= v2.5 for NIXL 1.5.0 (fi_mr_attr.device.rocr). <= the libfabric of
  # efa_version (2.7.0 in EFA 1.51.0): the TRT-LLM EFA image runs NIXL against
  # that copy, so a newer ref can link to symbols that copy lacks.
  nixl_libfabric_ref: v2.6.0
  # Keep in sync with upstream NIXL's contrib/Dockerfile.manylinux.
  hwloc_version: 2.12.2
  enable_media_ffmpeg: "false"
  enable_gpu_memory_service: "true"
  # Built from source in wheel_builder with a narrow codec allowlist and
  # --build-suffix=_dynamo, so the SONAMEs cannot collide with the FFmpeg another
  # wheel vendors. Keep in sync with native_packages.yaml's ffmpeg entry and with
  # the ffmpeg-next/video-rs pins in lib/llm/Cargo.toml, which track the FFmpeg
  # major.
  ffmpeg_version: "9.0.1"
  # ffmpeg build inputs (only consumed when ENABLE_MEDIA_FFMPEG=true).
  nv_codec_headers_ref: "n13.0.19.0"
  libvpx_ref: "v1.14.1"
  sccache_version: "v0.14.0"
  efa_version: 1.51.0

vllm:
  cuda13.0:
    base_image: nvcr.io/nvidia/cuda-dl-base
    runtime_image: vllm/vllm-openai
    base_image_tag: 25.11-cuda13.0-devel-ubuntu24.04
    runtime_image_tag: v0.33.0
    vllm_omni_ref: "v0.33.0rc1"
    # Omni caps Transformers below 5.20; the vLLM 0.33 image ships 5.20.2.
    transformers_version: "5.19.0"
    tokenizers_version: "0.23.3"
    # Baseline is vllm-openai's TRUE base, nvidia/cuda:13.0.2-base-ubuntu24.04
    # (Docker Hub), NOT a self-baseline of the third-party vllm/vllm-openai image.
    # vllm-openai is built FROM nvidia/cuda, so this attributes everything vLLM
    # adds over the clean NVIDIA CUDA floor (uv/rust stack, framework, codecs)
    # rather than hiding it. Per-arch stem; the licenses stage appends
    # -${TARGETARCH}.cdx.json. (GPL media codecs from vllm-openai are purged in
    # the runtime image — see the codec-purge follow-up.)
    baseline_sbom: cuda@2ab6381d
  xpu:
    base_image: vllm/vllm-openai-xpu
    runtime_image: vllm/vllm-openai-xpu
    base_image_tag: v0.32.0
    runtime_image_tag: v0.32.0
    baseline_sbom: vllm-openai-xpu@20509fab
    nixl_ref: v1.5.0
    nixl_ucx_ref: v1.23.0-rc1
  cpu:
    base_image: ubuntu
    runtime_image: vllm/vllm-openai-cpu
    base_image_tag: 22.04
    runtime_image_tag: v0.32.0
    # No baseline_sbom: cpu images are unshipped and skip the compliance stages.
    nixl_ref: v1.5.0
    nixl_ucx_ref: v1.23.0-rc1
  vllm_omni_ref: "v0.32.0rc1"
  nixl_ref: v1.5.0
  max_jobs: "10"
  enable_media_ffmpeg: "true"
  enable_gpu_memory_service: "true"
  enable_modelexpress: "true"
  modelexpress_version: "0.7.0"
  # aws-sdk-cpp tag for the NIXL OBJ / S3 backend (built in wheel_builder).
  aws_sdk_cpp_version: "1.11.760"

sglang:
  cuda13.0:
    base_image: nvcr.io/nvidia/cuda-dl-base
    runtime_image: lmsysorg/sglang
    base_image_tag: 25.11-cuda13.0-devel-ubuntu24.04
    runtime_image_tag: v0.5.23-cu130-runtime
    # Baseline is the TRUE base of the third-party lmsysorg/sglang image,
    # nvidia/cuda:13.0.3-cudnn-devel-ubuntu24.04 (Docker Hub; CUDA_VERSION=13.0.3,
    # ubuntu24.04), NOT a self-baseline of lmsysorg/sglang.
    # lmsysorg/sglang is built FROM this nvidia/cuda cudnn-devel base, so this
    # attributes everything sglang adds over the clean NVIDIA CUDA+cuDNN floor
    # (framework, python stack, system libs) rather than hiding it. Per-arch stem;
    # the licenses stage appends -${TARGETARCH}.cdx.json. SGLang's codec-bearing
    # Python wheels are purged in sglang_runtime.Dockerfile; only the in-tree VP9
    # ffmpeg is copied in. The CUDA and XPU Dynamo Rust wheels link against that
    # same codec-limited build for frontend video decoding.
    baseline_sbom: cuda@0230b7f2
  xpu:
    # oneAPI 2026.0 is required by the SGLang XPU pins below: torch 2.13.0+xpu
    # links intel-sycl-rt 2026.0.0 (libsycl.so.9), and sgl-kernel-xpu's SYCL
    # kernels must be compiled by the matching icpx. The 2025.3 base ships
    # libsycl.so.8, so its icpx produces a kernel .so that torch cannot load.
    base_image: intel/deep-learning-essentials
    base_image_tag: 2026.0.0-devel-ubuntu24.04
    runtime_image: intel/deep-learning-essentials
    runtime_image_tag: 2026.0.0-devel-ubuntu24.04
    sglang_ref: v0.5.19
    sglang_git_url: https://github.com/sgl-project/sglang.git
    sglang_kernel_ref: v0.2.0
    sglang_kernel_git_url: https://github.com/sgl-project/sgl-kernel-xpu.git
    # XPU SGLang requires a newer NIXL than the framework default; scoped here
    # to avoid affecting sglang-cuda or other frameworks.
    nixl_ref: v1.1.0
  # Builds the NIXL C++ SDK in wheel_builder so the dev stage can link nixl-sys
  # (see templates/dev.Dockerfile). Runtime stays on the upstream lmsysorg/sglang
  # NIXL Python stack — its wheel COPY is narrowed to ai_dynamo*.whl so the SDK
  # build doesn't leak into the runtime image.
  nixl_ref: v1.5.2
  enable_media_ffmpeg: "true"
  enable_gpu_memory_service: "true"
  enable_modelexpress: "true"
  modelexpress_version: "0.7.0"

trtllm:
  cuda13.1:
    base_image: nvcr.io/nvidia/cuda-dl-base
    runtime_image: nvcr.io/nvidia/tensorrt-llm/release
    base_image_tag: 26.02-cuda13.1-devel-ubuntu24.04
    runtime_image_tag: 1.4.0rc2
    # Per-arch baseline stem (re-captured against tensorrt-llm/release, both arches).
    baseline_sbom: release@93a3eaf1
  # EFA adds the API-compatible LIBFABRIC plugin, including its CUDA-context fix.
  nixl_ref: v1.5.2
  enable_media_ffmpeg: "false"
  enable_gpu_memory_service: "true"

triton:
  # The runtime image is the upstream Triton Inference Server release from NGC
  # (nvcr.io/nvidia/tritonserver:<tag>-py3), with Dynamo's source-built wheels on
  # top. base_image (cuda-dl-base) builds the dynamo_base and wheel_builder helper
  # stages. Override --build-arg RUNTIME_IMAGE_TAG for a different Triton release.
  cuda13.4:
    base_image: nvcr.io/nvidia/cuda-dl-base
    runtime_image: nvcr.io/nvidia/tritonserver
    # Build toolchain only, pinned to CUDA 13.1: the Rust cudarc crate rejects 13.4 at build time.
    # The wheels load CUDA dynamically, so they run on the 13.4 runtime image regardless.
    # Matches trtllm's base_image_tag so Triton reuses the trtllm BuildKit pool cache (route_buildkit.sh); if it diverges, route Triton back to general.
    base_image_tag: 26.02-cuda13.1-devel-ubuntu24.04
    runtime_image_tag: 26.09-py3
  enable_media_ffmpeg: "false"
  enable_gpu_memory_service: "true"

# Build/test image only; release publication is configured separately.
tokenspeed:
  cuda13.0:
    base_image: nvcr.io/nvidia/cuda-dl-base
    base_image_tag: 25.11-cuda13.0-devel-ubuntu24.04
    runtime_image: nvcr.io/nvidia/cuda
    runtime_image_tag: 13.0.3-runtime-ubuntu24.04
    baseline_sbom: cuda@76f46f3e
  # Match the CUDA compiler/header packages in TokenSpeed's runner without
  # inheriting the larger CUDA DL development image in the final runtime.
  cuda_jit_packages:
    - cuda-nvcc-13-0
    - libcublas-dev-13-0
    - cuda-nvrtc-dev-13-0
    - libcurand-dev-13-0
  enable_media_ffmpeg: "false"
  enable_gpu_memory_service: "false"
  # Matched nightly set from lightseekorg/tokenspeed@ee5b468f165af2ec33e6a581d683b7d4a396e00f.
  # Stable 0.1.1 predates the headless engine used by dynamo.tokenspeed.
  wheel_base_url: https://github.com/lightseekorg/whl/releases/download
  version: 0.1.1.post20261106
  kernel_version: 0.1.4.post20261106
  engine_version: 0.1.0.post20261106
  scheduler_version: 0.1.49
  torch_version: 2.14.0
  torchvision_version: 0.29.0
  flashinfer_version: 0.7.2.post1
  runtime_sha256: b18928d47040d2e99df1f147e64e1e9666115b804815b9bcd3332dd185b3a9ba
  # Published wheels require CPython 3.12 and Ubuntu 24.04 (engine glibc ABI).
  wheels:
    amd64:
      kernel_platform: manylinux_2_28_x86_64
      engine_platform: linux_x86_64
      kernel_sha256: 19e7a165d7dbd3564bdb62deb04c2a12a3d1d750395e9bc0a7e108256b5a6efe
      engine_sha256: 3b3f1983b31e233ac567f463e23f9ee8c7331e472179ffb6a394b4e45fd26fb5
    arm64:
      kernel_platform: manylinux_2_28_aarch64
      engine_platform: linux_aarch64
      kernel_sha256: 518f39ca2bba4f1298d60e360297ccbd52d2dc749f208e25c4b2f161245052bf
      engine_sha256: 3c4fa5a978e8563d12a1943bb7353eaf1a3191331a6a713b638c13dfce5a32bf
