[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "aisimulate"
version = "0.1.0.dev1"
description = "Backend-neutral inference simulation and deployment configuration search"
readme = "README.md"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
authors = [
    { name = "NVIDIA Inc.", email = "sw-dl-dynamo@nvidia.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiconfigurator==0.11.0.dev20260728",
    "aiconfigurator-core==0.11.0.dev20260728",
    "chex==0.1.87",
    "flax==0.10.0",
    "google-vizier[jax]==0.1.21",
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "optax==0.2.4",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tfp-nightly[jax]==0.26.0.dev20260626",
    "tqdm>=4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.8.0",
]

[project.urls]
Repository = "https://github.com/ai-dynamo/dynamo.git"
Documentation = "https://github.com/ai-dynamo/dynamo/tree/main/docs/fern/pages/developer-guide/knowledge-base/modular-components/ai-simulate-experimental"

[tool.maturin]
exclude = ["**/__pycache__/**", "**/*.pyc"]
features = ["extension-module"]
manifest-path = "crates/python/Cargo.toml"
module-name = "aisimulate._runtime"
profile = "release"
python-source = "src"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore:jax.core.Primitive is deprecated.*:DeprecationWarning:(equinox|jax)(\\..*)?",
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated.*:DeprecationWarning:google.protobuf.internal.well_known_types",
]
markers = [
    "gpu_0: marks tests that do not require a GPU",
    "integration: marks integration tests",
    "model: model id used by a test or parameter",
    "planner: marks tests for the planner component",
    "post_merge: marks tests to run after merge",
    "pre_merge: marks tests to run before merging",
    "timeout: test timeout in seconds",
    "unit: marks unit tests",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
