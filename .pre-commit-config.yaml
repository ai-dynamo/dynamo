default_install_hook_types: [pre-commit, commit-msg]
exclude: ^(src/grpc_generated|.*\.patch$|.*/connect/.*\.py|components/src/dynamo/planner/plugins/proto/v1/plugin_pb2(_grpc)?\.pyi?$|lib/sidecar/vllm/proto/(control|inference)\.proto$|lib/sidecar/trtllm/proto/trtllm_service\.proto$)
repos:
- repo: https://github.com/timothycrosley/isort
  rev: 5.12.0
  hooks:
  - id: isort
    additional_dependencies: [toml]
- repo: https://github.com/psf/black
  rev: 23.1.0
  hooks:
  - id: black
    types_or: [python, cython]
- repo: https://github.com/PyCQA/flake8
  rev: 7.3.0  # 5.0.4 crashes on Python 3.12+ (ast.Str removed)
  hooks:
  - id: flake8
    args: [--max-line-length=88, --select=C,E,F,W,B,B950, --extend-ignore = E203,E501]
    types_or: [python, cython]
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v16.0.5
  hooks:
  - id: clang-format
    types_or: [c, c++, cuda, proto, textproto, java]
    args: ["-fallback-style=none", "-style=file", "-i"]
- repo: https://github.com/codespell-project/codespell
  rev: v2.2.4
  hooks:
  - id: codespell
    # Use pyproject.toml for codespell configuration
    additional_dependencies: [tomli]

# More details about these pre-commit hooks here:
# https://pre-commit.com/hooks.html
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-case-conflict
  - id: check-executables-have-shebangs
  - id: check-merge-conflict
  - id: check-json
    exclude: .devcontainer
  - id: check-toml
  - id: check-yaml
    exclude: ^.*/templates/.*\.yaml$ #ignore all yaml files in helm chart templates
    args: ['--allow-multiple-documents']
  - id: check-shebang-scripts-are-executable
  - id: end-of-file-fixer
    types_or: [c, c++, cuda, proto, textproto, java, python]
  - id: mixed-line-ending
  - id: requirements-txt-fixer
  - id: trailing-whitespace
    # spdx_licenses/ holds verbatim upstream license texts — never reformat them.
    exclude: (lib/llm/tests/data/deepseek-v3.2/.*\.txt$|^container/compliance/spdx_licenses/.*)

# Fast linting
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.5.2
  hooks:
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]

# NOTE: pyright may be able to find other classes of errors not covered above,
# but would require some configuring and venv setup to properly eliminate noise
# and give it visiblity into all the local and third_party packages expected.
- repo: local
  hooks:
    - id: sync-site-css
      name: Check CustomFooter SITE_CSS mirrors main.css
      entry: python3 docs/fern/scripts/sync_site_css.py --check
      language: system
      files: ^docs/fern/(main\.css|components/CustomFooter\.tsx|scripts/sync_site_css\.py)$
      pass_filenames: false
    - id: check-asset-paths
      name: Check docs asset paths are ones Fern rewrites
      entry: python3 docs/fern/scripts/check_asset_paths.py
      language: system
      # Coarse trigger on purpose. DEFAULT_GLOBS in the script is the single
      # definition of what gets scanned; enumerating the same file types here
      # would be a second copy to keep in sync. Full scan is ~0.8s.
      files: ^docs/fern/
      pass_filenames: false
    - id: check-asset-paths-selftest
      name: Self-test the asset-path opener cases
      entry: python3 docs/fern/scripts/check_asset_paths.py --test
      language: system
      files: ^docs/fern/scripts/check_asset_paths\.py$
    - id: check-style-components
      name: Check component CSS template literals
      entry: python3 docs/fern/scripts/check_style_components.py
      language: system
      # ReleaseSupportMatrix and FeatureInteractions hold large CSS template
      # literals under a name the *Styles.tsx convention misses, and a stray
      # backtick there breaks the Fern build the same way. Named rather than
      # matching every component: the check forbids interpolation, which is
      # correct for a pure CSS literal and wrong for ordinary TSX, and a
      # components/.*\.tsx pattern fails on FeatureHeatmap, ModelEABuildCards
      # and TerminalDemo, all of which interpolate legitimately.
      files: ^docs/fern/(components/(.*Styles|ReleaseSupportMatrix|FeatureInteractions)\.tsx|scripts/check_style_components\.py)$
    - id: check-agent-twins
      name: Check component-rendered data has an agent-readable twin
      entry: python3 docs/fern/scripts/check_agent_twins.py
      language: system
      # releases.data.ts is the reason this runs at all: it is where a new
      # release appears, and the twin then has to carry it. It is .ts, not
      # .tsx, so a components/*.tsx pattern misses it entirely. Component
      # files matter for the undeclared-component tripwire, and the page list
      # here has to stay in step with IN_SCOPE in check_agent_twins.py --
      # a page it governs but this pattern misses is ungated, and a rename
      # of one throws the script's hard-fail onto an unrelated PR later.
      files: ^docs/fern/(components/releases\.data\.ts|components/.*\.tsx|pages/reference/general/(compatibility|release-artifacts|model-early-access-builds)\.mdx|scripts/check_agent_twins\.py)$
      pass_filenames: false
    - id: check-agent-twins-selftest
      name: Self-test the agent-twin matcher
      entry: python3 docs/fern/scripts/check_agent_twins.py --test
      language: system
      files: ^docs/fern/scripts/check_agent_twins\.py$
      pass_filenames: false
    - id: check-published-styles-selftest
      name: Self-test the published-styles regex helpers
      entry: python3 docs/fern/scripts/check_published_styles.py --test
      language: system
      files: ^docs/fern/scripts/check_published_styles\.py$
      pass_filenames: false
    - id: gen-llms-tables
      name: Test the generated docs tables (gen_llms_tables.py)
      entry: pytest -c docs/fern/scripts/pytest.ini -p no:cacheprovider docs/fern/scripts/test_gen_llms_tables.py
      language: python
      files: ^docs/fern/(scripts/(gen_llms_tables|test_gen_llms_tables)\.py|scripts/pytest\.ini|components/releases\.data\.ts)$
      pass_filenames: false
      additional_dependencies:
        - pytest
    - id: gen-llms-tables-check
      name: Check the generated docs tables are current
      entry: python3 docs/fern/scripts/gen_llms_tables.py --check
      language: system
      # The hook above proves the generator works; this one proves it was
      # run. Without it, editing releases.data.ts and forgetting to
      # regenerate leaves every committed generated span stale.
      files: ^docs/fern/(scripts/gen_llms_tables\.py|components/releases\.data\.ts|pages/reference/general/.*\.mdx)$
      pass_filenames: false
    - id: check-component-imports
      name: Check Fern components trigger no rolldown bundling
      entry: python3 docs/fern/scripts/check_component_imports.py
      language: system
      files: ^docs/fern/(components/.*\.(js|jsx|ts|tsx)|scripts/check_component_imports\.py|fern\.config\.json)$
      pass_filenames: false
    - id: check-component-imports-selftest
      name: Self-test the Fern component import scanner
      entry: python3 docs/fern/scripts/check_component_imports.py --test
      language: system
      files: ^docs/fern/scripts/check_component_imports\.py$
      pass_filenames: false
    - id: pytest-marker-report
      name: Report pytest markers (static + inherited)
      entry: python3 tests/report_pytest_markers.py
      language: python
      pass_filenames: false
      additional_dependencies:
        - pytest
        - pytest-asyncio
        - tomli
        - pydantic
        - filelock
        - pyyaml
        - prometheus_client>=0.23.1
        - openai
    - id: validate-skills
      name: Validate .agents/skills SKILL.md frontmatter and AGENTS.md index
      entry: python3 scripts/validate_skills.py
      language: python
      files: ^(\.agents/skills/|AGENTS\.md$)
      pass_filenames: false
      additional_dependencies:
        - pyyaml
    - id: validate-agent-instructions
      name: Validate AGENTS.md and CLAUDE.md pairs
      entry: python3 scripts/validate_agent_instructions.py
      language: python
      pass_filenames: false
      always_run: true
    - id: DCO check
      name: Checks the commit message for a developer certificate of origin signature
      entry: python3 scripts/dco_check.py
      language: python
      stages: [commit-msg]
