# cargo-deny plugin for linting dependencies
# https://github.com/EmbarkStudios/cargo-deny/blob/main/deny.template.toml

[graph]
# Dynamo CI targets Linux; avoid checking target-specific dependencies for
# unsupported platforms such as Windows.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT-0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "OpenSSL",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "NCSA",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "WTFPL"
]

# TODO exceptions
# MIT: https://github.com/guidance-ai/llguidance
#  "llguidance",
# MIT: https://github.com/guidance-ai/llguidance/toktrie
#  "toktrie",
# MIT: https://github.com/guidance-ai/llguidance/toktrie_hf_tokenizers
#  "toktrie_hf_tokenizers",

[[licenses.clarify]]

name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
deny = [
	# Ensure we don't depend on openssl
    { name = "native-tls" },
    { name = "openssl-sys" },

    # Media-codec allowlist for Rust crates. It is the counterpart of
    # container/compliance/policy/codec_policy.yaml, which gates the image
    # files. Its deny_components list repeats these crate names, and
    # container/compliance/tests/test_scan_codecs.py keeps the two in sync.
    # AAC
    { crate = "symphonia-codec-aac", reason = "AAC decoder, outside the media-codec allowlist" },
    { crate = "fdk-aac", reason = "AAC codec (libfdk-aac), outside the media-codec allowlist" },
    { crate = "fdk-aac-sys", reason = "AAC codec (libfdk-aac), outside the media-codec allowlist" },
    { crate = "faad2", reason = "AAC decoder (libfaad2), outside the media-codec allowlist" },
    { crate = "faad2-sys", reason = "AAC decoder (libfaad2), outside the media-codec allowlist" },
    { crate = "redlux", reason = "AAC decoder, outside the media-codec allowlist" },
    # H.264
    { crate = "openh264", reason = "H.264 codec (OpenH264), outside the media-codec allowlist" },
    { crate = "openh264-sys", reason = "H.264 codec (OpenH264), outside the media-codec allowlist" },
    { crate = "openh264-sys2", reason = "H.264 codec (OpenH264), outside the media-codec allowlist" },
    { crate = "x264", reason = "H.264 encoder (libx264), outside the media-codec allowlist" },
    { crate = "x264-sys", reason = "H.264 encoder (libx264), outside the media-codec allowlist" },
    { crate = "x264-dev", reason = "H.264 encoder (libx264), outside the media-codec allowlist" },
    { crate = "less-avc", reason = "H.264 encoder, outside the media-codec allowlist" },
    # H.265
    { crate = "x265", reason = "H.265 encoder (libx265), outside the media-codec allowlist" },
    { crate = "x265-sys", reason = "H.265 encoder (libx265), outside the media-codec allowlist" },
    { crate = "libde265", reason = "H.265 decoder (libde265), outside the media-codec allowlist" },
    { crate = "libde265-sys", reason = "H.265 decoder (libde265), outside the media-codec allowlist" },
]

# The FFmpeg bindings must link the in-tree FFmpeg build. The `build` feature
# compiles FFmpeg from source with its default codec set instead, and every
# `build-lib-*` feature turns `build` on.
[[bans.features]]
crate = "ffmpeg-sys-next"
deny = ["build"]
