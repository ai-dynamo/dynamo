# Navigation structure for Dynamo docs
# Tab-based navigation: Home, Kubernetes Guide, CLI Guide, Use Cases, Recipes,
# Developer Guide, Reference,
# Blog, and Community. The Kubernetes Guide and CLI Guide tabs retain their
# kubernetes/ and cli/ URL prefixes; Recipes retains its recipes/ prefix.
# Other content tabs use skip-slug: true so their page URLs remain stable.

tabs:
  home:
    display-name: Home
    icon: house
    skip-slug: true
  kubernetes-guide:
    display-name: Kubernetes Guide
    icon: fa-brands fa-kubernetes
    slug: kubernetes
  cli-guide:
    display-name: CLI Guide
    icon: fa-solid fa-rectangle-terminal
    slug: cli
  use-cases:
    display-name: Use Cases
    icon: puzzle-piece
    skip-slug: true
  recipes:
    display-name: Recipes
    icon: file-code
  developer-guide:
    display-name: Developer Guide
    icon: code
    skip-slug: true
  reference:
    display-name: Reference
    icon: book
  blog:
    display-name: Blog
    icon: newspaper
    skip-slug: true
  community:
    display-name: Community
    icon: users
    skip-slug: true
navigation:
  - tab: home
    layout:
      # Sole entry: the landing page sets `layout: page`, which drops the
      # sidebar. The Slack and Community Calendar links that used to sit here
      # are the two community cards in the hero, so they were duplicated.
      - page: Welcome
