    hardware: h200-sxm-32gpu
    exceptions:
      render:
        profiler-v1beta1:
          status: broken
          reason: The v1 profiler refuses to trust remote code from the model's mutable revision.
        sweeper:
          status: broken
          reason: Sweeper's SGLang H200 performance data has no feasible FP8 context-MLA configuration.

