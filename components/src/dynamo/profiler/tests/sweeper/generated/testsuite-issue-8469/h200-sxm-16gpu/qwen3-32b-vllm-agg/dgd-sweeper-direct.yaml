apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-32b-vllm-agg
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          command:
          - python3
          args:
          - -m
          - dynamo.frontend
          envFrom:
          - secretRef:
              name: hf-token-secret
  - name: VllmDecodeWorker
    type: worker
    replicas: 2
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model
          - Qwen/Qwen3-32B
          - --tensor-parallel-size
          - '4'
          - --block-size
          - '64'
          - --gpu-memory-utilization
          - '0.9'
          - --enable-prefix-caching
          - --max-num-seqs
          - '512'
          - --max-num-batched-tokens
          - '16384'
          - --served-model-name
          - Qwen/Qwen3-32B
          resources:
            limits:
              nvidia.com/gpu: '4'
            requests:
              ephemeral-storage: 2Gi
              nvidia.com/gpu: '4'
          envFrom:
          - secretRef:
              name: hf-token-secret
