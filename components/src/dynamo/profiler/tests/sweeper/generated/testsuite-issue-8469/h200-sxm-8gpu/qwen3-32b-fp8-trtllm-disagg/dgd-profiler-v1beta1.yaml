apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: trtllm-disagg-4e32770f
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
          command:
          - python3
          args:
          - -m
          - dynamo.frontend
          envFrom:
          - secretRef:
              name: hf-token-secret
  - name: decode
    type: decode
    replicas: 3
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
          workingDir: /workspace/
          command:
          - python3
          - -m
          - dynamo.trtllm
          args:
          - --tensor-parallel-size
          - '1'
          - --pipeline-parallel-size
          - '1'
          - --expert-parallel-size
          - '1'
          - --max-batch-size
          - '64'
          - --max-num-tokens
          - '64'
          - --trtllm.kv_cache_config.dtype
          - fp8
          - --trtllm.kv_cache_config.tokens_per_block
          - '32'
          - --trtllm.kv_cache_config.enable_block_reuse
          - 'false'
          - --trtllm.cache_transceiver_config.backend
          - DEFAULT
          - --trtllm.cache_transceiver_config.max_tokens_in_buffer
          - '5024'
          - --trtllm.cuda_graph_config.enable_padding
          - 'true'
          - --trtllm.disable_overlap_scheduler
          - 'false'
          - --trtllm.print_iter_log
          - 'false'
          - --model-path
          - Qwen/Qwen3-32B-FP8
          - --served-model-name
          - Qwen/Qwen3-32B-FP8
          - --trtllm.enable_chunked_prefill
          - 'true'
          resources:
            limits:
              nvidia.com/gpu: '1'
          envFrom:
          - secretRef:
              name: hf-token-secret
  - name: prefill
    type: prefill
    replicas: 5
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
          workingDir: /workspace/
          command:
          - python3
          - -m
          - dynamo.trtllm
          args:
          - --tensor-parallel-size
          - '1'
          - --pipeline-parallel-size
          - '1'
          - --expert-parallel-size
          - '1'
          - --max-batch-size
          - '1'
          - --max-num-tokens
          - '4512'
          - --trtllm.kv_cache_config.dtype
          - fp8
          - --trtllm.kv_cache_config.tokens_per_block
          - '32'
          - --trtllm.kv_cache_config.enable_block_reuse
          - 'false'
          - --trtllm.cache_transceiver_config.backend
          - DEFAULT
          - --trtllm.cache_transceiver_config.max_tokens_in_buffer
          - '5024'
          - --trtllm.cuda_graph_config.enable_padding
          - 'false'
          - --trtllm.disable_overlap_scheduler
          - 'true'
          - --trtllm.print_iter_log
          - 'false'
          - --model-path
          - Qwen/Qwen3-32B-FP8
          - --served-model-name
          - Qwen/Qwen3-32B-FP8
          - --trtllm.enable_chunked_prefill
          - 'true'
          resources:
            limits:
              nvidia.com/gpu: '1'
          envFrom:
          - secretRef:
              name: hf-token-secret
