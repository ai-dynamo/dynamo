apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-32b-fp8-trtllm-agg
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
          command:
          - python3
          args:
          - -m
          - dynamo.frontend
          envFrom:
          - secretRef:
              name: hf-token-secret
  - name: TRTLLMWorker
    type: worker
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
          workingDir: /workspace/
          command:
          - python3
          - -m
          - dynamo.trtllm
          args:
          - --model-path
          - Qwen/Qwen3-32B-FP8
          - --served-model-name
          - Qwen/Qwen3-32B-FP8
          - --extra-engine-args
          - ./examples/backends/trtllm/engine_configs/qwen3/agg.yaml
          - --trtllm.tensor_parallel_size
          - '2'
          - --trtllm.kv_cache_config.tokens_per_block
          - '64'
          - --trtllm.kv_cache_config.free_gpu_memory_fraction
          - '0.9'
          - --trtllm.kv_cache_config.enable_block_reuse
          - 'true'
          - --trtllm.max_batch_size
          - '512'
          - --trtllm.max_num_tokens
          - '16384'
          - --trtllm.cuda_graph_config.max_batch_size
          - '512'
          - --trtllm.enable_attention_dp
          - 'false'
          resources:
            limits:
              nvidia.com/gpu: '2'
            requests:
              ephemeral-storage: 2Gi
              nvidia.com/gpu: '2'
          envFrom:
          - secretRef:
              name: hf-token-secret
