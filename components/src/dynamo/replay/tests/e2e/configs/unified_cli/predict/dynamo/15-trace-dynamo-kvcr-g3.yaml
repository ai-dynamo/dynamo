traffic:
  source:
    type: trace
    format: dynamo
    paths: [components/src/dynamo/replay/tests/e2e/configs/unified_cli/fixtures/traces/dynamo-kvcr-g3.jsonl]
  load: {type: trace_timestamps, speedup: 1.0}
engine:
  mode: aggregated
  model: components/src/dynamo/replay/tests/e2e/configs/unified_cli/fixtures/tiny-model
  hardware: h200_sxm
  backend: vllm
  context_length: 2048
  workers:
    aggregated:
      parallelism: {replicas: 2, tensor: 1, pipeline: 1, attention_data: 1, moe_tensor: 1, moe_expert: 1}
      scheduler: {max_batched_tokens: 8192, max_sequences: 256}
      kv_cache:
        block_size: 64
        prefix_caching: true
        capacity: {type: fixed, blocks: 40}
        host_offload: {num_host_blocks: 16}
        kvcr:
          local_g2: {num_blocks: 16}
          g3: {num_blocks: 256}
      timing: {type: fixed, prefill_ms: 50, decode_ms: 1}
router:
  policy: kv_router
  policy_config: components/src/dynamo/replay/tests/e2e/configs/unified_cli/fixtures/router-policy-kvcr.yaml
