traffic:
  source: {type: synthetic, input_tokens: 32, output_tokens: 4}
  load: {type: constant_rate, requests_per_second: 20.0}
  stop: {requests: 6}
engine:
  mode: aggregated
  model: components/src/dynamo/replay/tests/e2e/configs/unified_cli/fixtures/tiny-model
  hardware: h200_sxm
  backend: vllm
  context_length: 2048
  workers:
    aggregated:
      parallelism: {replicas: 2, tensor: 1, pipeline: 1, attention_data: 1, moe_tensor: 1, moe_expert: 1}
      scheduler: {max_batched_tokens: 8192, max_sequences: 256}
      kv_cache: {block_size: 64, prefix_caching: true, capacity: {type: fixed, blocks: 256}}
      timing: {type: fixed, prefill_ms: 1, decode_ms: 1}
router:
  policy: kv_router
  prefill_load_model: {type: aic}
  overlap_score_credit: 1.0
  prefill_load_scale: 1.0
  temperature: 0.0
