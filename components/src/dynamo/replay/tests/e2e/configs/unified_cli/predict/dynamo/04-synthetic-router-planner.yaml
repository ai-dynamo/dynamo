traffic:
  source:
    type: synthetic-session
    new_input_tokens_per_turn: 16
    output_tokens_per_turn: 4
    session: {turns: 3, shared_prefix_ratio: 0.5, prefix_groups: 2, inter_turn_delay_ms: 5.0}
  load: {type: concurrency, concurrency: 2}
  stop: {sessions: 3}
engine:
  mode: aggregated
  model: components/src/dynamo/replay/tests/e2e/configs/unified_cli/fixtures/tiny-model
  hardware: h200_sxm
  backend: vllm
  context_length: 2048
  workers:
    aggregated:
      parallelism: {replicas: 2, tensor: 1, pipeline: 1, attention_data: 1, moe_tensor: 1, moe_expert: 1}
      scheduler: {max_batched_tokens: 8192, max_sequences: 256}
      kv_cache: {block_size: 64, prefix_caching: true, capacity: {type: fixed, blocks: 256}}
      timing: {type: fixed, prefill_ms: 1, decode_ms: 1}
router:
  policy: kv_router
  prefill_load_model: {type: none}
  overlap_score_credit: 0.5
  prefill_load_scale: 1.0
  temperature: 0.2
planner:
  policy: enabled
  target: load
  enable_throughput_scaling: false
  enable_load_scaling: true
  throughput_adjustment_interval_seconds: 180
  load_adjustment_interval_seconds: 5
  load_scaling_down_sensitivity: 80
  load_min_observations: 5
  max_num_gpus: 2
  min_workers: 1
