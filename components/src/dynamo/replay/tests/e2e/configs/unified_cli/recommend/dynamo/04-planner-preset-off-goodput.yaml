traffic:
  source: {type: synthetic, input_tokens: 32, output_tokens: 4}
  load: {type: concurrency, concurrency: 2}
  stop: {requests: 6}
engine:
  mode: aggregated
  model: components/src/dynamo/replay/tests/e2e/configs/unified_cli/fixtures/tiny-model
  hardware: h200_sxm
  backend: vllm
  context_length: 2048
  workers:
    aggregated:
      parallelism:
        preset:
          - {replicas: 1, tensor: 1, pipeline: 1, attention_data: 1, moe_tensor: 1, moe_expert: 1}
      scheduler: {max_batched_tokens: 8192, max_sequences: 256}
      kv_cache: {block_size: 64, prefix_caching: true, capacity: {type: fixed, blocks: 256}}
      timing: {type: fixed, prefill_ms: 1, decode_ms: 1}
planner:
  policy: enabled
  scaling_policy: {preset: false}
  enable_throughput_scaling: true
  enable_load_scaling: false
  throughput_adjustment_interval_seconds: 180
  load_adjustment_interval_seconds: 5
  fpm_sampling: {preset: false}
  max_num_fpm_samples: 64
  fpm_sample_bucket_size: 16
  load_sensitivity: {preset: false}
  load_scaling_down_sensitivity: 80
  load_min_observations: 5
  load_predictor: {preset: false, type: arima}
  load_predictor_log1p: false
  prophet_window_size: 50
  kalman_q_level: 1.0
  kalman_q_trend: 0.1
  kalman_r: 10.0
  kalman_min_points: 5
  max_num_gpus: 2
  min_workers: 1
evaluation:
  sla: {ttft_ms: 10.0, itl_ms: 5.0}
optimization:
  target: goodput
  constraints: {max_candidate_gpus: 1}
optimizer: {algorithm: random, max_trials: 2, parallelism: 1, candidate_timeout_seconds: 30.0, seed: 24}
