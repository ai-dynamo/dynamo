traffic:
  source:
    type: synthetic
    input_tokens: 1024
    output_tokens: 1024
  load:
    type: constant_rate
    requests_per_second: 10
  stop:
    requests: 1
engine:
  mode: disaggregated
  model: model
  hardware: gb200
  backend: trtllm
  workers:
    prefill:
      parallelism:
        preset: default
    decode:
      parallelism:
        preset: default
optimization:
  target: goodput_per_gpu
  constraints:
    max_candidate_gpus: 36
optimizer:
  algorithm: bayesian
  max_trials: 1
  parallelism: 1
  candidate_timeout_seconds: 120
  seed: 42
evaluation:
  sla:
    ttft_ms: 2000
    itl_ms: 25
dgd:
  name: deepseek-r1-trtllm-8c2e7a9a
  output_file: deployment.yaml
  runtime_image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.0
  num_gpus_per_node: 4
