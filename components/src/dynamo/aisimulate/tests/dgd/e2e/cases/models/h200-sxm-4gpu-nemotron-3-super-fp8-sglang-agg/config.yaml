traffic:
  source:
    type: synthetic
    input_tokens: 1024
    output_tokens: 1024
  load:
    type: constant_rate
    requests_per_second: 10
  stop:
    requests: 1
engine:
  mode: aggregated
  model: model
  hardware: h200_sxm
  backend: sglang
  workers:
    aggregated:
      parallelism:
        preset: default
optimization:
  target: goodput_per_gpu
  constraints:
    max_candidate_gpus: 4
optimizer:
  algorithm: bayesian
  max_trials: 1
  parallelism: 1
  candidate_timeout_seconds: 120
  seed: 42
evaluation:
  sla:
    ttft_ms: 2000
    itl_ms: 25
dgd:
  name: nemotron-3-super-fp-c7b58abc
  output_file: deployment.yaml
  runtime_image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
  num_gpus_per_node: 8
