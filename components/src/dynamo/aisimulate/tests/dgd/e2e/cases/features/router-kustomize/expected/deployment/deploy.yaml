apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: cli-router
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
          command:
          - python3
          args:
          - -m
          - dynamo.frontend
          - --model-name
          - ../../../fixtures/tiny-model
          - --model-path
          - ../../../fixtures/tiny-model
          envFrom:
          - secretRef:
              name: hf-token-secret
          env:
          - name: DYN_ROUTER_MODE
            value: kv
          - name: DYN_ROUTER_KV_OVERLAP_SCORE_CREDIT
            value: '0.26365231782422516'
          - name: DYN_ROUTER_PREFILL_LOAD_SCALE
            value: '7.754405047894512'
          - name: DYN_ROUTER_TEMPERATURE
            value: '0.0'
          - name: DYN_ROUTER_PREFILL_LOAD_MODEL
            value: none
  - name: worker
    type: worker
    replicas: 2
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
          workingDir: /workspace/examples/backends/vllm
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --tensor-parallel-size
          - '1'
          - --pipeline-parallel-size
          - '1'
          - --data-parallel-size
          - '1'
          - --num-gpu-blocks-override
          - '256'
          - --max-num-seqs
          - '256'
          - --max-num-batched-tokens
          - '8192'
          - --cudagraph-capture-sizes
