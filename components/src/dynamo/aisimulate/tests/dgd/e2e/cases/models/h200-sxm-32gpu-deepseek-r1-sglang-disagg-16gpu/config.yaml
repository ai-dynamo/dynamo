traffic:
  source:
    type: synthetic
    input_tokens: 1024
    output_tokens: 1024
  load:
    type: constant_rate
    requests_per_second: 10
  stop:
    requests: 1
engine:
  mode: disaggregated
  model: model
  hardware: h200_sxm
  backend: sglang
  workers:
    prefill:
      parallelism:
        preset:
        - replicas: 1
          tensor: 16
          pipeline: 1
          attention_data: 1
          moe_tensor: 1
          moe_expert: 16
    decode:
      parallelism:
        preset:
        - replicas: 1
          tensor: 1
          pipeline: 1
          attention_data: 16
          moe_tensor: 1
          moe_expert: 16
  backend_version: previous
optimization:
  target: goodput_per_gpu
  constraints:
    max_candidate_gpus: 32
optimizer:
  algorithm: bayesian
  max_trials: 1
  parallelism: 1
  candidate_timeout_seconds: 120
  seed: 42
evaluation:
  sla:
    ttft_ms: 2000
    itl_ms: 25
dgd:
  name: deepseek-r1-sglang-f149428f
  output_file: deployment.yaml
  runtime_image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.0
  num_gpus_per_node: 8
