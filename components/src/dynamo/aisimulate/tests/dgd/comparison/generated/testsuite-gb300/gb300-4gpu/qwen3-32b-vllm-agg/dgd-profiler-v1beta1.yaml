apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-disagg-92a33978
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          command:
          - python3
          args:
          - -m
          - dynamo.frontend
          envFrom:
          - secretRef:
              name: hf-token-secret
  - name: decode
    type: decode
    replicas: 3
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --tensor-parallel-size
          - '1'
          - --pipeline-parallel-size
          - '1'
          - --data-parallel-size
          - '1'
          - --kv-cache-dtype
          - auto
          - --max-num-seqs
          - '512'
          - --max-num-batched-tokens
          - '512'
          - --disaggregation-mode
          - decode
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
          - --model
          - Qwen/Qwen3-32B
          - --served-model-name
          - Qwen/Qwen3-32B
          resources:
            limits:
              nvidia.com/gpu: '1'
            requests:
              ephemeral-storage: 2Gi
              nvidia.com/gpu: '1'
          envFrom:
          - secretRef:
              name: hf-token-secret
  - name: prefill
    type: prefill
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --tensor-parallel-size
          - '1'
          - --pipeline-parallel-size
          - '1'
          - --data-parallel-size
          - '1'
          - --kv-cache-dtype
          - auto
          - --max-num-seqs
          - '1'
          - --max-num-batched-tokens
          - '2524'
          - --disaggregation-mode
          - prefill
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
          - --model
          - Qwen/Qwen3-32B
          - --served-model-name
          - Qwen/Qwen3-32B
          resources:
            limits:
              nvidia.com/gpu: '1'
            requests:
              ephemeral-storage: 2Gi
              nvidia.com/gpu: '1'
          envFrom:
          - secretRef:
              name: hf-token-secret
