apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: vllm-agg-9a07dd18
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          command:
          - python3
          args:
          - -m
          - dynamo.frontend
          envFrom:
          - secretRef:
              name: hf-token-secret
  - name: VllmDecodeWorker
    type: worker
    replicas: 3
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          workingDir: /workspace/examples/backends/vllm
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --tensor-parallel-size
          - '2'
          - --pipeline-parallel-size
          - '1'
          - --data-parallel-size
          - '1'
          - --kv-cache-dtype
          - auto
          - --max-num-seqs
          - '512'
          - --max-num-batched-tokens
          - '3036'
          - --model
          - Qwen/Qwen3-32B
          - --served-model-name
          - Qwen/Qwen3-32B
          - --max-model-len
          - '3548'
          resources:
            limits:
              nvidia.com/gpu: '2'
            requests:
              ephemeral-storage: 2Gi
              nvidia.com/gpu: '2'
          envFrom:
          - secretRef:
              name: hf-token-secret
