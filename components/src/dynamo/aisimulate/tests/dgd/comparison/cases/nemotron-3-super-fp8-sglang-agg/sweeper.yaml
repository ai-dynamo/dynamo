search_space:
  model_name: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
  deployment_mode: [agg]
  backend: [sglang]
workload:
  isl: 1024
  osl: 1024
  request_rate: 10
  num_request_ratio: 10
goal:
  target: goodput_per_gpu
  sla:
    ttft_ms: 2000
    itl_ms: 25
sweep:
  max_rounds: 1
  candidates_per_round: 2
  parallel_evals: 1
  max_eval_seconds: 120
